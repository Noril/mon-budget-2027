name: Ingestion hebdomadaire

permissions:
  contents: read

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  ingerer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/brut
            data/normalise
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-
      # Un contrôle en échec fait échouer le job : GitHub notifie les mainteneurs
      - run: uv run python -m pipelines.ingest
      # Sauvegardé même en cas d'échec : chaque source réussie garde sa version pour les exécutions suivantes
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/brut
            data/normalise
          key: donnees-${{ github.run_id }}
      - run: uv run python -m pipelines.indicateurs
      # Les données brutes et calculées restent des artefacts de CI (90 jours) ; elles se rejouent depuis le catalogue
      - uses: actions/upload-artifact@v7
        with:
          name: donnees
          path: data/
