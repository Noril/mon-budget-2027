name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Schémas, catalogue, indicateurs et chiffrage
        run: uv run python -m outils.valider
      - run: uv run pytest -q

  chaine:
    # Toute la chaîne : ingestion, contrôles, indicateurs, recalcul, trajectoire, chiffrage
    runs-on: ubuntu-latest
    needs: valider
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      # Dernières données brutes et normalisées : une source injoignable depuis GitHub garde sa dernière version
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/brut
            data/normalise
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-
      - name: Ingestion de toutes les sources actives
        run: uv run python -m pipelines.ingest
      # Sauvegardé même en cas d'échec : chaque source réussie garde sa version pour les exécutions suivantes
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/brut
            data/normalise
          key: donnees-${{ github.run_id }}
      - run: uv run python -m pipelines.indicateurs
      - name: Recalcul indépendant de tous les indicateurs (autre modèle, sans voir le SQL)
        run: uv run python -m outils.recalcul --tous
      - name: Trajectoire de référence
        run: uv run python -m plan.trajectoire
      - name: Tableau de bord global
        run: uv run python -m outils.tableau_de_bord
      - name: Chiffrage des programmes
        run: uv run python -m outils.chiffrage
      - name: Simulateur
        run: uv run python -m outils.simulateur
      - name: Jeu de cartes
        run: uv run python -m outils.jeu
      - uses: actions/upload-artifact@v4
        with:
          name: chiffrage-et-lignage
          path: |
            build/tableau-de-bord.md
            build/chiffrage.html
            build/chiffrage.md
            build/simulateur.html
            build/jeu.html
            data/indicateurs/*.lignage.json
            data/brut/**/manifeste.json
