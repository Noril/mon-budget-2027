name: Déploiement du site

on:
  push:
    branches: [main]
  # Lancement manuel : sur une autre branche que main, déploiement d'aperçu (URL Vercel de test, sans toucher au domaine) ;
  # la fonction de statistiques n'y enregistre rien (VERCEL_ENV = preview).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      # Dernières données valides : une source injoignable garde sa dernière version, le site n'est jamais publié vide
      - uses: actions/cache/restore@v6
        with:
          path: |
            data/brut
            data/normalise
          key: donnees-${{ github.run_id }}
          restore-keys: donnees-
      - run: uv run python -m outils.valider
      - run: uv run pytest -q
      - run: uv run python -m pipelines.ingest
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            data/brut
            data/normalise
          key: donnees-${{ github.run_id }}
      - run: uv run python -m pipelines.indicateurs
      - run: uv run python -m outils.recalcul --tous
      - run: uv run python -m plan.trajectoire
      - run: uv run python -m outils.tableau_de_bord
      - run: uv run python -m outils.chiffrage
      - run: uv run python -m outils.simulateur
      - run: uv run python -m outils.jeu
      - run: uv run python -m outils.site
      # Le site est un dossier statique : seul le résultat est envoyé à Vercel
      - name: Déploiement Vercel
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Secrets Vercel absents (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID) : site construit, non déployé."
            exit 0
          fi
          # copie hors du dépôt git : sinon Vercel attribue le déploiement à l'auteur du commit et peut le bloquer
          cp -R build/site "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            npx --yes vercel@latest deploy "$RUNNER_TEMP/site" --prod --yes --token "$VERCEL_TOKEN"
          else
            url=$(npx --yes vercel@latest deploy "$RUNNER_TEMP/site" --yes --token "$VERCEL_TOKEN")
            echo "Aperçu : $url" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/site/
