  sens_probable: cout
  estimation_indicative:
    central: -4.9
    bas: -5.7
    haut: -0.8
    lecture: 'Écart des socles d''accise (ministère de la Transition écologique, « Guide 2026 sur la fiscalité des énergies
      ») : électricité, ménages et assimilés, « Dont socle inflaté 25,09 25,19 24,69 » €/MWh (dernier tarif : du 1er août 2026
      au 31 janvier 2027), puis −0,4 €/MWh au 1er février 2027 (LFI 2026, art. 71, même guide) : 24,29 ; gaz naturel combustible,
      socle 10,73 €/MWh (16,66 − brique ZNI 5,93, même guide). Lecture retenue (« Diminuer la fiscalité sur l''électricité
      en unifiant le socle ») : socle électrique abaissé au niveau du gaz, −13,56 €/MWh × 0,30 Md€ par €/MWh (barème accise_electricite_1_euro_mwh)
      = 4,1 Md€. TVA de l''abonnement : la Cour des comptes (NEB 2025, recettes fiscales) attribue « + 0,5 Md€ » en 2025 à
      « la fin du taux réduit sur les abonnements à l''électricité et au gaz », sur cinq mois (1er août 2025) ; convention
      : ≈ 0,8 Md€ en année pleine pour la seule électricité (0,5 à 1,2). Central −(4,1 + 0,8) = −4,9. Bas : haut du barème
      d''accise (0,33, TVA induite comprise) et 1,2 Md€ pour l''abonnement, −5,7. Haut (convention) : convergence à mi-chemin,
      la hausse du socle gaz compensant l''essentiel de la baisse électrique, et TVA de l''abonnement seule, −0,8. Les baisses
      d''accise de 2025 compensaient déjà la hausse de TVA de l''abonnement (même guide).'
    sources:
    - https://www.ecologie.gouv.fr/sites/default/files/documents/Guide%202026%20sur%20fiscalit%C3%A9%20des%20%C3%A9nergies%202026.pdf
    - https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
    - accise_electricite_1_euro_mwh
    - https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe-sources : l''écart entre socles (13,56 €/MWh) relu dans le guide 2026 de la fiscalité des énergies
      ; l''hypothèse précédente (« quelques €/MWh ») le sous-estimait. Central −1,5 → −4,9, bas −5,0 → −5,7, haut −0,3 → −0,8.
      Le sens de l''unification (baisse de l''électricité, hausse du gaz, ou les deux) reste ambigu : c''est ce que couvre
      la fourchette. Trace précédente : ordre de grandeur non sourcé.'
