      96,5 Md€. Part de la France : 15,86 % (PIB 2025, 2 991 / 18 856 Md€, même source). Financement entièrement par
      contributions nationales : 15,3 Md€. Central (convention) : moitié par contributions nationales, moitié par de
      nouvelles ressources propres ou l''emprunt commun que le programme évoque (−7,7) ; bas : tout par contributions et part
      française portée à 18 % (corrections et rabais financés par les autres États) (−17,4) ; haut : pas d''accord unanime
      (0).'
    sources:
    - psr_ue
    - https://ec.europa.eu/commission/presscorner/detail/fr/ip_25_1847
    - https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data/nama_10_gdp?geo=EU27_2020&geo=FR&unit=CP_MEUR&na_item=B1GQ&sinceTimePeriod=2023
    - https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe-sources : ordre de grandeur non sourcé (10 % de la contribution) remplacé par une trajectoire
      sourcée (proposition de CFP de la Commission, PIB Eurostat) : central −3,0 → −7,7, bas −12,0 → −17,4, haut 0 inchangé.
