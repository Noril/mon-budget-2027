- id: smic-2000-brut
  libelle: >-
    SMIC porté à 2 000 € brut par mois dès 2027, avec soutien aux TPE-PME et associations (baisse du taux réduit d'IS
    et de la taxe sur les salaires)
  domaine: travail
  citation:
    texte: >-
      Passer le salaire minimum à 2000€ brut par mois dès 2027. Soutenir les Très Petites et les Petites et Moyennes
      Entreprises (TPE et PME) ainsi que les associations par des dispositifs de soutien ciblés, stables et proportionnés
      comme un ajustement à la baisse du taux réduit de l'impôt sur les sociétés et de la taxe sur les salaires.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 13, mesure 1)
  precision: precise
  interpretation: >-
    Effets sur les APU : coût des allègements généraux (le point de sortie suit le SMIC), prime d'activité, masse salariale
    publique (agents au SMIC, contrats aidés), recettes de cotisations et d'IR supplémentaires ; plus le coût des baisses
    d'IS réduit et de taxe sur les salaires. Parlons-politique (13 juillet 2026) écrivait que « les écologistes ne promettent
    pas de hausse directe » : contredit par le texte du programme. L'écart est supposé constant ensuite (le Smic reste
    indexé dans les deux cas). Les dispositifs de soutien aux TPE-PME (taux réduit d'IS, taxe sur les salaires) ne sont
    pas quantifiés : non comptés.
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -6.08
    bas: -11.49
    haut: -2.09
    montee_en_charge:
      '2027': 0.5
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(smic_cible / (smic_actuel * (1 + inflation_2027)) - 1) * 100 * cout_1pct * facteur
    parametres:
      smic_cible:
        valeur: 2000
        unite: € brut mensuel
        source: >-
          https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      smic_actuel:
        valeur: 1867.02
        bareme: smic_brut_mensuel
        unite: € brut mensuel
        source: https://www.service-public.gouv.fr/particuliers/vosdroits/F2300
        note: Smic mensuel brut en vigueur au 29 septembre 2026
      inflation_2027:
        valeur: 0.0146
        bareme: deflateur_pib_2027
        unite: taux
        source: >-
          plan/hypotheses.yaml, déflateur du PIB 2027 (FMI WEO) https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
        note: revalorisation légale supposée du Smic au 1er janvier 2027
      cout_1pct:
        valeur: 0.9
        unite: Md€/an de moindre solde par point de % de hausse du Smic
        bareme: smic_1pct_cout_apu
      facteur:
        valeur: 1.2106
        unite: facteur
        bareme: facteur_pib_2025_2032
    explication: >-
      Hausse de 5,6 % par rapport au Smic revalorisé de l'inflation en 2027, × coût APU d'un point de Smic (barème
      smic_1pct_cout_apu, 0,9 Md€ : allègements au barème RGDU, masse salariale publique, prestations, nets des recettes
      induites), projeté en 2032 : 5,58 × 0,9 × 1,2106 = 6,08. Bas : sensibilité haute (1,7, effet barème RGDU entier) :
      11,49. Haut : sensibilité basse (0,31, DG Trésor 2017 avant la RGDU) : 2,09. Hausse inférieure à 10 % : pas de
      majoration (convention 7). Masse salariale publique : le relèvement du minimum de traitement au-delà de l'inflation
      n'est pas couvert par l'indexation du point (point-indice-fonctionnaires) : pas de double compte ; les +10 % des
      catégories B et C peuvent en absorber une partie (recouvrement ≤ 0,25 Md€ par point de Smic,
      soit ≤ 1,7 Md€ en 2032, non retranché).
  effets_retour: 'Effet sur l''emploi peu qualifié (négatif) et sur la consommation (positif) : non comptés.'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: "2026-09-29"
    commentaire: >-
      Citation vérifiée. Smic 1 867,02 € brut relu sur service-public.gouv.fr ; hausse de 5,6 % sur le Smic
      revalorisé de 1,46 % ; coût de 0,31 Md€ par point (DG Trésor 2017, 240 M€, euros 2025) avec
      fourchette 0,24-1,1. Le Smic légal dépasserait 2 000 € vers 2029-2030 avec l'inflation : la promesse
      est lue comme un relèvement de niveau ensuite indexé (écart constant), ce qui est écrit dans
      l'interprétation. Baisse du taux réduit d'IS et de la taxe sur les salaires non comptée.
      Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée.
      Recalé sur les barèmes sourcés du 29/09 : smic_1pct_cout_apu 0,31 → 0,9 Md€ par point (bornes 0,31-1,7) ;
      central −2,09 → −6,08 ; bas −7,43 → −11,49 ; haut −1,62 → −2,09.
- id: point-indice-fonctionnaires
  libelle: >-
    Point d'indice indexé sur l'inflation, +10 % pour les catégories C, B et A ayant perdu du pouvoir d'achat
  domaine: fonction-publique
  citation:
    texte: >-
      Améliorer les traitements des fonctionnaires par l'indexation du point d'indice des fonctionnaires sur l'inflation.
      Augmenter de 10 % la rémunération des catégories C et B et des catégories A qui ont perdu en pouvoir d'achat ces
      20 dernières années – en particulier les enseignant·es dont le salaire doit être revalorisé de 15 % dans le quinquennat
      et les chercheur·ses de 10 %.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 13, mesure 2)
  precision: partielle
  interpretation: 'Trois fonctions publiques. Enseignants (+15 %) et chercheurs (+10 %) traités dans des mesures dédiées,
    à ne pas compter deux fois. « Catégories A qui ont perdu en pouvoir d''achat » : périmètre flou (lecture basse
    : C et B seulement). Indexation du point sur l''inflation : à droit constant (REFERENCE.md), le point est gelé
    en référence, l''indexation coûte donc la masse indiciaire × l''inflation cumulée 2027-2032 (déflateur FMI, 11,03
    %), pour tous les agents, enseignants et chercheurs compris (leurs mesures dédiées ne portent que sur les hausses
    au-delà). Les +10 % des catégories B et C s''ajoutent sans double compte (effet croisé 10 % × indexation compté). La
    part des effectifs surestime la part de la masse salariale (catégorie C moins payée).'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -23.91
    bas: -27.5
    haut: -19.73
    montee_en_charge:
      '2027': 0.081
      '2028': 0.257
      '2029': 0.442
      '2030': 0.63
      '2031': 0.813
      '2032': 1.0
  calcul:
    formule: -(hausse_pct * point_1pct_2032 * part_b_c + indexation + hausse_pct / 100 * part_b_c * indexation) * (1 - retours)
    parametres:
      hausse_pct:
        valeur: 10
        unite: '%'
        source: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      point_1pct_2032:
        valeur: 1.86
        unite: Md€ courants 2032 par an pour 1 % de hausse, brut hors cotisations employeurs
        bareme: point_indice_1pct_2032
      indexation:
        valeur: 20.6
        unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
        bareme: indexation_point_indice_2027_2032
      retours:
        valeur: 0.28
        unite: part de la rémunération brute supplémentaire
        bareme: retour_prelevements_salaires_publics
      part_b_c:
        valeur: 0.61
        bareme: fp_part_categories_b_c
        unite: part des agents
        source: https://www.fonction-publique.gouv.fr/files/files/publications/vue-rapport-annuel/ra_2025_vue_emploi_caracteristiques_postes.pdf
        note: >-
          DGAFP, rapport annuel 2025 : « En 2023, la fonction publique est composée de 39 % d'agents de catégorie A, de 22
          % d'agents de catégorie B et de 39 % d'agents de catégorie C » (part d'effectifs, majorant de la part de masse
          salariale)
    explication: 'Convention commune (REFERENCE.md, point 2), sans projection par le PIB (point gelé à droit constant),
      montants bruts hors cotisations employeurs : (1) +10 % pour les catégories B et C (61 % des agents) : 10 × 1,86 Md€
      (point_indice_1pct_2032) × 0,61 = 11,3 Md€ ; (2) indexation du point sur l''inflation 2027-2032 (barème
      indexation_point_indice_2027_2032) : 20,6 Md€ ; (3) effet croisé (la hausse de 10 % s''applique à une masse indexée)
      : 0,10 × 0,61 × 20,6 = 1,3 Md€. Total brut 33,2 Md€, net des prélèvements en retour (× 0,72) : 23,9 Md€. Bas : haut
      des barèmes (1,93 ; 22,2, indexation sur les prix à la consommation), retour 0,25 et pensions induites (≈ 1 Md€) :
      −(35,3 × 0,75 + 1,0) = −27,5. Haut : bas des barèmes (1,80 ; 17,0), retour 0,32 : −29,0 × 0,68 = −19,7. Montée en
      charge : +10 % en cinq ans (0 / 0,2 / 0,4 / 0,6 / 0,8 / 1), indexation au profil imposé par le barème (0,13 / 0,30
      / 0,48 / 0,66 / 0,83 / 1), pondérées par leur poids brut.'
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : part B + C (61 %) relue verbatim dans le rapport annuel DGAFP 2025 ; barèmes point_indice_1pct_2032
      (FIPECO 2026 : « soit un total de 2,5 Md€ ») et indexation_point_indice_2027_2032 relus, arithmétique rejouée
      (−33,22). Deux biais de sens opposé, non tranchables faute de masse salariale publique par catégorie publiée
      : la part d'effectifs surestime la part de masse salariale de B et C (coût surestimé de 10 à 20 % sur le volet
      +10 %, 1,1 à 2,3 Md€ net) ; les catégories A « qui ont perdu en pouvoir d'achat » sont exclues (coût sous-estimé).
      Les deux sont dans la fourchette. Valeurs inchangées. Trace précédente (verificateur-sonnet, corrige) : Citation
      vérifiée. Indexation du point sur l'inflation coûtant 11,03 % × 2,5 Md€ (point gelé en
      référence, REFERENCE.md, à droit constant) : cohérent. Pas de double compte avec les enseignants +15
      % (hausse réelle hors inflation, additive) ni avec les chercheurs (non comptés). Réserve : la part de
      61 % pour les catégories B et C est une part d'effectifs (DGAFP) ; en masse salariale la catégorie A
      pèse davantage, donc la hausse de 10 % sur B et C coûte sans doute 10 à 20 % de moins (2 à 3 Md€), et
      le +10 % aux A « qui ont perdu » est écarté (lecture basse). Ces écarts sont dans la fourchette
      (-41,4 à -50,5). Recalé sur les conventions communes du 29/09 : barèmes point_indice_1pct_2032 et
      indexation_point_indice_2027_2032 (bruts hors cotisations employeurs, sans projection PIB), retour
      0,28 (aucun retour n'était déduit), effet croisé 10 % × indexation compté, pensions induites en bas,
      profil d'indexation imposé ; −44,73 → −33,22 (bas −50,49 → −37,77 ; haut −41,42 → −27,4).
      Recalé sur les barèmes sourcés du 29/09 : point_indice_1pct_2032 2,59 → 1,86 Md€ (bornes 1,80-1,93),
      indexation_point_indice_2027_2032 28,6 → 20,6 Md€ (bornes 17,0-22,2), effet croisé 0,10 × 0,61 × 20,6 ;
      central −33,22 → −23,91 ; bas −37,77 → −27,5 ; haut −27,4 → −19,73 (convention 12).
