annonce_candidat:
  cout_md: null
  financement_md: null
  texte: >-
    Le programme de juillet 2026 (557 mesures) ne comporte ni chiffrage global ni tableau de financement ; seuls quelques
    montants y figurent (Plan national d'adaptation doté de 7 Md€ par an d'ici 2032, loi VSS dotée de 3 Md€). Chiffres
    annoncés à part : réforme des droits de succession, « 10 milliards d'euros dès 2027 et 15 milliards d'euros les années
    suivantes » (Reporterre, 9 septembre 2026) ; rénovation du bâti scolaire à « 4 milliards d'euros par an, sur 10 ans
    », moitié État, moitié collectivités (dossier de rentrée, 31 août 2026). Référence la plus complète : le contre-budget
    2026 du parti (« plan de sortie de crise », 4 septembre 2025 : +28,5 Md€ de recettes, −16,6 Md€ de dépenses, hausses
    de dépenses dont 9,1 Md€ transition, 6,3 Md€ protection sociale, 6,2 Md€ défense, 6,1 Md€ services publics, 5,7 Md€
    contribution à l'UE, déficit à 3,7 % du PIB en 2030) et celui du groupe parlementaire (45 Md€ de recettes nouvelles,
    25 Md€ d'économies, 55 Md€ d'investissements, « trajectoire budgétaire, validée par les travaux de l'OFCE »).
  url: >-
    https://www.publicsenat.fr/actualites/politique/les-ecologistes-presentent-leur-plan-de-sortie-de-crise-et-preparent-la-cohabitation
notes: >-
  Phase 1 (collecte), 29 septembre 2026. Primaire de la gauche unitaire : lancée le 15 novembre 2025 par Marine Tondelier,
  Olivier Faure (PS), Lucie Castets, François Ruffin (Debout !) et Clémentine Autain (L'Après), annoncée pour le 11 octobre
  2026 (500 parrainages d'élus requis). Candidats déclarés : François Ruffin (Debout !, candidat depuis avril 2025, maintient
  sa candidature même sans primaire, confirmation franceinfo 26 janvier 2026) et Marine Tondelier (Les Écologistes) ;
  retirés : Clémentine Autain (11 juillet 2026), Benjamin Lucas-Lundy (7 juillet 2026), Lydie Massard (9 septembre 2026).
  Le 9 juillet 2026, les adhérents PS ont choisi (55,5 %) une primaire fermée du « pôle socialiste », organisée séparément,
  où Raphaël Glucksmann (Place publique) est candidat depuis le 23 août 2026 ; le PCF présente une candidature autonome
  ; Jean-Luc Mélenchon (LFI) est hors primaire ; Delphine Batho (Génération écologie) candidate hors primaire. Yannick
  Jadot a été suspendu à titre conservatoire des Écologistes (25-27 septembre 2026) pour son soutien à Glucksmann. Wikipédia
  (consulté le 29 septembre 2026) juge la primaire unitaire « de facto » abandonnée depuis juillet 2026 : tenue du scrutin
  du 11 octobre non confirmée à la date de collecte. Le programme chiffré ici est celui du parti (juillet 2026), pas
  une plateforme commune de primaire ; en cas d'accord à gauche, il pourrait être amendé. Le PDF du programme a été extrait
  en texte (artefacts d'extraction corrigés : « TV A » → « TVA », espaces parasites, coupures de mots). Le site lesecologistes.fr
  est protégé par Cloudflare à la date de collecte : le PDF est cité par son archive Wayback (16 juillet 2026), identique
  à la version téléchargée. Recherche web interrompue (quota) : pas de chiffrage tiers du programme de juillet 2026 trouvé
  hors IFRAP (synthèse sans montants).
mesures:
- id: taxe-zucman
  libelle: Impôt plancher de 2 % sur les patrimoines de plus de 100 M€ (taxe Zucman), extension de l'exit tax
  domaine: fiscalite
  citation:
    texte: >-
      Rétablir la fiscalité sur la grande fortune. Mettre en place une taxe Zucman de 2 % au-delà de 100 millions d'euros
      de patrimoine. Étendre les conditions de l'exit tax afin de maintenir une contribution fiscale des émigrés fiscaux
      établissant leur domicile fiscal hors de France.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 1)
  precision: precise
  interpretation: >-
    Recette à partir de 2028 (impôt assis sur le patrimoine au 1er janvier). Recouvrement partiel avec l'ISF climatique
    et la taxe sur les holdings de la LFI 2026 si elle a été votée (à vérifier) : non déduit.
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 6.3
    bas: 3.9
    haut: 24.2
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: rendement_statique * part_conservee * f25
    parametres:
      rendement_statique:
        valeur: 20
        bareme: taxe_zucman_rendement_statique
        unite: Md€/an (2025, statique)
      part_conservee:
        valeur: 0.26
        bareme: reponse_patrimoine_part_conservee
        unite: part de la recette mécanique perçue
      f25:
        valeur: 1.2106
        bareme: facteur_pib_2025_2032
        unite: facteur PIB nominal 2025→2032
    explication: >-
      Même impôt et même méthode que chez Mélenchon (taxe-zucman-2-pct) : recette statique (barème
      taxe_zucman_rendement_statique, 20 Md€ en 2025) × part conservée après les réactions des contribuables (barème
      reponse_patrimoine_part_conservee, 0,26, CAE), projetée en 2032 (× 1,2106) : 20 × 0,26 × 1,2106 = 6,3 Md€.
      Bas : bas du barème statique (15 Md€), mêmes réactions, non projeté : 15 × 0,26 = 3,9. Haut : recette statique
      sans réaction, projetée : 20 × 1,2106 = 24,2. La fourchette publique citée par le Sénat (≈ 5 Md€ après
      comportements, 20 Md€ selon l'initiateur) est comprise dans cet intervalle.
  chiffrages_tiers:
  - auteur: Groupe Écologiste et Social (Assemblée), d'après G. Zucman
    montant_md: 15
    url: https://ecologisteetsocial.fr/wp-content/uploads/2025/10/Synthese-PLF2026-2-1.pdf
    date: 2025-10-23
    commentaire: >-
      « 15 Milliards d'euros c'est ce que la taxe Zucman pourrait rapporter » ; Public Sénat cite 15 à 25 Md€ selon Zucman.
      Rendement contesté : 5 Md€ après effets comportementaux selon les économistes cités par le rapport du Sénat n° 760
      (2025-2026), 20 Md€ selon l'initiateur (même source).
  effets_retour: >-
    Exil fiscal, optimisation (holdings, démembrement), risque constitutionnel : intégrés seulement via la borne basse.
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : source Wikipédia remplacée par le rapport du Sénat n° 760 (2025-2026), qui donne les deux bornes
      (20 Md€ attendus par l'initiateur, ≈ 5 Md€ après comportements). Haut ramené de 25 à 20 Md€ (le 25 venait d'une
      citation de presse de G. Zucman) ; central 10 conservé, désormais justifié comme moyenne géométrique des bornes
      (convention). Recouvrement avec l'ISF climatique : l'impôt plancher s'impute sur l'ISF payé par les mêmes
      foyers ; non déduit ici, documenté sur la ligne isf-climatique. Trace précédente (verificateur-sonnet, ok) :
      citation vérifiée, fourchette 5-25.
      Harmonisation des paramètres (30/09/2026) : même impôt que Mélenchon (taxe-zucman-2-pct) : recette statique (barème taxe_zucman_rendement_statique, 20 Md€) × part conservée après réactions (reponse_patrimoine_part_conservee, 0,26, CAE) × facteur_pib_2025_2032, au lieu d'un central conventionnel de 10 Md€ ; central 10,0 → 6,3, bas 5,0 → 3,9 (15 × 0,26), haut 20,0 → 24,2 (20 × 1,2106, sans réaction).
- id: isf-climatique
  libelle: Rétablissement de l'ISF avec une composante climatique
  domaine: fiscalite
  citation:
    texte: >-
      Rétablir l'Impôt sur la Fortune (ISF) en lui ajoutant une composante climatique pour orienter le patrimoine vers
      des actifs verts.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 1)
  precision: vague
  interpretation: >-
    Barème et seuil non précisés ; articulation avec l'IFI et la taxe Zucman à préciser. Référence haute : rendement
    de l'ISF 2017 (environ 4 Md€ de plus que l'IFI). Lecture : ISF aux paramètres 2017 remplaçant l'IFI. Chevauchement
    avec la taxe Zucman sur les patrimoines de plus de 100 M€ (quelques pour cent de l'assiette ISF) non déduit.
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 3.1
    bas: 1.3
    haut: 5.1
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: gain_isf
    parametres:
      gain_isf:
        valeur: 3.1
        unite: Md€/an (2032)
        bareme: isf_retabli_gain_net
    explication: >-
      ISF 2017 rétabli, IFI supprimé, projeté en 2032 (barème). La composante climatique n'est pas paramétrée.
  confiance: moyenne
  verification:
    statut: conteste
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : barème isf_retabli_gain_net relu (France Stratégie 2021 : « 4,1 milliards d'ISF nets perçus
      en 2017 » ; Cour des comptes NEB 2025 : IFI 2,8 Md€). Le recouvrement avec la taxe Zucman reste indécidable
      sur sources publiques, mais il est borné à la baisse : l'ISF 2017 exonérait les biens professionnels, qui
      représentent « 30 % au seuil des 0,01 % et plus de 60 % pour les 0,001 % les plus fortunés » (CAE, note n° 69,
      p. 7, https://www.cae-eco.fr/staticfiles/pdf/cae-note069.pdf), et le plafonnement réduisait l'ISF des plus
      grandes fortunes ; l'ISF payé par les ≈ 1 800 foyers au-delà de 100 M€ (seule part imputable sur l'impôt
      plancher) est donc une petite fraction des 3,1 Md€. Deux lectures : sans recouvrement 3,1 + 10 = 13,1 Md€ pour
      les deux impôts ; avec recouvrement maximal (convention : 1 Md€, fraction la plus haute de l'ISF que ces foyers
      pourraient acquitter) 12,1 Md€. Valeurs inchangées. Trace précédente (verificateur-sonnet, conteste) : Citation
      vérifiée. Double compte à l'intérieur du programme, non quantifiable ici : l'impôt plancher
      de 2 % sur les patrimoines de plus de 100 M€ (taxe Zucman) s'impute sur les impôts déjà payés, dont
      l'ISF rétabli ; l'ISF 2017 (taux jusqu'à 1,5 %) sur ces mêmes contribuables est donc en partie compté
      deux fois. Le barème isf_retabli_gain_net (3,1 Md€ net d'IFI) n'est pas ventilé par tranche ; l'écart
      pourrait atteindre 1 à 2 Md€. Valeurs inchangées ; la composante climatique n'est pas paramétrée.
- id: successions-grands-heritages
  libelle: >-
    Deux tranches supplémentaires de droits de succession (+10 points au-delà de 4 M€, +10 points au-delà de 13 M€),
    Dutreil plafonné, fin de l'abattement assurance-vie et des avantages du démembrement
  domaine: fiscalite
  citation:
    texte: >-
      Simplifier et rendre progressif la fiscalité sur l'héritage. Mettre en place un barème de taxation progressif unique
      en ajoutant deux tranches pour les ménages faisant partie du 1 % le plus riche au-delà de 4 millions d'euros et
      le 0,1 % le plus riche au-delà de 13 millions d'euros. Supprimer l'abattement spécifique aux assurances-vies et
      la niche Copé sur la plus-value de cession des filiales. Plafonner l'abattement Dutreil à 50 % au-delà de 50 millions
      d'euros et en réformer l'assiette et la durée de conservation des titres.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 2)
  precision: partielle
  interpretation: >-
    Précisé le 26 août 2026 : « une contribution de 10% sur les héritages de plus de 4 millions d'euros, et de 10% supplémentaires
    sur ceux dépassant les 13 millions d'euros », Dutreil ramené à 50 % (franceinfo) ; Tondelier : « Cela permettrait
    de dégager 10 milliards d'euros dès 2027 et 15 milliards d'euros les années suivantes » (Reporterre). Programme et
    dossier divergent sur le Dutreil (50 % « au-delà de 50 millions » contre 50 % général) : retenir la version la plus
    récente (août 2026). La niche Copé est traitée avec la fiscalité des entreprises (mesure distincte). Pour comparaison,
    l'ensemble des DMTG rapporte 21,4 Md€ (barème dmtg_rendement) : 15 Md€ supplémentaires sur le 1 % des héritages les
    plus élevés paraissent très optimistes. Recette à partir des successions ouvertes après la loi (2028).
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 10.61
    bas: 3.82
    haut: 15.46
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: (pacte_dutreil * part_dutreil + demembrement + assurance_vie + surtaxe) * facteur
    parametres:
      demembrement:
        valeur: 2.0
        unite: Md€/an
        source: >-
          https://www.ccomptes.fr/sites/default/files/2025-11/20251201-Corriger-les-principales-distorsions-de-l-imposition-du-patrimoine.pdf
        note: >-
          Conseil des prélèvements obligatoires, « Corriger les principales distorsions de l'imposition du patrimoine »
          (décembre 2025), p. 186 : coût du démembrement de propriété immobilière « entre 2013 et 2020 en moyenne de 0,9
          à 3,2 Md€, en fonction des hypothèses contrefactuelles » (immobilier seul, le coût total « est certainement
          supérieur ») ; CAE, note n° 69 : « de l'ordre de 2 à 3 milliards d'euros ». Central 2,0 (convention : milieu
          de la fourchette du CPO), bas 0,9, haut 3,2.
      assurance_vie:
        valeur: 4.0
        unite: Md€/an
        source: https://www.cae-eco.fr/staticfiles/pdf/cae-note069.pdf
        note: >-
          CAE, note n° 69 « Repenser l'héritage » (décembre 2021), p. 7 : coût de l'assurance-vie, en se limitant aux
          bénéficiaires recevant au moins 152 500 €, « de l'ordre de 4 à 5 milliards d'euros » ; CPO (décembre 2025),
          p. 151 : « le coût statique du régime de l'assurance-vie est estimé à environ 5 Md€ en 2024 » (haut). Convention
          : central 4,0 (bas de la fourchette du CAE), bas 1,25 (réforme limitée aux gros contrats chiffrée par le CPO,
          même page : « rendement théorique à terme […] estimé à 1,25 Md€ »), faute de chiffrage public de la seule
          suppression de l'abattement de 152 500 €.
      surtaxe:
        valeur: 1.4
        unite: Md€/an
        source: >-
          https://www.ifrap.org/budget-et-fiscalite/droits-de-succession-44-milliards-dimpots-en-moins-ou-14-milliards-de-taxes-en-plus
        note: >-
          Convention (aucune distribution publique des héritages au-delà de 4 M€) : l'IFRAP (janvier 2022, d'après le CAE)
          chiffre à 2,8 Md€ la confiscation des héritages au-delà de 12 M€ (216 successions par an), soit ≈ 5 Md€ taxés
          à 45 % au-delà de 12 M€ ; loi de Pareto de coefficient 1,5 (queue des héritages) : ≈ 9 Md€ au-delà de 4 M€ et
          ≈ 4,8 Md€ au-delà de 13 M€. +10 points × 9 + 10 points × 4,8 ≈ 1,4 Md€ ; fourchette 1,0 à 2,5 (coefficient
          de Pareto 1,3 à 2).
      facteur:
        valeur: 1.2336
        unite: facteur
        bareme: facteur_pib_2024_2032
      pacte_dutreil:
        valeur: 3.6
        bareme: pacte_dutreil_cout
        unite: Md€/an (moyenne 2022-2024)
      part_dutreil:
        valeur: 0.3333
        source: https://www.ccomptes.fr/sites/default/files/2025-11/20251118-Pacte-Dutreil.pdf
        unite: part de la dépense fiscale récupérée
        note: "ramener l'exonération de 75 % à 50 % de l'actif rend imposable un tiers de l'assiette exonérée"
    explication: >-
      Somme des quatre volets chiffrés sur des sources publiques (euros 2023-2024), projetée en 2032 au PIB nominal :
      pacte Dutreil ramené à 50 %, soit un tiers du barème pacte_dutreil_cout (3,6 / 3 = 1,2 Md€), démembrement (2,0),
      assurance-vie (4,0) et deux tranches supplémentaires (1,4) : (1,2 + 2,0 + 4,0 + 1,4) × 1,2336 = 10,61 Md€.
      Bas = bornes basses (2,0 / 3 + 0,9 + 1,25 + 1,0 = 3,82) non projetées, figurant l'évitement (anticipation des
      donations, départs) ; haut = bornes hautes (5,5 / 3 + 3,2 + 5,0 + 2,5 = 12,53) projetées = 15,46. Le CAE (note n° 69, p. 11) trouve un ordre de grandeur comparable pour une réforme voisine
      (Dutreil à 50 %, assurance-vie au barème, taxation de l'usufruit, barème inchangé) : « les droits supplémentaires
      seraient de l'ordre de 9 milliards d'euros », quand les DMTG rapportaient 15 Md€ (21,4 Md€ en 2026, barème
      dmtg_rendement). L'annonce de la candidate (10 Md€ dès 2027, 15 Md€ ensuite) est donc dans la fourchette.
  chiffrages_tiers:
  - auteur: Les Écologistes (chiffrage du parti)
    montant_md: 15
    url: >-
      https://www.franceinfo.fr/politique/eelv/les-ecologistes-proposent-de-taxer-davantage-les-heritages-des-plus-fortunes-pour-financer-la-transition-ecologique_8164142.html
    date: 2026-08-26
    commentaire: >-
      « pourraient rapporter "15 milliards d'euros par an" » ; 10 Md€ en 2027 selon l'entretien Reporterre. Pas un chiffrage
      indépendant.
  effets_retour: >-
    Anticipation des transmissions, délocalisation, recours à l'assurance-vie (dont l'abattement est supprimé) : non
    comptés.
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : le central ne reprend plus l'annonce de la candidate mais une somme de volets sourcés (Cour des
      comptes pour le Dutreil, CPO et CAE pour le démembrement et l'assurance-vie, convention explicite pour les deux
      tranches supplémentaires) : 10,0 → 10,98 Md€, bas 1,5 → 4,25, haut 15 → 15,42. L'essentiel du rendement vient
      de la suppression des niches (Dutreil, démembrement, assurance-vie), pas des deux tranches (≈ 1,4 Md€) : le
      doute du vérificateur précédent (« 10 à 15 Md€ sur le seul 1 % supérieur ») tient pour les tranches, pas pour
      le paquet complet. Le volet assurance-vie (4 Md€) reste une convention ; si la suppression de l'abattement ne
      visait que les gros contrats, il tomberait à 1,25 Md€ (bas). Dossier de presse du 26 août 2026
      (dossierpresse-budget2027.pdf) non consultable (Cloudflare, pas d'archive) : détail du chiffrage du parti
      inconnu. Trace précédente (verificateur-sonnet, conteste) : central = annonce non vérifiée, bas 1,5 = seul
      Dutreil.
      Harmonisation des paramètres (30/09/2026) : volet Dutreil lu comme un tiers du barème pacte_dutreil_cout (3,6 Md€, moyenne 2022-2024, bas 2,0, haut 5,5) au lieu d'un tiers de la moyenne 2023-2024 ; central 10,98 → 10,61, bas 4,25 → 3,82, haut 15,42 → 15,46.
- id: impot-minimal-grandes-entreprises
  libelle: >-
    Impôt minimal sur les bénéfices des sociétés de plus de 1 Md€ de chiffre d'affaires au prorata de l'activité en France,
    modulation selon l'affectation des bénéfices
  domaine: fiscalite
  citation:
    texte: >-
      Augmenter la fiscalité sur les grandes entreprises. Adopter un impôt minimal sur les bénéfices des sociétés dont
      le chiffre d'affaires dépasse un milliard d'euros à proportion de l'activité réalisée en France. Moduler le taux
      d'imposition selon l'affectation des bénéfices afin d'encourager le réinvestissement productif de long terme et
      de dissuader le rachat d'actions.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 3)
  precision: vague
  interpretation: >-
    Taux non précisé ; proche de la « taxe sur les multinationales » (répartition des bénéfices mondiaux au prorata du
    chiffre d'affaires) débattue au PLF 2026. Inclure la réforme de la surtaxe d'IS et la suppression de la niche Copé.
  chiffrable: false
  raison_non_chiffrable: >-
    Taux et assiette de l'impôt minimal non précisés dans le programme ; modulation selon l'affectation des bénéfices
    non paramétrée. Trop vague pour être chiffré (règle 7).
  sens_probable: economie
  estimation_indicative:
    central: 2.7
    bas: 0.0
    haut: 7.3
    lecture: 'Convention (aucun chiffrage public trouvé d''un impôt minimal à la française au prorata de l''activité) : le
      rendement est exprimé en part de l''IS net de 2032 (60 Md€ en 2025, barème is_rendement_net, × 1,2106 = 72,6 Md€).
      Central : 3,7 % de l''IS (2,7 Md€), ordre de grandeur conservé de la version précédente (analogie avec l''impôt sur
      les multinationales de 2022, page Institut Montaigne inaccessible, 403) ; haut : 10 % de l''IS (7,3 Md€), si le taux
      minimal est nettement supérieur à 15 % ; bas : 0, parce que l''impôt minimum mondial à 15 % (pilier 2) s''applique
      déjà aux groupes de plus de 750 M€ de chiffre d''affaires depuis les exercices ouverts au 31 décembre 2023 (impots.gouv.fr)
      et qu''un impôt de niveau comparable n''ajouterait rien, ou que les conventions fiscales bloquent l''assiette au prorata.'
    sources:
    - is_rendement_net
    - facteur_pib_2025_2032
    - https://www.impots.gouv.fr/impot-complementaire-impot-minimum-mondial-15-regles-globe-pilier-2
    - https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe-sources : la référence Institut Montaigne (403) est retirée ; aucune source publique ne chiffre
      cette mesure. L''estimation est réécrite comme convention en part de l''IS (barème), avec le pilier 2 comme borne
      basse. Central inchangé (2,7), haut 10,0 → 7,3 (10 % de l''IS 2032). Trace précédente : ordre de grandeur non revérifié.'
- id: taxe-services-numeriques-5pct
