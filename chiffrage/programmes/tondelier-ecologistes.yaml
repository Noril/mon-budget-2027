      un coût total pour les finances publiques de 22,5 milliards d''euros, dont 3,6 milliards d''euros de perte de rendement
      de TSA » (base Ines-Omar 2017). Central : (22,5 − 1,4 de franchises et participations, déjà chiffrées dans sante-remboursement-100pct-franchises)
