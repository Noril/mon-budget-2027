    date: 2026-07
    support: programme (chap. 65, mesure 7)
  precision: partielle
  interpretation: >-
    APD environ 0,4 % du RNB en 2026 ; « trajectoire » : cible 2032 non datée (lecture haute 0,7 % en 2032, basse 0,55
    %). Une partie de l'APD au sens du CAD (prêts, frais d'accueil des réfugiés) ne pèse pas sur le solde primaire :
    coût surestimé.
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -10.32
    bas: -11.79
    haut: -4.79
    montee_en_charge:
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1.0
  calcul:
    formule: -(cible - niveau) / 100 * rnb_2032
    parametres:
      cible:
        valeur: 0.7
        unite: '% du RNB'
        source: >-
          https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      niveau:
        valeur: 0.42
        unite: '% du RNB'
        bareme: apd_part_rnb
        note: >-
          niveau 2025 (données préliminaires) ; la prévision de 0,45 % pour 2025 (Sénat,
          https://www.senat.fr/rap/l24-144-34/l24-144-340.html) n'a pas été atteinte ; bas : 0,38 % en 2026, bas du barème
          (projection de Focus 2030 après la LFI 2026, non officielle)
      rnb_2032:
        valeur: 3685
        unite: Md€ courants
        bareme: rnb_nominal_2032
    explication: >-
      Convention commune n° 10 : retour à 0,7 % du RNB en 2032 depuis le niveau de référence (barème apd_part_rnb, 0,42 %),
      appliqué au RNB 2032 (barème rnb_nominal_2032). C'est un majorant : l'APD au sens du CAD comprend des prêts, des annulations
      de dette et des frais d'accueil qui ne sont pas des dépenses budgétaires. Bas : depuis 0,38 % (bas du barème, projection
      2026 non officielle de Focus 2030) : −0,32 % × 3 685. Haut : 0,55 %, cible de la loi de programmation du 4 août 2021 : −0,13 %
      × 3 685.
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: "2026-09-29"
    commentaire: >-
      Citation vérifiée. Central = bas = cas d'un retour à 0,7 % du RNB en 2032 (0,25 point × 36,2 Md€ =
      9,05 Md€) ; haut 0,55 %. C'est la lecture haute du coût pour une « trajectoire » sans date, et l'APD
      au sens CAD inclut des prêts et l'accueil des réfugiés qui ne pèsent pas tous sur le solde ; le
      niveau de 2025 (0,45 %) est probablement supérieur au niveau voté pour 2026-2027 (coût sous-estimé de
      ce côté). Recalé sur les conventions communes du 29/09 : assiette RNB 2032 (barème rnb_nominal_2032,
      3 685 Md€) au lieu du PIB, niveau de départ harmonisé sur le barème apd_part_rnb (0,42 % au lieu de la
      prévision 0,45 %), bas depuis le niveau 2026 (0,38 %), chiffre présenté comme majorant ; −9,05 → −10,32
      (bas −9,05 → −11,79 ; haut −3,62 → −4,79).
