id: tondelier-ecologistes
candidat: Marine Tondelier
parti: Les Écologistes
statut_candidature: >-
  Candidate des Écologistes : candidature annoncée le 22 octobre 2025, désignée le 8 décembre 2025 (86 %) pour porter
  le parti dans une primaire de la gauche unitaire annoncée pour le 11 octobre 2026. Cette primaire est de facto compromise
  depuis juillet 2026 (le PS s'en retire le 9 juillet, Clémentine Autain se retire le 11 juillet). Au 29 septembre 2026,
  Tondelier maintient sa candidature et mène une « double campagne, pour l'écologie et pour l'union ». Elle est en retrait
  partiel de la campagne après la naissance de son fils (vers le 18 septembre 2026).
