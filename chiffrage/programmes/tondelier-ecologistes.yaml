- id: niches-brunes-fiscalite-environnementale
  libelle: >-
    Suppression des niches fiscales fossiles, taxe sur les superprofits pétrogaziers et du fret maritime, malus poids
    à 1 300 kg, taxe sur les bouteilles plastiques, fonds « France Verte 2040 »
  domaine: fiscalite
  citation:
    texte: >-
      Adopter une fiscalité environnementale cohérente. Créer un nouveau fonds d'investissement « France Verte 2040 ».
      Adopter une taxe exceptionnelle sur les superprofits de l'industrie pétrogazière et du commerce maritime. Diminuer
      les niches fiscales fossiles en transformant les taux réduits sur les produits fossiles en aides forfaitaires (biocarburants,
      kérosène sur les vols intérieurs…). […] Déclencher le malus poids à 1300kg pour les véhicules thermiques et 1600kg
      pour les véhicules électriques (hors familles nombreuses). […] Créer une taxe sur les bouteilles en plastique.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 5 ; voir aussi chap. 1, mesure 3)
  precision: partielle
  interpretation: >-
    Le groupe parlementaire évalue les subventions à la pollution à « 15 milliards d'euros par an » (PLF 2026). Les niches
    transformées en « aides forfaitaires » ne rapportent que la différence. Superprofits : taxe exceptionnelle, effet
    2032 incertain. Le fonds France Verte 2040 est une dépense non dotée.
  chiffrable: false
  raison_non_chiffrable: >-
    Liste ouverte : niches fossiles transformées en « aides forfaitaires » de montant inconnu, taxe exceptionnelle sur
    les superprofits (temporaire), malus poids et taxe sur les bouteilles sans barème, fonds « France Verte 2040 » sans
    dotation. Le chiffre de 15 Md€ de subventions à la pollution avancé par le groupe parlementaire est un stock, pas
    le rendement de la mesure.
  sens_probable: economie
  estimation_indicative:
    central: 1.5
    bas: 0.3
    haut: 4.5
    lecture: 'Assiette : taux réduits d''accise sur les produits fossiles recensés par le budget vert du PLF 2026 (rapport
      sur l''impact environnemental du budget de l''État, octobre 2025) : « tarifs réduits d''accise en faveur du transport
      routier de marchandises (1,2 Md€) », « tarif réduit des gazoles non routiers autres que celui utilisé pour les usages
      agricoles (0,5 Md€ […]) », « tarifs réduits pour les gaz naturels utilisés dans les installations grandes consommatrices
      d''énergie (0,6 Md€ en PLF 2026) » et, pour l''agriculture, remboursement « pour les gazoles, les fiouls lourds et les
      gaz de pétrole liquéfiés utilisés pour les travaux agricoles et forestiers représentant 1,7 Md€ », soit 4,0 Md€. Convention
      : la transformation en « aides forfaitaires » rend 30 % de ces niches (1,2 Md€), parce que la promesse maintient une
      aide ; malus au poids abaissé et taxe sur les bouteilles plastiques : 0,3 Md€ (convention). Central 1,5. Bas : 5 %
      des niches, aides forfaitaires presque équivalentes (0,3). Haut : suppression sans compensation (4,0) plus 0,5 pour
      le malus et les bouteilles. La taxe sur les superprofits est temporaire et le fonds France Verte 2040 non doté ;
      pas de double compte avec depenses-inutiles-fossiles (abattement des retraités seul).'
    sources:
    - https://www.assemblee-nationale.fr/dyn/dyn/contenu/visualisation/1089981/file/4-BV_PLF%202026%20VF2-1.pdf
    - https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe-sources : assiette des niches fossiles relue dans le budget vert du PLF 2026 (4,0 Md€ de taux réduits
      d''accise), qui remplace les renvois génériques aux barèmes ; la part rendue par la transformation en aides forfaitaires
      reste une convention. Central inchangé (1,5), bas inchangé (0,3), haut 4,0 → 4,5. Le chiffre de 15 Md€ du groupe parlementaire
      n''est pas utilisé. Trace précédente : ordre de grandeur non sourcé.'
