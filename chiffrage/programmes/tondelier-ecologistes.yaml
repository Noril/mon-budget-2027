- id: conges-parentalite-indemnisation
  libelle: Congés d'accueil à 100 % du salaire et congé de naissance à 80 % sur trois mois par parent
  domaine: famille
  citation:
    texte: Rendre obligatoire et aligner la durée du congé d'accueil de l'enfant entre la mère et le second parent avec 16
      semaines rémunérées à 100 % du salaire mensuel de base. Relever l'indemnisation du congé supplémentaire de naissance
      à 80 % du revenu et l'étendre à trois mois par parents.
    url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 34, mesure 4)
  precision: partielle
  interpretation: 'Volet non compté de conges-parentalite-egaux, qui ne chiffre que l''allongement du congé du second parent
    : indemnisation à 100 % du salaire au-delà du plafond des indemnités journalières, congé supplémentaire de naissance (LFSS
    2026) porté à 80 % du revenu et à trois mois par parent.'
  chiffrable: false
  raison_non_chiffrable: Taux de recours à un congé de naissance mieux indemnisé et plus long inconnus (le chiffrage officiel
    du congé de 2026 est lui-même « illustratif ») ; part des salaires au-delà du plafond des IJ non documentée.
  sens_probable: cout
  estimation_indicative:
    central: -0.6
    bas: -1.4
    haut: -0.3
    lecture: 'Base : PLFSS 2026, annexe 9, article 42 (congé supplémentaire de naissance de deux mois, 70 % puis 60 % du salaire
      net dans la limite du PASS) : « le coût de la mesure en année pleine serait de l''ordre de 0,3Md€ en année N (2027),
      0,4Md€ en N+1, 0,5Md€ en N+2 et 0,6Md€ en N+3 », avec des taux de recours en N+3 de 55 % puis 40 % pour les mères,
      20 % puis 10 % pour les pères. En mois-taux indemnisés, le droit 2026 vaut 0,55 × 0,7 + 0,40 × 0,6 + 0,20 × 0,7 + 0,10
      × 0,6 = 0,825. Promesse (trois mois à 80 %), convention de recours du 3e mois égal à celui du 2e : (0,55 + 0,40 + 0,40
      + 0,20 + 0,10 + 0,10) × 0,8 = 1,40, soit 0,6 × (1,40 / 0,825 − 1) = 0,42 Md€ de plus. Bas (convention : recours du
      1er mois tenu trois mois, pères à 40 % comme incités par une meilleure indemnisation) : (0,55 × 3 + 0,40 × 3) × 0,8 = 2,28,
      soit +1,06 Md€. Plus l''indemnisation à 100 % au-delà du plafond des IJ (convention : 0,2 Md€, fourchette 0,1-0,3, aucune
      donnée publique sur les salaires au-dessus du PASS parmi les parents). Montants de 2030 non projetés.'
    sources:
    - https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe09-GenerationXBOOK_avec%20couverture.pdf
    - https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe-sources : coût et taux de recours du congé de naissance relus dans l''annexe 9 du PLFSS 2026 (0,6 Md€
      en N+3). L''hypothèse précédente (un parent sur deux, trois mois à 80 % d''un salaire de 2 500 €, 1,8 Md€ de plus)
      surestimait le recours (25 % des mères, moins de 5 % des pères à la PREPARE selon la même annexe) : central −2,0 →
      −0,6, bas −4,0 → −1,4, haut −0,8 → −0,3. Trace précédente (recalage-couverture, corrige) : volet séparé de conges-parentalite-egaux
      ; non compté dans le solde principal.'
