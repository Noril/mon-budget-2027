- id: assurance-chomage-abrogation-reformes
  libelle: >-
    Abrogation des réformes de l'assurance chômage depuis 2017 (dont calcul du SJR), allocations indexées sur l'inflation
  domaine: travail
  citation:
    texte: >-
      Refonder l'assurance chômage pour donner les moyens de trouver un emploi ou de se réorienter. Abroger les réformes
      régressives adoptées lors des deux derniers quinquennats notamment celle sur le calcul de l'Allocation de Retour
      à l'Emploi. Indexer le montant des allocations sur l'inflation.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 14, mesure 7)
  precision: partielle
  interpretation: 'Coût = économies Unédic des réformes abrogées. Recettes compensatoires : bonus-malus renforcé sur
    les contrats courts (mesure 11). Les réformes 2019-2021 et de février 2023 (contracyclicité, −25 % de durée) sont
    comptées (chiffrages Unédic) ; la convention de 2024 et l''avenant de 2026 ne le sont pas, ce qui minore le coût. Indexation des allocations sur l''inflation : la revalorisation de l''ARE
    relève d''une délibération annuelle de l''Unédic, pas de la loi ; à droit constant (REFERENCE.md), elle est gelée
    en référence et l''indexation promise coûte les allocations × l''inflation cumulée 2027-2032. Bonus-malus renforcé
    non chiffré.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -11.86
    bas: -12.02
    haut: -7.75
    montee_en_charge:
      '2027': 0.085
      '2028': 0.374
      '2029': 0.666
      '2030': 0.78
      '2031': 0.889
      '2032': 1.0
  calcul:
    formule: -((economies_2019_2021 + reforme_2023)*facteur + allocations_2025*inflation_cumulee/100)
    parametres:
      economies_2019_2021:
        valeur: 2.2
        bareme: assurance_chomage_reforme_2019_2021_economie
        unite: Md€/an
        source: https://www.unedic.org/publications/evaluation-de-la-reforme-d-assurance-chomage-2019-2021
        note: conditions d'ouverture −0,8, calcul du SJR −1,0, dégressivité −0,5 Md€ par an (estimations ex ante Unédic)
      facteur:
        valeur: 1.157
        bareme: facteur_pib_2027_2032
        unite: facteur
        source: https://www.unedic.org/publications/evaluation-de-la-reforme-d-assurance-chomage-2019-2021
        note: économies des réformes (régime de croisière 2027) projetées en 2032
      reforme_2023:
        valeur: 4.5
        bareme: assurance_chomage_reforme_2023_economie
        unite: Md€/an (régime de croisière, 2027)
        source: >-
          https://www.unedic.org/storage/uploads/2023/07/19/Effets-de-ladaptation-des-rgles-dassurance-chmage--la-conjoncture---actualis_0_uid_64b7e3c56dd92.pdf
        note: >-
          Unédic, « Effets de l'adaptation des règles d'assurance chômage à la conjoncture » (actualisé le 17 avril 2023) :
          « En régime de croisière, à horizon 2027, les moindres dépenses d'allocation atteindraient 4,2 Md€ auxquelles
          s'ajoutent les moindres versements aux caisses de retraite complémentaire de 0,3 Md€ » ; ces 0,3 Md€ vont à
          d'autres administrations publiques (Agirc-Arrco) et sont neutres pour le solde.
      allocations_2025:
        valeur: 37.2
        unite: Md€ (2025)
        source: https://s3.eusc-de-east-1.amazonaws.eu/unedic-eks-prod-cms/2026/06/17/situation-financiere-assurance-chomage-a-horizon-2028-juin-2026_uid_6a32884bd3186.pdf
        note: allocations et aides versées en 2025 (dérivation du barème assurance_chomage_depenses)
      inflation_cumulee:
        valeur: 11.03
        unite: '% cumulés 2027-2032'
        bareme: inflation_cumulee_2027_2032
        note: 'REFERENCE.md, « Indexations : droit constant »'
    explication: >-
      Coût = économies Unédic des réformes abrogées, projetées de 2027 à 2032 (× 1,157, comme chez Glucksmann et
      Mélenchon) : réforme 2019-2021 (barème assurance_chomage_reforme_2019_2021_economie, 2,2 Md€/an) et réforme 2023
      de contracyclicité (barème assurance_chomage_reforme_2023_economie, 4,5 Md€/an en régime de croisière) ; plus
      l'indexation des allocations sur l'inflation à droit constant (37,2 Md€ × 11,03 % = 4,10 Md€) : (2,2 + 4,5) ×
      1,157 + 4,10 = 11,86. Bas : indexation appliquée aux allocations 2027 (38,7 Md€ × 11,03 % = 4,27) : 12,02. Haut :
      abrogation des réformes sans coût d'indexation (lecture « usage constant » : l'ARE est revalorisée chaque année
      de fait, comme le barème de l'IR) : 7,75. Convention 2024 (≈ 0,4 Md€ par an selon l'Unédic) et avenant de
      février 2026 non comptés, faute de chiffrage primaire relu.
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : la réforme de 2023 (durée −25 %), comprise dans les « réformes régressives adoptées lors des deux
      derniers quinquennats », n'était pas comptée ; l'Unédic la chiffre à 4,2 Md€ par an d'allocations en régime de
      croisière (document du 17 avril 2023, relu). −6,4 → −10,6 (bas −7,05 → −12,14 ; haut −1,0 → −6,5, la lecture « seul
      le calcul du SJR » étant écartée : le programme vise toutes les réformes, « notamment » celle du SJR). Trace
      précédente (verificateur-sonnet, corrige) : Citation vérifiée. Point examiné : traiter l'indexation des allocations sur l'inflation comme un
      coût. REFERENCE.md met à zéro l'indexation prévue par la loi (pensions, prestations du CSS) mais
      compte comme coût ce que la loi n'indexe pas (point d'indice). La revalorisation de l'ARE n'est pas
      dans la loi : l'Unédic (prévisions de juin 2026, encadré 2) la décrit comme « potentielle » et «
      soumise à la décision du Conseil d'administration ». Le traitement en coût (37,2 Md€ × 11,03 % = 4,1
      Md€) est donc cohérent avec la règle. Mais l'usage est une revalorisation annuelle de fait, ce qui
      plaide pour le traitement « usage constant » retenu pour l'IR (coût nul) : ce point de méthode est
      ouvert et pèse 4,1 des 6,4 Md€. Corrigé : haut -5,1 -> -1,0 Md€ pour porter cette lecture dans la
      fourchette ; central et bas inchangés. Le coût des réformes de 2023 et 2025 reste non compté
      (minorant).
      Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème inflation_cumulee_2027_2032 ; valeur inchangée.
      Harmonisation des paramètres (30/09/2026) : économies des réformes alignées sur les barèmes assurance_chomage_reforme_2019_2021_economie (2,3 → 2,2) et assurance_chomage_reforme_2023_economie (4,2 → 4,5), toutes deux projetées de 2027 à 2032 (facteur 1,0 → 1,157) comme chez Glucksmann et Mélenchon ; central −10,6 → −11,86 (6,7 × 1,157 + 37,2 × 11,03 %), bas −12,14 → −12,02 (indexation sur les allocations 2027, 38,7 Md€), haut −6,5 → −7,75 (réformes seules).
