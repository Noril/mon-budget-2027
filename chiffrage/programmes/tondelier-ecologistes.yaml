    - https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
- id: csg-progressive-plus-un-point
  libelle: >-
    CSG rendue progressive et relevée d'un point pour équilibrer l'assurance maladie ; hausse des taxes comportementales
    ; sous-indexation des plus hautes retraites
  domaine: sante
  citation:
    texte: >-
      Équilibrer le budget de la Sécurité Sociale. Supprimer le déficit de l'assurance-maladie sans pénaliser ni les
      soignant·es ni les malades en rendant progressive la Contribution Sociale Généralisée (CSG) et en l'augmentant
      d'un point pour assurer l'équilibre à moyen terme de la Caisse Nationale d'Assurance Maladie (CNAM). Développer
      la prévention en santé notamment en augmentant les taxes sur l'alcool, le tabac, le sucre et les produits transformés.
      Sous-indexer les plus hautes retraites. Renégocier le prix des médicaments les plus coûteux […]
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 9)
  precision: partielle
  interpretation: >-
    Un point de CSG « en moyenne » (la progressivité peut réduire le rendement). Taxes comportementales et sous-indexation
    non quantifiées : fourchettes. La progressivité est supposée neutre en moyenne. Hausse des taxes comportementales,
    sous-indexation des hautes retraites et renégociation des médicaments non chiffrées (non quantifiées).
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 18.24
    bas: 11.3
    haut: 18.68
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: csg_pt * facteur * (1 - retour_ir)
    parametres:
      csg_pt:
        valeur: 17.94
        unite: Md€ par point de taux
        bareme: csg_point
      facteur:
        valeur: 1.2106
        unite: facteur
        bareme: facteur_pib_2025_2032
      retour_ir:
        valeur: 0.16
        unite: part du rendement du point de CSG perdue en impôt sur le revenu
        bareme: retour_ir_csg_deductible
        note: >-
          ratio de 2018 (3,9 Md€ d'IR pour 22,5 Md€ de CSG déductible, tous revenus), ajusté pour le barème d'IR de 2020 :
          0,16 (0,14 à 0,185) ; une hausse de CSG déductible réduit l'IR d'autant
    explication: >-
      Un point de CSG toutes assiettes (17,94 Md€ en 2025, barème csg_point) projeté en 2032, net de la baisse d'IR induite
      par la part déductible (barème retour_ir_csg_deductible : 16 %, 14 à 18,5 %) : 17,94 × 1,2106 × 0,84 = 18,24. Bas :
      point sur les seuls revenus d'activité (barème csg_point_activite, 11,71 Md€ en 2026 × facteur_pib_2026_2032), si la
      progressivité exonère de fait les petits revenus de remplacement, retour de 18,5 % : 11,30. Haut : toutes assiettes,
      retour de 14 % : 18,68.
  effets_retour: 'Baisse du revenu disponible, effet sur la consommation : non compté.'
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : valeur de point relue dans le rapport CCSS de mai 2026 (p. 55, tableau des valeurs de point : «
      CSG totale 17 550 17 940 17 770 », M€ 2024, 2025, 2026 p ; « Activité 11 760 12 030 11 710 ») ; arithmétique
      rejouée (17,94 × 1,2106 × 0,88 = 19,11). Le retour d'IR de 12 % reste une convention commune (aucune source
      administrative). La progressivité est supposée neutre en moyenne : un barème progressif qui exonère le bas de
      l'échelle rapporte moins si le taux du haut n'est pas relevé d'autant, ce que couvre le bas (point d'activité
      seul). Le programme vise l'équilibre de la CNAM, pas un montant. Valeurs inchangées. Trace précédente
      (verificateur-sonnet, corrige) : Citation vérifiée. Point de CSG 17,94 Md€ relu dans le tableau CCSS 2026 (activité 12,03,
      remplacement 3,9, capital 1,91). Réserves : la déductibilité partielle de la CSG de l'IR n'est pas
      retranchée (-1 à -2 Md€) et les revenus de remplacement sont en partie exonérés ou à taux réduit,
      donc 3,9 Md€ par point est un majorant ; le bas (activité seule, 14,56) couvre ces deux réserves.
      Progressivité supposée neutre en moyenne. Recalé sur les conventions communes du 29/09 : retour d'IR de
      la CSG déductible retranché (12 %, fourchette 10-15 %), bas sur le point d'activité 2026 (11,71) projeté
      par facteur_pib_2026_2032 ; 21,72 → 19,11 (bas 14,56 → 11,79 ; haut 21,72 → 19,55). Recalé sur les barèmes
      sourcés du 29/09 : retour d'IR 0,12 (0,10-0,15) remplacé par le barème retour_ir_csg_deductible 0,16
      (0,14-0,185 ; hausse = recette, borne défavorable à 0,185) ; central 19,11 → 18,24 ; bas 11,79 → 11,3 ;
      haut 19,55 → 18,68.
