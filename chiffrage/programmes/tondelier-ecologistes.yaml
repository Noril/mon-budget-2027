- id: point-indice-fonctionnaires
  libelle: >-
    Point d'indice indexé sur l'inflation, +10 % pour les catégories C, B et A ayant perdu du pouvoir d'achat
  domaine: fonction-publique
  citation:
    texte: >-
      Améliorer les traitements des fonctionnaires par l'indexation du point d'indice des fonctionnaires sur l'inflation.
      Augmenter de 10 % la rémunération des catégories C et B et des catégories A qui ont perdu en pouvoir d'achat ces
      20 dernières années – en particulier les enseignant·es dont le salaire doit être revalorisé de 15 % dans le quinquennat
      et les chercheur·ses de 10 %.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 13, mesure 2)
  precision: partielle
  interpretation: 'Trois fonctions publiques. Enseignants (+15 %) et chercheurs (+10 %) traités dans des mesures dédiées,
    à ne pas compter deux fois. « Catégories A qui ont perdu en pouvoir d''achat » : périmètre flou (lecture basse
    : C et B seulement). Indexation du point sur l''inflation : à droit constant (REFERENCE.md), le point est gelé
    en référence, l''indexation coûte donc la masse indiciaire × l''inflation cumulée 2027-2032 (déflateur FMI, 11,03
    %), pour tous les agents, enseignants et chercheurs compris (leurs mesures dédiées ne portent que sur les hausses
    au-delà). Les +10 % des catégories B et C s''ajoutent sans double compte (effet croisé 10 % × 11 % négligé). La
    part des effectifs surestime la part de la masse salariale (catégorie C moins payée).'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -44.73
    bas: -50.49
    haut: -41.42
    montee_en_charge:
      '2027': 0.081
      '2028': 0.264
      '2029': 0.448
      '2030': 0.634
      '2031': 0.816
      '2032': 1.0
  calcul:
    formule: -(hausse_pct*point_1pct*facteur23*part_b_c + inflation_cumulee*100*point_1pct_2027)
    parametres:
      hausse_pct:
        valeur: 10
        unite: '%'
        source: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      point_1pct:
        valeur: 2.2
        unite: Md€ par an pour 1 % de hausse, toutes APU
        bareme: point_indice_1pct
      facteur23:
        valeur: 1.2777
        unite: facteur
        source: chiffrage/baremes.yaml, dérivation du barème point_indice_1pct (PIB 2032 / PIB 2023 = 3 621 / 2 834)
        note: PIB nominal 2023→2032
      part_b_c:
        valeur: 0.61
        unite: part des agents
        source: https://www.fonction-publique.gouv.fr/files/files/publications/vue-rapport-annuel/ra_2025_vue_emploi_caracteristiques_postes.pdf
        note: 39 % de catégorie A, 22 % de B, 39 % de C en 2023 (DGAFP)
      inflation_cumulee:
        valeur: 0.1103
        unite: inflation cumulée 2027-2032
        source: 'plan/hypotheses.yaml, déflateur du PIB FMI WEO avril 2026 (2027 : 1,460 ; 2028 : 1,862 ; 2029 : 1,863
          ; 2030 : 1,860 ; 2031 et 2032 : 1,757 %) ; produit des (1 + taux) − 1'
        note: 'REFERENCE.md, « Indexations : droit constant »'
      point_1pct_2027:
        valeur: 2.5
        bareme: point_indice_1pct
        note: 'borne haute du barème : coût d''un point en 2027 ; à point gelé, la masse indiciaire ne croît ensuite
          que par les effectifs et le GVT'
    explication: '(1) +10 % pour les catégories B et C (61 % des agents) : 10 × coût d''un point (2,2 Md€ en 2023,
      projeté en 2032) × 0,61 = 17,2 Md€. (2) Indexation du point sur l''inflation, à droit constant : 11,03 points
      × 2,5 Md€ (coût d''un point en 2027) = 27,6 Md€. Bas : indexation sur une masse projetée au PIB (2,2 × 1,2777
      × 11,03 = 31,0) et bas des +10 %. Haut : masse 2023 non projetée pour l''indexation (24,3). Montée : +10 % en
      cinq ans, indexation au rythme de l''inflation cumulée.'
  confiance: faible
  verification:
    statut: ok
    par: verificateur-sonnet
    date: "2026-09-29"
    commentaire: >-
      Citation vérifiée. Indexation du point sur l'inflation coûtant 11,03 % × 2,5 Md€ (point gelé en
      référence, REFERENCE.md, à droit constant) : cohérent. Pas de double compte avec les enseignants +15
      % (hausse réelle hors inflation, additive) ni avec les chercheurs (non comptés). Réserve : la part de
      61 % pour les catégories B et C est une part d'effectifs (DGAFP) ; en masse salariale la catégorie A
      pèse davantage, donc la hausse de 10 % sur B et C coûte sans doute 10 à 20 % de moins (2 à 3 Md€), et
      le +10 % aux A « qui ont perdu » est écarté (lecture basse). Ces écarts sont dans la fourchette
      (-41,4 à -50,5).
