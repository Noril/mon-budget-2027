annonce_candidat:
  cout_md: null
  financement_md: null
  texte: >-
    Le programme de juillet 2026 (557 mesures) ne comporte ni chiffrage global ni tableau de financement ; seuls
    quelques montants y figurent (Plan national d'adaptation doté de 7 Md€ par an d'ici 2032, loi VSS dotée de
    3 Md€). Chiffres annoncés à part : réforme des droits de succession, « 10 milliards d'euros dès 2027 et 15
    milliards d'euros les années suivantes » (Reporterre, 9 septembre 2026) ; rénovation du bâti scolaire à « 4
    milliards d'euros par an, sur 10 ans », moitié État, moitié collectivités (dossier de rentrée, 31 août 2026).
    Référence la plus complète : le contre-budget 2026 du parti (« plan de sortie de crise », 4 septembre 2025 :
    +28,5 Md€ de recettes, −16,6 Md€ de dépenses, hausses de dépenses dont 9,1 Md€ transition, 6,3 Md€ protection
    sociale, 6,2 Md€ défense, 6,1 Md€ services publics, 5,7 Md€ contribution à l'UE, déficit à 3,7 % du PIB en
    2030) et celui du groupe parlementaire (45 Md€ de recettes nouvelles, 25 Md€ d'économies, 55 Md€
    d'investissements, « trajectoire budgétaire, validée par les travaux de l'OFCE »).
  url: https://www.publicsenat.fr/actualites/politique/les-ecologistes-presentent-leur-plan-de-sortie-de-crise-et-preparent-la-cohabitation
notes: >-
  Phase 1 (collecte), 29 septembre 2026. Primaire de la gauche unitaire : lancée le 15 novembre 2025 par Marine
  Tondelier, Olivier Faure (PS), Lucie Castets, François Ruffin (Debout !) et Clémentine Autain (L'Après), annoncée
  pour le 11 octobre 2026 (500 parrainages d'élus requis). Candidats déclarés : François Ruffin (Debout !,
  candidat depuis avril 2025, maintient sa candidature même sans primaire, confirmation franceinfo 26 janvier 2026)
  et Marine Tondelier (Les Écologistes) ; retirés : Clémentine Autain (11 juillet 2026), Benjamin Lucas-Lundy (7
  juillet 2026), Lydie Massard (9 septembre 2026). Le 9 juillet 2026, les adhérents PS ont choisi (55,5 %) une
  primaire fermée du « pôle socialiste », organisée séparément, où Raphaël Glucksmann (Place publique) est candidat
  depuis le 23 août 2026 ; le PCF présente une candidature autonome ; Jean-Luc Mélenchon (LFI) est hors primaire ;
  Delphine Batho (Génération écologie) candidate hors primaire. Yannick Jadot a été suspendu à titre conservatoire
  des Écologistes (25-27 septembre 2026) pour son soutien à Glucksmann. Wikipédia (consulté le 29 septembre 2026)
  juge la primaire unitaire « de facto » abandonnée depuis juillet 2026 : tenue du scrutin du 11 octobre non
  confirmée à la date de collecte. Le programme chiffré ici est celui du parti (juillet 2026), pas une plateforme
  commune de primaire ; en cas d'accord à gauche, il pourrait être amendé. Le PDF du programme a été extrait en
  texte (artefacts d'extraction corrigés : « TV A » → « TVA », espaces parasites, coupures de mots). Le site
  lesecologistes.fr est protégé par Cloudflare à la date de collecte : le PDF est cité par son archive Wayback (16
  juillet 2026), identique à la version téléchargée. Recherche web interrompue (quota) : pas de chiffrage tiers du
  programme de juillet 2026 trouvé hors IFRAP (synthèse sans montants).
mesures:
  # --- Fiscalité (chapitre 17 « Refonder le pacte fiscal ») -----------------------------------------
  - id: taxe-zucman
    libelle: Impôt plancher de 2 % sur les patrimoines de plus de 100 M€ (taxe Zucman), extension de l'exit tax
    domaine: fiscalite
    citation:
      texte: >-
        Rétablir la fiscalité sur la grande fortune. Mettre en place une taxe Zucman de 2 % au-delà de 100 millions
        d'euros de patrimoine. Étendre les conditions de l'exit tax afin de maintenir une contribution fiscale des
        émigrés fiscaux établissant leur domicile fiscal hors de France.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 1)
    precision: precise
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    chiffrages_tiers:
      - auteur: Groupe Écologiste et Social (Assemblée), d'après G. Zucman
        montant_md: 15
        url: https://ecologisteetsocial.fr/wp-content/uploads/2025/10/Synthese-PLF2026-2-1.pdf
        date: 2025-10-23
        commentaire: >-
          « 15 Milliards d'euros c'est ce que la taxe Zucman pourrait rapporter » ; Public Sénat cite 15 à 25 Md€ selon Zucman. Rendement contesté (CAE, Banque de France, exil fiscal, constitutionnalité) : sources à rassembler en phase 2.
  - id: isf-climatique
    libelle: Rétablissement de l'ISF avec une composante climatique
    domaine: fiscalite
    citation:
      texte: >-
        Rétablir l'Impôt sur la Fortune (ISF) en lui ajoutant une composante climatique pour orienter le patrimoine
        vers des actifs verts.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 1)
    precision: vague
    interpretation: >-
      Barème et seuil non précisés ; articulation avec l'IFI et la taxe Zucman à préciser. Référence haute : rendement de l'ISF 2017 (environ 4 Md€ de plus que l'IFI).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: successions-grands-heritages
    libelle: Deux tranches supplémentaires de droits de succession (+10 points au-delà de 4 M€, +10 points au-delà de 13 M€), Dutreil plafonné, fin de l'abattement assurance-vie et des avantages du démembrement
    domaine: fiscalite
    citation:
      texte: >-
        Simplifier et rendre progressif la fiscalité sur l'héritage. Mettre en place un barème de taxation progressif
        unique en ajoutant deux tranches pour les ménages faisant partie du 1 % le plus riche au-delà de 4 millions
        d'euros et le 0,1 % le plus riche au-delà de 13 millions d'euros. Supprimer l'abattement spécifique aux
        assurances-vies et la niche Copé sur la plus-value de cession des filiales. Plafonner l'abattement Dutreil à
        50 % au-delà de 50 millions d'euros et en réformer l'assiette et la durée de conservation des titres.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 2)
    precision: partielle
    interpretation: >-
      Précisé le 26 août 2026 : « une contribution de 10% sur les héritages de plus de 4 millions d'euros, et de 10%
      supplémentaires sur ceux dépassant les 13 millions d'euros », Dutreil ramené à 50 % (franceinfo) ; Tondelier :
      « Cela permettrait de dégager 10 milliards d'euros dès 2027 et 15 milliards d'euros les années suivantes »
      (Reporterre). Programme et dossier divergent sur le Dutreil (50 % « au-delà de 50 millions » contre 50 %
      général) : retenir la version la plus récente (août 2026). La niche Copé est traitée avec la fiscalité des
      entreprises (mesure distincte).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    chiffrages_tiers:
      - auteur: Les Écologistes (chiffrage du parti)
        montant_md: 15
        url: https://www.franceinfo.fr/politique/eelv/les-ecologistes-proposent-de-taxer-davantage-les-heritages-des-plus-fortunes-pour-financer-la-transition-ecologique_8164142.html
        date: 2026-08-26
        commentaire: >-
          « pourraient rapporter "15 milliards d'euros par an" » ; 10 Md€ en 2027 selon l'entretien Reporterre. Pas un chiffrage indépendant.
  - id: impot-minimal-grandes-entreprises
    libelle: Impôt minimal sur les bénéfices des sociétés de plus de 1 Md€ de chiffre d'affaires au prorata de l'activité en France, modulation selon l'affectation des bénéfices
    domaine: fiscalite
    citation:
      texte: >-
        Augmenter la fiscalité sur les grandes entreprises. Adopter un impôt minimal sur les bénéfices des sociétés
        dont le chiffre d'affaires dépasse un milliard d'euros à proportion de l'activité réalisée en France. Moduler
        le taux d'imposition selon l'affectation des bénéfices afin d'encourager le réinvestissement productif de long
        terme et de dissuader le rachat d'actions.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 3)
    precision: vague
    interpretation: Taux non précisé ; proche de la « taxe sur les multinationales » (répartition des bénéfices mondiaux au prorata du chiffre d'affaires) débattue au PLF 2026. Inclure la réforme de la surtaxe d'IS et la suppression de la niche Copé.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: taxe-services-numeriques-5pct
    libelle: Taxe sur les services numériques portée de 3 à 5 %, seuil abaissé, extension au e-commerce et aux data centers
    domaine: fiscalite
    citation:
      texte: >-
        Relever la taxe sur les services numériques (TSN) de 3 à 5 % et abaisser le seuil d'assujettissement à 5
        milliards de chiffre d'affaire pour intégrer les plateformes de e-commerce et l'étendre aux entreprises qui
        gèrent des data centers.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 3)
    precision: partielle
    interpretation: Vérifier le taux en vigueur au 1er janvier 2027 (relèvement débattu en LF 2026).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: pfu-csg-capital-ttf
    libelle: PFU relevé de 3 points, CSG sur les revenus du capital +3 points, taxe sur les transactions financières portée à 0,7 %
    domaine: fiscalite
    citation:
      texte: >-
        Taxer plus fortement le capital que le travail. Augmenter la taxe sur les transactions financières à 0,7 %.
        Étendre son assiette à un plus grand nombre d'instruments spéculatifs. Abaisser le seuil de capitalisation.
        […] Augmenter le taux de CSG sur les revenus du capital de 3 points avec le maintien des exonérations pour les
        livrets A et Développement Durable. Augmenter la flat tax (Prélèvement Forfaitaire Unique) de 3 points.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 11)
    precision: precise
    interpretation: >-
      Ambigu : la hausse de 3 points de CSG capital est-elle incluse dans les 3 points de PFU (le PFU comprend
      les prélèvements sociaux) ? Le groupe parlementaire (PLF 2026) visait la part IR (12,8 % à 15,8 %). Lecture
      haute : deux hausses cumulées ; lecture basse : une seule. Vérifier la hausse de CSG capital déjà votée en LFSS
      2026 pour le référentiel. À découper en phase 2 (TTF, PFU, CSG).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: impot-revenu-reforme
    libelle: Baisse de l'IR sur les premières tranches, tranche à 60 % au-delà de 250 000 €, plafonnement global des niches par foyer
    domaine: fiscalite
    citation:
      texte: >-
        Réformer l'impôt sur le revenu pour préserver la qualité de vie des classes populaires et des classes
        moyennes. Diminuer l'impôt sur le revenu pour les plus tranches les plus basses. Créer une nouvelle tranche à
        60 % au-delà de 250 000€ annuels. Plafonner le montant total des niches fiscales par foyer. Défiscaliser les
        pensions alimentaires pour les personnes qui les reçoivent.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 12)
    precision: partielle
    interpretation: Tranche à 60 % chiffrable (par part ou par foyer ?) ; baisse des premières tranches non quantifiée (fourchette). Plafond de niches non précisé.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: csg-progressive-plus-un-point
    libelle: CSG rendue progressive et relevée d'un point pour équilibrer l'assurance maladie ; hausse des taxes comportementales ; sous-indexation des plus hautes retraites
    domaine: sante
    citation:
      texte: >-
        Équilibrer le budget de la Sécurité Sociale. Supprimer le déficit de l'assurance-maladie sans pénaliser ni
        les soignant·es ni les malades en rendant progressive la Contribution Sociale Généralisée (CSG) et en
        l'augmentant d'un point pour assurer l'équilibre à moyen terme de la Caisse Nationale d'Assurance Maladie
        (CNAM). Développer la prévention en santé notamment en augmentant les taxes sur l'alcool, le tabac, le sucre
        et les produits transformés. Sous-indexer les plus hautes retraites. Renégocier le prix des médicaments les
        plus coûteux […]
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 9)
    precision: partielle
    interpretation: >-
      Un point de CSG « en moyenne » (la progressivité peut réduire le rendement). Taxes comportementales et sous-indexation non quantifiées : fourchettes.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: exonerations-cotisations-rationalisation
    libelle: Suppression des allègements de cotisations au-delà de 1,6 SMIC et sur les heures supplémentaires, montants nominalisés et désindexés, conditionnalité salariale
    domaine: fiscalite
    citation:
      texte: >-
        Rationaliser les exonérations de cotisations sociales. Nominaliser et désindexer leur montant. Supprimer les
        exonérations de cotisations inutiles car supérieures à 1,6 smic ou concernant les heures supplémentaires.
        Conditionner les cotisations restantes à une augmentation de salaires pour celles et ceux gagnant moins de
        2000€ dans les deux
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 10 ; phrase tronquée dans le PDF)
    precision: partielle
    interpretation: >-
      Vérifier le référentiel 2027 (réforme des allègements généraux de la LFSS 2025-2026 : bandeaux maladie et
      famille jusqu'à 3,5 SMIC fusionnés ?). Heures supplémentaires : déduction forfaitaire patronale et réduction
      salariale. La désindexation est un gain qui croît avec l'inflation.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: tva-verte
    libelle: TVA différenciée selon l'impact environnemental et sanitaire (baisse sur première nécessité, bio, réparation, transports publics ; hausse sur luxe, ultra-transformés, vols domestiques…)
    domaine: fiscalite
    citation:
      texte: >-
        Adopter une TVA verte différenciée selon l'impact environnemental et sanitaire des produits. Diminuer les taux
        des biens de première nécessité et des produits respectant l'environnement (produits biologiques, réparation
        de l'électroménager, des cycles, des chaussures, des vêtements, transports publics… Augmenter les taux de TVA
        des produits de luxe ou nocifs pour la santé et l'environnement : produits ultra-transformés, restauration à
        emporter, hôtellerie de luxe, vols domestiques, rénovation non énergétique…
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 6)
    precision: vague
    interpretation: Taux non précisés ; lecture par défaut = réforme à peu près neutre, fourchette large.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: niches-brunes-fiscalite-environnementale
    libelle: Suppression des niches fiscales fossiles, taxe sur les superprofits pétrogaziers et du fret maritime, malus poids à 1 300 kg, taxe sur les bouteilles plastiques, fonds « France Verte 2040 »
    domaine: fiscalite
    citation:
      texte: >-
        Adopter une fiscalité environnementale cohérente. Créer un nouveau fonds d'investissement « France Verte 2040
        ». Adopter une taxe exceptionnelle sur les superprofits de l'industrie pétrogazière et du commerce maritime.
        Diminuer les niches fiscales fossiles en transformant les taux réduits sur les produits fossiles en aides
        forfaitaires (biocarburants, kérosène sur les vols intérieurs…). […] Déclencher le malus poids à 1300kg pour
        les véhicules thermiques et 1600kg pour les véhicules électriques (hors familles nombreuses). […] Créer une
        taxe sur les bouteilles en plastique.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
      support: programme (chap. 17, mesure 5 ; voir aussi chap. 1, mesure 3)
    precision: partielle
    interpretation: >-
      Le groupe parlementaire évalue les subventions à la pollution à « 15 milliards d'euros par an » (PLF 2026).
      Les niches transformées en « aides forfaitaires » ne rapportent que la différence. Superprofits : taxe
      exceptionnelle, effet 2032 incertain. Le fonds France Verte 2040 est une dépense non dotée.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: fiscalite-aerien
    libelle: Hausse de la taxe sur les billets d'avion et de la TVA sur les billets, interdiction des jets privés
    domaine: fiscalite
    citation:
      texte: >-
        Augmenter la fiscalité sur les billets d'avion (Taxe sur les Billets d'Avion ou TSBA et taux de TVA) pour
        compenser les exonérations fiscales sectorielles.
      url: https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
      date: 2026-07
