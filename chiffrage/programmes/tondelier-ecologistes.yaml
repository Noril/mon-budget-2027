- id: pfu-csg-capital-ttf
  libelle: >-
    PFU relevé de 3 points, CSG sur les revenus du capital +3 points, taxe sur les transactions financières portée à
    0,7 %
  domaine: fiscalite
  citation:
    texte: >-
      Taxer plus fortement le capital que le travail. Augmenter la taxe sur les transactions financières à 0,7 %. Étendre
      son assiette à un plus grand nombre d'instruments spéculatifs. Abaisser le seuil de capitalisation. […] Augmenter
      le taux de CSG sur les revenus du capital de 3 points avec le maintien des exonérations pour les livrets A et Développement
      Durable. Augmenter la flat tax (Prélèvement Forfaitaire Unique) de 3 points.
    url: >-
      https://web.archive.org/web/20260716153820/https://lesecologistes.fr/document/5ZhR2m5t2ZaGKqIdD1bJaD/vdef-programme-1.pdf
    date: 2026-07
    support: programme (chap. 17, mesure 11)
  precision: precise
  interpretation: >-
    Deux hausses cumulées : CSG sur les revenus du capital +3 points et part impôt sur le revenu du PFU +3 points (12,8 %
    → 15,8 %). Lecture tranchée par la synthèse PLF 2026 du groupe Écologiste et Social : « Hausse de 3 points de la flat
    tax (de 12,8% à 15,8%) ». Référentiel : la hausse de CSG sur le capital votée en LFSS 2026 est déjà dans la loi ; le
    point de CSG 2025 est pris avant cette hausse.
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 11.36
    bas: 7.37
    haut: 11.63
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: 3 * csg_capital * facteur + 3 * (ttf - ttf_03) * facteur + 3 * pfu_point * facteur
    parametres:
      csg_capital:
        valeur: 1.91
        bareme: csg_point_capital
        unite: Md€ par point
        source: chiffrage/baremes.yaml, dérivation du barème csg_point (sources du barème)
        note: >-
          valeur de point de CSG sur les revenus du capital 2025 (dérivation du barème csg_point : patrimoine 0,81 +
          placements 1,10)
      facteur:
        valeur: 1.2106
        unite: facteur
        bareme: facteur_pib_2025_2032
      ttf:
        valeur: 2.5
        unite: Md€/an (rendement de la TTF à 0,4 %)
        bareme: ttf_rendement
      ttf_03:
        valeur: 1.9
        unite: Md€/an (produit 2024 au taux de 0,3 %)
        bareme: ttf_rendement
        note: >-
          bas du barème ; 2,5 − 1,9 = 0,6 Md€, rendement marginal observé du dernier dixième (0,3 → 0,4 % en 2025), même
          lecture que la TTF de LFI (méthode commune)
      pfu_point:
        valeur: 0.6172
        bareme: pfu_point_ir
        unite: Md€ par point de la part IR du PFU (2025)
        source: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
        note: >-
          Cour des comptes, NEB 2025 Recettes fiscales, tableau n° 3 (p. 15) : « Prélèvement forfaitaire unique 7,5 7,9 »
          (Md€, 2024 et 2025) ; 7,9 / 12,8 points = 0,617 Md€ par point, rendement statique.
    explication: >-
      CSG sur les revenus du capital +3 points (1,91 Md€ par point en 2025, projeté en 2032), TTF de 0,4 % à 0,7 % (3
      dixièmes au rendement marginal observé du dernier relèvement, 2,5 − 1,9 = 0,6 Md€ par dixième selon le barème
      ttf_rendement, projeté : 2,18, même méthode que la TTF de LFI) et part IR du PFU de 12,8 % à 15,8 % (3 × 0,617
      Md€, projeté) : 6,94 + 2,18 + 2,24 = 11,36. Bas : rendements 2025 non projetés, TTF au bas du barème (1,9 Md€, soit 3 × 1,9 / 4 × 0,5 = 0,71) et moitié
      de la recette de PFU perdue par la baisse des distributions (convention, la réforme de 2018 ayant fortement accru
      les dividendes selon France Stratégie, barème pfu_passage_bareme) : 5,73 + 0,71 + 0,93 = 7,37. Haut : TTF statique
      au haut du barème (2,7 Md€ en année pleine à 0,4 %, 3 × 2,7 / 4 × 1,2106 = 2,45) : 6,94 + 2,45 + 2,24 = 11,63.
  effets_retour: Baisse des distributions de dividendes et des transactions (non comptée au-delà de la borne TTF).
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : contestation tranchée par la synthèse PLF 2026 du groupe parlementaire
      (https://ecologisteetsocial.fr/wp-content/uploads/2025/10/Synthese-PLF2026-2-1.pdf : « Hausse de 3 points de la
      flat tax (de 12,8% à 15,8%) ») : la hausse du PFU porte sur la part IR et s'ajoute à celle de la CSG. Rendement d'un
      point de PFU lu à la Cour des comptes (NEB 2025 : PFU 7,9 Md€ en 2025). 7,84 → 10,08 (bas 6,63 → 7,56 ; haut 8,81
      → 11,05). Trace précédente (verificateur-sonnet, conteste) : Citation vérifiée (PDF, extraits assemblés). Le programme liste séparément « augmenter le taux de CSG
      sur les revenus du capital de 3 points » et « augmenter la flat tax (PFU) de 3 points ». Le chiffrage
      lit la seconde comme incluse dans la première ; la lecture naturelle d'une liste de deux actions est
      cumulative (la hausse de PFU portant alors sur la part IR de 12,8 %), ce qui ajouterait environ 2 à 3
      Md€ (ordre de grandeur, aucun barème du rendement d'un point de PFU) et que le haut (8,81) ne couvre
      pas. Paramètres relus : CSG capital 1,91 Md€ par point (CCSS mai 2026) ; TTF 0,3 Md€ par dixième. La
      LFSS 2026 (CSG capital à 10,6 %) ne change pas le rendement du point additionnel. Valeurs inchangées.
      Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée.
      Recalé sur les barèmes sourcés du 29/09 : rendement TTF recopié (0,3 Md€ par dixième, « 2,5 − 2,2 ») relié au
      barème ttf_rendement (2,5 ; 1,9 à 2,7) avec une réaction des volumes de moitié au central et au bas ; central
      10,08 → 10,12 ; bas 7,56 → 7,37 ; haut 11,05 → 11,2. Le rendement du point de PFU (Cour des comptes) ne dépend
      pas du barème pfu_passage_bareme (inchangé). Harmonisation avec la TTF de LFI (même barème, même méthode) : rendement
      marginal observé 2,5 − 1,9 = 0,6 Md€ par dixième, projeté en 2032, au central (au lieu de la moitié du rendement
      statique non projetée) ; bas inchangé (moitié du statique sur le bas du barème) ; haut statique projeté. Central
      10,12 → 11,36 ; haut 11,2 → 11,63.
- id: impot-revenu-reforme
  libelle: >-
