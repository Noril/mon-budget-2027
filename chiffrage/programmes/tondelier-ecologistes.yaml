  calcul:
    formule: (hs_salariale + hs_patronale) * facteur26 + part_au_dela_1_6_smic * allegements * f25
    parametres:
      hs_salariale:
        valeur: 2.306
        bareme: hs_exoneration_cotisations_salariales
        unite: Md€/an
        source: >-
          chiffrage/baremes.yaml, dérivation du barème hs_exoneration_cout (exonération de cotisations salariales 2026)
      hs_patronale:
        valeur: 0.872
        bareme: hs_deduction_forfaitaire_patronale
        unite: Md€/an
        source: >-
          chiffrage/baremes.yaml, dérivation du barème hs_exoneration_cout (déduction forfaitaire patronale 2026)
      facteur26:
        valeur: 1.1842
        unite: facteur
        bareme: facteur_pib_2026_2032
        note: PIB nominal 2026→2032
      part_au_dela_1_6_smic:
        valeur: 0.172
        bareme: allegements_part_au_dela_1_6_smic
        unite: part du coût des allègements généraux (RGDU 2026) portée par les salaires supérieurs à 1,6 Smic
        source: https://www.strategie-plan.gouv.fr/files/files/Publications/2024/SMIC/FS-2025-SMIC-RAPPORT-2024-12f%C3%A9v25.pdf
        note: >-
          Groupe d'experts sur le Smic, rapport 2024, p. 80, graphique I.27 (DSS, données Urssaf, 2023) : coût des
          allègements par tranche de 0,1 Smic (réduction générale, taux réduit maladie de 6 points jusqu'à 2,5 Smic,
          taux réduit famille de 1,8 point jusqu'à 3,5 Smic ; par exemple 1,8 et 0,5 Md€ pour [1,6-1,7[, 0,8 et 0,2
          Md€ pour [2,4-2,5[). La masse salariale de chaque tranche s'en déduit (taux réduit maladie / 0,06, ou famille
          / 0,018 au-delà de 2,5 Smic) ; on lui applique le barème de la réduction générale dégressive unique de 2026
          (coefficient = 0,02 + 0,3821 × [(1/2) × (3 Smic / rémunération − 1)]^1,75 jusqu'à 3 Smic, service-public.fr,
          fiche F24542). Coût RGDU reconstitué : 73,3 Md€ sur les masses de 2023, dont 12,6 au-dessus de 1,6 Smic (part
          0,172) et 4,5 au-dessus de 2 Smic (part 0,061). Recoupement : 1,2 Md€ au-dessus de 2,5 Smic, contre « 1
          milliard d'euros pour une sortie du dispositif à 2,5 Smic » (Cour des comptes, RALFSS mai 2025, repris par le
          Sénat, rapport n° 901)
      allegements:
        valeur: 75.6
        unite: Md€/an (2025)
        bareme: allegements_generaux_cout
      f25:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
    explication: >-
      Suppression des exonérations de cotisations sur les heures supplémentaires (salariale et patronale, pas l'IR) et
      des allègements généraux sur les salaires supérieurs à 1,6 Smic. Méthode commune aux promesses de suppression
      des allègements au-dessus d'un seuil (même méthode pour LFI au-dessus de 2 Smic) : part du coût de la RGDU de
      2026 portée par les salaires au-dessus du seuil (0,172, reconstituée sur la distribution des allègements par
      tranche de Smic publiée par le Groupe d'experts sur le Smic), appliquée au coût des allègements généraux
      (barème allegements_generaux_cout, 75,6 Md€ en 2025, stable en 2026 après le gel du Smic de référence) et
      projetée en 2032 : (2,306 + 0,872) × 1,1842 + 0,172 × 75,6 × 1,2106 = 3,76 + 15,74 = 19,51. Lecture littérale
      (exonérations nulles au-dessus de 1,6 Smic, barème inchangé en dessous). Bas : coût bas des allègements (72,3)
      et moindre IS sur les allègements supprimés (retour de 20 % : 0,4 Md€ d'IS pour 2 Md€ d'allègements en moins
      en 2025, Sénat, rapport n° 901), 3,76 + 0,172 × 72,3 × 1,2106 × 0,8 = 15,81. Haut : coût haut des allègements
      (77,5) : 19,90. Le rapport Bozio-Wasmer (12,2 Md€, p. 203) n'est plus utilisé : il chiffre, sur le barème de
      2024, la suppression des bandeaux maladie et famille avec extension de la réduction générale jusqu'à 1,88 Smic,
      soit une réforme qui touche aussi les salaires inférieurs au seuil et un barème qui n'existe plus. Lecture non
      retenue : un barème lissé qui s'éteindrait à 1,6 Smic (comme la réduction générale d'avant 2024) rapporterait
      ≈ 35 Md€ sur les masses de 2023, mais réduirait aussi les exonérations sous 1,6 Smic, contraire à la promesse.
      La hausse du Smic promise par ailleurs (2 000 € brut) relève le seuil en euros et réduit un peu l'assiette : non
      déduit.
  effets_retour: >-
    Effet emploi faible au-delà de 1,6 Smic selon Bozio-Wasmer ; hausse du coût du travail, possible baisse d'IS : non
    comptés.
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: "2026-09-29"
    commentaire: >-
      Passe-sources : erreur de lecture corrigée. Les « 2,7 à 5,5 Md€ » du rapport Bozio-Wasmer (p. 11 et 29) sont un
      gain de masse salariale d'un scénario à budget constant, pas une économie budgétaire. Le même rapport chiffre la
      suppression des bandeaux au-delà de ≈ 1,9 Smic à 12,2 Md€ ex ante (p. 203) ; ramenée au coût 2026 des allègements
      (RGDU, PLFSS 2026 annexe 4) et projetée : 7,86 → 16,53 Md€ (bas 6,46 → 8,73 ; haut 9,26 → 18,21). Effet emploi
      (−61 870 ETP selon Bozio-Wasmer) non compté (règle 3). Trace précédente (verificateur-sonnet, ok) : Citation
      vérifiée. Barème hs_exoneration_cout relu (salariale 2,306 ; déduction patronale 0,872 Md€,
      PLFSS 2026 annexe 4). Le proxy Bozio-Wasmer (2,7 à 5,5 Md€ pour les taux réduits au-delà de 1,6 Smic)
      est ancien et antérieur à la RGDU de 2026 : incertitude à ce niveau, portée par la fourchette.
      Désindexation et conditionnalité non comptées (prudent).
      Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2026_2032 ; valeur inchangée.
      Recalé sur les barèmes sourcés du 29/09 : méthode commune aux suppressions d'allègements au-dessus d'un seuil
      (Tondelier 1,6 Smic, LFI 2 Smic). Le proxy Bozio-Wasmer (12,2 Md€, barème 2024, suppression des bandeaux et
      extension de la réduction générale à 1,88 Smic, relu p. 203) est remplacé par la part du coût de la RGDU de
      2026 portée par les salaires au-dessus de 1,6 Smic (0,172, graphique I.27 du Groupe d'experts Smic et barème
      RGDU de service-public.fr), appliquée au barème allegements_generaux_cout projeté ; moindre IS (20 %) dans le
      bas. Central 16,53 → 19,51, bas 8,73 → 15,81, haut 18,21 → 19,90.
