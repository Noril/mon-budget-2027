      Diminuer l'impôt sur le revenu pour les plus tranches les plus basses. Créer une nouvelle tranche à 60 % au-delà
      de 250 000€ annuels. Plafonner le montant total des niches fiscales par foyer. Défiscaliser les pensions alimentaires
      pour les personnes qui les reçoivent.
    url: >-
