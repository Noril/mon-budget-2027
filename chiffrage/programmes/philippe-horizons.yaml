    de 37 h, exonération totale des cotisations patronales, nouvelle, dans les entreprises qui signent un accord (incitées
    à le faire dès qu''elles pratiquent des heures supplémentaires structurelles). Effet statique sur les heures supplémentaires
    existantes ; les heures nouvelles n''existent pas dans la référence. Plafond de 7 500 € de défiscalisation : son sort
    n''est pas dit (non compté). Contributions (CSG, CRDS) supposées maintenues.'
