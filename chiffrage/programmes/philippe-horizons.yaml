annonce_candidat:
  cout_md: null
  financement_md: null
  texte: 'Pas de chiffrage global publié au 29 septembre 2026. Objectif affiché : « ramener le déficit de plus de 5 % à 2
    % du PIB en fin de quinquennat » ; « deal fiscal » présenté comme neutre (50 Md€ de baisse d''impôts de production contre
    50 Md€ d''aides en moins) ; hausse des salaires enseignants présentée comme financée par la baisse démographique « sans
    dégrader les finances publiques ».'
  url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
notes: 'Programme non publié en entier au 29 septembre 2026 : quatre pages « priorités » du site de campagne, discours du
  5 juillet, entretiens (Échos, Figaro, AFP, RTL). La réforme des retraites (âge, paramètres) est annoncée mais pas détaillée
  ; c''est la principale source d''incertitude. Les pages « priorités » ne sont pas datées. Le programme européen d''Horizons
  (2024) repris par certains agrégateurs n''est pas retenu. Phase 2 (29 septembre 2026) : chiffrage à droit constant (chiffrage/REFERENCE.md)
  avec les barèmes communs ; mesures non budgétaires préfixées NON_BUDGETAIRE. Le « deal fiscal » est chiffré en deux lignes
  : la baisse d''impôts de production (coût) et la baisse d''aides, enveloppe non détaillée (règle 6 : 0 en central). L''objectif
  de déficit à 2 % n''est pas une mesure.'
mesures:
- id: impots-production-moins-50md
  libelle: Baisser de 50 Md€ par an les impôts de production
  domaine: fiscalité des entreprises
  citation:
    texte: 'Conclure un pacte fiscal inédit avec les entreprises : 50 Md€ de baisses d''impôts de production contre 50 Md€
      d''aides publiques improductives en moins, le plus grand choc de compétitivité jamais réalisé.'
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: precise
  interpretation: 'Baisse de 50 Md€/an des impôts de production (foncier, chiffre d''affaires, valeur ajoutée : catégories décrites
    par Public Sénat, 6 nov. 2025, sans liste d''impôts ; la CVAE en fait partie par hypothèse), dès le premier PLF. Chiffrée séparément de la contrepartie (baisse des aides) pour rendre visible l''hypothèse
    de neutralité. Référence : la législation au 1er janvier 2027 prévoit déjà la fin de la CVAE (calendrier à vérifier) :
    ne compter que l''écart. Phase 2 : la contrepartie (aides-entreprises-moins-50md) est chiffrée à part selon la règle 6.'
  effets_retour: Le candidat attend un choc de compétitivité (investissement, emploi) ; non compté.
  chiffrable: true
  nature: baisse_recette
  effet_solde_primaire:
    central: -44.84
    bas: -60.53
    haut: -34.73
    montee_en_charge: &id001
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
    annuel:
      '2027': 0.0
      '2028': -43.15
      '2029': -44.46
      '2030': -42.4
      '2031': -43.6
      '2032': -44.84
  calcul:
    formule: -(baisse - cvae) * f * (1 - retour_is)
    parametres:
      baisse:
        valeur: 50
        unite: Md€/an (montant nominal annoncé en 2025)
        source: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
      cvae:
        valeur: 3.7
        unite: Md€/an (2025)
        bareme: cvae_restante
        note: CVAE citée par l'entourage parmi les impôts visés ; sa suppression en 2030 est déjà dans la référence
      f: &id002
        valeur: 1.2106
        unite: facteur 2025→2032
        source: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP.A
        note: facteur PIB nominal (FMI WEO avril 2026, plan/hypotheses.yaml), indiqué en tête de chiffrage/baremes.yaml
      retour_is:
        valeur: 0.2
        unite: part du coût brut revenant en IS
        source: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
        note: 'impôts de production déductibles du résultat : une baisse augmente l''IS (retour mécanique, même règle que
          le-pen-rn et retailleau-lr). Taux effectif moyen à l''IS de 24 à 27 % pour les entreprises bénéficiaires (CPO, cité
          par FIPECO) ; central 0,20 car une partie de l''assiette (taxe sur les salaires des activités non assujetties à la
          TVA, entreprises déficitaires ou à l''IR) ne rend pas d''IS, comme le RN (Institut Montaigne, 0,20)'
    explication: 'Baisse de 50 Md€ (euros 2025) des impôts de production dès le premier budget (LFI 2028), portée en euros
      2032 avec le PIB (une baisse de taux suit l''assiette), nette du surcroît d''IS (0,20). La CVAE, dont la suppression
      en 2030 est déjà votée, ne coûte rien en 2032 : si elle fait partie des 50 Md€ (central), le coût brut est de 46,3
      Md€ en euros 2025. Bas : CVAE hors des 50 Md€ et sans retour d''IS (50 Md€ pleins, 60,5 Md€ en 2032). Haut : montant
      figé en euros courants 2025, net de CVAE, retour d''IS de 0,25. Effets annuels : en 2028-2029 la CVAE existe encore
      dans la référence, la baisse porte sur 50 Md€ (× 1,0787 et × 1,1116, PIB nominal) ; à partir de 2030, 46,3 Md€ ×
      facteur PIB de l''année ; tous × 0,8. Vérification du 2026-09-29 : le retour d''IS, omis à la première rédaction, est
      ajouté par cohérence avec les autres programmes (règle 3, effet mécanique documenté).'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée dans la source (récupérée le 2026-09-29). Le montant (50 Md€) est bien celui de la source, mais la source ne liste pas les impôts (CVAE, C3S, CFE : pas cités). Correction : retour d'IS omis (impôts de production déductibles, règle 3, même traitement que RN et Retailleau) : central -56,05 → -44,84 (bas -60,53 sans retour, haut -34,73). Net de CVAE conservé (suppression 2030 déjà votée, CVAE 3,7 Md€ FIPECO). Effets annuels recalculés."
- id: aides-entreprises-moins-50md
  libelle: Supprimer 50 Md€ d'aides publiques « improductives » aux entreprises
  domaine: aides aux entreprises
  citation:
    texte: En parallèle, le maire du Havre veut réduire de 50 milliards d’euros le montant annuel des aides versées aux entreprises,
      des aides qu’il estime être « saupoudrées, complexes, incompréhensibles ».
    url: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
    date: '2025-11-06'
    support: presse (publication LinkedIn du candidat)
  precision: partielle
  interpretation: 'Aides visées non listées ; l''entourage exclut les allègements généraux de cotisations (« sans réduire les allègements
    généraux »), soit environ 80 Md€ sur ~150 Md€ d''aides (ministre Lombard, cité par le rapport du Sénat). Règle 6 révisée
    : économie ciblée sur un périmètre nommé (« aides aux entreprises » hors allègements généraux), chiffrée comme si elle
    était appliquée : central = montant annoncé, plafonné par le budget réel du périmètre (dépenses fiscales et dépenses budgétaires
    : 40 + 30 = 70 Md€ en 2025) ; bas = 0 (économie non réalisée) ; haut = central.'
  chiffrable: true
  nature: economie
  effet_solde_primaire:
    central: 60.53
    bas: 0.0
    haut: 60.53
    montee_en_charge: *id001
  calcul:
    formule: min(montant, plafond) * f
    parametres:
      montant:
        valeur: 50
        unite: Md€/an (euros 2025)
        source: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
        note: « réduire de 50 milliards d'euros le montant annuel des aides versées aux entreprises »
      plafond:
        valeur: 70
        unite: Md€/an (2025), aides aux entreprises hors allègements généraux
        source: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
        note: 'rapport de la commission d''enquête du Sénat sur les aides publiques aux grandes entreprises (2025) : « d''environ
          150 milliards d''euros » cette année (selon le ministre Lombard), « 40 milliards d''euros de dépenses fiscales, 30
          milliards d''euros de dépenses budgétaires, et surtout, les 80 milliards d''euros d''allègements généraux » : 150 −
          80 = 70 Md€ hors allègements généraux'
      f: *id002
    explication: 'Enveloppe ciblée sur un périmètre nommé (règle 6 révisée) : 50 Md€ annoncés, inférieurs au budget des aides hors
      allègements généraux (70 Md€ en 2025 selon le ministre, cité par le Sénat), donc non plafonnés ; portés en euros 2032
      avec le même facteur PIB que la baisse d''impôts de production (60,5 Md€), pour que le « deal » soit symétrique. Bas 0
      : économie non réalisée (aides non identifiées, confiance faible). Sensibilité au périmètre : le Sénat évalue à 211 Md€
      (2023) les aides « au sens large » (dont 41 Md€ de Bpifrance, prêts et garanties, 88 Md€ de dépenses fiscales, 75 Md€
      d''allègements, 7 Md€ de subventions) et à 108 Md€ « au sens strict » ; hors allègements généraux, le périmètre strict
      ne représente que 33 Md€ (26 Md€ de dépenses fiscales + 7 Md€ de subventions) : sur ce périmètre le plafond ramènerait
      le central à 40 Md€ en 2032. Retour d''IS sur la suppression d''aides non compté (aides pour partie non imposables).'
  confiance: faible
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée dans la source (récupérée le 2026-09-29). Règle 6 révisée : économie ciblée sur un périmètre nommé, donc central = 50 Md€ plafonnés par le budget des aides hors allègements généraux (70 Md€ en 2025 : 40 dépenses fiscales + 30 budgétaires, ministre Lombard, rapport du Sénat r24-808 ; le plafond ne joue pas), soit 60,53 Md€ en 2032 (même facteur PIB que la baisse d'impôts, pour la symétrie) ; bas 0, haut = central. Première rédaction : central 0. Sensibilité : au sens strict du Sénat, hors allègements, le périmètre ne fait que 33 Md€ (plafond à 40 Md€ en 2032). Confiance faible."
- id: deficit-2pct-2032
  libelle: Ramener le déficit public à 2 % du PIB en 2032 (enveloppe d'économies non détaillée)
  domaine: finances publiques
  citation:
    texte: Inscrire dans la Constitution une règle d’or de maîtrise des déficits, et ramener le déficit de plus de 5 % à 2
      % du PIB en fin de quinquennat, comme l'ont fait l'Allemagne ou les Pays-Bas.
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: partielle
  interpretation: 'Objectif de solde, pas une mesure : traité selon la règle 6 (enveloppe non détaillée). central = mesures
    identifiées ci-dessous, haut = effort implicite pour passer de ~5 % à 2 % du PIB, bas = 0. La règle d''or est une mesure
    institutionnelle (voir regle-or). Le candidat exclut les dépenses militaires de la règle (IFRAP).'
