- id: retraites-travailler-plus-longtemps
  libelle: 'Réforme des retraites : âge légal à 65 ans et 45 annuités en moins de dix ans, après la reprise de la réforme de 2023'
  domaine: retraites
  citation:
    texte: '"Pour retrouver l''équilibre de notre système par répartition, je propose de porter progressivement la durée
      de cotisation à quarante-cinq ans et l''âge de départ à 65 ans pour les Français qui le peuvent", explique-t-il. "On
      va reprendre la réforme de 2023 [qui avait été suspendue en 2025] qui plaçait l''âge légal de départ et la retraite à
      64 ans au lieu des 62 et 9 mois aujourd''hui et qui plaçait la durée de cotisation à quarante-trois ans au lieu de
      quarante-deux et demi aujourd''hui. Ensuite, on va poursuivre pour qu''en moins de dix ans, nous soyons passés à 65
      ans pour l''âge légal de départ, et quarante-cinq annuités", détaille le maire du Havre.'
    url: https://www.franceinfo.fr/elections/presidentielle/age-de-depart-a-65-ans-45-annuites-de-cotisation-edouard-philippe-candidat-horizons-a-la-presidentielle-devoile-son-projet-de-reforme-des-retraites_8214737.html
    date: '2026-09-29'
    support: presse (franceinfo avec AFP), transcription de la vidéo du candidat
  precision: partielle
  interpretation: 'Annonce du 29 septembre 2026 (vidéo YouTube https://www.youtube.com/watch?v=tZuZwWpT4ak, relayée par
    https://www.edouardphilippe.fr/actualites/retraites-la-reforme-que-je-propose-aux-francais ; la page du site ne reprend
    pas les chiffres et la vidéo n''a pas pu être transcrite ici : verbatim de l''AFP). Reprise de la réforme de 2023 (64
    ans, 43 ans de durée) : déjà dans la référence (reprise au 1er janvier 2028), coût nul. Au-delà : 65 ans et 45 annuités
    (180 trimestres) « en moins de dix ans » ; « un Français sur trois pourra partir avant 65 ans, entre 60 et 64 ans »
    (carrières longues, invalidité, handicap inchangés). Le calendrier du passage de 64 à 65 ans et de 43 à 45 ans n''est
    pas donné. Âge : à droit constant, 64 ans n''est atteint que par la génération 1969 (en 2033) ; la hausse au-delà ne
    joue donc pas en 2032. Durée : 43 ans sont atteints dès la génération 1965 ou 1966 (calendrier décalé par la suspension) ; si l''allongement suit immédiatement (1
    trimestre par génération : 8 trimestres en huit générations, soit « moins de dix ans »), les générations 1966-1968,
    qui partent vers 2029-2032, cotisent 1 à 3 trimestres de plus ; s''il ne commence qu''après 64 ans (« ensuite »), rien
    en 2032. Le candidat écarte la hausse des cotisations et une baisse générale des pensions (Planet, 29 sept. 2026).'
  chiffrable: true
  nature: economie
  effet_solde_primaire:
    central: 1.48
    bas: 0.0
    haut: 4.43
    montee_en_charge:
      '2027': 0
      '2028': 0
      '2029': 0.2
      '2030': 0.4
      '2031': 0.7
      '2032': 1
  calcul:
    formule: annees_duree * gain_duree + annees_age * gain_age
    parametres:
      annees_duree:
        valeur: 0.25
        unite: année de durée d'assurance requise en plus de la référence, en moyenne sur les départs de 2032
