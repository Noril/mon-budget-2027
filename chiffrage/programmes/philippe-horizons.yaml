      progressive. «Si on arrive à faire en sorte qu’elle représente 10% à 15% des pensions versées dans quinze ans, on aura
      rendu un fier service au financement de l’économie française. Mais cela n’évitera pas le fait de devoir travailler plus
      longtemps» ,
    url: https://www.lefigaro.fr/elections/presidentielles/presidentielle-2027-edouard-philippe-refute-promettre-aux-francais-du-sang-et-des-larmes-20260630
