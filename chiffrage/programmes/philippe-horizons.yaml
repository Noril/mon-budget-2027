    texte: Oui. Édouard Philippe veut alléger le poids des cotisations sur le travail. Les heures travaillées au-delà de 35
      heures seront exonérées d’impôt et de cotisations salariales, et les entreprises ne paieront plus de cotisation patronale
      au-delà de la 37e heure. Pour un salarié au SMIC qui travaille deux heures de plus par semaine, le gain sera de plus
      de 1 000 € par an.
