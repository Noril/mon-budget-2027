    identifiées ci-dessous, haut = effort implicite pour passer de ~5 % à 2 % du PIB, bas = 0. La règle d''or est une mesure
    institutionnelle (voir regle-or). Le candidat exclut les dépenses militaires de la règle (IFRAP).'
  chiffrable: false
  raison_non_chiffrable: A_CHIFFRER
- id: baisse-depenses-sociales-niches
  libelle: Baisser les dépenses sociales et supprimer des niches fiscales plutôt qu'augmenter les impôts
  domaine: finances publiques
  citation:
    texte: 'Et je vous le redis : il faut baisser les dépenses sociales, supprimer les niches fiscales, avant de songer à
      augmenter les impôts de ceux qui travaillent.'
