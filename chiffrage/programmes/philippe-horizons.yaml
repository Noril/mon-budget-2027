- id: retraites-travailler-plus-longtemps
  libelle: 'Réforme des retraites : travailler plus longtemps, âge légal relevé selon les métiers'
  domaine: retraites
  citation:
    texte: 'Garantir l''équilibre de notre système de retraites pour protéger les générations futures : travailler plus tout
      en prenant en compte la diversité des carrières, créer un pilier de capitalisation à 10-15 % des pensions d''ici quinze
      ans, confier la gestion du régime à l’équilibre aux partenaires sociaux.'
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: vague
  interpretation: 'Âge cible non annoncé au 29 sept. 2026 (le candidat refuse « tout chiffre totémique », Figaro 30 juin 2026
    ; LCP 23 sept. : paramètres « dans les prochains jours ou semaines »). Hypothèses pour la phase 2 : âge légal porté à
    65 (bas), 66 (central), 67 ans (haut), au rythme de 3 mois par génération, par rapport à la législation au 1er janvier
    2027 (réforme 2023 suspendue jusqu''en 2028). Référendum sur les retraites annoncé (IFRAP). Phase 2 : effet en 2032 limité
    par le calendrier de la référence ; l''effet de long terme d''un âge à 66-67 ans est bien supérieur (après 2034).'
  chiffrable: true
  nature: economie
  effet_solde_primaire:
    central: 3.3
    bas: 0.0
    haut: 7.9
    montee_en_charge:
      '2027': 0
      '2028': 0.1
      '2029': 0.3
      '2030': 0.5
      '2031': 0.75
      '2032': 1
  calcul:
    formule: annees * gain_par_an
    parametres:
      annees:
        valeur: 0.5
        unite: année d'âge effectif supplémentaire en 2032 par rapport à la référence
        source: https://solidarites.gouv.fr/loi-de-financement-de-la-securite-sociale-2026-les-mesures-phares
        note: 'hypothèse de lecture : la référence reprend en 2028 la montée vers 64 ans (génération 1969) ; un âge cible
          de 65-67 ans au rythme habituel (3 mois par génération) ne touche que les générations 1970 et suivantes, qui atteignent
          64 ans en 2034. Un effet en 2032 suppose une accélération du calendrier dès 2028 : 6 mois par génération au lieu
          de 3 donnent environ un demi-an d''âge supplémentaire en 2032 sur les générations 1966-1968.'
      gain_par_an:
        valeur: 6.6
        unite: Md€ 2032 par année d'âge
        bareme: retraites_age_legal_1_an
    explication: 'Gain d''une année d''âge légal (barème retraites_age_legal_1_an, 6,6 Md€ en 2032) × supplément d''âge effectif
      atteint en 2032. Bas : aucune accélération (le relèvement au-delà de 64 ans ne joue qu''après 2033) → 0 en 2032. Haut
      : un an d''âge effectif en plus, borne haute du barème (7,9).'
  effets_retour: 'Effet sur l''emploi des seniors et les recettes hors système de retraite (DG Trésor : 7,2 Md€ en 2035 pour
    un an d''âge) : non compté.'
  confiance: faible
  verification:
    statut: conteste
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée dans la source (récupérée le 2026-09-29). Âge cible inconnu (le candidat refuse tout chiffre). Le central 3,3 Md€ repose sur une accélération à 6 mois par génération dès 2028, qui ne figure dans aucune source et contredit l'interprétation écrite (3 mois par génération, âge 65/66/67, avec bas = 65) : à 3 mois par génération, un âge au-delà de 64 ans ne joue qu'après 2033 (générations 1970 et suivantes), donc effet 2032 proche de 0. Chiffre laissé en l'état, à ne lire que comme un ordre de grandeur (fourchette 0 à 7,9). Barème retraites_age_legal_1_an : 2035 converti en 2032 (voir notes du vérificateur)."
