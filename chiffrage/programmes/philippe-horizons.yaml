annonce_candidat:
  cout_md: null
  financement_md: null
  texte: 'Pas de chiffrage global publié au 29 septembre 2026. Objectif affiché : « ramener le déficit de plus de 5 % à 2
    % du PIB en fin de quinquennat » ; « deal fiscal » présenté comme neutre (50 Md€ de baisse d''impôts de production contre
    50 Md€ d''aides en moins) ; hausse des salaires enseignants présentée comme financée par la baisse démographique « sans
    dégrader les finances publiques ».'
  url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
notes: 'Programme non publié en entier au 29 septembre 2026 : quatre pages « priorités » du site de campagne, discours du
  5 juillet, entretiens (Échos, Figaro, AFP, RTL). La réforme des retraites a été précisée le 29 septembre 2026 (65 ans et 45 annuités
  en moins de dix ans, calendrier non publié) ; son effet en 2032 reste la principale source d''incertitude. Les pages « priorités » ne sont pas datées. Le programme européen d''Horizons
  (2024) repris par certains agrégateurs n''est pas retenu. Phase 2 (29 septembre 2026) : chiffrage à droit constant (chiffrage/REFERENCE.md)
  avec les barèmes communs ; mesures non budgétaires préfixées NON_BUDGETAIRE. Le « deal fiscal » est chiffré en deux lignes
  : la baisse d''impôts de production (coût) et la baisse d''aides, économie ciblée sur un périmètre nommé (règle 6 : montant annoncé plafonné, net d''IS). L''objectif
  de déficit à 2 % n''est pas une mesure.'
mesures:
- id: impots-production-moins-50md
  libelle: Baisser de 50 Md€ par an les impôts de production
  domaine: fiscalité des entreprises
  citation:
    texte: 'Conclure un pacte fiscal inédit avec les entreprises : 50 Md€ de baisses d''impôts de production contre 50 Md€
      d''aides publiques improductives en moins, le plus grand choc de compétitivité jamais réalisé.'
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: precise
  interpretation: 'Baisse de 50 Md€/an des impôts de production (foncier, chiffre d''affaires, valeur ajoutée : catégories décrites
    par Public Sénat, 6 nov. 2025, sans liste d''impôts ; la CVAE en fait partie par hypothèse), dès le premier PLF. Chiffrée séparément de la contrepartie (baisse des aides) pour rendre visible l''hypothèse
    de neutralité. Référence : la législation au 1er janvier 2027 prévoit déjà la fin de la CVAE (calendrier à vérifier) :
    ne compter que l''écart. Phase 2 : la contrepartie (aides-entreprises-moins-50md) est chiffrée à part selon la règle 6.'
  effets_retour: Le candidat attend un choc de compétitivité (investissement, emploi) ; non compté.
  chiffrable: true
  nature: baisse_recette
  effet_solde_primaire:
    central: -44.84
    bas: -60.53
    haut: -34.73
    montee_en_charge: &id001
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
    annuel:
      '2027': 0.0
      '2028': -43.15
      '2029': -44.46
      '2030': -42.4
      '2031': -43.6
      '2032': -44.84
  calcul:
    formule: -(baisse - cvae) * f * (1 - retour_is)
    parametres:
      baisse:
        valeur: 50
        unite: Md€/an (montant nominal annoncé en 2025)
        source: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
      cvae:
        valeur: 3.7
        unite: Md€/an (2025)
        bareme: cvae_restante
        note: CVAE citée par l'entourage parmi les impôts visés ; sa suppression en 2030 est déjà dans la référence
      f: &id002
        valeur: 1.2106
        bareme: facteur_pib_2025_2032
        unite: facteur 2025→2032
        note: facteur PIB nominal (FMI WEO avril 2026, plan/hypotheses.yaml), indiqué en tête de chiffrage/baremes.yaml
      retour_is:
        valeur: 0.2
        bareme: retour_is_impots_production
        unite: part du coût brut revenant en IS
        source: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
        note: 'impôts de production déductibles du résultat : une baisse augmente l''IS (retour mécanique, même règle que
          le-pen-rn et retailleau-lr). Taux effectif moyen à l''IS de 24 à 27 % pour les entreprises bénéficiaires (CPO, cité
          par FIPECO) ; central 0,20 car une partie de l''assiette (taxe sur les salaires des activités non assujetties à la
          TVA, entreprises déficitaires ou à l''IR) ne rend pas d''IS, comme le RN (Institut Montaigne, 0,20)'
    explication: 'Baisse de 50 Md€ (euros 2025) des impôts de production dès le premier budget (LFI 2028), portée en euros
      2032 avec le PIB (une baisse de taux suit l''assiette), nette du surcroît d''IS (0,20). La CVAE, dont la suppression
      en 2030 est déjà votée, ne coûte rien en 2032 : si elle fait partie des 50 Md€ (central), le coût brut est de 46,3
      Md€ en euros 2025. Bas : CVAE hors des 50 Md€ et sans retour d''IS (50 Md€ pleins, 60,5 Md€ en 2032). Haut : montant
      figé en euros courants 2025, net de CVAE, retour d''IS de 0,25. Effets annuels : en 2028-2029 la CVAE existe encore
      dans la référence, la baisse porte sur 50 Md€ (× 1,0787 et × 1,1116, PIB nominal) ; à partir de 2030, 46,3 Md€ ×
      facteur PIB de l''année ; tous × 0,8. Vérification du 2026-09-29 : le retour d''IS, omis à la première rédaction, est
      ajouté par cohérence avec les autres programmes (règle 3, effet mécanique documenté).'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée dans la source (récupérée le 2026-09-29). Le montant (50 Md€) est bien celui de la source, mais la source ne liste pas les impôts (CVAE, C3S, CFE : pas cités). Correction : retour d'IS omis (impôts de production déductibles, règle 3, même traitement que RN et Retailleau) : central -56,05 → -44,84 (bas -60,53 sans retour, haut -34,73). Net de CVAE conservé (suppression 2030 déjà votée, CVAE 3,7 Md€ FIPECO). Effets annuels recalculés. Recalé sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2025_2032 (valeur inchangée)."
- id: aides-entreprises-moins-50md
  libelle: Supprimer 50 Md€ d'aides publiques « improductives » aux entreprises
  domaine: aides aux entreprises
  citation:
    texte: 'Conclure un pacte fiscal inédit avec les entreprises : 50 Md€ de baisses d''impôts de production contre 50 Md€
      d''aides publiques improductives en moins, le plus grand choc de compétitivité jamais réalisé.'
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: partielle
  interpretation: 'Montant annuel (Public Sénat, 6 nov. 2025, d''après la publication LinkedIn du candidat : « réduire de
    50 milliards d''euros le montant annuel des aides versées aux entreprises », « dès le premier projet de loi de finances
    »). Aides visées non listées ; l''équipe exclut les allègements généraux (« C''est ce qu''on pouvait faire de plus massif
    sans réduire les allègements généraux, ou d''autres choses qu''on ne voulait pas toucher », un conseiller, même article).
    Périmètre retenu : aides aux entreprises hors allègements de cotisations et hors interventions de Bpifrance (prêts,
    garanties et prises de participation, remboursés ou rémunérés : les réduire n''améliore pas le solde primaire). Règle
    6 (économie ciblée sur un périmètre nommé) : central = montant annoncé, plafonné par ce périmètre ; bas = 0 ; haut
    = central.'
  chiffrable: true
  nature: economie
  effet_solde_primaire:
    central: 55.34
    bas: 0.0
    haut: 55.34
    montee_en_charge: *id001
  calcul:
    formule: min(montant * f, perimetre_2025 * f) * (1 - retour_is * part_subventions)
    parametres:
      montant:
        valeur: 50
        unite: Md€/an (euros 2025)
        source: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
        note: « le maire du Havre veut réduire de 50 milliards d'euros le montant annuel des aides versées aux entreprises
          »
      perimetre_2025:
        valeur: 70
        unite: Md€/an (2025), aides hors allègements de cotisations
        source: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
        note: '« une estimation globale du coût des aides publiques aux entreprises de 150 milliards d''euros, ventilée sommairement
          entre les dépenses fiscales (40 milliards d''euros), les dépenses budgétaires (30 milliards d''euros) et les allègements
          de cotisations sociales (80 milliards d''euros) » (ministre Lombard, 15 mai 2025, cité par la commission d''enquête).
          Recoupement Sénat 2023 (graphiques du rapport, relus) : sens large 211 = 41 Bpifrance + 88 dépenses fiscales + 75
          allègements + 7 subventions, soit 95 Md€ hors Bpifrance et hors allègements ; sens strict 108 = 26 dépenses fiscales
          (hors TVA et dépenses « déclassées ») + 75 allègements + 7 subventions, soit 33 Md€ hors allègements'
      f: *id002
      retour_is:
        valeur: 0.2
        bareme: retour_is_impots_production
        unite: part du montant rendue par l'IS
        source: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
        note: même taux de retour que la ligne impots-production-moins-50md (symétrie du « deal »)
      part_subventions:
        valeur: 0.4286
        unite: part des aides supprimées qui sont des subventions imposables
        source: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
        note: 'convention : suppression proportionnelle à la ventilation du ministre (30 Md€ de dépenses budgétaires sur 70)
          ; les subventions d''exploitation et d''investissement entrent dans le résultat imposable (art. 38 du CGI), leur
          suppression réduit l''IS ; les crédits et réductions d''impôt (dépenses fiscales) ne sont pas imposables'
    explication: '50 Md€ (euros 2025) portés en euros 2032 avec le même facteur PIB que la baisse d''impôts de production
      (60,53 Md€), inférieurs au plafond du périmètre hors allègements (70 Md€ en 2025 selon le ministre, 84,7 Md€ en 2032)
      : le plafond ne joue pas. Net de l''IS perdu sur la part « subventions » (30/70 × 0,20 = 8,6 %) : 55,34 Md€. Première
      rédaction du 29/09 : 60,53 sans retour d''IS, alors que la ligne symétrique (baisse d''impôts de production) en compte
      un. Lecture contestable du plafond : sur le périmètre « au sens strict » du Sénat (33 Md€ en 2023 hors allègements,
      42,2 Md€ en 2032 avec facteur_pib_2023_2032), le central tomberait à 38,6 Md€ ; ce périmètre exclut les dépenses fiscales
      de TVA et « déclassées » (intégration fiscale), dont la suppression est juridiquement possible et que le candidat
      n''exclut pas : le périmètre du ministre (70 Md€) est retenu, celui du Sénat au sens strict est une sensibilité. Bas
      0 : économie non réalisée (aides non identifiées).'
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: "Passe sources : citation remplacée par la source primaire (site du candidat, « 50 Md€ d'aides publiques improductives en moins ») ; montant annuel et exclusion des allègements généraux relus dans Public Sénat (6 nov. 2025). Rapport du Sénat r24-808 relu (texte et graphiques 140 et 141) : 211 Md€ au sens large (41 Bpifrance, 88 dépenses fiscales, 75 allègements, 7 subventions), 108 Md€ au sens strict (26 dépenses fiscales, 75 allègements, 7 subventions) ; le sens strict INCLUT les allègements (le barème aides_publiques_entreprises le décrit à tort comme « hors allègements généraux »). Plafond tranché : aides hors allègements et hors Bpifrance, 70 Md€ (ministre, 2025) à 95 Md€ (Sénat, 2023) ; le sens strict (33 Md€) est une sensibilité. Correction : retour d'IS sur la part subventions (8,6 %), par symétrie avec la baisse d'impôts de production : central 60,53 → 55,34. Trace précédente (verificateur-sonnet, 29/09) : règle 6 révisée, central 0 → 60,53, plafond non contraignant."
