annonce_candidat:
  cout_md: null
  financement_md: null
  texte: 'Pas de chiffrage global publié au 29 septembre 2026. Objectif affiché : « ramener le déficit de plus de 5 % à 2
    % du PIB en fin de quinquennat » ; « deal fiscal » présenté comme neutre (50 Md€ de baisse d''impôts de production contre
    50 Md€ d''aides en moins) ; hausse des salaires enseignants présentée comme financée par la baisse démographique « sans
    dégrader les finances publiques ».'
  url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
notes: 'Programme non publié en entier au 29 septembre 2026 : quatre pages « priorités » du site de campagne, discours du
  5 juillet, entretiens (Échos, Figaro, AFP, RTL). La réforme des retraites (âge, paramètres) est annoncée mais pas détaillée
  ; c''est la principale source d''incertitude. Les pages « priorités » ne sont pas datées. Le programme européen d''Horizons
  (2024) repris par certains agrégateurs n''est pas retenu. Phase 1 : mesures à chiffrer marquées raison_non_chiffrable =
  A_CHIFFRER ; les mesures non budgétaires sont préfixées NON_BUDGETAIRE.'
mesures:
- id: impots-production-moins-50md
  libelle: Baisser de 50 Md€ par an les impôts de production
  domaine: fiscalité des entreprises
  citation:
    texte: 'Conclure un pacte fiscal inédit avec les entreprises : 50 Md€ de baisses d''impôts de production contre 50 Md€
      d''aides publiques improductives en moins, le plus grand choc de compétitivité jamais réalisé.'
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: precise
  interpretation: 'Baisse de 50 Md€/an des impôts de production (CVAE, C3S, CFE cités par l''entourage, Public Sénat 6 nov.
    2025), dès le premier PLF. Chiffrée séparément de la contrepartie (baisse des aides) pour rendre visible l''hypothèse
    de neutralité. Référence : la législation au 1er janvier 2027 prévoit déjà la fin de la CVAE (calendrier à vérifier) :
    ne compter que l''écart.'
  chiffrable: false
  raison_non_chiffrable: A_CHIFFRER
  effets_retour: Le candidat invoque un choc de compétitivité (« produire plus pour gagner plus ») ; non compté.
- id: aides-entreprises-moins-50md
  libelle: Supprimer 50 Md€ d'aides publiques « improductives » aux entreprises
  domaine: aides aux entreprises
  citation:
    texte: En parallèle, le maire du Havre veut réduire de 50 milliards d’euros le montant annuel des aides versées aux entreprises,
      des aides qu’il estime être « saupoudrées, complexes, incompréhensibles ».
    url: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
    date: '2025-11-06'
    support: presse (publication LinkedIn du candidat)
  precision: partielle
  interpretation: Aides visées non listées ; l'entourage exclut les allègements généraux de cotisations (« sans réduire les
    allègements généraux »). Le gisement d'aides hors allègements généraux doit être documenté pour juger la faisabilité des
    50 Md€ (fourchette basse si gisement insuffisant).
  chiffrable: false
  raison_non_chiffrable: A_CHIFFRER
