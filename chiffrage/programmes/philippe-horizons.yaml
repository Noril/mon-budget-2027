annonce_candidat:
  cout_md: null
  financement_md: 150
  texte: 'Programme, volume 1 (18 novembre 2026) : « Ramener le déficit sous 2,5 % de la richesse nationale à la fin du
    quinquennat, soit près de 150 milliards d''économies », l''effort portant « pour moitié sur les dépenses sociales (retraites,
    chômage, arrêts maladie), pour un quart sur l''État et les collectivités. Le dernier quart viendra de la croissance
    et de l''emploi » ; « aucun nouvel impôt » pendant le quinquennat. Pas de chiffrage mesure par mesure ni de coût total
    des dépenses promises. Chiffrages partiels antérieurs (8 octobre 2026) : exonération d''impôt des jeunes parents « qui
    coûte 3 Mds € par an », allocation familiale unique « à coût constant » (formule absente du programme du 18 novembre)
    ; « deal fiscal » présenté comme neutre (50 Md€ d''impôts de production contre 50 Md€ d''aides en moins). Montant
    revendiqué, non additionné : les 150 Md€ ne modifient ni les mesures ni le solde (règle 6, enveloppe globale).'
  url: https://www.edouardphilippe.fr/programme/comptes-publics
notes: 'Passe complète du 20 novembre 2026 sur le programme, volume 1 (présenté le 18 novembre 2026, 17 pages thématiques
  du site, texte relu en entier ; le livret PDF n''est distribué que contre un formulaire de coordonnées et n''a pas été
  téléchargé). Citations remplacées par celles du programme quand il reprend la mesure. Changements : part fiscale dès
  le deuxième enfant retirée (absente du programme, déjà disparue du site en octobre) ; service militaire volontaire
  remplacé par un service national obligatoire (non chiffrable, durée non publiée) et réservistes rechiffrés seuls ;
  carence portée à trois jours dans la fonction publique (chiffrée) ; objectif de déficit ramené de 2 % à « sous 2,5 % »
  avec « près de 150 milliards d''économies » (enveloppe, non additionnée). Mesures nouvelles chiffrées : baisse de 30 %
  des allocataires du RSA (économie ciblée, règle 6), suppression de la réduction de loyer de solidarité, versement
  de 500 € sur un plan d''épargne retraite au premier emploi. Mesures nouvelles non chiffrables (avec estimation indicative
  quand l''objet est clair) : frais de notaire des moins de 35 ans, pérennisation du PTZ, PFU et IFI sur la location longue
  durée, TVA des logements neufs aux maires, 30 000 places de prison, service national, handicap, petite enfance, école,
  outre-mer, énergie, plan Horizon 2050. Veille du 11 octobre 2026 : annonces de « L''Heure de vérité » (France 2, 8 octobre 2026) intégrées (communiqué
  du site de campagne, franceinfo, AFP) : non-remplacement d''un départ à la retraite sur trois dans la fonction publique
  (chiffré), heures au-delà de 35 h par accord exonérées (nouveau), zéro impôt sur le revenu pour les jeunes parents (nouveau,
  3 Md€ selon le candidat), allocation familiale unique de 350 € (précisée, non chiffrable). La part fiscale dès le deuxième
  enfant a disparu du site : retrait probable, maintenue (statut contesté) en attendant confirmation. Effort budgétaire annoncé : 50 % sur les dépenses sociales, 25 % sur les
  collectivités (AFP), sans montant. Programme non publié en entier au 29 septembre 2026 : quatre pages « priorités » du site de campagne, discours du
  5 juillet, entretiens (Échos, Figaro, AFP, RTL). La réforme des retraites a été précisée le 29 septembre 2026 (65 ans et 45 annuités
  en moins de dix ans, calendrier non publié) ; son effet en 2032 reste la principale source d''incertitude. Les pages « priorités » ne sont pas datées. Le programme européen d''Horizons
  (2024) repris par certains agrégateurs n''est pas retenu. Phase 2 (29 septembre 2026) : chiffrage à droit constant (chiffrage/REFERENCE.md)
  avec les barèmes communs ; mesures non budgétaires préfixées NON_BUDGETAIRE. Le « deal fiscal » est chiffré en deux lignes
  : la baisse d''impôts de production (coût) et la baisse d''aides, économie ciblée sur un périmètre nommé (règle 6 : montant annoncé plafonné, net d''IS). L''objectif
  de déficit à 2 % n''est pas une mesure.'
mesures:
- id: impots-production-moins-50md
  libelle: Baisser de 50 Md€ par an les impôts de production
  domaine: fiscalité des entreprises
  citation:
    texte: 'Un pacte fiscal massif : 50 milliards d’euros d’impôts de production en moins contre 50 milliards d’euros d’aides
      en moins.'
    url: https://www.edouardphilippe.fr/programme/entreprises
    date: '2026-11-18'
    support: programme, volume 1 (site du candidat)
  precision: precise
  interpretation: 'Baisse de 50 Md€/an des impôts de production (foncier, chiffre d''affaires, valeur ajoutée : catégories décrites
    par Public Sénat, 6 nov. 2025, sans liste d''impôts ; la CVAE en fait partie par hypothèse), dès le premier PLF. Chiffrée séparément de la contrepartie (baisse des aides) pour rendre visible l''hypothèse
    de neutralité. Référence : le droit voté prévoit déjà la suppression de la CVAE en 2030 (REFERENCE.md) : seul
    l''écart est compté. Phase 2 : la contrepartie (aides-entreprises-moins-50md) est chiffrée à part selon la règle 6.'
  effets_retour: Le candidat attend un choc de compétitivité (investissement, emploi) ; non compté.
  chiffrable: true
  nature: baisse_recette
  effet_solde_primaire:
    central: -45.1
    bas: -60.88
    haut: -34.73
    montee_en_charge: &id001
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
    annuel:
      '2027': 0.0
      '2028': -43.32
      '2029': -44.65
      '2030': -42.59
      '2031': -43.83
      '2032': -45.1
  calcul:
    formule: -(baisse - cvae) * f * (1 - retour_is)
    parametres:
      baisse:
        valeur: 50
        unite: Md€/an (montant nominal annoncé en 2025)
        source: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
      cvae:
        valeur: 3.7
        unite: Md€/an (2025)
        bareme: cvae_restante
        note: CVAE citée par l'entourage parmi les impôts visés ; sa suppression en 2030 est déjà dans la référence
      f: &id002
        valeur: 1.2177
        bareme: facteur_pib_2025_2032
        unite: facteur 2025→2032
        note: facteur PIB nominal (FMI WEO octobre 2026, plan/hypotheses.yaml), indiqué en tête de chiffrage/baremes.yaml
      retour_is:
        valeur: 0.2
        bareme: retour_is_impots_production
        unite: part du coût brut revenant en IS
        source: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
        note: 'impôts de production déductibles du résultat : une baisse augmente l''IS (retour mécanique, même règle que
          le-pen-rn et retailleau-lr). Taux effectif moyen à l''IS de 24 à 27 % pour les entreprises bénéficiaires (CPO, cité
          par FIPECO) ; central 0,20 car une partie de l''assiette (taxe sur les salaires des activités non assujetties à la
          TVA, entreprises déficitaires ou à l''IR) ne rend pas d''IS, comme le RN (Institut Montaigne, 0,20)'
    explication: 'Baisse de 50 Md€ (euros 2025) des impôts de production dès le premier budget (LFI 2028), portée en euros
      2032 avec le PIB (une baisse de taux suit l''assiette), nette du surcroît d''IS (0,20). La CVAE, dont la suppression
      en 2030 est déjà votée, ne coûte rien en 2032 : si elle fait partie des 50 Md€ (central), le coût brut est de 46,3
      Md€ en euros 2025, soit 46,3 × 1,2177 × (1 − 0,20) = 45,10 Md€ en 2032. Le retour d''IS (règle 3, effet mécanique
      documenté) est compté comme dans les autres programmes. Bas : CVAE hors des 50 Md€ et sans retour d''IS (50 Md€
      pleins, 60,53 Md€ en 2032). Haut : montant figé en euros courants 2025, net de CVAE, retour d''IS de 0,25 (34,73).
      Effets annuels : en 2028-2029 la CVAE existe encore dans la référence, la baisse porte sur 50 Md€ (× 1,0830 et ×
      1,1163, PIB nominal) ; à partir de 2030, 46,3 Md€ × facteur PIB de l''année ; tous × 0,8.'
  confiance: moyenne
  verification:
    statut: corrige
    par: veille-2026-11-20
    date: '2026-11-20'
    commentaire: "Passe du 20/11/2026 : citation remplacée par le programme, volume 1 (18/11/2026), relu sur le site ; paramètres et montants inchangés. Trace précédente (verificateur-sonnet, 2026-09-29) : Citation retrouvée dans la source (récupérée le 2026-09-29). Le montant (50 Md€) est bien celui de la source, mais la source ne liste pas les impôts (CVAE, C3S, CFE : pas cités). Correction : retour d'IS omis (impôts de production déductibles, règle 3, même traitement que RN et Retailleau) : central -56,05 → -44,84 (bas -60,53 sans retour, haut -34,73). Net de CVAE conservé (suppression 2030 déjà votée, CVAE 3,7 Md€ FIPECO). Effets annuels recalculés. Recalé sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2025_2032 (valeur inchangée). Recalé sur le FMI WEO d'octobre 2026 : central −44,84 → −45,1 (bas −60,53 → −60,88)."
- id: aides-entreprises-moins-50md
  libelle: Supprimer 50 Md€ d'aides publiques « improductives » aux entreprises
  domaine: aides aux entreprises
  citation:
    texte: 'Oui. Édouard Philippe propose de baisser de 50 milliards d’euros les impôts de production, en supprimant autant
      d’aides publiques improductives. Ce serait le plus grand choc de compétitivité jamais réalisé en France, sans creuser
      le déficit.'
    url: https://www.edouardphilippe.fr/programme/entreprises
    date: '2026-11-18'
    support: programme, volume 1 (site du candidat)
  precision: partielle
  interpretation: 'Montant annuel (Public Sénat, 6 nov. 2025, d''après la publication LinkedIn du candidat : « réduire de
    50 milliards d''euros le montant annuel des aides versées aux entreprises », « dès le premier projet de loi de finances
    »). Aides visées non listées ; l''équipe exclut les allègements généraux (« C''est ce qu''on pouvait faire de plus massif
    sans réduire les allègements généraux, ou d''autres choses qu''on ne voulait pas toucher », un conseiller, même article).
    Périmètre retenu : aides aux entreprises hors allègements de cotisations et hors interventions de Bpifrance (prêts,
    garanties et prises de participation, remboursés ou rémunérés : les réduire n''améliore pas le solde primaire). Règle
    6 (économie ciblée sur un périmètre nommé) : central = montant annoncé, plafonné par ce périmètre ; bas = 0 ; haut
    = central.'
  chiffrable: true
  economie_non_detaillee: true
  nature: economie
  effet_solde_primaire:
    central: 55.67
    bas: 0.0
    haut: 55.67
    montee_en_charge: *id001
  calcul:
    formule: min(montant * f, perimetre_2025 * f) * (1 - retour_is * part_subventions)
    parametres:
      montant:
        valeur: 50
        unite: Md€/an (euros 2025)
        source: https://www.publicsenat.fr/actualites/economie/entreprises-un-deal-a-250-milliards-deuros-sur-un-quinquennat-que-represente-la-proposition-dedouard-philippe
        note: « le maire du Havre veut réduire de 50 milliards d'euros le montant annuel des aides versées aux entreprises
          »
      perimetre_2025:
        valeur: 70
        unite: Md€/an (2025), aides hors allègements de cotisations
        source: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
        note: '« une estimation globale du coût des aides publiques aux entreprises de 150 milliards d''euros, ventilée sommairement
          entre les dépenses fiscales (40 milliards d''euros), les dépenses budgétaires (30 milliards d''euros) et les allègements
          de cotisations sociales (80 milliards d''euros) » (ministre Lombard, 15 mai 2025, cité par la commission d''enquête).
          Recoupement Sénat 2023 (graphiques du rapport, relus) : sens large 211 = 41 Bpifrance + 88 dépenses fiscales + 75
          allègements + 7 subventions, soit 95 Md€ hors Bpifrance et hors allègements ; sens strict 108 = 26 dépenses fiscales
          (hors TVA et dépenses « déclassées ») + 75 allègements + 7 subventions, soit 33 Md€ hors allègements'
      f: *id002
      retour_is:
        valeur: 0.2
        bareme: retour_is_impots_production
        unite: part du montant rendue par l'IS
        source: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
        note: même taux de retour que la ligne impots-production-moins-50md (symétrie du « deal »)
