  verification:
    statut: corrige
    par: veille-2026-11-20
    date: '2026-11-20'
    commentaire: "Passe du 20/11/2026 : citation remplacée par le programme, volume 1 (18/11/2026), relu sur le site ; paramètres et montants inchangés. Trace précédente (perimetre-apu, 2026-09-30) : Périmètre APU (30/09) : barème retraites_duree_assurance_hausse_1_an_apu (10,2 ; haut 11,0) ; central 1,48 → 2,55 ; bas 0 inchangé (lecture d'un allongement après 2032, plus défavorable que le périmètre système, 1,48) ; haut 4,43 → 8,25. Passe sources : le candidat a publié sa réforme le 29 septembre 2026 (65 ans et 45 annuités en moins de dix ans, après reprise de la réforme 2023) ; citation remplacée (franceinfo/AFP, verbatim de la vidéo ; page du site relue, sans chiffres). Le chiffrage précédent (accélération de l'âge à 6 mois par génération dès 2028, 0,5 an × 6,6 = 3,3 Md€) ne correspond plus à l'annonce : l'âge au-delà de 64 ans ne joue pas en 2032. Remplacé par l'allongement de durée (extrait de la Cour des comptes relu) avec une convention de calendrier : central 3,3 → 1,48, bas 0, haut 7,9 → 4,44. Trace précédente (verificateur-sonnet, 29/09) : statut conteste, calendrier d'accélération non sourcé. Recalé sur les barèmes sourcés du 29/09 : gain de durée renvoyé au nouveau barème retraites_duree_assurance_hausse_1_an (5,92 recopié → 5,9) ; central 1,48 inchangé à l'arrondi (1,475), haut 4,44 → 4,43. Recalé sur le FMI WEO d'octobre 2026 : central 2,55 → 2,58 (haut 8,25 → 8,4)."
