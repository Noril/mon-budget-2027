  interpretation: 'Programme du 18 novembre 2026 : même dispositif, par accord d''entreprise (« Laisser les entreprises
    organiser leur temps de travail »). Communiqué du 8 octobre 2026 : « si une entreprise trouve un accord pour élever
    sa durée du travail au-dessus de 35 heures, toutes les heures travaillées au-dessus de 35 heures seront défiscalisées
    et exonérées de cotisation ». Sur France 2 : « si vous travaillez plus longtemps, le salarié va gagner plus, parce qu''il n''y aura
    plus de cotisations sociales. Et l''entreprise va pouvoir disposer d''un coût du travail qui sera un peu moins élevé
    », « travailler deux heures de plus par semaine, c''est 1.000 euros de plus par an » au Smic (AFP). Droit en vigueur
    : les heures supplémentaires sont déjà exonérées d''impôt sur le revenu (jusqu''à 7 500 € par an) et de cotisations
    salariales, avec une déduction forfaitaire de cotisations patronales sous 250 salariés (barème hs_exoneration_cout).
