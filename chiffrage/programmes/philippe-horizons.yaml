- id: retraites-travailler-plus-longtemps
  libelle: 'Réforme des retraites : travailler plus longtemps, âge légal relevé selon les métiers'
  domaine: retraites
  citation:
    texte: 'Garantir l''équilibre de notre système de retraites pour protéger les générations futures : travailler plus tout
      en prenant en compte la diversité des carrières, créer un pilier de capitalisation à 10-15 % des pensions d''ici quinze
      ans, confier la gestion du régime à l’équilibre aux partenaires sociaux.'
    url: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    date: consulté le 2026-09-29
    support: site du candidat
  precision: vague
  interpretation: 'Âge cible non annoncé au 29 sept. 2026 (le candidat refuse « tout chiffre totémique », Figaro 30 juin 2026
    ; LCP 23 sept. : paramètres « dans les prochains jours ou semaines »). Hypothèses pour la phase 2 : âge légal porté à
    65 (bas), 66 (central), 67 ans (haut), au rythme de 3 mois par génération, par rapport à la législation au 1er janvier
    2027 (réforme 2023 suspendue jusqu''en 2028). Référendum sur les retraites annoncé (IFRAP).'
  chiffrable: false
  raison_non_chiffrable: A_CHIFFRER
