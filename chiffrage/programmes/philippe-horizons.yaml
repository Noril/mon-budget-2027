- id: enseignants-plus-20pct
  libelle: Augmenter de 20 % la rémunération moyenne des enseignants sur le quinquennat
  domaine: éducation
  citation:
    texte: Le candidat d'Horizons pour l'élection présidentielle défend notamment "une augmentation de 20% de la rémunération
      moyenne des enseignants" sur le quinquennat, pour la porter "au moins au niveau de la moyenne européenne, notamment
      en milieu de carrière". "C'est massif, mais c'est indispensable pour redonner de la dignité à leur métier", estime-t-il.
      "Avec près d'un million d'élèves en moins, nous avons les moyens de continuer à réduire les effectifs dans les classes
      là où c'est nécessaire et de mieux rémunérer les professeurs sans dégrader les finances publiques", précise également
      le maire du Havre.
