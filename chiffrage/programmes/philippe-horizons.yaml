        note: 'convention, parce que le calendrier n''est pas publié : milieu entre les deux lectures de « ensuite » ; allongement
          immédiat après 43 ans (1 trimestre par génération, 1 à 2 trimestres en moyenne sur les départs de
          2032 : environ 0,4 an) ou après l''atteinte de 64 ans en 2033 (0). Bas 0 ; haut 0,75 an (3 trimestres, génération 1968)'
      gain_duree:
        valeur: 10.3
        unite: Md€ 2032 par année de durée requise en plus (solde des APU)
        bareme: retraites_duree_assurance_hausse_1_an_apu
        note: 'Cour des comptes : « le gain total serait de 9,7 Md€ pour l’ensemble des finances publiques en 2035 »
          (euros constants 2024), moins les effets de bord sur les autres prestations, × 1,1506 ≈ 10,3 ; au périmètre du
          système seul, 5,9 (retraites_duree_assurance_hausse_1_an)'
      annees_age:
        valeur: 0
        unite: année d'âge légal en plus de la référence en 2032
        source: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
        note: 'la référence (réforme 2023 reprise en 2028) atteint 64 ans pour la génération 1969 en 2033 ; le relèvement
          à 65 ans, annoncé « ensuite », ne touche pas les départs de 2032'
      gain_age:
        valeur: 19.0
        unite: Md€ 2032 par année d'âge (solde des APU)
        bareme: retraites_age_legal_hausse_1_an_apu
    explication: 'Seul l''allongement de la durée joue en 2032 : 0,25 an (convention) × 10,3 Md€ (barème
      retraites_duree_assurance_hausse_1_an_apu) = 2,58 Md€ sur le solde de l''ensemble des APU (convention commune 4 ; 1,48
      Md€ au périmètre du seul système de retraite). Bas 0 : allongement commencé après 2032 (plus défavorable que le
      périmètre système). Haut : 0,75 an de durée en plus (3 trimestres) × 11,2 (haut du barème APU) = 8,4 Md€ ; l''âge
      n''ajoute rien même dans le haut. À long terme (65 ans et 45 ans pleinement appliqués, vers 2040), l''effet est bien
      supérieur : un an d''âge (19,0 Md€ APU) plus deux ans de durée (≈ 20,4 Md€ APU), avant exceptions (« un Français sur
      trois » avant 65 ans).'
