- id: smic-1600-net
  libelle: SMIC à 1 600 € net en deux ans
  domaine: salaires
  citation:
    texte: Augmenter le SMIC à 1600 euros net dans les deux ans qui suivent notre accession au pouvoir.
    url: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
    date: '2025-06-23'
    support: programme du parti (Place publique, « Acte I », 42 chantiers)
  precision: precise
  interpretation: 'Engagement de l''Acte I de Place publique (juin 2025), redit en conférence de presse le 23/06/2025 (Public
    Sénat). Non repris explicitement dans les prises de parole de campagne de 2026, qui mettent en avant la baisse de CSG
    ; retenu comme engagement du projet du parti, non démenti. Effet budgétaire : allègements généraux, prime d''activité,
    masse salariale publique indexée sur le SMIC. Double compte évité avec point-indice-indexe-inflation : le barème du SMIC
    inclut la masse salariale publique des agents au SMIC, mais pas l''indexation générale du point.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -1.06
    bas: -11.0
    haut: -0.82
    montee_en_charge:
      '2027': 0.3
      '2028': 0.6
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(cible / (smic_2026 * infl_27_29) - 1) * 100 * cout_1pct * f
    parametres:
      cible:
        valeur: 1600
        unite: € net par mois
        source: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
        note: « Augmenter le SMIC à 1600 euros net dans les deux ans »
      smic_2026:
        valeur: 1477.93
        unite: € net par mois (1er juin 2026)
        source: https://www.compta-online.com/smic-horaire-montant-mensuel-brut-net-ao1021
        note: SMIC net mensuel après la revalorisation automatique de 2,41 % au 1er juin 2026
      infl_27_29:
        valeur: 1.0528
        unite: facteur
        source: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
        note: revalorisation légale supposée égale au déflateur FMI 2027-2029 (1,0146 × 1,01862 × 1,01863)
      cout_1pct:
        valeur: 0.31
        unite: Md€/an de moindre solde par point de % de hausse du Smic
        bareme: smic_1pct_cout_apu
      f:
        valeur: 1.2106
        unite: facteur
        bareme: facteur_pib_2025_2032
        note: PIB nominal 2032 / 2025 (en-tête de chiffrage/baremes.yaml)
    explication: 'Le SMIC est indexé par la loi (inflation + moitié du pouvoir d''achat du salaire ouvrier) : en 2029, il
      atteindrait environ 1 556 € net sans mesure ; 1 600 € demandent donc un coup de pouce d''environ 2,8 %, conservé ensuite
      dans le niveau. Coût APU d''un point de SMIC (DG Trésor, barème smic_1pct_cout_apu, 0,31 Md€ en 2025) porté en 2032
      (× 1,2106). Bas : hausse mesurée depuis le SMIC de juin 2026 (+8,3 %, cas d''une application immédiate) et sensibilité
      haute du barème (1,1 Md€ par point) : −8,26 × 1,1 × 1,2106 ≈ −11,0. Haut : sensibilité basse (0,24). Au-delà de 5 %,
      le barème avertit que la linéarité n''est plus garantie.'
  effets_retour: 'Effets sur l''emploi peu qualifié (négatifs selon le groupe d''experts SMIC) et sur la consommation : non
    comptés.'
  confiance: faible
  verification:
    statut: ok
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée (PDF Acte I). SMIC net 1 477,93 € au 1/6/2026 confirmé (compta-online, +2,41 %). Rejoué : (1600 / (1477,93 × 1,0528) − 1) × 100 × 0,31 × 1,2106 = 1,06. Réserve : la revalorisation légale comprend aussi la moitié du gain de pouvoir d'achat des ouvriers, ignorée (base 2029 sous-estimée d'≈ 1 %) : le coup de pouce est donc un peu surestimé, coût central ≈ 0,7 à 1,1 (< 1 Md€ d'écart). Le barème DG Trésor 2017 (0,24 Md€ pour 1 %) est ancien ; la RGDU rend le coût des allègements plus sensible (bas 11 le couvre). Pas de double compte avec le point d'indice (interprétation). Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée."
- id: point-indice-indexe-inflation
  libelle: Indexation du point d'indice de la fonction publique sur l'inflation et rattrapage entre ministères
  domaine: fonction-publique
  citation:
    texte: Soutenir les fonctionnaires, revaloriser durablement les rémunérations pour renforcer l’attractivité de la fonction
      publique, indexant leur point d’indice sur l’inflation et corrigeant les écarts de rémunérations entre ministères.
    url: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
    date: '2025-06-23'
    support: programme du parti (Place publique, « Acte I », 42 chantiers)
  precision: partielle
  interpretation: 'Lecture : point d''indice revalorisé chaque année de l''inflation (par rapport à un gel en législation
    2027), plus une enveloppe non chiffrée de convergence interministérielle (hors chiffrage central, dans la fourchette).
    Limite connue : la trajectoire de référence de plan/ (solde primaire gelé en points de PIB) n''est pas à droit constant
    ; si l''on considère que des revalorisations ponctuelles du point y sont implicites, le coût réel de la promesse est plus
    faible. Interaction : la hausse de 10 % des enseignants (salaires-enseignants-10-pct) s''applique sur une masse déjà indexée
    ; l''effet croisé (≈ 0,4 Md€) n''est pas compté.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -20.59
    bas: -24.1
    haut: -16.05
    montee_en_charge:
      '2027': 0.13
      '2028': 0.3
      '2029': 0.48
      '2030': 0.66
      '2031': 0.83
      '2032': 1
  calcul:
    formule: -indexation * (1 - retours)
    parametres:
      indexation:
        valeur: 28.6
        unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
        bareme: indexation_point_indice_2027_2032
      retours:
        valeur: 0.28
        unite: part de la rémunération brute supplémentaire
        bareme: retour_prelevements_salaires_publics
    explication: 'Convention commune (REFERENCE.md, point 2) : point gelé à droit constant ; l''indexer sur l''inflation de
      2027 à 2032 coûte le barème indexation_point_indice_2027_2032 (2,59 Md€ par point en 2032 × 11,03 points d''inflation
      cumulée = 28,6 Md€ brut hors cotisations employeurs), net des prélèvements qui reviennent aux APU (× 0,72), sans projection
      par le PIB. Montée en charge imposée par le barème (0,13 / 0,30 / 0,48 / 0,66 / 0,83 / 1). Bas : indexation sur les
      prix à la consommation (30,8 Md€, haut du barème), retour bas (0,25) et pensions induites (≈ 1 Md€ en 2032) : −(30,8
      × 0,75 + 1,0) = −24,1 ; la convergence interministérielle n''est pas chiffrée. Haut : bas du barème (23,6), retour haut
      (0,32) : −16,05.'
  effets_retour: 'Attractivité de la fonction publique invoquée : non comptée.'
  confiance: moyenne
  verification:
    statut: conteste
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée. Arithmétique rejouée : 11,04 × 2,2 × 1,278 × 0,75 = 23,28. Trois réserves, non tranchées faute de source ouverte : (1) le « quart de retours » est attribué au Sénat (a25-145-5) mais n'y figure pas (la page ne donne que 7,6 Md€ pour 3,5 % et 3,4 Md€ pour 1,5 %) : hypothèse propre non sourcée, plausible (CSG-CRDS 9,7 % + cotisations salariales + IR) mais à documenter ; (2) le coût brut 2,2 Md€ inclut les cotisations employeurs, dont les contributions au CAS Pensions et à la CNRACL, flux internes aux APU, alors que salaires-enseignants-10-pct retire 35 % de CAS : traitement incohérent entre les deux mesures du même fichier (le net consolidé serait plus bas que 23,3) ; (3) la base 2032 est portée par le PIB nominal (× 1,278) alors que, point gelé, la masse n'augmente que du volume et du glissement : l'inflation est comptée deux fois (dans la base puis dans l'indexation) ; base gelée ≈ 2,6 (2,27 × 1,046 × 1,02² × 1,01⁶), soit −21,7 au lieu de −23,3 (écart ≈ 1,6 Md€). ÉCART DE CONVENTION : Tondelier compte −27,6 (11,04 × 2,5, barème haut) sans aucun retour ; Mélenchon et Glucksmann comptent −23,3 net d'un quart de retours. Sur une base brute commune, l'écart Glucksmann/Tondelier (31,0 brut contre 27,6) vient de la projection PIB. Central non modifié ; la fourchette −35,3 (sans retour, barème haut) à −22,96 couvre l'écart. Recalé sur les conventions communes du 29/09 : barème indexation_point_indice_2027_2032 (28,6 Md€ brut hors cotisations employeurs, sans projection PIB) net du retour 0,28 (au lieu du « quart » non sourcé), montée en charge imposée (0,13 en 2027) ; −23,28 → −20,59 (bas −35,3 → −24,1 avec pensions induites ; haut −22,96 → −16,05). Les trois réserves ci-dessus sont levées par la convention."
