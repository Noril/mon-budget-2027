annonce_candidat:
  cout_md: null
  financement_md: null
  texte: 'Aucun chiffrage global publié au 29 septembre 2026 ; le programme de mandat n''est pas publié. Seuls chiffrages
    revendiqués : baisse de CSG d''environ 15 Md€ financée par 15 Md€ de hausse de la fiscalité des successions > 2 M€ (2
    + 3 + 10 Md€, franceinfo 25/08/2026), et hausse des salaires enseignants « 6 milliards en tout » (30/08/2026). Engagement
    de principe (Medef, 27/08/2026) : ne financer la hausse des salaires ni « par la casse du modèle social », ni « par l''aggravation
    de la dette ». L''Acte I (2025) annonce un « mix responsable d''économies ciblées et de recettes nouvelles » sans montant.'
  url: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
notes: 'Statut : candidat déclaré le 23/08/2026, il concourt à la primaire de la gauche socialiste et démocratique organisée
  par le PS, Place publique et la GRS (accord ratifié le 25/08/2026). Candidats retenus le 16/09/2026 : Olivier Faure (PS),
  Raphaël Glucksmann (Place publique), Jérôme Guedj (PS), Emmanuel Maurel (GRS), Ségolène Royal (ex-PS). Philippe Brun (PS)
  a été écarté le 16/09 après sa suspension du PS (référé et appel rejetés le 23/09) ; Fabien Verdier et Maxime Legrand n''ont
  pas été retenus (parrainages). François Ruffin a renoncé à y entrer le 12/09 ; Karim Bouamrane et Bernard Cazeneuve refusent
  la primaire. Vote : 9-10 octobre, second tour 16-17 octobre 2026. Si Glucksmann perd la primaire, ce fichier ne correspondra
  plus à un candidat. Sources : il n''existe pas encore de programme de mandat ; le socle est l''« Acte I » de Place publique
  (juin 2025, 42 chantiers, présenté comme « une vision et non un catalogue figé de mesures »), le livre « Nous avons encore
  envie » (mai 2026, non consulté directement, cité via la presse) et les annonces de campagne (août-septembre 2026), connues
  surtout par la presse (entretiens télévisés et radio sans transcription officielle). Les mesures de l''Acte I sont postérieures
  à 2022 et n''exigent pas de reconfirmation ; celles non reprises en campagne le signalent dans interpretation. Le programme
  européen 2024 (338 mesures) n''est pas repris. Collecte : citations vérifiées sous-chaîne exacte des textes extraits (curl
  + extraction, espaces normalisés), le 29/09/2026.'
mesures:
- id: baisse-csg-salaires
  libelle: Baisse de la CSG sur les salaires (environ 15 Md€ rendus aux salariés)
  domaine: fiscalite-travail
  citation:
    texte: J'ai fait une proposition forte qui est de dire on baisse la CSG sur les salaires pour les salariés et on trouve
      l'argent où ? Eh bien chez les grands, les méga-héritiers
    url: https://lcp.fr/actualites/presidentielle-2027-ce-qu-il-faut-retenir-du-premier-debat-entre-les-candidats-440670
    date: '2026-08-27'
    support: presse (LCP, débat des candidats devant le Medef)
  precision: partielle
  interpretation: 'Montant revendiqué : 15 Md€ par an (« Ça nous permettra de récupérer 15 milliards d''euros que nous transfèrerons
    directement sur la fiche de paie des travailleurs français », franceinfo 25/08/2026), soit « 200 euros net de plus par
    mois » selon le débat LCI du 23/09/2026. Le barème de la baisse (taux uniforme, dégressivité, plafond) n''est pas publié
    ; le franceinfo du 21/09/2026 parle d''une « baisse de cotisations ou de la CSG ». Lecture retenue : baisse de CSG sur
    revenus d''activité de 15 Md€, gagée par la mesure successions (sans double compte avec elle). La compensation à la Sécurité
    sociale est à traiter en phase 2 (perte de recette APU). Chiffrage : gagé par les trois mesures successions (successions-tranche-haute-50,
    successions-pacte-dutreil, successions-plus-values-latentes), chiffrées séparément ; leur rendement central (≈ 5 Md€)
    est très inférieur aux 15 Md€ annoncés, ce qui fait apparaître un besoin de financement.'
  chiffrable: true
  nature: baisse_recette
  effet_solde_primaire:
    central: -13.2
    bas: -15.99
    haut: -12.75
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -montant * f * (1 - retour_ir)
    parametres:
      montant:
        valeur: 15
        unite: Md€ par an (montant revendiqué)
        source: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
        note: « récupérer 15 milliards d'euros que nous transfèrerons directement sur la fiche de paie »
      f:
        valeur: 1.0
        unite: facteur
        source: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
        note: montant pris en euros courants tel qu'annoncé (enveloppe fixée par le rendement des successions)
      retour_ir:
        valeur: 0.12
        unite: part du rendement de la CSG baissée qui revient en impôt sur le revenu
        source: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
        note: 'convention commune n° 5 (REFERENCE.md ; limites du barème csg_point) : une baisse d''un point de CSG déductible
          relève le revenu imposable et rend 10 à 15 % en IR ; point médian 0,12 (10,3 Md€ net par point d''activité en 2026)'
    explication: 'Enveloppe revendiquée de 15 Md€ rendue sur les salaires, soit environ 1,1 point de CSG sur les revenus d''activité
      (barème csg_point_activite : 11,71 Md€ par point en 2026, ≈ 13,9 Md€ en 2032). Convention commune n° 5 : la CSG sur
      les revenus d''activité étant déductible pour 6,8 points sur 9,2, la baisse relève l''IR de 10 à 15 % de son montant
      ; coût net = 15 × (1 − 0,12) = 13,2 Md€. Bas : enveloppe indexée comme l''assiette salariale (15 × 1,1842, facteur_pib_2026_2032)
      et retour de 10 %. Haut : retour de 15 %. Montée en charge : loi de finances et LFSS votées fin 2027, effet au 1er janvier
      2028.'
  chiffrages_tiers:
  - auteur: Candidat (équipe de campagne, via franceinfo)
    montant_md: -15
    url: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
    date: '2026-08-25'
    commentaire: 'Coût implicite : 15 Md€ transférés sur la fiche de paie.'
  effets_retour: Hausse du salaire net et de la consommation invoquée par le candidat, non comptée. Le supplément d'IR dû
    à la baisse de CSG déductible est compté (convention commune, 12 %) ; nul si la baisse portait sur la seule part non déductible.
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée (LCP). -15 = enveloppe annoncée (franceinfo 25/08/2026 : « récupérer 15 milliards » en taxant les 1 % des plus gros héritages) : ≈ 1,0 point de CSG activité en 2032 (12,03 Md€/pt en 2025 × 1,2106 = 14,6), cohérent ; bas 17,76 = enveloppe indexée. Le « 200 € net par mois » cité en interprétation (LCI) est incompatible avec 15 Md€ (≈ 46 € par mois et par salarié, ~ 27 M de salariés) : soit le barème réel est plus lourd que l'annonce (bas insuffisant si 200 € tous salariés = ~ 60 Md€), soit la phrase vise un cas particulier ; non chiffré, à revérifier. Pas de double compte avec les successions (gage compté à part) ; écart de financement ≈ 10 Md€ visible (15 annoncés contre ≈ 5 chiffrés). Recalé sur les conventions communes du 29/09 : retour d'IR de la CSG déductible (12 %, fourchette 10-15 %) déduit ; −15,0 → −13,2 (bas −17,76 → −15,99 ; haut −15,0 → −12,75)."
- id: successions-tranche-haute-50
  libelle: 'Droits de succession : taux marginal porté de 45 % à 50 % au-delà de 1,8 M€ (successions > 2 M€)'
  domaine: fiscalite-patrimoine
  citation:
    texte: Le relèvement de la tranche haute, au-delà de 1,8 million d'euros la taxe ne serait plus de 45% mais 50%. Selon
      les estimations fournies, cela permettrait d'obtenir deux milliards d'euros.
    url: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
    date: '2026-08-25'
    support: presse (franceinfo, « Le vrai du faux », éléments transmis par l'équipe de campagne)
  precision: precise
  interpretation: 'Élément du « dispositif global » transmis par l''équipe (Simon Bernard, coordinateur de campagne) à franceinfo
    ; seules les successions au-delà de 2 M€ seraient concernées. Lecture : dernière tranche en ligne directe (> 1 805 677
    €) passe de 45 % à 50 %.'
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 1.12
    bas: 0.0
    haut: 2.24
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: 5 / 45 * successions * f * part
    parametres:
      successions:
        valeur: 17.0
        unite: Md€ (droits de succession, PLF 2026)
        source: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
        note: 'dérivation du barème dmtg_rendement : successions 16 995 M€'
      f: &id002
        valeur: 1.1842
        unite: facteur
        bareme: facteur_pib_2026_2032
        note: PIB nominal 2032 / 2026 = 1,2106 (en-tête baremes.yaml, 2025→2032) / (1,00858 × 1,01358) (croissance nominale
          2026)
      part:
        valeur: 0.5
        unite: part
        source: https://www.cae-eco.fr/staticfiles/pdf/cae-note069.pdf
        note: 'convention : part des droits de succession acquittés au-delà de 1,8 M€ par héritier, inconnue (pas de statistique
          DGFiP publique par tranche) ; point médian de [0 ; 1]. Le CAE souligne que les plus gros héritiers (top 0,1 %) paient
          « à peine 10 % » grâce aux niches, ce qui plaide pour une part basse'
    explication: 'Passer le taux marginal de 45 % à 50 % sur la fraction au-delà de 1 805 677 € rapporte au plus 5/45 des
      droits acquittés dans cette tranche. Maximum arithmétique (toute la recette successorale dans la tranche à 45 %) : 5/45
      × 17,0 × 1,1842 = 2,24 Md€ en 2032 (haut) ; le rendement revendiqué (2 Md€) est donc proche du maximum théorique. Central
      : moitié du maximum (convention faute de données par tranche). Bas : 0, l''assiette de la tranche supérieure pouvant
      être largement évitée (pacte Dutreil, assurance-vie, démembrement : CAE, note n° 69). Réaction de l''assiette : le CAE
      (note n° 69, 2021, citant Goupille-Lebret et Infante 2018 et Kleven et al.) juge les élasticités faibles, surtout en
      matière de migration ; elle est couverte par la borne basse.'
  chiffrages_tiers:
  - auteur: Candidat (équipe de campagne, via franceinfo)
    montant_md: 2
    url: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
    date: '2026-08-25'
    commentaire: 'Rendement revendiqué.'
  - auteur: Fondation IFRAP (sur le programme du NFP, 2024)
    montant_md: 5.0
    url: https://www.ifrap.org/budget-et-fiscalite/nouveau-front-populaire-pourquoi-le-chiffrage-du-programme-par-la-fondation-ifrap-differe-t-il-de-celui-du-parti
    date: '2024-06-24'
    commentaire: 'Pour un alourdissement massif des DMTG (NFP : 17 Md€ annoncés), l''IFRAP estime que le rendement « ne devrait
      pas accroître le rendement des DMTG de plus de 5 milliards d''euros » : plafond cohérent avec notre total successions
      (≈ 5 Md€).'
  effets_retour: 'Anticipation de donations avant l''entrée en vigueur (recettes avancées puis moindres) : non comptée.'
  confiance: faible
  verification:
    statut: ok
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée (franceinfo). Formule rejouée : 5/45 × 17 × 1,1842 × 0,5 = 1,12. Recoupement indépendant : le CAE (note 69) indique que le top 1 % des héritiers reçoit ≈ 4,2 M€ en moyenne (top 0,1 % : 13 M€) et que le top 0,1 % paie ≈ 10 % effectif : la base au-delà de 1,8 M€ est de l'ordre de 15 à 20 Md€, soit 0,8 à 1 Md€ statique à 5 points, avant évitement : le central 1,12 est déjà dans le haut de ce recoupement et le « 2 Md€ » revendiqué (89 % de tous les droits de succession dans la tranche à 45 %) n'est pas atteignable ; haut 2,24 = maximum théorique. Pas de correction (part = 0,5 reste une convention, bas = 0). Total successions (1,1 + 2,0 + 1,8 = 4,95) contre 15 annoncés : l'écart vient surtout du « 10 Md€ » de plus-values latentes ramené à 1,8 (CAE) ; la fourchette haute des trois (2,2 + 3,1 + 10 = 15,3) restitue l'annonce. Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2026_2032 ; valeur inchangée."
- id: successions-pacte-dutreil
  libelle: Pacte Dutreil recentré (biens professionnels, reprises durables)
  domaine: fiscalite-patrimoine
  citation:
    texte: Trois milliards supplémentaires en définissant les biens professionnels pour le dispositif du pacte Dutreil et
      restreindre aux projets de reprise durable.
    url: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
    date: '2026-08-25'
    support: presse (franceinfo, « Le vrai du faux », éléments transmis par l'équipe de campagne)
  precision: partielle
  interpretation: 'Restriction de l''exonération de 75 % aux seuls biens professionnels et aux reprises durables ; paramètres
    non publiés. Le candidat cite une évaluation de la Cour des comptes sur le pacte Dutreil. La loi de finances 2026 a déjà
    exclu les biens somptuaires et allongé la conservation à six ans : le gain est mesuré par rapport à ce droit.'
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 2.02
    bas: 1.4
    haut: 3.08
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: gain_cae * depense_recente / depense_cae
    parametres:
      gain_cae:
        valeur: 1.4
        unite: Md€ (2018-2019)
        source: https://www.cae-eco.fr/staticfiles/pdf/cae-note069.pdf
        note: 'simulation CAE, note n° 69, graphique : « Exemption des patrimoines professionnels à 50 % (1,4) » Md€ de gain
          pour les finances publiques'
      depense_recente:
        valeur: 3.6
        unite: Md€ (moyenne 2022-2024)
        source: https://www.ccomptes.fr/sites/default/files/2025-11/20251118-Synthese-Pacte%20Dutreil.pdf
        note: 'Cour des comptes : dépense fiscale Dutreil de 2,0 Md€ (2022), 3,3 Md€ (2023) et 5,5 Md€ (2024) ; moyenne 3,6
          Md€, 2024 étant gonflée par « une très grosse donation »'
      depense_cae:
        valeur: 2.5
        unite: Md€ (2018-2019)
        source: https://www.cae-eco.fr/staticfiles/pdf/cae-note069.pdf
        note: coût du Dutreil estimé par le CAE « aux alentours de 2 à 3 milliards d'euros en 2018-2019 » (point médian)
    explication: 'Recentrage du pacte Dutreil sur les biens professionnels et les reprises durables, lu comme équivalent en
      rendement au variant du CAE (exonération réduite de 75 % à 50 %, gain 1,4 Md€ en 2018-2019), mis à l''échelle de la
      dépense fiscale récente (moyenne 2022-2024 de la Cour, 3,6 Md€, contre 2,5 Md€ en 2018-2019). Pas de projection au PIB
      : dépense très volatile (grosses opérations). Bas : gain CAE non mis à l''échelle, d''autant que la loi de finances
      2026 (article 8) exclut déjà les biens « somptuaires » et porte l''engagement de conservation à six ans (référence).
      Haut : mise à l''échelle sur 2024 (5,5 Md€).'
  chiffrages_tiers:
  - auteur: Candidat (équipe de campagne, via franceinfo)
    montant_md: 3
    url: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
    date: '2026-08-25'
    commentaire: Rendement revendiqué.
  effets_retour: 'Report ou avance de transmissions, restructurations de holdings : couverts par la borne basse ; effets sur
    l''emploi des entreprises transmises jugés non significatifs par la Cour des comptes.'
  confiance: faible
  verification:
    statut: ok
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée. Paramètres relus : CAE « 2 à 3 Md€ en 2018-2019 » et variante « exemption des patrimoines professionnels à 50 % (1,4) » ; Cour des comptes 2,0 / 3,3 / 5,5 Md€ (2022-2024), « très grosse donation » en 2023 et 2024. Formule rejouée 1,4 × 3,6 / 2,5 = 2,02. Réserves : la variante CAE (50 %) n'est qu'un proxy du recentrage sur les biens professionnels et reprises durables ; le droit LFI 2026 (biens somptuaires exclus, conservation six ans) réduit déjà l'assiette du gain ; central < 3 annoncés. Pas de double compte avec la tranche à 50 % (interaction ≈ 0,2)."
- id: successions-plus-values-latentes
  libelle: Imposition des plus-values latentes à la transmission (fin de la purge au décès)
