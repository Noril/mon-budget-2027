  precision: precise
  interpretation: Retour de l'accise sur l'électricité (ex-TICFE) à son niveau d'avant février 2024 pour les ménages ; à apprécier
    par rapport au tarif en vigueur au 1er janvier 2027. Le rendement par €/MWh vient d'une tribune (Connaissance des énergies,
    2024) ; un barème d'accise électricité est à ajouter.
  chiffrable: true
  nature: baisse_recette
  effet_solde_primaire:
    central: -4.0
    bas: -5.97
    haut: -4.0
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -hausse * rendement_par_eur
    parametres:
      hausse:
        valeur: 20
        unite: €/MWh
        source: https://www.fournisseurs-electricite.com/contrat-electricite-gaz/taxes/accise-electricite
        note: 'février 2024 : passage de 1 à 21 €/MWh (fin du bouclier)'
      rendement_par_eur:
        valeur: 0.2
        unite: Md€ par €/MWh et par an
        source: https://www.connaissancedesenergies.org/tribune-actualite-energies/du-sel-lelectricite-le-maniement-risque-des-taxes-de-rendement
        note: '« La remontée de 20 €/MWh de l''accise sur l''électricité en février 2024 va probablement rapporter de l''ordre
          de 4 milliards d''euros sur l''année 2024 » : 4 / 20'
    explication: 'Baisse de l''accise de 20 €/MWh (l''incrément de février 2024) par rapport au tarif en vigueur (30,85 €/MWh
      pour les ménages en 2026), à 0,2 Md€ par €/MWh (4 Md€ pour 20 €/MWh, tous consommateurs). Pas de projection au PIB (assiette
      en volume). Bas : retour à 1 €/MWh pour les ménages (−29,85 €/MWh × 0,2). Haut = central : l''électrification des usages
      accroîtrait plutôt l''assiette (et donc le coût).'
  effets_retour: 'Soutien au pouvoir d''achat et à l''électrification : non compté.'
  confiance: moyenne
  verification:
    statut: ok
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée (PDF Acte I). Rendement 0,2 Md€ par €/MWh (4 Md€ pour 20 €/MWh en 2024, tribune Connaissance des énergies) : le montant est tous consommateurs assujettis au taux normal, alors que l'interprétation parle des ménages : cohérent avec la promesse (baisse du taux normal). Rejoué : 20 × 0,2 = 4,0. Volumes de consommation non projetés (assiette en volume : acceptable). Bas = retour à 1 €/MWh (lecture maximale, −5,97). Pas de double compte avec le chèque énergie."
