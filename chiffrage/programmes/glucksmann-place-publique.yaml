- id: cheque-carburant-energie-triple
  libelle: Chèque carburant / chèque énergie triplé (500 €) et étendu aux classes moyennes
  domaine: energie
  citation:
    texte: L’eurodéputé propose également de "multiplier par trois" le chèque carburant, en le portant à 500 euros, et de
      l'étendre aux classes moyennes. "Il faut prendre les bénéficiaires du chèque énergie et de manière automatique, augmenter
      ce chèque" carburant, dit-il.
    url: https://www.franceinfo.fr/economie/automobile/essence/prix-des-carburants-le-gouvernement-ne-veut-pas-heurter-totalenergies-selon-raphael-glucksmann-qui-reclame-une-taxe-sur-les-superprofits_8202563.html
    date: '2026-09-21'
    support: presse (franceinfo, entretien radio)
  precision: partielle
  interpretation: 'Le 23/09/2026 (LCI) il parle d''un « triplement du chèque énergie », « avec un ciblage en direction des
    foyers les plus modestes ». Lecture retenue : aide versée automatiquement aux bénéficiaires du chèque énergie, portée
    à 500 €/an, étendue à une partie des classes moyennes (périmètre non défini : fourchette). Mesure conjoncturelle annoncée
    face à la hausse des carburants ; durée non précisée. Financement annoncé par une taxation des superprofits fossiles (taxe-superprofits-fossiles),
    non chiffrable : pas de compensation comptée.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -1.56
    bas: -2.31
    haut: -1.38
    montee_en_charge:
      '2027': 0.5
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -menages * (montant_cible - montant_moyen) / 1e9
    parametres:
      menages:
        valeur: 4500000.0
        unite: foyers
        source: https://www.connaissancedesenergies.org/questions-et-reponses-energies/quest-ce-que-le-cheque-energie
        note: « Environ 4,5 millions de foyers ont reçu automatiquement un chèque énergie en 2026 »
      montant_cible:
        valeur: 500
        unite: € par an
        source: https://www.franceinfo.fr/economie/automobile/essence/prix-des-carburants-le-gouvernement-ne-veut-pas-heurter-totalenergies-selon-raphael-glucksmann-qui-reclame-une-taxe-sur-les-superprofits_8202563.html
        note: chèque « multiplié par trois », porté à 500 euros
      montant_moyen:
        valeur: 153
        unite: € par an
        source: https://www.connaissancedesenergies.org/questions-et-reponses-energies/quest-ce-que-le-cheque-energie
        note: montant moyen du chèque énergie 2026
    explication: 'Version du 21/09/2026 (chèque porté à 500 € pour les bénéficiaires du chèque énergie) : 4,5 M de foyers
      × (500 − 153) €. Haut : version du 23/09/2026 (« triplement du chèque énergie » ciblé sur les modestes) : 4,5 M × 153
      × 2 = 1,38 Md€. Bas : extension aux 6 millions de foyers éligibles (Sud Radio, UFE) à 500 €, net de la dépense actuelle
      : 6 M × 500 − 4,5 M × 153 = 2,31 Md€ ; l''extension aux « classes moyennes », non délimitée, peut coûter davantage.
      Supposée pérenne (le chèque énergie l''est) ; non indexée (le barème ne l''est pas).'
  effets_retour: 'Soutien à la consommation : non compté.'
  confiance: moyenne
  verification:
    statut: ok
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée (franceinfo 21/09/2026). Chèque énergie 2026 : 4,5 M de foyers et 153 € en moyenne confirmés (connaissancedesenergies). 4,5 M × (500 − 153) = 1,56 rejoué. Réserve : l'extension aux « classes moyennes » citée est absente du central (bénéficiaires actuels seulement) ; le bas 2,31 (6 M de foyers) suppose un périmètre limité : si l'extension couvre 10 M de foyers, le coût est ≈ 4,3 Md€. Effet < 1 Md€ sur le central ; non corrigé."
