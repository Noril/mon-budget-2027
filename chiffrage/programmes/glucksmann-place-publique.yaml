- id: aide-publique-developpement-0-7
  libelle: Aide publique au développement portée progressivement à 0,7 % du RNB
  domaine: international
  citation:
    texte: Renforcer la loi de développement solidaire en intégrant une programmation budgétaire annuelle pour atteindre progressivement
      0,7 % du RNB dédié à l’aide publique au développement.
    url: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
    date: '2025-06-23'
    support: programme du parti (Place publique, « Acte I », 42 chantiers)
  precision: precise
  interpretation: 'Lecture : trajectoire linéaire de l''APD du niveau 2027 (après les coupes 2025-2026) à 0,7 % du RNB en
    fin de quinquennat. La cible de 0,7 % figure déjà à l''article 2 de la loi n° 2021-1031 du 4 août 2021 de programmation
    relative au développement solidaire, mais sans crédits contraignants (0,43 % en 2025 selon le Sénat) : la promesse ajoute
    une « programmation budgétaire annuelle », donc un coût par rapport au droit constant.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -10.32
    bas: -11.79
    haut: -8.11
    montee_en_charge:
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1
  calcul:
    formule: -(cible - niveau) / 100 * rnb_2032
    parametres:
      cible:
        valeur: 0.7
        unite: '% du RNB'
        source: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
        note: « atteindre progressivement 0,7 % du RNB »
      niveau:
        valeur: 0.42
        unite: '% du RNB'
        bareme: apd_part_rnb
        note: 'niveau 2025 (OCDE, données préliminaires, vérifié dans l''API DAC1 : 0,48 en 2024, 0,42 en 2025) ; le Sénat
          estimait 0,43 % pour 2025 et des « perspectives pour 2026 [...] encore orientées à la baisse ». Bas : 0,38 %, bas du barème
          (projection 2026 de Focus 2030 après la LFI 2026, aucune prévision officielle publiée), commun aux trois programmes
          qui promettent 0,7 %'
      rnb_2032:
        valeur: 3685
        unite: Md€ courants
        bareme: rnb_nominal_2032
    explication: 'Convention commune n° 10 : écart entre 0,7 % et le niveau de référence (barème apd_part_rnb, 0,42 % en 2025)
      appliqué au RNB 2032 (barème rnb_nominal_2032), trajectoire linéaire jusqu''en 2032. C''est un majorant : l''APD au
      sens de l''OCDE comprend des prêts (en équivalent-don), des annulations de dette et des frais d''accueil qui ne sont
      pas des dépenses budgétaires (le Sénat répartit l''effort de l''État : crédits de la mission APD 28 %, autres crédits
      budgétaires 39 %, contributions via l''UE 23 %, autres 10 %). Bas : depuis 0,38 % (bas du barème apd_part_rnb,
      projection 2026 non officielle), −0,32 % × 3 685. Haut
      : depuis 0,48 % (niveau 2024), si « progressivement » laisse la cible au-delà de 2032 ou si une partie de l''effort est
      comptée hors budget, −0,22 % × 3 685.'
  effets_retour: 'Effets diplomatiques et migratoires invoqués : non comptés.'
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: "Passe sources (29/09/2026) : citation Acte I relue. Niveau 2025 vérifié dans l'API OCDE DAC1 (ODA en % du RNB, équivalent-don : 0,48 en 2024, 0,42 en 2025). La borne basse reposait sur un chiffre de presse au conditionnel (Alternatives Économiques, 0,38 %) : remplacé par une convention appuyée sur le Sénat (avis a25-141-4 : mission APD −704 M€ en CP en 2026, perspectives « orientées à la baisse ») : départ à 0,40 %, bas −11,79 → −11,06. Central et haut inchangés. Audit du 30/09/2026 : le 0,38 % est retracé à sa source (Focus 2030, projection d'ONG, aucune prévision officielle pour 2026) et inscrit en bas du barème apd_part_rnb ; bas aligné sur les deux autres programmes qui promettent 0,7 % : −11,06 → −11,79. Ajout : cible de 0,7 % déjà dans la loi du 4 août 2021, sans force budgétaire ; part budgétaire de l'APD documentée (Sénat). Trace précédente (verificateur-sonnet, corrige) : Citation retrouvée (PDF Acte I). Alternatives Économiques relu : 0,48 % du RNB en 2024 (15 Md€), « pourrait retomber à 0,38 % » après le budget 2026. Rejoué −(0,7 − 0,38)/100 × 3 621 = −11,59. Correction du bas (−11,59 → −12,0) : RNB > PIB (0,48 % = 15 Md€ implique un RNB d'≈ 3 100 Md€ contre un PIB de 2 920), l'hypothèse « écart de 1 à 2 % » de la note est trop basse. Central inchangé (écart < 0,4 Md€). Réserve importante : l'APD au sens OCDE inclut des composantes hors dépense budgétaire (équivalent-don des prêts, annulations de dette, accueil des réfugiés, contribution UE) ; la montée à 0,7 % ne coûte donc pas tout en solde primaire : la borne haute (−7,97) est plutôt un plancher de prudence que de l'optimisme. Le niveau 0,38 % est une projection « pourrait » (conditionnel). Recalé sur les conventions communes du 29/09 : assiette RNB 2032 (barème rnb_nominal_2032, 3 685 Md€) au lieu du PIB, niveau de départ harmonisé sur le barème apd_part_rnb (0,42 %, le 0,38 % conditionnel passe en bas), chiffre présenté comme majorant ; −11,59 → −10,32 (bas −12,0 → −11,79 ; haut −7,97 → −8,11)."
