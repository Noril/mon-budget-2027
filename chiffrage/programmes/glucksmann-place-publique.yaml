    date: '2026-08-25'
    commentaire: 'Rendement revendiqué.'
  - auteur: Fondation IFRAP (sur le programme du NFP, 2024)
    montant_md: 5.0
    url: https://www.ifrap.org/budget-et-fiscalite/nouveau-front-populaire-pourquoi-le-chiffrage-du-programme-par-la-fondation-ifrap-differe-t-il-de-celui-du-parti
    date: '2024-06-24'
    commentaire: 'Pour un alourdissement massif des DMTG (NFP : 17 Md€ annoncés), l''IFRAP estime que le rendement « ne devrait
      pas accroître le rendement des DMTG de plus de 5 milliards d''euros » : plafond cohérent avec nos deux mesures portant sur les DMTG
      (tranche à 50 % et Dutreil : ≈ 3,1 Md€ ; la mesure sur les plus-values latentes relève de l''impôt sur les plus-values).'
  effets_retour: 'Anticipation de donations avant l''entrée en vigueur (recettes avancées puis moindres) : non comptée.'
  confiance: faible
  verification:
    statut: ok
    par: passe-sources
    date: '2026-09-29'
    commentaire: "Passe sources (29/09/2026) : citation franceinfo relue mot pour mot (« au-delà de 1,8 million d'euros la taxe ne serait plus de 45% mais 50% [...] deux milliards d'euros ») ; source primaire introuvable. Assiette : successions 16 995 M€ au PLF 2026 (barème dmtg_rendement, Sénat l25-139-1 ; DMTG totaux 21,4 Md€ en 2026, 20,8 Md€ en 2025 selon la Cour des comptes). Pas de statistique DGFiP publique des droits par tranche : part = 0,5 reste une convention explicite (fourchette 0 à 1 couvrant l'incertitude). Le CAE (note 69) confirme que le top 0,1 % ne paie « qu'à peine 10 % » : la tranche marginale mord peu. Écart à l'annonce : 2 Md€ revendiqués = 89 % du maximum théorique (2,24). Trace précédente (verificateur-sonnet, ok) : Citation retrouvée (franceinfo). Formule rejouée : 5/45 × 17 × 1,1842 × 0,5 = 1,12. Recoupement indépendant : le CAE (note 69) indique que le top 1 % des héritiers reçoit ≈ 4,2 M€ en moyenne (top 0,1 % : 13 M€) et que le top 0,1 % paie ≈ 10 % effectif : la base au-delà de 1,8 M€ est de l'ordre de 15 à 20 Md€, soit 0,8 à 1 Md€ statique à 5 points, avant évitement : le central 1,12 est déjà dans le haut de ce recoupement et le « 2 Md€ » revendiqué (89 % de tous les droits de succession dans la tranche à 45 %) n'est pas atteignable ; haut 2,24 = maximum théorique. Pas de correction (part = 0,5 reste une convention, bas = 0). Total successions (1,1 + 2,0 + 1,8 = 4,95) contre 15 annoncés : l'écart vient surtout du « 10 Md€ » de plus-values latentes ramené à 1,8 (CAE) ; la fourchette haute des trois (2,2 + 3,1 + 10 = 15,3) restitue l'annonce. Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2026_2032 ; valeur inchangée."
