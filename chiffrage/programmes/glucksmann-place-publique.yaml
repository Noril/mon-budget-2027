- id: smic-1600-net
  libelle: SMIC à 1 600 € net en deux ans
  domaine: salaires
  citation:
    texte: Augmenter le SMIC à 1600 euros net dans les deux ans qui suivent notre accession au pouvoir.
    url: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
    date: '2025-06-23'
    support: programme du parti (Place publique, « Acte I », 42 chantiers)
  precision: precise
  interpretation: 'Engagement de l''Acte I de Place publique (juin 2025), redit en conférence de presse le 23/06/2025 (Public
    Sénat). Non repris explicitement dans les prises de parole de campagne de 2026, qui mettent en avant la baisse de CSG
    ; retenu comme engagement du projet du parti, non démenti. Effet budgétaire : allègements généraux, prime d''activité,
    masse salariale publique indexée sur le SMIC. Double compte évité avec point-indice-indexe-inflation : le barème du SMIC
    inclut la masse salariale publique des agents au SMIC, mais pas l''indexation générale du point.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -3.08
    bas: -17.0
    haut: -1.06
    montee_en_charge:
      '2027': 0.3
      '2028': 0.6
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(cible / (smic_2026 * infl_27_29) - 1) * 100 * cout_1pct * f
    parametres:
      cible:
        valeur: 1600
        unite: € net par mois
        source: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
        note: « Augmenter le SMIC à 1600 euros net dans les deux ans »
      smic_2026:
        valeur: 1477.93
        unite: € net par mois (1er juin 2026)
        source: https://www.compta-online.com/smic-horaire-montant-mensuel-brut-net-ao1021
        note: SMIC net mensuel après la revalorisation automatique de 2,41 % au 1er juin 2026
      infl_27_29:
        valeur: 1.0528
        unite: facteur
        source: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
        note: revalorisation légale supposée égale au déflateur FMI 2027-2029 (1,0146 × 1,01862 × 1,01863)
      cout_1pct:
        valeur: 0.9
        unite: Md€/an de moindre solde par point de % de hausse du Smic
        bareme: smic_1pct_cout_apu
      f:
        valeur: 1.2106
        unite: facteur
        bareme: facteur_pib_2025_2032
        note: PIB nominal 2032 / 2025 (en-tête de chiffrage/baremes.yaml)
    explication: 'Le SMIC est indexé par la loi (inflation + moitié du pouvoir d''achat du salaire ouvrier) : en 2029, il
      atteindrait environ 1 556 € net sans mesure ; 1 600 € demandent donc un coup de pouce d''environ 2,8 %, conservé ensuite
      dans le niveau. Coût APU d''un point de SMIC (barème smic_1pct_cout_apu, 0,9 Md€ en 2025-2026 : décomposition DG Trésor 2017
      actualisée avec l''effet du barème RGDU sur les allègements) porté en 2032 (× 1,2106) : 2,83 × 0,9 × 1,2106 = 3,08.
      Bas : hausse mesurée depuis le SMIC de juin 2026 (+8,3 %, cas d''une application immédiate) et sensibilité haute du
      barème (1,7 Md€ par point, effet barème RGDU entier) : −8,26 × 1,7 × 1,2106 ≈ −17,0. Haut : sensibilité basse (0,31,
      chiffrage de 2017 avant la RGDU) : −1,06. Hausse inférieure à 10 % : pas de majoration au titre de la convention 7.
      Masse salariale publique : le barème inclut le relèvement du minimum de traitement des agents proches du Smic (≈ 0,34
      Md€ par point, × 0,72 net) ; l''indexation du point sur l''inflation (point-indice-indexe-inflation) n''en couvre pas
      la part qui excède l''inflation (coup de pouce) : pas de double compte.'
  effets_retour: 'Effets sur l''emploi peu qualifié (négatifs selon le groupe d''experts SMIC) et sur la consommation : non
    comptés.'
  confiance: faible
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée (PDF Acte I). SMIC net 1 477,93 € au 1/6/2026 confirmé (compta-online, +2,41 %). Rejoué : (1600 / (1477,93 × 1,0528) − 1) × 100 × 0,31 × 1,2106 = 1,06. Réserve : la revalorisation légale comprend aussi la moitié du gain de pouvoir d'achat des ouvriers, ignorée (base 2029 sous-estimée d'≈ 1 %) : le coup de pouce est donc un peu surestimé, coût central ≈ 0,7 à 1,1 (< 1 Md€ d'écart). Le barème DG Trésor 2017 (0,24 Md€ pour 1 %) est ancien ; la RGDU rend le coût des allègements plus sensible (bas 11 le couvre). Pas de double compte avec le point d'indice (interprétation). Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée. Recalé sur les barèmes sourcés du 29/09 : smic_1pct_cout_apu 0,31 → 0,9 Md€ par point (allègements au barème RGDU, bornes 0,31 à 1,7) ; central −1,06 → −3,08 ; bas −11,0 → −17,0 (8,26 × 1,7 × 1,2106) ; haut −0,82 → −1,06 (sensibilité basse 0,31). La réserve sur le barème 2017 est levée."
- id: point-indice-indexe-inflation
