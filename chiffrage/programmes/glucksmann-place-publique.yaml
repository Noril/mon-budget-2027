      par le PIB. Montée en charge imposée par le barème (0,13 / 0,30 / 0,48 / 0,66 / 0,83 / 1). Coût net : 20,6 × 0,72 = 14,8 Md€. Bas : indexation sur les
      prix à la consommation (22,2 Md€, haut du barème), retour bas (0,25) et pensions induites (≈ 1 Md€ en 2032) : −(22,2
      × 0,75 + 1,0) = −17,65 ; la convergence interministérielle n''est pas chiffrée. Haut : bas du barème (17,0), retour haut
      (0,32) : −11,56.'
  effets_retour: 'Attractivité de la fonction publique invoquée : non comptée.'
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: "Passe sources (29/09/2026) : citation relue dans le PDF de l'Acte I (« indexant leur point d'indice sur l'inflation et corrigeant les écarts de rémunérations entre ministères »). Les trois réserves qui fondaient la contestation (quart de retours non sourcé, cotisations employeurs internes aux APU comptées, double projection par le PIB) sont tranchées par les conventions communes (REFERENCE.md, points 1, 2 et 12) : barème indexation_point_indice_2027_2032 (28,6 Md€ brut hors cotisations employeurs, 23,6 à 30,8) × (1 − retour_prelevements_salaires_publics 0,28, 0,25 à 0,32), montée en charge imposée. Rejoué : 28,6 × 0,72 = 20,59 ; bas 30,8 × 0,75 + 1,0 (pensions induites) = 24,1 ; haut 23,6 × 0,68 = 16,05. Reste non chiffrée (sens coût) la convergence interministérielle. Statut conteste → ok. Trace précédente (verificateur-sonnet, conteste) : Citation retrouvée. Arithmétique rejouée : 11,04 × 2,2 × 1,278 × 0,75 = 23,28. Trois réserves, non tranchées faute de source ouverte : (1) le « quart de retours » est attribué au Sénat (a25-145-5) mais n'y figure pas (la page ne donne que 7,6 Md€ pour 3,5 % et 3,4 Md€ pour 1,5 %) : hypothèse propre non sourcée, plausible (CSG-CRDS 9,7 % + cotisations salariales + IR) mais à documenter ; (2) le coût brut 2,2 Md€ inclut les cotisations employeurs, dont les contributions au CAS Pensions et à la CNRACL, flux internes aux APU, alors que salaires-enseignants-10-pct retire 35 % de CAS : traitement incohérent entre les deux mesures du même fichier (le net consolidé serait plus bas que 23,3) ; (3) la base 2032 est portée par le PIB nominal (× 1,278) alors que, point gelé, la masse n'augmente que du volume et du glissement : l'inflation est comptée deux fois (dans la base puis dans l'indexation) ; base gelée ≈ 2,6 (2,27 × 1,046 × 1,02² × 1,01⁶), soit −21,7 au lieu de −23,3 (écart ≈ 1,6 Md€). ÉCART DE CONVENTION : Tondelier compte −27,6 (11,04 × 2,5, barème haut) sans aucun retour ; Mélenchon et Glucksmann comptent −23,3 net d'un quart de retours. Sur une base brute commune, l'écart Glucksmann/Tondelier (31,0 brut contre 27,6) vient de la projection PIB. Central non modifié ; la fourchette −35,3 (sans retour, barème haut) à −22,96 couvre l'écart. Recalé sur les conventions communes du 29/09 : barème indexation_point_indice_2027_2032 (28,6 Md€ brut hors cotisations employeurs, sans projection PIB) net du retour 0,28 (au lieu du « quart » non sourcé), montée en charge imposée (0,13 en 2027) ; −23,28 → −20,59 (bas −35,3 → −24,1 avec pensions induites ; haut −22,96 → −16,05). Les trois réserves ci-dessus sont levées par la convention. Recalé sur les barèmes sourcés du 29/09 : indexation_point_indice_2027_2032 révisé (1,86 Md€ par point en 2032 au lieu de 2,59, soit 20,6 Md€ brut au lieu de 28,6 ; bornes 17,0 à 22,2) ; central −20,59 → −14,83 (20,6 × 0,72) ; bas −24,1 → −17,65 (22,2 × 0,75 + 1,0 de pensions induites) ; haut −16,05 → −11,56 (17,0 × 0,68)."
