- id: annulation-hausse-accise-electricite-2024
  libelle: Annulation de la hausse de l'accise sur l'électricité de 2024
  domaine: energie
  citation:
    texte: Annuler la hausse de taxe sur l’électricité imposée en 2024.
    url: https://place-publique.eu/document/3Ari5O0s5O1L4iK1uyUhI0/pp-acte-un.pdf
