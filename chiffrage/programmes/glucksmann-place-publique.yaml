      × 34 200 € (haut du barème cout_enseignant_apu, enseignant moyen : 45 640 € brut × 0,75) × 10 %. Pas de projection
      par le PIB : à droit constant le point est gelé. Montée en charge sur cinq ans (Acte I : revalorisation « planifiée sur
      5 ans »). Bas : coût annoncé par le candidat, « 6 milliards en tout », qui inclut la composante carrière (jusqu''à +25
      %) et sans doute le privé sous contrat, pris tel quel. Haut : retour haut (0,32 au lieu de 0,25) : × 0,68 / 0,75. Les
