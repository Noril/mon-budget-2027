    L''Acte I prévoyait une revalorisation « continue et planifiée sur 5 ans ». Lecture : +10 % sur la masse indiciaire des enseignants
    du public (le privé sous contrat, payé par l''État, n''est pas compté : environ +15 % sur le central) + composante carrière
    non paramétrée ; montée en charge sur 5 ans. Hausse réelle, distincte
    de l''indexation du point (point-indice-indexe-inflation) : pas de double compte, hors effet croisé mineur.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -2.72
    bas: -6.0
    haut: -2.46
    montee_en_charge:
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1
  calcul:
    formule: -hausse * salaire_moyen_net * etpt / 1e9
    parametres:
      hausse:
        valeur: 0.1
        unite: part
        source: https://www.franceinfo.fr/elections/presidentielle/le-candidat-a-l-election-presidentielle-raphael-glucksmann-veut-augmenter-de-10-les-salaires-de-tous-les-enseignants_8169542.html
        note: « une augmentation pour tous [les enseignants] de 10% »
      salaire_moyen_net:
        valeur: 34200
        unite: € par ETP et par an (enseignant moyen, rémunération brute hors cotisations employeurs nette des retours)
        bareme: cout_enseignant_apu
