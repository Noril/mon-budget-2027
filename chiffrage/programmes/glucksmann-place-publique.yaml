    directement sur la fiche de paie des travailleurs français », franceinfo 25/08/2026), soit « 200 euros net de plus par
    mois » selon le débat LCI du 23/09/2026. Le barème de la baisse (taux uniforme, dégressivité, plafond) n''est pas publié
    ; le franceinfo du 21/09/2026 parle d''une « baisse de cotisations ou de la CSG ». Lecture retenue : baisse de CSG sur
    revenus d''activité de 15 Md€, gagée par la mesure successions (sans double compte avec elle). La compensation à la Sécurité
    sociale est à traiter en phase 2 (perte de recette APU).'
