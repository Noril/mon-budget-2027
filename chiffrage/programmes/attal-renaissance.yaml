annonce_candidat:
  cout_md: null
  financement_md: null
  texte: '« Toutes les propositions que nous formulerons durant la campagne seront financées » (site, Dette de l''État). Trajectoire
    : « 150 milliards d’euros d’économies, dont les deux tiers sur les dépenses sociales, avec un retour du déficit public
    sous les 3 % du PIB avant la fin du mandat, un équilibre des comptes sociaux en 2032 et un retour à l’équilibre de l’ensemble
    des finances publiques en 2037 » (23 sept. 2026) ; « 120 milliards d’euros d’économies durant les cinq premières années
    » (LCI, 25 août 2026). Aucune hausse d''impôt. Coût revendiqué de la hausse des salaires enseignants : 2,5 à 3 Md€.'
  url: https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises
notes: 'Programme en construction : six pages thématiques sur attalpresident.fr et environ 75 comptes rendus d''entretiens
  et de déplacements (mai-septembre 2026), tous récupérés. Les comptes rendus du site sont rédigés par la campagne (citations
  du candidat entre guillemets, le reste paraphrasé par l''équipe). Trois mesures ne sont connues que par le comparateur IFRAP.
  Grand meeting à Lyon le 10 octobre 2026 : nouvelles mesures probables. Phase 1 : mesures à chiffrer marquées raison_non_chiffrable
  = A_CHIFFRER ; mesures non budgétaires préfixées NON_BUDGETAIRE.'
mesures:
- id: economies-120-150md
  libelle: 'Plan de désendettement : 120 à 150 Md€ d''économies, déficit sous 3 % avant 2032, équilibre en 2037'
  domaine: finances publiques
  citation:
    texte: 'Il fixe un cap clair : atteindre le zéro déficit public à l''horizon 2037. Pour structurer cet effort inédit,
      qui représente entre 120 et 150 milliards d''euros d’économies, le candidat propose une méthode rigoureuse jalonnée
      d''étapes incontournables avec un refroidissement immédiat de la dépense publique sera enclenché dès le début de son
      mandat, un retour du déficit public sous la barre des 3% est prévu avant 2032, un retour à l''équilibre strict des comptes
      de la Sécurité sociale sera effectif avant la fin du quinquennat.'
    url: https://attalpresident.fr/actualites/dans-le-parisien-gabriel-attal-vise-le-zero-deficit-en-2037
    date: '2026-07-03'
    support: site du candidat (compte rendu de l'entretien au Parisien)
  precision: partielle
  interpretation: 'Enveloppe traitée selon la règle 6. Le 25 août (LCI) : « 120 milliards d’euros d’économies durant les cinq
    premières années » ; le 23 septembre : « 150 milliards d’euros d’économies, dont les deux tiers sur les dépenses sociales
    ». central = somme des mesures identifiées ci-dessous, haut = 120 Md€ (quinquennat), bas = 0.'
  chiffrable: false
  raison_non_chiffrable: A_CHIFFRER
