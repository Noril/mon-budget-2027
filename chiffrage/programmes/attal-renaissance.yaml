annonce_candidat:
  cout_md: null
  financement_md: null
  texte: '« Toutes les propositions que nous formulerons durant la campagne seront financées » (site, Dette de l''État). Trajectoire
    : « 150 milliards d’euros d’économies, dont les deux tiers sur les dépenses sociales, avec un retour du déficit public
    sous les 3 % du PIB avant la fin du mandat, un équilibre des comptes sociaux en 2032 et un retour à l’équilibre de l’ensemble
    des finances publiques en 2037 » (23 sept. 2026) ; « 120 milliards d’euros d’économies durant les cinq premières années
    » (LCI, 25 août 2026). Aucune hausse d''impôt. Coût revendiqué de la hausse des salaires enseignants : 2,5 à 3 Md€.'
  url: https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises
notes: 'Programme en construction : six pages thématiques sur attalpresident.fr et environ 75 comptes rendus d''entretiens
  et de déplacements (mai-septembre 2026), tous récupérés. Les comptes rendus du site sont rédigés par la campagne (citations
  du candidat entre guillemets, le reste paraphrasé par l''équipe). Trois mesures ne sont connues que par le comparateur IFRAP.
  Grand meeting à Lyon le 10 octobre 2026 : nouvelles mesures probables. Phase 2 (29 septembre 2026) : chiffrage à droit constant
  (chiffrage/REFERENCE.md) avec les barèmes communs ; mesures non budgétaires préfixées NON_BUDGETAIRE. L''enveloppe de 120
  à 150 Md€ ne porte que l''écart d''affichage (règle 6) ; le « droit au brut » est chiffré brut, son financement annoncé
  par des économies sociales étant compté dans les lignes d''économies.'
mesures:
- id: economies-120-150md
  libelle: 'Plan de désendettement : 120 à 150 Md€ d''économies, déficit sous 3 % avant 2032, équilibre en 2037'
  domaine: finances publiques
  citation:
    texte: 'Il fixe un cap clair : atteindre le zéro déficit public à l''horizon 2037. Pour structurer cet effort inédit,
      qui représente entre 120 et 150 milliards d''euros d’économies, le candidat propose une méthode rigoureuse jalonnée
      d''étapes incontournables avec un refroidissement immédiat de la dépense publique sera enclenché dès le début de son
      mandat, un retour du déficit public sous la barre des 3% est prévu avant 2032, un retour à l''équilibre strict des comptes
      de la Sécurité sociale sera effectif avant la fin du quinquennat.'
    url: https://attalpresident.fr/actualites/dans-le-parisien-gabriel-attal-vise-le-zero-deficit-en-2037
    date: '2026-07-03'
    support: site du candidat (compte rendu de l'entretien au Parisien)
  precision: partielle
  interpretation: 'Enveloppe traitée selon la règle 6. Le 25 août (LCI) : « 120 milliards d’euros d’économies durant les cinq
    premières années » ; le 23 septembre : « 150 milliards d’euros d’économies, dont les deux tiers sur les dépenses sociales
    ». central = somme des mesures identifiées ci-dessous, haut = 120 Md€ (quinquennat), bas = 0. Phase 2 : doubles comptes
    évités en ne portant que l''écart d''affichage.'
  chiffrable: true
  nature: economie
  effet_solde_primaire:
    central: 0.0
    bas: 0.0
    haut: 106.86
    montee_en_charge: &id001
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1
  calcul:
    formule: part * (annonce - documente)
    parametres:
      annonce:
        valeur: 120
        unite: Md€ d'économies sur le quinquennat
        source: https://attalpresident.fr/actualites/lci-gabriel-attal-defend-un-projet-de-rupture-pour-repondre-aux-grands-defis-du-pays
        note: « 120 milliards d’euros d’économies durant les cinq premières années » (150 Md€ jusqu'en 2037)
      documente:
        valeur: 13.14
        unite: Md€ 2032
        source: https://attalpresident.fr/actualites/dans-le-parisien-gabriel-attal-vise-le-zero-deficit-en-2037
        note: 'somme des économies centrales déjà chiffrées dans ce programme : annee-blanche-2028 (6,47), assurance-chomage-5md (4,44),
          fonctionnaires-moins-100000 (2,23)'
      part:
        valeur: 0.0
        unite: part de l'écart d'affichage réputée documentée
        source: https://attalpresident.fr/actualites/dans-le-parisien-gabriel-attal-vise-le-zero-deficit-en-2037
        note: 'règle 6 : aucune autre économie identifiée'
    explication: 'Règle 6 : les économies identifiées (13.14 Md€ en 2032) sont déjà comptées ligne à ligne ; cette ligne ne
      porte que l''écart d''affichage (120 − 13.14 Md€), nul en central et en bas, entier en haut. Les 120 Md€ du candidat
      se mesurent par rapport à une évolution tendancielle de la dépense ; notre référence est le droit voté sans tendanciel
      : l''écart d''affichage est donc un majorant.'
  confiance: faible
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée dans la source (récupérée le 2026-09-29). Règle 6 (enveloppe globale) correctement appliquée : central 0, bas 0, haut = 120 − économies identifiées. Mise à jour du haut (103,11 → 103,70) après la correction de l'année blanche. Réserve d'interprétation : « 120 milliards durant les cinq premières années » est lu comme un effort annuel atteint en 2032 ; en cumul sur cinq ans (ramp 0,2 à 1), le haut serait de l'ordre de 40 − 16 Md€. L'unité du paramètre annonce est ambiguë. Recalé sur les conventions communes du 29/09 : économies identifiées ramenées de 16,3 à 13,14 Md€ (annee-blanche-2028 6,47, fonctionnaires-moins-100000 2,23) ; haut 103,7 → 106,86."
- id: annee-blanche-2028
  libelle: Année blanche sur l'ensemble des prestations sociales en 2028, sauf petites retraites
  domaine: prestations sociales / retraites
  citation:
    texte: Dès le budget 2028, une « année blanche » gèlera temporairement les prestations sociales, tout en protégeant les
      petites retraites.
    url: https://attalpresident.fr/actualites/dans-le-parisien-gabriel-attal-vise-le-zero-deficit-en-2037
    date: '2026-07-03'
    support: site du candidat (compte rendu de l'entretien au Parisien)
  precision: partielle
  interpretation: 'Pas de revalorisation en 2028 des prestations indexées (pensions sauf « petites retraites », prestations
    familiales, aides au logement, RSA, AAH…). Effet permanent sur le niveau des dépenses (effet base), érodé seulement si
    rattrapage. Seuil des « petites retraites » non défini : hypothèse à fixer (ex. pensions totales < 1 400 €/mois). « Frein
    d''urgence » réaffirmé le 20 sept. 2026 (France 2).'
  chiffrable: true
  nature: economie
  effet_solde_primaire:
    central: 6.47
    bas: 5.57
    haut: 9.09
    montee_en_charge:
      '2027': 0
      '2028': 0.8
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: inflation_2028 * (prestations * f + pensions * (1 - part_petites) * (1 - retour_pensions))
    parametres:
      inflation_2028:
        valeur: 1.721
        unite: '% de revalorisation 2028 évitée'
        source: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.PCPIPCH.A
        note: 'la revalorisation légale de 2028 (pensions au 1er janvier, prestations au 1er avril) suit l''inflation de 2027 :
          prix à la consommation 2027 du FMI (WEO avril 2026, 1,72 %, série PCPIPCH ingérée dans data/normalise/fmi-weo).
          Première rédaction : déflateur du PIB 2028 (1,862 %), qui n''est ni l''indice légal ni l''année de référence'
      prestations:
        valeur: 1.0
        unite: Md€ par point (2026)
        bareme: prestations_hors_retraites_revalo_1pct
      f: &id003
        valeur: 1.2106
        bareme: facteur_pib_2025_2032
        unite: facteur 2025→2032
        note: facteur PIB nominal (FMI WEO avril 2026, plan/hypotheses.yaml), indiqué en tête de chiffrage/baremes.yaml
      pensions:
        valeur: 3.5
        unite: Md€ 2032 par point (régimes de base)
        bareme: retraites_revalo_1pct
        note: 'borne basse du barème : régimes de base, seul levier direct de la loi'
      part_petites:
        valeur: 0.154
        unite: part de la masse des pensions épargnée
        source: https://data.drees.solidarites-sante.gouv.fr/api/explore/v2.1/catalog/datasets/4178_distribution-des-pensions-mensuelles/attachments/eir2020_distribution_des_pensions_mensuelles_xlsx
        note: 'DREES EIR 2020 (tableau 5) : 36,1 % des retraités ont une pension totale < 1 200 € bruts, soit environ 15,4
          % de la masse (calcul par milieux de tranche) ; bas 23,0 % (< 1 400 €), haut 9,6 % (< 1 000 €)'
      retour_pensions:
        valeur: 0.14
        unite: part de la revalorisation brute des pensions qui revient aux APU (CSG, CRDS, CASA, IR)
        bareme: retour_prelevements_pensions
        note: 'convention commune 3 ; bas 0,18 (petites pensions épargnées : pensions gelées plus imposées), haut 0,14 ;
          prestations hors retraites sans retour (minima et prestations non imposables)'
    explication: 'Gel en 2028 de la revalorisation légale (inflation 2027 ≈ 1,72 %) : prestations hors retraites (1 Md€ par point,
      × 1,2106) et pensions des régimes de base (3,5 Md€ par point en 2032) hors « petites retraites », nettes des
      prélèvements qui reviennent aux APU (convention commune 3 : × (1 − 0,14) ; bas 0,18). Effet de niveau permanent
      (pas de rattrapage annoncé). Haut : pensions complémentaires gelées aussi (5,0 Md€ par point) et seuil de petite retraite
      bas ; bas : seuil à 1 400 € et masse de prestations basse. Convention de droit constant : l''indexation est la référence,
      la sous-indexation une économie.'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: "Citation retrouvée dans la source (récupérée le 2026-09-29). Source : « gèlera temporairement » (effet de niveau conservé). Correction : la revalorisation légale de 2028 suit l'inflation de 2027 (prix à la consommation 1,72 % selon le FMI, série PCPIPCH présente dans data/normalise), et non le déflateur du PIB de 2028 (1,862 %). Central 7,77 → 7,18 Md€ (bas 6,41, haut 10,18). Part des petites retraites (15,4 % pour < 1 200 €) recalculée à partir du tableau 5 de la DREES : exacte, mais la table porte sur la pension de base seule (les seuils en pension totale protègent moins de monde : bas 23 %, haut 9,6 % couvrent la fourchette). Barème retraites_revalo_1pct brut de CSG et d'IR (retour non déduit, environ 0,5 Md€). Recalé sur les conventions communes du 29/09 : économie sur les pensions nette de retour_prelevements_pensions (0,14 au central et au haut, 0,18 au bas, les pensions gelées étant les plus élevées ; prestations hors retraites sans retour) ; central 7,18 → 6,47, bas 6,41 → 5,57, haut 10,18 → 9,09. Facteur de projection renvoyé au barème facteur_pib_2025_2032 (valeur inchangée)."
