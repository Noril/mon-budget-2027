- id: droit-au-brut-13e-mois
  libelle: '« Droit au brut » : baisse des cotisations salariales, +250 € nets par mois au salaire médian'
  domaine: prélèvements sociaux / salaires
  citation:
    texte: Dès le début de son mandat, il fixe l'objectif d'offrir l'équivalent d'un 13ᵉ mois pour les classes moyennes qui
      travaillent, avec une hausse ciblée de 250 € nets par mois pour les salariés au salaire médian (2 200 €). Ce dispositif
      s'accompagnera d'une suppression des cotisations financée à l'euro près par des économies sur le modèle social, ainsi
      que par un investissement massif dans l'intelligence artificielle pour stimuler la productivité nationale et rattraper
      le retard de croissance par rapport aux États-Unis.
