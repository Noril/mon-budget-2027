    comme la dotation de 1 000 € par naissance d''attal-renaissance (capitalisation-1000-euros-naissance), comptée en dépense.
    Le financement n''est pas précisé (les dividendes des autoroutes reprises en régie à partir de 2031, proposition 231,
    doivent aussi abonder ces livrets). Calendrier : la réforme des retraites passe par un an de concertation et un référendum
    en avril 2028 (proposition 161) : premiers versements en 2029. Haut = 0 : comptes purement notionnels tenus par un Fonds
    France classé dans les administrations publiques (flux interne, coût différé au versement des rentes, comme les dotations
    au Fonds de réserve pour les retraites).'
