- id: budget-decarbonation-4-5md-par-an
  libelle: Budget d'atténuation et d'adaptation augmenté d'environ 4,5 Md€ chaque année
  domaine: transition écologique
  citation:
    texte: En prenant comme indicateur cette valeur tutélaire du carbone, actuellement autour de 200 euros, cela signifie
      une augmentation chaque année de l’ordre de 4,5 milliards d’euros du budget d’atténuation et d’adaptation de la France
      en mobilisant l’ensemble des leviers, notamment la taxe d’encadrement du prix du carbone et les investissements du Fonds
      France.
    url: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-1.html
    date: '2026-11-20'
    support: programme (site de La France humaniste)
  precision: partielle
  interpretation: 'Lecture centrale : hausse cumulative, +4,5 Md€ à chaque budget de 2028 à 2032, soit +22,5 Md€ par an en
    2032 par rapport au budget actuel. Bas : six hausses (dès une loi de finances rectificative 2027), 27 Md€. Haut : une
    seule hausse de 4,5 Md€ (lecture non cumulative). Le financement par la « taxe d''encadrement du prix du carbone » est
    traité dans encadrement-prix-gaz et encadrement-prix-carburants (non chiffrés) ; la part apportée par les investissements
    du Fonds France en fonds propres serait une opération financière sans effet sur le solde, ce qui plaide pour le haut.
    Chevauchement possible avec le leasing social (leasing-social-un-million) et la stratégie agricole (agriculture-1-5md),
    chiffrés à part.'
