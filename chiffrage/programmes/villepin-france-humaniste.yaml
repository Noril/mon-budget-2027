annonce_candidat:
  cout_md: null
  financement_md: null
  texte: 'Pas de chiffrage global du coût ni du financement publié au 20 novembre 2026. Montants revendiqués dans le programme
    : déficit sous 3 % du PIB en 2031 (2,9 %), hypothèse de croissance de 0,8 % les premières années ; extinction des niches
    par « paliers de l''ordre de 35 milliards d''euros par an », affectés par tiers à la compensation, à des politiques publiques
    et au déficit ; « redistribution de 33 milliards d''euros supplémentaires par an » contre les inégalités ; bascule de
    « plus de 200 milliards » de cotisations vers la CSG en dix ans ; budget d''atténuation et d''adaptation augmenté « chaque
    année de l''ordre de 4,5 milliards » ; retraite par capitalisation publique de « 15 milliards annuels » ; 3 Md€ par an
    contre les violences faites aux femmes et aux enfants ; 5 Md€ de crédits de recherche en fin de quinquennat ; 1,5 Md€
    par an pour l''agriculture ; Fonds France mobilisant 100 Md€ ; foncières industrielles de 10 Md€.'
  url: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-1.html
notes: 'Ajout du 20 novembre 2026 : programme « Réussir à nouveau » publié le jour de la déclaration de candidature, lu en
  texte intégral (25 chapitres). Chiffrage à droit constant (chiffrage/REFERENCE.md) avec les barèmes communs ; mêmes chiffrages
  que les autres programmes pour les mêmes promesses (point d''indice, ISF, APD, enseignants, leasing social). Les propositions
  non budgétaires sont regroupées par thème (NON_BUDGETAIRE). Trois lectures pèsent sur le solde et sont à relire : l''extinction
  des niches (un tiers de 175 Md€ affecté au déficit, règle 6), la hausse cumulative du budget de décarbonation (4,5 Md€ de
  plus chaque année) et le classement comptable des 15 Md€ annuels de capitalisation publique. Le financement par l''encadrement
  du prix du gaz n''a qu''une estimation indicative. Vérification indépendante à faire (statut ok de l''auteur seulement).'
mesures:
- id: extinction-niches-fiscales-sociales
  libelle: Éteindre en cinq ans toutes les niches fiscales et sociales, par paliers de 35 Md€ par an, dont un tiers affecté
    au déficit
  domaine: fiscalité
  citation:
    texte: Éteindre l’ensemble des privilèges fiscaux, des niches sociales et fiscales, par paliers et sur cinq ans dans le
      cadre d’une loi d’extinction de « Nuit du Quatre Août » qui prévoit une conférence fiscale permanente pour évaluer en
      temps réel l’impact des suppressions de niches. Cela représente des paliers de l’ordre de 35 milliards d’euros par an
      qui seront affectés par tiers à la compensation des effets de la fin des niches, à la mise en œuvre de politiques publiques
      plus effectives et au comblement du déficit public.
    url: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-5.html
    date: '2026-11-20'
    support: programme (site de La France humaniste)
  precision: partielle
  interpretation: 'Lecture : cinq paliers annuels de 35 Md€ (euros courants), de la LFI 2028 à la LFI 2032, soit 175 Md€ de
    niches éteintes en 2032, ce qui correspond à l''ordre de grandeur de l''ensemble des niches (dépenses fiscales de l''État,
    91,8 Md€ en 2025, et allègements généraux de cotisations, 75,6 Md€ : 203,8 Md€ en euros 2032). Chaque palier est affecté
    par tiers : compensation des effets de la fin des niches, politiques publiques, réduction du déficit. Les deux premiers
    tiers sont une recette affectée à une dépense (ou à une baisse d''impôt) : effet nul sur le solde ; seul le dernier tiers
    l''améliore. Économie ciblée sur un périmètre nommé sans liste des niches (règle 6) : central = montant annoncé, plafonné
    par le périmètre ; bas = 0 ; haut = central. Les dépenses nommées ailleurs comme financées par ce redéploiement (150 000
    emplois associatifs, chèque fiscal associatif, conversion des aides à la pierre) font partie des deux tiers redéployés
    : elles ne sont pas comptées une seconde fois. Lecture basse non retenue au central : 35 Md€ au total (un seul palier),
    soit 11,7 Md€ pour le déficit. La loi d''extinction contredit en partie d''autres propositions qui créent ou étendent
    des exonérations (pacte Dutreil étendu, successions affinitaires) : non déduit.'
  effets_retour: Le candidat attend des gains d'efficacité ; l'effet de la fin des allègements sur l'emploi n'est pas compté
    (règle 3).
  chiffrable: true
  economie_non_detaillee: true
  nature: recette
  effet_solde_primaire:
    central: 58.33
    bas: 0.0
    haut: 58.33
    montee_en_charge: &id001
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1
  calcul:
    formule: min(palier * paliers, (niches_fiscales + allegements) * f) * part_deficit
    parametres:
      palier:
        valeur: 35
        source: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-5.html
        unite: Md€ par palier annuel (euros courants)
      paliers:
        valeur: 5
        source: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-5.html
        unite: paliers (LFI 2028 à 2032)
        note: « par paliers et sur cinq ans »
      niches_fiscales:
        valeur: 91.8
        bareme: depenses_fiscales_total
        unite: Md€ (2025)
      allegements:
        valeur: 75.6
        bareme: allegements_generaux_cout
        unite: Md€ (2025)
        note: principale niche sociale ; les autres exonérations ne sont pas ajoutées (plafond prudent)
      f:
        valeur: 1.2177
        bareme: facteur_pib_2025_2032
        unite: facteur 2025→2032
      part_deficit:
        valeur: 0.3333
        source: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-5.html
        unite: part affectée au comblement du déficit
        note: « affectés par tiers »
    explication: 'min(35 × 5, (91,8 + 75,6) × 1,2177) × 1/3 = min(175 ; 203,8) / 3 = 58,33 Md€ en 2032. Montée en charge d''un
      palier par an (0,2 en 2028 à 1 en 2032). Règle 6 : bas = 0 (économie non réalisée), haut = central. Le coût d''une dépense
      fiscale n''est pas le gain de sa suppression (comportements) : le plafond par le périmètre est un majorant.'
  confiance: faible
  verification:
    statut: conteste
    par: verificateur-sonnet
    date: '2026-11-20'
    commentaire: Vérification indépendante du 20/11/2026 (conteste) — formule rejouée (58,33 = min(175 ; 203,8) / 3), règle 6 respectée ; lecture contestée, le texte dit « paliers de l'ordre de 35 milliards d'euros par an » sans total, cinq paliers cumulés (175 Md€, 86 % des dépenses fiscales et allègements généraux) non prouvés, lecture d'un seul palier 11,7 Md€. Trace de l'auteur — Chiffrage de l'auteur, à vérifier indépendamment. Citation relue dans le chapitre 5 ; formule rejouée (58,33).
