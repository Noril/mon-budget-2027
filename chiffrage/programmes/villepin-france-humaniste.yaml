  citation:
    texte: un étage de solidarité nationale sous forme d’une retraite par capitalisation publique à rendement fixe dans le
      cadre du Fonds France, à hauteur de 15 milliards annuels, versés sur les comptes individuels des Françaises et des Français
      auprès du Fonds France.
    url: https://lafrancehumaniste.fr/programme/reussir-a-nouveau/chapitre-16.html
