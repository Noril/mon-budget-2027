annonce_candidat:
  cout_md: null
  financement_md: 140
  texte: >-
    Aucun chiffrage global publié par Éric Zemmour lui-même. Le volet budgétaire de Reconquête est porté par Sarah Knafo
    : « 140 milliards d'économies par an. Au minimum. […] 24 mesures : tout est listé, chiffré, sourcé » (site budget2026.fr),
    après 130 Md€ dans « Le Casse du siècle » (Fayard, 2 septembre 2026) et 80 Md€ dans le contre-budget d'octobre 2025.
    Ces économies financent des baisses d'impôts : suppression de la CSG sur les revenus d'activité, des droits de succession
    et des impôts de production, baisse d'un tiers de l'accise sur les carburants (« 12 milliards d'euros de manque à
    gagner pour l'État »). Pas de coût total publié pour ces baisses.
  url: https://www.budget2026.fr/
notes: >-
  Pas de programme présidentiel 2027 publié au 29 septembre 2026 ; la déclaration formelle est attendue en octobre. Hypothèse
  de collecte : le programme économique du candidat est le plan de Sarah Knafo (vice-présidente de Reconquête, directrice
  de campagne en 2022), parce que (1) le site du parti (parti-reconquete.fr) renvoie à ses sites et à son livre, (2)
  le simulateur carburant présente la baisse de l'accise comme la politique « avec Sarah Knafo et Éric Zemmour », (3)
  É. Zemmour a salué le livre à Port-Marly (« Les Français ont été les victimes du plus grand casse du siècle »). Aucune
  de ces mesures n'a encore été reprise mot pour mot par le candidat : toutes les citations Knafo sont marquées dans
  `interpretation`, et le fichier devra être revu à la publication du programme. Mesures propres au candidat en 2026
  : retraite à 64 voire 65 ans, « remigration » (expulsion des étrangers chômeurs depuis un an, des détenus et délinquants
  étrangers, des clandestins), IA et nucléaire. Le programme présidentiel 2022 (baisse des impôts de production de 30
  Md€, 64 ans, etc.) n'est retenu que lorsqu'il a été reconfirmé. Le contre-budget d'octobre 2025 (rejet de mesures du
  PLF 2026 : surtaxe d'IS, CDHR, hausse de la contribution à l'UE) n'est pas repris : il visait la loi de finances 2026,
  non le programme 2027. Chiffrage (phase 2) : quand le seul chiffre disponible est celui du candidat (ou de Sarah Knafo),
  il est projeté en 2032 au PIB nominal, le central le reprend et le bas retient la moitié de l'économie (convention,
  paramètre « convention du chiffrage ») ; les enveloppes d'économies non détaillées suivent la règle 6 (central 0, haut
  = écart d'affichage).
mesures:
  - id: suppression-csg-activite
    libelle: Suppression de la CSG sur les revenus d'activité
    domaine: fiscalite
    citation:
      texte: >-
        Une mesure révolutionnaire : la suppression de la CSG sur les revenus d’activité. C’est 10% de salaire net en
        plus pour tous les actifs, sans un centime de coût du travail en plus
      url: >-
        https://www.cnews.fr/france/2026-08-30/impots-depenses-csg-droits-de-succession-sarah-knafo-devoile-15-mesures-pour
      date: '2026-08-30'
      support: presse (propos de Sarah Knafo au JDD)
    precision: precise
    interpretation: >-
      Proposition de Sarah Knafo, présentée comme la « mesure majeure » financée par les 130 Md€ d'économies (TF1, 7
      septembre 2026). Perte de recettes de sécurité sociale : CSG sur revenus d'activité (salaires et revenus des indépendants,
      9,2 %), hors CSG sur remplacement et capital. Compensation à la sécurité sociale non précisée.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -116.26
      bas: -124.08
      haut: -113.43
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(taux - deductible * retour_ir) * point * f
      parametres:
        taux:
          valeur: 9.2
          source: >-
            https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
          unite: points
          note: taux facial de la CSG sur les revenus d'activité
        deductible:
          valeur: 6.8
          source: >-
            https://web.archive.org/web/20240812043624/https://www.urssaf.fr/accueil/outils-documentation/taux-baremes/taux-cotisations-secteur-public.html
          unite: points
          note: part déductible de l'IR de la CSG d'activité (6,8 points sur 9,2 ; barème csg_point, dérivation)
        retour_ir:
          valeur: 0.12
          source: chiffrage/REFERENCE.md, conventions communes n° 5 (barème csg_point, dérivation)
          unite: part du rendement de la CSG déductible supprimée qui revient en impôt sur le revenu
          note: convention 10 à 15 % ; 0,12 au central (11,71 × 0,88 ≈ 10,3 Md€ net par point), 0,10 au bas, 0,15 au haut
        point:
          valeur: 11.71
          bareme: csg_point_activite
          unite: Md€ par point de taux
          note: >-
            valeur de point 2026 (p) de la CSG d'activité après la réforme de l'assiette des indépendants, déjà dans la
            loi (barème csg_point_activite : 12,03 en 2025)
        f:
          valeur: 1.1842
          bareme: facteur_pib_2026_2032
          unite: facteur
          note: PIB nominal 2032 / 2026 = 1,2106 / 1,0223
      explication: >-
        Rendement de la CSG d'activité = taux × valeur du point 2026 (11,71 Md€, après la réforme de l'assiette des
        indépendants déjà votée), projeté 2026→2032, net du retour d'impôt sur le revenu : la CSG déductible (6,8 points)
        disparaît, l'assiette de l'IR augmente ; convention commune 5 : 12 % du rendement de la part déductible au
        central (10 % au bas, 15 % au haut). Bas : point 2025 (12,03), facteur 2025→2032 et retour 10 %
        ((9,2 − 0,68) × 12,03 × 1,2106 = 124,1). Haut : point 2026 et retour 15 % (113,4).
    effets_retour: >-
      Hausse de 10 % du salaire net invoquée comme soutien à la consommation et à l'offre de travail : non comptée.
    confiance: moyenne
    verification:
      statut: corrige
      par: verificateur-sonnet
      date: '2026-09-29'
      commentaire: >-
        Citation retrouvée sur l'URL. Point de CSG d'activité relu dans le tableau 6 de la CCSS (mai 2026) : 12,03 Md€
        en 2025 mais 11,71 en 2026 (p) après la réforme de l'assiette des indépendants, déjà dans le droit. Central
        recalculé sur le droit de 2026 : 9,2 × 11,71 × 1,1842 = 127,6 Md€ au lieu de 134,0 (le haut initial mélangeait
        le point 2026 et le facteur 2025). Bas conservé (point 2025). Retour d'IR de la perte de déductibilité (6,8
        points) non chiffré : coût net surestimé, source publique à trouver.
        Recalé sur les conventions communes du 29/09 : point de CSG d'activité renvoyé au barème csg_point_activite (11,71)
        et retour d'IR sur la part déductible (6,8 points) compté selon la convention 5 (12 % au central, 10 à 15 % en
        fourchette) ; central −127,6 → −116,3, bas −134,0 → −124,1, haut −127,6 → −113,4.
  - id: suppression-droits-succession
    libelle: Suppression des droits de succession
    domaine: fiscalite
    citation:
      texte: Nous devons abolir les droits de succession
      url: >-
        https://www.cnews.fr/france/2026-08-30/impots-depenses-csg-droits-de-succession-sarah-knafo-devoile-15-mesures-pour
      date: '2026-08-30'
      support: presse (propos de Sarah Knafo au JDD)
    precision: precise
    interpretation: >-
      Droits de succession seuls (≈ 16 Md€ en 2024), droits de donation maintenus (lecture littérale) ; lecture haute
      : droits de mutation à titre gratuit en entier (+ ≈ 4,9 Md€ de donations). Le contre-budget d'octobre 2025 chiffrait
      déjà la suppression à 16 Md€. En 2022, É. Zemmour proposait seulement d'exonérer « une large majorité » des Français
      : reconfirmation par le candidat à obtenir.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -20.13
      bas: -25.34
      haut: -20.13
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(successions_2026 * f)
      parametres:
        successions_2026:
          valeur: 16.995
          source: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
          unite: Md€ (PLF 2026)
          note: droits de succession seuls (ligne 1706), hors donations
        f:
          valeur: 1.1842
          bareme: facteur_pib_2026_2032
          unite: facteur
          note: >-
            PIB nominal 2032 / 2026 = 1,2106 / 1,0223 (croissance nominale 2026 : 0,858 % en volume, 1,358 % de déflateur)
      explication: >-
        Droits de succession 2026 projetés au PIB (la tendance historique est plus rapide). Bas : droits de mutation
        à titre gratuit en entier, donations comprises (barème dmtg_rendement).
    confiance: moyenne
    verification:
      statut: ok
      par: verificateur-sonnet
      date: '2026-09-29'
      commentaire: >-
        Citation retrouvée sur l'URL. Droits de succession 16,995 Md€ (ligne 1706, PLF 2026) relus dans le rapport
        général du Sénat ; projection au PIB prudente ; bas = ensemble des mutations à titre gratuit. Lecture
        littérale (successions seules) cohérente.
        Recalé sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2026_2032
        (valeur inchangée).
  - id: suppression-impots-production
    libelle: Suppression des impôts de production
    domaine: fiscalite
    citation:
      texte: >-
        Parmi elles figurent notamment la suppression des droits de succession, la mise en place d'un système de retraite
        par capitalisation ou encore la suppression des impôts de production.
      url: https://fr.finance.yahoo.com/actualites/130-milliards-d%C3%A9conomies-sarah-knafo-103113554.html
      date: '2026-09-07'
      support: presse
    precision: vague
    interpretation: >-
      Périmètre non publié : CFE, C3S et CVAE résiduelle a minima (lecture basse) ; taxe foncière des entreprises, versement
      mobilité, taxes sur salaires (lecture haute « impôts de production » au sens Insee, ≈ 70 Md€ ?). Le programme 2022
      de Zemmour visait 30 Md€ de baisse. Collectivités compensées par l'État.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -12.73
      bas: -99.67
      haut: -12.73
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -((cfe + c3s) * f * (1 - retour_is))
      parametres:
        cfe:
          valeur: 7.7
          source: https://www.fipeco.fr/fiche/Les-imp%C3%B4ts-sur-la-production
          unite: Md€ (2024)
          note: cotisation foncière des entreprises
        c3s:
          valeur: 5.2
          bareme: c3s_rendement
          unite: Md€/an
        f:
          valeur: 1.2336
          bareme: facteur_pib_2024_2032
          unite: facteur
          note: PIB nominal 2032 / 2024
        retour_is:
          valeur: 0.2
          source: >-
            https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/baisse-des-impots-de-production-cvae-et-c3s
          unite: part
          note: retour d'IS au taux moyen effectif de 20 % (Institut Montaigne)
      explication: >-
        Lecture centrale : CFE et C3S (la CVAE est déjà supprimée en 2030 par la loi), nettes du retour d'IS. Bas : tous
        les impôts de production payés par les entreprises (86,8 Md€ en 2024, FIPECO : taxes foncières, taxe sur les
        salaires, versement mobilités…), projetés, sans retour d'IS.
        Vérification : bas = (86,8 − CVAE 3,9 − quotas carbone 2,1) × 1,2336 = 99,67 (la CVAE est déjà supprimée par la loi, les quotas ne sont pas un impôt national).
    confiance: faible
    verification:
      statut: corrige
      par: verificateur-sonnet
      date: '2026-09-29'
      commentaire: >-
        Citation retrouvée sur l'URL. CFE 7,7 et C3S 5,2 relus (FIPECO). Bas corrigé : les 86,8 Md€ d'impôts de
        production comprennent la CVAE (3,9, déjà supprimée par la loi en 2030) et 2,1 Md€ de produit des quotas
        carbone européens (non supprimable) : (86,8 − 3,9 − 2,1) × 1,2336 = 99,7 Md€ au lieu de 107,1. Central (CFE +
        C3S) = lecture basse d'une promesse vague : plausible mais la définition usuelle (Insee) est bien plus large.
        Recalé sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2024_2032
        (valeur inchangée).
  - id: accise-carburants-moins-un-tiers
    libelle: Baisse d'un tiers de l'accise sur les carburants (ex-TICPE)
    domaine: fiscalite
    citation:
      texte: 'La baisse de l’accise : 12 milliards d’euros de manque à gagner pour l’État.'
      url: https://combienjegagne.fr/
      date: 2026-09
    precision: precise
    interpretation: >-
      « Baisser l'accise d'un tiers : 27 centimes de moins par litre d'essence, 24 centimes par litre de gazole ». Montant
      annoncé 12 Md€. Le site oppose ce plan « avec Sarah Knafo et Éric Zemmour » à la baisse de TVA du RN. Perte induite
      de TVA sur l'accise à ajouter (TVA assise sur le prix TTC hors TVA, accise comprise).
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -11.17
      bas: -11.38
      haut: -10.55
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: >-
        -((centime + tva_induite) * (vol_gazole * taux_gazole + vol_essence * taux_essence) / (vol_gazole + vol_essence)
        / 3)
      parametres:
        centime:
          valeur: 0.48
          bareme: ticpe_centime_litre
          unite: Md€/an par centime d'euro par litre
          note: accise seule
        tva_induite:
          valeur: 0.06
          source: >-
            chiffrage/REFERENCE.md, conventions communes n° 6 ; baremes.yaml ticpe_centime_litre (dérivation : TVA non
            déductible ≈ 0,495 × 0,65 × 0,20 ≈ 0,06 Md€ par c€/l, SDES § 4.2.6)
          unite: Md€/an par centime d'euro par litre
          note: accise + TVA induite = 0,54 Md€ par c€/l, chiffre à retenir pour le solde (convention 6)
        vol_gazole:
          valeur: 34.7
          source: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
          unite: milliards de litres (2024)
          note: gazole routier 29,3 Mtep converti (0,845 kg/l), dérivation du barème ticpe_centime_litre
        vol_essence:
          valeur: 14.8
          source: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
          unite: milliards de litres (2024)
          note: supercarburants 11,7 Mtep convertis (0,755 kg/l)
        taux_gazole:
          valeur: 59.4
          source: https://www.fipeco.fr/fiche/Les-taxes-sur-les-carburants
          unite: c€/l (2026)
        taux_essence:
          valeur: 68.29
          source: https://www.fipeco.fr/fiche/Les-taxes-sur-les-carburants
          unite: c€/l (2026, SP95-E5)
      explication: >-
        Baisse moyenne pondérée d'un tiers des taux (≈ 20,7 c€/l) × 0,54 Md€ par c€/l (accise 0,48 + TVA induite 0,06,
        convention commune 6). Bas : borne haute du barème (0,55, TVA induite comprise), haut : borne basse de l'accise
        (0,45, volumes en baisse) + TVA induite, soit 0,51. Les taux restent au-dessus des minima européens (33,0 et
        35,9 c€/l).
    chiffrages_tiers:
      - auteur: Sarah Knafo (simulateur combienjegagne.fr)
        montant_md: -12
        url: https://combienjegagne.fr/
        commentaire: « 12 milliards d'euros de manque à gagner pour l'État »
    effets_retour: 'Hausse des volumes consommés (élasticité-prix) : non comptée.'
    confiance: moyenne
    verification:
      statut: conteste
      par: verificateur-sonnet
      date: '2026-09-29'
      commentaire: >-
        Citation retrouvée sur l'URL. Volumes, taux d'accise (FIPECO 59,40 et 68,29) et barème relus ; central 9,9 Md€
        = accise seule. Mais l'interpretation dit que la TVA induite est à ajouter et le simulateur du candidat
        annonce 12 Md€ : la TVA non déductible (ménages, véhicules de tourisme) sur la baisse de 20,7 c€/l, soit 1 à 2
        Md€, est un effet mécanique absent du central (seul le bas 11,4 la couvre). Part de TVA non déductible non
        trouvée en source publique : je ne peux pas trancher le central.
        Recalé sur les conventions communes du 29/09 : TVA induite comptée au central selon la convention 6 (0,54 Md€
        par c€/l, accise 0,48 + TVA 0,06), ce qui tranche la contestation sur la TVA induite ; central −9,9 → −11,2,
        haut −9,3 → −10,6 (0,51 Md€ par c€/l), bas inchangé (0,55). Statut conteste conservé (règle de recalage) : l'objection
        est levée, à clore par le vérificateur.
  - id: suppression-cee
    libelle: Suppression des certificats d'économie d'énergie
    domaine: energie
    citation:
      texte: >-
        La suppression des CEE : sans impact sur les comptes publics. Nous supprimons une obligation imposée aux énergéticiens,
        qui la répercutent sur vos factures.
      url: https://combienjegagne.fr/
      date: 2026-09
