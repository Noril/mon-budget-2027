        l'objectif. Règle 6 : économie ciblée sur la fonction publique, central = montant annoncé plafonné par
        ce que le droit permet ; bas = 0, haut = central (avant 17,76 et 47,37). Vigilance : la limite aux seuls
        départs en retraite (hors démissions et fins de contrat) est une convention prudente. Recalé sur les
