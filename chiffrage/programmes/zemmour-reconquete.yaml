annonce_candidat:
  cout_md: null
  financement_md: 140
  texte: >-
    Aucun chiffrage global publié par Éric Zemmour lui-même. Le volet budgétaire de Reconquête est porté par Sarah
    Knafo : « 140 milliards d'économies par an. Au minimum. […] 24 mesures : tout est listé, chiffré, sourcé » (site
    budget2026.fr), après 130 Md€ dans « Le Casse du siècle » (Fayard, 2 septembre 2026) et 80 Md€ dans le contre-budget
    d'octobre 2025. Ces économies financent des baisses d'impôts : suppression de la CSG sur les revenus d'activité,
    des droits de succession et des impôts de production, baisse d'un tiers de l'accise sur les carburants (« 12
    milliards d'euros de manque à gagner pour l'État »). Pas de coût total publié pour ces baisses.
  url: https://www.budget2026.fr/
notes: >-
  Pas de programme présidentiel 2027 publié au 29 septembre 2026 ; la déclaration formelle est attendue en octobre.
  Hypothèse de collecte : le programme économique du candidat est le plan de Sarah Knafo (vice-présidente de Reconquête,
  directrice de campagne en 2022), parce que (1) le site du parti (parti-reconquete.fr) renvoie à ses sites et à son
  livre, (2) le simulateur carburant présente la baisse de l'accise comme la politique « avec Sarah Knafo et Éric
  Zemmour », (3) É. Zemmour a salué le livre à Port-Marly (« Les Français ont été les victimes du plus grand casse du
  siècle »). Aucune de ces mesures n'a encore été reprise mot pour mot par le candidat : toutes les citations Knafo sont
  marquées dans `interpretation`, et le fichier devra être revu à la publication du programme. Mesures propres au
  candidat en 2026 : retraite à 64 voire 65 ans, « remigration » (expulsion des étrangers chômeurs depuis un an, des
  détenus et délinquants étrangers, des clandestins), IA et nucléaire. Le programme présidentiel 2022 (baisse des impôts
  de production de 30 Md€, 64 ans, etc.) n'est retenu que lorsqu'il a été reconfirmé. Le contre-budget d'octobre 2025
  (rejet de mesures du PLF 2026 : surtaxe d'IS, CDHR, hausse de la contribution à l'UE) n'est pas repris : il visait la
  loi de finances 2026, non le programme 2027.
mesures:
  # --- Baisses d'impôts ------------------------------------------------------------------------------------------
  - id: suppression-csg-activite
    libelle: Suppression de la CSG sur les revenus d'activité
    domaine: fiscalite
    citation:
      texte: "Une mesure révolutionnaire : la suppression de la CSG sur les revenus d’activité. C’est 10% de salaire net en plus pour tous les actifs, sans un centime de coût du travail en plus"
      url: https://www.cnews.fr/france/2026-08-30/impots-depenses-csg-droits-de-succession-sarah-knafo-devoile-15-mesures-pour
      date: 2026-08-30
      support: presse (propos de Sarah Knafo au JDD)
    precision: precise
    interpretation: >-
      Proposition de Sarah Knafo, présentée comme la « mesure majeure » financée par les 130 Md€ d'économies (TF1, 7
      septembre 2026). Perte de recettes de sécurité sociale : CSG sur revenus d'activité (salaires et revenus des
      indépendants, 9,2 %), hors CSG sur remplacement et capital. Compensation à la sécurité sociale non précisée.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: suppression-droits-succession
    libelle: Suppression des droits de succession
    domaine: fiscalite
    citation:
      texte: "Nous devons abolir les droits de succession"
      url: https://www.cnews.fr/france/2026-08-30/impots-depenses-csg-droits-de-succession-sarah-knafo-devoile-15-mesures-pour
      date: 2026-08-30
      support: presse (propos de Sarah Knafo au JDD)
    precision: precise
    interpretation: >-
      Droits de succession seuls (≈ 16 Md€ en 2024), droits de donation maintenus (lecture littérale) ; lecture haute :
      droits de mutation à titre gratuit en entier (+ ≈ 4,9 Md€ de donations). Le contre-budget d'octobre 2025 chiffrait
      déjà la suppression à 16 Md€. En 2022, É. Zemmour proposait seulement d'exonérer « une large majorité » des
      Français : reconfirmation par le candidat à obtenir.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: suppression-impots-production
    libelle: Suppression des impôts de production
    domaine: fiscalite
    citation:
      texte: "Parmi elles figurent notamment la suppression des droits de succession, la mise en place d'un système de retraite par capitalisation ou encore la suppression des impôts de production."
      url: https://fr.finance.yahoo.com/actualites/130-milliards-d%C3%A9conomies-sarah-knafo-103113554.html
      date: 2026-09-07
      support: presse
    precision: vague
    interpretation: >-
      Périmètre non publié : CFE, C3S et CVAE résiduelle a minima (lecture basse) ; taxe foncière des entreprises,
      versement mobilité, taxes sur salaires (lecture haute « impôts de production » au sens Insee, ≈ 70 Md€ ?). Le
      programme 2022 de Zemmour visait 30 Md€ de baisse. Collectivités compensées par l'État.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: accise-carburants-moins-un-tiers
    libelle: Baisse d'un tiers de l'accise sur les carburants (ex-TICPE)
    domaine: fiscalite
    citation:
      texte: "La baisse de l’accise : 12 milliards d’euros de manque à gagner pour l’État."
      url: https://combienjegagne.fr/
      date: 2026-09
    precision: precise
    interpretation: >-
      « Baisser l'accise d'un tiers : 27 centimes de moins par litre d'essence, 24 centimes par litre de gazole ». Montant
      annoncé 12 Md€. Le site oppose ce plan « avec Sarah Knafo et Éric Zemmour » à la baisse de TVA du RN. Perte
      induite de TVA sur l'accise à ajouter (TVA assise sur le prix TTC hors TVA, accise comprise).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: suppression-cee
    libelle: Suppression des certificats d'économie d'énergie
    domaine: energie
    citation:
      texte: "La suppression des CEE : sans impact sur les comptes publics. Nous supprimons une obligation imposée aux énergéticiens, qui la répercutent sur vos factures."
      url: https://combienjegagne.fr/
      date: 2026-09
    precision: precise
    chiffrable: false
    raison_non_chiffrable: >-
      Les CEE sont une obligation privée hors comptes publics : pas d'effet direct sur le solde (sauf si des aides
      publiques devaient reprendre les rénovations financées par les CEE, non prévu).
  # --- Retraites --------------------------------------------------------------------------------------------------
  - id: retraite-64-voire-65
    libelle: Âge légal de départ à 64 ans, voire 65 ans
    domaine: retraites
    citation:
      texte: "Éric Zemmour, président de Reconquête, dit être favorable au départ à “la retraite à 64 ans voire 65”"
      url: https://www.bfmtv.com/politique/elections/presidentielle/video-eric-zemmour-president-de-reconquete-dit-etre-favorable-au-depart-a-la-retraite-a-64-ans-voire-65_VN-202609170934.html
      date: 2026-09-17
      support: presse (titre de la vidéo BFMTV)
    precision: vague
    interpretation: >-
      Par rapport à la législation au 1er janvier 2027 (réforme 2023 suspendue jusqu'au 1er janvier 2028 puis reprise
      vers 64 ans) : 64 ans = sortie de la suspension (léger gain 2027-2031, nul en 2032 si 64 ans est atteint), 65 ans =
      économie supplémentaire. Calendrier et durée de cotisation non précisés. Lecture centrale : 64 ans sans suspension ;
      haut : 65 ans à terme.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: retraite-capitalisation
    libelle: Introduction d'un système de retraite par capitalisation
    domaine: retraites
    citation:
      texte: "Parmi elles figurent notamment la suppression des droits de succession, la mise en place d'un système de retraite par capitalisation ou encore la suppression des impôts de production."
      url: https://fr.finance.yahoo.com/actualites/130-milliards-d%C3%A9conomies-sarah-knafo-103113554.html
      date: 2026-09-07
      support: presse
    precision: vague
    chiffrable: false
    raison_non_chiffrable: >-
      Modalités inconnues (part des cotisations basculée, financement de la transition) : trop vague pour être chiffré ;
      une bascule partielle de cotisations créerait un besoin de financement du régime par répartition.
  # --- Économies (plan Knafo, 24 mesures) --------------------------------------------------------------------------
  - id: plan-140-md-economies
    libelle: Enveloppe globale de 140 Md€ d'économies annuelles « au minimum »
    domaine: etat
    citation:
      texte: "Les Français ont trop payé. Il est temps de dépenser moins pour taxer moins. 24 mesures : tout est listé, chiffré, sourcé."
      url: https://www.budget2026.fr/
      date: 2026-09
    precision: partielle
    interpretation: >-
      Total revendiqué 140 Md€ (livre : 130 Md€). Les 24 mesures sont détaillées ci-dessous ; cette entrée sert à
      rapprocher leur somme chiffrée du total affiché (règle 6 : central = somme documentée, haut = 140). Ne pas
      additionner cette entrée aux mesures détaillées.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: non-remplacement-800000-departs
    libelle: Non-remplacement de 800 000 départs dans les fonctions administratives sur le quinquennat
    domaine: fonction-publique
    citation:
      texte: "Non-remplacement de 800 000 départs administratifs sur l’ensemble du quinquennat, sur 2,3 millions de départs naturels."
      url: https://www.budget2026.fr/
      date: 2026-09
    precision: precise
    interpretation: >-
      Montant affiché : 40 Md€/an. Enseignants, soignants, policiers et militaires épargnés (Essentiel de l'Éco) : les
      départs en retraite hors ces catégories pourraient ne pas suffire (≈ 137 000 départs/an toutes catégories en 2024).
      Les trois versants (État, territoriale, hospitalière) sont concernés : effet APU.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    chiffrages_tiers:
      - auteur: François Ecalle (Fipeco), cité par franceinfo
        montant_md: 35
        url: https://www.franceinfo.fr/vrai-ou-fake/vrai-ou-faux-sarah-knafo-a-t-elle-raison-de-denoncer-dans-son-livre-un-casse-du-siecle-orchestre-par-l-etat-au-detriment-des-contribuables_8175293.html
        date: 2026-09-08
        commentaire: >-
          « une réduction effective de 800 000 emplois pourrait rapporter de l'ordre de 30 à 40 milliards d'euros par
          an » (milieu de fourchette consigné), réalisme jugé faible sans réorganisation profonde.
  - id: gains-productivite-ia-administration
    libelle: Gains de productivité de l'IA dans les fonctions administratives
    domaine: fonction-publique
    citation:
      texte: "Gains de productivité de l’intelligence artificielle dans les fonctions administratives (estimation calculée à partir du rapport IGF-IGAS 2025)."
      url: https://www.budget2026.fr/
      date: 2026-09
    precision: vague
    interpretation: >-
      Montant affiché : 5 Md€. Recoupe probablement la mesure 800 000 départs (mêmes emplois) : risque de double compte.
      É. Zemmour (Port-Marly) veut l'IA « pour remplacer les fonctionnaires à la retraite ».
