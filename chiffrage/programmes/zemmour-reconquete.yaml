  - id: rsa-limite-trois-ans
    libelle: RSA limité à trois ans pour les bénéficiaires en capacité de travailler
    domaine: social
    citation:
      texte: Limitation à trois ans de l’allocation RSA pour les bénéficiaires en capacité de travailler.
      url: https://www.budget2026.fr/
      date: consulté le 2026-09-29
    precision: partielle
    interpretation: 'Montant affiché : 4,8 Md€. Reports vers d''autres minima et l''hébergement non chiffrés par l''auteure.'
    chiffrable: true
    nature: economie
    effet_solde_primaire:
      central: 5.68
      bas: 0.0
      haut: 5.68
      montee_en_charge:
        '2027': 0.0
        '2028': 0.4
        '2029': 0.7
        '2030': 0.9
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: min(annonce * f, rsa_2023 * part_3ans * (1 - part_etrangers) * f23)
      parametres:
        annonce:
          valeur: 4.8
          source: https://sarahknafo.fr/preuves
          unite: Md€
          note: >-
            chiffre de l'auteure (budget2026.fr), déjà net des étrangers : « La part des allocataires au-delà de trois ans
            est d’environ 40 %, soit des prestations d’environ 5,5 milliards d’euros sur les 13,7 milliards que coûte le
            RSA chaque année. Après exclusion, dans le calcul, des 13 % de bénéficiaires étrangers déjà comptabilisés dans
            la mesure de suppression des aides non contributives pour eux : 4,8 milliards d’économies. » (preuve n° 106)
        f:
          valeur: 1.1842
          bareme: facteur_pib_2026_2032
          unite: facteur
          note: PIB nominal 2032 / 2026 (montant de l'auteure supposé en euros 2026)
        rsa_2023:
          valeur: 12.218
          source: >-
            https://drees.solidarites-sante.gouv.fr/sites/default/files/2025-12/MS2025%20-%20Fiche%2007%20-%20Les%20d%C3%A9penses%20d'allocations.pdf
          unite: Md€ (2023)
          note: >-
            DREES, Minima sociaux 2025, fiche 07 : « Le montant des allocations versées à ce titre s’élève à 12,2 milliards
            d’euros » (tableau 1 : 12 218 M€ en 2023)
        part_3ans:
          valeur: 0.5
          bareme: rsa_part_anciennete_plus_3_ans
          source: >-
            https://drees.solidarites-sante.gouv.fr/sites/default/files/2024-10/MS24%20-%20Fiche%2023%20-%20Le%20revenu%20de%20solidarit%C3%A9%20active%20(RSA).pdf
          unite: part des bénéficiaires
          note: >-
            DREES, Minima sociaux 2024, fiche 23, ancienneté dans le RSA fin 2022 (ensemble) : moins de 1 an 26 %, 1 à 2 ans
            13 %, 2 à 5 ans 25 %, 5 à 10 ans 20 %, 10 ans ou plus 18 % ; au-delà de 3 ans ≈ 38 % + la moitié des 2 à 5 ans
            ≈ 50 % (convention de répartition dans la tranche 2-5 ans ; l'auteure retient 40 %)
        part_etrangers:
          valeur: 0.156
          bareme: rsa_part_foyers_hors_ue
          source: https://questions.assemblee-nationale.fr/q16/16-5157QE.htm
          unite: part
          note: foyers RSA dont le responsable est hors UE/EEE, déjà exclus par la mesure de préférence nationale
        f23:
          valeur: 1.2777
          bareme: facteur_pib_2023_2032
          unite: facteur
      explication: >-
        Règle 6 (économie ciblée sur un périmètre nommé) : montant annoncé (4,8 Md€, déjà net des étrangers selon
        l'auteure) projeté, plafonné par le budget réel du périmètre : allocations RSA (12,2 Md€ en 2023, DREES) × part
        des bénéficiaires présents depuis plus de trois ans (≈ 50 %, DREES) × part non exclue par la préférence nationale
        (84,4 %), projeté, soit 6,6 Md€ : le plafond ne mord pas, central = 4,8 × 1,1842 = 5,68. Bas = 0 (économie non
        réalisée : bénéficiaires jugés inaptes au travail, reports vers d'autres minima et l'hébergement), haut = central.
    chiffrages_tiers:
      - auteur: Sarah Knafo (budget2026.fr)
        montant_md: 4.8
        url: https://www.budget2026.fr/
    confiance: faible
    verification:
      statut: corrige
      par: passe-sources
      date: '2026-09-29'
      commentaire: >-
        Double déduction corrigée : le chiffre de l'auteure (4,8 Md€) exclut déjà les 13 % d'étrangers
        (sarahknafo.fr/preuves, preuve n° 106) ; la formule le multipliait encore par (1 − 0,156). Plafond du
        périmètre ajouté (règle 6) : allocations RSA 12,2 Md€ en 2023 (DREES, fiche 07) × ≈ 50 % de
        bénéficiaires présents depuis plus de trois ans (DREES, fiche 23) × 84,4 % × 1,2777 ≈ 6,6 Md€, non
        atteint. Central et haut 4,80 → 5,68 ; bas 0. Vérification précédente (verificateur-sonnet, corrige) :
        Citation retrouvée sur l'URL. Annonce 4,8 Md€ projetée nette de la part des non-UE déjà exclue ;
        inférieure au RSA versé (11,7 Md€ × 41 %). Règle 6 : bas = 0, haut = central (avant 2,4 et 5,68). Recalé
        sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2026_2032
        (valeur inchangée).
