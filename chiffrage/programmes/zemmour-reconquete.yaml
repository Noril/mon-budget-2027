annonce_candidat:
  cout_md: null
  financement_md: 140
  texte: >-
    Aucun chiffrage global publié par Éric Zemmour lui-même. Le volet budgétaire de Reconquête est porté par Sarah Knafo
    : « 140 milliards d'économies par an. Au minimum. […] 24 mesures : tout est listé, chiffré, sourcé » (site budget2026.fr),
    après 130 Md€ dans « Le Casse du siècle » (Fayard, 2 septembre 2026) et 80 Md€ dans le contre-budget d'octobre 2025.
    Ces économies financent des baisses d'impôts : suppression de la CSG sur les revenus d'activité, des droits de succession
    et des impôts de production, baisse d'un tiers de l'accise sur les carburants (« 12 milliards d'euros de manque à
    gagner pour l'État »). Pas de coût total publié pour ces baisses.
  url: https://www.budget2026.fr/
notes: >-
  Pas de programme présidentiel 2027 publié au 29 septembre 2026 ; la déclaration formelle est attendue en octobre. Hypothèse
  de collecte : le programme économique du candidat est le plan de Sarah Knafo (vice-présidente de Reconquête, directrice
  de campagne en 2022), parce que (1) le site du parti (parti-reconquete.fr) renvoie à ses sites et à son livre, (2)
  le simulateur carburant présente la baisse de l'accise comme la politique « avec Sarah Knafo et Éric Zemmour », (3)
  É. Zemmour a salué le livre à Port-Marly (« Les Français ont été les victimes du plus grand casse du siècle »). Aucune
  de ces mesures n'a encore été reprise mot pour mot par le candidat : toutes les citations Knafo sont marquées dans
  `interpretation`, et le fichier devra être revu à la publication du programme. Mesures propres au candidat en 2026
  : retraite à 64 voire 65 ans, « remigration » (expulsion des étrangers chômeurs depuis un an, des détenus et délinquants
  étrangers, des clandestins), IA et nucléaire. Le programme présidentiel 2022 (baisse des impôts de production de 30
  Md€, 64 ans, etc.) n'est retenu que lorsqu'il a été reconfirmé. Le contre-budget d'octobre 2025 (rejet de mesures du
  PLF 2026 : surtaxe d'IS, CDHR, hausse de la contribution à l'UE) n'est pas repris : il visait la loi de finances 2026,
  non le programme 2027. Chiffrage (phase 2) : quand le seul chiffre disponible est celui du candidat (ou de Sarah Knafo),
  il est projeté en 2032 au PIB nominal et le central le reprend ; pour une économie ciblée, le bas est nul (économie
  non réalisée) et le haut égal au central (règle 6) ; les enveloppes d'économies non détaillées suivent la règle 6 (central 0, haut
  = écart d'affichage).
mesures:
  - id: suppression-csg-activite
    libelle: Suppression de la CSG sur les revenus d'activité
    domaine: fiscalite
    citation:
      texte: >-
        Une mesure révolutionnaire : la suppression de la CSG sur les revenus d’activité. C’est 10 % de salaire net en
        plus pour tous les actifs, sans un centime de coût du travail en plus.
      url: >-
        https://www.lejdd.fr/politique/exclusif-le-casse-du-siecle-sarah-knafo-fait-le-proces-de-letat-depensier-182118
      date: '2026-08-29'
      support: entretien publié (Sarah Knafo au JDD, propos recueillis par Jules Torres)
    precision: precise
    interpretation: >-
      Proposition de Sarah Knafo, présentée comme la « mesure majeure » financée par les 130 Md€ d'économies (TF1, 7
      septembre 2026). Perte de recettes de sécurité sociale : CSG sur revenus d'activité (salaires et revenus des indépendants,
      9,2 %), hors CSG sur remplacement et capital. Compensation à la sécurité sociale non précisée.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -112.49
      bas: -120.12
      haut: -110.13
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(taux - deductible * retour_ir) * point * f
      parametres:
        taux:
          valeur: 9.2
          bareme: csg_taux_activite
          source: >-
            https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
          unite: points
          note: taux facial de la CSG sur les revenus d'activité
        deductible:
          valeur: 6.8
          bareme: csg_taux_activite_deductible
          source: >-
            https://web.archive.org/web/20240812043624/https://www.urssaf.fr/accueil/outils-documentation/taux-baremes/taux-cotisations-secteur-public.html
          unite: points
          note: part déductible de l'IR de la CSG d'activité (6,8 points sur 9,2 ; barème csg_point, dérivation)
        retour_ir:
          valeur: 0.16
          bareme: retour_ir_csg_deductible
          unite: part du rendement de la CSG déductible supprimée qui revient en impôt sur le revenu
          note: >-
            barème (3,9 Md€ d'IR pour 22,5 Md€ de CSG rendue déductible en 2018, ajusté du barème de l'IR de 2020) :
            0,16 au central (11,71 × 0,84 ≈ 9,8 Md€ net par point), 0,14 au bas, 0,185 au haut. Recoupement plus bas : Fondation IFRAP (mai 2023, https://www.ifrap.org/budget-et-fiscalite/pourquoi-il-faut-rendre-la-csg-totalement-deductible-de-lir-sur-les-revenus-dactivite)
            : « la CSG non déductible sur les revenus d’activité représente en 2021 18,64 milliards d’euros […] conduisant
            probablement à un coût sur l’IR de 2,05 milliards d’euros », soit un retour d'IR de 11 % du rendement rendu
            déductible, sous le bas du barème (lecture prudente de l'IFRAP)
        point:
          valeur: 11.71
          bareme: csg_point_activite
          unite: Md€ par point de taux
          note: >-
            valeur de point 2026 (p) de la CSG d'activité après la réforme de l'assiette des indépendants, déjà dans la
            loi (barème csg_point_activite : 12,03 en 2025)
        f:
          valeur: 1.1842
          bareme: facteur_pib_2026_2032
          unite: facteur
          note: PIB nominal 2032 / 2026 = 1,2106 / 1,0223
      explication: >-
        Rendement de la CSG d'activité = taux × valeur du point 2026 (11,71 Md€, après la réforme de l'assiette des
        indépendants déjà votée), projeté 2026→2032, net du retour d'impôt sur le revenu : la CSG déductible (6,8 points)
        disparaît, l'assiette de l'IR augmente ; barème retour_ir_csg_deductible : 16 % du rendement de la part
        déductible au central (14 % au bas, 18,5 % au haut). Bas : point 2025 (12,03), facteur 2025→2032 et retour 14 %
        ((9,2 − 0,95) × 12,03 × 1,2106 = 120,1). Haut : point 2026 et retour 18,5 % (110,1).
    effets_retour: >-
      Hausse de 10 % du salaire net invoquée comme soutien à la consommation et à l'offre de travail : non comptée.
    confiance: moyenne
    verification:
      statut: corrige
      par: passe-sources
      date: '2026-09-29'
      commentaire: >-
        Citation remplacée par la source primaire (entretien de S. Knafo au JDD du 29/08/2026, verbatim relu ;
        l'article de CNews n'en était que la reprise). Retour d'IR de la convention 5 recoupé par une source
        publique : IFRAP (2023), 2,05 Md€ d'IR pour 18,64 Md€ de CSG d'activité rendue déductible, soit 11 %.
        Montants inchangés. Vérification précédente (verificateur-sonnet, corrige) : Citation retrouvée sur
        l'URL. Point de CSG d'activité relu dans le tableau 6 de la CCSS (mai 2026) : 12,03 Md€ en 2025 mais
        11,71 en 2026 (p) après la réforme de l'assiette des indépendants, déjà dans le droit. Central recalculé
        sur le droit de 2026 : 9,2 × 11,71 × 1,1842 = 127,6 Md€ au lieu de 134,0 (le haut initial mélangeait le
        point 2026 et le facteur 2025). Bas conservé (point 2025). Retour d'IR de la perte de déductibilité (6,8
        points) non chiffré : coût net surestimé, source publique à trouver. Recalé sur les conventions communes
        du 29/09 : point de CSG d'activité renvoyé au barème csg_point_activite (11,71) et retour d'IR sur la
        part déductible (6,8 points) compté selon la convention 5 (12 % au central, 10 à 15 % en fourchette) ;
        central −127,6 → −116,3, bas −134,0 → −124,1, haut −127,6 → −113,4.
        Recalé sur les barèmes sourcés du 29/09 : retour d'IR renvoyé au barème retour_ir_csg_deductible, 0,12
        (0,10-0,15) → 0,16 (0,14-0,185) ; central −116,26 → −112,49, bas −124,08 → −120,12, haut −113,43 → −110,13.
  - id: suppression-droits-succession
    libelle: Suppression des droits de succession
    domaine: fiscalite
    citation:
      texte: Nous devons abolir les droits de succession.
      url: >-
        https://www.lejdd.fr/politique/exclusif-le-casse-du-siecle-sarah-knafo-fait-le-proces-de-letat-depensier-182118
      date: '2026-08-29'
      support: entretien publié (Sarah Knafo au JDD, propos recueillis par Jules Torres)
    precision: precise
    interpretation: >-
      Droits de succession seuls (≈ 17 Md€ en 2026), droits de donation maintenus (lecture littérale) ; lecture large
      (borne basse du solde) : droits de mutation à titre gratuit en entier (+ ≈ 4,4 Md€ de donations). Le contre-budget d'octobre 2025 chiffrait
      déjà la suppression à 16 Md€. En 2022, É. Zemmour proposait seulement d'exonérer « une large majorité » des Français
      : reconfirmation par le candidat à obtenir.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -20.13
      bas: -25.34
      haut: -20.13
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(successions_2026 * f)
      parametres:
        successions_2026:
          valeur: 16.995
          bareme: droits_succession_rendement
          source: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
          unite: Md€ (PLF 2026)
          note: >-
            droits de succession seuls, hors donations (« 1706 Mutations à titre gratuit par décès (successions) 16 233
            16 995 », produit 2025 révisé et 2026 PLF en M€ ; donations, ligne 1705 : 4 423 M€ en 2026)
        f:
          valeur: 1.1842
          bareme: facteur_pib_2026_2032
          unite: facteur
          note: >-
            PIB nominal 2032 / 2026 = 1,2106 / 1,0223 (croissance nominale 2026 : 0,858 % en volume, 1,358 % de déflateur)
      explication: >-
        Droits de succession 2026 projetés au PIB (la tendance historique est plus rapide). Bas : droits de mutation
        à titre gratuit en entier, donations comprises (barème dmtg_rendement).
    confiance: moyenne
    verification:
      statut: ok
      par: passe-sources
      date: '2026-09-29'
      commentaire: >-
        Citation remplacée par la source primaire (entretien de S. Knafo au JDD du 29/08/2026 : « Nous devons
        abolir les droits de succession », verbatim relu). Ligne 1706 du PLF 2026 relue dans le rapport général
        du Sénat (16 995 M€) ; donations (ligne 1705, 4 423 M€) dans le bas. Lecture littérale (successions
        seules) confirmée par l'entretien (« Vous proposez de les supprimer totalement »). Montants inchangés.
        Vérification précédente (verificateur-sonnet, ok) : Citation retrouvée sur l'URL. Droits de succession
        16,995 Md€ (ligne 1706, PLF 2026) relus dans le rapport général du Sénat ; projection au PIB prudente ;
        bas = ensemble des mutations à titre gratuit. Lecture littérale (successions seules) cohérente. Recalé
        sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2026_2032
        (valeur inchangée).
  - id: suppression-impots-production
    libelle: Suppression des impôts de production
    domaine: fiscalite
    citation:
      texte: >-
        Pour l’industrie, elle supprime les impôts de production (CVAE, C3S, CFE) et la surtransposition des règles
        européennes.
      url: https://irdeme.org/les-15-resolutions-de-sarah-knafo-ne-sont-pas-toutes-des-solutions/
      date: '2026-09-19'
      support: compte rendu du livre « Le Casse du siècle » (Fayard, 2 septembre 2026)
    precision: partielle
    interpretation: >-
      Proposition de Sarah Knafo (résolution du livre « Le Casse du siècle »). Source primaire introuvable en ligne (le
      livre n'est pas consultable ; ni budget2026.fr ni l'entretien au JDD ne détaillent la mesure) : le périmètre (CVAE,
      C3S, CFE) est celui du compte rendu de l'IRDEME, repris ici ; Capital (7 septembre 2026) mentionne seulement « la
      suppression des impôts de production ». La CVAE est déjà supprimée en 2030 par la loi (LFI 2025, calendrier inchangé par la LFI 2026) : seule l'avance
      2028-2029 coûte. Taxes foncières des entreprises, versement mobilités et taxe sur les salaires hors du périmètre
      nommé. Collectivités compensées par l'État (CFE), sécurité sociale compensée (C3S) : coût APU inchangé.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -13.06
      bas: -16.32
      haut: -13.06
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
      annuel:
        '2027': 0.0
        '2028': -16.02
        '2029': -16.02
        '2030': -13.06
        '2031': -13.06
        '2032': -13.06
    calcul:
      formule: -((cfe + c3s) * f * (1 - retour_is)) + 0 * cvae
      parametres:
        cfe:
          valeur: 8.031
          bareme: cfe_rendement
          source: https://www.fipeco.fr/fiche/Les-imp%C3%B4ts-sur-la-production
          unite: Md€ (2024)
          note: cotisation foncière des entreprises
        c3s:
          valeur: 5.2
          bareme: c3s_rendement
          unite: Md€/an
        f:
          valeur: 1.2336
          bareme: facteur_pib_2024_2032
          unite: facteur
          note: PIB nominal 2032 / 2024
        retour_is:
          valeur: 0.2
          bareme: retour_is_impots_production
          source: >-
            https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/baisse-des-impots-de-production-cvae-et-c3s
          unite: part
          note: retour d'IS au taux moyen effectif de 20 % (Institut Montaigne)
        cvae:
          valeur: 3.7
          bareme: cvae_restante
          unite: Md€/an
          note: avance de la suppression déjà votée pour 2030, effet 2028 et 2029 seulement (effet_solde_primaire.annuel)
      explication: >-
        Périmètre nommé (CVAE, C3S, CFE). 2032 : CFE (barème cfe_rendement, 8,031 Md€, produit DGFiP 2024) et C3S
        (barème c3s_rendement, 5,2 Md€), projetées au PIB, nettes du retour d'IS (barème retour_is_impots_production,
        20 %) : (8,031 + 5,2) × 1,2336 × 0,8 = 13,06 Md€. La CVAE, supprimée en 2030 par la loi, ne coûte que son avance
        en 2028 et 2029 (3,7 Md€, barème cvae_restante, nette du retour d'IS de 20 % comme le reste du périmètre, soit 2,96 Md€) : −16,02 ces deux années
        (annuel). Haut = central. Bas : sans retour d'IS, (8,031 + 5,2) × 1,2336 = 16,32. Les autres impôts de
        production au sens de l'Insee sont hors du périmètre nommé.
    confiance: faible
    verification:
      statut: corrige
      par: passe-sources
      date: '2026-09-29'
      commentaire: >-
        Citation de presse (Capital/Yahoo, sans périmètre) remplacée par le compte rendu du livre qui nomme le
        périmètre (IRDEME : « elle supprime les impôts de production (CVAE, C3S, CFE) ») ; source primaire
        (livre) introuvable en ligne. Précision vague → partielle. CFE 7,7 et C3S 5,2 Md€ relus sur FIPECO
        (fiche « Les impôts sur la production »). Bas −99,67 → −15,91 (périmètre nommé, sans retour d'IS) ;
        central et haut inchangés (−12,73) ; avance de la CVAE (−3,7 Md€ en 2028 et 2029, barème cvae_restante)
        portée dans annuel. Vérification précédente (verificateur-sonnet, corrige) : Citation retrouvée sur
        l'URL. CFE 7,7 et C3S 5,2 relus (FIPECO). Bas corrigé : les 86,8 Md€ d'impôts de production comprennent
        la CVAE (3,9, déjà supprimée par la loi en 2030) et 2,1 Md€ de produit des quotas carbone européens (non
        supprimable) : (86,8 − 3,9 − 2,1) × 1,2336 = 99,7 Md€ au lieu de 107,1. Central (CFE + C3S) = lecture
        basse d'une promesse vague : plausible mais la définition usuelle (Insee) est bien plus large. Recalé
        sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2024_2032
        (valeur inchangée).
        Harmonisation des paramètres (30/09/2026) : CFE alignée sur le barème cfe_rendement (7,7 → 8,031 Md€, DGFiP 2024) ; retour d'IS sur retour_is_impots_production ; central −12,73 → −13,06, bas −15,91 → −16,32, annuel 2028-2029 −16,43 → −16,76.
  - id: accise-carburants-moins-un-tiers
    libelle: Baisse d'un tiers de l'accise sur les carburants (ex-TICPE)
    domaine: fiscalite
    citation:
      texte: 'La baisse de l’accise : 12 milliards d’euros de manque à gagner pour l’État.'
      url: https://combienjegagne.fr/
      date: consulté le 2026-09-29
    precision: precise
    interpretation: >-
      « Baisser l'accise d'un tiers : 27 centimes de moins par litre d'essence, 24 centimes par litre de gazole ». Montant
