  - id: remigration-expulsions
    libelle: >-
      « Remigration » - renvoi des détenus et délinquants étrangers, des clandestins, des étrangers chômeurs depuis un
      an et des bénéficiaires exclusifs d'aides
    domaine: immigration
    citation:
      texte: >-
        «Il faut également renvoyer, c'est une évidence, les clandestins . Il faut également renvoyer les chômeurs de
        longue durée, et tous ceux qui vivent uniquement des aides sociales», a-t-il ajouté, fixant la durée de chômage
        à «plus de six mois à un an, un an dirons-nous».
      url: >-
        https://www.lefigaro.fr/elections/presidentielles/presidentielle-2027-eric-zemmour-confirme-qu-il-sera-candidat-durcit-encore-son-discours-sur-l-immigration-20260918
      date: '2026-09-18'
      support: presse (AFP)
    precision: vague
    interpretation: >-
      Propos tenus dans l'émission Face à BFM (BFMTV, 17 septembre 2026) : source primaire introuvable sous forme écrite
      (replay vidéo sans transcription publiée) ; citation reprise de la dépêche AFP. Le discours de Port-Marly (13
      septembre 2026, extrait vidéo CNews https://www.youtube.com/watch?v=hozCe9Dtlgc : « Aucune civilisation n’a jamais
      survécu à un changement de peuple ») porte la même ligne. Effet budgétaire = prestations et allocations chômage non versées moins coût des éloignements (rétention, transport)
      ; volumes non précisés. Recoupe fortement la mesure prestations-non-contributives-francais : ne chiffrer que l'assurance
      chômage et le coût des éloignements pour éviter le double compte.
    chiffrable: false
    raison_non_chiffrable: >-
      Volumes d'étrangers visés (chômeurs depuis un an, bénéficiaires exclusifs d'aides, délinquants) et allocations
      en jeu non publiés ; les prestations non contributives qu'ils perçoivent sont déjà retirées par la mesure prestations-non-contributives-francais
      (double compte) ; coût d'un éloignement forcé : 4 414 € (Cour des comptes, 2022), volume d'éloignements non chiffrable.
    sens_probable: incertain
    estimation_indicative:
      central: 0.2
      bas: -1.5
      haut: 2.0
      lecture: 'Solde de deux effets : allocations chômage non versées aux étrangers chômeurs depuis un an effectivement éloignés
        (≈ 0,5 à 1 Md€), les prestations non contributives étant déjà retirées par prestations-non-contributives-francais et l''AME
        par fin-ame (non recomptées) ; coût d''éloignements forcés à grande échelle (4 414 € l''unité selon la Cour des comptes,
        plus des places de rétention), ≈ 0,5 Md€ pour 100 000 éloignements par an. Bas : éloignements massifs peu suivis d''effet
        ; haut : départs nombreux de chômeurs indemnisés.'
      sources:
      - https://www.ccomptes.fr/fr/publications/la-politique-de-lutte-contre-limmigration-irreguliere
      - assurance_chomage_depenses
      - immigration_depenses_etat
    verification:
      statut: ok
      par: passe-sources
      date: '2026-09-29'
      commentaire: >-
        Citation AFP (Le Figaro) conservée : source primaire (émission Face à BFM du 17/09/2026) sans
        transcription publiée, signalé dans interpretation ; extrait vidéo du discours de Port-Marly ajouté.
        Mesure non chiffrable, estimation indicative inchangée.
