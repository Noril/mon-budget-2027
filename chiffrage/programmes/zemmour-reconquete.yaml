      bas: 0.0
      haut: 70.48
      montee_en_charge:
        '2027': 0.0
        '2028': 0.2
        '2029': 0.4
        '2030': 0.6
        '2031': 0.8
        '2032': 1.0
    calcul:
      formule: 0 * annonce + 0 * documente
      parametres:
        annonce:
          valeur: 140
          source: https://www.budget2026.fr/
          unite: Md€
          note: « 140 milliards d'économies par an. Au minimum. »
        documente:
          valeur: 69.52
          source: somme des mesures d'économie de ce fichier
          unite: Md€ (2032)
