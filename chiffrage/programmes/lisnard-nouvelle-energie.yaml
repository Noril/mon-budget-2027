    baisse de dépenses. L'objectif, c'est trois cent milliards. », La Gagne, 29 août 2026), sans liste chiffrée
    publiée. Gisements nommés : agences et opérateurs (1 200 entités, 440 000 à 500 000 agents, 100 Md€), effectifs
