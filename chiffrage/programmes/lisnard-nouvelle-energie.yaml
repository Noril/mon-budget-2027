- id: csg-activite-9-2-a-6-6
  libelle: Baisser la CSG sur les revenus d'activité de 9,2 % à 6,6 % (alignement sur le taux des retraités)
  domaine: fiscalite
  citation:
    texte: >-
      Il propose d’abaisser la contribution sociale généralisée (CSG) sur les revenus d’activité de 9,2 % à 6,6 %,
      afin d’augmenter directement le salaire net des travailleurs.
    url: https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/
    date: '2026-10-28'
    support: site du parti (compte rendu de l'émission « Objectif Élysée 2027 », CNews et Europe 1, 27 octobre 2026)
  precision: precise
  interpretation: >-
    Baisse de 2,6 points de la CSG sur les revenus d'activité, présentée comme l'une des premières mesures (« comment
    est-il pensable que lorsque vous bossez, que vous êtes salarié ou artisan, vous payez plus de CSG que lorsque
    vous êtes inactif ? », La Gagne, 29 août 2026). Lecture centrale : alignement sur la structure du taux médian
    des pensions (6,6 %, dont 4,2 points déductibles et 2,4 non déductibles) : la baisse porte sur la part déductible
    (6,8 → 4,2), d'où un retour d'impôt sur le revenu (convention commune 5). Fait partie des 120 Md€ rendus aux
    actifs « par une baisse des cotisations » : la ligne cotisations-salaires-120md n'en compte que le reste (pas de
    double compte). Financement annoncé : baisse des dépenses (organismes publics, gel des pensions au-dessus de 2
    200 €), chiffrée dans ses propres lignes.
  chiffrable: true
  nature: baisse_recette
  effet_solde_primaire:
    central: -30.49
    bas: -35.9
    haut: -24.81
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(taux - cible) * point * f * (1 - retour_ir)
    parametres:
      taux:
        valeur: 9.2
        bareme: csg_taux_activite
        unite: points
      cible:
        valeur: 6.6
        unite: points
        source: https://www.unenouvelleenergie.fr/david-lisnard-sur-cnews-et-europe-1-je-ne-suis-pas-candidat-pour-un-poste-je-viens-pour-redresser-le-pays/
        note: « de 9,2 % à 6,6 % »
      point:
        valeur: 11.71
        bareme: csg_point_activite
        unite: Md€ par point de taux (2026)
      f:
        valeur: 1.1921
        bareme: facteur_pib_2026_2032
        unite: facteur PIB nominal 2026→2032
      retour_ir:
        valeur: 0.16
        bareme: retour_ir_csg_deductible
        unite: part de la CSG déductible baissée qui revient en impôt sur le revenu
    explication: >-
      2,6 points × 11,71 Md€ (valeur du point de CSG d'activité en 2026) × 1,1921 (projection 2032) × (1 − 0,16) =
      30,49 Md€. Bas : la baisse porte d'abord sur la part non déductible (2,4 points, sans retour d'IR, plus 0,2
      point déductible au retour de 0,14) : 35,90. Haut : montant non projeté (euros 2026) et retour de 0,185 :
      24,81. Même méthode que la baisse de CSG de Glucksmann et la suppression de la CSG d'activité de Zemmour.
  effets_retour: Hausse du salaire net et de l'offre de travail invoquée par le candidat ; non comptée.
