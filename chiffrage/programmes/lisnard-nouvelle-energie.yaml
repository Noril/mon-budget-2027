annonce_candidat:
  cout_md: 160
  financement_md: 200
  texte: >-
    « Quand on va réussir à diminuer les dépenses, quatre-vingt milliards la première année, qu’on sera en rythme de
    croisière à deux cent milliards […] on va rendre soixante pour cent, c’est-à-dire cent vingt milliards sur les
    deux cent milliards de dépenses en pouvoir d’achat immédiat, tout de suite, par une baisse des cotisations. »
    (Le Crayon, 11 octobre 2026) ; « Vous rendez 40 milliards […] en baisse des impôts de production. Notamment,
    vous commencez par supprimer la C3S. […] 40 autres milliards à l’État en baisse de la dette. » (entretien
    vidéo, 21 janvier 2026) ; « on documente deux cent milliards de baisse de dépenses. L'objectif, c'est trois
    cent milliards. » (La Gagne, 29 août 2026), citations reproduites par Nouvelle Énergie. Coût annoncé : 120 Md€
    de baisse de prélèvements sur les salaires et 40 Md€ d'impôts de production ; financement : 200 Md€ de baisse
    de la dépense à l'horizon 2032, dont 80 Md€ la première année ; solde : 40 Md€ de désendettement. Ventilation
    détaillée de la réforme des pouvoirs publics annoncée pour décembre 2026 (CNews et Europe 1, 27 octobre 2026).
  url: https://www.unenouvelleenergie.fr/questions/que-ferait-david-lisnard-des-200-milliards-d-economies/
notes: >-
  Base documentaire (8 novembre 2026) : pages du programme du site de Nouvelle Énergie (trois axes, dont une partie
  du texte date des travaux de 2021-2022 : elle évoque encore le Covid et la « baisse de 10 milliards déjà prévue
  par le gouvernement »), programmes thématiques (éducation, santé, sécurité, immigration, agriculture), discours
  de Bayeux (17 juin 2026, texte publié), pages « questions » du site, mises à jour le 16 octobre 2026, qui
  reproduisent des citations datées des discours et entretiens (Saint-Raphaël 3 juillet, La Gagne 29 août, Benfeld
  25 septembre, Le Crayon 11 octobre 2026…), compte rendu par le parti de l'émission de CNews et Europe 1 du 27
  octobre 2026, et presse (Planet.fr, Public Sénat, franceinfo). Les vidéos sources (YouTube) n'ont pas pu être
  transcrites ici : les citations orales sont celles que le site de Nouvelle Énergie reproduit entre guillemets ;
  les phrases de compte rendu du parti sont signalées comme telles dans `support`. Les agrégateurs (votons-2027,
  France-Vote, MonVote2027, ÉlyséeScope…) n'ont servi que de pistes. Limites : pas de programme chiffré publié
  ligne à ligne ; les montants varient selon les interventions (100 Md€ d'économies « sur le train de vie de
  l'État » en avril 2026, 200 Md€ documentés et 300 Md€ visés ensuite ; seuil de désindexation des pensions de 2
  000 € puis 2 200 €) ; le candidat annonce une ventilation détaillée en décembre 2026. Chiffrage à droit constant
  (chiffrage/REFERENCE.md) avec les barèmes communs ; mêmes lectures que les autres programmes pour les mesures
  communes (C3S, CVAE, AME, condition de cinq ans, postes non remplacés, âge de 65 ans, hausse de 20 % des
  enseignants, ARS, capitalisation). L'enveloppe de 200 Md€ suit la règle 6 (central = 0, les économies identifiées
  étant chiffrées dans leurs lignes) ; la baisse de 120 Md€ des prélèvements sur les salaires et celle de 40 Md€ des
  impôts de production sont des promesses chiffrées, comptées comme telles (même traitement que la restitution de
  pouvoir d'achat de Retailleau ou la suppression de la CSG de Zemmour). Les 40 Md€ de désendettement ne sont pas une
  mesure (c'est le reste de l'enveloppe). Le refus de financer l'appel d'offres éolien en mer AO10 (X, 26 octobre
  2026) n'est pas retenu : la promesse n'a été lue qu'en paraphrase (Les Énergies renouvelables, 2 novembre 2026),
  et les parcs, mis en service après 2032 sous contrat pour différence, n'auraient pas d'effet sur le solde 2032.
