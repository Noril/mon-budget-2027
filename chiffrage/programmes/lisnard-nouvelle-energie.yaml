candidat: David Lisnard
parti: Nouvelle Énergie
statut_candidature: >-
  Déclaré le 31 mars 2026 au 20 h de France 2, en annonçant son départ des Républicains (Public Sénat, 31 mars
  2026) ; maire de Cannes, président de l'Association des maires de France et fondateur de Nouvelle Énergie
  (2021). Annonce avoir réuni 500 promesses de parrainage le 2 septembre 2026 (AFP, repris par Nouvelle Énergie),
  à confirmer pendant la période officielle de 2027 (« Il faudra les confirmer en février »). Défend depuis le
  printemps 2026 une primaire ouverte de la droite et du centre, jusqu'à Sarah Knafo ; au 8 novembre 2026, Gabriel
  Attal (fin octobre) et Bruno Retailleau (3 novembre, BFMTV : « il faudra une primaire sans doute en début
  d'année ») s'y sont ralliés, Édouard Philippe la refuse : aucune primaire n'est organisée ni datée (franceinfo,
  4 novembre 2026 ; Public Sénat, 6 novembre 2026). Exclut de se retirer (site de Nouvelle Énergie, mis à jour le
  16 octobre 2026).
