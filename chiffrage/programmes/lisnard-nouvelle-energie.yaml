          donne ≈ 0,50 de la masse au-dessus de 1 900 € et ≈ 0,44 au-dessus de 2 050 € (seuil lu en net). Recoupement
          : le gel du PLFSS 2027 au-dessus de 1 281 € rapporterait 4 Md€ contre 6 Md€ pour l''indexation de toutes
