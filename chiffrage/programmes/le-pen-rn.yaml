      bas: -16.34
      haut: -5.23
      montee_en_charge:
        '2027': 0.0
        '2028': 0.1
        '2029': 0.4
        '2030': 0.7
        '2031': 0.9
        '2032': 1.0
    calcul:
      formule: -(cout_2029 * f)
      parametres:
