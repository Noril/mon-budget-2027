  - id: retraites-60-62-ans
    libelle: >-
      Retour de l'âge légal à 62 ans (42 annuités), départ à 60 ans avec 40 annuités pour les carrières commencées avant
      20 ans
    domaine: retraites
    citation:
      texte: >-
        « Tous ceux qui ont commencé à avoir un emploi effectif au sens de l’INSEE avant 20 ans cotiseront 40 ans et
        partiront à 60 ans, puis progressivement, jusqu’à 24 ans et demi, on arrivera à 42 ans de cotisation et un âge
        légal de 62 ans. »
      url: https://www.bvoltaire.fr/devant-le-medef-marine-le-pen-defend-son-epineuse-reforme-des-retraites/
      date: '2026-08-27'
      support: presse
    precision: partielle
    interpretation: >-
      Ligne 2022 et 2024 (« Abroger la réforme des retraites de Macron et mettre en place un système de retraites progressif
      », programme législatif 2024, rassemblementnational.fr/documents/202406-programme.pdf), reconfirmée par l'arbitrage
      interne de juillet 2026 et au débat du Medef (REF, 27 août 2026). Source primaire du détail 2026 (vidéo ou transcription
      officielle du débat) introuvable : citation de presse conservée. Lecture retenue : âge légal ramené à 62 ans et durée
      plafonnée à 42 annuités (168 trimestres) pour tous ; départ à 60 ans avec 40 annuités pour les assurés ayant commencé
      à travailler avant 20 ans ; barème progressif entre 20 et 24 ans et demi. La candidate chiffre la réforme à « 9
      milliards d'euros » (Boulevard Voltaire) ; selon Epoch Times, ce montant vise le volet d'exonération des seniors :
      ambiguïté signalée. Référence : législation au 1er janvier 2027 (réforme 2023 suspendue par la LFSS 2026, âge et
      durée gelés jusqu'au 1er janvier 2028, puis reprise vers 64 ans / 43 annuités). Le contre-budget 2026 inscrivait 1,5
      Md€ pour le « Lancement de la réforme des retraites MLP » (première année seulement). Montée : aucun effet avant 2028
      (âge gelé par la suspension jusqu'au 1er janvier 2028), puis montée avec le calendrier que la mesure annule.
    chiffrable: true
    nature: depense
    effet_solde_primaire:
      central: -26.58
      bas: -43.7
      haut: -20.2
      montee_en_charge:
        '2027': 0.0
        '2028': 0.4
        '2029': 0.7
        '2030': 0.9
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(retour_62 + ecart_42 * duree_1an + part_beneficiaires * (age_60 + ecart_40 * duree_1an))
      parametres:
        retour_62:
          valeur: 13.9
          bareme: retraites_retour_62_ans_2032
          unite: Md€ courants par an (solde du système de retraite), en 2032
        ecart_42:
          valeur: 0.75
          source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028494794/2016-12-25
          unite: années de durée d'assurance
          note: >-
            Calendrier de la loi du 20 janvier 2014 (rétabli par retraites_retour_62_ans_2032) : 171 trimestres pour les
            générations 1970 à 1972, qui ont 60 à 62 ans en 2032 ; ramenés à 168 (42 annuités) : 3 trimestres
        duree_1an:
          valeur: 4.4
          bareme: retraites_duree_assurance_1_an
          unite: Md€ courants 2032 par an et par année de durée
          note: valeur 2035, majorant pour 2032 selon le barème
        age_60:
          valeur: 18
          bareme: retraites_age_60_depuis_62
          unite: Md€ courants 2032 par an, en régime de croisière
        ecart_40:
          valeur: 2
          source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028494794/2016-12-25
          unite: années de durée d'assurance
          note: 168 trimestres (42 annuités, déjà comptés dans ecart_42) ramenés à 160 (40 annuités)
        part_beneficiaires:
          valeur: 0.35
          source: https://www.cor-retraites.fr/sites/default/files/2024-03/Doc_08_Carri%C3%A8re_longue_dur%C3%A9e.pdf
          unite: part du coût d'un passage de tous les assurés à 60 ans et 40 annuités
          note: >-
            Convention (aucune source ne chiffre la part des générations 1966-1972 qui partiraient plus tôt avec le barème
            RN) : 0,35, fourchette 0,25 à 0,5. Appuis : Institut Montaigne 2024, « près de 57 % de la tranche d'âge des
            personnes nées en 1962 [...] ont cotisé pour au moins un trimestre avant leurs 20 ans et seuls 10,5 % à 25 ans ou
            après » ; COR (séance du 14 mars 2024, doc. 8, projections Cnav), départs anticipés pour carrière longue déjà
            permis par le droit d'avant 2023 (donc déjà dans retour_62) « de l'ordre de 10-15 % parmi les générations nées
            dans les années 1960 et 6-8 % parmi celles nées dans les années 1970 » ; SRE (même séance, doc. 11), part des
            affiliés de la fonction publique d'État remplissant la condition de 4 ou 5 trimestres avant 20 ans : « elle passe
            de 37,7 % pour la génération 1960 à 8,6 % pour la génération 1970 » ; DREES (Les retraités et les retraites,
            édition 2025), « 26 % des assurés du régime général et de ceux de la CNRACL nés en 1956 ont bénéficié d'un départ
            anticipé » pour carrière longue. Lecture : environ un quart à un tiers des générations 1966-1972 a commencé avant
            20 ans, dont une part part déjà à 60 ans dans la référence, plus un gain partiel pour les débuts entre 20 et 24
            ans et demi. Recoupement : Fondation IFRAP (2022), 9,6 Md€ en 2027 pour le seul volet « 60 ans avec 40 annuités
            avant 20 ans », soit ≈ 11 Md€ en 2032, contre 3,3 + 9,4 = 12,7 Md€ ici.
      explication: >-
        Reconstruit à partir des barèmes communs, comme les autres promesses de retraite (LFI, Écologistes, PS) : annulation
        des mesures d'âge de 2023 nette de la suspension (13,9) ; durée ramenée de 171 à 168 trimestres pour tous (0,75 ×
        4,4) ; pour les bénéficiaires du barème progressif, le passage de 62 à 60 ans et de 42 à 40 annuités, au prorata
        de leur poids (0,35 × (18 + 2 × 4,4)). Le RN coûte ainsi moins que « 60 ans et 40 annuités pour tous » (LFI, 42,9
        Md€), dont il est un sous-ensemble. Bas = hauts des barèmes (15,8 ; 25 ; 8,8 par an de durée) et part 0,5 : 15,8 +
        0,75 × 8,8 + 0,5 × (25 + 2 × 8,8) = 43,7 ; haut = bas des barèmes (11,4 ; 13,2) avec la durée au central (4,4) et
        part 0,25 : 11,4 + 3,3 + 0,25 × (13,2 + 8,8) = 20,2. L'ancien chiffrage (Institut Montaigne 2024,
        −44,6 Md€) est abandonné : Montaigne applique à presque toute la génération le retour complet aux règles d'avant
        2003 (« en revenant totalement sur les mesures d'âges et de durée de cotisation de 2003, 2010, 2014 pour ceux qui
        ont commencé à travailler avant 20 ans, et partiellement pour ceux qui ont commencé à travailler après 20 ans, le
        coût de la mesure est estimé à 26,5 Md€ », montant identique à son chiffrage 2022 du retour complet à 60 ans), ce
        qui revenait à chiffrer le RN plus cher que la retraite à 60 ans pour tous. Périmètre (convention commune 4) :
        solde du système de retraite ; le coût pour l'ensemble des APU est décrit dans effets_retour.
    chiffrages_tiers:
      - auteur: Fondation IFRAP (présidentielle 2022, même dispositif)
        montant_md: -9.6
        url: https://www.ifrap.org/budget-et-fiscalite/retraites-aides-sociales-sante-le-pen-macron-le-cout-de-leurs-programmes
        date: '2022-04-14'
        commentaire: >-
          « Marine Le Pen propose de revenir à la retraite à 60 ans avec 40 annuités pour ceux qui ont commencé à travailler
          avant 20 ans (coût : 9,6 milliards). » Volet carrières longues seul, par rapport au droit d'alors (62 ans) ;
          ≈ 11 Md€ projetés en 2032, cohérent avec notre volet hors abrogation de 2023 (12,7).
      - auteur: Fondation IFRAP (législatives 2024)
        montant_md: -10
        url: https://www.ifrap.org/budget-et-fiscalite/le-vrai-cout-du-programme-du-rassemblement-national
        date: '2024-06-20'
        commentaire: >-
          « l'abrogation de la réforme des retraites de 2023 ne verrait probablement jamais le jour car infinançable
          avec 10 milliards de coût en 2027 » ; chiffrage du programme 2024, avant la suspension de la réforme par la
          LFSS 2026.
      - auteur: Institut Montaigne (législatives 2024)
        montant_md: -34.7
        url: >-
          https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/abroger-la-reforme-des-retraites-et-pour-ceux-ayant-commence-a-travailler-avant-20-ans-partir-a-40-annuites-de-cotisations
        commentaire: >-
          Horizon 2027, régime général ; 31,5 (avant 20 ans seulement) à 44,7 Md€ (avec complémentaires). Dont 8,2 Md€
          d'abrogation de 2023 et 26,5 Md€ de retour complet aux règles d'âge et de durée d'avant 2003 pour la plupart
          des assurés : lecture maximale, supérieure à notre bas ; ancien central de ce fichier (−44,6 Md€ en 2032).
      - auteur: Marine Le Pen (débat Medef, 27 août 2026)
        montant_md: -9
        url: https://www.bvoltaire.fr/devant-le-medef-marine-le-pen-defend-son-epineuse-reforme-des-retraites/
        commentaire: >-
          « 9 milliards d'euros » selon la candidate ; proche du chiffrage IFRAP 2022 du seul volet carrières longues,
          sans l'annulation de la reprise du calendrier de 2023 (13,9 Md€ en 2032).
    effets_retour: >-
      Moindres dépenses de chômage et d'invalidité des seniors partant plus tôt et effets sur l'emploi : non comptés.
      Coût pour l'ensemble des administrations publiques (convention commune 4, effets d'activité exclus du montant) :
      nettement supérieur au coût pour le système de retraite ; la Cour des comptes (février 2025) chiffre une avancée
      d'un an de l'âge à 5,8 Md€ pour le système mais 13 Md€ pour les finances publiques en 2035, et la DG Trésor le
      gain de la réforme 2023 à 9,7 Md€ pour le système contre 24,2 Md€ toutes APU en 2030 ; FIPECO chiffre le passage
      de 62 à 60 ans à 0,9 point de PIB (≈ 33 Md€ en 2032) toutes APU contre 0,5 point pour les seuls régimes.
    confiance: faible
    verification:
      statut: corrige
      par: passe-sources
      date: '2026-09-29'
      commentaire: >-
        Rechiffré sur les barèmes communs : central −44,56 → −26,58, bas −62,23 → −44,4, haut −21,9 → −17,65. L'ancien
        chiffrage reprenait l'Institut Montaigne 2024 (34,7 Md€ en 2027), qui applique le retour complet aux règles
        d'avant 2003 à la plupart des assurés et rendait le RN plus cher que la retraite à 60 ans pour tous de LFI
        (−42,9) ; le RN n'en est qu'un sous-ensemble. Part des bénéficiaires : convention 0,35 (0,25 à 0,5), appuyée sur
        Montaigne (57 % de la génération 1962 avec un trimestre avant 20 ans), la Cnav via le COR (carrières longues
        6-15 % des générations 1960-1970 à droit d'avant 2023) et la DREES (26 % de la génération 1956) ; recoupée par
        l'IFRAP 2022 (9,6 Md€ pour le volet carrières longues). Citation : source primaire introuvable, presse
        conservée. Trace antérieure (verificateur-sonnet, conteste) : central Montaigne cohérent avec sa formule, bas
        contesté puis recalé sur le barème (IFRAP 2025), écart inexpliqué avec les 9 Md€ de la candidate, désormais
        rapproché du chiffrage IFRAP 2022.
        Recalé sur les barèmes sourcés du 29/09 : bornes des barèmes retraites_retour_62_ans_2032 (11,4 ; 15,8 au lieu
        de 8,9 ; 20) et retraites_age_60_depuis_62 (13,2 ; 25) ; central inchangé (−26,58), bas −44,4 → −43,7, haut
        −17,65 → −20,2.
