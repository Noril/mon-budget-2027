      commentaire: >-
        Citation de presse remplacée par la source primaire (programme 2024, relu sur le PDF). Source du coût relue
        (Institut Montaigne, archive 2024) : elle contient deux lectures incompatibles. (1) Recours croissant : « 800
        millions d'euros en 2025, de 4,8 milliards d'euros en 2027 et de 12 milliards d'euros en 2029 », « le manque à
        gagner brut serait ainsi estimé à 15 Md € pour l'année 2029 », net du retour d'IS (3 Md€) 12 Md€ : retenue au
        central (12 × 1,0891 = 13,07 en 2032). (2) Exonération limitée à cinq ans par cohorte : tableau « 2025 0,8 Md
        € [...] 2029 4 Md € TOTAL sur 5 ans 12 Md € », soit ≈ 4 Md€ par an en régime de croisière (4,36 projetés),
        proche de la borne favorable (−5,23). Écart non tranchable sans le détail du modèle ; statut conteste. Facteur
        f recalculé sur plan/hypotheses.yaml (croissance en volume et déflateur 2030-2032 : 1,02987 × 1,02834 ×
        1,02834 = 1,0891). Trace antérieure (verificateur-sonnet, ok) : Citation retrouvée sur l'URL. Montaigne : 0,8
        Md€ en 2025, 4,8 en 2027, 12 en 2029, 15 en brut à terme ; 2032 = cinquième année d'une mise en œuvre en 2028
        (le texte dit « quatrième » : coquille sans effet sur la valeur 12). Bas 15, haut recours limité : cohérent.
