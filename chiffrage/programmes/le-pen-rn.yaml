annonce_candidat:
  cout_md: 102.8
  financement_md: 244.4
  texte: >-
    Contre-budget 2027 et trajectoire 2027-2032 présentés le 6 octobre 2026 (dossier de presse « Pour la Renaissance de
    la France : l'urgence de réparer les finances publiques », 125 mesures, non publié en ligne) : « Compte tenu de la
    hausse des taux et du budget indigent que proposent Sébastien Lecornu et Emmanuel Macron, je vous annonce dès
    maintenant que nous portons l'ajustement nécessaire à 140 milliards d'euros nets d'économies en 2032 par rapport à
    2026 » (Marine Le Pen, Reuters et AFP), contre 125 Md€ annoncés au Medef le 27 août 2026 ; « 30 milliards » de
    baisses d'impôts et « 15 mds de "dépenses provisionnées pour des droits nouveaux" » (AFP). Annexe du dossier
    (diapositives 24 à 26), selon sa retranscription par l'Institut de l'Entreprise : amélioration nette du solde de 71,6
    Md€ en 2027 et 141,7 Md€ en 2031, soit 140,8 puis 244,4 Md€ de recettes et économies brutes, 53,2 puis 49,1 Md€ de
    baisses d'impôts et 16,1 puis 53,7 Md€ de dépenses nouvelles ; cout_md (102,8) et financement_md (244,4) reprennent
    les montants 2031 de l'annexe. Cibles affichées : équilibre primaire en 18 mois, déficit sous 3 % du PIB en 2030,
    dette à 112 % du PIB en 2032.
  url: >-
    https://www.boursorama.com/actualite-economique/actualites/marine-le-pen-veut-ramener-le-deficit-budgetaire-a-3-d-ici-2030-e234d02e0ea563e2766ea6142c4a1bdc
notes: >-
  Base depuis le 11 octobre 2026 : contre-budget 2027 et trajectoire 2027-2032 présentés le 6 octobre 2026 par Marine Le
  Pen, Jordan Bardella et Jean-Philippe Tanguy (dossier de presse de 71 pages, 125 mesures). Le dossier n'est pas publié
  (rassemblementnational.fr ne propose que GRN-CONTRE-BUDGET-2026.pdf) : la collecte repose sur les comptes rendus de
  presse (Reuters, AFP via Sud Radio et Planet, CNews, Public Sénat, Acteurs publics, La Gazette France, Vert, franceinfo)
  et, pour les montants mesure par mesure, sur la retranscription de l'annexe par l'Institut de l'Entreprise (note du 6
  octobre 2026, source secondaire et critique, citée comme chiffrage tiers « selon le RN », jamais comme vérité). Les
  citations du contre-budget 2026 (octobre 2025) sont conservées quand aucune citation verbatim 2027 n'a été trouvée ;
  l'interprétation dit alors quel compte rendu reconfirme la mesure. Mesures du dossier 2027 connues seulement par
  paraphrase (pas de citation verbatim lue) et donc non ajoutées : TVA prélevée à la source (18 Md€ en 2031 selon
  l'annexe ; « quelque 26 milliards » selon Reuters), impôt sur les sociétés assis sur le chiffre d'affaires (7,5 Md€),
  exonération d'IR des moins de 30 ans jusqu'à quatre Smic (2,0 Md€), retour de la TICPE au niveau de 2017 (3,9 Md€),
  lutte contre les dépenses indues (9,5), coûts hospitaliers (8,3), parc immobilier de l'État (5,1), fusion Urssaf-DGFiP
  (1,72), aidants (+2 Md€) et soins dentaires (+1,4 Md€) ; elles pèsent dans l'enveloppe des 140 Md€ (règle 6) ou dans
  l'estimation indicative des droits nouveaux. La réforme des retraites et le pilier de capitalisation seront détaillés
  « dans les semaines à venir » ; la baisse des cotisations salariales (« rapprochement brut-net », projet d'avril 2026)
  n'apparaît pas dans les comptes rendus du contre-budget et est renvoyée au congrès du RN des 24 et 25 octobre 2026.
  Engagements 2022 non reconfirmés et donc exclus : renationalisation des autoroutes (l'annexe 2027 évoque des
  « autoroutes nationalisées » selon l'Institut de l'Entreprise, sans libellé lu), privatisation de l'audiovisuel public,
  plan santé de 20 Md€, budget de défense à 55 Md€ en 2027. Chiffrage : quand le seul chiffre disponible est celui du
  candidat, il est projeté en 2032 au PIB nominal (montants 2031 de l'annexe × 1,0283) ; économies ciblées sans détail :
  central = annonce plafonnée, bas 0, haut = central ; enveloppes non détaillées : central 0, haut = écart d'affichage
  (règle 6). Plusieurs recettes et économies du plan sont juridiquement fragiles (contribution à l'UE, prestations et
  taxe réservées selon la nationalité) : signalé en confiance, déduit seulement quand la règle 6 le prévoit (contribution
  à l'UE). Tension interne documentée : J. Bardella (mai 2026) a évoqué un relèvement de l'âge légal ; l'arbitrage de
  juillet 2026 a confirmé la ligne 60/62 ans. Le conseiller économique F. Durvye a quitté la campagne le 27 août 2026.
mesures:
  - id: tva-energie-5-5
    libelle: Baisse de la TVA de 20 % à 5,5 % sur les énergies (carburants, électricité, gaz, fioul, bois)
    domaine: fiscalite
    citation:
      texte: >-
        Baisse de la TVA sur les énergies (gaz, électricité, carburants, bois, fioul). [...] Baisse TVA énergies 10,960
      url: https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf
      date: '2025-10-23'
      support: contre-budget 2026 du groupe RN (conférence de presse, pages 4 et 7)
    precision: precise
    interpretation: >-
      Mesure phare constante depuis 2022 (communiqué de Marine Le Pen du 21 octobre 2021 : « baisser immédiatement
      la TVA de 20 à 5,5% sur les carburants, mais aussi sur le gaz, le fioul domestique et l'électricité »,
      rassemblementnational.fr), reconfirmée en septembre 2026 (AFP, Boursorama, 15 septembre 2026 : « Marine Le Pen
      exige une baisse de la TVA sur l'énergie de 20 à 5,5%, au cœur de son programme » ; LCI 16 septembre). Source
      primaire citée : contre-budget 2026. Périmètre du contre-budget 2026 : « Baisse TVA énergies 10,960 » Md€
      (gaz, électricité, carburants, bois, fioul), montant du RN. Le taux de 5,5 % s'applique déjà à l'abonnement
      électricité/gaz : chiffrer sur les consommations au taux normal. Juridiquement contestée (directive TVA) : non
      retenu dans le montant, signalé en confiance. Montée en charge : loi de finances rectificative dès l'été 2027
      (programme 2024), d'où 40 % en 2027. Compatibilité avec la directive TVA non acquise pour les carburants
      (plancher) : non déduite. Reprise dans le contre-budget 2027 du 6 octobre 2026 : CNews rapporte « la baisse de
      la TVA sur le gaz, l'électricité, les carburants, le bois et le fioul » (paraphrase, sans guillemets) et
      franceinfo une « baisse de la TVA sur le gaz et l'électricité » ; 12,2 Md€ en 2027 selon l'annexe du dossier
      (Institut de l'Entreprise). Aucune citation verbatim 2027 lue : citation 2026 conservée.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -12.0
      bas: -12.8
      haut: -9.0
      montee_en_charge:
        '2027': 0.4
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -total
      parametres:
        total:
          valeur: 12.0
          bareme: tva_energie_total_5_5
          unite: Md€/an de recettes perdues (APU)
          note: >-
            chiffrage du Gouvernement devant l'Assemblée (novembre 2025) pour les quatre énergies ; bas 9,0 (Institut
            Montaigne), haut 12,8 (borne mécanique : 17,6 Md€ de TVA sur l'énergie en 2024 × (1 − 5,5/20), CPO)
      explication: >-
        La promesse vise les quatre énergies : barème tva_energie_total_5_5 (12,0 Md€), comme le prévoit sa dérivation.
        La somme des barèmes par énergie (électricité 5,0 + gaz 2,0 + carburants 6,4 + fioul 0,6 = 14,0) dépasse la perte
        maximale possible (12,8 Md€ si toute la TVA sur l'énergie passait à 5,5 %, CPO) parce qu'elle mélange des
        millésimes de prix : elle n'est pas retenue. Bas = 12,8 (borne mécanique, prix 2024 ; plus aux prix de 2026),
        haut = 9,0 (Institut Montaigne, réaction de la consommation). Bois de chauffage omis (déjà en partie à taux réduit,
        montant faible). Montants énergétiques non projetés au PIB (volumes et prix).
    chiffrages_tiers:
      - auteur: Institut Montaigne (législatives 2024)
        montant_md: -11.3
        url: >-
          https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/baisser-la-tva-de-20-a-55-pour-les-carburants-lelectricite-le-gaz-et-le-fioul-domestique
        commentaire: fourchette 9 à 13,6 Md€ selon la réaction de la consommation
      - auteur: Ministère de l'Économie (Bercy), cité par Public Sénat
        montant_md: -16.8
        url: >-
          https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      - auteur: Contre-budget RN 2026 (chiffrage du candidat)
        montant_md: -10.96
        url: https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf
      - auteur: Contre-budget RN 2027, selon l'annexe retranscrite par l'Institut de l'Entreprise
        montant_md: -12.2
        url: >-
          https://www.institut-entreprise.fr/wp-content/uploads/2026/10/Analyse-primaire-contre-budget-RN-Note-de-contexte-IDEP.pdf
        date: '2026-10-06'
        commentaire: >-
          Montant 2027 de l'annexe (« TVA sur les énergies »), carburants compris ; dans notre fourchette (9,0 à
          12,8).
    effets_retour: >-
      Le RN invoque un effet « déflationniste » et un retour de TVA sur les autres consommations (1,82 Md€ dans le contre-budget)
      : non comptés.
    confiance: moyenne
    verification:
      statut: ok
      par: veille-2026-10-11
      date: '2026-10-11'
      commentaire: >-
        Mesure reprise dans le contre-budget 2027 (CNews et franceinfo du 6 et 8 octobre 2026, paraphrases ; annexe
        : 12,2 Md€ en 2027 selon l'Institut de l'Entreprise). Citation 2026 conservée faute de citation verbatim
        2027 ; montant inchangé (barème tva_energie_total_5_5). Trace antérieure (passe-sources, corrige,
        2026-09-29) : Citation de presse (AFP, Boursorama) remplacée par la source primaire : contre-budget 2026 du
        groupe RN, pages 4 et 7 (« Baisse de la TVA sur les énergies (gaz, électricité, carburants, bois, fioul) »,
        « Baisse TVA énergies 10,960 »), relu sur le PDF ; reconfirmation 2026 gardée dans interpretation. Montant
        inchangé (barèmes communs). Trace antérieure (verificateur-sonnet, corrige) : Citation retrouvée sur l'URL.
        Barèmes tva_energie_* relus (Bercy juin 2024 : électricité 4,5, gaz 2,3, carburants 10 ; recalcul SDES).
        Total 17,6 proche de Bercy 16,8 et de Montaigne 11,3 à 13,6 (fourchette de consommation). Réserve : le «
        carburants 10 Md€ » de Bercy inclut vraisemblablement le fioul, d'où ≈ 0,6 Md€ de double compte possible
        avec la ligne fioul (couvert par la fourchette). Non-conformité à la directive TVA signalée, non déduite.
        Recalé sur les conventions communes du 29/09 : barème carburants ramené à 9,4 Md€ (carburants routiers hors
        fioul), ce qui supprime le double compte avec la ligne fioul ; central −17,6 → −17,0, haut −14,8 → −13,0
        (bornes basses : 4,5 + 1,7 + 6,4 + 0,4). Recalé sur les barèmes sourcés du 29/09 : le barème carburants
        passe de 9,4 à 6,4 Md€ (TVA non déductible sur les produits pétroliers, SDES 2024), et la somme par énergie
        (14,0) dépasse la borne mécanique du CPO (12,8) : la mesure, qui vise les quatre énergies, est chiffrée sur
        tva_energie_total_5_5 ; central −17,0 → −12,0, bas −20,45 → −12,8, haut −13,0 → −9,0. Le chiffre de Bercy
        2024 (16,8) excède la borne mécanique ; Montaigne (11,3) et le contre-budget RN (10,96) sont dans la
        fourchette.
  - id: tva-100-produits-premiere-necessite
    libelle: Suppression de la TVA sur une centaine de produits de première nécessité
    domaine: fiscalite
    citation:
      texte: Suppression TVA 100 produits premières nécessité 3,500
      url: https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf
      date: '2025-10-23'
    precision: partielle
    interpretation: >-
      Le programme 2024 la réservait au cas de « forte inflation » (« suspension de la TVA sur une centaine de
      produits de première nécessité ») ; le contre-budget 2026 l'inscrit sans condition pour 3,5 Md€. Liste des
      produits non publiée. Mesure non réaffirmée oralement en 2026 : lecture permanente retenue, fourchette basse =
      0 si conditionnelle. Reprise dans le contre-budget 2027 sans condition d'inflation : « suppression de la TVA
      sur 100 produits de première nécessité » (franceinfo, 8 octobre 2026, paraphrase) ; « TVA nulle sur cent
      produits essentiels » (formulation de l'Institut de l'Entreprise) pour 3,5 Md€ en 2027 selon l'annexe qu'il retranscrit. La
      borne haute n'est donc plus nulle : elle reprend le chiffre du RN projeté (3,5 × 1,157 = 4,05). Liste des
      produits toujours non publiée.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -5.8
      bas: -10.86
      haut: -4.05
      montee_en_charge:
        '2027': 0.0
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
