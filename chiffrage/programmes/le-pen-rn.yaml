          source: https://www.cre.fr/fileadmin/Documents/Deliberations/2026/260715_2026-149_CSPE_2026-2027.pdf
          unite: années
          note: >-
            soutien déjà engagé jusqu'en 2029 (« environ +10 GWe estimés par la CRE entre 2026 et 2029 ») : 2030-2032
      explication: >-
        Les contrats signés restent dus (20 ans) : l'économie porte sur les nouveaux contrats non engagés (2030-2032),
        approchés par la hausse annuelle récente des charges : 1,04 Md€ × 3 ans = 3,12 Md€. Bas = 0 (économie non
        réalisée), haut = central (règle 6) : le montant du RN supposerait la rupture des contrats et des indemnisations
        non comptées. Très sensible au prix de marché de l'électricité (≈ 90 M€ par €/MWh, CRE).
