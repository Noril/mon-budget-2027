  - id: annulations-mesures-fiscales-budget-2026
    libelle: Annulation d'un ensemble de hausses d'impôts et de rabots de niches des PLF/PLFSS 2026
    domaine: fiscalite
    citation:
      texte: >-
        Suppression taxe petit colis 0,600
        Suppression de l'abattement forfaitaire retraités (garder l'abattement 10%) 1,200
      url: https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf
      date: 2025-10-23
    precision: partielle
    interpretation: >-
      Regroupe les lignes du contre-budget qui refusent des mesures du PLF/PLFSS 2026 (montants RN, Md€) : taxe petits
      colis 0,6 ; abattement retraités 1,2 ; niche frais de scolarité 0,454 ; IJ ALD 0,883 ; hausse taxes aérien 0,72 ;
      biocarburant 0,289 ; taxe sur les avantages sociaux (tickets restaurant) 0,95 ; ACRE 0,092 ; JEI 0,025 ; LODEOM
      0,35 ; exonération salariale des apprentis 0,32 ; forfait social ruptures conventionnelles 0,26 ; Dutreil 0,5 ;
      super-IS des ETI 0,5 ; taxe sur les mutuelles (OCAM) 1,02 ; Madelin, streaming, vapotage, malus, médailles
      (< 0,03 chacun). Effet par rapport à la législation au 1er janvier 2027 = somme des seules mesures effectivement
      adoptées en 2026. Liste à rapprocher de la LFI et de la LFSS 2026.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  # --- Travail, retraites, prestations -------------------------------------------------------------------------
  - id: retraites-60-62-ans
    libelle: Retour de l'âge légal à 62 ans (42 annuités), départ à 60 ans avec 40 annuités pour les carrières commencées avant 20 ans
    domaine: retraites
    citation:
      texte: "« Tous ceux qui ont commencé à avoir un emploi effectif au sens de l’INSEE avant 20 ans cotiseront 40 ans et partiront à 60 ans, puis progressivement, jusqu’à 24 ans et demi, on arrivera à 42 ans de cotisation et un âge légal de 62 ans. »"
      url: https://www.bvoltaire.fr/devant-le-medef-marine-le-pen-defend-son-epineuse-reforme-des-retraites/
      date: 2026-08-27
      support: presse
    precision: partielle
    interpretation: >-
      Ligne 2022 et 2024 (« Abroger la réforme des retraites de Macron »), reconfirmée par l'arbitrage interne de
      juillet 2026 et au Medef. La candidate chiffre la réforme à « 9 milliards d'euros » (Boulevard Voltaire) ; selon
      Epoch Times, ce montant vise le volet d'exonération des seniors : ambiguïté à signaler. Référence : législation au
      1er janvier 2027 (réforme 2023 suspendue par la LFSS 2026, âge et durée gelés jusqu'au 1er janvier 2028, puis
      reprise vers 64 ans / 43 annuités) à confirmer en phase 2. Le contre-budget 2026 inscrivait 1,5 Md€ pour le
      « Lancement de la réforme des retraites MLP » (première année seulement).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    chiffrages_tiers:
      - auteur: Fondation IFRAP (législatives 2024)
        montant_md: -10
        url: https://www.ifrap.org/budget-et-fiscalite/le-vrai-cout-du-programme-du-rassemblement-national
        date: 2024-06-20
        commentaire: >-
          « l'abrogation de la réforme des retraites de 2023 ne verrait probablement jamais le jour car infinançable avec
          10 milliards de coût en 2027 » ; chiffrage du programme 2024, avant la suspension de la réforme par la LFSS 2026.
  - id: cumul-emploi-retraite-sans-cotisations
    libelle: Suppression des cotisations retraite et chômage des actifs ayant l'âge et les trimestres qui continuent à travailler
    domaine: retraites
    citation:
      texte: "\"Nous mettrons en place des incitations pour que ceux qui ont dépassé l'âge de la retraite et ont leurs trimestres puissent continuer à travailler s'ils le souhaitent\", a-t-elle néanmoins avancé, promettant pour ce faire de \"supprimer les cotisations retraite et les cotisations chômage\" de ces travailleurs seniors."
      url: https://www.sudradio.fr/societe/marine-le-pen-et-la-delicate-operation-seduction-du-monde-economique
      date: 2026-08-28
      support: presse
    precision: partielle
    interpretation: >-
      Cotisations salariales et patronales supposées (lecture haute) ; lecture basse : part salariale seulement.
      Le coût de « 9 milliards d'euros en année pleine » cité par Epoch Times pourrait viser ce volet.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: hausse-salaires-10-exoneree
    libelle: Exonération de cotisations patronales des hausses de salaire de 10 % (jusqu'à 3 SMIC, 3 à 5 ans)
    domaine: travail
    citation:
      texte: "Marine Le Pen veut de son côté inciter les entreprises à augmenter les salaires de 10% en exonérant cette hausse de cotisations patronales."
      url: https://www.boursorama.com/actualite-economique/actualites/salaires-carburants-mobilisations-le-pouvoir-d-achat-s-impose-dans-la-campagne-d6706e6c8501042962d517b99d95cad1
