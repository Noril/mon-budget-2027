annonce_candidat:
  cout_md: null
  financement_md: 125
  texte: >-
    Au débat du Medef (REF, 27 août 2026) : « Nous présenterons juste avant le débat budgétaire notre trajectoire de
    rétablissement des finances publiques avec 125 milliards d'euros d'économies » (horizon 2032, « objectif minimal »
    selon le porte-parole Stéphane Rambaud) ; document non publié au 29 septembre 2026. Réforme des retraites chiffrée
    par la candidate à « 9 milliards d'euros » (« déficit assumé »). Dernier chiffrage complet publié : contre-budget
    2026 du groupe RN (23 octobre 2025, base PLF 2026) : 88,3 Md€ d'économies et recettes nouvelles, 52,7 Md€ de
    baisses d'impôts et dépenses nouvelles, soit 35,6 Md€ d'amélioration nette du solde revendiquée.
  url: https://www.epochtimes.fr/marine-le-pen-promet-125-milliards-deuros-deconomies-et-defend-une-retraite-a-60-ou-62-ans-3335415.html
notes: >-
  Pas de programme présidentiel 2027 complet publié au 29 septembre 2026 : le plan de 125 Md€ d'économies est annoncé
  « avant le débat budgétaire » (début octobre). La collecte s'appuie sur (1) le contre-budget 2026 du groupe RN
  (octobre 2025), dernier document chiffré ligne à ligne, dont les montants sont ceux du RN et non les nôtres, et dont
  la base est le PLF 2026 : les lignes qui annulent des mesures du PLF 2026 n'ont d'effet par rapport à la législation
  au 1er janvier 2027 que si ces mesures ont été adoptées en LFI/LFSS 2026 (à vérifier en phase 2) ; (2) les prises de
  parole de la candidate en 2026 (Medef 27 août, Hénin-Beaumont 13 septembre, LCI 16 septembre, lettre ouverte du 21
  septembre) ; (3) le programme législatif 2024, seulement pour les mesures reconfirmées depuis. Engagements 2022 non
  reconfirmés et donc exclus : renationalisation des autoroutes, privatisation de l'audiovisuel public (le contre-budget
  2026 prévoit seulement une baisse de dotation), plan santé de 20 Md€, budget de défense à 55 Md€ en 2027 (le programme
  2024 veut « sanctuariser » la LPM), exonération d'IR des moins de 30 ans (attribuée à J. Bardella par des sites
  secondaires, sans source primaire trouvée). Tension interne documentée : J. Bardella (mai 2026) a évoqué un relèvement de
  l'âge légal ; l'arbitrage de juillet 2026 et le débat Medef ont confirmé la ligne 60/62 ans de la candidate. Le
  conseiller économique F. Durvye a quitté la campagne le 27 août 2026.
mesures:
  # --- Pouvoir d'achat et fiscalité des ménages ---------------------------------------------------------------
  - id: tva-energie-5-5
    libelle: Baisse de la TVA de 20 % à 5,5 % sur les énergies (carburants, électricité, gaz, fioul, bois)
    domaine: fiscalite
    citation:
      texte: "Si LFI demande un blocage des prix à 1,70 euros le litre, Marine Le Pen exige une baisse de la TVA sur l'énergie de 20 à 5,5%, au cœur de son programme."
      url: https://www.boursorama.com/actualite-economique/actualites/salaires-carburants-mobilisations-le-pouvoir-d-achat-s-impose-dans-la-campagne-d6706e6c8501042962d517b99d95cad1
      date: 2026-09-15
      support: presse
    precision: precise
    interpretation: >-
      Mesure phare constante depuis 2022, reconfirmée en septembre 2026 (AFP ; LCI 16 septembre). Périmètre du
      contre-budget 2026 : « Baisse TVA énergies 10,960 » Md€ (gaz, électricité, carburants, bois, fioul), montant du RN.
      Le taux de 5,5 % s'applique déjà à l'abonnement électricité/gaz : chiffrer sur les consommations au taux normal.
      Juridiquement contestée (directive TVA) : non retenu dans le montant, signalé en confiance.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: tva-100-produits-premiere-necessite
    libelle: Suppression de la TVA sur une centaine de produits de première nécessité
    domaine: fiscalite
    citation:
      texte: "Suppression TVA 100 produits premières nécessité 3,500"
      url: https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf
      date: 2025-10-23
    precision: partielle
    interpretation: >-
      Le programme 2024 la réservait au cas de « forte inflation » (« suspension de la TVA sur une centaine de produits
      de première nécessité ») ; le contre-budget 2026 l'inscrit sans condition pour 3,5 Md€. Liste des produits non
      publiée. Mesure non réaffirmée oralement en 2026 : lecture permanente retenue, fourchette basse = 0 si conditionnelle.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: ir-part-pleine-deuxieme-enfant
