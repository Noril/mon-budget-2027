      nettement supérieur au coût pour le système de retraite ; la Cour des comptes (février 2025) chiffre une avancée
      d'un an de l'âge à 5,8 Md€ pour le système mais 13 Md€ pour les finances publiques en 2035, et la DG Trésor le
      gain de la réforme 2023 à 9,7 Md€ pour le système contre 24,2 Md€ toutes APU en 2030 ; FIPECO chiffre le passage
