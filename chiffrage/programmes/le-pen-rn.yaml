      2026 et au Medef. La candidate chiffre la réforme à « 9 milliards d'euros » (Boulevard Voltaire) ; selon Epoch
      Times, ce montant vise le volet d'exonération des seniors : ambiguïté à signaler. Référence : législation au 1er
      janvier 2027 (réforme 2023 suspendue par la LFSS 2026, âge et durée gelés jusqu'au 1er janvier 2028, puis reprise
      vers 64 ans / 43 annuités) à confirmer en phase 2. Le contre-budget 2026 inscrivait 1,5 Md€ pour le « Lancement
      de la réforme des retraites MLP » (première année seulement). Montée : aucun effet avant 2028 (âge gelé par la
