id: le-pen-rn
candidat: Marine Le Pen
parti: Rassemblement national
statut_candidature: >-
  Déclarée le 7 juillet 2026 (TF1, 20 h), au soir de l'arrêt de la cour d'appel de Paris qui a ramené sa peine
  d'inéligibilité ferme à 15 mois (45 mois dont 30 avec sursis), déjà purgés depuis le jugement de première instance
  du 31 mars 2025 : elle est éligible. Pourvoi en cassation en cours (la Cour de cassation a annoncé statuer au plus
  tard début avril 2027, avant le premier tour du 18 avril 2027). Si l'inéligibilité était rétablie, Jordan Bardella,
  président du RN et Premier ministre annoncé en cas de victoire (« ticket »), serait le candidat de recours.
date_collecte: 2026-09-29
