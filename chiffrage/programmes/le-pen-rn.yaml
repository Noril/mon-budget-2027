  - id: retraites-60-62-ans
    libelle: >-
      Retour de l'âge légal à 62 ans (42 annuités), départ à 60 ans avec 40 annuités pour les carrières commencées avant
      20 ans
    domaine: retraites
    citation:
      texte: >-
        « Tous ceux qui ont commencé à avoir un emploi effectif au sens de l’INSEE avant 20 ans cotiseront 40 ans et
        partiront à 60 ans, puis progressivement, jusqu’à 24 ans et demi, on arrivera à 42 ans de cotisation et un âge
        légal de 62 ans. »
      url: https://www.bvoltaire.fr/devant-le-medef-marine-le-pen-defend-son-epineuse-reforme-des-retraites/
      date: '2026-08-27'
      support: presse
    precision: partielle
    interpretation: >-
      Ligne 2022 et 2024 (« Abroger la réforme des retraites de Macron et mettre en place un système de retraites
      progressif », programme législatif 2024, rassemblementnational.fr/documents/202406-programme.pdf), reconfirmée
      par l'arbitrage interne de juillet 2026 et au débat du Medef (REF, 27 août 2026). Source primaire du détail
      2026 (vidéo ou transcription officielle du débat) introuvable : citation de presse conservée. Lecture retenue
      : âge légal ramené à 62 ans et durée plafonnée à 42 annuités (168 trimestres) pour tous ; départ à 60 ans avec
      40 annuités pour les assurés ayant commencé à travailler avant 20 ans ; barème progressif entre 20 et 24 ans
      et demi. La candidate chiffre la réforme à « 9 milliards d'euros » (Boulevard Voltaire) ; selon Epoch Times,
      ce montant vise le volet d'exonération des seniors : ambiguïté signalée. Référence : législation au 1er
      janvier 2027 (réforme 2023 suspendue par la LFSS 2026, âge et durée gelés jusqu'au 1er janvier 2028, puis
      reprise vers 64 ans / 43 annuités). Le contre-budget 2026 inscrivait 1,5 Md€ pour le « Lancement de la réforme
      des retraites MLP » (première année seulement). Montée : aucun effet avant 2028 (âge gelé par la suspension
      jusqu'au 1er janvier 2028), puis montée avec le calendrier que la mesure annule. Contre-budget 2027 (6 octobre
      2026) : la réforme n'est pas détaillée (« Dans les semaines à venir, nous vous présenterons des corrections de
      mesures injustes ou inefficaces du système actuel des retraites », CNews) ; la candidate reste « favorable à
      ramener l'âge de départ à la retraite à 62 ans, voire à 60 » (CNews, La Gazette France, paraphrase). L'annexe
      chiffre la réforme du programme à 9,5 Md€ en 2031 (Institut de l'Entreprise) ; les économies de « correction »
      annoncées pour la financer sont dans la mesure retraites-corrections-15-20-md. Citation du 27 août 2026
      conservée.
    chiffrable: true
    nature: depense
    effet_solde_primaire:
      central: -53.03
      bas: -65.53
      haut: -26.58
      montee_en_charge:
        '2027': 0.0
        '2028': 0.4
        '2029': 0.7
        '2030': 0.9
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(retour_62 + ecart_42 * duree_1an + part_beneficiaires * (age_60 + ecart_40 * duree_1an))
      parametres:
        retour_62:
          valeur: 29.1
          bareme: retraites_retour_62_ans_2032_apu
          unite: Md€ courants par an (solde des APU), en 2032
        ecart_42:
          valeur: 0.75
          source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028494794/2016-12-25
          unite: années de durée d'assurance
          note: >-
            Calendrier de la loi du 20 janvier 2014 (rétabli par retraites_retour_62_ans_2032) : 171 trimestres pour les
            générations 1970 à 1972, qui ont 60 à 62 ans en 2032 ; ramenés à 168 (42 annuités) : 3 trimestres
        duree_1an:
          valeur: 7.4
          bareme: retraites_duree_assurance_1_an_apu
          unite: Md€ courants 2032 par an et par année de durée
          note: valeur 2035, majorant pour 2032 selon le barème
        age_60:
          valeur: 37.7
          bareme: retraites_age_60_depuis_62_apu
          unite: Md€ courants 2032 par an
        ecart_40:
          valeur: 2
          source: https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000028494794/2016-12-25
          unite: années de durée d'assurance
          note: 168 trimestres (42 annuités, déjà comptés dans ecart_42) ramenés à 160 (40 annuités)
        part_beneficiaires:
          valeur: 0.35
          source: https://www.cor-retraites.fr/sites/default/files/2024-03/Doc_08_Carri%C3%A8re_longue_dur%C3%A9e.pdf
          unite: part du coût d'un passage de tous les assurés à 60 ans et 40 annuités
          note: >-
            Convention (aucune source ne chiffre la part des générations 1966-1972 qui partiraient plus tôt avec le barème
            RN) : 0,35, fourchette 0,25 à 0,5. Appuis : Institut Montaigne 2024, « près de 57 % de la tranche d'âge des
            personnes nées en 1962 [...] ont cotisé pour au moins un trimestre avant leurs 20 ans et seuls 10,5 % à 25 ans ou
            après » ; COR (séance du 14 mars 2024, doc. 8, projections Cnav), départs anticipés pour carrière longue déjà
            permis par le droit d'avant 2023 (donc déjà dans retour_62) « de l'ordre de 10-15 % parmi les générations nées
            dans les années 1960 et 6-8 % parmi celles nées dans les années 1970 » ; SRE (même séance, doc. 11), part des
            affiliés de la fonction publique d'État remplissant la condition de 4 ou 5 trimestres avant 20 ans : « elle passe
            de 37,7 % pour la génération 1960 à 8,6 % pour la génération 1970 » ; DREES (Les retraités et les retraites,
            édition 2025), « 26 % des assurés du régime général et de ceux de la CNRACL nés en 1956 ont bénéficié d'un départ
            anticipé » pour carrière longue. Lecture : environ un quart à un tiers des générations 1966-1972 a commencé avant
            20 ans, dont une part part déjà à 60 ans dans la référence, plus un gain partiel pour les débuts entre 20 et 24
            ans et demi. Recoupement : Fondation IFRAP (2022), 9,6 Md€ en 2027 pour le seul volet « 60 ans avec 40 annuités
            avant 20 ans », soit ≈ 11 Md€ en 2032, contre 3,3 + 9,4 = 12,7 Md€ ici au périmètre du système (5,6 + 18,4 = 24 Md€ au périmètre APU).
      explication: >-
        Reconstruit à partir des barèmes communs, comme les autres promesses de retraite (LFI, Écologistes, PS), au
        périmètre de l'ensemble des administrations publiques (convention commune 4) : annulation des mesures d'âge de
        2023 nette de la suspension (29,1) ; durée ramenée de 171 à 168 trimestres pour tous (0,75 × 7,4 = 5,55) ; pour
        les bénéficiaires du barème progressif, le passage de 62 à 60 ans et de 42 à 40 annuités, au prorata de leur
        poids (0,35 × (37,7 + 2 × 7,4) = 18,38) : 53,03 Md€. Le RN coûte ainsi moins que « 60 ans et 40 annuités pour
        tous » (LFI, 85,3 Md€), dont il est un sous-ensemble. Bas = hauts des barèmes APU (31,2 ; 40,3 ; 8,1 par an de
        durée) et part 0,5 : 31,2 + 0,75 × 8,1 + 0,5 × (40,3 + 2 × 8,1) = 65,53 ; haut = même calcul au périmètre du seul
        système de retraite (13,9 + 0,75 × 4,4 + 0,35 × (18 + 2 × 4,4) = 26,58, ancien central). Le chiffrage de
