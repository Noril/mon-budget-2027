annonce_candidat:
  cout_md: null
  financement_md: 125
  texte: >-
    Au débat du Medef (REF, 27 août 2026) : « Nous présenterons juste avant le débat budgétaire notre trajectoire de
    rétablissement des finances publiques avec 125 milliards d'euros d'économies » (horizon 2032, « objectif minimal
    » selon le porte-parole Stéphane Rambaud) ; document non publié au 29 septembre 2026. Réforme des retraites chiffrée
    par la candidate à « 9 milliards d'euros » (« déficit assumé »). Dernier chiffrage complet publié : contre-budget
    2026 du groupe RN (23 octobre 2025, base PLF 2026) : 88,3 Md€ d'économies et recettes nouvelles, 52,7 Md€ de baisses
    d'impôts et dépenses nouvelles, soit 35,6 Md€ d'amélioration nette du solde revendiquée.
  url: >-
    https://www.epochtimes.fr/marine-le-pen-promet-125-milliards-deuros-deconomies-et-defend-une-retraite-a-60-ou-62-ans-3335415.html
notes: >-
  Pas de programme présidentiel 2027 complet publié au 29 septembre 2026 : le plan de 125 Md€ d'économies est annoncé
  « avant le débat budgétaire » (début octobre). La collecte s'appuie sur (1) le contre-budget 2026 du groupe RN (octobre
  2025), dernier document chiffré ligne à ligne, dont les montants sont ceux du RN et non les nôtres, et dont la base
  est le PLF 2026 : les lignes qui annulent des mesures du PLF 2026 n'ont d'effet par rapport à la législation au 1er
  janvier 2027 que si ces mesures ont été adoptées en LFI/LFSS 2026 (à vérifier en phase 2) ; (2) les prises de parole
  de la candidate en 2026 (Medef 27 août, Hénin-Beaumont 13 septembre, LCI 16 septembre, lettre ouverte du 21 septembre)
  ; (3) le programme législatif 2024, seulement pour les mesures reconfirmées depuis. Engagements 2022 non reconfirmés
  et donc exclus : renationalisation des autoroutes, privatisation de l'audiovisuel public (le contre-budget 2026 prévoit
  seulement une baisse de dotation), plan santé de 20 Md€, budget de défense à 55 Md€ en 2027 (le programme 2024 veut
  « sanctuariser » la LPM), exonération d'IR des moins de 30 ans (attribuée à J. Bardella par des sites secondaires,
  sans source primaire trouvée). Tension interne documentée : J. Bardella (mai 2026) a évoqué un relèvement de l'âge
  légal ; l'arbitrage de juillet 2026 et le débat Medef ont confirmé la ligne 60/62 ans de la candidate. Le conseiller
  économique F. Durvye a quitté la campagne le 27 août 2026. Chiffrage (phase 2) : quand le seul chiffre disponible est
  celui du candidat (ou de Sarah Knafo), il est projeté en 2032 au PIB nominal, le central le reprend et le bas retient
  la moitié de l'économie (convention, paramètre « convention du chiffrage ») ; les enveloppes d'économies non détaillées
  suivent la règle 6 (central 0, haut = écart d'affichage).
mesures:
  - id: tva-energie-5-5
    libelle: Baisse de la TVA de 20 % à 5,5 % sur les énergies (carburants, électricité, gaz, fioul, bois)
    domaine: fiscalite
    citation:
      texte: >-
        Si LFI demande un blocage des prix à 1,70 euros le litre, Marine Le Pen exige une baisse de la TVA sur l'énergie
        de 20 à 5,5%, au cœur de son programme.
      url: >-
        https://www.boursorama.com/actualite-economique/actualites/salaires-carburants-mobilisations-le-pouvoir-d-achat-s-impose-dans-la-campagne-d6706e6c8501042962d517b99d95cad1
      date: '2026-09-15'
      support: presse
    precision: precise
    interpretation: >-
      Mesure phare constante depuis 2022, reconfirmée en septembre 2026 (AFP ; LCI 16 septembre). Périmètre du contre-budget
      2026 : « Baisse TVA énergies 10,960 » Md€ (gaz, électricité, carburants, bois, fioul), montant du RN. Le taux de
      5,5 % s'applique déjà à l'abonnement électricité/gaz : chiffrer sur les consommations au taux normal. Juridiquement
      contestée (directive TVA) : non retenu dans le montant, signalé en confiance. Montée en charge : loi de finances
      rectificative dès l'été 2027 (programme 2024), d'où 40 % en 2027. Compatibilité avec la directive TVA non acquise
      pour les carburants (plancher) : non déduite.
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -17.0
      bas: -20.45
      haut: -13.0
      montee_en_charge:
        '2027': 0.4
        '2028': 1.0
        '2029': 1.0
        '2030': 1.0
        '2031': 1.0
        '2032': 1.0
    calcul:
      formule: -(elec + gaz + carburants + fioul)
      parametres:
        elec:
          valeur: 5.0
          bareme: tva_energie_electricite_5_5
          unite: Md€/an de recettes perdues (APU)
        gaz:
          valeur: 2.0
          bareme: tva_energie_gaz_5_5
          unite: Md€/an de recettes perdues (APU)
        carburants:
          valeur: 9.4
          bareme: tva_energie_carburants_5_5
          unite: Md€/an de recettes perdues (APU)
        fioul:
          valeur: 0.6
          bareme: tva_energie_fioul_5_5
          unite: Md€/an de recettes perdues (APU)
      explication: >-
        Somme des barèmes par énergie (électricité et gaz des ménages, carburants routiers hors fioul, fioul) ; bas = bornes
        hautes des barèmes, haut = bornes basses. Le barème carburants (9,4) exclut le fioul, compté une seule fois. Bois de chauffage omis (déjà en partie à taux réduit, montant faible). Montants énergétiques
        non projetés au PIB (volumes et prix).
    chiffrages_tiers:
      - auteur: Institut Montaigne (législatives 2024)
        montant_md: -11.3
        url: >-
          https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/baisser-la-tva-de-20-a-55-pour-les-carburants-lelectricite-le-gaz-et-le-fioul-domestique
        commentaire: fourchette 9 à 13,6 Md€ selon la réaction de la consommation
      - auteur: Ministère de l'Économie (Bercy), cité par Public Sénat
        montant_md: -16.8
        url: >-
          https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      - auteur: Contre-budget RN 2026 (chiffrage du candidat)
        montant_md: -10.96
        url: https://rassemblementnational.fr/documents/GRN-CONTRE-BUDGET-2026.pdf
    effets_retour: >-
      Le RN invoque un effet « déflationniste » et un retour de TVA sur les autres consommations (1,82 Md€ dans le contre-budget)
      : non comptés.
    confiance: moyenne
    verification:
      statut: corrige
      par: verificateur-sonnet
      date: '2026-09-29'
      commentaire: >-
        Citation retrouvée sur l'URL. Barèmes tva_energie_* relus (Bercy juin 2024 : électricité 4,5, gaz 2,3,
        carburants 10 ; recalcul SDES). Total 17,6 proche de Bercy 16,8 et de Montaigne 11,3 à 13,6 (fourchette de
        consommation). Réserve : le « carburants 10 Md€ » de Bercy inclut vraisemblablement le fioul, d'où ≈ 0,6 Md€
        de double compte possible avec la ligne fioul (couvert par la fourchette). Non-conformité à la directive TVA
        signalée, non déduite.
        Recalé sur les conventions communes du 29/09 : barème carburants ramené à 9,4 Md€ (carburants routiers hors
        fioul), ce qui supprime le double compte avec la ligne fioul ; central −17,6 → −17,0, haut −14,8 → −13,0
        (bornes basses : 4,5 + 1,7 + 6,4 + 0,4).
