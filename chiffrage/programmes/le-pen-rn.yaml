        terrestre 1 157,1 + éolien en mer 965,6 + photovoltaïque 4 125,5 = 6 248,2 M€ (2026) ; 1 404,6 + 1 306,7 + 4
        579,2 = 7 290,5 M€ (2027), soit +1,04 Md€ par an ; « soutien déjà engagé par l'Etat (environ +10 GWe estimés
        par la CRE entre 2026 et 2029) » relu. Plafond (contrats signés dus) : 3,12 Md€, sous les 7,2 Md€ du RN.
