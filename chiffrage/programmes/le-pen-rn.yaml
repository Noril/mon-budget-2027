            avril 2026)
          unite: facteur
          note: 'PIB nominal 2032 / 2029 (croissances nominales 2030-2032 : 2,99 %, 2,83 %, 2,83 %)'
      explication: >-
        Montée de Montaigne décalée de trois ans (mise en œuvre 2028) : 2032 = quatrième année = 12 Md€ ; bas = régime
        de croisière (15 Md€), haut = recours limité (valeur de la deuxième année).
