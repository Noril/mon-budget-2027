      due par tout employeur, privé ou public, à l'exception des particuliers employeurs », « tant que la France
      n'est pas au « plein emploi » » ; assiette « estimée à environ 1,3 million de salariés extra-communautaires »,
      rendement « de l'ordre de 1,3 milliard d'euros par an » (Public Sénat). L'annexe du dossier compte 1 Md€
      (Institut de l'Entreprise). S'ajoute à la taxe existante à l'embauche d'un salarié étranger (CESEDA, art. L.
      436-10). Fragilité juridique (principe d'égalité, droit de l'UE sur l'égalité de traitement des travailleurs
