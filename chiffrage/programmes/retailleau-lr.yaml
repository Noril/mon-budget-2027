  - id: non-remplacement-125000-departs
    libelle: 125 000 départs à la retraite non remplacés dans la fonction publique grâce à l'IA (7,5 Md€ par an à terme)
    domaine: etat
    citation:
      texte: >-
        Les 125 000 départs non remplacés, eux, produisent une économie nette de masse salariale de l'ordre de 7,5
        milliards d'euros par an à terme, affectée à la réduction du déficit.
      url: https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf
      date: 2026-07
      support: programme (livret IA, p. 27)
    precision: precise
    interpretation: >-
      Trajectoire « amorçage en 2027-2028, cible en 2031-2032 ». Toutes fonctions publiques ; l'Éducation nationale
      exclue (« ne vise aucune suppression de poste »). Dans l'entretien du 1er juillet 2026 : « Je ne remplacerai
      pas tous les fonctionnaires qui partiront à la retraite. Il y a une économie à faire d'à peu près 250 000
      postes » ; l'IFRAP résume « 250 000 à 300 000 postes ». Le livret précise que 125 000 sont redéployés sans
      économie : retenir 125 000 en central, 250 000 en haut.
    chiffrable: true
    nature: economie
    effet_solde_primaire:
      central: 2.79
      bas: 1.4
      haut: 4.01
      montee_en_charge:
        '2027': 0
        '2028': 0.2
        '2029': 0.4
        '2030': 0.6
        '2031': 0.8
        '2032': 1
    calcul:
      formule: departs_non_remplaces*brut_entrant*(1 - retour)/1e9
      parametres:
        departs_non_remplaces:
          valeur: 125000
          source: https://republicains.fr/wp-content/uploads/2026/07/LR_IA.pdf
          unite: agents
          note: p. 27
        brut_entrant:
          valeur: 31000
          source: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
          unite: € brut par an, hors cotisations employeurs
          note: >-
            « coût moyen des entrants (salaire brut des agents de moins de 30 ans en pratique) d'environ 31 000 € pour
            l'État, 28 000 € pour les collectivités locales et 34 000 € pour les hôpitaux » ; même base que les barèmes
            cout_*_apu ; non projeté (point d'indice gelé à droit constant, convention 2)
        retour:
          valeur: 0.28
          bareme: retour_prelevements_salaires_publics
          unite: part de la rémunération brute
      explication: '125 000 départs non remplacés d''ici 2032 × coût d''un entrant pour le solde des APU (convention
        commune 1 : 31 000 € brut hors cotisations employeurs × (1 − 0,28) ≈ 22 300 €, non projeté). Le candidat
        compte 60 000 € chargés (CAS Pensions compris, 7,5 Md€) : les cotisations employeurs vont à d''autres APU et
        ne comptent pas pour le solde. Les 125 000 agents « remis sur le terrain » ne produisent aucune économie (livret).
        L''entretien du 1er juillet 2026 (« à peu près 250 000 postes ») et l''IFRAP (250 000 à 300 000) comptent les
        deux moitiés : pas de ligne supplémentaire. Bas : moitié rétrocédée en mesures catégorielles (convention RGPP
        du barème non_remplacement_un_sur_deux_etat). Haut : postes valorisés au coût d''un agent moyen (masse salariale
        brute APU hors cotisations employeurs 248 Md€ / 5,8 M agents ≈ 42 760 € × (1 − 0,25) ≈ 32 070 €). Éducation nationale exclue : pas de double compte avec les postes
        d''enseignants.'
    confiance: moyenne
    verification:
      statut: ok
      par: passe-sources
      date: "2026-09-29"
      commentaire: >-
        Passe sources (29/09/2026) : FIPECO relu (« Le coût moyen des entrants (salaire brut des agents de moins de 30 ans en pratique) est d'environ 31 000 € pour l'Etat ») ; le site de campagne (mesure n° 102) confirme 125 000 départs non remplacés et « environ 7,5 milliards d'euros de masse salariale ». Valeurs inchangées. Vérification précédente (verificateur-sonnet, corrige) :
        Citation vérifiée (livret IA p. 27 : 7,5 Md€ = 125 000 × 60 000 €). Pas de double compte avec les
        enseignants (Éducation nationale exclue) ni avec les 250 000 postes de l'entretien (mêmes agents
        comptés une fois). Réserve de barème : le coût d'entrée de 60 000 € inclut le CAS Pensions (82,28 %
        du traitement), transfert interne aux APU qui ne réduit pas à court terme les pensions versées ;
        l'économie nette réelle en 2032 serait plus proche de la masse salariale hors CAS.
        Recalé sur les conventions communes du 29/09 : coût d'un poste ramené au coût d'un entrant pour le solde des APU
        (31 000 € brut hors cotisations employeurs × 0,72, convention 1) au lieu de 60 000 € chargés projetés au PIB, ce
        qui règle la réserve sur le CAS Pensions ; central 8,9 → 2,8 Md€, bas 4,4 → 1,4, haut 8,9 → 4,0 (agent moyen).
