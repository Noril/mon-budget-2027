  - id: suramortissement-industriel
    libelle: Sur-amortissement fiscal de l'investissement industriel (et des plateaux techniques des lycées professionnels)
    domaine: fiscalite
    citation:
      texte: >-
        En complément, un dispositif distinct de sur-amortissement fiscal sera introduit afin d'encourager
        l'investissement industriel.
      url: https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf
      date: 2026-02
      support: programme (livret « Produire plus », p. 26)
    precision: vague
    interpretation: Taux et assiette non précisés ; prendre comme référence le sur-amortissement Macron 2015-2017 (40 %) et son coût constaté.
    chiffrable: false
    raison_non_chiffrable: 'Taux, assiette et durée non précisés : trop vague pour être chiffré.'
    sens_probable: cout
    estimation_indicative:
      central: -1.5
      bas: -4.0
      haut: -0.5
      lecture: 'Convention : sur-amortissement de 40 % (référence 2015-2017) réservé à l''industrie. Repère sourcé : la seule
        prolongation d''un an du dispositif 2015-2017, ouvert à tous les secteurs, réduisait l''IS de 350 M€ la première
        année (Sénat, rapport sur le PLFR 2016 : « prolongation d''un an de la mesure de suramortissement [...] soit une
        baisse de 350 millions d''euros des recettes d''IS ») ; le coût d''un dispositif permanent cumule les déductions
        étalées sur la durée d''amortissement et atteint, après cinq ans (2028-2032), plusieurs fois l''effet de première
        année. Central : ≈ 1,5 Md€ (quatre générations d''investissement en cours d''amortissement, champ industriel). Bas :
        champ large (tous secteurs, comme en 2015-2017) ; haut : taux ou champ réduits (PME industrielles, cf. suramortissement
        numérique 2019-2025 : 30 M€ au total, DGE 2026).'
      sources:
      - https://www.senat.fr/rap/l16-214-1/l16-214-1_mono.html
      - https://www.entreprises.gouv.fr/files/files/Publications/2026/themas/thema-40-suramortissement.pdf
      - https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf
    verification:
      statut: ok
      par: passe-sources
      date: "2026-09-29"
      commentaire: >-
        Passe sources (29/09/2026) : repères sourcés (Sénat, PLFR 2016 : 350 M€ d'IS pour un an de prolongation du dispositif 2015-2017 ; DGE, Théma n° 40, avril 2026 : 30 M€ pour le suramortissement numérique) ; l'hypothèse non sourcée de 25 Md€ d'investissement industriel est retirée ; estimation inchangée, écrite comme convention (hors solde).
