  - id: differe-dmtg-transmission-entreprises
    libelle: Différé automatique des droits de mutation sur la transmission d'entreprises et d'exploitations agricoles tant qu'il n'y a pas de cession
    domaine: fiscalite
    citation:
      texte: >-
        Pour remédier à cette situation, nous proposons un dispositif simple : les droits de mutation sont calculés à
        la date de la transmission mais leur exigibilité est automatique différée, qu'il s'agisse d'entreprises
        individuelles ou de titres de sociétés exerçant une activité économique réelle.
      url: https://republicains.fr/wp-content/uploads/2026/02/LR_Produire_Plus_LIVRET.pdf
      date: 2026-02
      support: programme (livret « Produire plus », p. 34)
    precision: partielle
    interpretation: >-
      Étendu aux exploitations agricoles, « à côté du régime Dutreil actuel » (livret Agriculture), avec taux
      forfaitaire unique à la cession. Perte de recettes en trésorerie (DMTG sur titres hors Dutreil) ; l'effet
      définitif dépend des cessions futures.
    chiffrable: false
    raison_non_chiffrable: 'Assiette non publiée : montant des droits de mutation acquittés sur les transmissions de
      titres et d''entreprises hors pacte Dutreil. Effet de trésorerie (droits différés jusqu''à la cession) dont le
      coût définitif dépend des cessions futures. Barème à ajouter (voir besoins).'
    sens_probable: cout
    estimation_indicative:
      central: -0.3
      bas: -1.0
      haut: -0.1
      lecture: 'Droits de mutation sur les transmissions de titres et d''entreprises hors pacte Dutreil différés jusqu''à la cession
        (dont une partie n''intervient jamais avant 2032) : ordre de grandeur de quelques pourcents du produit des DMTG (21 Md€),
        l''essentiel des transmissions d''entreprises relevant déjà du Dutreil (4,5 Md€ de dépense fiscale). Bas : forte part
        de transmissions hors Dutreil ; haut : différé marginal.'
      sources:
      - dmtg_rendement
      - https://www.ccomptes.fr/sites/default/files/2025-11/20251118-Synthese-Pacte%20Dutreil.pdf
  - id: baisse-droits-succession
