  - id: choc-transmission-dons
    libelle: Choc de transmission pendant trois ans, dons exonérés jusqu'à 150 000 € (moins de 30 ans) et 100 000 € (moins de 40 ans)
    domaine: fiscalite
    citation:
      texte: >-
        Encourager la transmission du patrimoine immobilier aux jeunes générations grâce à un choc de transmission
        limité à trois ans : relèvement temporaire du plafond des dons familiaux exonérés à 150 000 euros pour les
        bénéficiaires de moins de 30 ans et à 100 000 euros pour ceux de moins de 40 ans - contre 31 865 euros
        aujourd'hui pour les seuls dons en numéraire -, applicable également aux donations et successions portant
        sur le patrimoine immobilier.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf
      date: 2026-04
      support: programme (livret Famille, p. 17 ; repris dans le livret Logement et l'entretien du 26 août 2026)
    precision: precise
    interpretation: >-
      Mesure temporaire (3 ans) : effet de régime de croisière 2032 nul ou négatif (anticipation des transmissions), coût concentré sur 2027-2030. Le livret Logement ajoute un plafond d'âge du donateur (moins de 80 ans).
    chiffrable: false
    raison_non_chiffrable: 'Mesure temporaire (trois ans) : effet nul ou légèrement négatif en régime de croisière 2032
      (anticipation des successions) ; son coût transitoire 2028-2030 dépend du volume de dons supplémentaires, non
      documenté.'
    sens_probable: cout
    estimation_indicative:
      central: -0.3
      bas: -1.0
      haut: 0.0
      lecture: 'Dons exonérés (2027-2030) qui auraient été taxés à la succession : en 2032, perte de droits de succession sur
        les patrimoines transmis par anticipation, sans recette de donation en contrepartie. Bas : dons massifs ; haut : effet
