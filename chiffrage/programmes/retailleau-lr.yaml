      Cédric Perrin (LR), « qui ferraillait [...] pour défendre un effort de + 50 milliards d'euros » ; Retailleau,
      sénateur et candidat, s'est seulement « déplacé pour lui parler » et a promis de « financer la nouvelle LPM »,
      sans montant. Aucun engagement présidentiel chiffré retrouvé (site de campagne sans page défense au 29 septembre
      2026 ; l'IFRAP résume : « Lancer un livre blanc sur la défense », « au moins 100 000 réservistes », sans montant).
      Référence : la LPM actualisée a été promulguée avec +36 Md€ sur 2026-2030 (loi n° 2026-791 du 16 août 2026).
