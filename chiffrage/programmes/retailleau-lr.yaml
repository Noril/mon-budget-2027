        la loi du 16 août 2026) : 14 Md€ de plus, soit « de 2,5 à 2,7 % du PIB la part de la défense » (Public Sénat),
        +0,2 point de PIB maintenu en 2032 × 3,6 Md€ (barème defense_0_1_point_pib_2032) = −7,2 Md€. Haut : 0, loi
        promulguée seulement.'
      sources:
