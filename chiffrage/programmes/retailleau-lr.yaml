annonce_candidat:
  cout_md: null
  financement_md: 120
  texte: >-
    Pas de chiffrage global publié. Engagements chiffrés épars : « je m'engage parallèlement sur un plan
    d'économies de 120 milliards d'euros à l'horizon 2032 » (Contrepoints/IREF, 15 avril 2026) ; « leur rendre
    40 milliards d'euros de compétitivité dès 2027 » (15 Md€ de cotisations patronales, 10 Md€ heures
    supplémentaires, 15 Md€ d'impôts de production), présenté comme « identifié, financé » ; « Travail gagnant » :
    mesures générant « au moins 30 milliards d'euros de gains » (tableau : 28,5 à 31,7 Md€) « intégralement
    restitués aux salariés et aux entreprises » ; IA : « économies nettes de l'ordre de 15 milliards d'euros par an
    à terme » ; retraites : « 40 milliards d'économies en cumulé sur cinq ans ». Selon ÉlyséeScope (d'après un
    entretien au Figaro fin mars 2026, non consulté) : baisse des dépenses publiques de 80 Md€.
  url: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
notes: >-
  Phase 1 (collecte), 29 septembre 2026. Pas de programme présidentiel unique publié : le projet est une série de
  livrets thématiques des Républicains (travail, production, agriculture, famille, logement, électricité, IA,
  école) complétés par entretiens. Thèmes non encore publiés en livret : santé (annoncé), retraites (détaillé
  seulement à l'oral le 22 septembre 2026), sécurité/justice, immigration, défense. Les citations des livrets PDF
  sont extraites du texte du PDF (espaces et retours à la ligne normalisés). Aucun chiffrage indépendant complet
  (Institut Montaigne, OFCE, IPP) trouvé à la date de collecte ; l'IFRAP tient une synthèse sans chiffrage propre.
  Doubles comptes à surveiller en phase 2 : (i) les « 40 Md€ de compétitivité » recouvrent le seuil zéro
  cotisation (10 Md€), la baisse de cotisations patronales (15 Md€) et les impôts de production (15 Md€) ;
  (ii) les « 30 Md€ » de Travail gagnant financent la moitié salariale (15 Md€) et la moitié entreprises
  (15 Md€, la même que les 15 Md€ de cotisations patronales) ; (iii) les 250 000 postes (entretien du 1er juillet
  2026) contre 125 000 départs non remplacés (livret IA) ; (iv) la fraude sociale dans le CSU (10 Md€) et dans
  le livret IA (3 à 4 Md€) ; (v) l'enveloppe de 120 Md€ d'économies d'ici 2032. Recherche web interrompue
  (quota) avant d'avoir trouvé les sources primaires sur l'AME, l'APD et la justice des mineurs : citations
  reprises d'agrégateurs, à revérifier.
mesures:
  # --- Cadre budgétaire -------------------------------------------------------------------------
  - id: enveloppe-economies-120md
    libelle: Plan d'économies de 120 Md€ à l'horizon 2032
    domaine: finances-publiques
    citation:
      texte: >-
        Cette ambition fiscale ne sera toutefois crédible qu'adossée à un effort sérieux de maîtrise de la dépense
        publique : c'est pourquoi je m'engage parallèlement sur un plan d'économies de 120 milliards d'euros à
        l'horizon 2032, condition sine qua non du redressement durable de nos finances publiques.
      url: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
      date: 2026-04-15
      support: entretien écrit (réponses à l'IREF publiées par Contrepoints)
    precision: vague
    interpretation: >-
      Enveloppe non détaillée : règle 6 (central = part documentée par les mesures identifiables ci-dessous, sans
      double compte ; haut = 120 ; bas = 0). L'IFRAP la résume « uniquement par la baisse des dépenses et sans
      hausses d'impôts autres que celles annoncées en juillet 2025 ». ÉlyséeScope cite 80 Md€ (Figaro, mars 2026).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    chiffrages_tiers:
      - auteur: Fondation IFRAP (synthèse, pas de chiffrage propre)
        montant_md: 120
        url: https://www.ifrap.org/comparateurs/presidentielles-2027
        commentaire: >-
          « Redresser les finances publiques de 120 Md€ d'ici 2032 uniquement par la baisse des dépenses »
  - id: regle-or-constitution
    libelle: Règle d'or budgétaire dans la Constitution (révision soumise à référendum dès 2027)
    domaine: institutions
    citation:
      texte: Mettre en place une règle d'or dans le cadre de la révision constitutionnelle soumise à référendum dès 2027.
      url: https://www.ifrap.org/comparateurs/presidentielles-2027
      date: 2026-09-29
      support: synthèse tierce (IFRAP) ; source primaire non retrouvée
    precision: vague
    chiffrable: false
    raison_non_chiffrable: Règle institutionnelle sans effet budgétaire direct.

  # --- Travail gagnant (décembre 2025 / janvier 2026) -------------------------------------------
  - id: seuil-zero-cotisation
    libelle: Seuil « zéro cotisation » au-delà de 1 623 heures par an (exonération totale de cotisations salariales et patronales)
    domaine: travail
    citation:
      texte: >-
        Au-delà, la rémunération des heures travaillées est majorée selon les termes de l'accord d'entreprise et
        exonérées de toutes les cotisations sociales, salariales et patronales. L'employeur ne paye que le salaire
        brut. Le salaire n'acquitte que la CSG et la CRDS. Le dispositif actuel d'exonération d'impôt sur le revenu
        existant des heures supplémentaires est intégralement maintenu.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 21)
    precision: precise
    interpretation: >-
      Seuil annuel 1 623 h (au lieu de 1 607 h). Le livret affirme un « impact neutre » (cotisations sur les 16 h
      nouvellement travaillées) et chiffre à 4,3 Md€ la restitution aux entreprises sur les heures supplémentaires
      existantes, 6,3 Md€ de « potentiel » ; Retailleau (IREF, avril 2026) parle de « 10 milliards d'euros sur les
      heures supplémentaires » rendus aux entreprises. À chiffrer sur les heures supplémentaires existantes
      (effet statique), l'effet volume étant un effet retour non compté.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    effets_retour: Le candidat invoque 2 % de PIB supplémentaire et l'autofinancement par les 16 heures nouvellement travaillées.
  - id: baisse-cotisations-patronales-non-contributives
    libelle: Baisse de 15 Md€ des cotisations patronales finançant des dépenses universelles (famille, santé, logement, transport)
    domaine: fiscalite
    citation:
      texte: >-
        Concrètement : 15 milliards d'euros rendus par une réforme du financement de la protection sociale — en
        faisant des économies sur l'assistanat grâce au compte social unique et à la réforme de l'indemnisation
        chômage, et en abaissant les cotisations patronales qui financent des dépenses universelles n'ayant rien à
        faire sur la feuille de paie
      url: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
      date: 2026-04-15
      support: entretien écrit
    precision: partielle
    interpretation: >-
      Le livret « Produire plus » (p. 20) indique « Plus de 25 milliards d'euros d'allègements porteront sur le coût
      du travail, en combinant la mise en place du seuil « zéro cotisation » […] et une baisse directe des
      cotisations patronales non contributives ». Lecture retenue : 15 Md€ de baisse directe, distincts des 10 Md€
      du seuil zéro cotisation. Cotisations visées non précisées (famille, maladie, FNAL, versement mobilité).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: restitution-pouvoir-achat-salaries
    libelle: Restitution de 15 Md€ de pouvoir d'achat aux salariés (environ 500 € par an au salaire médian)
    domaine: fiscalite
    citation:
      texte: >-
        Concrètement, les 30 milliards d'euros seront redonnés pour moitié aux salariés, sous forme de pouvoir
        d'achat supplémentaire (environ 500 euros par an au niveau du salaire médian), et pour moitié aux entreprises,
        par une baisse du coût du travail dès la première heure. Le détail sera fourni lors de la présentation des
        mesures
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 16)
    precision: vague
    interpretation: >-
      Instrument non précisé (baisse de cotisations salariales, de CSG ?). Coût brut 15 Md€ ; la moitié
      « entreprises » est la baisse de cotisations patronales ci-dessus (ne pas la compter deux fois).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: revenu-incitation-activite
    libelle: Revenu d'incitation à l'activité (RIA) fusionnant RSA, prime d'activité et ASS
    domaine: protection-sociale
    citation:
      texte: >-
        Une personne adulte de moins de 65 ans, sans activité et sans revenu, en situation régulière, perçoit un «
        RIA Socle » de 300 euros par mois. Si elle s'investit dans une formation ou une recherche active d'emploi,
        justifiant d'au moins quinze heures d'activité hebdomadaires, son RIA est complété par un « RIA Insertion »
        de 250 euros par mois.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 23)
    precision: precise
    interpretation: >-
      Taux de dégressivité 30 % du salaire, sortie à 1 833 € de revenus d'activité ; individualisé (ne dépend pas
      de la situation familiale). Gain revendiqué : 2,0 Md€ (tableau p. 35). Fusion à chiffrer par microsimulation
      (IPP/Ines) ou à défaut par comparaison des masses RSA + PA + ASS.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: compte-social-unique-plafond-70-smic
    libelle: Compte social unique et plafonnement du cumul des aides non contributives à 70 % du SMIC net par adulte, lutte contre la fraude
    domaine: protection-sociale
    citation:
      texte: >-
        Une fois ce recensement en place, un plafond national pourrait s'appliquer, hors handicap, dépendance et
        vieillesse. Le total des aides ne pourrait pas dépasser 70 % du SMIC net par adulte.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 29)
    precision: partielle
    interpretation: >-
      Gain revendiqué : « Compte social unique (CSU) et lutte contre la fraude 10,0 Md€ » (tableau p. 35), sans
      décomposition. Le plafond porte aussi sur des aides locales et en nature ; l'ajustement se fait par minoration
      du RSA/RIA. Chiffrer séparément le plafonnement (nombre de ménages au-dessus du plafond) et la fraude évitée.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
    chiffrages_tiers:
      - auteur: Le Monde, Les Décodeurs (critique du cas-type, pas de chiffrage du gain)
        montant_md: null
        url: https://www.lemonde.fr/les-decodeurs/article/2026/01/08/1-7-fois-le-smic-sans-travailler-le-calcul-acrobatique-de-bruno-retailleau-pour-denoncer-l-assistanat_6661053_4355770.html
        date: 2026-01-08
        commentaire: Conteste le cas-type (1,7 SMIC) ; LR a répondu le 9 janvier 2026 (PDF en sources). Article non consulté (payant).
  - id: chomage-regles-juin-2024
    libelle: Mise en œuvre des règles d'assurance chômage de juin 2024 (durée maximale 18 à 15 mois, contracyclicité) et fin d'indemnisation au troisième refus d'offre raisonnable
    domaine: travail
    citation:
      texte: >-
        Les règles de juin 2024 sur l'indemnisation du chômage, jamais appliquées, allaient dans la bonne direction.
        Elles prévoyaient une réduction de la durée maximale d'indemnisation (de 18 à 15 mois), une modulation en
        fonction de la conjoncture, un accès plus tardif aux droits prolongés pour les seniors et un renforcement des
        obligations de recherche d'emploi. Leur mise en œuvre permettrait de dégager à terme 4 à 5 milliards d'euros
        d'économies par an.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 31-32)
    precision: precise
    interpretation: Référence au décret de juin 2024 (Attal), chiffré par l'Unédic à l'époque ; vérifier la législation au 1er janvier 2027 (convention 2025 et avenants) pour le référentiel.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: chomage-ruptures-conventionnelles
    libelle: Indemnisation chômage après rupture conventionnelle limitée à six mois et plafonnée
    domaine: travail
    citation:
      texte: >-
        Chaque année, plus de 500 000 ruptures conventionnelles sont conclues, pour un coût estimé entre 7 et 8
        milliards d'euros. Beaucoup concernent des salariés en capacité de retrouver rapidement un emploi. La réforme
        consiste à limiter la durée d'indemnisation à six mois et à plafonner le montant perçu, afin d'adapter la
        protection à un départ négocié.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 32)
    precision: partielle
    interpretation: >-
      Le tableau p. 35 attribue 7,0 à 8,0 Md€ d'économies à cette mesure, soit la totalité du coût estimé des
      ruptures conventionnelles alors que la mesure ne fait que réduire la durée : incohérence à relever. Plafond
      non précisé.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: chomage-frontaliers
    libelle: Indemnisation chômage des travailleurs frontaliers calculée sur un salaire français équivalent
    domaine: travail
    citation:
      texte: >-
        Le surcoût annuel est estimé entre 500 et 700 millions d'euros. La réforme prévoit de calculer l'allocation
        sur un salaire de référence français équivalent, tout en maintenant le mécanisme de remboursement de trois à
        cinq mois par le pays d'emploi.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 33)
    precision: precise
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: chomage-alternance-hauts-revenus
    libelle: Plafonnement et dégressivité accélérée au-delà de 3 000 € nets, rechargement des droits porté à 9 ou 12 mois
    domaine: travail
    citation:
      texte: >-
        La réforme prévoit de plafonner l'allocation au-delà d'un certain niveau de revenu, d'accélérer la
        dégressivité au-dessus de 3 000 euros nets et d'allonger la période minimale de rechargement des droits à 9 ou
        12 mois.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 33)
    precision: partielle
    interpretation: Gain revendiqué 1,0 à 2,0 Md€ (tableau p. 35). Plafond non précisé.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: hausse-mecanique-is
    libelle: >-
      « Hausse mécanique des recettes d'impôt sur les sociétés » (4 Md€) comptée comme gain par le candidat
    domaine: fiscalite
    citation:
      texte: Hausse mécanique des recettes d'impôt sur les sociétés 4,0 Md€
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », tableau p. 35)
    precision: vague
    interpretation: >-
      Pas une mesure mais un effet induit (baisse du coût du travail, donc hausse des bénéfices imposables). À
      traiter en phase 2 : soit retour direct à imputer sur la baisse de cotisations patronales (règle 3, si
      mécanique et documenté), soit effet retour non compté.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: seniors-exoneration-avant-age-legal
    libelle: Exonération totale de cotisations retraite et chômage pour les salariés ayant tous leurs trimestres avant l'âge légal
    domaine: retraites
    citation:
      texte: >-
        Pour les salariés ayant tous leurs trimestres mais n'ayant pas encore atteint l'âge légal de départ, et ne
        relevant d'aucun dispositif spécifique existant (carrières longues, pénibilité, bonification pour enfants,
        etc.), nous proposons une exonération totale de cotisations retraite et chômage.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 26)
    precision: precise
    interpretation: Le livret affirme un impact « neutre, voire positif, dès lors qu'une part limitée de seniors (10 % supplémentaires) choisit de prolonger son activité » ; le coût statique sur les seniors déjà en emploi est à chiffrer.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: cumul-emploi-retraite-renove
    libelle: Cumul emploi-retraite rénové remplaçant la surcote (exonération de cotisations hors CSG-CRDS, pension minorée de 30 % du revenu d'activité)
    domaine: retraites
    citation:
      texte: >-
        Après l'âge légal, un cumul emploi-retraite rénové se substitue aux dispositifs existants, dont la surcote.
        Il prévoit une exonération de cotisations sociales hors CSG-CRDS, un cumul partiel entre revenu d'activité et
        pension, celle-ci étant minorée de 30 % du revenu d'activité, et la suppression du délai de carence de six
        mois pour conserver un emploi chez le même employeur.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 13)
    precision: precise
