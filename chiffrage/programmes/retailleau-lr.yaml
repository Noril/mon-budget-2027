  # --- Électricité (juin 2026) ----------------------------------------------------------------------
  - id: fin-soutien-nouvelles-enr
    libelle: Fin des soutiens publics aux nouvelles capacités éoliennes et photovoltaïques (pas de tarif garanti ni de prise en charge du raccordement)
    domaine: energie
    citation:
      texte: >-
        Les situations juridiques constituées ne seront pas remises en cause. L'État tiendra ses engagements, y
        compris ceux qu'il n'aurait pas dû prendre. Mais il s'agira bien de la fin des subventions pour les futurs
        projets photovoltaïques et éoliens, et non d'un moratoire. Les projets disposant d'un équilibre économique
        propre pourront être instruits et autorisés - jamais financés par la collectivité. Pas d'aide publique, pas de
        tarif garanti, pas de prise en charge des coûts de raccordement.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Electricite_vFF070626.pdf
      date: 2026-06
      support: programme (livret Électricité, p. 21)
    precision: precise
    interpretation: >-
      Économie sur les charges de service public de l'énergie (budget de l'État, programme 345 / CAS) pour les
      projets non encore engagés au 1er janvier 2027, par rapport à la PPE 3. Fortement dépendante des prix de
      marché ; le raccordement relève des réseaux (hors APU).
    chiffrable: true
    nature: economie
    effet_solde_primaire:
      central: 3.12
      bas: 0.0
      haut: 3.12
      montee_en_charge:
        '2027': 0.0
        '2028': 0.0
        '2029': 0.0
        '2030': 0.33
        '2031': 0.67
        '2032': 1.0
    calcul:
      formule: croissance_annuelle * annees_non_engagees
      parametres:
        croissance_annuelle:
          valeur: 1.04
          source: https://www.cre.fr/fileadmin/Documents/Deliberations/2026/260715_2026-149_CSPE_2026-2027.pdf
          unite: Md€ par an
          note: hausse 2026→2027 des charges éolien + photovoltaïque (6,25 → 7,29 Md€, tableau 3)
        annees_non_engagees:
          valeur: 3
          source: https://www.cre.fr/fileadmin/Documents/Deliberations/2026/260715_2026-149_CSPE_2026-2027.pdf
          unite: années
          note: 'soutien déjà engagé jusqu''en 2029 (« environ +10 GWe estimés par la CRE entre 2026 et 2029 ») : 2030-2032'
      explication: 'Même calcul que la mesure RN et Reconquête fin-soutien-enr-intermittentes dans sa lecture « nouveaux contrats
        » : les contrats signés restent dus (le livret le dit), l''économie porte sur les contrats non engagés 2030-2032, approchés
        par la hausse annuelle récente des charges. Très sensible au prix de marché (≈ 90 M€ par €/MWh, CRE). Le raccordement
        relève des réseaux (hors APU). Bas : 0 (règle 6, économie non réalisée si les prix de marché remontent).'
    confiance: faible
    verification:
      statut: ok
      par: passe-sources
      date: "2026-09-29"
      commentaire: >-
        Passe sources (29/09/2026) : délibération CRE n° 2026-149 relue : tableau 3, charges 2026 → 2027 éolien terrestre 1 157,1 → 1 404,6 M€, éolien en mer 965,6 → 1 306,7 M€, photovoltaïque 4 125,5 → 4 579,2 M€ (6,25 → 7,29 Md€) ; « environ +10 GWe estimés par la CRE entre 2026 et 2029 » (soutien déjà engagé). Le site de campagne (mesure n° 86) confirme « Les situations juridiques constituées ne seront pas remises en cause ». Valeurs inchangées. Vérification précédente (recalage-couverture, corrige) :
        Classée non chiffrable à tort : la lecture est sans ambiguïté (fin du soutien aux seuls projets futurs) et le barème CRE utilisé pour le RN et Reconquête s'applique tel quel ; même montant (3,12 Md€ en 2032).
