  - id: deduction-interets-emprunt-familles
    libelle: Réduction d'impôt sur les intérêts d'emprunt de la résidence principale pour les familles (50/75/100 % selon le nombre d'enfants, plafond 400 € + 400 € par enfant)
    domaine: logement
    citation:
      texte: >-
        Réduire l'impôt sur le revenu des ménages qui achètent leur résidence principale grâce à la déduction d'une
        quote-part des intérêts d'emprunt : 50 % des intérêts annuels lorsque le foyer fiscal compte un enfant mineur,
        75 % s'il en compte deux, et 100 % s'il en compte trois ou plus. La réduction d'impôt annuelle est plafonnée à
        400 euros, majorés de 400 euros additionnels par enfant mineur à charge.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf
      date: 2026-04
      support: programme (livret Famille, p. 17 ; repris dans le livret Logement)
    precision: precise
    interpretation: >-
      Stock ou flux ? Le texte vise « les ménages qui achètent » : lecture retenue = tous les emprunts en cours pour la résidence principale des foyers avec enfants mineurs (fourchette haute) ou nouveaux emprunts seulement (basse). Référence : crédit d'impôt TEPA 2007-2010.
    chiffrable: false
    raison_non_chiffrable: Nombre de foyers avec enfants mineurs remboursant un prêt pour leur résidence principale
      et intérêts payés non publiés à ce niveau ; stock ou flux de prêts non précisé. Barème à ajouter (voir besoins).
    sens_probable: cout
    estimation_indicative:
      central: -1.5
      bas: -3.5
      haut: -0.4
      lecture: 'Repère sourcé : le crédit d''impôt TEPA sur les intérêts d''emprunt de la résidence principale (40 % puis 20 %
        des intérêts sur cinq annuités, tous acquéreurs) a coûté 1,6 Md€ en 2010 et 2 Md€ en 2011, à pleine charge (rapporteur
        général, commission des finances de l''Assemblée nationale). Le dispositif LR vise les seuls foyers avec enfants
        mineurs et plafonne la réduction à 800-1 600 € ; ouvert aux nouveaux emprunts en 2028, il atteint en 2032 une
        maturité comparable (cinq générations d''emprunts). Convention : central ≈ 2 Md€ (2011) × 1,6 (PIB nominal 2011→2032)
        × environ 0,5 (part des acquéreurs avec enfants mineurs et effet des plafonds) ≈ 1,5 Md€. Bas : stock des emprunts en
        cours ; haut : première année seulement.'
      sources:
      - https://www.assemblee-nationale.fr/13/cr-cfiab/10-11/c1011032.asp
      - https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf
