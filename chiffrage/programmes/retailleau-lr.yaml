annonce_candidat:
  cout_md: null
  financement_md: 120
  texte: >-
    Pas de chiffrage global publié. Engagements chiffrés épars : « je m'engage parallèlement sur un plan
    d'économies de 120 milliards d'euros à l'horizon 2032 » (Contrepoints/IREF, 15 avril 2026) ; « leur rendre
    40 milliards d'euros de compétitivité dès 2027 » (15 Md€ de cotisations patronales, 10 Md€ heures
    supplémentaires, 15 Md€ d'impôts de production), présenté comme « identifié, financé » ; « Travail gagnant » :
    mesures générant « au moins 30 milliards d'euros de gains » (tableau : 28,5 à 31,7 Md€) « intégralement
    restitués aux salariés et aux entreprises » ; IA : « économies nettes de l'ordre de 15 milliards d'euros par an
    à terme » ; retraites : « 40 milliards d'économies en cumulé sur cinq ans ». Selon ÉlyséeScope (d'après un
    entretien au Figaro fin mars 2026, non consulté) : baisse des dépenses publiques de 80 Md€.
  url: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
notes: >-
  Phase 1 (collecte), 29 septembre 2026. Pas de programme présidentiel unique publié : le projet est une série de
  livrets thématiques des Républicains (travail, production, agriculture, famille, logement, électricité, IA,
  école) complétés par entretiens. Thèmes non encore publiés en livret : santé (annoncé), retraites (détaillé
  seulement à l'oral le 22 septembre 2026), sécurité/justice, immigration, défense. Les citations des livrets PDF
  sont extraites du texte du PDF (espaces et retours à la ligne normalisés). Aucun chiffrage indépendant complet
  (Institut Montaigne, OFCE, IPP) trouvé à la date de collecte ; l'IFRAP tient une synthèse sans chiffrage propre.
  Doubles comptes à surveiller en phase 2 : (i) les « 40 Md€ de compétitivité » recouvrent le seuil zéro
  cotisation (10 Md€), la baisse de cotisations patronales (15 Md€) et les impôts de production (15 Md€) ;
  (ii) les « 30 Md€ » de Travail gagnant financent la moitié salariale (15 Md€) et la moitié entreprises
  (15 Md€, la même que les 15 Md€ de cotisations patronales) ; (iii) les 250 000 postes (entretien du 1er juillet
  2026) contre 125 000 départs non remplacés (livret IA) ; (iv) la fraude sociale dans le CSU (10 Md€) et dans
  le livret IA (3 à 4 Md€) ; (v) l'enveloppe de 120 Md€ d'économies d'ici 2032. Recherche web interrompue
  (quota) avant d'avoir trouvé les sources primaires sur l'AME, l'APD et la justice des mineurs : citations
  reprises d'agrégateurs, à revérifier.
mesures:
  # --- Cadre budgétaire -------------------------------------------------------------------------
  - id: enveloppe-economies-120md
    libelle: Plan d'économies de 120 Md€ à l'horizon 2032
    domaine: finances-publiques
    citation:
      texte: >-
        Cette ambition fiscale ne sera toutefois crédible qu'adossée à un effort sérieux de maîtrise de la dépense
        publique : c'est pourquoi je m'engage parallèlement sur un plan d'économies de 120 milliards d'euros à
        l'horizon 2032, condition sine qua non du redressement durable de nos finances publiques.
      url: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
      date: 2026-04-15
      support: entretien écrit (réponses à l'IREF publiées par Contrepoints)
    precision: vague
    interpretation: >-
      Support : entretien écrit publié par Contrepoints (publication d'origine des réponses du candidat) ; source
      primaire sur un support du candidat introuvable (ni republicains.fr ni avecretailleau.fr ne reprennent le
      chiffre de 120 Md€ au 29 septembre 2026).
      Enveloppe non détaillée : règle 6 (central = part documentée par les mesures identifiables ci-dessous, sans
      double compte ; haut = 120 ; bas = 0). L'IFRAP la résume « uniquement par la baisse des dépenses et sans
      hausses d'impôts autres que celles annoncées en juillet 2025 ». ÉlyséeScope cite 80 Md€ (Figaro, mars 2026).
    chiffrable: true
    nature: economie
    effet_solde_primaire:
      central: 0.0
      bas: 0.0
      haut: 86.57
      montee_en_charge:
        '2027': 0
        '2028': 0.2
        '2029': 0.4
        '2030': 0.6
        '2031': 0.8
        '2032': 1
    calcul:
      formule: 0*annonce
      parametres:
        annonce:
          valeur: 120
          source: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
          unite: Md€/an en 2032
          note: « un plan d'économies de 120 milliards d'euros à l'horizon 2032 »
        deja_compte:
          valeur: 33.43
          source: chiffrage/programmes/retailleau-lr.yaml
          unite: Md€
          note: 'somme des centraux des mesures d''économie de dépense chiffrées dans ce fichier : revenu-incitation-activite,
            compte-social-unique-plafond-70-smic, chomage-regles-juin-2024, chomage-ruptures-conventionnelles, chomage-frontaliers,
            chomage-alternance-hauts-revenus, retraites-age-63-taux-plein-65, revenu-familial-gains-gestion, apl-etudiants-d9-d10,
            hebergement-urgence-regularite-sejour, non-remplacement-125000-departs, ia-achats-publics, ia-lutte-fraude,
            aide-publique-developpement-baisse, ame-reduction, postes-enseignants-demographie'
      explication: 'Règle 6 : central = 0, toutes les économies documentées étant déjà comptées dans leurs lignes (33.43
        Md€) ; haut = annonce moins ces économies, soit l''écart d''affichage non documenté. Les 80 Md€ cités par ÉlyséeScope
        (Figaro, mars 2026) sont inférieurs à l''annonce retenue.'
    chiffrages_tiers:
      - auteur: Fondation IFRAP (synthèse, pas de chiffrage propre)
        montant_md: 120
        url: https://www.ifrap.org/comparateurs/presidentielles-2027
        commentaire: >-
          « Redresser les finances publiques de 120 Md€ d'ici 2032 uniquement par la baisse des dépenses »
    confiance: faible
    verification:
      statut: ok
      par: passe-sources
      date: "2026-09-29"
      commentaire: >-
        Passe sources (29/09/2026) : citation relue sur Contrepoints ; aucune source primaire du candidat ne reprend
        les 120 Md€ ; paramètre deja_compte recalculé sur les centraux du fichier. Vérification précédente
        (verificateur-sonnet, corrige) :
        Citation vérifiée (Contrepoints). Règle 6 (enveloppe globale) : central 0 correct. Valeurs
        corrigées : la somme des économies déjà comptées passe de 35,01 à 41,67 Md€ (ia-achats-publics et
        ia-lutte-fraude, désormais chiffrées selon la règle 6 ciblée), donc haut 84,99 -> 78,33 Md€.
        Recalé sur les conventions communes du 29/09 : économies déjà comptées ramenées de 41,67 à 33,43 Md€ après le
        recalage de non-remplacement-125000-departs (8,88 → 2,79) et postes-enseignants-demographie (3,0 → 0,85) ;
        haut 78,33 → 86,57.
  - id: regle-or-constitution
    libelle: Règle d'or budgétaire dans la Constitution (révision soumise à référendum dès 2027)
    domaine: institutions
    citation:
      texte: Mettre en place une règle d'or dans le cadre de la révision constitutionnelle soumise à référendum dès 2027.
      url: https://www.ifrap.org/comparateurs/presidentielles-2027
      date: 2026-09-29
      support: synthèse tierce (IFRAP) ; source primaire non retrouvée
    precision: vague
    chiffrable: false
    raison_non_chiffrable: Règle institutionnelle sans effet budgétaire direct.
    sens_probable: neutre

  # --- Travail gagnant (décembre 2025 / janvier 2026) -------------------------------------------
  - id: seuil-zero-cotisation
    libelle: Seuil « zéro cotisation » au-delà de 1 623 heures par an (exonération totale de cotisations salariales et patronales)
    domaine: travail
    citation:
      texte: >-
        Au-delà, la rémunération des heures travaillées est majorée selon les termes de l'accord d'entreprise et
        exonérées de toutes les cotisations sociales, salariales et patronales. L'employeur ne paye que le salaire
        brut. Le salaire n'acquitte que la CSG et la CRDS. Le dispositif actuel d'exonération d'impôt sur le revenu
        existant des heures supplémentaires est intégralement maintenu.
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 21)
    precision: precise
    interpretation: 'Seuil annuel 1 623 h (au lieu de 1 607 h). Le livret affirme un « impact neutre » (cotisations
      sur les 16 h nouvellement travaillées) et chiffre à 4,3 Md€ la restitution aux entreprises sur les heures supplémentaires
      existantes, 6,3 Md€ de « potentiel » ; Retailleau (IREF, avril 2026) parle de « 10 milliards d''euros sur les
      heures supplémentaires » rendus aux entreprises. À chiffrer sur les heures supplémentaires existantes (effet statique),
      l''effet volume étant un effet retour non compté. Chiffrage : effet statique sur les heures existantes ; les 10
      Md€ « de compétitivité » des 40 Md€ (IREF) correspondent à cette ligne, pas à une ligne supplémentaire.'
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -4.78
      bas: -12.11
      haut: -4.2
      montee_en_charge:
        '2027': 0.25
        '2028': 1
        '2029': 1
        '2030': 1
        '2031': 1
        '2032': 1
    calcul:
      formule: -(cout_hs_existantes - hs_exoneration_cout*part_salariale*part_heures_16h)*facteur
      parametres:
        cout_hs_existantes:
          valeur: 4.3
          source: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
          unite: Md€/an (2025)
          note: restitution aux entreprises sur les heures supplémentaires déjà réalisées, p. 21
        hs_exoneration_cout:
          valeur: 5.4
          bareme: hs_exoneration_cout
        part_salariale:
          valeur: 0.425
          source: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Depenses-fiscales.pdf
          unite: part
          note: exonération de cotisations salariales 2 306 M€ / 5 428 M€ (Cour des comptes, NEB 2026)
        part_heures_16h:
          valeur: 0.154
          source: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
          unite: part
          note: 16 heures entre 1 607 et 1 623 h sur 16 + 88 heures supplémentaires moyennes, p. 21
        facteur:
          valeur: 1.2106
          bareme: facteur_pib_2025_2032
          unite: facteur PIB nominal 2025→2032
      explication: 'Effet statique : exonération totale des cotisations patronales sur les heures supplémentaires existantes
        au-delà de 1 623 h (4,3 Md€ selon le livret), moins la perte de l''exonération salariale sur les 16 heures entre
        1 607 et 1 623 h qui cessent d''être des heures supplémentaires ; projeté en 2032 au PIB nominal. Bas : 10 Md€
        « sur les heures supplémentaires » rendus aux entreprises (IREF, avril 2026) × 1,2106, si les heures nouvelles
        se substituent à des heures qui auraient été faites. Haut : l''exonération d''IR des 16 heures disparaît aussi.'
    effets_retour: Le candidat revendique un autofinancement (cotisations sur les 16 heures nouvellement travaillées)
      et +2 % de PIB ; effet volume non compté.
    confiance: faible
    verification:
      statut: ok
      par: verificateur-sonnet
      date: "2026-09-29"
      commentaire: >-
        Citation vérifiée (livret p. 21). Paramètres relus dans le livret : 4,3 Md€ restitués sur les
        heures supplémentaires existantes, 16 h puis 88 h ; barème hs_exoneration_cout relu (5,4 Md€ = IR
        2,25 + salariale 2,306 + patronale 0,872). Formule statique cohérente, effet volume exclu ; bas 10
        Md€ = annonce IREF. Non-double compte avec les 15 Md€ : le bilan p. 38 sépare bien 15 Md€ « sur les
        1 623 heures » et 10 Md€ « au-delà ».
        Recalé sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2025_2032
        (valeur inchangée).
  - id: baisse-cotisations-patronales-non-contributives
    libelle: Baisse de 15 Md€ des cotisations patronales finançant des dépenses universelles (famille, santé, logement, transport)
    domaine: fiscalite
    citation:
      texte: >-
        Baisser les cotisations de 30 milliards d'euros par an. La moitié revient directement aux salariés, soit
        environ 500 euros nets par an au salaire médian, sans qu'ils aient rien à changer à leur organisation.
        L'autre moitié revient aux entreprises, en baisse durable du coût du travail dès la première heure
        travaillée, pour restaurer leur compétitivité.
      url: https://www.avecretailleau.fr/projet/mesure/rendre-30-milliards-d-euros-aux-salaries-et-aux-entreprises
      date: 2026-09-24
      support: site de campagne (mesure n° 24, mise à jour le 24 septembre 2026)
    precision: partielle
    interpretation: 'Source primaire : site de campagne, qui remplace l''entretien Contrepoints (15 avril 2026 : « 15 milliards
      d''euros rendus [...] en abaissant les cotisations patronales qui financent des dépenses universelles »). La mesure
      n° 34 du même site confirme : « Engager plus de 25 milliards d''euros d''allègements sur le coût du travail, en combinant
      le seuil « zéro cotisation » et une baisse directe des cotisations patronales non contributives ». Le livret « Produire plus » (p. 20) indique « Plus de 25 milliards d''euros d''allègements porteront
      sur le coût du travail, en combinant la mise en place du seuil « zéro cotisation » […] et une baisse directe des
      cotisations patronales non contributives ». Lecture retenue : 15 Md€ de baisse directe, distincts des 10 Md€ du
      seuil zéro cotisation. Cotisations visées non précisées (famille, maladie, FNAL, versement mobilité). Deux mesures
      distinctes, pas le même argent : cette ligne est la moitié « entreprises » des 30 Md€ de Travail gagnant (« baisse
      du coût du travail dès la première heure », « 15 milliards d''euros sur les 1 623 heures », bilan p. 38), identique
      aux 15 Md€ de cotisations patronales des 40 Md€ (IREF) ; la ligne « restituer 15 Md€ de pouvoir d''achat » est
      l''autre moitié, versée aux salariés (« environ 500 euros par an au niveau du salaire médian »). Les 10 Md€ «
      sur les heures au-delà » sont la ligne du seuil zéro cotisation.'
    chiffrable: true
    nature: baisse_recette
    effet_solde_primaire:
      central: -17.76
      bas: -17.76
      haut: -15.0
      montee_en_charge:
        '2027': 0.25
        '2028': 1
        '2029': 1
        '2030': 1
        '2031': 1
        '2032': 1
    calcul:
      formule: -montant_annonce*facteur
      parametres:
        montant_annonce:
          valeur: 15
          source: https://www.avecretailleau.fr/projet/mesure/rendre-30-milliards-d-euros-aux-salaries-et-aux-entreprises
          unite: Md€/an (2026)
          note: moitié « entreprises » de « Baisser les cotisations de 30 milliards d'euros par an » (site de campagne, 24 septembre 2026)
        facteur:
          valeur: 1.1842
          bareme: facteur_pib_2026_2032
          unite: facteur PIB nominal 2026→2032
      explication: 'Baisse de 15 Md€ de cotisations patronales (montant 2026, projeté en 2032 au PIB nominal, l''assiette
        étant la masse salariale). Haut : montant nominal non indexé. Doubles comptes : les 40 Md€ « de compétitivité
        » = 15 Md€ (cette ligne) + 10 Md€ (seuil zéro cotisation) + 15 Md€ (impôts de production, lignes C3S, CVAE,
        forfait social, CFE) ; la moitié « entreprises » des 30 Md€ de Travail gagnant est cette même ligne, comptée
        une seule fois.'
    effets_retour: 'Hausse « mécanique » de 4 Md€ d''IS revendiquée par le candidat (hausse des bénéfices) : effet de
      second tour, non compté.'
    confiance: moyenne
    verification:
      statut: ok
      par: passe-sources
      date: "2026-09-29"
      commentaire: >-
        Passe sources (29/09/2026) : citation et montant remplacés par la source primaire (site de campagne, mesure
        n° 24 du 24 septembre 2026 : 30 Md€ de baisse de cotisations, moitié entreprises) ; valeurs inchangées.
        Vérification précédente (verificateur-sonnet, corrige) :
        Citation vérifiée (Contrepoints). Le paquet de 40 Md€ = 15 (cette ligne) + 10 (seuil zéro) + 15
        (impôts de production) : chaque composante n'est comptée qu'une fois. Le bilan p. 38 du livret
        Travail gagnant (25 Md€ = 15 sur les 1 623 heures + 10 au-delà) confirme que la moitié «
        entreprises » des 30 Md€ est cette ligne. Coût brut, économies comptées dans leurs propres lignes :
        pas de double compte. Effet IS de 4 Md€ = second tour, correctement exclu.
        Recalé sur les conventions communes du 29/09 : facteur de projection 1,2106 / 1,022 = 1,1846 remplacé par le
        barème facteur_pib_2026_2032 (1,1842) ; central et bas −17,77 → −17,76.
  - id: restitution-pouvoir-achat-salaries
    libelle: Restitution de 15 Md€ de pouvoir d'achat aux salariés (environ 500 € par an au salaire médian)
    domaine: fiscalite
    citation:
      texte: >-
        Concrètement, les 30 milliards d'euros seront redonnés pour moitié aux salariés, sous forme de pouvoir
