  - id: retraites-age-63-taux-plein-65
    libelle: Âge minimal de départ à 63 ans, taux plein automatique à 65 ans, décote de 7 % par an, indexation sur l'espérance de vie
    domaine: retraites
    citation:
      texte: >-
        Le candidat Les Républicains à la présidentielle , Bruno Retailleau, instaurerait un âge de départ minimal à
        63 ans , le départ à taux plein à 65 ans et la capitalisation "pour les jeunes" , a-t-il détaillé sur LCI,
        mardi 22 septembre. […] Les retraités ayant arrêté le travail avant 65 ans se verront appliquer "une décote de
        7% par an" , a prévenu le candidat LR. […] Cette réforme a pour objectif, selon lui, de "sauver" la retraite
        par répartition et de faire "40 milliards d'économies en cumulé sur cinq ans" .
      url: https://www.franceinfo.fr/politique/bruno-retailleau/s-il-est-elu-bruno-retailleau-veut-instaurer-un-age-minimal-de-depart-a-la-retraite-a-63-ans-le-taux-plein-a-65_8205254.html
      date: 2026-09-22
      support: presse (franceinfo, rapportant un entretien sur LCI)
    precision: partielle
    interpretation: >-
      Source primaire : entretien vidéo sur LCI du 22 septembre 2026 (extrait publié par LCI,
      https://x.com/LCI/status/2102585177323254057), sans transcription publiée ; le texte cité est celui de
      franceinfo, recoupé par LCP et le JDD (« 40 milliards d'économies en cumulé sur cinq ans », « 7 % par an »,
      capitalisation « 25 à 30 % » des retraites des nouveaux entrants). Aucun document écrit du candidat ou de LR
      sur les retraites au 29 septembre 2026 (ni livret, ni page du site de campagne).
      Référentiel au 1er janvier 2027 : réforme de 2023 suspendue (LFSS 2026). Le taux plein automatique à 65 ans
      (au lieu de 67 ans) sans condition de durée est un coût ; l'âge minimal 63 ans et la décote de 7 %/an sont des
      économies. Exceptions pénibilité à négocier. Paramètres (génération, calendrier, durée d'assurance) non
      précisés. Le 17 septembre 2026, il demandait aussi le « retour de la réforme des retraites » dans le PLF 2027.
    chiffrable: true
    nature: economie
    effet_solde_primaire:
      central: 4.19
      bas: -4.95
      haut: 13.33
      montee_en_charge:
        '2027': 0
        '2028': 0.2
        '2029': 0.4
        '2030': 0.6
        '2031': 0.8
        '2032': 1
    calcul:
      formule: (economie_cumulee/somme_profil - ecart_age*retraites_age_legal_1_an)/2
      parametres:
        economie_cumulee:
          valeur: 40
          source: https://www.franceinfo.fr/politique/bruno-retailleau/s-il-est-elu-bruno-retailleau-veut-instaurer-un-age-minimal-de-depart-a-la-retraite-a-63-ans-le-taux-plein-a-65_8205254.html
          unite: Md€ cumulés sur cinq ans
          note: « 40 milliards d'économies en cumulé sur cinq ans »
        somme_profil:
          valeur: 3.0
          source: chiffrage/REFERENCE.md (droit voté au 29 septembre 2026)
          unite: années pleines
          note: somme de la montée en charge 0,2 + 0,4 + 0,6 + 0,8 + 1 sur 2028-2032
        ecart_age:
          valeur: 0.75
          source: chiffrage/REFERENCE.md (droit voté au 29 septembre 2026)
          unite: année
          note: âge légal de référence en 2032 ≈ 63 ans 9 mois (gel à 62 ans 9 mois jusqu'en 2028 puis +3 mois par génération)
            contre âge minimal de 63 ans
        retraites_age_legal_1_an:
          valeur: 6.6
          bareme: retraites_age_legal_1_an
      explication: 'Convention (faute de simulation publique : ni COR, ni Cnav, ni DG Trésor, ni chiffrage détaillé de LR
        au 29 septembre 2026) : central = milieu entre les deux bornes documentées, parce que la mesure combine un effet
        d''âge minimal chiffrable au barème (coût) et un recul de l''âge effectif du taux plein à 65 ans, avec décote de
        7 % par an même à durée complète (économie), dont l''ampleur dépend du comportement de départ non documenté.
        Repère : un recul effectif de l''âge du taux plein de 63 ans 9 mois à 65 ans pour tous vaudrait au plus 1,25 an
        × 6,6 Md€ ≈ 8,3 Md€ en 2032, avant le coût du taux plein automatique à 65 ans au lieu de 67. Effets opposés : l''âge minimal de 63 ans est plus bas que l''âge de référence
        en 2032 (coût de 0,75 an × 6,6 Md€, borne basse si la décote de 7 %/an ne dissuade pas les départs) ; le taux
        plein repoussé à 65 ans pour tous avec une décote de 7 %/an (au lieu de 5 %) produit des économies, mais le
        taux plein automatique à 65 ans sans condition de durée (au lieu de 67 ans) coûte. Haut : l''annonce du candidat
        (40 Md€ cumulés sur cinq ans, soit 13,3 Md€ en 2032 avec une montée linéaire). Central : milieu de la fourchette,
        à remplacer par une simulation. Périmètre (convention commune 4) : solde du système de retraite.'
    effets_retour: >-
      Effet pour l'ensemble des administrations publiques (convention commune 4, effets d'emploi exclus du montant) :
      la Cour des comptes (février 2025) chiffre une avancée d'un an de l'âge à 13 Md€ pour les finances publiques
      (5,8 Md€ pour le système de retraite) et un recul jusqu'à 17,7 Md€ en 2035. Le report de l'âge effectif induit par
      la décote de 7 % par an relèverait surtout les prélèvements sur l'emploi des seniors, non comptés.
    confiance: faible
    verification:
      statut: conteste
      par: passe-sources
      date: "2026-09-29"
      commentaire: >-
        Passe sources (29/09/2026) : aucune simulation COR/Cnav ni chiffrage LR détaillé trouvé ; seule source du
        candidat, l'entretien LCI (vidéo) rapporté par franceinfo, LCP, JDD ; calendrier, génération et durée
        d'assurance non précisés. Contestation documentée : (a) bas −4,95 Md€ = âge minimal de 63 ans contre 63 ans
        9 mois de référence en 2032 (0,75 an × 6,6 Md€), décote sans effet sur les départs ; (b) haut +13,3 Md€ =
        annonce du candidat (40 Md€ cumulés sur 2028-2032 au profil linéaire) ; repère intermédiaire +8,3 Md€ pour un
        recul effectif du taux plein à 65 ans. Central 4,19 Md€ maintenu comme convention écrite (milieu de
        fourchette). Vérification précédente (verificateur-sonnet, conteste) : central arbitraire sans simulation ;
        périmètre du système de retraite (convention commune 4).
