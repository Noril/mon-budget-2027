  # --- École (septembre 2026) -----------------------------------------------------------------------
  - id: revalorisation-enseignants
    libelle: Revalorisation du traitement des professeurs (+135 € nets par mois en début de carrière, environ +300 € en milieu de carrière)
    domaine: education
    citation:
      texte: >-
        Nous alignerons ainsi intégralement le début de carrière sur la moyenne européenne, soit 135 euros nets de plus
        chaque mois, et nous comblerons au moins la moitié de l'écart au cœur de la carrière, soit environ 300 euros
        nets supplémentaires par mois.
      url: https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf
      date: 2026-09
      support: programme (livret École, p. 10)
    precision: partielle
    interpretation: Sur le traitement indiciaire (donc aussi coût CAS Pensions). Profil exact par échelon à reconstituer ; enseignement privé sous contrat inclus ?
    chiffrable: true
    nature: depense
    effet_solde_primaire:
      central: -1.24
      bas: -2.14
      haut: -1.09
      montee_en_charge:
        '2027': 0
        '2028': 1
        '2029': 1
        '2030': 1
        '2031': 1
        '2032': 1
    calcul:
      formule: -effectifs*hausse_nette_moyenne*12/ratio_net_brut*(1 - retour)/1e9
      parametres:
        effectifs:
          valeur: 793863
          source: https://www.budget.gouv.fr/documentation/documents-budgetaires-lois/exercice-2026
          unite: ETPT
          note: enseignants du public, programmes 140 (341 897) et 141 (451 966), PLF 2026 ; privé sous contrat exclu
        hausse_nette_moyenne:
          valeur: 145
          source: https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf
          unite: € nets/mois
          note: moyenne de +135 € (début), +300 € (milieu) et 0 (fin de carrière), p. 10
        ratio_net_brut:
          valeur: 0.8
          source: https://www.fonction-publique.gouv.fr/files/files/publications/rapport-annuel/cc-2025-web.pdf
          unite: net/brut
          note: cotisations salariales d'un fonctionnaire ≈ 20 % du traitement (pension civile, CSG-CRDS, RAFP)
        retour:
          valeur: 0.28
          bareme: retour_prelevements_salaires_publics
          unite: part de la rémunération brute
      explication: 'Hausse nette convertie en brut (hors cotisations employeurs), puis nette des prélèvements qui
        reviennent aux APU (convention commune 1 : × (1 − 0,28) ; le CAS Pensions, transfert interne aux APU, ne compte
        plus). Central : moyenne sur trois tiers de carrière (+135, +300, 0 €) ; bas : +217,5 € pour tous (moyenne
        début-milieu), retour 0,25, plus ≈ 0,2 Md€ de pensions induites en 2032 (convention 2) ; haut : +135 € pour
        tous, retour 0,32. Montants nominaux (point d''indice gelé, pas de projection). Privé sous contrat (≈ 140 000 enseignants rémunérés par l''État) non inclus : le coût réel
        serait plus élevé.'
    confiance: moyenne
    verification:
      statut: corrige
      par: verificateur-sonnet
      date: "2026-09-29"
      commentaire: >-
        Citation vérifiée (livret école p. 10). Calcul rejoué : 793 863 × 145 € × 12 / 0,8 × 1,8228 = 3,15
        Md€. Le profil de carrière en tiers (+135, +300, 0) est une hypothèse du chiffrage, encadrée par
        bas/haut ; enseignement privé sous contrat exclu (coût sous-estimé). Réserve de barème : le CAS
        Pensions (82,28 %) pèse pour près de la moitié du coût par agent alors qu'il s'agit d'un transfert
        interne aux APU.
        Recalé sur les conventions communes du 29/09 : coût compté en brut hors cotisations employeurs × (1 − 0,28)
        (convention 1) au lieu du coût employeur CAS Pensions compris, ce qui règle la réserve de barème ; central
        −3,15 → −1,24, bas −4,72 → −2,14 (retour 0,25 et pensions induites ≈ 0,2), haut −2,93 → −1,09 (retour 0,32).
  - id: postes-enseignants-demographie
    libelle: Réduction des moyens d'enseignement suivant la baisse démographique, à taux d'encadrement constant (plus de 3 Md€ libérés)
    domaine: education
    citation:
      texte: >-
        Ce recul, qui n'a rien d'une bonne nouvelle pour la Nation, permettra néanmoins à taux d'encadrement constant
        de libérer plus de 3 milliards d'euros par an en fin de quinquennat, pour financer intégralement cette
        revalorisation sans un euro d'impôt nouveau.
      url: https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf
      date: 2026-09
      support: programme (livret École, p. 10)
    precision: partielle
    interpretation: >-
      Économie par rapport à un référentiel à effectifs constants (législation en vigueur) ; l'IA-livret exclut
      l'Éducation nationale des départs non remplacés, pas de double compte. Contradiction avec « pas un centime
      d'économie sur l'école » : les moyens sont redéployés vers les salaires.
    chiffrable: true
    nature: economie
    effet_solde_primaire:
      central: 0.85
      bas: 0.0
      haut: 0.85
      montee_en_charge:
        '2027': 0
        '2028': 0.2
        '2029': 0.4
        '2030': 0.6
        '2031': 0.8
        '2032': 1
    calcul:
      formule: economie / cout_charge * cout_apu
      parametres:
        economie:
          valeur: 3.0
          source: https://republicains.fr/wp-content/uploads/2026/09/LR_Ecole_vF.pdf
          unite: Md€/an en fin de quinquennat
          note: « libérer plus de 3 milliards d'euros par an », p. 10 ; montant budgétaire de l'État
        cout_charge:
          valeur: 85000
          bareme: cout_enseignant_charge
          unite: € par ETPT et par an
          note: coût budgétaire complet (CAS Pensions compris), sert seulement à convertir l'annonce en postes (≈ 35 000)
        cout_apu:
          valeur: 24100
          bareme: cout_enseignant_apu
          unite: € par ETP et par an
      explication: >-
        Règle 6 (économie ciblée sur un périmètre nommé) : bas = 0 (les postes ne sont pas supprimés) ; haut = central.
        Convention commune 1 (postes supprimés) : l'annonce (3 Md€ budgétaires, coût chargé) est convertie en postes
        (3 Md€ / 85 000 € ≈ 35 300) puis valorisée au coût d'un entrant pour le solde des APU (cout_enseignant_apu,
        24 100 €) : les cotisations employeurs vont à d'autres APU.
        Montant du candidat (baisse de 1,7 million d'élèves en dix ans à taux d'encadrement constant) ; par rapport au
        référentiel (droit voté, effectifs non réduits automatiquement), c'est une économie. Pas de double compte avec
        les départs non remplacés (Éducation nationale exclue du livret IA).
    confiance: moyenne
    verification:
      statut: corrige
      par: verificateur-sonnet
      date: "2026-09-29"
      commentaire: >-
        Citation vérifiée (livret école p. 10 : plus de 3 Md€ en fin de quinquennat). Corrigé selon la
        règle 6 révisée : bas 3,0 -> 0 (les postes ne sont pas supprimés), central et haut 3,0 Md€ (plafond
        respecté : masse salariale enseignante ~60 Md€). Pas de double compte avec les départs non
        remplacés.
        Recalé sur les conventions communes du 29/09 : annonce convertie en postes au coût chargé puis valorisée au coût
        d'un entrant pour le solde des APU (cout_enseignant_apu, convention 1) ; central et haut 3,0 → 0,85 Md€.

