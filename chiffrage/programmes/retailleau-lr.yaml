        par une baisse du coût du travail dès la première heure. Le détail sera fourni lors de la présentation des
        mesures
      url: https://republicains.fr/wp-content/uploads/2026/01/51705_LesRepublicains_Brochures_A5-40P_DEF.pdf
      date: 2026-01-07
      support: programme (livret « Le travail gagnant », p. 16)
