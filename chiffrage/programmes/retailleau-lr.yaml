    domaine: fiscalite
    citation:
      texte: >-
        Je ne serai pas le président qui augmentera les droits de succession mais celui qui les baissera. Je pousserai
        cette baisse au maximum du possible au cours de mon quinquennat.
      url: https://republicains.fr/actualites/2026/08/26/je-serai-le-president-qui-baissera-les-impots-de-succession/
