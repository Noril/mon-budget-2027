  # --- Électricité (juin 2026) ----------------------------------------------------------------------
  - id: fin-soutien-nouvelles-enr
    libelle: Fin des soutiens publics aux nouvelles capacités éoliennes et photovoltaïques (pas de tarif garanti ni de prise en charge du raccordement)
    domaine: energie
    citation:
      texte: >-
        Les situations juridiques constituées ne seront pas remises en cause. L'État tiendra ses engagements, y
        compris ceux qu'il n'aurait pas dû prendre. Mais il s'agira bien de la fin des subventions pour les futurs
        projets photovoltaïques et éoliens, et non d'un moratoire. Les projets disposant d'un équilibre économique
        propre pourront être instruits et autorisés - jamais financés par la collectivité. Pas d'aide publique, pas de
        tarif garanti, pas de prise en charge des coûts de raccordement.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Electricite_vFF070626.pdf
      date: 2026-06
      support: programme (livret Électricité, p. 21)
    precision: precise
    interpretation: >-
      Économie sur les charges de service public de l'énergie (budget de l'État, programme 345 / CAS) pour les
      projets non encore engagés au 1er janvier 2027, par rapport à la PPE 3. Fortement dépendante des prix de
      marché ; le raccordement relève des réseaux (hors APU).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: electricite-hors-cee-contrat-nucleaire
    libelle: Sortie de l'électricité des CEE, contrat de long terme EDF-fournisseurs (30 TWh), réacteurs à 80 ans, 8 EPR2 supplémentaires
    domaine: energie
    citation:
      texte: >-
        Nous mettrons fin à cette incohérence en sortant l'électricité du périmètre des CEE
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Electricite_vFF070626.pdf
      date: 2026-06
      support: programme (livret Électricité, p. 29)
    precision: partielle
    chiffrable: false
    raison_non_chiffrable: >-
      Hors comptes publics : les CEE sont une obligation des fournisseurs, EDF est hors APU et le contrat pour
      différence est « structuré comme un produit financier entre EDF et les fournisseurs - et non entre EDF et
      l'État » (livret). Un éventuel prêt d'État aux EPR2 serait une opération financière.

