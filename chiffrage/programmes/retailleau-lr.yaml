        pour les maisons. Le zonage actuel sera supprimé afin de mettre fin aux incohérences territoriales. Son
        financement sera réorganisé afin que la Caisse des dépôts et consigations prenne en charge les intérêts,
        plutôt que par un crédit d'impôt budgétaire pour l'État.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 22)
    precision: partielle
    interpretation: >-
      Économie pour l'État (crédit d'impôt PTZ) si la CDC (hors APU) porte le coût ; mais l'extension à l'ancien et la suppression du zonage augmentent le volume. La CDC reverse une partie de ses résultats à l'État : effet indirect.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: suppression-exoneration-is-hlm
    libelle: Suppression progressive sur cinq ans de l'exonération d'IS des organismes HLM (350 M€), redistribuée en aides à la pierre
    domaine: logement
    citation:
      texte: >-
        Nous supprimerons progressivement cette exonération sur cinq ans, pour une économie de 350 millions d'euros.
        Ces économies seront intégralement redistribuées aux bailleurs vertueux, ceux qui construisent et rénovent, sous
        forme d'aides à la pierre via le Fonds national des aides à la pierre.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 45)
    precision: precise
    interpretation: >-
      Recette et dépense de même montant : effet net nul sur le solde. Retailleau cite ailleurs « le milliard d'exonération d'IS pour les sociétés d'HLM » (IREF, avril 2026).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: fin-anru-apres-2030
    libelle: Pas de nouveau programme de rénovation urbaine après le NPNRU (2030)
    domaine: logement
    citation:
      texte: >-
        Nous ne renouvellerons pas le programme après le NPNRU en 2030. Les engagements seront tenus, mais aucun «
        ANRU 3 » ne sera lancé, ce qui permettra à l'État d'économiser 100 à 150 millions d'euros par an, et à Action
        Logement de réorienter 850 millions d'euros vers le logement des salariés, soit environ 30 000 logements
        supplémentaires par an.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 46)
    precision: precise
    interpretation: >-
      Référentiel : aucun ANRU 3 n'est voté au 1er janvier 2027, l'économie par rapport à la législation est donc discutable (économie par rapport à une reconduction tendancielle). Action Logement hors champ si non classé en APU.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: apl-etudiants-etrangers-non-boursiers
    libelle: Application stricte de la suppression des APL pour les étudiants étrangers extra-européens non boursiers (LF 2026)
    domaine: logement
    citation:
      texte: >-
        La loi de finances pour 2026 prévoit la suppression des APL pour les étudiants étrangers hors UE qui ne sont
        pas boursiers. Cette mesure concerne environ 100 000 étudiants. Nous l'appliquerons strictement, avec un
        contrôle renforcé, pour une économie de 200 millions d'euros par an.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 46)
    precision: precise
    chiffrable: false
    raison_non_chiffrable: >-
      Déjà dans la législation au 1er janvier 2027 (LF 2026, à confirmer) : effet nul par rapport au référentiel,
      hors gain de contrôle non documenté.
  - id: apl-etudiants-d9-d10
    libelle: Exclusion de l'APL des étudiants dont les parents appartiennent aux deux derniers déciles
    domaine: logement
    citation:
      texte: >-
        Les étudiants dont les parents appartiennent aux deux derniers déciles de revenus (plus de 45 000 euros par
        unité de consommation) seront exclus de l'APL. La perte sera compensée par le maintien de la demi-part fiscale.
        L'économie attendue est de 200 à 300 millions d'euros par an.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 47)
    precision: precise
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: hebergement-urgence-regularite-sejour
    libelle: Hébergement d'urgence conditionné à la régularité du séjour, durée plafonnée à 18 mois
    domaine: immigration
    citation:
      texte: >-
        Nous réviserons l'article L. 345-2-2 du code de l'action sociale et des familles pour conditionner
        l'hébergement d'urgence à la régularité du séjour.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 44)
    precision: precise
    interpretation: >-
      Le livret cite la Cour des comptes (40 à 60 % des places occupées par des étrangers en situation irrégulière, environ 1 Md€ par an). Économie partielle : une part des personnes relèvera d'autres dispositifs (rétention, CRA, éloignement).
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: vente-pavillons-hlm
    libelle: Vente de 10 % des pavillons HLM (86 000) aux locataires avec décote de 20 %, fonds de mutualisation
    domaine: logement
    citation:
      texte: >-
        Après dix ans d'occupation, le locataire pourra demander à acheter le logement qu'il occupe avec une décote de
        20 %. Le bailleur social ne pourra s'y opposer que dans des cas limités. Un fonds de mutualisation sera créé
        pour compenser une partie des décotes.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 23)
    precision: vague
    interpretation: Les bailleurs HLM sont hors APU ; seul un abondement public du fonds de mutualisation pèserait sur le solde (non précisé). Probablement non significatif.
    chiffrable: false
    raison_non_chiffrable: A_CHIFFRER
  - id: fin-dpe-zan-encadrement
    libelle: Fin des interdictions de louer liées au DPE, suppression du ZAN et de l'encadrement des loyers
    domaine: logement
    citation:
      texte: >-
        Nous supprimerons le ZAN. Nous mettrons fin […] Nous supprimerons l'encadrement des loyers.
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Logement.pdf
      date: 2026-05
      support: programme (livret Logement, p. 5)
    precision: precise
    chiffrable: false
