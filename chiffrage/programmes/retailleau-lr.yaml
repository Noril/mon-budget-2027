  - id: revenu-familial
    libelle: Revenu familial de 240 € par enfant et par mois, de la naissance à 18 ans, remplaçant 12 dispositifs (dont allocations familiales et quotient familial)
    domaine: famille
    citation:
      texte: >-
        Fusionner 12 dispositifs pour les remplacer par un Revenu familial (RF) de 240 euros versé chaque mois à
        tous, dès le premier enfant, de la naissance jusqu'à 18 ans ;
      url: https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf
      date: 2026-04
      support: programme (livret Famille, p. 11)
    precision: precise
    interpretation: >-
      Présenté « à budget constant » : dispositifs supprimés (AF, majoration pour âge, complément familial, quotient
      familial…) 41 Md€ contre 40,3 Md€ pour le RF (14 millions de mineurs × 240 € × 12). Liste exacte des 12
      dispositifs (ARS, bourses, réduction d'impôt pour enfant scolarisé, SFT, part enfants RSA/PA…) et chiffre
      effectif de mineurs éligibles (condition de 5 ans) à vérifier. PAJE, ASF, APL, AEEH conservées.
    chiffrable: true
    nature: mixte
    effet_solde_primaire:
      central: 0.85
      bas: -1.63
      haut: 3.33
      montee_en_charge:
        '2027': 0
        '2028': 0
        '2029': 1
        '2030': 1
        '2031': 1
        '2032': 1
    calcul:
      formule: (dispositifs_supprimes - cout_rf)*facteur
      parametres:
        dispositifs_supprimes:
          valeur: 41
          source: https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf
          unite: Md€/an
          note: allocations familiales, majoration pour âge, complément familial, quotient familial…, p. 12
        cout_rf:
          valeur: 40.3
          source: https://republicains.fr/wp-content/uploads/2026/05/LR_Famille_vFinale.pdf
          unite: Md€/an
          note: 14 millions de mineurs × 240 € × 12, p. 12
        facteur:
          valeur: 1.2106
          bareme: facteur_pib_2025_2032
          unite: facteur PIB nominal 2025→2032
      explication: 'Réforme présentée « à budget constant » : on reprend les deux masses du livret (gain net 0,7 Md€),
        projetées en 2032 à indexation identique. Fourchette : ± 5 % sur la masse des dispositifs supprimés (le quotient
        familial et les bourses ne sont pas ventilés dans le livret ; les allocations familiales seules pèsent 13,8
        Md€, barème allocations_familiales_depense). La condition de cinq ans est traitée à part (non chiffrable).'
    chiffrages_tiers:
      - auteur: Fondation IFRAP (reprise des chiffres LR)
        montant_md: null
        url: https://www.ifrap.org/comparateurs/presidentielles-2027
        commentaire: >-
          « Economies : 600 à 800M€ à terme » ; « proposition qui réduit de 25Md€ les prestations » ; pas de chiffrage propre.
    confiance: faible
    verification:
      statut: ok
      par: verificateur-sonnet
      date: "2026-09-29"
      commentaire: >-
        Citation vérifiée (livret famille p. 10). Masses du livret (41 Md€ de dispositifs supprimés contre
        40,3 Md€ de RF = 14 M de mineurs × 240 € × 12) relues p. 12 ; barème allocations_familiales_depense
        (13,8 Md€) cohérent avec la liste. La condition de résidence de cinq ans (qui réduirait le coût)
        est traitée à part. Solde net de 0,85 Md€ faible et plausible pour une réforme « à budget constant
        ».
        Recalé sur les conventions communes du 29/09 : facteur de projection renvoyé au barème facteur_pib_2025_2032
        (valeur inchangée).
  - id: revenu-familial-troisieme-enfant
