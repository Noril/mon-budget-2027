      bas: -6.2
      haut: -0.5
      lecture: 'Baisse de l''ordre de 10 % du produit des droits de succession (relèvement de l''abattement en ligne directe
        de 100 000 € à environ 150 000 €), sur un produit de 17 Md€ en 2025 projeté (× 1,21). Bas : baisse de 30 % (« au maximum
        du possible ») ; haut : geste limité (≈ 0,5 Md€). Produit des droits de succession issu du barème dmtg_rendement ; l''ampleur
        (10 %) est une hypothèse du chiffrage.'
      sources:
      - https://republicains.fr/actualites/2026/08/26/je-serai-le-president-qui-baissera-les-impots-de-succession/
