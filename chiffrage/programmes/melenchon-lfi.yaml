- id: temps-travail-35h-32h
  libelle: Retour effectif aux 35 heures (heures supplémentaires majorées), 32 heures dans les métiers pénibles ou de nuit
  domaine: travail
  citation:
    texte: Rétablir immédiatement la durée légale hebdomadaire du temps de travail à 35 heures (en majorant les heures supplémentaires,
      cotisations incluses, à 25 % pour les quatre premières et 50 % au-delà), passer aux 32 heures dans les métiers pénibles
      ou de nuit et favoriser leur généralisation par la négociation collective
    url: https://web.archive.org/web/20261109203855/https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre1
    date: '2026-11-06'
    support: 'programme : L''Avenir en commun, 5e édition (6 novembre 2026), melenchon2027.fr, copie Wayback du 2026-11-09'
  precision: partielle
  interpretation: 'Effet APU : 32 h dans les métiers pénibles ou de nuit de la fonction publique (hôpitaux, police…) = recrutements
    compensatoires ; majoration des heures sup. dans le public. La fiscalisation et la socialisation des heures supplémentaires
    sont traitées dans heures-sup-fiscalisation.'
  chiffrable: false
  raison_non_chiffrable: Périmètre des « métiers pénibles ou de nuit » passant à 32 heures non défini ; aucune source ouverte
    sur les recrutements compensatoires dans le public.
  sens_probable: cout
  estimation_indicative:
    central: -1.3
    bas: -4.0
    haut: -0.5
    lecture: '32 h sans perte de salaire pour les agents publics de nuit ou pénibles : ≈ 9 % d''heures à compenser pour ≈
      600 000 agents, soit ≈ 55 000 postes au coût d''un entrant (≈ 23 700 € pour le solde, cout_soignant_hospitalier_apu
      ; policier 22 750 €), soit ≈ 1,3 Md€. Effectif : la DGAFP (rapport annuel 2025, enquête Emploi 2024) relève qu''« Un
      agent de la FPH sur quatre a travaillé la nuit » (≈ 310 000 sur 1,24 million) et 47 % des policiers, militaires et pompiers
      ; au sens large (au moins une nuit dans le mois), ≈ 13 % des 5,80 millions d''agents, soit ≈ 750 000 : convention de
      600 000 (travail de nuit habituel ou métiers pénibles), dans cette fourchette. Bas : périmètre d''un million d''agents
      et agent moyen ; haut : recrutements partiels. Cohérent avec tondelier-ecologistes/trente-deux-heures-metiers-penibles
      (même 55 000 recrutements).'
    sources:
    - fp_effectifs_fph
    - https://www.fonction-publique.gouv.fr/files/files/publications/vue-rapport-annuel/ra_2025_vue_temps_organisation_temps_travail.pdf
    - cout_soignant_hospitalier_apu
    - cout_policier_apu
    - https://web.archive.org/web/20260829202700/https://melenchon2027.fr/programme2025/livre/chapitre8/s2/
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : effectif d''agents travaillant de nuit sourcé (DGAFP, rapport annuel 2025) ; les 600 000
      agents deviennent une convention située dans la fourchette publiée (310 000 dans la seule FPH, ≈ 750 000 au sens large).
      Recalé sur les barèmes sourcés du 29/09 : coût d''un entrant 24 500 → 23 700 € (cout_soignant_hospitalier_apu ; cout_policier_apu
      22 750) : estimation indicative centrale −1,5 → −1,3 (55 000 × 23 700 €) ; bornes inchangées.'
