    haut: 1.0
    lecture: 'Recettes brutes ≈ 2 Md€ par an (accises et TVA sur 500 tonnes à 9 €/g, CAE, note n° 52, 2019) moins la dépense
      de prévention et de lutte contre les addictions à laquelle le programme les affecte (« Affecter les recettes des taxes
      sur le cannabis à des programmes de lutte contre les addictions ») : net nul. Même règle que chez Tondelier (recettes
      nettes de la dépense affectée annoncée ; sans affectation annoncée, recette brute) : Tondelier n''annonce aucune affectation,
      d''où +2 Md€ brut chez elle. Bas : dépense affectée supérieure aux recettes (monopole d''État) ; haut : la moitié des
      recettes seulement dépensée.'
    sources:
