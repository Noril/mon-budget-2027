      le bas 1,5). Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032
      ; valeur inchangée. Recalé sur les barèmes sourcés du 29/09 : méthode commune aux suppressions d''allègements au-dessus
