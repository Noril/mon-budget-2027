  confiance: haute
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : contestation tranchée par le recalage sur les barèmes communs (point_indice_1pct_2032 sans
      facteur PIB, effet croisé avec l''indexation, retour 0,28 construit à partir des taux légaux) ; rejoué : (10 × 2,59
      + 0,1 × 28,6) × 0,72 = 20,71. Montant revendiqué (22 Md€, « Revaloriser le point d''indice des fonctionnaires de 10%,
      indexer l''indice sur l''inflation et recomposer les grilles indiciaires pour prendre en compte la hausse du SMIC ») relu
      p. 40 du contre-budget : il couvre aussi l''indexation, comptée dans echelle-mobile-salaires. Vérification précédente
      (verificateur-sonnet, conteste) : Arithmétique rejouée (10 × 2,2 × 1,28 × 0,75 = 21,1), central non modifié. Mêmes réserves que echelle-mobile-salaires
      : base × 1,28 (PIB nominal) alors que le point est gelé au droit constant (base ≈ 2,5 Md€ en 2027 → -18,8 net d''un
      quart, -25 brut) ; quart de retours non sourcé (les cotisations CAS Pensions/CNRACL sont un flux interne : retour plus
      proche de 35 %) ; écart de convention avec Tondelier (-27,6 pour l''indexation, sans retour). Le +10 % chevauche revalorisation-enseignants
      (traité : seule la refonte des grilles s''ajoute) et la refonte des grilles liée au SMIC à 1 700 € (non comptée). Recalé
      sur les conventions communes du 29/09 : 10 × point_indice_1pct_2032 (2,59, sans facteur PIB) + effet croisé avec l''indexation
      (10 % × 28,6), net du retour 0,28 au lieu du « quart » : central −21,12 → −20,71, bas −32 → −22,41, haut −20,83 → −18,6. Recalé sur les barèmes sourcés du 29/09 : point_indice_1pct_2032 2,59 → 1,86 (1,80-1,93) et indexation 28,6 → 20,6 (17,0-22,2) : (10 × 1,86 + 0,1 × 20,6) × 0,72 = 14,88 ; central −20,71 → −14,88, bas −22,41 → −16,14, haut −18,6 → −13,4. Ensemble avec echelle-mobile-salaires : 41,3 brut, 29,7 net, sans double compte.'
