  nature: recette
  effet_solde_primaire:
    central: 6.44
    bas: 5.98
    haut: 6.44
    montee_en_charge: *id004
  calcul:
    formule: cout_exonerations * f26
    parametres:
      cout_exonerations:
        valeur: 5.4
        unite: Md€/an
        bareme: hs_exoneration_cout
        note: IR + cotisations salariales + déduction patronale (2026)
      f26:
        valeur: 1.1921
        unite: facteur PIB nominal 2026→2032
        bareme: facteur_pib_2026_2032
    explication: Suppression de l'exonération d'IR, de l'exonération de cotisations salariales et de la déduction forfaitaire
      patronale sur les heures supplémentaires (barème hs_exoneration_cout, 5,4 Md€ en 2026) × PIB 2026→2032. Chiffrage statique,
      retenu comme haut ; bas = baisse de 7,1 % du volume d'heures supplémentaires attendue par l'OFCE après la suppression
      de 2012 (https://www.ofce.sciences-po.fr/pdf/revue/2012/6-2012-1.pdf), soit 6,39 × 0,929 = 5,98.
