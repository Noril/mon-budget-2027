- id: garantie-autonomie
  libelle: 'Garantie d''autonomie : revenu porté au seuil de pauvreté pour toute personne (dont jeunes détachés du foyer parental)'
  domaine: solidarites
  citation:
    texte: 'Créer une garantie d''autonomie, qui permettra que nul ne soit privé de sa dignité pour vivre : le revenu mensuel
      de chaque personne atteindra le seuil de pauvreté (1 337 euros pour une personne seule)'
    url: https://web.archive.org/web/20261109203855/https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre1
    date: '2026-11-06'
    support: 'programme : L''Avenir en commun, 5e édition (6 novembre 2026), melenchon2027.fr, copie Wayback du 2026-11-09'
  precision: partielle
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par les éditions 2025 et 2026 (5e édition, 6 novembre
    2026). Lecture : allocation différentielle portant le revenu au seuil de pauvreté à 60 % (1 337 € dans l''édition 2026,
    1 216 € dans l''édition 2025, 1 288 € dans le contre-budget 2026). La partie 3, chapitre 2, l''étend aux jeunes « détachés
    du foyer fiscal parental ». Montant revendiqué par LFI dans le contre-budget 2026 (octobre 2025, première année, avant
    montée en charge) : 10 Md€ pour le volet « jeunes », avec montée en charge. La hausse immédiate « des minima sociaux »
    (partie 2, chapitre 2) est absorbée par cette mesure ; l''AAH est chiffrée à part. Le budget rectificatif 2027 revendique
    9,5 Md€ par an pour le volet « jeunes » (« garantie d''autonomie de 1 337 euros par mois pour les jeunes », Public Sénat).'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -43.46
    bas: -59.56
    haut: -25.99
    montee_en_charge:
      '2027': 0
      '2028': 0.4
      '2029': 0.7
      '2030': 0.9
      '2031': 1
      '2032': 1
  calcul:
    formule: -(jeunes * seuil_aec / seuil_im * f24 + pauvres * uc_par_personne * seuil_2023 * intensite * 12 / 1000 * f23)
    parametres:
      jeunes:
        valeur: 12.28
        unite: Md€ (seuil de 1 063 €, données 2018-2021)
        source: https://web.archive.org/web/20220405165148/https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/creer-une-garantie-dautonomie-de-trois-ans-sous-reserve-dune-formation-qualifiante-et-sous-conditions-de-ressources-pour-les-18-25-ans/
        note: 'estimation centrale de l''Institut Montaigne : « Dans le premier scénario, la garantie concerne tous les jeunes
          de moins de 25 ans en formation qualifiante dont le niveau de vie est inférieur à 60 % du revenu médian ; le coût
          est de 12,28 Md€ par an » (scénario sans condition de ressources : 21,4 Md€)'
      seuil_aec:
        valeur: 1337
        unite: € par mois
        source: https://web.archive.org/web/20261109203855/https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre1
        note: « le revenu mensuel de chaque personne atteindra le seuil de pauvreté (1 337 euros pour une personne seule)
          » ; lu comme le seuil à 60 % de 2024 (1 288 € en 2023, Insee), d'où la projection depuis 2024
      seuil_im:
        valeur: 1063
        unite: € par mois (garantie chiffrée par l'Institut Montaigne en 2022)
        source: https://web.archive.org/web/20220405165148/https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/creer-une-garantie-dautonomie-de-trois-ans-sous-reserve-dune-formation-qualifiante-et-sous-conditions-de-ressources-pour-les-18-25-ans/
      pauvres:
        valeur: 9.8
        bareme: pauvrete_nombre_personnes
        unite: millions de personnes pauvres (2023, France métropolitaine)
        source: https://www.insee.fr/fr/statistiques/8600989
        note: 'Insee Première n° 2063 : « En 2023, 9,8 millions de personnes occupant un logement ordinaire en France métropolitaine
          vivent sous le seuil de pauvreté monétaire »'
      uc_par_personne:
        valeur: 0.65
        unite: unité de consommation par personne pauvre
        source: https://www.insee.fr/fr/statistiques/8600989
        note: 'convention : 1 UC pour le premier adulte, 0,5 par personne de 14 ans ou plus, 0,3 par enfant (échelle de l''Insee)
          ; ménages pauvres d''environ 2,3 personnes, surreprésentation des familles monoparentales ; fourchette 0,6 à 0,7'
      seuil_2023:
        valeur: 1288
        bareme: seuil_pauvrete_mensuel
        unite: € par mois et par UC
        source: https://www.insee.fr/fr/statistiques/8600989
        note: seuil de pauvreté à 60 % du niveau de vie médian, 2023
      intensite:
        valeur: 0.192
        bareme: pauvrete_intensite
        unite: écart relatif au seuil
        source: https://www.insee.fr/fr/statistiques/8600989
        note: « la moitié des personnes en situation de pauvreté ont un niveau de vie inférieur à 1 041 euros par mois, inférieur
          de 19,2 % au seuil de pauvreté »
      f23:
        valeur: 1.2852
        unite: facteur PIB nominal 2023→2032
        bareme: facteur_pib_2023_2032
      f24:
        valeur: 1.2408
        bareme: facteur_pib_2024_2032
        unite: facteur PIB nominal 2024→2032
    explication: 'Deux volets. (1) Jeunes détachés du foyer parental (partie 3, chapitre 2) : estimation centrale de l''Institut
      Montaigne (12,28 Md€, garantie à 1 063 €) portée au seuil de l''édition 2026 (× 1 337 / 1 063) puis projetée de 2024
      à 2032 (× 1,2408) = 19.2 Md€ ; le scénario sans condition de ressources (21,4 Md€), que l''Institut présente comme une
      hypothèse haute, va dans le bas. (2) Garantie pour tous (partie 3, chapitre 1) : déficit de pauvreté, c''est-à-dire
      la somme à verser pour porter chaque ménage pauvre au seuil = 9,8 millions de personnes × 0,65 UC × 1 288 € × 19,2 %
      × 12 = 18,9 Md€ en 2023, projetés (× 1,2852) = 24.3 Md€ ; convention : l''intensité médiane (Insee) sert d''écart moyen,
      le recours est complet, sans réaction de l''offre de travail ; les DOM (hors champ Insee) ne sont pas comptés. Recouvrements
      : l''AAH au SMIC et l''Aspa au seuil de pauvreté (mesures à part) comblent une partie de ce déficit (de l''ordre de
      1 à 2 Md€, non déduits). Bas : scénario jeunes sans condition de ressources (21,4 × 1 337 / 1 063 × 1,2408) et 0,7 UC
      par personne : 59.6 ; haut : volet jeunes au montant du budget rectificatif 2027 (9,5 Md€ × 1,1592) et volet adultes
      limité aux allocataires du RSA (11,7 Md€ × (1 337 / 651,69 − 1) × 1,2177) : 26.0.'
