  interpretation: 'Nouveauté de l''édition 2025. Le contre-budget 2026 élargit l''assiette aux patrimoines de plus de 100
    M€ (« Mettre en place la taxe Zucman de 2 % sur les patrimoines de plus de 100 millions d''euros : 20 milliards d''euros
    de recettes ») ; seuil à trancher. Interaction avec l''ISF (imputation). Seuil retenu : 100 M€ (contre-budget d''octobre
    2025, document le plus récent) ; L''AEC 2025 dit « milliardaires ». Risque constitutionnel (caractère confiscatoire) non
    chiffré. Le CAE n''a pas évalué la taxe Zucman elle-même : le coefficient de 0,26 porte sur une hausse de la fiscalité
    des hauts patrimoines dans le contexte scandinave, il est appliqué ici faute de mieux. Édition 2026 : « centimillionaires
    » (patrimoines de plus de 100 M€) remplace « milliardaires » : le seuil de 100 M€ retenu au central est désormais celui
    du programme. Le budget rectificatif 2027 revendique 15 Md€.'
