        note: 'Institut Montaigne : passage de 5,5 % à 5 %, « limite légale inférieure que peut prendre le taux réduit »'
      f25:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
      recette_tva_luxe:
        valeur: 0.0
        unite: Md€/an
        source: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/reduire-la-tva-sur-les-produits-de-premiere-necessite-et-reinstaurer-une-tva-grand-luxe-pour-la-financer/
        note: '« il n''est pas possible, au regard des règles européennes, de créer un taux majoré de TVA » ; haut : autofinancement
          revendiqué'
    explication: 'Baisse du taux réduit de 5,5 % à 5 % (seule baisse permise par la directive TVA) : 0,5 point × 2,0 Md€ ×
      PIB 2025→2032 = 1,2 Md€. La « TVA grand luxe » censée la financer est un taux majoré, interdit par la directive 2006/112
      (Institut Montaigne) : recette nulle au central. Haut = 0 (autofinancement revendiqué, désobéissance européenne assumée
      par LFI).'
  chiffrages_tiers:
