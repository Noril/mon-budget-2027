- id: minimum-vieillesse-seuil-pauvrete
  libelle: Minimum vieillesse (Aspa) porté au seuil de pauvreté
  domaine: retraites
  citation:
    texte: Porter a minima au niveau du SMIC revalorisé toutes les pensions pour une carrière complète (salarié, indépendant,
      agriculteur), et le minimum vieillesse au niveau du seuil de pauvreté
    url: https://web.archive.org/web/20260907170933/https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-09-07)'
  precision: precise
  interpretation: 'Volet non compté de pension-minimale-smic (« Le minimum vieillesse au seuil de pauvreté n''est toujours
    pas chiffré »). Même lecture et mêmes paramètres que la promesse identique de Tondelier (retraites-petites-pensions) :
    Aspa portée au seuil de pauvreté à 60 % du niveau de vie médian pour les allocataires actuels, sans les nouveaux entrants
    (minorant).'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -2.21
    bas: -3.0
    haut: -2.21
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -allocataires * (seuil - aspa) * 12 / 1e9
    parametres:
      allocataires:
        valeur: 754460
        unite: personnes
        source: https://www.espace-social.com/minimum-vieillesse-le-nombre-de-beneficiaires-augmente-toujours-en-2024/
        note: allocataires ASV ou Aspa fin 2024 (Drees)
      seuil:
        valeur: 1288
        unite: € par mois
        source: https://www.insee.fr/fr/statistiques/8600989
        note: seuil de pauvreté 2023 (60 % du niveau de vie médian)
      aspa:
        valeur: 1043.59
        unite: € par mois
        source: https://www.service-public.gouv.fr/particuliers/vosdroits/F16871
        note: Aspa personne seule 2026
    explication: 'Aspa portée au seuil de pauvreté pour les allocataires actuels (allocation différentielle : +244 € par mois),
      comme chez Tondelier. Pas de retour de prélèvements (minimum social, convention n° 3). Bas : nouveaux entrants attirés
      par le plafond relevé (+ 1/3). Le chiffrage tiers de l''Institut Montaigne (0,67 Md€ en 2022) portait sur une cible
      plus basse.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 0.67
    url: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/retablir-la-retraite-a-60-ans-apres-40-ans-annees-de-cotisation/
    date: '2022'
    commentaire: 'Minimum vieillesse : 0,67 Md€ (paramètres 2022), inclus dans le bas de pension-minimale-smic.'
  confiance: moyenne
  verification:
    statut: corrige
    par: recalage-couverture
    date: '2026-09-29'
    commentaire: 'Volet de pension-minimale-smic laissé hors chiffrage faute de barème Aspa ; lecture sans ambiguïté et paramètres
      sourcés déjà utilisés pour Tondelier : chiffré à l''identique pour que la même promesse ait le même coût. Recouvrement
      possible avec le bas de pension-minimale-smic (Montaigne, minimum vieillesse compris), de l''ordre de 0,9 Md€.'
