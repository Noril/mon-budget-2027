      smic_cible:
        valeur: 1700
        unite: € net par mois
        source: https://lafranceinsoumise.fr/
        note: 'page d''accueil de LFI (29/09/2026) : « Le SMIC à 1700€ net » ; discours de Saint-Denis (https://melenchon.fr/2026/06/07/meeting-de-jean-luc-melenchon-a-saint-denis/)
          : « Le Smic passera à 1 700 euros »'
      smic_net_2026:
        valeur: 1477.93
        unite: € net par mois
        source: https://www.service-public.gouv.fr/particuliers/vosdroits/F2300
      cout_1pct:
        valeur: 0.9
        unite: Md€/an de moindre solde par point de % de hausse du Smic
        bareme: smic_1pct_cout_apu
        note: 'barème revu le 29/09/2026 (allègements sous le barème RGDU 2026, allegements_sensibilite_smic_1pct 1,2 Md€
          par point) ; bas 0,31 (DG Trésor 2017), haut 1,7 (effet barème RGDU entier)'
      fp:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
        note: FMI WEO avril 2026 via plan/hypotheses.yaml ; facteur repris en tête de chiffrage/baremes.yaml
    explication: 'Hausse de 15 % du SMIC net (1 477,93 € → 1 700 €) × coût APU d''un point de SMIC (0,9 Md€ : allègements
      sous le barème RGDU 2026, masse salariale publique, prime d''activité, nets des cotisations et de l''IR en retour) ×
      facteur PIB = 15,03 × 0,9 × 1,2106 = 16,4 Md€. Au-delà de 10 %, le produit linéaire est un minorant (convention commune
      n° 7 : diffusion jusqu''à 1,2-1,5 SMIC, élargissement de la population au voisinage du SMIC, sortie de la prime d''activité)
      : haut = central. Bas : haut du barème (1,7 Md€ par point, effet barème RGDU entier), 15,03 × 1,7 × 1,2106 = 30,9 Md€.
      Interaction : la suppression des exonérations au-dessus de 2 SMIC (exonerations-cotisations-2-smic) réduit la part
      des allègements (RGDU jusqu''à 3 SMIC) qu''une hausse du SMIC fait croître ; non déduite ici. La lecture à 1 600 € (AEC 2025,
      +8,3 %) n''est plus la borne favorable. Hausse par décret dès l''été 2027.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 2.7
    url: https://web.archive.org/web/20220215163657/https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/augmenter-le-smic-a-1-400-e-net/
    date: '2022'
    commentaire: 'SMIC à 1 400 € net (2022) : coût APU d''environ 2,7 Md€ par an (allègements, fonction publique).'
  effets_retour: 'Effets sur l''emploi peu qualifié (négatifs selon le groupe d''experts SMIC) et sur la consommation (invoqués
