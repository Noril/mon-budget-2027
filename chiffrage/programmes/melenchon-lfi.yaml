    texte: Porter immédiatement le SMIC mensuel à 1 700 euros net et indexer les salaires sur l'inflation dans le privé comme
      dans la fonction publique
    url: https://web.archive.org/web/20261109203759/https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre2
    date: '2026-11-06'
    support: 'programme : L''Avenir en commun, 5e édition (6 novembre 2026), melenchon2027.fr, copie Wayback du 2026-11-09'
  precision: partielle
  interpretation: 'Reprise en campagne sous le nom d''« échelle mobile des salaires » (braderie de Lille, 5/09/2026 ; Fête
    de l''Humanité, 12/09/2026). Effet budgétaire direct : indexation du point d''indice sur les prix (voir aussi point-indice-10-pct)
    ; pour le privé, effet via allègements et prestations indexées. Le SMIC à 1 700 € de cette citation est chiffré dans smic-1700-net.
    Double compte évité : le +10 % de point d''indice (point-indice-10-pct) est un rattrapage ponctuel, l''indexation porte
    sur les années suivantes.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -15.91
    bas: -18.48
    haut: -11.76
    montee_en_charge:
      '2027': 0.18
      '2028': 0.34
      '2029': 0.5
      '2030': 0.67
      '2031': 0.83
      '2032': 1
  calcul:
    formule: -indexation * (1 - retour)
    parametres:
      indexation:
        valeur: 22.1
        unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
        bareme: indexation_point_indice_2027_2032
        note: 'point gelé à droit constant : 1,86 Md€ par point en 2032 × 11,88 points d''inflation cumulée 2027-2032'
      retour:
        valeur: 0.28
        unite: part de la rémunération brute hors cotisations employeurs revenant aux APU
        bareme: retour_prelevements_salaires_publics
    explication: 'Effet budgétaire direct : indexation du point d''indice sur l''inflation, qui n''est pas prévue par le droit
      (point gelé). Barème indexation_point_indice_2027_2032 (22,1 Md€ brut hors cotisations employeurs en 2032, sans projection
      par le PIB), net des prélèvements qui reviennent aux APU (× (1 − 0,28), retour_prelevements_salaires_publics) = 15,9
      Md€. Bas : indexation sur les prix à la consommation (haut du barème, 23,3) au retour bas (0,25), plus 1 Md€ de pensions
      induites : 18,48 ; haut : bas du barème (17,3) au retour haut (0,32) : 11,76. Montée en charge du barème (0,18 / 0,34
      / 0,50 / 0,67 / 0,83 / 1). L''effet croisé avec le +10 % est compté dans point-indice-10-pct. Dans le privé, le SMIC
      est déjà indexé par la loi ; l''indexation des autres salaires passe par la négociation et n''a pas d''effet budgétaire
      direct compté.'
  effets_retour: 'Indexation privée : effets sur les allègements et la prime d''activité, et effets inflationnistes, non comptés.'
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : contestation tranchée. Les trois réserves portaient sur l''ancien calcul (base × PIB nominal
      puis × inflation, « quart » de retour non sourcé, écart avec Tondelier) ; le recalage sur les barèmes communs les lève
      : indexation_point_indice_2027_2032 (point gelé × inflation cumulée, sans facteur PIB), retour_prelevements_salaires_publics
      (construction détaillée à partir des taux légaux), même barème pour tous les programmes. Lecture confirmée par le candidat
      (braderie de Lille, Fête de l''Humanité : « échelle mobile des salaires », « quand les prix augmentent, les salaires
      aussi », La Dépêche) : l''indexation des salaires publics sur les prix, que le haut du barème (IPC) couvre. Rejoué :
      28,6 × 0,72 = 20,59. Vérification précédente (verificateur-sonnet, conteste) : Arithmétique rejouée (11,04 × 2,2 × 1,28
      × 0,75 = 23,3) mais trois réserves, central non modifié : (1) inflation comptée deux fois : la base 2032 est multipliée
      par 1,28 (PIB nominal, qui contient l''inflation) puis par l''inflation cumulée ; avec un point gelé (base ≈ 2,5 Md€,
      comme le programme Tondelier) on obtient environ -20,7 ; (2) le quart de retours est une hypothèse du barème non sourcée,
      alors que le brut 2,2 Md€ contient des cotisations employeurs internes aux APU (CAS Pensions, CNRACL) : retours plus
      proches de 35 % ; (3) écart de convention avec le programme Tondelier, qui compte -27,6 (11,04 × 2,5) sans aucun retour
      : avec la même convention, l''écart est de -4,3 Md€. Effet croisé non compté : l''indexation s''applique sur un point
      déjà relevé de 10 % (≈ -2,3), qui compense à peu près le doublon d''inflation. Pas de double compte avec le +10 % (rattrapage
      ponctuel, indexation sur les années suivantes) ; le privé n''a pas d''effet direct compté. Recalé sur les conventions
