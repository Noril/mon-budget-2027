      haut −24,39 → −20,74. Vérification précédente (verificateur-sonnet, corrige) : Montaigne 2022 (19 Md€ pour 680 000 jeunes, SMIC 1 400 €) : ratio SMIC 1 700/1 400 appliqué mais aucune
      projection vers 2032 ; ajout × 1,1842 (2026→2032, le ratio de SMIC ayant déjà absorbé l''inflation 2022-2026). Central
      ancien -23,07. Ordre de grandeur recoupé : 680 000 × 9 mois × 1 700 € net ≈ 10,4 Md€ de solde net, plus cotisations,
