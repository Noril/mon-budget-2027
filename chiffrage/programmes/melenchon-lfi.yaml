    bas: -16.14
    haut: -13.4
    montee_en_charge: *id001
  calcul:
    formule: -(hausse * point_2032 + hausse / 100 * indexation) * (1 - retour)
    parametres:
      hausse:
        valeur: 10
        unite: '% de hausse du point'
        source: https://web.archive.org/web/20260730211950/https://melenchon2027.fr/programme2025/livre/chapitre9/s1/
      point_2032:
        valeur: 1.86
        unite: Md€ courants 2032 pour 1 % de hausse, brut hors cotisations employeurs
        bareme: point_indice_1pct_2032
      indexation:
        valeur: 20.6
        unite: Md€ courants 2032, indexation 2027-2032 (pour l'effet croisé)
        bareme: indexation_point_indice_2027_2032
        note: 'effet croisé : l''indexation promise (echelle-mobile-salaires) s''applique à une masse déjà relevée de 10 %'
      retour:
        valeur: 0.28
        unite: part de la rémunération brute hors cotisations employeurs revenant aux APU
        bareme: retour_prelevements_salaires_publics
    explication: 'Hausse ponctuelle de 10 % du point : 10 × 1,86 Md€ (point_indice_1pct_2032, point gelé, sans facteur PIB)
      = 18,6 Md€ brut, plus l''effet croisé avec l''indexation promise (echelle-mobile-salaires) : 10 % × 20,6 = 2,06 Md€,
      compté dans cette ligne ; net des retours (× 0,72) = 14,9 Md€. Bas : 10 × 1,93 + 10 % × 22,2 au retour 0,25 (16,1) ;
      haut : 10 × 1,80 + 10 % × 17,0 au retour 0,32 (13,4). Avec echelle-mobile-salaires (indexation seule, 20,6 brut),
      l''ensemble fait 18,6 + 20,6 + 2,06 = 41,3 Md€ brut, 29,7 Md€ net, sans double compte. La compensation aux collectivités est un transfert interne aux
      APU (neutre).'
  chiffrages_tiers:
  - auteur: LFI (contre-budget 2026, montant revendiqué)
