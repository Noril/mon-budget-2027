    commentaire: 'Passe sources : citation de presse (L''Express) remplacée par le texte du discours de Saint-Denis publié sur le blog du
      candidat (melenchon.fr) ; « net » vient de la page d''accueil de LFI ; SMIC net 2026 (1 477,93 €) vérifié sur
      service-public.gouv.fr (1 867,02 € brut depuis le 1er juin 2026). Valeurs inchangées. Vérification précédente
      (verificateur-sonnet, corrige) : Rejoué : 15,03 × 0,31 × 1,2106 = 5,64. Le calcul est linéaire sur +15 % alors que
      la source (Groupe d''experts SMIC 2017) vaut pour de petites hausses, et le barème smic_1pct_cout_apu (0,31 =
      quasi son bas 0,24, source de 2017, sans actualisation RGDU) est suspect ; la borne basse (-20, IGF 1,1 Md€/point)
      couvre l''incertitude. Non compté : refonte des grilles de la fonction publique pour passer sous 1 700 € net (LFI,
      contre-budget), qui recoupe partiellement point-indice-10-pct. Recalé sur les conventions communes du 29/09 :
      hausse de 15 % : produit linéaire = minorant, haut −2,4 → −5,64 (= central) ; bas −20 inchangé (≥ 1,5 × le produit
      linéaire). Recalé sur les barèmes sourcés du 29/09 : smic_1pct_cout_apu 0,31 → 0,9 (bas 0,31, haut 1,7 ; allègements sous le barème RGDU) : central −5,64 → −16,37, haut −5,64 → −16,37 (= central, convention 7), bas −20 → −30,92 (haut du barème 1,7 au lieu de l''IGF 2010). Recouvrement possible avec exonerations-cotisations-2-smic (allègements entre 2 et 3 SMIC) signalé, non déduit.'
- id: echelle-mobile-salaires
  libelle: Indexation des salaires sur l'inflation (échelle mobile), privé et fonction publique
  domaine: travail
  citation:
    texte: Porter immédiatement le SMIC mensuel à 1600 euros net et indexer les salaires sur l'inflation dans le privé et
      dans la fonction publique
    url: https://web.archive.org/web/20260829202700/https://melenchon2027.fr/programme2025/livre/chapitre8/s4/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-08-29)'
  precision: partielle
  interpretation: 'Reprise en campagne sous le nom d''« échelle mobile des salaires » (braderie de Lille, 5/09/2026 ; Fête
    de l''Humanité, 12/09/2026). Effet budgétaire direct : indexation du point d''indice sur les prix (voir aussi point-indice-10-pct)
    ; pour le privé, effet via allègements et prestations indexées. Le montant du SMIC de cette citation est remplacé par
    1 700 € (mesure smic-1700-net). Double compte évité : le +10 % de point d''indice (point-indice-10-pct) est un rattrapage
    ponctuel, l''indexation porte sur les années suivantes.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -14.83
    bas: -17.65
    haut: -11.56
    montee_en_charge:
      '2027': 0.13
      '2028': 0.3
      '2029': 0.48
      '2030': 0.66
      '2031': 0.83
      '2032': 1
  calcul:
    formule: -indexation * (1 - retour)
    parametres:
      indexation:
        valeur: 20.6
        unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
        bareme: indexation_point_indice_2027_2032
        note: 'point gelé à droit constant : 1,86 Md€ par point en 2032 × 11,03 points d''inflation cumulée 2027-2032'
      retour:
        valeur: 0.28
        unite: part de la rémunération brute hors cotisations employeurs revenant aux APU
        bareme: retour_prelevements_salaires_publics
    explication: 'Effet budgétaire direct : indexation du point d''indice sur l''inflation, qui n''est pas prévue par le droit
      (point gelé). Barème indexation_point_indice_2027_2032 (20,6 Md€ brut hors cotisations employeurs en 2032, sans projection
      par le PIB), net des prélèvements qui reviennent aux APU (× (1 − 0,28), retour_prelevements_salaires_publics) = 14,8
      Md€. Bas : indexation sur les prix à la consommation (haut du barème, 22,2) au retour bas (0,25), plus 1 Md€ de pensions
      induites : 17,65 ; haut : bas du barème (17,0) au retour haut (0,32) : 11,56. Montée en charge du barème (0,13 / 0,30 / 0,48 / 0,66
      / 0,83 / 1). L''effet croisé avec le +10 % est compté dans point-indice-10-pct. Dans le privé, le SMIC est déjà indexé
      par la loi ; l''indexation des autres salaires passe par la négociation et n''a pas d''effet budgétaire direct compté.'
  effets_retour: 'Indexation privée : effets sur les allègements et la prime d''activité, et effets inflationnistes, non comptés.'
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : contestation tranchée. Les trois réserves portaient sur l''ancien calcul (base × PIB nominal
      puis × inflation, « quart » de retour non sourcé, écart avec Tondelier) ; le recalage sur les barèmes communs les lève
      : indexation_point_indice_2027_2032 (point gelé × inflation cumulée, sans facteur PIB), retour_prelevements_salaires_publics
      (construction détaillée à partir des taux légaux), même barème pour tous les programmes. Lecture confirmée par le candidat
      (braderie de Lille, Fête de l''Humanité : « échelle mobile des salaires », « quand les prix augmentent, les salaires aussi
      », La Dépêche) : l''indexation des salaires publics sur les prix, que le haut du barème (IPC) couvre. Rejoué : 28,6
      × 0,72 = 20,59. Vérification précédente (verificateur-sonnet, conteste) : Arithmétique rejouée (11,04 × 2,2 × 1,28 × 0,75 = 23,3) mais trois réserves, central non modifié : (1) inflation
      comptée deux fois : la base 2032 est multipliée par 1,28 (PIB nominal, qui contient l''inflation) puis par l''inflation
      cumulée ; avec un point gelé (base ≈ 2,5 Md€, comme le programme Tondelier) on obtient environ -20,7 ; (2) le quart
      de retours est une hypothèse du barème non sourcée, alors que le brut 2,2 Md€ contient des cotisations employeurs internes
      aux APU (CAS Pensions, CNRACL) : retours plus proches de 35 % ; (3) écart de convention avec le programme Tondelier,
      qui compte -27,6 (11,04 × 2,5) sans aucun retour : avec la même convention, l''écart est de -4,3 Md€. Effet croisé non
      compté : l''indexation s''applique sur un point déjà relevé de 10 % (≈ -2,3), qui compense à peu près le doublon d''inflation.
      Pas de double compte avec le +10 % (rattrapage ponctuel, indexation sur les années suivantes) ; le privé n''a pas d''effet
      direct compté. Recalé sur les conventions communes du 29/09 : barème indexation_point_indice_2027_2032 (28,6 brut) net
      du retour 0,28 ; plus de facteur PIB ni de « quart » ; montée en charge imposée ; central −23,32 → −20,59, bas −35,5
      → −24,1, haut −23,1 → −16,05 (les réserves (1) et (2) sont levées). Recalé sur les barèmes sourcés du 29/09 : indexation_point_indice_2027_2032 28,6 → 20,6 brut (bas 17,0, haut 22,2), net 14,8 : central −20,59 → −14,83, bas −24,1 → −17,65 (22,2 × 0,75 + 1 de pensions induites), haut −16,05 → −11,56 (17,0 × 0,68). Pas de double compte avec point-indice-10-pct (hausse et effet croisé comptés là).'
