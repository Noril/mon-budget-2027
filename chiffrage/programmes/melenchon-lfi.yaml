- id: indexation-pensions-salaires
  libelle: Indexation des pensions sur les salaires
  domaine: retraites
  citation:
    texte: Indexer le montant des retraites sur les salaires
    url: https://web.archive.org/web/20260907170933/https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-09-07)'
  precision: precise
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par l''édition 2025 (dernière version publiée ; nouvelle
    version annoncée pour le 6 novembre 2026). Coût = écart salaires/prix appliqué à la masse des pensions. Montant revendiqué
    par LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en charge) : 3,3 Md€.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -13.23
    bas: -21.0
    haut: -9.26
    montee_en_charge:
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1
  calcul:
    formule: -productivite * annees * revalo_1pct * (1 - retour)
    parametres:
      productivite:
        valeur: 0.63
        unite: point par an (croissance réelle du revenu moyen par tête)
        source: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
        note: 'COR, rapport annuel juin 2026 (hypothèses Direction du budget) : « revenu moyen par tête (RMPT) de l''ensemble
          de l''économie, attendu à + 7,8 % » en termes réels entre 2025 et 2037, soit 1,078^(1/12) − 1 ≈ 0,63 % par an ;
          à long terme, « L''hypothèse de croissance de la productivité horaire du travail retenue dans le scénario de référence
          s''établit à 0,7 % par an à compter de 2040 », variantes 0,4 % et 1,0 %'
      annees:
        valeur: 5
        unite: années d'indexation cumulées (2028-2032)
        source: https://solidarites.gouv.fr/loi-de-financement-de-la-securite-sociale-2026-les-mesures-phares
        note: mesure votée en loi de financement fin 2027
      revalo_1pct:
        valeur: 5.0
        unite: Md€ courants par an, en 2032, par point de revalorisation
        bareme: retraites_revalo_1pct
      retour:
        valeur: 0.16
        unite: part de la hausse brute des pensions revenant aux APU
        bareme: retour_prelevements_pensions
    explication: 'Indexer sur les salaires plutôt que sur les prix ajoute chaque année l''écart salaires-prix à toutes les
      pensions ; l''effet se cumule : 5 ans × 0,63 point (croissance réelle du revenu moyen par tête 2025-2037 du COR 2026)
      × 5,0 Md€ = 15,75 Md€ brut en 2032, net des prélèvements qui reviennent aux APU (CSG, CRDS, CASA, IR : × (1 − 0,16),
      retour_prelevements_pensions) = 13,23 Md€. Bas : variante haute de productivité du COR (1,0 %), 25 × 0,84 = 21,0 ; haut
      : régimes de base seuls (3,5 Md€ par point), 0,63 × 5 × 3,5 × 0,84 = 9,26.'
  chiffrages_tiers:
  - auteur: LFI (contre-budget 2026, montant revendiqué)
    montant_md: 3.3
    url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    date: '2025-10-24'
    commentaire: Première année.
  effets_retour: 'CSG, CRDS, CASA et IR prélevés sur la hausse des pensions : déduits (convention commune, 16 %).'
  confiance: moyenne
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : l''hypothèse de 0,7 % venait d''une page de l''IPP commentant un ancien rapport du COR ; source
      primaire relue (COR, rapport annuel 2026) : 0,7 % est la productivité de long terme (à partir de 2040) ; sur 2025-2037,
      la croissance réelle du revenu moyen par tête est de 7,8 % au total, soit 0,63 % par an, retenu pour 2028-2032. Central
      −15,05 → −13,55, haut −10,54 → −9,48 ; bas inchangé (variante 1,0 % du COR). Montant du contre-budget (3,3 Md€) relu
      p. 49. Vérification précédente (verificateur-sonnet, corrige) : Rejoué : 0,7 × 5 × 5,0 = 17,5. Droit constant respecté (pensions indexées sur les prix ; le coût est l''écart
      salaires-prix cumulé 2028-2032). Cohérent avec les 3,3 Md€ de LFI pour la première année (0,7 × 5,0 = 3,5). Réserves
      : coût brut, la CSG/CRDS/CASA et l''IR prélevés sur la hausse (retour certain d''environ 10 %) ne sont pas déduits,
      contrairement au point d''indice (net d''un quart) : écart de convention favorable au programme dans le sens prudent
      (surestime le coût d''environ 1,5 à 2 Md€) ; périmètre tous régimes (les complémentaires relèvent des partenaires sociaux)
      retenu au central, régimes de base seuls au haut. Recalé sur les conventions communes du 29/09 : net de retour_prelevements_pensions
      (0,14) : central −17,5 → −15,05, bas −25 → −21,5, haut −12,25 → −10,54. Recalé sur les barèmes sourcés du 29/09 : retour_prelevements_pensions 0,14 → 0,16 : central −13,55 → −13,23, bas −21,5 → −21,0, haut −9,48 → −9,26.'
