    statut: ok
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : « Rétablir la CVAE : 11 milliards d''euros de recettes », « Revenir sur la baisse de la
      CFE : 3,35 milliards » relus p. 62 du contre-budget ; barème cvae_restante, inchangé. Vérification précédente (verificateur-sonnet,
      ok) : Rejoué : 3,7 × 1,2106 = 4,48. Référence correcte (CVAE supprimée en 2030 au droit voté : le rétablissement rapporte
