  domaine: travail
  citation:
    texte: Augmenter immédiatement le SMIC à 1 700 euros net mensuel et les minima sociaux
    url: https://web.archive.org/web/20261109203759/https://melenchon2027.fr/programme/livre/une-economie-au-service-des-besoins/chapitre2
    date: '2026-11-06'
    support: 'programme : L''Avenir en commun, 5e édition (6 novembre 2026), melenchon2027.fr, copie Wayback du 2026-11-09'
  precision: precise
  interpretation: 'L''édition 2026 de L''AEC inscrit la cible de campagne : « Augmenter immédiatement le SMIC à 1 700 euros
    net mensuel » (partie 2, chapitre 2 ; l''AEC 2025 disait 1 600 €). On retient 1 700 € net au 1er janvier 2027 de référence
    ; la hausse des minima sociaux de la même phrase est portée par garantie-autonomie et aah-smic. Effets APU directs : masse
    salariale publique, allègements généraux et prime d''activité, cotisations et impôts en retour, fonds de péréquation pour
    les TPE-PME « financé par le redéploiement des aides aux grandes entreprises » (contre-budget). Montant revendiqué par
    LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en charge) : 1,6 Md€ pour le SMIC à 1 600 €
    net. Décision de chiffrage : 1 700 € net en central ; la lecture à 1 600 € (AEC 2025) n''est pas retenue comme borne,
    le haut étant égal au central (convention commune n° 7). Le budget rectificatif 2027 cite le SMIC à 1 700 € net (LCP),
    sans montant.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -16.47
    bas: -31.1
    haut: -16.47
    montee_en_charge: &id001
      '2027': 0.5
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(smic_cible / smic_net_2026 - 1) * 100 * cout_1pct * fp
    parametres:
      smic_cible:
