- id: hausse-cotisation-vieillesse
  libelle: Hausse de 0,25 point par an du taux de cotisation vieillesse et cotisations sur dividendes, intéressement, participation,
    épargne salariale
  domaine: retraites
  citation:
    texte: Augmenter de 0,25 point par an durant le quinquennat le taux de cotisation vieillesse et soumettre à cotisation
      les dividendes, les revenus d'intéressement, de participation, d'épargne salariale, ainsi que les revenus financiers
      des entreprises
    url: https://web.archive.org/web/20260907170933/https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-09-07)'
  precision: precise
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par l''édition 2025 (dernière version publiée ; nouvelle
    version annoncée pour le 6 novembre 2026). Mesure de recette : +1,25 point en 2031-2032. Montant revendiqué par LFI dans
    le contre-budget 2026 (octobre 2025, première année, avant montée en charge) : 3,2 Md€ la première année (+0,25 point)
    ; « Soumettre les dividendes, la participation, l''épargne salariale, les rachats d''actions à cotisations » : 15,5 Md€
    (traité ici dans la même mesure pour éviter le double compte). Double compte : les cotisations sur les dividendes et les
    rachats d''actions (15,5 Md€ avec l''épargne salariale dans le contre-budget) ne sont pas comptées ici, la base des dividendes
    étant déjà visée par la fin du PFU et la taxe de 10 %. Une hausse de cotisation salariale réduit un peu l''assiette de
    l''IR (non chiffré).'
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 17.89
    bas: 15.77
    haut: 21.22
    montee_en_charge:
      '2027': 0
      '2028': 0.58
      '2029': 0.69
      '2030': 0.79
      '2031': 0.9
      '2032': 1
  calcul:
    formule: points_2032 * point_cotisation * f25 + interessement_2022 * f24
    parametres:
      points_2032:
        valeur: 1.25
        unite: point
        source: 'chiffrage/programmes/melenchon-lfi.yaml (citation : « 0,25 point par an durant le quinquennat »)'
        note: cinq hausses de 0,25 point, au 1er janvier 2028 à 2032
      point_cotisation:
        valeur: 6.2
        unite: Md€ par an par point de cotisation
        bareme: retraites_cotisation_vieillesse_1_point
        note: salariale sous plafond ou patronale déplafonnée ; répartition salarié/employeur non précisée
      f25:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
      interessement_2022:
        valeur: 6.9
        unite: Md€/an (2022)
        source: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/assujettir-aux-cotisations-sociales-les-revenus-dinteressement-de-participation-et-depargne-salariale/
        note: 'Institut Montaigne : si les entreprises maintiennent leur budget de personnel, « le gain pour les finances
          publiques serait plus limité (6,9 Md€) » ; haut 9 Md€'
      f24:
        valeur: 1.2336
        unite: facteur PIB nominal 2024→2032
        bareme: facteur_pib_2024_2032
        note: 'appliqué aux chiffrages 2022 de l''Institut Montaigne (horizon 2027) : sous-estime la croissance de l''assiette
          depuis 2022, donc prudent pour une recette'
    explication: 'Deux volets. (1) +1,25 point de cotisation vieillesse en 2032 × rendement d''un point (6,2 Md€ en 2025,
      barème retraites_cotisation_vieillesse_1_point, valeur centrale retenue car la promesse ne précise pas le type de cotisation)
      × PIB 2025→2032 = 9,4 Md€. (2) Cotisations sociales sur l''intéressement, la participation et l''épargne salariale :
      6,9 Md€ (Institut Montaigne 2022, avec réaction des employeurs) × 1,2336 = 8,5 Md€. Bas = rendement patronal sous plafond
      (4,8 Md€ le point, réduit par les allègements) pour le volet 1 ; il couvre aussi le surcoût pour les employeurs publics
      d''une hausse de la part patronale (agents contractuels relevant du régime général), non chiffré faute de donnée ouverte
      sur leur part dans l''assiette. Haut = rendement salarial déplafonné (7,6 Md€), net du retour négatif sur l''IR d''une
      cotisation salariale (× (1 − 0,12), convention commune n° 9, même convention que la CSG déductible), soit 1,25 × 7,6
      × 0,88 × 1,2106 = 10,1, et 9 Md€ × 1,2336 = 11,1 pour le volet 2. Montée : volet 1 par cinquièmes de 2028 à 2032, volet
      2 plein dès 2028.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 8.0
    url: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/assujettir-aux-cotisations-sociales-les-revenus-dinteressement-de-participation-et-depargne-salariale/
    date: '2022'
    commentaire: 'Intéressement, participation, épargne salariale seuls : 6,9 à 9 Md€ (équipe de campagne 2022 : 8,2 Md€)
      ; +0,25 pt/an sur le mandat : 16 Md€ selon l''équipe de campagne 2022.'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: 'Rejoué : 1,25 × 6,2 × 1,2106 + 6,9 × 1,2336 = 17,9. Montants sourcés (Cour des comptes tableau 8 ; Montaigne
      6,9-9 Md€ avec réaction des employeurs). Réserves : la part patronale d''employeurs publics (retour négatif) et l''effet
      sur l''assiette de l''IR ne sont pas comptés ; l''intéressement est projeté depuis 2024 alors que le chiffrage est de
      2022 (prudent pour une recette). Aucun double compte avec les dividendes (exclus explicitement). Recalé sur les conventions
      communes du 29/09 : type de cotisation non précisé, central au barème (6,2) inchangé ; haut 20,3 → 21,22 : cotisation
      salariale déplafonnée nette du retour IR (× 0,88) et volet 2 à 9 × 1,2336 comme l''annonçait l''explication (l''ancien
      20,3 ne s''en déduisait pas).'
- id: smic-1700-net
  libelle: SMIC porté à 1 700 € net par mois
  domaine: travail
  citation:
    texte: Lors de son premier meeting à Saint-Denis le 7 juin, le leader insoumis a promis de porter le Smic net à 1 700
      euros par mois, soit une hausse immédiate de près de 14 %.
    url: https://www.lexpress.fr/economie/jean-luc-melenchon-et-le-smic-a-1-700-euros-cest-un-mauvais-outil-de-lutte-contre-la-pauvrete-TL3NGV6CXVCDVH6WPVLHJ5BUFY/
    date: '2026-06-09'
    support: presse (L'Express), meeting de Saint-Denis du 7 juin 2026
  precision: precise
  interpretation: 'L''AEC 2025 écrit « Porter immédiatement le SMIC mensuel à 1600 euros net » (chapitre 8, s4) ; la campagne
    2026 porte la cible à 1 700 € net (page d''accueil de LFI : « Le SMIC à 1700€ net »). On retient 1 700 € net au 1er janvier
    2027 de référence. Effets APU directs : masse salariale publique, allègements généraux et prime d''activité, cotisations
    et impôts en retour, fonds de péréquation pour les TPE-PME « financé par le redéploiement des aides aux grandes entreprises
    » (contre-budget). Montant revendiqué par LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en
    charge) : 1,6 Md€ pour le SMIC à 1 600 € net. Décision de chiffrage : 1 700 € net en central, 1 600 € (AEC 2025) en borne
    favorable.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -5.64
    bas: -20.0
    haut: -5.64
    montee_en_charge: &id001
      '2027': 0.5
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(smic_cible / smic_net_2026 - 1) * 100 * cout_1pct * fp
    parametres:
      smic_cible:
        valeur: 1700
        unite: € net par mois
        source: https://www.lexpress.fr/economie/jean-luc-melenchon-et-le-smic-a-1-700-euros-cest-un-mauvais-outil-de-lutte-contre-la-pauvrete-TL3NGV6CXVCDVH6WPVLHJ5BUFY/
      smic_net_2026:
        valeur: 1477.93
        unite: € net par mois
        source: https://www.service-public.gouv.fr/particuliers/vosdroits/F2300
      cout_1pct:
        valeur: 0.31
        unite: Md€/an de moindre solde par point de % de hausse du Smic
        bareme: smic_1pct_cout_apu
      fp:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
        note: FMI WEO avril 2026 via plan/hypotheses.yaml ; facteur repris en tête de chiffrage/baremes.yaml
    explication: 'Hausse de 15 % du SMIC net (1 477,93 € → 1 700 €) × coût APU d''un point de SMIC (0,31 Md€ : allègements,
      masse salariale publique, prime d''activité, nets des cotisations et de l''IR en retour) × facteur PIB. Au-delà de 10
      %, le produit linéaire est un minorant (convention commune n° 7 : diffusion jusqu''à 1,2-1,5 SMIC, élargissement de
      la population au voisinage du SMIC, sortie de la prime d''activité) : haut = central. Bas : haut du barème (1,1 Md€
      par point, IGF 2010, sans recettes induites), au-delà de 1,5 fois le produit linéaire. La lecture à 1 600 € (AEC 2025,
      +8,3 %) n''est plus la borne favorable. Hausse par décret dès l''été 2027.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 2.7
    url: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/augmenter-le-smic-a-1-400-e-net/
    date: '2022'
    commentaire: 'SMIC à 1 400 € net (2022) : coût APU d''environ 2,7 Md€ par an (allègements, fonction publique).'
  effets_retour: 'Effets sur l''emploi peu qualifié (négatifs selon le groupe d''experts SMIC) et sur la consommation (invoqués
    par LFI) : non comptés.'
  confiance: faible
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: 'Rejoué : 15,03 × 0,31 × 1,2106 = 5,64. Le calcul est linéaire sur +15 % alors que la source (Groupe d''experts
      SMIC 2017) vaut pour de petites hausses, et le barème smic_1pct_cout_apu (0,31 = quasi son bas 0,24, source de 2017,
      sans actualisation RGDU) est suspect ; la borne basse (-20, IGF 1,1 Md€/point) couvre l''incertitude. Non compté : refonte
      des grilles de la fonction publique pour passer sous 1 700 € net (LFI, contre-budget), qui recoupe partiellement point-indice-10-pct.
      Recalé sur les conventions communes du 29/09 : hausse de 15 % : produit linéaire = minorant, haut −2,4 → −5,64 (= central)
      ; bas −20 inchangé (≥ 1,5 × le produit linéaire).'
- id: echelle-mobile-salaires
  libelle: Indexation des salaires sur l'inflation (échelle mobile), privé et fonction publique
  domaine: travail
  citation:
    texte: Porter immédiatement le SMIC mensuel à 1600 euros net et indexer les salaires sur l'inflation dans le privé et
      dans la fonction publique
    url: https://web.archive.org/web/20260829202700/https://melenchon2027.fr/programme2025/livre/chapitre8/s4/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-08-29)'
  precision: partielle
  interpretation: 'Reprise en campagne sous le nom d''« échelle mobile des salaires » (braderie de Lille, 5/09/2026 ; Fête
    de l''Humanité, 12/09/2026). Effet budgétaire direct : indexation du point d''indice sur les prix (voir aussi point-indice-10-pct)
    ; pour le privé, effet via allègements et prestations indexées. Le montant du SMIC de cette citation est remplacé par
    1 700 € (mesure smic-1700-net). Double compte évité : le +10 % de point d''indice (point-indice-10-pct) est un rattrapage
    ponctuel, l''indexation porte sur les années suivantes.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -20.59
    bas: -24.1
    haut: -16.05
    montee_en_charge:
      '2027': 0.13
      '2028': 0.3
      '2029': 0.48
      '2030': 0.66
      '2031': 0.83
      '2032': 1
  calcul:
    formule: -indexation * (1 - retour)
    parametres:
      indexation:
        valeur: 28.6
        unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
        bareme: indexation_point_indice_2027_2032
        note: 'point gelé à droit constant : 2,59 Md€ par point en 2032 × 11,03 points de déflateur cumulé 2027-2032'
      retour:
        valeur: 0.28
        unite: part de la rémunération brute hors cotisations employeurs revenant aux APU
        bareme: retour_prelevements_salaires_publics
    explication: 'Effet budgétaire direct : indexation du point d''indice sur l''inflation, qui n''est pas prévue par le droit
      (point gelé). Barème indexation_point_indice_2027_2032 (28,6 Md€ brut hors cotisations employeurs en 2032, sans projection
      par le PIB), net des prélèvements qui reviennent aux APU (× (1 − 0,28), retour_prelevements_salaires_publics) = 20,6
      Md€. Bas : indexation sur les prix à la consommation (30,8) au retour bas (0,25), plus 1 Md€ de pensions induites :
      24,1 ; haut : bas du barème (23,6) au retour haut (0,32) : 16,05. Montée en charge du barème (0,13 / 0,30 / 0,48 / 0,66
      / 0,83 / 1). L''effet croisé avec le +10 % est compté dans point-indice-10-pct. Dans le privé, le SMIC est déjà indexé
      par la loi ; l''indexation des autres salaires passe par la négociation et n''a pas d''effet budgétaire direct compté.'
  effets_retour: 'Indexation privée : effets sur les allègements et la prime d''activité, et effets inflationnistes, non comptés.'
  confiance: moyenne
  verification:
    statut: conteste
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: 'Arithmétique rejouée (11,04 × 2,2 × 1,28 × 0,75 = 23,3) mais trois réserves, central non modifié : (1) inflation
      comptée deux fois : la base 2032 est multipliée par 1,28 (PIB nominal, qui contient l''inflation) puis par l''inflation
      cumulée ; avec un point gelé (base ≈ 2,5 Md€, comme le programme Tondelier) on obtient environ -20,7 ; (2) le quart
      de retours est une hypothèse du barème non sourcée, alors que le brut 2,2 Md€ contient des cotisations employeurs internes
      aux APU (CAS Pensions, CNRACL) : retours plus proches de 35 % ; (3) écart de convention avec le programme Tondelier,
      qui compte -27,6 (11,04 × 2,5) sans aucun retour : avec la même convention, l''écart est de -4,3 Md€. Effet croisé non
      compté : l''indexation s''applique sur un point déjà relevé de 10 % (≈ -2,3), qui compense à peu près le doublon d''inflation.
      Pas de double compte avec le +10 % (rattrapage ponctuel, indexation sur les années suivantes) ; le privé n''a pas d''effet
      direct compté. Recalé sur les conventions communes du 29/09 : barème indexation_point_indice_2027_2032 (28,6 brut) net
      du retour 0,28 ; plus de facteur PIB ni de « quart » ; montée en charge imposée ; central −23,32 → −20,59, bas −35,5
      → −24,1, haut −23,1 → −16,05 (les réserves (1) et (2) sont levées).'
