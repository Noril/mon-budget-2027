- id: exonerations-cotisations-2-smic
  libelle: Suppression des exonérations de cotisations patronales au-dessus de deux SMIC
  domaine: fiscalite
  citation:
    texte: 'Supprimer les exonérations patronales au-dessus de deux Smic : 8 milliards d''euros de recettes'
    url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    date: '2025-10-24'
    support: contre-budget 2026 du groupe LFI à l'Assemblée (« Pour une bifurcation écologique et sociale »)
  precision: precise
  interpretation: 'Contre-budget 2026. Interaction avec la hausse du SMIC (seuil de 2 SMIC relevé). Référence : depuis 2026
    les allègements sont fusionnés en une réduction générale dégressive unique (RGDU). Contre-budget : 8 Md€ revendiqués.'
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 5.6
    bas: 4.29
    haut: 5.74
    montee_en_charge: *id004
  calcul:
    formule: part_au_dela_2_smic * allegements * f25
    parametres:
      part_au_dela_2_smic:
        valeur: 0.0612
        unite: part du coût des allègements généraux (RGDU 2026) portée par les salaires supérieurs à 2 Smic
        source: https://www.strategie-plan.gouv.fr/files/files/Publications/2024/SMIC/FS-2025-SMIC-RAPPORT-2024-12f%C3%A9v25.pdf
        note: 'Groupe d''experts sur le Smic, rapport 2024, p. 80, graphique I.27 (DSS, données Urssaf, 2023) : coût des allègements
          par tranche de 0,1 Smic (réduction générale, taux réduit maladie de 6 points jusqu''à 2,5 Smic, taux réduit famille
          de 1,8 point jusqu''à 3,5 Smic). La masse salariale de chaque tranche s''en déduit (taux réduit maladie / 0,06, ou
          famille / 0,018 au-delà de 2,5 Smic) ; on lui applique le barème de la réduction générale dégressive unique de 2026
          (coefficient = 0,02 + 0,3821 × [(1/2) × (3 Smic / rémunération − 1)]^1,75 jusqu''à 3 Smic, service-public.fr, fiche
          F24542). Coût RGDU reconstitué : 73,3 Md€ sur les masses de 2023, dont 4,5 au-dessus de 2 Smic (part 0,061) et 12,6
          au-dessus de 1,6 Smic (part 0,172). Recoupement : 1,2 Md€ au-dessus de 2,5 Smic, contre « 1 milliard d''euros pour
          une sortie du dispositif à 2,5 Smic » (Cour des comptes, RALFSS mai 2025, repris par le Sénat, rapport n° 901)'
      allegements:
        valeur: 75.6
        unite: Md€/an (2025)
        bareme: allegements_generaux_cout
      f25:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
    explication: 'Méthode commune aux promesses de suppression des allègements au-dessus d''un seuil (même méthode pour les
      Écologistes au-dessus de 1,6 Smic) : part du coût de la RGDU de 2026 portée par les salaires au-dessus de 2 Smic (0,0612,
      reconstituée sur la distribution des allègements par tranche de Smic publiée par le Groupe d''experts sur le Smic),
      appliquée au coût des allègements généraux (barème allegements_generaux_cout, 75,6 Md€ en 2025, stable en 2026 après
      le gel du Smic de référence) et projetée en 2032 : 0,0612 × 75,6 × 1,2106 = 5,6 Md€. Lecture littérale (exonérations
      nulles au-dessus de 2 Smic, barème inchangé en dessous). Bas : coût bas des allègements (72,3) et moindre IS sur les
      allègements supprimés (retour de 20 % : 0,4 Md€ d''IS pour 2 Md€ d''allègements en moins en 2025, Sénat, rapport n° 901)
      : 4,29. Haut : coût haut des allègements (77,5) : 5,74. Les 7 Md€ du Groupe d''experts (sortie à 2 Smic) portent sur
      le barème d''avant 2026, où les bandeaux maladie et famille exonéraient 7,8 points jusqu''à 2,5 Smic (8,0 Md€ au-dessus
      de 2 Smic en 2023 selon le même graphique) ; la RGDU n''exonère plus que 2 à 5 points dans cette zone. La hausse du
      Smic à 1 700 € net relève le seuil en euros et réduit un peu l''assiette : non déduit.'
  effets_retour: 'Effets sur l''emploi au-delà de 2 SMIC jugés nuls par le CAE (2019) et Bozio-Wasmer (2024) : non comptés.'
  confiance: faible
  verification:
    statut: corrige
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : le 1,5 Md€ attribué à la MECSS porte, dans l''amendement Sénat n° 1029, sur un gel du barème
      des allègements, pas sur une sortie à 2 Smic : remplacé par le 1 Md€ de la sortie à 2,5 Smic (Cour des comptes, MECSS)
      ; 7 Md€ remonté au rapport du Groupe d''experts Smic. Central 5,15 → 4,84, bas 1,5 → 1,0. « Supprimer les exonérations
      patronales au-dessus de deux Smic : 8 milliards d''euros de recettes » relu p. 61 du contre-budget. Vérification précédente
      (verificateur-sonnet, ok) : Rejoué : (1,5 + 7)/2 × 1,2106 = 5,15 ; deux sources (MECSS Sénat 1,5 ; Groupe d''experts SMIC 7) retrouvées
      dans l''amendement Sénat. Le SMIC à 1 700 € relève le seuil et rétrécit l''assiette (couvert par le bas 1,5). Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée.
      Recalé sur les barèmes sourcés du 29/09 : méthode commune aux suppressions d''allègements au-dessus d''un seuil (LFI
      2 Smic, Écologistes 1,6 Smic). La moyenne de deux chiffrages hétérogènes (1 Md€ à 2,5 Smic sous la RGDU ; 7 Md€ à 2
      Smic sous l''ancien barème) est remplacée par la part du coût de la RGDU de 2026 portée par les salaires au-dessus de
      2 Smic (0,0612, graphique I.27 du Groupe d''experts Smic et barème RGDU de service-public.fr), appliquée au barème
      allegements_generaux_cout projeté ; moindre IS (20 %) dans le bas. Central 4,84 → 5,6, bas 1,0 → 4,29, haut 8,47
      → 5,74.'
