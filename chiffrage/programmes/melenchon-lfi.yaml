    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : le barème porte sur 2026 : facteur 2026→2032 (1,1842) au lieu de 2025→2032 : central 6,54
      → 6,39. « Fiscalisation des heures supplémentaires : 1,8 milliard » et « Socialisation des heures supplémentaires :
      3,3 milliards d''euros » relus p. 61 du contre-budget (5,1 Md€ au total). Vérification précédente (verificateur-sonnet,
      ok) : Rejoué : 5,4 × 1,2106 = 6,54 (le facteur 2026→2032, 1,1842, donnerait 6,39 : écart 0,15 Md€). Barème hs_exoneration_cout
      sourcé (Cour des comptes NEB, PLFSS annexe 4). Statique, sans réaction (haut = central) : la baisse du recours aux heures
      supplémentaires est dans le bas (5,2). Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés
      par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée. Audit du 30/09/2026 : le bas (5,2, coût 2024 non projeté,
      en euros 2024) mêlait deux millésimes ; remplacé par la réaction documentée par l''OFCE (−7,1 % d''heures supplémentaires)
      : 5,2 → 5,94. Recalé sur le FMI WEO d''octobre 2026 : central 6,39 → 6,44 (bas 5,94 → 5,98, haut 6,39 → 6,44).'
