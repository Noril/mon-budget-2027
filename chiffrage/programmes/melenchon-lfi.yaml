      et départs selon le CAE (0,26) × croissance du PIB nominal 2025→2032. Bas = estimation basse de G. Zucman (15 Md€) ×
      0,26, non projetée, pour couvrir la lecture « milliardaires seuls » de L'AEC 2025 et l'imputation de l'ISF rétabli.
      Haut = 20 Md€ projetés sans aucune réaction de l'assiette (thèse de G. Zucman, clause de maintien de l'impôt cinq ans
      après un départ).
