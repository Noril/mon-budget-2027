    commentaire: 'Passe sources : citation de presse (L''Express) remplacée par le texte du discours de Saint-Denis publié
      sur le blog du candidat (melenchon.fr) ; « net » vient de la page d''accueil de LFI ; SMIC net 2026 (1 477,93 €) vérifié
      sur service-public.gouv.fr (1 867,02 € brut depuis le 1er juin 2026). Valeurs inchangées. Vérification précédente (verificateur-sonnet,
      corrige) : Rejoué : 15,03 × 0,31 × 1,2106 = 5,64. Le calcul est linéaire sur +15 % alors que la source (Groupe d''experts
      SMIC 2017) vaut pour de petites hausses, et le barème smic_1pct_cout_apu (0,31 = quasi son bas 0,24, source de 2017,
      sans actualisation RGDU) est suspect ; la borne basse (-20, IGF 1,1 Md€/point) couvre l''incertitude. Non compté : refonte
      des grilles de la fonction publique pour passer sous 1 700 € net (LFI, contre-budget), qui recoupe partiellement point-indice-10-pct.
      Recalé sur les conventions communes du 29/09 : hausse de 15 % : produit linéaire = minorant, haut −2,4 → −5,64 (= central)
      ; bas −20 inchangé (≥ 1,5 × le produit linéaire). Recalé sur les barèmes sourcés du 29/09 : smic_1pct_cout_apu 0,31
      → 0,9 (bas 0,31, haut 1,7 ; allègements sous le barème RGDU) : central −5,64 → −16,37, haut −5,64 → −16,37 (= central,
      convention 7), bas −20 → −30,92 (haut du barème 1,7 au lieu de l''IGF 2010). Recouvrement possible avec exonerations-cotisations-2-smic
      (allègements entre 2 et 3 SMIC) signalé, non déduit. Recalé sur le FMI WEO d''octobre 2026 : central −16,37 → −16,47
      (bas −30,92 → −31,1, haut −16,37 → −16,47).'
- id: echelle-mobile-salaires
