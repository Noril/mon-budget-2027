    central: 4.51
    bas: 3.7
    haut: 11.0
    montee_en_charge:
      '2027': 0
      '2028': 0.3
      '2029': 0.6
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: cvae * f25
    parametres:
      cvae:
        valeur: 3.7
        unite: Md€/an
        bareme: cvae_restante
        note: rendement de la CVAE subsistante, supprimée en 2030 par la LFI 2025 (calendrier inchangé par la LFI 2026)
      f25:
        valeur: 1.2177
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
    explication: 'Référence : CVAE maintenue au taux 2024 jusqu''en 2027, en baisse en 2028-2029, supprimée en 2030. La rétablir
      rapporte au moins la CVAE qui aurait subsisté (3,7 Md€ projetés en 2032, dérivation du barème cvae_restante). Bas =
      3,7 Md€ non projeté ; haut = 11 Md€ revendiqués par le contre-budget pour un rétablissement intégral (niveau d''avant
      2023), sans source indépendante. Le retour sur la baisse de la CFE (3,35 Md€ revendiqués) et sur les exonérations de
      TFPB (3,75 Md€) n''est pas compté : la baisse de CFE industrielle est compensée par l''État aux collectivités, le gain
      net pour les APU dépend du sort de cette compensation, non précisé.'
  confiance: moyenne
