    CVAE affectée à l''État depuis 2023 (collectivités compensées en TVA) : la recette va à l''État. Édition 2026 : « remplaçant
    la cotisation sur la valeur ajoutée des entreprises (CVAE) par un nouvel impôt sur les entreprises, dont la progressivité
    sera fonction du chiffre d''affaires et de l''empreinte écologique globale » : lu comme une recette du même ordre que
    la CVAE rétablie.'
