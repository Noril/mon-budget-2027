        note: 'CAE, septembre 2025 (Bach, Bozio, Grimprel, Guillouzouic, Landais, Malgouyres) : l''ensemble des comportements
          d''évitement « entraînerait ainsi une perte de recette de 74 centimes sur chaque euro de fiscalité supplémentaire
