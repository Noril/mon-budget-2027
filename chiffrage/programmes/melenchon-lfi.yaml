annonce_candidat:
  cout_md: 167.9
  financement_md: 183.6
  texte: 'Pas de chiffrage global du programme présidentiel 2027 à la date de collecte : la nouvelle version de L''Avenir
    en commun et son chiffrage sont annoncés pour le 6 novembre 2026. Dernier chiffrage d''ensemble publié par LFI : le contre-budget
    2026 du groupe parlementaire (24 octobre 2025), qui reprend l''essentiel des mesures de L''AEC 2025. Son « tableau d''équilibre
    » : recettes 183,6 Md€, pertes de recettes 4,5 Md€, dépenses 167,9 Md€, économies en dépenses 15,4 Md€, solde +26,7 Md€
    (première année ; plusieurs mesures, dont la retraite à 60 ans, « appelées à monter en charge » ; effets de relance invoqués
    en sus : « au bout de cinq ans, on sera en dessous des 3 % de déficit », É. Coquerel). Méthode revendiquée : variantes
    du modèle FR-BDF de la Banque de France. Jean-Luc Mélenchon, braderie de Lille (5/09/2026) : « Il n''y a rien dans ce
    que je vous propose qui n''ait été médité, réfléchi, calculé » (La Dépêche).'
  url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
notes: 'Base : L''Avenir en commun, édition 2025 (janvier 2025, 831 mesures), programme officiel du candidat jusqu''à la publication
  de la version remaniée annoncée pour le 6 novembre 2026 (LCP, 23/09/2026 ; six chapitres : écologie, économie, social, sciences,
  démocratie, géopolitique ; convention au Bourget le 7 novembre). Les pages de melenchon2027.fr et programme.lafranceinsoumise.fr
  sont protégées par Cloudflare : les citations viennent des copies Wayback (août-septembre 2026) ; quelques sections n''ont
  pas pu être récupérées (logement, transports, grands chantiers : chapitre 7 s5-s6, chapitre 13 s2 et s4, chapitre 5 s1 et
  s4, chapitre 16 s1), d''où le recours au contre-budget 2026 pour ces volets. Ajouts et inflexions de campagne 2026 : SMIC
  à 1 700 € net (Saint-Denis, 7 juin ; AEC 2025 : 1 600 €), cantine bio gratuite pour tous, échelle mobile des salaires, blocage
  des prix et des loyers, état d''urgence sociale, gel/annulation de la dette détenue par l''Eurosystème. Le contre-budget
  2026 (groupe LFI, octobre 2025) est un document du parti, pas le programme du candidat : ses montants sont indiqués dans
  interpretation comme montants revendiqués, jamais comme chiffrage tiers. Les chiffrages de l''Institut Montaigne portent
  sur l''AEC 2022 (SMIC 1 400 €, pensions à 1 400 €…) : ordres de grandeur à réactualiser. Collecte : citations vérifiées
  comme sous-chaînes exactes des textes extraits par curl (espaces, apostrophes et césures de PDF normalisés), le 29/09/2026.'
mesures:
- id: retraite-60-ans
  libelle: Retour de l'âge légal à 60 ans avec 40 annuités (abrogation de la réforme 2023)
  domaine: retraites
  citation:
    texte: Abroger la réforme d'Emmanuel Macron passant l'âge de départ à la retraite à 64 ans et restaurer le droit à la
      retraite à 60 ans à taux plein pour 40 annuités de cotisations
    url: https://web.archive.org/web/20260907170933/https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-09-07)'
  precision: precise
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par l''édition 2025 (dernière version publiée ; nouvelle
    version annoncée pour le 6 novembre 2026). Reconfirmé en campagne : « le plus vite possible » (LCP, 23/09/2026) ; page
    d''accueil LFI (« La retraite à 60 ans »). Lecture retenue : âge d''ouverture des droits 60 ans et durée d''assurance
    ramenée à 40 ans (160 trimestres) pour le taux plein, par rapport à la législation au 1/1/2027 (réforme 2023, éventuellement
    suspendue). Montant revendiqué par LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en charge)
    : 10,3 Md€ (« Abrogation de la réforme des retraites, retour à 60 ans et 40 annuités », « appelée à monter en charge »).
    Doubles comptes : la suppression de la décote n''est pas ajoutée (voir suppression-decote) ; la pension minimale au SMIC
    et la hausse de cotisation vieillesse sont chiffrées à part.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -42.9
    bas: -60.0
    haut: -32.9
    montee_en_charge:
      '2027': 0
      '2028': 0.35
      '2029': 0.55
      '2030': 0.75
      '2031': 0.9
      '2032': 1
  calcul:
    formule: -(retour_62 + age_60 + ecart_duree * duree_1an)
    parametres:
      retour_62:
        valeur: 13.9
        unite: Md€ courants par an (solde du système de retraite), en 2032
        bareme: retraites_retour_62_ans_2032
      age_60:
        valeur: 18
        unite: Md€ courants 2032 par an, en régime de croisière
        bareme: retraites_age_60_depuis_62
      ecart_duree:
        valeur: 2.5
        unite: années de durée d'assurance
        source: https://solidarites.gouv.fr/loi-de-financement-de-la-securite-sociale-2026-les-mesures-phares
        note: 170 trimestres (génération 1964, droit gelé) ramenés à 160 (40 annuités) ; la hausse vers 172 du calendrier
          Touraine est déjà annulée dans retraites_retour_62_ans_2032
      duree_1an:
        valeur: 4.4
        unite: Md€ courants 2032 par an et par année de durée
        bareme: retraites_duree_assurance_1_an
        note: valeur 2035, majorant pour 2032 selon le barème
    explication: 'Coût par rapport au droit voté (suspension jusqu''au 1/1/2028 puis reprise vers 64 ans), sur le solde du
      système de retraite (convention commune n° 4) : annulation des mesures d''âge de 2023 (13,9 Md€ en 2032), passage de
      62 à 60 ans (18 Md€) et durée ramenée à 40 annuités (2,5 ans × 4,4 Md€). Bas = hauts des barèmes sur le même périmètre
      (20 + 18 + 2,5 × 8,8 = 60 ; le haut de retraites_age_60_depuis_62, 33 Md€, est un coût toutes APU avec effets d''activité,
      reporté dans effets_retour et chiffrages_tiers) ; haut = bas des barèmes (8,9 + 13) + durée au central (11). Montée
      en charge : deux générations par an environ à partir de 2028.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 85.8
    url: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/retablir-la-retraite-a-60-ans-apres-40-ans-annees-de-cotisation/
    date: '2022'
    commentaire: 'Scénario médian 2027 (retour sur les mesures d''âge depuis 1993, calcul sur les 10 meilleures années) ;
      bas 36 Md€ (âge et trimestres seuls), haut 112,8 Md€ ; inclut minimum de pension à 1 400 € et trimestres RSA. Contre-chiffrage
      de l''équipe de campagne 2022 : 71,5 Md€ de coûts.'
  - auteur: LFI (contre-budget 2026, montant revendiqué)
    montant_md: 10.3
    url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    date: '2025-10-24'
    commentaire: Première année seulement, « appelée à monter en charge ».
  - auteur: FIPECO (coût toutes APU, effets d'activité compris)
    montant_md: 33.0
    url: https://www.fipeco.fr/commentaire/Avancer%20ou%20reculer%20l'%C3%A2ge%20de%20d%C3%A9part%20en%20retraite
    date: '2024-06-25'
    commentaire: 'Effet de deux ans d''âge sur l''ensemble des APU, 0,9 point de PIB (× 3 621 Md€ en 2032), contre 0,5 point
      pour les seuls régimes de retraite : ancien bas de la mesure, sorti de la fourchette (convention commune n° 4).'
  effets_retour: 'Coût pour l''ensemble des APU, non compté (règle 3 : effets d''emploi des seniors) : FIPECO chiffre l''effet
    total d''un retour de 64 à 62 ans à 0,9 point de PIB (≈ 33 Md€ en 2032) contre 0,5 point pour les seuls régimes ; la DG
    Trésor chiffre le gain total de la réforme 2023 à 24,2 Md€ constants 2024 en 2030 contre 9,7 Md€ pour le système (Cour
    des comptes, février 2025). Moindre emploi des seniors (baisse des cotisations et de l''impôt) non compté. LFI invoque
    des effets de relance (multiplicateurs FR-BDF, « au bout de cinq ans, on sera en dessous des 3 % de déficit ») : non comptés
    (règle 3).'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: 'Rejoué : 13,9 (retour 62 ans, Cnav 15,7 moins suspension 1,8) + 18 (0,5 pt de PIB, FIPECO) + 2,5 × 4,4 (durée)
      = 42,9. Cohérent avec le droit du 29/09/2026 (170 trimestres gelés, reprise en 2028). Recouvrement partiel entre les
      composantes : l''effet âge (FIPECO, durée constante) et l''effet durée (Cour des comptes, 4,4 majorant 2035) se chevauchent
      pour les carrières longues partant à 60 ans (l''âge à 60 ne joue que pour ceux qui ont 160 trimestres), ; l''écart de
      durée est pris de 170 à 160 trimestres alors que le calendrier Touraine en 2032 est proche de 171 (≈ +1 Md€ ignoré).
      Ces deux effets de sens opposé restent dans la fourchette. Décote non ajoutée (pas de double compte), Mico et trimestres
      RSA chiffrés à part. Borne basse (-75) inclut des effets d''activité (hors règle 3), à lire comme borne extrême. Montaigne
      2022 (36 à 113 Md€, référence avant la réforme 2023, avec minimum et RSA) : notre central est inférieur à son bas projeté
      (≈ 49 Md€ en 2032) car nous excluons décote, minimum et RSA (chiffrés à part ou non comptés). Barèmes retraites_retour_62_ans_2032
      et retraites_age_60_depuis_62 suspects (voir rapport). Recalé sur les conventions communes du 29/09 : bas −75 → −60
      (hauts des barèmes sur le périmètre du système de retraite ; le coût toutes APU de FIPECO, 33 Md€ pour 62 → 60 ans,
      passe en effets_retour et chiffrages_tiers) ; central inchangé (−42,9).'
- id: pension-minimale-smic
  libelle: Pensions portées au moins au SMIC revalorisé pour une carrière complète ; minimum vieillesse au seuil de pauvreté
  domaine: retraites
  citation:
    texte: Porter a minima au niveau du SMIC revalorisé toutes les pensions pour une carrière complète (salarié, indépendant,
      agriculteur), et le minimum vieillesse au niveau du seuil de pauvreté
    url: https://web.archive.org/web/20260907170933/https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-09-07)'
  precision: partielle
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par l''édition 2025 (dernière version publiée ; nouvelle
    version annoncée pour le 6 novembre 2026). SMIC revalorisé = 1 600 € net (AEC 2025) ou 1 700 € net (campagne 2026) : paramètre
    à trancher. Montant revendiqué par LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en charge)
    : 8,2 Md€ (minimum contributif) + 5 Md€ (retraites agricoles au SMIC, y compris retraités actuels). Les pensions complémentaires
    relèvent des partenaires sociaux : seul le complément par les régimes de base est compté. Le relèvement du minimum vieillesse
    au seuil de pauvreté n''est pas chiffré (pas de barème ASPA) : sous-estimation.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -14.38
    bas: -15.96
    haut: -7.74
    montee_en_charge:
      '2027': 0
      '2028': 1
      '2029': 1
      '2030': 1
      '2031': 1
      '2032': 1
  calcul:
    formule: -(cb_mico + cb_agricole) * fp26 * (1 - retour)
    parametres:
      cb_mico:
        valeur: 8.2
        unite: Md€ (2026, première année)
        source: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
        note: 'montant revendiqué par LFI, contre-budget 2026 : « Augmenter le minimum contributif (Mico) pour relever les
          petites pensions : 8,2 milliards d''euros » ; « appelée à monter en charge »'
      cb_agricole:
        valeur: 5.0
        unite: Md€ (2026, première année)
        source: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
        note: '« Assurer de réelles retraites agricoles en portant le minimum de pension au niveau du SMIC revalorisé, soit
          1 600 euros net par mois, y compris pour les retraités actuels : 5 milliards d''euros »'
      fp26:
        valeur: 1.1842
        unite: facteur PIB nominal 2026→2032
        bareme: facteur_pib_2026_2032
        note: '1,2106 / (1,00858 × 1,01358) : croissance réelle et déflateur 2026 du FMI (plan/hypotheses.yaml)'
      retour:
        valeur: 0.08
        unite: part de la hausse brute des pensions revenant aux APU (petites pensions)
        bareme: retour_prelevements_pensions
        note: 'bas du barème : petites pensions (CSG réduite ou nulle, IR nul)'
    explication: 'Central : montants revendiqués par LFI pour le Mico (8,2) et les retraites agricoles au SMIC (5) dans le
      contre-budget 2026 (première année, « appelée à monter en charge »), projetés en 2032 (× 1,1842) = 15,6 Md€ brut, nets
      des prélèvements qui reviennent aux APU sur de petites pensions (× (1 − 0,08), retour_prelevements_pensions) = 14,4
      Md€. Le barème linéaire (1,6 Md€ par tranche de 100 €, soit 8,4 Md€) sous-estime : le nombre de retraités à carrière
      complète sous 1 700 € net croît avec la cible, et le barème vaut pour le Mico seul. Bas : Institut Montaigne 2022 (MICO
      à 1 400 € : 12,72 Md€ avec minimum vieillesse) × 1,3643 × 0,92 = 16,0 Md€ ; haut : ancienne valeur linéaire du barème
      (8,4 Md€) × 0,92. Le minimum vieillesse au seuil de pauvreté n''est toujours pas chiffré.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 12.72
    url: https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/retablir-la-retraite-a-60-ans-apres-40-ans-annees-de-cotisation/
    date: '2022'
    commentaire: 'MICO à 1 400 € pour carrière complète : 12,05 Md€ ; minimum vieillesse : 0,67 Md€ (paramètres 2022).'
  - auteur: LFI (contre-budget 2026, montant revendiqué)
    montant_md: 13.2
    url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    date: '2025-10-24'
    commentaire: Mico 8,2 Md€ + retraites agricoles au SMIC 5 Md€.
  confiance: faible
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: 'Extrapolation linéaire du barème Mico (1,6 Md€/100 €) donnait -8,41, sous les 13,2 Md€ revendiqués par LFI
      pour la seule première année et sous Montaigne (12,72 Md€ en 2022, 17,4 en 2032, non projetés) : la borne basse ne couvrait
      même pas le chiffre du parti. Central ancien -8,41 (devient la borne haute). Recalé sur les conventions communes du
      29/09 : net du retour sur petites pensions (0,08) : central −15,63 → −14,38, bas −17,35 → −15,96, haut −8,41 → −7,74.'
- id: indexation-pensions-salaires
  libelle: Indexation des pensions sur les salaires
  domaine: retraites
  citation:
    texte: Indexer le montant des retraites sur les salaires
    url: https://web.archive.org/web/20260907170933/https://melenchon2027.fr/programme2025/livre/chapitre8/s8/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-09-07)'
  precision: precise
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par l''édition 2025 (dernière version publiée ; nouvelle
    version annoncée pour le 6 novembre 2026). Coût = écart salaires/prix appliqué à la masse des pensions. Montant revendiqué
    par LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en charge) : 3,3 Md€.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -15.05
    bas: -21.5
    haut: -10.54
    montee_en_charge:
      '2027': 0
      '2028': 0.2
      '2029': 0.4
      '2030': 0.6
      '2031': 0.8
      '2032': 1
  calcul:
    formule: -productivite * annees * revalo_1pct * (1 - retour)
    parametres:
      productivite:
        valeur: 0.7
        unite: point par an (salaires réels)
        source: https://www.ipp.eu/indexation-dans-les-regimes-de-retraite-par-points-comment-lire-les-hypotheses-du-dernier-rapport-du-cor/
        note: hypothèse centrale de croissance de la productivité du COR (0,7 % contre 1 % auparavant)
      annees:
        valeur: 5
        unite: années d'indexation cumulées (2028-2032)
        source: https://solidarites.gouv.fr/loi-de-financement-de-la-securite-sociale-2026-les-mesures-phares
        note: mesure votée en loi de financement fin 2027
      revalo_1pct:
        valeur: 5.0
        unite: Md€ courants par an, en 2032, par point de revalorisation
        bareme: retraites_revalo_1pct
      retour:
        valeur: 0.14
        unite: part de la hausse brute des pensions revenant aux APU
        bareme: retour_prelevements_pensions
    explication: 'Indexer sur les salaires plutôt que sur les prix ajoute chaque année l''écart salaires-prix (≈ gains de
      productivité, 0,7 point) à toutes les pensions ; l''effet se cumule : 5 ans × 0,7 × 5,0 Md€ = 17,5 Md€ brut en 2032,
      net des prélèvements qui reviennent aux APU (CSG, CRDS, CASA, IR : × (1 − 0,14), retour_prelevements_pensions) = 15,05
      Md€. Bas : productivité à 1 % (ancienne hypothèse COR), 25 × 0,86 ; haut : régimes de base seuls (3,5 Md€ par point),
      12,25 × 0,86.'
  chiffrages_tiers:
  - auteur: LFI (contre-budget 2026, montant revendiqué)
    montant_md: 3.3
    url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    date: '2025-10-24'
    commentaire: Première année.
  effets_retour: 'CSG, CRDS, CASA et IR prélevés sur la hausse des pensions : déduits (convention commune, 14 %).'
  confiance: moyenne
  verification:
    statut: corrige
    par: verificateur-sonnet
    date: '2026-09-29'
    commentaire: 'Rejoué : 0,7 × 5 × 5,0 = 17,5. Droit constant respecté (pensions indexées sur les prix ; le coût est l''écart
      salaires-prix cumulé 2028-2032). Cohérent avec les 3,3 Md€ de LFI pour la première année (0,7 × 5,0 = 3,5). Réserves
      : coût brut, la CSG/CRDS/CASA et l''IR prélevés sur la hausse (retour certain d''environ 10 %) ne sont pas déduits,
