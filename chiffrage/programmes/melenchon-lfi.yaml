  libelle: Impôt plancher de 2 % sur le patrimoine des milliardaires (taxe Zucman)
  domaine: fiscalite
  citation:
    texte: Introduire une garantie d'impôt de 2 % sur le patrimoine des milliardaires, dite taxe Zucman
    url: https://web.archive.org/web/20260829203005/https://melenchon2027.fr/programme2025/livre/chapitre6/s5/
    date: 2025-01
    support: 'programme : L''Avenir en commun, édition 2025 (melenchon2027.fr, copie Wayback du 2026-08-29)'
  precision: partielle
  interpretation: 'Nouveauté de l''édition 2025. Le contre-budget 2026 élargit l''assiette aux patrimoines de plus de 100
    M€ (« Mettre en place la taxe Zucman de 2 % sur les patrimoines de plus de 100 millions d''euros : 20 milliards d''euros
    de recettes ») ; seuil à trancher. Interaction avec l''ISF (imputation). Seuil retenu : 100 M€ (contre-budget d''octobre
    2025, document le plus récent) ; L''AEC 2025 dit « milliardaires ». Risque constitutionnel (caractère confiscatoire) non
    chiffré. Le CAE n''a pas évalué la taxe Zucman elle-même : le coefficient de 0,26 porte sur une hausse de la fiscalité
    des hauts patrimoines dans le contexte scandinave, il est appliqué ici faute de mieux.'
  chiffrable: true
  nature: recette
  effet_solde_primaire:
    central: 6.3
    bas: 3.9
    haut: 24.2
    montee_en_charge: *id004
  calcul:
    formule: rendement_statique * part_conservee * f25
    parametres:
      rendement_statique:
        valeur: 20
        unite: Md€/an (2025, statique)
        source: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
        note: '« Mettre en place la taxe Zucman de 2 % sur les patrimoines de plus de 100 millions d''euros : 20 milliards
          d''euros de recettes » (p. 60) ; même ordre que l''estimation de G. Zucman rapportée par le Sénat (rapport n° 689,
          2025, https://www.senat.fr/rap/l24-689/l24-689_mono.html) : « l''imposition prévue toucherait entre 1 600 et 1 800
          foyers fiscaux. Elle pourrait, par ailleurs, générer entre 15 et 25 milliards d''euros » ; la DGFiP « ne pouvait simuler
          une telle imposition » (Assemblée, rapport n° 930)'
      part_conservee:
        valeur: 0.26
        unite: part de la recette mécanique effectivement perçue
        source: https://cae-eco.fr/static/pdf/Focus_118_emigration_fiscale_250725_v2.pdf
        note: 'CAE, Focus n° 118, juillet 2025 (Bach, Bozio et al.) : « les réponses comportementales (à la fois marge intensive
          et marge extensive) réduisent les recettes fiscales de l''imposition du patrimoine ou des revenus du capital de 74
          % par rapport à l''effet « mécanique » » (contexte scandinave, Jakobsen et al. 2024), soit 0,26 perçu par euro mécanique'
      f25:
        valeur: 1.2106
        unite: facteur PIB nominal 2025→2032
        bareme: facteur_pib_2025_2032
    explication: Recette statique revendiquée (20 Md€, patrimoines > 100 M€) × part conservée après optimisation, évasion
      et départs selon le CAE (0,26) × croissance du PIB nominal 2025→2032. Bas = estimation basse de G. Zucman (15 Md€) ×
      0,26, non projetée, pour couvrir la lecture « milliardaires seuls » de L'AEC 2025 et l'imputation de l'ISF rétabli.
      Haut = 20 Md€ projetés sans aucune réaction de l'assiette (thèse de G. Zucman, clause de maintien de l'impôt cinq ans
      après un départ).
  chiffrages_tiers:
  - auteur: Sénat, commission des finances (rapport n° 689 sur la proposition de loi Zucman, calcul d'Antoine Levy)
    montant_md: 2.5
    url: https://www.senat.fr/rap/l24-689/l24-689_mono.html
    date: '2025-06'
    commentaire: 'Si l''impôt sur les sociétés est pris en compte dans l''impôt plancher, « celui-ci n''atteindrait plus que
      2 ou 3 milliards d''euros » ; 15 à 25 Md€ selon G. Zucman. Tribune de sept économistes (Aghion et al., Le Monde, septembre
      2025, « 5 milliards » au plus) : source primaire payante, non relue.'
  effets_retour: 'Effets sur l''investissement et l''entrepreneuriat invoqués par les opposants (Aghion et al., Bergeaud)
    : non comptés.'
  confiance: faible
  verification:
    statut: ok
    par: passe-sources
    date: '2026-09-29'
    commentaire: 'Passe sources : coefficient 0,26 remonté à sa source primaire (CAE, Focus n° 118, juillet 2025, et non une
      note de septembre relayée par franceinfo) ; chiffrage tiers tiré de Wikipédia remplacé par le rapport du Sénat n° 689
      (2 à 3 Md€ si l''IS est imputé). Valeurs inchangées. Vérification précédente (verificateur-sonnet, ok) : Rejoué : 20 × 0,26 × 1,2106 = 6,3. Réaction de l''assiette documentée par le CAE (0,26, note de septembre
      2025, extrait retrouvé) ; 20 Md€ retrouvés dans le contre-budget. Le CAE n''a pas évalué la taxe Zucman elle-même :
      coefficient appliqué faute de mieux (signalé). Recoupement ISF (≈ 1 Md€ non déduit du central) et risque constitutionnel
      non chiffrés ; bornes 3,9 à 24,2 larges. Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée.'
