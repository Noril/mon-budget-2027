    bas: -1.21
    haut: 0.0
    montee_en_charge: *id004
  calcul:
    formule: -(point_taux_5_5 * baisse_points * f25) + recette_tva_luxe
    parametres:
      point_taux_5_5:
        valeur: 2.0
        unite: Md€ par point du taux de 5,5 % (2025, net)
        source: https://www.tresor.economie.gouv.fr/Articles/c462ac7f-76db-4c33-9bb3-dcc6886ed898/files/f4d0d1ac-fc61-4cf3-ab3f-094385b218bd
        note: 'DG Trésor, Trésor-Éco n° 371 (dérivation du barème tva_point_tous_taux : « 5,5 % → 2,0 »)'
