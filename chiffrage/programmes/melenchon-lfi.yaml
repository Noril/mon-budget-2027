annonce_candidat:
  cout_md: 81.7
  financement_md: 106.4
  texte: 'Budget rectificatif 2027 de LFI, présenté le 14 octobre 2026 par Jean-Luc Mélenchon et Éric Coquerel (document non
    publié en ligne ; montants rapportés par Public Sénat, LCP et France Épargne) : 106,4 Md€ de recettes supplémentaires,
    81,7 Md€ de dépenses nouvelles, « 25 milliards (…) attribués à la diminution de la dette » la première année ; retour
    à la retraite à 62 ans la première année (9 Md€), 60 ans « plus tard dans le mandat ». Postes cités : niches fiscales
    22 Md€, héritages 20, taxe Zucman 15, ISF climatique 10, flat tax 9, rachats d''actions et transactions financières 7,5
    ; rémunération des agents publics 17, action climatique 10, garantie d''autonomie des jeunes 9,5, retraites 9, indexation
    des pensions et prestations et APL +10 % 8, cantine 3,6, hôpitaux 3, assurance chômage 3, enseignants 0,5. Première année
    seulement : ces montants ne sont pas le régime de croisière 2032 et ne sont jamais additionnés aux mesures (montants revendiqués
    consignés mesure par mesure). Le chiffrage complet du programme est annoncé pour début 2027. Chiffrage précédent : contre-budget
    2026 du groupe parlementaire (24 octobre 2025 : recettes 183,6 Md€, dépenses 167,9 Md€).'
  url: https://www.publicsenat.fr/actualites/politique/presidentielle-2027-jean-luc-melenchon-table-sur-106-milliards-de-recettes-supplementaires-et-82-milliards-de-depenses-nouvelles-pour-2027
notes: 'Base : L''Avenir en commun, 5e édition, publiée le 6 novembre 2026 et adoptée à la convention du Bourget (7 novembre)
  : 1 069 mesures, en six parties (bifurcation écologique, économie, sécurité sociale, « goût du futur », 6e République, monde
  ordonné). Texte copié le 11/11/2026 dans un navigateur (le site renvoie 403 aux robots) ; les citations renvoient aux copies
  Wayback des 7-11 novembre et y ont été retrouvées (outils.liens.citation_presente, passe du 11/11/2026). Les pages « plans
  thématiques » et « plans d''investissement productif » ne font pas partie du livre ; deux plans d''investissement (BTP et
  logement, automobile) et un plan thématique (enseignement supérieur et recherche) sont lisibles sur la Wayback Machine,
  les autres ne sont pas encore publiés : le plan d''investissement global, dont le montant (200 Md€ dans l''AEC 2025) a disparu
  du livre, reste chiffré sur l''enveloppe de 2025 (point à valider). Passe AEC 2026 (11/11/2026) : citations des mesures
  reconduites mises à jour ; rechiffrées : garantie d''autonomie (seuil 1 337 €), violences sexistes et sexuelles (3 Md€),
  franchises (suppression totale), logements publics (plan BTP) ; retirées car absentes de l''édition 2026 : indexation des
  pensions sur les salaires (−13,2 Md€) et hausse de 0,25 point par an de la cotisation vieillesse (+19,8 Md€), ainsi que
  la baisse de TVA sur la première nécessité ; nouvelles : arrêt maladie à 100 % (−15,0 Md€), congé d''accueil de 20 semaines
  par parent (−7,2 Md€) et six mesures non chiffrables (quotient conjugal, successions sous 150 000 €, capitalisation, sécurité
  sociale funéraire, AME, kérosène). Le budget rectificatif 2027 (14/10/2026) est traité comme le contre-budget 2026 : document
  du parti, montants de première année consignés dans chiffrages_tiers comme montants revendiqués, jamais additionnés. Les
  mesures tirées du contre-budget 2026 et absentes du livre (sport, Dutreil, dividendes, exonérations, heures supplémentaires,
  accise électricité, TVA transports, versement mobilité) sont conservées. Ancienne base et historique : AEC 2025 (831 mesures,
  copies Wayback d''août-septembre 2026) ; contre-budget 2026 du groupe LFI (octobre 2025) ; chiffrages de l''Institut Montaigne
  sur l''AEC 2022, relus via la Wayback Machine (base de chaque montant indiquée mesure par mesure). Collecte précédente :
  11/10/2026.'
mesures:
- id: retraite-60-ans
  libelle: Retour de l'âge légal à 60 ans avec 40 annuités (abrogation de la réforme 2023)
  domaine: retraites
  citation:
    texte: Abroger la réforme Macron passant l'âge de départ à la retraite à 64 ans, puis abaisser l'âge de départ jusqu'à
      restaurer le droit à la retraite à 60 ans à taux plein pour 40 annuités de cotisations
    url: https://web.archive.org/web/20261109203855/https://melenchon2027.fr/programme/livre/mettre-en-securite-sociale/chapitre1
    date: '2026-11-06'
    support: 'programme : L''Avenir en commun, 5e édition (6 novembre 2026), melenchon2027.fr, copie Wayback du 2026-11-09'
  precision: precise
  interpretation: 'Engagement déjà présent dans L''AEC 2022, reconfirmé par les éditions 2025 et 2026 (5e édition, 6 novembre
    2026). Reconfirmé en campagne : « le plus vite possible » (LCP, 23/09/2026) ; page d''accueil LFI (« La retraite à 60
    ans »). Lecture retenue : âge d''ouverture des droits 60 ans et durée d''assurance ramenée à 40 ans (160 trimestres) pour
    le taux plein, par rapport à la législation au 1/1/2027 (réforme 2023, éventuellement suspendue). Montant revendiqué par
    LFI dans le contre-budget 2026 (octobre 2025, première année, avant montée en charge) : 10,3 Md€ (« Abrogation de la réforme
    des retraites, retour à 60 ans et 40 annuités », « appelée à monter en charge »). Doubles comptes : la suppression de
    la décote n''est pas ajoutée (voir suppression-decote) ; la pension minimale au SMIC et la hausse de cotisation vieillesse
    sont chiffrées à part. Édition 2026 : « puis abaisser l''âge de départ jusqu''à restaurer » la retraite à 60 ans, soit
    un retour par étapes. Le budget rectificatif 2027 de LFI (14/10/2026) ne chiffre que le retour à 62 ans (9 Md€ la première
    année), les 60 ans étant promis « plus tard dans le mandat » (Public Sénat) : la montée en charge retenue (0,35 en 2028
    → 1 en 2032) suppose les 60 ans atteints en 2032 ; un calendrier plus lent ne réduirait que les années intermédiaires,
    pas le régime de croisière.'
  chiffrable: true
  nature: depense
  effet_solde_primaire:
    central: -85.55
    bas: -92.0
    haut: -43.15
    montee_en_charge:
      '2027': 0
      '2028': 0.35
      '2029': 0.55
      '2030': 0.75
      '2031': 0.9
      '2032': 1
  calcul:
    formule: -(retour_62 + age_60 + ecart_duree * duree_1an)
    parametres:
      retour_62:
        valeur: 29.1
        unite: Md€ courants par an (solde des APU), en 2032
        bareme: retraites_retour_62_ans_2032_apu
      age_60:
        valeur: 37.7
        unite: Md€ courants 2032 par an
        bareme: retraites_age_60_depuis_62_apu
      ecart_duree:
        valeur: 2.5
        unite: années de durée d'assurance
        source: https://solidarites.gouv.fr/loi-de-financement-de-la-securite-sociale-2026-les-mesures-phares
        note: 170 trimestres (génération 1964, droit gelé) ramenés à 160 (40 annuités) ; la hausse vers 172 du calendrier
          Touraine est déjà annulée dans retraites_retour_62_ans_2032_apu
      duree_1an:
        valeur: 7.5
        unite: Md€ courants 2032 par an et par année de durée
        bareme: retraites_duree_assurance_1_an_apu
        note: valeur 2035, majorant pour 2032 selon le barème
    explication: 'Coût par rapport au droit voté (suspension jusqu''au 1/1/2028 puis reprise vers 64 ans), sur le solde de
      l''ensemble des administrations publiques (convention commune n° 4 : système de retraite, plus prélèvements des seniors
      qui cessent de travailler, moins effets de bord sur les autres prestations) : annulation des mesures d''âge de 2023
      (29,1 Md€ en 2032), passage de 62 à 60 ans (37,7 Md€) et durée ramenée à 40 annuités (2,5 ans × 7,5 Md€) = 85,55. Bas
      = hauts des barèmes APU (31,2 + 40,3 + 2,5 × 8,2 = 92,0) ; haut = même calcul au périmètre du seul système de retraite
      (13,9 + 18 + 2,5 × 4,5 = 43,15, ancien central). Montée en charge : deux générations par an environ à partir de 2028.'
  chiffrages_tiers:
  - auteur: Institut Montaigne (présidentielle 2022, mesure identique de L'AEC 2022)
    montant_md: 85.8
    url: https://web.archive.org/web/20260718133710/https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/retablir-la-retraite-a-60-ans-apres-40-ans-annees-de-cotisation/
    date: '2022'
    commentaire: 'Montants en euros 2027 (« les chiffrages sont construits par hypothèse à horizon 2027 et cette option de
      présentation permet d''avoir tous les chiffres en € de 2027 »). Scénario médian 85,8 Md€ (2,86 points de PIB : mesures
      d''âge, 10 meilleures années, trimestres RSA, MICO à 1 400 €) ; bas : « un retour sur ces mesures d''âges représenterait
      un coût de 1,2 point de PIB à horizon 2027, soit 36 Md€ » (par rapport au droit de 2022, avant la réforme 2023) ; haut
      112,8 Md€. Contre-chiffrage de l''équipe de campagne 2022 : « Retraites à 60 ans à 40 annuités : 27 Md€ » (71,5 Md€
      pour l''ensemble du volet retraites).'
  - auteur: LFI (contre-budget 2026, montant revendiqué)
    montant_md: 10.3
    url: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    date: '2025-10-24'
    commentaire: Première année seulement, « appelée à monter en charge ».
  - auteur: FIPECO (coût toutes APU, effets d'activité compris)
    montant_md: 33.0
    url: https://www.fipeco.fr/commentaire/Avancer%20ou%20reculer%20l'%C3%A2ge%20de%20d%C3%A9part%20en%20retraite
    date: '2024-06-25'
    commentaire: 'Effet de deux ans d''âge sur l''ensemble des APU, 0,9 point de PIB (× 3 621 Md€ en 2032), contre 0,5 point
      pour les seuls régimes de retraite : même périmètre que notre central depuis le 30/09 (convention commune n° 4), notre
      chiffrage APU de la seule annulation de 2023 (29,1 Md€) en est proche.'
  - auteur: LFI (budget rectificatif 2027, 14/10/2026, montant revendiqué rapporté par la presse)
    montant_md: 9.0
    url: https://www.publicsenat.fr/actualites/politique/presidentielle-2027-jean-luc-melenchon-table-sur-106-milliards-de-recettes-supplementaires-et-82-milliards-de-depenses-nouvelles-pour-2027
    date: '2026-10-14'
    commentaire: Retour à 62 ans seul (« suppression de la réforme Borne ») ; 60 ans sans coût chiffré. Document LFI non publié
      ; première année, avant montée en charge.
  effets_retour: 'Périmètre APU compté depuis le 30/09 (convention commune n° 4) : les prélèvements que ne paient plus les
    seniors qui cessent de travailler et les effets de bord sur les autres prestations sont dans le montant. Restent non comptés
    les effets de bouclage macroéconomique. LFI invoque des effets de relance (multiplicateurs FR-BDF, « au bout de cinq ans,
    on sera en dessous des 3 % de déficit ») : non comptés (règle 3).'
  confiance: moyenne
  verification:
    statut: corrige
    par: perimetre-apu
    date: '2026-09-30'
    commentaire: 'Périmètre APU (30/09) : barèmes _apu (retour à 62 ans 29,1 ; 62 → 60 ans 37,7 ; durée 7,4 par an) ; central
      −42,9 → −85,3 ; bas −62,8 → −91,75 (hauts des barèmes APU) ; haut −35,6 → −42,9 (périmètre du système). Passe sources
      : recouvrement des trois composantes examiné. (1) retraites_retour_62_ans_2032 (Cnav, tableau du rapport AN n° 613)
      annule les mesures d''âge de 2023 et l''accélération de la durée : on revient à 62 ans et au calendrier Touraine ; (2)
      retraites_age_60_depuis_62 (FIPECO, 0,5 point de PIB pour deux ans d''âge) est mesuré à durée requise inchangée ; (3)
      l''écart de durée (170 → 160 trimestres) est mesuré à âge inchangé (Cour des comptes, 3,9 Md€ en 2035 pour un an). Les
      composantes portent sur des paramètres distincts ; leur interaction est positive (à 60 ans, peu d''assurés ont 172 trimestres
      : l''effet âge FIPECO est bridé par la durée, que la mesure abaisse), donc la somme est plutôt un minorant qu''un double
      compte. Les carrières longues partent déjà avant 62 ans et ne sont pas dans l''effet âge. Recoupement : l''Institut
      Montaigne chiffrait le seul retour à 60 ans et 160 trimestres à 1,2 point de PIB à horizon 2027 par rapport au droit
      de 2022, avant la réforme 2023 ; notre âge + durée (18 + 11 = 29 Md€) vaut 0,8 point du PIB 2032 : central prudent,
      sans recouvrement. Central inchangé. Vérification précédente (verificateur-sonnet, corrige) : Rejoué : 13,9 (retour
      62 ans, Cnav 15,7 moins suspension 1,8) + 18 (0,5 pt de PIB, FIPECO) + 2,5 × 4,4 (durée) = 42,9. Cohérent avec le droit
      du 29/09/2026 (170 trimestres gelés, reprise en 2028). Recouvrement partiel entre les composantes : l''effet âge (FIPECO,
      durée constante) et l''effet durée (Cour des comptes, 4,4 majorant 2035) se chevauchent pour les carrières longues partant
      à 60 ans (l''âge à 60 ne joue que pour ceux qui ont 160 trimestres), ; l''écart de durée est pris de 170 à 160 trimestres
      alors que le calendrier Touraine en 2032 est proche de 171 (≈ +1 Md€ ignoré). Ces deux effets de sens opposé restent
      dans la fourchette. Décote non ajoutée (pas de double compte), Mico et trimestres RSA chiffrés à part. Borne basse (-75)
      inclut des effets d''activité (hors règle 3), à lire comme borne extrême. Montaigne 2022 (36 à 113 Md€, référence avant
      la réforme 2023, avec minimum et RSA) : notre central est inférieur à son bas projeté (≈ 49 Md€ en 2032) car nous excluons
      décote, minimum et RSA (chiffrés à part ou non comptés). Barèmes retraites_retour_62_ans_2032 et retraites_age_60_depuis_62
      suspects (voir rapport). Recalé sur les conventions communes du 29/09 : bas −75 → −60 (hauts des barèmes sur le périmètre
      du système de retraite ; le coût toutes APU de FIPECO, 33 Md€ pour 62 → 60 ans, passe en effets_retour et chiffrages_tiers)
      ; central inchangé (−42,9). Recalé sur les barèmes sourcés du 29/09 : bornes calées sur les bornes des barèmes retraites_retour_62_ans_2032
      (11,4-15,8) et retraites_age_60_depuis_62 (13,2-25) : central −42,9 inchangé, bas −60 → −62,8, haut −32,9 → −35,6. Durée
      : barème des baisses retraites_duree_assurance_1_an (4,4, haut 8,8), correct. Recalé sur le FMI WEO d''octobre 2026
      : central −85,3 → −85,55 (bas −91,75 → −92, haut −42,9 → −43,15).'
