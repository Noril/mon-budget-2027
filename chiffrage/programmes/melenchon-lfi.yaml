      haut. CFE et TFPB non comptées (compensations). Recalé sur les conventions communes du 29/09 : paramètres recopiés remplacés
      par le renvoi au barème facteur_pib_2025_2032 ; valeur inchangée. Recalé sur le FMI WEO d''octobre 2026 : central 4,48
      → 4,51 (bornes inchangées).'
