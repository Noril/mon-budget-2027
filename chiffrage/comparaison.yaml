    ecarts: >-
      Aucun chiffrage indépendant d'un programme de Raphaël Glucksmann ou de Place publique (non candidat en 2022) ; les
      seules références portent sur le programme de coalition du NFP en 2024, que Place publique a signé. Notre solde
      central (−70,8 Md€ en 2032) porte sur 14 mesures chiffrées sur 48 recensées, faute de programme publié : baisse de
      CSG, indexation du point d'indice, abrogation de la réforme des retraites de 2023, aide au développement à 0,7 %.
      Les mesures du NFP absentes des annonces de 2026 (retraite à 60 ans, blocage des prix) n'y figurent pas.
  - programme: zemmour-reconquete
    annonce:
      texte: >-
        Aucun chiffrage global publié par Éric Zemmour. Sarah Knafo (Reconquête) : « 140 milliards d'économies par an. Au
        minimum. […] 24 mesures : tout est listé, chiffré, sourcé », finançant la suppression de la CSG sur les revenus
        d'activité, des droits de succession et des impôts de production. Pas de coût total publié pour ces baisses. En
        2022, le candidat affichait un solde de +20 Md€.
      source: https://www.budget2026.fr/
    references:
      - auteur: Fondation IFRAP
        objet: "programme présidentiel 2022 d'Éric Zemmour, solde en 2027"
        montant_md: -5
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/macron-le-pen-zemmour-melenchon-le-cout-de-leur-programme-pour-les-finances-publiques
      - auteur: Institut Montaigne
        objet: "programme présidentiel 2022 d'Éric Zemmour"
        montant_md: -145.8
        annee_euros: 2022
        source: https://web.archive.org/web/2022/https://www.institutmontaigne.org/presidentielle-2022/synthese-des-chiffrages/
    ecarts: >-
      Notre solde central est de −100,1 Md€ en 2032. Les références portent sur le programme de 2022, qui ne comportait
      pas la suppression de la CSG sur les revenus d'activité (−112,5 Md€ chez nous). Les économies ciblées de 2026 sont
      comptées comme annoncées dans la limite du budget visé (non-remplacement de 800 000 départs, prestations réservées
      aux Français…) ; l'enveloppe de 140 Md€, au-delà de ces mesures, compte pour zéro. Le −5 Md€ de l'IFRAP (2027)
      inclut 41 Md€ de recettes liées à la reprise de l'activité, effet que nous ne comptons pas, et l'économie du report
      de l'âge de la retraite à 64 ans, déjà inscrit dans la législation de référence de 2027.
