        source: https://www.ifrap.org/budget-et-fiscalite/nouveau-front-populaire-rassemblement-national-et-ensemble-pour-la-republique-le-chiffrage-des-programmes
      - auteur: Fondation IFRAP
        objet: "programme présidentiel 2022 de Yannick Jadot (EELV), solde en 2027"
        montant_md: -33
