    ecarts: >-
      Les références portent sur d'autres programmes et un autre candidat (Emmanuel Macron en 2022, la coalition
      Ensemble en 2024). L'essentiel de notre montant vient d'une mesure de 2026 absente de ces programmes : la
      suppression de la part salariale de la cotisation vieillesse (« équivalent d'un 13ᵉ mois », environ 41 Md€ par
      an). L'enveloppe de 120 à 150 Md€ d'économies, sans mesures détaillées, n'est pas comptée, faute de mesure à
      chiffrer. Les soldes positifs de l'IFRAP (+27 Md€ en 2022, +4 Md€ en 2024) incluent des recettes et économies
      liées à la reprise de l'activité (2022), effets que nous ne comptons pas. Ces références sont en euros de 2022
      ou 2024 ou à l'horizon 2027, le nôtre en euros 2032.
  - programme: philippe-horizons
    annonce:
      texte: >-
        Pas de chiffrage global publié au 30 septembre 2026. Objectif : « ramener le déficit de plus de 5 % à 2 % du PIB
        en fin de quinquennat » ; « deal fiscal » présenté comme neutre (50 Md€ de baisse d'impôts de production contre
        50 Md€ d'aides aux entreprises en moins).
      source: https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere
    references:
      - auteur: Institut Montaigne
        objet: "programme d'Ensemble pour la République (Renaissance, MoDem, Horizons), législatives 2024"
        montant_md: -20.6
        annee_euros: 2024
        source: https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/ensemble-majorite-presidentielle/synthese/
      - auteur: Fondation IFRAP
        objet: "programme d'Ensemble pour la République, législatives 2024, écart au solde 2027 du programme de stabilité"
        montant_md: 4
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/nouveau-front-populaire-rassemblement-national-et-ensemble-pour-la-republique-le-chiffrage-des-programmes
    ecarts: >-
      Aucun chiffrage indépendant d'un programme propre à Horizons ou à Édouard Philippe ; les seules références
      portent sur le programme commun d'Ensemble en 2024, dont Horizons était partie, et non sur le programme 2027.
      Notre solde central résulte surtout du « deal fiscal » : la baisse de 50 Md€ d'impôts de production (environ −45
      Md€ nets) et la réduction de 50 Md€ des aides aux entreprises, comptée comme annoncée (environ +55 Md€) car
      ciblée sur un périmètre nommé mais sans liste d'aides. Cette économie est marquée comme non détaillée : la
      lecture prudente la compte pour moitié, ce qui rend le solde nettement négatif. Si elle n'est pas réalisée du
      tout, le solde tombe vers −88 Md€ (borne basse).
  - programme: retailleau-lr
    annonce:
      texte: >-
        Pas de chiffrage global publié. « Je m'engage parallèlement sur un plan d'économies de 120 milliards d'euros à
        l'horizon 2032 » (15 avril 2026) ; 40 Md€ de baisses de prélèvements pour les entreprises présentés comme
        « identifié, financé » ; retraites : « 40 milliards d'économies en cumulé sur cinq ans ».
      source: https://contrepoints.org/flat-tax-aides-aux-entreprises-assurances-sociales-calendrier-des-reformes-bruno-retailleau-repond-a-nos-questions/
    references:
      - auteur: Fondation IFRAP
        objet: "programme présidentiel 2022 de Valérie Pécresse (Les Républicains), solde en 2027"
        montant_md: 30
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/macron-le-pen-zemmour-melenchon-le-cout-de-leur-programme-pour-les-finances-publiques
      - auteur: Institut Montaigne
        objet: "programme présidentiel 2022 de Valérie Pécresse (Les Républicains)"
        montant_md: -35.1
        annee_euros: 2022
        source: https://web.archive.org/web/2022/https://www.institutmontaigne.org/presidentielle-2022/synthese-des-chiffrages/
    ecarts: >-
      Aucun chiffrage indépendant d'un programme de Bruno Retailleau ; les références portent sur le programme 2022 de
      Valérie Pécresse pour le même parti, qui comportait la retraite à 65 ans et une réduction des effectifs publics.
      Les retraites sont chiffrées au périmètre de l'ensemble des administrations publiques, comme les chiffrages
      globaux : le report à 63 ans avec taux plein à 65 ans rapporte environ 9 Md€ par an dans notre chiffrage. Les
      baisses de cotisations (environ 18 Md€) et la restitution de pouvoir d'achat aux salariés (environ 15 Md€) sont
      comptées, tandis que l'enveloppe de 120 Md€ d'économies n'est pas comptée ; les économies ciblées sans mesure
      détaillée sont comptées pour moitié dans la lecture prudente. Le solde positif de l'IFRAP (+30 Md€ en 2027)
      compte comme recette la lutte contre la fraude annoncée par la candidate de 2022.
  - programme: tondelier-ecologistes
