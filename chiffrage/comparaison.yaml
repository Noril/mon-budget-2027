      texte: >-
        Le programme de juillet 2026 (557 mesures) ne comporte ni chiffrage global ni tableau de financement. Référence la
        plus complète du parti : le contre-budget 2026 (« plan de sortie de crise », septembre 2025), +28,5 Md€ de recettes,
        −16,6 Md€ de dépenses, déficit ramené à 3,7 % du PIB en 2030.
      source: https://www.publicsenat.fr/actualites/politique/les-ecologistes-presentent-leur-plan-de-sortie-de-crise-et-preparent-la-cohabitation
