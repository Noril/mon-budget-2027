    ecarts: >-
      Notre solde central est de −25,1 Md€ en 2032, sur le programme écologiste de 2026. Les références NFP portent sur
      un programme de coalition comprenant des mesures absentes du programme 2026 (retraite à 60 ans, SMIC à 1 600 €,
      blocage des prix), alors que ce dernier prévoit le retour à 62 ans et de nombreuses recettes chiffrées (rationalisation des
      exonérations de cotisations, CSG progressive, successions). L'IFRAP (Jadot 2022) porte sur un autre programme et
      sur le solde de 2027. Une partie des mesures 2026 trop vagues pour être chiffrées reçoit une estimation indicative
      (−59,8 Md€) affichée à part et non incluse dans notre solde.
  - programme: glucksmann-place-publique
    annonce:
      texte: >-
        Aucun chiffrage global publié au 30 septembre 2026, le programme de mandat n'étant pas publié. Chiffrages partiels :
        baisse de CSG d'environ 15 Md€ financée par 15 Md€ de fiscalité des successions ; engagement de ne financer la
        hausse des salaires ni « par la casse du modèle social », ni « par l'aggravation de la dette ».
      source: https://www.franceinfo.fr/replay-radio/le-vrai-du-faux/augmenter-les-salaires-en-taxant-les-plus-gros-heritages-la-proposition-de-raphael-glucksmann-est-elle-realiste_8076284.html
