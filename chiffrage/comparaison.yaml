      publiques, identique à celui des chiffrages globaux. Les mesures du NFP absentes des annonces de 2026 (retraite
      à 60 ans, blocage des prix) n'y figurent pas. Les références sont en euros 2024 ou à l'horizon 2027, le nôtre en
      euros 2032.
  - programme: zemmour-reconquete
    annonce:
      texte: >-
        Aucun chiffrage global publié par Éric Zemmour. Sarah Knafo (Reconquête) : « 140 milliards d'économies par an. Au
        minimum. […] 24 mesures : tout est listé, chiffré, sourcé », finançant la suppression de la CSG sur les revenus
        d'activité, des droits de succession et des impôts de production. Pas de coût total publié pour ces baisses. En
        2022, le candidat affichait un solde de +20 Md€.
      source: https://www.budget2026.fr/
    references:
      - auteur: Fondation IFRAP
        objet: "programme présidentiel 2022 d'Éric Zemmour, solde en 2027"
        montant_md: -5
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/macron-le-pen-zemmour-melenchon-le-cout-de-leur-programme-pour-les-finances-publiques
      - auteur: Institut Montaigne
        objet: "programme présidentiel 2022 d'Éric Zemmour"
        montant_md: -145.8
        annee_euros: 2022
        source: https://web.archive.org/web/2022/https://www.institutmontaigne.org/presidentielle-2022/synthese-des-chiffrages/
    ecarts: >-
      Les références portent sur le programme de 2022, qui ne comportait pas la suppression de la CSG sur les revenus
      d'activité (environ −112 Md€ par an chez nous). Les économies ciblées de 2026 sont comptées comme annoncées dans
      la limite du budget visé (non-remplacement de 800 000 départs, prestations réservées aux Français…) ; celles qui
      n'ont pas de mesure détaillée sont comptées pour moitié dans la lecture prudente, et l'enveloppe de 140 Md€, au-
      delà de ces mesures, n'est pas comptée. Le −5 Md€ de l'IFRAP (2027) inclut 41 Md€ de recettes liées à la reprise
      de l'activité, effet que nous ne comptons pas, et l'économie du report de l'âge de la retraite à 64 ans, déjà
      inscrit dans la législation de référence de 2027. Nous comptons la réaction de l'assiette des impôts.
