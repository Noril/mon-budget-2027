      Notre solde central est de −18,7 Md€ en 2032 : les baisses de cotisations et la restitution de pouvoir d'achat aux
      salariés sont comptées, tandis que l'enveloppe de 120 Md€ d'économies, sans mesures détaillées, compte pour zéro.
      Le solde positif de l'IFRAP (+30 Md€ en 2027) compte comme recette la lutte contre la fraude annoncée par la
      candidate de 2022.
