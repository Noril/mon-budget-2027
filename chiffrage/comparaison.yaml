# Comparaison avec les autres chiffrages globaux (page publique).
# montant_md : effet sur le solde public, négatif = déficit en plus, Md€ par an.
# annee_euros : euros (et horizon) du chiffrage cité.
# Notre solde central cité dans « ecarts » : régime de croisière 2032, euros courants 2032, calcul du 30 septembre 2026.
# Conversion indicative d'un montant en euros 2032 à part de PIB constante : ×1,36 depuis 2022, ×1,23 depuis 2024,
# ×1,16 depuis 2027 (PIB nominal 2032 de 3 621 Md€, barèmes facteur_pib_*).
note: >-
  Aucun organisme indépendant n'a publié, au 30 septembre 2026, de chiffrage global des programmes présidentiels 2027 :
  les références disponibles portent sur les programmes de 2022 (présidentielle) ou de 2024 (législatives), souvent
  différents de ceux de 2027, et sont exprimées en euros de leur année ou à l'horizon 2027, quand nous chiffrons le
  régime de croisière 2032 en euros de 2032. Les écarts tiennent aussi au périmètre (nous comptons l'ensemble des
  administrations publiques, retraites comprises), au sort des économies annoncées sans mesure détaillée (enveloppes
  comptées à zéro dans notre solde central), aux effets comptés (réaction de l'assiette des impôts oui ; croissance et
  « recettes liées à la reprise de l'activité » non) et aux mesures retenues par chacun. Aucun montant ci-dessous n'est
  directement comparable au nôtre sans ces corrections.
candidats:
  - programme: melenchon-lfi
    annonce:
      texte: >-
        Pas de chiffrage global du programme 2027 au 30 septembre 2026 (nouvelle version de L'Avenir en commun et son
        chiffrage annoncés pour le 6 novembre 2026). Dernier chiffrage d'ensemble du parti : contre-budget 2026 du groupe
        LFI (octobre 2025), 167,9 Md€ de dépenses et 183,6 Md€ de recettes, solde revendiqué +26,7 Md€ la première année.
        En 2022, le candidat affichait 250 Md€ de dépenses et 267 Md€ de recettes (+17 Md€).
      source: https://lafranceinsoumise.fr/wp-content/uploads/2025/10/Budget-2026_LFI_web_pages.pdf
    references:
      - auteur: Institut Montaigne
        objet: "programme du Nouveau Front populaire, législatives 2024 (coalition LFI, PS, Les Écologistes, PCF, Place publique)"
        montant_md: -179
        annee_euros: 2024
        source: https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/nouveau-front-populaire/synthese/
      - auteur: Fondation IFRAP
        objet: "programme du Nouveau Front populaire, législatives 2024, écart au solde 2027 du programme de stabilité"
        montant_md: -160
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/nouveau-front-populaire-rassemblement-national-et-ensemble-pour-la-republique-le-chiffrage-des-programmes
      - auteur: Fondation IFRAP
        objet: "programme présidentiel 2022 (L'Avenir en commun 2022), solde en 2027"
        montant_md: -66
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/macron-le-pen-zemmour-melenchon-le-cout-de-leur-programme-pour-les-finances-publiques
      - auteur: Institut Montaigne
        objet: "programme présidentiel 2022 (L'Avenir en commun 2022)"
        montant_md: -218.9
        annee_euros: 2022
        source: https://web.archive.org/web/2022/https://www.institutmontaigne.org/presidentielle-2022/synthese-des-chiffrages/
    ecarts: >-
      Notre solde central est de −305,4 Md€ en 2032, sur L'Avenir en commun 2025 et les annonces de campagne 2026. Porté
      en euros 2032, le −218,9 Md€ de l'Institut Montaigne (2022) représente environ −298 Md€ et le −179 Md€ du NFP
      (2024) environ −221 Md€ ; le programme chiffré diffère : SMIC à 1 700 € net au lieu de 1 400 €, échelle mobile des
      salaires, plan d'investissement de 200 Md€ (−40 Md€ par an chez nous), garantie d'autonomie (−43,3 Md€ chez nous,
      −12,3 Md€ chez Montaigne en 2022). Les chiffrages de l'IFRAP (−66 Md€ en 2022, −160 Md€ en 2024) portent sur le
      solde de 2027, mesures en cours de montée en charge ; en 2022, l'IFRAP retenait +208 Md€ d'impôts et cotisations
      nouveaux ; nous comptons en outre la réaction de l'assiette des impôts nouveaux.
  - programme: le-pen-rn
    annonce:
      texte: >-
        « Nous présenterons juste avant le débat budgétaire notre trajectoire de rétablissement des finances publiques avec
        125 milliards d'euros d'économies » (débat du Medef, 27 août 2026 ; document non publié au 30 septembre 2026).
        Réforme des retraites chiffrée par la candidate à « 9 milliards d'euros ». Dernier chiffrage complet du parti :
        contre-budget 2026 du groupe RN (octobre 2025), 35,6 Md€ d'amélioration nette du solde revendiquée.
      source: https://www.epochtimes.fr/marine-le-pen-promet-125-milliards-deuros-deconomies-et-defend-une-retraite-a-60-ou-62-ans-3335415.html
    references:
      - auteur: Institut Montaigne
        objet: "programme du Rassemblement national, législatives 2024"
        montant_md: -71
        annee_euros: 2024
        source: https://web.archive.org/web/2024/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/synthese/
      - auteur: Fondation IFRAP
        objet: "programme du Rassemblement national, législatives 2024, écart au solde 2027 du programme de stabilité"
        montant_md: -14.5
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/nouveau-front-populaire-rassemblement-national-et-ensemble-pour-la-republique-le-chiffrage-des-programmes
      - auteur: Fondation IFRAP
        objet: "programme présidentiel 2022 de Marine Le Pen, solde en 2027"
        montant_md: -29
        annee_euros: 2027
        source: https://www.ifrap.org/budget-et-fiscalite/macron-le-pen-zemmour-melenchon-le-cout-de-leur-programme-pour-les-finances-publiques
      - auteur: Institut Montaigne
        objet: "programme présidentiel 2022 de Marine Le Pen"
        montant_md: -101.8
        annee_euros: 2022
        source: https://web.archive.org/web/2022/https://www.institutmontaigne.org/presidentielle-2022/synthese-des-chiffrages/
    ecarts: >-
      Notre solde central est de −39,9 Md€ en 2032. Le −71 Md€ de l'Institut Montaigne (2024, environ −88 Md€ en euros
      2032) retient des économies de 14 Md€ ; nous comptons en plus des économies ciblées du programme 2026 appliquées
      comme annoncées dans la limite du budget visé (agences −20 %, prestations réservées après cinq ans de travail,
      dotations aux régions), mais aussi des baisses d'impôts absentes en 2024 (CFE, C3S), et nous chiffrons le volet
      retraites avec nos barèmes communs, moins cher que la lecture de Montaigne (retour complet aux règles d'avant 2003
      pour les carrières longues). L'IFRAP (−14,5 Md€) mesure le solde de 2027, avant l'essentiel de la montée en charge
      des retraites. Le plan de « 125 milliards d'euros d'économies », sans mesure publiée, compte pour zéro dans notre
      solde central. Le programme 2022 (−101,8 Md€ chez Montaigne) comportait des mesures abandonnées depuis, dont
      l'exonération d'impôt sur le revenu des moins de 30 ans et la nationalisation des autoroutes.
  - programme: attal-renaissance
    annonce:
      texte: >-
        « Toutes les propositions que nous formulerons durant la campagne seront financées » ; « 150 milliards d'euros
        d'économies, dont les deux tiers sur les dépenses sociales, avec un retour du déficit public sous les 3 % du PIB
        avant la fin du mandat » (23 septembre 2026). Aucune hausse d'impôt. Pas de coût total publié.
      source: https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises
    references:
