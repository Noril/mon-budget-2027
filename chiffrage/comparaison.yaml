    ecarts: >-
      Notre chiffrage porte sur le programme écologiste de 2026, en euros 2032. Les références NFP portent sur un
      programme de coalition comprenant des mesures absentes du programme 2026 (retraite à 60 ans, SMIC à 1 600 €,
      blocage des prix), alors que ce dernier prévoit le retour à 62 ans (environ 29 Md€ par an, au périmètre de
      l'ensemble des administrations publiques) et de nombreuses recettes chiffrées (rationalisation des exonérations
      de cotisations, CSG progressive, successions). Nous comptons la réaction de l'assiette des impôts nouveaux.
      L'IFRAP (Jadot 2022) porte sur un autre programme et sur le solde de 2027. Une partie des mesures 2026 trop
      vagues pour être chiffrées reçoit une estimation indicative (environ −60 Md€) affichée à part et non incluse
      dans notre solde.
  - programme: glucksmann-place-publique
