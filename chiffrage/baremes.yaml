  derivation: >
    Dépense 2023 : 4,1 Md€ (DREES), soit 484 € par mois et par allocataire en moyenne (allocation différentielle).
    752 800 allocataires fin 2024 (723 000 fin 2023). Montant maximal 2026 : 1 043,59 € par mois pour une personne
    seule, 1 620,18 € pour un couple. Coût d'une hausse de x € par mois du plafond, à effectifs inchangés :
    ≈ x × 12 × 752 800 ≈ 0,09 Md€ par tranche de 10 € (majorant pour les couples, minorant car une hausse du
