- id: ttf_rendement
  libelle: "Rendement de la taxe sur les transactions financières (0,4 % sur les acquisitions d'actions)"
  valeur: 2.5
  bas: 1.9
  haut: 2.7
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "Cour des comptes, « La taxe sur les transactions financières », observations définitives, 10 septembre 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-09/20260910_Taxe-sur-les-transactions-financieres.pdf
      date: "2026-09-10"
      extrait: "Le taux de la taxe, initialement fixé à 0, 2 %, a été relevé à 0,3 % en janvier 2017, puis à 0,4 % en avril 2025. Entre 2017 et 2024, la taxe a produit 9, 1 Md€ de recettes cumulées. Son produit s’est élevé à 2,5 Md€ en 2025, en nette hausse par rapport à 2024 (1,9 Md€)."
    - titre: "Cour des comptes, même rapport (produit exact de la composante principale)"
      url: https://www.ccomptes.fr/sites/default/files/2026-09/20260910_Taxe-sur-les-transactions-financieres.pdf
      date: "2026-09-10"
      extrait: "En conséquence, son rendement, qui représente la quasi intégralité du produit de la taxe , a progressé pour atteindre 2 526 M€ en 2025."
  derivation: >
    Valeur : produit 2025, 2,53 Md€ (Cour des comptes), arrondi à 2,5. Bas : produit 2024 au taux de 0,3 %
    (1,9 Md€, même rapport), qui figure aussi une année boursière moins favorable. Haut : 2025 en année pleine au
    taux de 0,4 % (le premier trimestre 2025 était encore taxé à 0,3 %) : 2,526 / (0,25 × 0,3/0,4 + 0,75) ≈
    2,7 Md€. Un dixième de point supplémentaire rapporte au plus ≈ 0,65 Md€ (2,6 / 4), moins en pratique
    (réaction des volumes).
  limites: >
    Recette sensible à la conjoncture boursière (volumes et cours des 121 valeurs taxées en 2025). La Cour relève
    un écart de liquidation cumulé de 2,2 Md€ entre 2017 et 2025 entre taxe attendue et montants recouvrés. Les
    opérations intrajournalières ne sont pas taxées ; leur extension n'a pas de chiffrage administratif.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : source secondaire (dépêche AFP) et bas tiré d'un exposé d'amendement. Remplacés par le rapport de la
      Cour des comptes du 10 septembre 2026 (PDF relu) : produit 2 526 M€ en 2025, 1,9 Md€ en 2024 au taux de 0,3 %.
      Valeur 2,5 inchangée ; bas 2,2 → 1,9 ; haut ajouté 2,7 (2025 en année pleine à 0,4 %). Signalement des Voies
      et moyens (1,33 Md€ en 2024) : c'est la part nette revenant au budget de l'État, après affectation au fonds de
      solidarité pour le développement ; la NEB de la Cour (1,3 en 2024, 2,5 en 2025 après budgétisation) le
      confirme. Le produit total (1,9) est retenu. Les 2,63 Md€ prévus pour 2026 à 0,4 % sont cohérents avec le
      haut.

