- id: psr_ue
  libelle: Contribution française au budget de l'Union européenne (prélèvement sur recettes, PSR-UE)
  valeur: 28.8
  bas: 23.0
  haut: 32.4
  unite: Md€ courants par an
  annee: "2026 (PLF) ; bas = exécution 2025 ; haut = estimation 2027 de la direction du budget"
  sources:
    - titre: "Sénat, rapport général PLF 2026, Affaires européennes (article 45, PSR-UE)"
      url: https://www.senat.fr/rap/l25-139-22/l25-139-22_mono.html
      date: "2025-11"
      extrait: "L'article 45 du projet de loi de finances pour 2026 évalue le montant du prélèvement sur recettes au profit de l'Union européenne à 28,8 milliards d'euros, soit une progression substantielle de 24,6 % par rapport à la prévision d'exécution à date pour 2025."
    - titre: "Sénat, même rapport (exécution 2025 et prévisions antérieures 2026-2027)"
      url: https://www.senat.fr/rap/l25-139-22/l25-139-22_mono.html
      date: "2025-11"
      extrait: "avec des prélèvements sur recettes attendus respectivement à hauteur de 30,4 milliards d'euros et 32,4 milliards d'euros"
  derivation: >
    Valeur lue à l'article 45 du PLF 2026 (28,8 Md€). Bas : contribution effective 2025 (23,0 Md€, même rapport).
    Haut : prévision de la direction du budget pour 2027 (32,4 Md€, établie lors du PLF 2025). Au-delà de 2027, le
    montant dépend du cadre financier pluriannuel 2028-2034 en négociation ; le rapport chiffre à environ
    2,5 Md€ par an à compter de 2028 le coût pour la France d'un statu quo sur les nouvelles ressources propres.
    Une promesse de « baisser la contribution » de x % se chiffre sur la valeur centrale ; une réduction
    unilatérale n'est pas juridiquement possible (décision ressources propres), la chiffrer comme non réalisable
    ou avec bas = 0.
  indicateur: europe_international.contribution_budget_ue@1.0.0
  limites: >
    Le PSR-UE exclut les droits de douane (ressources propres traditionnelles) ; l'indicateur du dépôt (Commission
    européenne, 22,3 Md€ en 2024) a un périmètre voisin mais en exécution. Le solde net France-UE (contribution
    moins dépenses de l'UE en France, dont la PAC) est beaucoup plus faible que la contribution brute.

- id: defense_credits_mission
