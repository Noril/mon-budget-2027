- id: inflation_cumulee_2027_2032
  libelle: Inflation cumulée de 2027 à 2032 (six revalorisations annuelles), pour les indexations à droit constant
  valeur: 11.03
  bas: 9.44
  haut: 11.50
  unite: "% cumulés"
  annee: "2027-2032"
  sources:
    - titre: "FMI, World Economic Outlook avril 2026, déflateur du PIB (NGDP_D), France (plan/hypotheses.yaml)"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
      date: "2026-04-14"
      extrait: "valeurs: {2026: 1.358, 2027: 1.460, 2028: 1.862, 2029: 1.863, 2030: 1.860, 2031: 1.757}"
    - titre: "FMI, World Economic Outlook avril 2026, prix à la consommation harmonisés, moyenne annuelle (PCPIPCH), France"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.PCPIPCH.A
      date: "2026-04-14"
      extrait: "PCPIPCH : 2026 1.843886 ; 2027 1.721117 ; 2028 1.855273 ; 2029 1.871195 ; 2030 1.910438 ; 2031 1.813523"
  derivation: >
    Central : déflateur du PIB (convention de REFERENCE.md et de plan/hypotheses.yaml), 2027 à 2031 FMI et 2032 =
    2031 reconduit : 1,01460 × 1,01862 × 1,01863 × 1,01860 × 1,01757 × 1,01757 = 1,1103, soit +11,03 %.
    Haut : prix à la consommation harmonisés du FMI (2032 = 2031 reconduit) : +11,50 %. Bas : cinq
    revalorisations seulement (2028 à 2032, déflateur), cas d'une indexation sur l'inflation constatée de
    l'année précédente appliquée à partir de 2028 : +9,44 %. Facteur multiplicatif = 1 + valeur / 100.
  limites: >
    Une promesse d'indexation « sur l'inflation » vise les prix à la consommation, pas le déflateur : l'écart
    (0,5 point sur six ans) reste dans la fourchette. Le chiffre ne dit rien de l'inflation 2026, déjà acquise
    (1,36 % de déflateur, 1,84 % d'IPCH).

