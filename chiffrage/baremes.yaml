- id: retraites_age_60_depuis_62
  libelle: "Coût supplémentaire d'un âge légal à 60 ans par rapport à 62 ans (à ajouter à retraites_retour_62_ans_2032)"
  valeur: 18
  bas: 13.2
  haut: 25
  unite: Md€ courants 2032 par an, en régime de croisière
  annee: "2032 (converti depuis 2035 et 2020)"
  sources:
    - titre: "Cour des comptes, Situation financière et perspectives du système de retraites, février 2025, tableau n° 6 (Md€ constants 2024)"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "L’avancée d’un an de cet âge (63 ans au lieu de 64) représenterait une dépense supplémentaire pour le système des retraites de 5,8 Md€ en 2035."
    - titre: "Sénat, avis n° 727 (2009-2010) de J.-J. Jégou, commission des finances, sur le projet de loi portant réforme des retraites, 29 septembre 2010 (données du ministère du travail)"
      url: https://www.senat.fr/rap/a09-727/a09-7273.html
      date: "2010-09-29"
      extrait: "Impact financier « tous régimes » des mesures d'âge (en milliards d'euros 2008) 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 [...] Impact Mesure « 62 ans » 0,0 1,7 5,0 6,7 7,4 9,5 12,8 15,6 16,1 15,8 16,7"
    - titre: "Assemblée nationale, étude d'impact du projet de loi portant réforme des retraites n° 2760, juillet 2010"
      url: https://www.assemblee-nationale.fr/13/projets/pl2760-ei.asp
      date: "2010-07"
      extrait: "se traduirait par une économie de près de 2 milliards d’euros en 2011 et d'environ 20 milliards d’euros en 2020."
    - titre: "FIPECO (F. Ecalle), Avancer ou reculer l'âge de départ en retraite, 25 juin 2024 (recoupement)"
      url: https://www.fipeco.fr/commentaire/Avancer%20ou%20reculer%20l'%C3%A2ge%20de%20d%C3%A9part%20en%20retraite
      date: "2024-06-25"
      extrait: "Le solde des régimes de retraite serait majoré de 0,5 point de PIB (soit environ 14 Md€ de 2023) du fait d’une diminution des pensions (0,4 point de PIB) et d’une hausse des cotisations (0,1 point)."
  derivation: >
    Deux sources primaires encadrent le coût. Bas : extrapolation linéaire de la Cour (un an d'âge = 5,8 Md€
    constants 2024 en 2035 sur le système) : 2 × 5,8 × 1,1386 ≈ 13,2 Md€ ; c'est un minorant, les départs étant
    plus nombreux entre 60 et 62 ans qu'entre 63 et 64. Haut : effet du passage de 60 à 62 ans en 2010 (mesure
    « 62 ans », tous régimes : 16,7 Md€ de 2008 en 2020, ministère du travail repris par le Sénat), soit ≈ 0,7
    point de PIB (PIB 2020 projeté alors ≈ 1,23 × PIB 2008 en euros 2008), × 36,2 Md€ par point en 2032 ≈ 25 Md€ ;
    c'est un majorant, les départs étant alors concentrés à 60 ans alors que les carrières longues partent déjà à 60
    ans en droit actuel. Central : 18 Md€, milieu de la fourchette arrondi, égal à l'effet de long terme de deux
    ans d'âge sur les seuls régimes de retraite selon FIPECO (0,5 point de PIB × 36,2). Le coût d'un âge légal à
    60 ans par rapport au droit au 1er janvier 2027 est la somme retraites_retour_62_ans_2032 +
    retraites_age_60_depuis_62 ≈ 32 Md€ en 2032 (fourchette 25 à 41).
  limites: >
    Le central est une convention (milieu de deux sources primaires). La conversion du chiffre de 2010 en points de
    PIB est approchée. Même périmètre que retraites_retour_62_ans_2032 (système de retraite) ; l'effet sur
    l'ensemble des APU (FIPECO : 0,9 point de PIB ≈ 33 Md€ ; Institut Montaigne 2024 : 27 Md€ en 2027 pour
    l'annulation du recul de 2010) inclut des effets d'activité non comptés (règle 3) et relève de chiffrages_tiers.
    Un « 60 ans à taux plein avec 40 annuités » coûte nettement plus (baisse de durée à ajouter via
    retraites_duree_assurance_1_an) ; un 60 ans réservé aux carrières longues coûte nettement moins.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : sources secondaires (FIPECO, IFRAP). Remplacées par deux sources primaires : Cour 2025 (linéaire, 13,2
      Md€, bas) et chiffrage 2010 du ministère du travail repris par le Sénat (mesure « 62 ans » : 16,7 Md€ de 2008
      en 2020, ≈ 25 Md€ en 2032, haut ; étude d'impact AN n° 2760 en recoupement). Valeur 18 inchangée (milieu, égal
      à FIPECO) ; bas 13 → 13,2 ; haut 33 → 25 (l'ancien haut était un effet APU, exclu par la règle 3).

- id: retraites_ratio_cotisants_retraites
  libelle: Rapport entre le nombre de cotisants et le nombre de retraités
  valeur: 1.8
  unite: cotisants par retraité
  annee: "2025"
  sources:
    - titre: COR, Rapport annuel juin 2026
      url: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
      date: "2026-06"
      extrait: "Le rapport démographique entre les cotisants et les retraités s’est dégradé depuis 2002, passant de 2,1 à 1,8 en 2025"
    - titre: COR, Rapport annuel juin 2026 (effectifs)
      url: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
      date: "2026-06"
      extrait: "Le nombre de cotisants, évalué à 30,6 millions en 2025, continuerait d’augmenter jusqu’à la fin des années 2030"
  derivation: >
    Lu dans le rapport du COR. Effectifs 2025 : 30,6 millions de cotisants, 17,4 millions de retraités de droit direct
    (30,6 / 17,4 = 1,76). Projection : 1,3 cotisant par retraité en 2070 (scénario de référence).
  limites: >
    Chiffres 2025 estimés (modèle Ancêtre de la DREES, derniers chiffres observés 2024). Ne pas confondre avec le
    rapport démographique 20-64 ans / 65 ans et plus (2,5 en 2025 selon le COR).

- id: retraites_minimum_contributif_hausse_100e
  libelle: "Coût d'une hausse de 100 € par mois du minimum contributif (Mico) et de la pension minimale agricole, carrière complète, stock et flux"
  valeur: 1.6
  haut: 1.9
  unite: Md€ par an (régimes de base)
  annee: "2026 (étude d'impact 2023) ; haut = 2030"
  sources:
    - titre: "Projet de loi de financement rectificative de la sécurité sociale pour 2023, étude d'impact (article 10)"
      url: https://www.assemblee-nationale.fr/dyn/16/textes/l16b0760_etude-impact.pdf
      date: "2023-01-23"
      extrait: "Au total, l’impact des mesures est évalué à 440 M€ en 2023, compte tenu de leur entrée en vigueur en septembre 2023. Il s’élèverait, selon les estimations à 1,4 Md€ en 2024, 1,5 Md€ en 2025 et 1,6 Md€ en 2026"
    - titre: "Même étude d'impact (bénéficiaires du stock)"
      url: https://www.assemblee-nationale.fr/dyn/16/textes/l16b0760_etude-impact.pdf
      date: "2023-01-23"
      extrait: "1,8 million de retraités, dont 60 % de femmes, bénéficieront ainsi d’une augmentation de leur pension."
    - titre: "Gouvernement, Rapport sur les objectifs et les effets du projet de réforme des retraites, janvier 2023, p. 83"
      url: https://www.legifrance.gouv.fr/contenu/Media/files/autour-de-la-loi/legislatif-et-reglementaire/actualite-legislative/2023/plfrss_ecox2300575l_rapport_annexe_cm_23.01.2023_0.pdf
      date: "2023-01-23"
      extrait: "La mesure de revalorisation des minima de pension représente une dépense supplémentaire de 1,6 Md€ en 2027 et de 1,9 Md€ en 2030."
    - titre: "COR, Rapport annuel juin 2026 (objectif légal de 85 % du SMIC net)"
      url: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
      date: "2026-06"
      extrait: "un montant brut mensuel total des pensions de vieillesse de droit personnel au moins égal à 85 % du montant mensuel du salaire minimum de croissance net"
  derivation: >
    Lu dans l'étude d'impact de la réforme 2023 (revalorisation de 100 € du Mico et de la PMR, proratisée pour les
    carrières incomplètes) : 1,6 Md€ en 2026, dont 1,3 Md€ pour les pensions déjà liquidées (1,8 million de
    retraités) ; 180 000 à 200 000 nouveaux bénéficiaires par an. Haut : 1,9 Md€ en 2030 (rapport de 2023),
    croissance tenant au flux ; pour 2032, retenir 1,9 à 2,0 Md€ par tranche de 100 €. Pour une hausse de x € :
    1,6 × x / 100, ordre de grandeur.
  limites: >
    La Cour des comptes a relevé depuis que les gains effectifs pour les retraités déjà partis sont inférieurs aux
    100 € annoncés. Linéarité : 1,6 × x / 100 ne vaut que pour une hausse modeste (≤ 100 à 150 €) ; au-delà, la
    hausse fait entrer dans le dispositif des pensionnés aujourd'hui au-dessus du minimum et le coût progresse plus
    vite que x. Une pension minimale à 1 200 € ou au Smic pour tous (et non pour les seules carrières complètes)
    demande un chiffrage propre sur la distribution des pensions (DREES, EIR). Net des retours : × (1 − 0,08) (bas
    de retour_prelevements_pensions, petites pensions).
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Étude d'impact PLFRSS 2023 relue (1,6 Md€ en 2026, 1,3 Md€ pour le stock, 1,8 million de bénéficiaires).
      Nombre de bénéficiaires documenté et haut ajouté (1,9 Md€ en 2030, rapport gouvernemental de 2023). Valeur 1,6
      inchangée ; la linéarité limitée à 100-150 € reste signalée.

- id: retraites_cotisation_vieillesse_1_point
  libelle: Rendement d'une hausse d'un point de cotisation vieillesse de base au régime général
  valeur: 6.2
  bas: 4.8
  haut: 7.6
  unite: Md€ par an par point de cotisation
  annee: "2025"
  sources:
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025 (tableau n° 8, source DSS)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Le montant des ressources annuelles supplémentaires pour le système de retraites issues d’une augmentation d’un point du taux de cotisations serait compris entre 4,8 Md€ et 7,6 Md€"
  derivation: >
    Tableau n° 8 de la Cour (DSS), rendement brut 2025 : salariale sous plafond 6,2 ; patronale sous plafond 4,8
    (moindre à cause des allègements généraux, compensés par l'État) ; salariale déplafonnée 7,6 ; patronale
    déplafonnée 6,2. Valeur centrale : 6,2 (salariale sous plafond ou patronale déplafonnée). Choix selon la
    promesse : cotisation salariale sous plafond 6,2 ; salariale déplafonnée 7,6 (haut) ; patronale sous plafond
    4,8 (bas, rendement réduit par les allègements) ; patronale déplafonnée 6,2. Une promesse sans précision se lit
    au central. Projection 2032 :
    × 1,2106 (croissance du PIB nominal 2025-2032, masse salariale supposée suivre le PIB) ≈ 7,5 Md€ (5,8 à 9,2).
  limites: >
    Rendement brut, sans effet sur l'emploi ni les salaires (règle 3). La hausse de cotisation salariale réduit
    l'assiette de l'impôt sur le revenu (retour négatif, retour_ir_cotisation_salariale : 0,16 du rendement) ; une hausse de cotisation patronale sur les employeurs publics est un
    transfert interne aux APU (à exclure).
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Tableau n° 8 de la Cour relu (salariale sous plafond 6,2 ; patronale sous plafond 4,8 ; salariale déplafonnée
      7,6 ; patronale déplafonnée 6,2 Md€, 2025, régime général). Valeurs confirmées ; retour IR renvoyé au nouveau
      barème retour_ir_cotisation_salariale.

