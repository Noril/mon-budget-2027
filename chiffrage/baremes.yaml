    - titre: "Rapport du Groupe d'experts sur le Smic, 25 novembre 2025"
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716
      date: "2025-11-25"
      extrait: "En 2026, leur coût se stabiliserait à 72,3 milliards d'euros (−0,2 %)"
    - titre: "PLFSS 2026, annexe 4 (mesures de réduction et d'exonération de cotisations)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "qui dépasse 75 Md€ en 2024 (39,4 Md€ pour la réduction générale et 36 Md€ pour les réductions proportionnelles, en incluant les régimes spéciaux)"
  derivation: >
    Central : exécution 2025 selon la CCSS de mai 2026 (75,6 Md€, tous attributaires). Pour 2026, la CCSS prévoit
    +2,5 % (≈ 77,5 Md€, haut) avant le gel du paramètre Smic de la RGDU (décret n° 2026-509 du 12 juin 2026), qui
    annule cette hausse : ≈ 75,6 en 2026. Bas : prévision d'octobre 2025 citée par le Groupe d'experts (72,3 Md€).
    Pour 2032 : indexer sur la masse salariale privée (à défaut, facteur_pib_2025_2032 = 1,2106).
  limites: >
    Le périmètre varie selon les sources (l'annexe 4 donne 64,9 Md€ en 2024 sur les seuls régimes de base).
    Supprimer les allègements ne rapporte pas le coût brut : le Groupe d'experts chiffre l'économie nette entre 33
    et 47 Md€ après effets sur l'emploi (non comptés, règle 3, à signaler en effets_retour).
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Extraits de novembre 2025 (75,4 et 72,3) confirmés, mais la CCSS de mai 2026 est plus récente : 75,6 Md€
      exécutés en 2025. Valeur 72,3 → 75,6 ; bas 70,7 → 72,3 ; haut 75,4 → 77,5 (2026 avant gel du barème). Non
      utilisé par les programmes.

- id: allegements_sensibilite_smic_1pct
  libelle: "Effet net d'une hausse de 1 % du Smic sur les cotisations patronales nettes des allègements (RGDU)"
  valeur: 1.2
  bas: 0.52
  haut: 2.0
  unite: Md€/an de moindre solde (coût) par point de % de hausse du Smic
  annee: "2026 (barème RGDU) ; bas = DG Trésor 2017 porté en euros 2025"
  sources:
    - titre: "Commission des comptes de la sécurité sociale, rapport de mai 2026, synthèse"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "le compte prévisionnel intègre l’effet de la revalorisation du SMIC au 1er juin (+ 2,41 %) sur le barème des allègements généraux, qui conduit à dégrader le solde de - 2,8 Md€, mais pas l’effet de la mesure de gel du barème annoncée par le Gouvernement qui doit neutraliser cette dégradation"
    - titre: "Rapport du Groupe d'experts sur le Smic, 1er décembre 2017 (tableau n° 9, chiffrage DG Trésor, Saphir)"
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/2463e652-7de5-4cd4-b7da-6756e7c1374b
      date: "2017-12-01"
      extrait: "L'augmentation du coût des dispositifs d'allègements l'emporte sur l'augmentation des cotisations sociales à la charge des employeurs 79, de telle sorte que l'effet net est négatif pour les finances publiques (-400 M€)."
  derivation: >
    La RGDU (2026) exprime l'exonération en fonction du Smic jusqu'à 3 Smic : une hausse du Smic accroît les
    allègements de tous les salaires compris entre 1 et 3 Smic. Haut : effet barème de la hausse de 2,41 % du
    1er juin 2026 selon la CCSS, 2,8 Md€ sur sept mois, soit ≈ 4,8 Md€ en année pleine et ≈ 2,0 Md€ par point.
    Central, convention : ≈ 60 % de cet effet (1,2 Md€), pour tenir compte des cotisations patronales
    supplémentaires sur les salaires relevés par la hausse et de la diffusion partielle. Bas : chiffrage DG Trésor
    de 2017 (ancien barème jusqu'à 1,6 Smic), −400 M€ × 1,305 (PIB 2025 / PIB 2017) = 0,52 Md€. Le gel du Smic de
    référence ne vaut que pour 2026 (décret n° 2026-509) : à droit constant, les hausses de 2027-2032 jouent sur le
    barème.
  indicateur: finances.pib_nominal@1.0.0
  limites: >
    L'annualisation du chiffre de la CCSS (champ des régimes de base, hors éventuels effets sur Agirc-Arrco et
    Unédic) et la part nette de 60 % sont des hypothèses. Hors effets emploi.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : chiffrage 2017 antérieur à la RGDU. La CCSS de mai 2026 (relue) chiffre à 2,8 Md€ sur sept mois
      l'effet de la hausse de 2,41 % du Smic sur le barème de la RGDU (≈ 2,0 Md€ par point en année pleine) ; le gel
      du Smic de référence (décret n° 2026-509) ne vaut que pour 2026. Valeur 0,52 → 1,2 (convention : 60 % de
      l'effet barème) ; bas 0,40 → 0,52 ; haut 0,65 → 2,0.

