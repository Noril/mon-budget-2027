- id: prestations_hors_retraites_revalo_1pct
  libelle: Coût d'une revalorisation de 1 % des prestations sociales indexées hors retraites
  valeur: 1.0
  bas: 0.85
  haut: 1.15
  unite: Md€/an par point de revalorisation (régime de croisière)
  annee: "2026"
  sources:
    - titre: PLFSS 2026, annexe 9, fiche de l'article 44 (stabiliser le montant des prestations sociales)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe09-GenerationXBOOK_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "La stabilisation des prestations de solidarité financées par l'Etat ou les départements, telles que le RSA et la PA, permettrait une économie de l'ordre de 0,2 Md€ en 2026, et de 0,5 Md€ à partir de 2027"
    - titre: Même fiche, prestations familiales et autonomie
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe09-GenerationXBOOK_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "une stabilisation du montant des prestations familiales (0,8%) et des plafonds de ressources conditionnant l'ouverture du droit à certaines de ces prestations (1,8%) permettrait une économie de l'ordre de 0,3  Md€."
  derivation: >
    Deux approches. (1) Par les masses (1 % de chacune) : RSA 11,7 + prime d'activité 9,3 + AAH 14,6 +
    prestations familiales légales 33,3 + aides au logement 16,1 = 85 Md€, soit 0,85 Md€ par point (bas).
