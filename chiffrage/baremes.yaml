  sources:
    - titre: "Cour des comptes, Situation financière et perspectives du système de retraites, février 2025, tableau n° 6 (« en Md€ constants 2024 »)"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
