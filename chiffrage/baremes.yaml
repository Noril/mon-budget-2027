  sources:
    - titre: FIPECO (F. Ecalle), fiche « Quels sont les enjeux du (dé)gel du point d'indice de la fonction publique ? »
      url: https://www.fipeco.fr/fiche/Quels-sont-les-enjeux-du-(d%C3%A9)gel-du-point-dindice-de-la-fonction-publique-%3F
      extrait: "Il s’agit du coût hors prise en compte des cotisations sociales des employeurs. Il serait proche de 3,0 Md€ si ces cotisations étaient incluses, mais elles sont versées à des régimes de sécurité sociale qui sont des administrations publiques et elles n’ont donc aucun effet sur le déficit public. L’augmentation des pensions qui résulte de la revalorisation du point a en revanche un impact sur le déficit public mais il est très progressif"
    - titre: CNRACL, calcul des cotisations (taux salarial et employeur)
      url: https://www.cnracl.retraites.fr/employeur/cotisations-declarations/cotisations/calcul-des-cotisations
      date: "2026"
      extrait: "2024 11,10 31,65 2025 11,10 34,65 2026 11,10 37,65"
    - titre: Urssaf, taux de cotisations du secteur public (copie Wayback du 12 août 2024)
      url: https://web.archive.org/web/20240812043624/https://www.urssaf.fr/accueil/outils-documentation/taux-baremes/taux-cotisations-secteur-public.html
      date: "2024-08-12"
      extrait: "CSG imposable 2,40 % sur 98,25 % du traitement indiciaire brut […] CSG non imposable 6,80 % […] CRDS 0,50 %"
  derivation: >
    CONVENTION COMMUNE (salaires publics, créations et suppressions de postes). (1) L'assiette est la
    rémunération brute hors cotisations employeurs : les cotisations et contributions employeurs (CAS Pensions,
    CNRACL, maladie, famille, FNAL, CSA, CNFPT, versement mobilité) vont à d'autres APU et ne modifient pas le
    solde consolidé (FIPECO) ; leur retour est de 100 %, elles ne se comptent pas. (2) Sur cette rémunération
    brute, reviennent aux APU : retenue pour pension 11,10 % du traitement indiciaire (fonctionnaires ; ≈ 10 %
    pour les contractuels : vieillesse 7,3 % + Ircantec 2,8 %), soit ≈ 10,9 % en moyenne pondérée (≈ 78 % de
    titulaires) ; CSG et CRDS 9,7 % × 98,25 % = 9,5 % ; impôt sur le revenu ≈ 8 % du brut (convention : taux
    marginal moyen de l'ordre de 10 % du revenu imposable, net imposable ≈ 83 % du brut). Total ≈ 0,109 +
    0,095 + 0,08 = 0,28. Bas 0,25 (IR 5 %, ou hausse portant sur des primes : RAFP 5 % au lieu de 11,10 %) ;
    haut 0,32 (IR 11 % : agents de catégorie A+, magistrats). (3) Coût net pour le solde = coût brut hors
    cotisations employeurs × (1 − 0,28). C'EST CE COÛT NET QUI S'INSCRIT DANS effet_solde_primaire. Un coût
    exprimé « charges comprises » ou « CAS Pensions compris » (cout_*_charge, ancien point_indice_1pct pris
    comme coût employeur) doit d'abord être ramené au brut. Les conventions antérieures des programmes (« un
    quart » appliqué à un coût chargé, ou aucun retour sur un coût chargé) sont remplacées. (4) Pensions
    induites : une hausse du traitement indiciaire relève les pensions des agents qui partent ensuite en
    retraite ; effet progressif, non compris dans le retour : pour une indexation 2027-2032, ≈ 0,5 à 1 Md€ en
    2032 (≈ 110 000 départs de fonctionnaires par an, cinq cohortes, hausse moyenne ≈ 6 % sur une pension
    moyenne ≈ 25 000 €) : à mettre dans le bas de la fourchette de la mesure.
  limites: >
    La part d'IR est une convention (aucune source publique ne publie le taux marginal moyen des agents publics).
    Pas de source publique trouvée qui chiffre globalement ce retour (Cour des comptes, OFCE, DG Trésor, IPP
    consultés) : la valeur est une construction à partir des taux légaux. Hors baisse des prestations sous
    condition de ressources (prime d'activité, aides au logement) pour les agents modestes, qui augmenterait le
    retour. Taux Urssaf de 2024 (CSG et CRDS inchangés en 2026).

- id: retour_prelevements_pensions
  libelle: Part d'une hausse de pensions de retraite qui revient aux administrations publiques (CSG, CRDS, CASA, IR)
  valeur: 0.14
  bas: 0.08
  haut: 0.18
  unite: part de la hausse brute des pensions
  annee: "2026 (taux)"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, tableau 6 (valeur de point de la CSG par assiette)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "2024 2025 2026 (p) Activité 11 760 12 030 11 710 Remplacement 3 770 3 900 4 020"
  derivation: >
    CONVENTION COMMUNE, cohérente avec retour_prelevements_salaires_publics : une revalorisation des pensions
    (et des pensions minimales) se chiffre brut puis net des prélèvements obligatoires qui reviennent aux APU.
    CSG sur les pensions : taux plein 8,3 %, taux médian 6,6 %, réduit 3,8 %, exonération des plus modestes ;
    taux effectif moyen retenu ≈ 6,5 %. CRDS 0,5 % et CASA 0,3 % (hors exonérés) ≈ 0,6 %. IR : ≈ 7 % de la hausse
    (convention ; retraités imposables un peu plus de la moitié, taux marginal 11 % pour la plupart). Total
    ≈ 0,14. Bas 0,08 : hausse ciblée sur les petites pensions (minimum contributif, Aspa : CSG réduite ou nulle,
    IR nul) ; haut 0,18 : hausse proportionnelle de toutes les pensions (retraités aisés au taux plein et à 30 %
    d'IR). Coût net = coût brut × (1 − retour). S'applique à retraites_revalo_1pct (central) et au minimum contributif (bas, 0,08) ;
    retour nul pour les prestations non imposables et exonérées de CSG (Aspa, AAH, RSA).
  limites: >
    Construction à partir des taux légaux : pas de source publique chiffrant ce retour global. La valeur de point
    de CSG « remplacement » (4,0 Md€ en 2026) mêle pensions, allocations chômage et indemnités journalières.

