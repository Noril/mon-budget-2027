      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_RPCH.A
      date: "2026-04-14"
  derivation: >
    1 % × pib_nominal_2032 (3 621 Md€) = 36,2 Md€. Un dixième de point de PIB en 2032 vaut 3,6 Md€. Sert à
    convertir en Md€ 2032 tout chiffrage exprimé en points de PIB (COR, FIPECO, OFCE...).
  indicateur: finances.pib_nominal@1.0.0
  limites: Hérite des limites de pib_nominal_2032.

- id: facteur_pib_2023_2032
  libelle: Facteur de passage d'un montant 2023 en euros courants 2032, à part de PIB constante
  valeur: 1.2777
  unite: facteur (PIB nominal 2032 / PIB nominal 2023)
  annee: "2023 → 2032"
  sources: &sources_facteurs
    - titre: "INSEE, comptes nationaux annuels, PIB aux prix courants (indicateur finances.pib_nominal@1.0.0)"
      url: https://www.insee.fr/fr/statistiques/serie/010565692
      extrait: "PIB (valeurs lues dans data/indicateurs/finances.pib_nominal@1.0.0.parquet) : 2017 2 291,68 ; 2023 2 833,83 ; 2024 2 935,24 ; 2025 2 991,06 Md€"
    - titre: "FMI, World Economic Outlook avril 2026, croissance du PIB en volume (NGDP_RPCH), France (plan/hypotheses.yaml)"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_RPCH.A
      date: "2026-04-14"
      extrait: "valeurs: {2026: 0.858, 2027: 0.876, 2028: 1.217, 2029: 1.160, 2030: 1.106, 2031: 1.058}"
    - titre: "FMI, World Economic Outlook avril 2026, déflateur du PIB (NGDP_D), France (plan/hypotheses.yaml)"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
      date: "2026-04-14"
      extrait: "valeurs: {2026: 1.358, 2027: 1.460, 2028: 1.862, 2029: 1.863, 2030: 1.860, 2031: 1.757}"
  derivation: >
    PIB 2032 de la trajectoire de référence (pib_nominal_2032 : 3 620,9 Md€, soit PIB 2025 × Π(1 + croissance) ×
    (1 + déflateur) de 2026 à 2032, 2032 = 2031 reconduit) divisé par le PIB 2023 observé (2 833,83 Md€) = 1,2777.
  indicateur: finances.pib_nominal@1.0.0
  limites: >
    Convention « part de PIB constante » : juste pour une assiette qui suit le PIB (recettes, masse salariale,
    dépenses indexées sur les salaires) ; trop forte pour une dépense à droit constant non indexée (point
    d'indice gelé, barèmes en euros figés) ou une assiette en volume (carburants, énergie). PIB 2023-2025
    susceptibles de révision (INSEE).

