- id: csg_point
  libelle: Rendement d'un point de CSG sur toutes les assiettes
  valeur: 17.94
  unite: Md€ par point de taux
  annee: "2025"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, tableau 6 (valeur de point de la CSG par assiette)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "Activité 11 760 12 030 11 710 Remplacement 3 770 3 900 4 020 Capital 1 920 1 910 1 940 Patrimoine 750 810 690 Placement 1 170 1 100 1 250 Jeux 100 100 100 CSG totale 17 550 17 940 17 770"
  derivation: >
    Valeur de point = rendement de la CSG de chaque assiette / taux facial (note de lecture du tableau). 2025, en
    M€ par point : activité 12 030, remplacement 3 900, capital 1 910 (patrimoine 810, placements 1 100), jeux 100 ;
    total 17 940 M€. Un point sur les seuls revenus du capital : 1,9 Md€. Projection 2032 au PIB nominal :
    17,94 × 1,2106 ≈ 21,7 Md€.
  limites: >
    Valeur mécanique sans effet de comportement. Sur les revenus de remplacement, un point au taux plein ne touche
    pas les retraités exonérés ou au taux réduit. Effet IR de la CSG déductible (non compté dans la valeur) : la
    CSG est déductible de l'IR pour 6,8 points sur 9,2 sur les revenus d'activité, 5,9 points sur 8,3 sur les
    pensions au taux plein et 6,8 points sur les revenus du patrimoine imposés au barème. Une baisse d'un point
    de CSG déductible relève d'autant le revenu imposable, donc l'IR : retour ≈ assiette × taux marginal moyen
    pondéré par les revenus : 0,16 par euro de CSG déductible (0,14 à 0,185), voir retour_ir_csg_deductible
    (ratio officiel 3,9 Md€ d'IR pour 22,5 Md€ de CSG rendue déductible en 2018). Coût net pour les APU d'une baisse
    d'un point de CSG déductible sur les revenus d'activité ≈ 11,71 × (1 − 0,16) ≈ 9,8 Md€ en 2026 ; nul effet IR si
    la baisse porte sur la part non déductible (2,4 points).
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Tableau 6 de la CCSS de mai 2026 relu : valeurs de point exactes (17 940 M€ en 2025). Valeur inchangée. La
      convention de retour d'IR de la CSG déductible (0,12, non sourcée) est remplacée par le barème
      retour_ir_csg_deductible (0,16, ratio officiel 3,9 / 22,5 de 2018) ; coût net d'un point d'activité 10,3 → 9,8
      Md€.

- id: csg_point_activite
  libelle: Rendement d'un point de CSG sur les revenus d'activité
  valeur: 11.71
  bas: 11.71
  haut: 12.03
  unite: Md€ par point de taux
  annee: "2026 (prévision CCSS, droit en vigueur) ; 12,03 en 2025"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, tableau 6
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "2024 2025 2026 (p) Activité 11 760 12 030 11 710"
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, fiche 1.3 La CSG
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "La CSG sur les revenus d’activité diminuerait de 2,9% en 2026. Si le secteur privé serait encore le principal contributeur avec une progression de +1,9% et +1,2 point de contribution , le rendement prévisionnel des travailleurs indépendants chuterait de 34%"
  derivation: >
    Valeur de point 2026 (prévision) de la CSG sur les revenus d'activité (taux facial 9,2 %) : 11 710 M€. Le point
    2026 est retenu (et non 2025, 12 030 M€, haut) parce qu'il intègre la réforme de l'assiette des travailleurs
    indépendants et exploitants agricoles, en vigueur au 1er janvier 2026 et donc dans la législation de
    référence ; la baisse est ponctuelle (hors réforme, la CSG progresserait de 2,3 % en 2026). Sert aussi à
    chiffrer une bascule cotisations salariales → CSG. Projection 2032 : 11,71 × 1,1842 (facteur_pib_2026_2032)
    ≈ 13,9 Md€.
