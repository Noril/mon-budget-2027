      extrait: "Les montants encaissés par la DGFiP en 2025 sur des créances de contrôle fiscal ont atteint 11,4 milliards d'euros (Md€). [...] La contribution totale du contrôle fiscal aux Finances publiques, qui agrège le montant des droits et pénalités notifiés (17,1 Md€) et celui des crédits d'impôts et de taxes non remboursés ( 8,4 Md€), s'établit ainsi à 25,5 Md€ en 2025"
    - titre: "Sénat, rapport d'information n° 72 (2022-2023), Fraude et évasion fiscales : faire les comptes et intensifier la lutte"
      url: https://www.senat.fr/rap/r22-072/r22-072_mono.html
      date: "2022-10"
      extrait: "si le taux de recouvrement, qui s'est élevé à 75,3 % en 2021, est aujourd'hui meilleur qu'en 2018, où il n'avait atteint que 59,9 %, il demeure toutefois insuffisant."
  derivation: >
    Valeur lue (dossier de presse DGFiP). Bas : montants encaissés en 2025 sur des créances de contrôle fiscal,
    11,4 Md€ (stables depuis 2024 ; 10,6 à 10,7 Md€ en 2021-2023). Haut : contribution totale (notifiés + crédits
    d'impôt et taxes non remboursés), 25,5 Md€. Sert de base pour chiffrer une promesse d'intensification du
    contrôle : le gain est la hausse du montant ENCAISSÉ (ordre de grandeur 11,4 Md€ par an), pas du montant
    notifié.
  limites: >
    Les encaissements d'une année portent en partie sur des notifications d'années antérieures. Le taux de
    recouvrement du Sénat (75,3 % en 2021) porte sur les montants mis en recouvrement depuis 2019 (changement de
    méthode).
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : source principale secondaire (LégiFiscal). Remplacée par le dossier de presse DGFiP du 7 avril 2026
      (PDF relu) : 17,1 Md€ notifiés, 11,4 Md€ encaissés, 25,5 Md€ de contribution totale. Valeur et haut inchangés
      ; bas ajouté 11,4 (encaissements). Barème utilisé par aucun programme.

- id: logement_social_aides_part_prix_revient
  libelle: Aides publiques à la production d'un logement social, en part du prix de revient (subventions + TVA réduite)
  valeur: 33
  bas: 24
  haut: 43
  unite: "% du prix de revient de l'opération"
  annee: "2024-2025"
  sources:
    - titre: "Sénat, rapport d'information n° 804 (2023-2024), Quel bilan pour le Fonds national des aides à la pierre (FNAP) ?"
      url: https://www.senat.fr/rap/r24-804/r24-804_mono.html
      date: "2024-09"
      extrait: "Pour les PLAI en zone tendue, malgré des subventions publiques importantes entre 10 % et 29 % des prix de revient, les opérations ne s'équilibrent pas."
    - titre: "Sénat, même rapport (aides indirectes)"
      url: https://www.senat.fr/rap/r24-804/r24-804_mono.html
      date: "2024-09"
      extrait: "l'exonération de taxe foncière sur les propriétés bâties pendant 25 ans sur les logements sociaux ; - un taux réduit de TVA à 5,5 % depuis 1996, à l'exception des PLUS"
  derivation: >
    Subventions directes (État via le FNAP, collectivités, Action Logement) : 10 à 29 % du prix de revient
    (central 19,5 %). TVA réduite : avantage de (20 − 5,5) / 105,5 ≈ 13,7 % du prix TTC au taux réduit (PLAI ;
    le PLUS est au taux de 10 %, avantage (20 − 10) / 110 ≈ 9 %). Central : 19,5 + 13,7 ≈ 33 % ; bas :
    10 + 13,7 ≈ 24 % ; haut : 29 + 13,7 ≈ 43 %. Le coût public d'un logement social supplémentaire =
    part × prix de revient moyen ; le prix de revient moyen (bilan annuel des logements aidés, DHUP) n'a pas pu
    être récupéré cette nuit : à renseigner dans la mesure avec sa source.
  limites: >
    Hors exonération de TFPB pendant 25 ans (à la charge des collectivités, faiblement compensée) et hors
    avantage des prêts de la Caisse des dépôts sur fonds d'épargne réglementée (non chiffré), qui augmentent le
    coût public total. Les subventions des collectivités et d'Action Logement ne sont pas toutes des dépenses
    de l'État (Action Logement est hors APU dans certaines conventions). Le Sénat compte 85 381 logements sociaux
    agréés en 2024 (rapport PLF 2026, Logement et ville).
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Extraits Sénat (rapport n° 804, 2024) relus : subventions de 10 à 29 % du prix de revient des PLAI en zone
      tendue, TVA à 5,5 %. La part de la TVA réduite est un calcul ((20 − 5,5) / 105,5) et le central une convention
      (milieu de la fourchette des subventions) ; fourchette 24-43 % inchangée.

- id: droits_inscription_superieur
  libelle: Produit des droits d'inscription universitaires et de la CVEC (coût de la gratuité de l'enseignement supérieur public)
  valeur: 0.58
  bas: 0.40
  unite: Md€/an
  annee: "2025 (année universitaire 2024-2025)"
  sources:
    - titre: Sénat, rapport général PLF 2026, mission Recherche et enseignement supérieur
      url: https://www.senat.fr/rap/l25-139-323/l25-139-323_mono.html
      date: "2025-11"
      extrait: "le montant global des droits d'inscription a cru fortement du fait de l'augmentation du nombre d'étudiants, passant de 250 millions d'euros à près de 400 millions d'euros en dix ans"
    - titre: Sénat, même rapport (CVEC)
      url: https://www.senat.fr/rap/l25-139-323/l25-139-323_mono.html
      date: "2025-11"
      extrait: "Au titre de l'année universitaire 2024-2025, 177 millions d'euros ont été collectés au titre de la CVEC, contre 169 millions d'euros en 2023-2024"
  derivation: >
    Droits d'inscription des universités ≈ 0,40 Md€ (bas : gratuité des seuls droits) + CVEC 0,177 Md€ = 0,58 Md€
    (gratuité complète dans le public). Les établissements étant des opérateurs de l'État (APU), la gratuité est
    une perte de recette nette si l'État compense. Projection 2032 : × facteur_pib_2025_2032 (≈ 0,7 Md€) si les
    effectifs et les tarifs suivent.
  limites: >
    Hors écoles d'ingénieurs publiques et grands établissements à droits spécifiques, hors droits différenciés des
    étudiants extra-européens (produit non isolé dans les sources consultées). Les boursiers (≈ 40 %) sont déjà
    exonérés.

- id: aides_publiques_entreprises
  libelle: "Aides publiques aux entreprises (dépenses fiscales, budgétaires, allègements de cotisations), selon le périmètre"
  valeur: 211
  bas: 108
  haut: 223
  unite: Md€/an
  annee: "2023 (Sénat) ; 2019 (France Stratégie)"
  sources:
    - titre: "Sénat, commission d'enquête sur l'utilisation des aides publiques aux grandes entreprises, rapport n° 808 (2024-2025), tome I, 1er juillet 2025"
      url: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
      date: "2025-07-01"
      extrait: "Au sens large, les aides publiques aux entreprises atteignent au moins 211 milliards d'euros en 2023"
    - titre: "Sénat, même rapport (périmètre restreint)"
      url: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
      date: "2025-07-01"
      extrait: "Si l'on exclut les interventions financières de Bpifrance, les dépenses fiscales déclassées et les dépenses fiscales sur la TVA, l'estimation des aides publiques aux entreprises pour 2023 passe de 211 à 108 milliards d'euros ."
    - titre: "Sénat, même rapport (France Stratégie et Clersé)"
      url: https://www.senat.fr/rap/r24-808-1/r24-808-1_mono.html
      date: "2025-07-01"
      extrait: "compris entre 223 milliards d'euros pour le périmètre le plus large et 139 milliards d'euros pour le périmètre le plus restreint"
  derivation: >
    Central : périmètre large du Sénat (2023), 211 Md€. Bas : périmètre restreint du Sénat, 108 Md€, obtenu en
    retirant les interventions financières de Bpifrance (prêts, garanties), les dépenses fiscales déclassées et les
    dépenses fiscales de TVA : les allègements généraux de cotisations (≈ 75 Md€, allegements_generaux_cout) y
    RESTENT inclus, si bien que les aides hors allègements ne sont que de l'ordre de 33 Md€ dans ce périmètre.
    Haut : France Stratégie, périmètre le plus large (2019), 223 Md€. Le ministre cité par le Sénat retient
    ≈ 150 Md€ (40 fiscales, 30 budgétaires, 80 d'allègements). Sert de PLAFOND (règle 6) à une économie ciblée
    « sur les aides aux entreprises » : l'essentiel du périmètre est constitué des allègements généraux et de
    dépenses fiscales dont la suppression est une hausse d'impôt.
  limites: >
    Périmètre conventionnel ; ordre de grandeur selon le Sénat lui-même. Une suppression des allègements a des
    effets sur l'emploi (non comptés, règle 3).
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Extraits du Sénat (rapport n° 808) relus. Erreur corrigée dans la dérivation (signalée par la coordination et
      confirmée sur le texte) : les 108 Md€ excluent Bpifrance, les dépenses fiscales déclassées et celles de TVA,
      mais INCLUENT les allègements généraux (≈ 75 Md€). Valeurs inchangées.
