    commentaire: >
      Décomposition DG Trésor 2017 relue (−400, +240, +70, −260, +110 ; total −240). Composante allègements mise à
      jour avec la RGDU (allegements_sensibilite_smic_1pct) : valeur 0,31 → 0,9 ; bas 0,24 → 0,31 (chiffrage 2017) ;
      haut 1,1 → 1,7 (effet barème entier ; l'ancien haut IGF 2010 via l'IFRAP est retiré). Les programmes qui
      utilisent 0,31 passent la validation (bas) mais doivent reprendre 0,9 au central.

