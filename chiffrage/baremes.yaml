- id: retraites_revalo_1pct
  libelle: "Coût annuel d'une revalorisation supplémentaire de 1 % de toutes les pensions (base et complémentaires)"
  valeur: 5.0
  bas: 3.5
  haut: 5.0
  unite: Md€ courants par an, en 2032, par point de revalorisation
  annee: "2032 (projeté depuis 2023-2026)"
  sources:
    - titre: "Cour des comptes, Situation financière et perspectives du système de retraites, février 2025"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Sur la base des dépenses prévisionnelles des régimes de retraite de base en 2025, qui s’élèvent à 288 Md€, une sous-indexation d’un point des pensions par rapport à l’inflation permettrait une économie de 2,9 Md€ pour cette même année"
    - titre: "Cour des comptes, idem (structure des dépenses 2023)"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "En 2023, les dépenses du système de retraites se sont établies à 388,4 Md€, soit 13,8 % du PIB, dont 376,8 Md€ de prestations de retraite"
    - titre: "PLFSS 2026, annexe 9, fiche de l'article 44 (stabiliser le montant des prestations sociales, dont pensions)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe09-GenerationXBOOK_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "La stabilisation des pensions de retraite (à la place d’une revalorisation de 1,0%, net de l’effet retour CSG), permettrait une économie de l’ordre de 2,7 Md€ en 2026, dont 2,0Md€ pour la Sécurité sociale et 0,7 Md€ pour l’Etat."
    - titre: "COR, Rapport annuel juin 2026, Synthèse"
      url: https://www.cor-retraites.fr/sites/default/files/2026-06/Synth%C3%A8se_RA_2026_0.pdf
      date: "2026-06"
      extrait: "de 14,1 % en 2025, elle resterait à 14,1 % en 2030 pour atteindre 14,2 % en 2045."
  derivation: >
    Central (tous régimes) : dépenses de retraite 2032 = 14,1 % × 3 621 Md€ ≈ 511 Md€ ; part des prestations dans
    les dépenses = 376,8 / 388,4 = 0,97 (Cour, 2023) ; 1 % × 0,97 × 511 ≈ 4,95, arrondi à 5,0 Md€.
    Bas (régimes de base seuls, seul levier direct de la loi) : 2,9 Md€ en 2025 (Cour) × 1,2106 ≈ 3,5 Md€.
    Recoupement DSS (PLFSS 2026, art. 44) : 1 % des pensions de base et de la fonction publique = 2,7 Md€ en 2026
    net du retour de CSG (≈ 2,9 brut), × 1,1842 ≈ 3,4 Md€ en 2032, cohérent avec le bas. L'effet est permanent :
    une revalorisation de 1 % une année relève le niveau de toutes les pensions des années suivantes.
  limites: >
    Montant brut. CONVENTION : l'effet sur le solde est net des prélèvements qui reviennent aux APU (CSG, CRDS,
    CASA, cotisation maladie, IR) : × (1 − retour_prelevements_pensions), soit ≈ 4,2 Md€ net par point en 2032
    avec 0,16 (régimes de base seuls : ≈ 2,9). Les pensions complémentaires (Agirc-Arrco, Ircantec…) sont
    revalorisées par les partenaires sociaux : une promesse portant sur « les pensions » sans précision se lit sur
    le périmètre tous régimes, une promesse sur « la revalorisation légale » sur les seuls régimes de base.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Extraits de la Cour (2,9 Md€ pour 288 Md€ ; 388,4 / 376,8) relus. Ajout du recoupement DSS (PLFSS 2026, art.
      44 : 2,7 Md€ net de CSG pour 1 % en 2026), cohérent avec le bas. Valeurs inchangées ; net recalculé avec le
      nouveau retour_prelevements_pensions (0,16).

- id: retraites_retour_62_ans_2032
  libelle: "Coût en 2032 de l'annulation des mesures d'âge de la réforme 2023 (retour à 62 ans et au calendrier Touraine de durée), par rapport au droit au 1er janvier 2027 (réforme suspendue)"
