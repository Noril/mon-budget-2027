- id: allegements_generaux_cout
  libelle: Coût des allègements généraux de cotisations patronales (réduction générale + bandeaux maladie et famille)
  valeur: 72.3
  bas: 70.7
  haut: 75.4
  unite: Md€/an
  annee: "2026 (prévision CCSS octobre 2025, avant mesures du PLFSS 2026) ; 75,4 Md€ exécutés en 2024"
  sources:
    - titre: Rapport du Groupe d'experts sur le Smic, 25 novembre 2025 (chapitre sur les allègements)
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716
      date: "2025-11-25"
      extrait: "le coût total des dispositifs d'allègements à vocation générale à destination des salariés s'élève à 75,4 milliards d'euros en 2024"
    - titre: Même rapport, prévision 2025-2026
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716
      date: "2025-11-25"
      extrait: "En 2026, leur coût se stabiliserait à 72,3 milliards d'euros (−0,2 %)"
    - titre: PLFSS 2026, annexe 4 (mesures de réduction et d'exonération de cotisations)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "qui dépasse 75 Md€ en 2024 (39,4 Md€ pour la réduction générale et 36 Md€ pour les réductions proportionnelles, en incluant les régimes spéciaux)"
  derivation: >
    Valeur centrale = prévision 2026 citée par le Groupe d'experts Smic d'après la CCSS d'octobre 2025
    (72,3 Md€, tous régimes y compris retraite complémentaire et assurance chômage). Haut = exécution 2024
    (75,4 Md€ = 39,4 réduction générale + 26,4 bandeau maladie + 9,6 bandeau famille). Bas = 72,3 − 1,6 Md€
    (« coup de rabot de 1,6 Md€ en 2026 » lié au décret RGDU pris en application de la LFSS 2025, cité par la
    contribution du MEDEF annexée au même rapport ; source partie prenante, d'où son usage en borne). Depuis
    le 1er janvier 2026 les trois dispositifs sont fusionnés en une réduction générale dégressive unique
    (RGDU). Pour 2032 : indexer sur la masse salariale privée (à défaut, facteur PIB nominal 2025→2032 = 1,2106,
    plan/hypotheses.yaml).
  limites: >
    Le périmètre varie selon les sources : l'annexe 4 donne 64,9 Md€ (2024) sur le seul champ des régimes
    obligatoires de base (ROBSS), hors Agirc-Arrco et Unédic. Supprimer les allègements ne rapporte pas le
    coût brut : le Groupe d'experts chiffre l'économie nette entre 33 et 47 Md€ après effets sur l'emploi,
    l'assurance chômage et les recettes (effet non compté selon chiffrage/README, à signaler en effets_retour).

- id: allegements_sensibilite_smic_1pct
  libelle: Effet net d'une hausse de 1 % du Smic sur les cotisations patronales nettes des allègements
  valeur: 0.52
  bas: 0.40
  haut: 0.65
  unite: Md€/an de moindre solde (coût) par point de % de hausse du Smic
  annee: "2025 (montant 2017 de la DG Trésor porté en euros 2025)"
  sources:
    - titre: Rapport du Groupe d'experts sur le Smic, 1er décembre 2017 (tableau n° 9, chiffrage DG Trésor, Saphir)
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/2463e652-7de5-4cd4-b7da-6756e7c1374b
      date: "2017-12-01"
      extrait: "L'augmentation du coût des dispositifs d'allègements l'emporte sur l'augmentation des cotisations sociales à la charge des employeurs 79, de telle sorte que l'effet net est négatif pour les finances publiques (-400 M€)."
  derivation: >
    −400 M€ (2017, DG Trésor) × PIB nominal 2025 / PIB nominal 2017 (2 991,06 / 2 291,68 = 1,305,
    finances.pib_nominal@1.0.0) = 0,52 Md€. Bas = montant 2017 non actualisé (0,40) ; haut = 0,65 pour tenir
    compte de la concentration accrue des salaires près du Smic et de l'indexation de la RGDU sur le Smic
    depuis 2026. L'effet brut sur le seul coût des allègements n'est pas publié séparément.
  indicateur: finances.pib_nominal@1.0.0
  limites: >
    Chiffrage ancien (barème 2017, CICE et Pacte encore en vigueur) ; aucune actualisation publique récente
    trouvée. Hypothèse de diffusion de la hausse jusqu'à 1,7 Smic. Hors effets emploi.

- id: salaries_au_smic
  libelle: Salariés directement concernés par la revalorisation du Smic
  valeur: 2.2
  bas: 2.0
  haut: 3.1
  unite: millions de salariés (secteur privé hors agriculture)
  annee: "1er novembre 2024 (revalorisation anticipée de janvier 2025)"
  sources:
    - titre: Rapport du Groupe d'experts sur le Smic, 25 novembre 2025 (d'après Dares, enquêtes Acemo)
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716
      date: "2025-11-25"
      extrait: "Au 1 er novembre 2024, 2,2 millions de salariés des entreprises du secteur privé hors agriculture ont été directement concernés par la revalorisation du Smic horaire"
  derivation: >
    2,2 millions = 12,4 % des salariés du champ Acemo. Haut = pic de janvier 2023 (17,3 % du même champ,
    soit environ 3,1 millions en appliquant 17,3 % à l'effectif implicite 2,2 / 0,124 = 17,7 millions).
    Bas = 2,0 millions, borne arrondie tenant compte du reflux observé.
  limites: >
    Hors fonction publique, agriculture, particuliers employeurs, apprentis et intérimaires. Ce n'est pas le
    nombre de salariés payés exactement au Smic : la part dépend du dynamisme passé du Smic. Les salariés
    touchés par la diffusion jusqu'à 1,2-1,5 Smic sont bien plus nombreux.

- id: smic_1pct_cout_apu
  libelle: Coût pour les administrations publiques d'une hausse de 1 % du Smic (effet total)
  valeur: 0.31
  bas: 0.24
  haut: 1.1
  unite: Md€/an de moindre solde par point de % de hausse du Smic
  annee: "2025 (montant 2017 porté en euros 2025)"
  sources:
    - titre: Rapport du Groupe d'experts sur le Smic, 1er décembre 2017 (tableau n° 9, DG Trésor)
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/2463e652-7de5-4cd4-b7da-6756e7c1374b
      date: "2017-12-01"
      extrait: "Une augmentation de 1 % du SMIC dégraderait le solde public de 240  M€ (ici encore sans prise en compte des autres effets sur l'économie, notamment sur l'emploi"
    - titre: Fondation IFRAP, « Smic, non à la politique du coup de pouce » (cite un rapport IGF de 2010)
      url: https://www.ifrap.org/budget-et-fiscalite/smic-non-la-politique-du-coup-de-pouce
      extrait: "une hausse du Smic comprenant un coup de pouce de 1% coûterait 800 millions, ou 1,4 milliard d'euros pour un coup de pouce de 1,5%. Quant à la hausse de la masse salariale publique, elle coûterait 300 millions pour un coup de pouce de 1%"
  derivation: >
    Décomposition DG Trésor 2017 (M€) : cotisations employeurs nettes des allègements −400 ; cotisations
    salariales +240 ; masse salariale publique −260 ; prestations (prime d'activité, aides au logement) +110 ;
    impôt sur le revenu +70 ; total −240. Central = 240 × 1,305 (PIB 2025 / PIB 2017) = 0,31 Md€. Bas (coût
    le plus faible) = montant 2017 nominal ; haut = chiffrage IGF 2010 rapporté par l'IFRAP
    (0,8 + 0,3 = 1,1 Md€), qui ne déduit pas les recettes induites.
  indicateur: finances.pib_nominal@1.0.0
  limites: >
    Pas d'actualisation publique récente ; hors effets emploi (qui dégraderaient le solde). La RGDU de 2026
    rend le coût des allègements plus sensible au Smic. Pour une hausse de x %, multiplier linéairement
    seulement pour de petites hausses (au-delà de ~5 %, la diffusion et les effets de seuil changent).

- id: smic_1pct_masse_salariale_publique
  libelle: Surcoût de masse salariale publique d'une hausse de 1 % du Smic
  valeur: 0.34
  bas: 0.26
  haut: 0.40
  unite: Md€/an par point de % de hausse du Smic
  annee: "2025 (montant 2017 porté en euros 2025)"
  sources:
    - titre: Rapport du Groupe d'experts sur le Smic, 1er décembre 2017 (DG Trésor)
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/2463e652-7de5-4cd4-b7da-6756e7c1374b
      date: "2017-12-01"
      extrait: "La hausse du SMIC relève les rémunérations dans la fonction publique de 260 M€ (cette évaluation fait l'hypothèse d'une diffusion identique du SMIC dans la fonction publique et dans le secteur privé)."
  derivation: >
