    - titre: "Cour des comptes, idem (ensemble des finances publiques, effets d'activité compris)"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Pour l’ensemble des finances publiques, l’avancée d’un an de l’âge d’ouverture des droits coûterait 13 Md€ en 2035, tandis qu’un recul rapporterait jusqu’à 17,7 Md€."
  derivation: >
    Central : 5,8 Md€ constants 2024 en 2035 (pensions tous régimes −4,2 dont base −3,0 et complémentaires −1,2 ;
    cotisations −1,6 ; tableau n° 6, données Cnav et DG Trésor) × 1,1386 (déflateur FMI 2032/2024) ≈ 6,6 Md€.
    Bas : régime de croisière 2045, 4,3 Md€ × 1,1386 ≈ 4,9 Md€. Haut : moitié de l'effet Cnav des deux ans de la
    réforme 2023 en 2032 (15,7 / 2 ≈ 7,9 Md€, voir retraites_retour_62_ans_2032) ; ce haut inclut l'accélération
    de la durée (≈ 1 Md€ sur les 7,9), c'est une borne. Pour une hausse d'un an (65 ans), la Cour donne +4,7 à
    +8,4 Md€ en 2035 sur le système selon le calendrier.
  limites: >
    Maturité : 5,8 Md€ est l'effet en 2035 ; pour une mesure appliquée dès 2028, l'effet 2032 est voisin (le profil
    Cnav des mesures d'âge de 2023 culmine en 2032), d'où la seule conversion par le déflateur ; pour une mesure
    plus tardive, appliquer la montée en charge (une génération par trimestre). Périmètre : système de retraite
    (voir retraites_retour_62_ans_2032) ; la Cour chiffre à 13 Md€ le coût complet pour les finances publiques en
    2035 (autres recettes −7,2 Md€, effets d'emploi non comptés, règle 3). Montant brut : × (1 −
    retour_prelevements_pensions) sur la part prestations (4,2 des 5,8 Md€). Asymétrie : un recul rapporte plus
    qu'une avancée ne coûte.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Tableau n° 6 de la Cour relu : 5,8 Md€ en 2035, en Md€ constants 2024 (pensions −4,2 dont base −3,0 ;
      cotisations −1,6 ; autres recettes −7,2 ; APU −13,0), et 4,3 Md€ en 2045. Valeurs inchangées ; le haut (7,9)
      inclut un peu d'effet durée, désormais signalé.

