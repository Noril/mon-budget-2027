      publié avec comportements) ; haut 1,7 → 3,1 (statique Montaigne projeté en 2032) ; bas 0 inchangé. Écart entre
      sources non résolu.

- id: hs_exoneration_cout
  libelle: Coût des exonérations sur les heures supplémentaires (IR, cotisations salariales, déduction patronale)
  valeur: 5.4
  bas: 5.2
  unite: Md€/an
  annee: "2026 (prévision) ; bas = 2024"
  sources:
    - titre: Cour des comptes, NEB 2025 Dépenses fiscales, avril 2026 (dépense fiscale n° 120146)
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Depenses-fiscales.pdf
      date: "2026-04"
      extrait: "120146 Exon. heures supplémentaires 7 2 144 ▲1 6 2 212 8 2 250"
    - titre: PLFSS 2026, annexe 4 (exonérations et exemptions de cotisations)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10"
      extrait: "Exonération sur les heures supplémentaires - part salariale 2 228 2 254 1,2% 2 306 2,3%"
    - titre: PLFSS 2026, annexe 4 (déduction forfaitaire patronale)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10"
      extrait: "Déductions sur les heures supplémentaires (entreprises de moins 250 salariés) 865 868 0,4% 872 0,5%"
    - titre: "DARES Analyses n° 32, « Les heures supplémentaires rémunérées : quels salariés, quelles entreprises ? », juin 2025"
      url: https://dares.travail-emploi.gouv.fr/publication/les-heures-supplementaires-remunerees-quels-salaries-quelles-entreprises
      date: "2025-06"
      extrait: "En 2023, 8,8 millions de salariés effectuent des heures supplémentaires rémunérées, soit 53 % des salariés à temps complet du secteur privé dont le temps de travail est décompté en heures. Les salariés concernés … en effectuent en moyenne 104 dans l'année, pour un peu plus de 1 900 euros brut."
  derivation: >
    2026 : IR 2 250 M€ + exonération de cotisations salariales 2 306 M€ + déduction forfaitaire de cotisations
    patronales (entreprises de moins de 250 salariés) 872 M€ = 5 428 M€ ≈ 5,4 Md€. 2024 : 2 144 + 2 228 + 865 =
    5,24 Md€. Suppression totale : + 5,4 Md€ ; suppression du seul volet fiscal : + 2,25 Md€ ; du volet salarial :
    + 2,3 Md€.
  limites: >
    Chiffrages statiques : une suppression réduirait le recours aux heures supplémentaires et donc le gain. La part
    salariale n'est pas compensée à la sécurité sociale, la déduction patronale l'est par l'État : le coût APU est la
    somme. Volume (DARES, 2023) : 8,8 millions de salariés × 104 heures ≈ 0,9 milliard d'heures supplémentaires
    rémunérées, ≈ 16,8 Md€ brut (1 900 € par salarié) ; 1,6 million de salariés à temps partiel font en outre
    33 heures complémentaires en moyenne. Aucune source ouverte ne ventile les heures par tranche de majoration
    (25 % pour les huit premières heures hebdomadaires, 50 % au-delà) : une mesure ciblée sur une tranche reste à
    chiffrer au prorata, en convention. Le Sénat (rapport PLFSS 2026) chiffre la part salariale à 2,5 Md€, contre
    2,3 Md€ dans l'annexe 4 : écart de millésime.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Lignes relues : dépense fiscale 120146 (Cour, NEB Dépenses fiscales : 2 144 / 2 212 / 2 250 M€) et PLFSS 2026
      annexe 4 (part salariale 2 228 / 2 254 / 2 306 M€ ; déduction patronale 865 / 868 / 872 M€). Somme 2026 5,43
      Md€ confirmée.

