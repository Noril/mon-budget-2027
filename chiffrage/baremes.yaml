  indicateur: finances.pib_nominal@1.0.0
  limites: >
    Pas d'actualisation publique : les rapports du Groupe d'experts Smic de 2021 à 2025 ne chiffrent plus le coût
    budgétaire d'une hausse de 1 % (seulement l'effet sur le revenu disponible et le coût total des allègements,
    75,4 Md€ en 2024). Hors effets emploi (qui dégraderaient le solde). Le chiffrage de 2017 précède la réduction
    générale dégressive unique (RGDU) de 2026 : il est à remplacer, pour la composante allègements, par
    allegements_sensibilite_smic_1pct, et pour la masse salariale publique par smic_1pct_masse_salariale_publique
    × (1 − retour_prelevements_salaires_publics). La RGDU rend le coût des allègements plus sensible au Smic. Pour une hausse de x %, multiplier linéairement
    seulement pour de petites hausses (au-delà de ~5 %, la diffusion et les effets de seuil changent). Pour une
    hausse de 10 à 15 %, le produit linéaire est un minorant : la diffusion aux salaires jusqu'à 1,2-1,5 Smic,
    l'élargissement de la population au voisinage du Smic (salaries_au_smic) et la sortie de la prime d'activité
    ne sont pas proportionnels ; la mesure doit élargir sa fourchette (bas ≥ 1,5 fois le produit linéaire).

