- id: pib_nominal_2032
  libelle: PIB nominal projeté en 2032 (base de conversion des points de PIB en Md€)
  valeur: 3621
  unite: Md€ courants
  annee: "2032 (projection depuis 2025)"
  sources:
    - titre: "FMI, World Economic Outlook avril 2026, croissance du PIB en volume (NGDP_RPCH), France"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_RPCH.A
      date: "2026-04-14"
    - titre: "FMI, World Economic Outlook avril 2026, déflateur du PIB (NGDP_D), France"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
      date: "2026-04-14"
  derivation: >
    PIB 2025 observé (INSEE, indicateur finances.pib_nominal@1.0.0) = 2 991,06 Md€, multiplié par le produit des
    facteurs (1 + croissance en volume) × (1 + déflateur) de 2026 à 2032 retenus dans plan/hypotheses.yaml
    (FMI WEO avril 2026 ; 2032 = valeurs 2031 reconduites) : facteur 1,2106, soit 3 620,9 Md€. C'est la valeur de
    la trajectoire de référence (data/plan/trajectoire_reference.parquet, année 2032). Facteur de passage
    d'un montant 2025 à 2032 à part de PIB constante : 1,2106 ; d'un montant 2024 : 1,2336.
  indicateur: finances.pib_nominal@1.0.0
  limites: >
    Le WEO s'arrête en 2031 ; 2032 reconduit la croissance et le déflateur 2031 (convention a_trancher de
    plan/hypotheses.yaml). Le PIB 2025 est provisoire (révisions INSEE de mai et août).

