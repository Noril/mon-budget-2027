  annee: "2025"
  sources:
    - titre: FIPECO (F. Ecalle), fiche « Le niveau et l'évolution de la masse salariale publique » (mise à jour 2026)
      url: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
      extrait: "Chaque augmentation de 1,0 % du point de la fonction publique a un coût (hors cotisations des employeurs) de 1 000 M€ pour l’Etat, 200 M€ pour ses opérateurs, 700 M€ pour les administrations locales et 700 M€ pour les administrations sociales (surtout les hôpitaux), soit un total de 2,5 Md€."
    - titre: Sénat, avis sur le PLF 2026, Fonction publique (a25-145-5)
      url: https://www.senat.fr/rap/a25-145-5/a25-145-5.html
      date: "2025-11"
      extrait: "une première revalorisation de 3,5 % du point d'indice 7 ( * ) , dont le coût est évalué à 7,6 milliards d'euros en année pleine pour l'ensemble de la fonction publique, puis une deuxième revalorisation de 1,5 % à compter du 1 er juillet 2023, pour un coût de 3,4 milliards d'euros en année pleine."
    - titre: FIPECO, fiche « Quels sont les enjeux du (dé)gel du point d'indice de la fonction publique ? »
      url: https://www.fipeco.fr/fiche/Quels-sont-les-enjeux-du-(d%C3%A9)gel-du-point-dindice-de-la-fonction-publique-%3F
      extrait: "Il s’agit du coût hors prise en compte des cotisations sociales des employeurs. Il serait proche de 3,0 Md€ si ces cotisations étaient incluses, mais elles sont versées à des régimes de sécurité sociale qui sont des administrations publiques et elles n’ont donc aucun effet sur le déficit public."
  derivation: >
    Central : FIPECO 2026, 2,5 Md€ par point de % hors cotisations employeurs (État 1,0 ; opérateurs 0,2 ; APUL
    0,7 ; ASSO 0,7). Bas : revalorisation de 2022 (Sénat, 7,6 / 3,5 = 2,17 Md€). Haut : 2,6 Md€, somme des postes détaillés par
    FIPECO (1,0 + 0,2 + 0,7 + 0,7), que la fiche arrondit à 2,5 (base 2026-2027). Les cotisations employeurs, versées à d'autres APU, sont exclues (FIPECO) : c'est
    l'assiette de la convention retour_prelevements_salaires_publics. POUR 2032 : utiliser point_indice_1pct_2032
    (2,59 Md€, point gelé, sans facteur PIB) ; l'ancienne règle « × PIB 2032 / PIB 2023 = 1,28 » est abandonnée
    (elle comptait l'inflation dans une masse à point gelé).
  limites: >
    Coût brut avant retours : l'effet sur le solde est × (1 − 0,28) (retour_prelevements_salaires_publics). Le
    « quart » de retour cité auparavant dans ce barème n'avait pas de source ; il est remplacé par cette
    convention. Le point d'indice ne s'applique ni aux primes ni aux contractuels hors grille ; effet sur les
    pensions futures progressif (FIPECO).

- id: point_indice_1pct_2032
  libelle: Coût en 2032 d'une hausse de 1 % de la valeur du point d'indice, à point gelé en référence (trois versants, hors cotisations employeurs)
  valeur: 2.59
  bas: 2.5
  haut: 2.68
  unite: Md€ courants 2032 par an pour 1 % de hausse, brut (avant retours)
  annee: "2032 (depuis 2025)"
  sources:
    - titre: FIPECO (F. Ecalle), fiche « Le niveau et l'évolution de la masse salariale publique » (mise à jour 2026)
      url: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
      extrait: "Chaque augmentation de 1,0 % du point de la fonction publique a un coût (hors cotisations des employeurs) de 1 000 M€ pour l’Etat, 200 M€ pour ses opérateurs, 700 M€ pour les administrations locales et 700 M€ pour les administrations sociales (surtout les hôpitaux), soit un total de 2,5 Md€."
    - titre: FIPECO, même fiche (GVT)
      url: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
      extrait: "Le GVT positif accroît chaque année la masse salariale de l’Etat d’environ 1 800 M€. En conséquence, le « GVT solde » (différence entre les GVT positif et négatif est de l’ordre de 600 M€ par an."
  derivation: >
    À droit constant le point est gelé : la masse indiciaire ne suit pas le PIB nominal mais seulement le GVT
    solde et les effectifs. GVT solde de l'État ≈ 0,6 Md€ par an sur ≈ 110 Md€ de masse, soit ≈ 0,5 % par an ;
    effectifs supposés stables. Central : 2,5 Md€ (2025) × 1,005⁷ = 2,59 Md€ en 2032. Bas : pas de croissance
    de la masse indiciaire (2,5). Haut : 1 % par an (GVT solde plus hausse des effectifs), 2,5 × 1,01⁷ = 2,68.
    Ne pas multiplier par un facteur PIB (facteur_pib_*) : ce serait compter l'inflation dans une masse gelée.
    Une hausse ponctuelle de x % du point coûte x × 2,59 Md€ brut en 2032, soit x × 2,59 × (1 − 0,28) net des
    retours (retour_prelevements_salaires_publics).
  limites: >
    Le coût de 1 % dépend de la part indiciaire des rémunérations (primes exclues). La garantie individuelle du
    pouvoir d'achat (GIPA) et le relèvement du minimum de traitement quand le Smic augmente font croître la masse
    même à point gelé (non comptés). Remplace la règle « × PIB 2032 / PIB 2023 » de point_indice_1pct.

- id: indexation_point_indice_2027_2032
  libelle: Coût en 2032 d'une indexation du point d'indice sur l'inflation de 2027 à 2032, par rapport à un point gelé (droit constant), brut avant retours
  valeur: 28.6
  bas: 23.6
  haut: 30.8
  unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
  annee: "2032"
  sources:
    - titre: FIPECO (F. Ecalle), fiche « Le niveau et l'évolution de la masse salariale publique » (mise à jour 2026)
      url: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
      extrait: "Chaque augmentation de 1,0 % du point de la fonction publique a un coût (hors cotisations des employeurs) de 1 000 M€ pour l’Etat, 200 M€ pour ses opérateurs, 700 M€ pour les administrations locales et 700 M€ pour les administrations sociales (surtout les hôpitaux), soit un total de 2,5 Md€."
    - titre: "FMI, World Economic Outlook avril 2026, déflateur du PIB (NGDP_D), France (plan/hypotheses.yaml)"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
      date: "2026-04-14"
      extrait: "valeurs: {2026: 1.358, 2027: 1.460, 2028: 1.862, 2029: 1.863, 2030: 1.860, 2031: 1.757}"
    - titre: "FMI, World Economic Outlook avril 2026, prix à la consommation harmonisés (PCPIPCH), France"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.PCPIPCH.A
      date: "2026-04-14"
      extrait: "PCPIPCH : 2027 1.721117 ; 2028 1.855273 ; 2029 1.871195 ; 2030 1.910438 ; 2031 1.813523"
  derivation: >
    Référence : point gelé de 2027 à 2032 (aucune règle d'indexation dans la loi, REFERENCE.md) ; la masse
    indiciaire n'évolue alors qu'avec le GVT solde et les effectifs. Coût 2032 = coût de 1 % du point en 2032 à
    point gelé (point_indice_1pct_2032 : 2,59 Md€) × inflation cumulée 2027-2032 en points
    (inflation_cumulee_2027_2032 : 11,03) = 28,6 Md€ brut. Pas de facteur PIB : il compterait deux fois
    l'inflation. Indice des prix : le déflateur du PIB (convention de REFERENCE.md et de la trajectoire) est
    retenu au centre ; une promesse « sur l'inflation » vise les prix à la consommation (IPCH du FMI, +11,50 %),
    retenus en haut : 2,68 × 11,50 = 30,8 Md€. Bas : cinq revalorisations (2028-2032, +9,44 %) sur une masse
    sans croissance, 2,5 × 9,44 = 23,6 Md€. Montée en charge (part du coût 2032) : 2027 0,13 ; 2028 0,30 ;
    2029 0,48 ; 2030 0,66 ; 2031 0,83 ; 2032 1. CONVENTION pour l'effet sur le solde : coût net = 28,6 × (1 −
    retour_prelevements_salaires_publics = 0,28) = 20,6 Md€ ; pensions induites (≈ 0,5 à 1 Md€ en 2032) dans le
    bas de la mesure. Point déjà relevé : si le programme relève aussi le point de x % (ex. +10 %) avant ou
    pendant la période, chiffrer séparément la hausse (x × 2,59 Md€ brut) et l'indexation, et ajouter l'effet
    croisé x × 28,6 Md€ (l'indexation s'applique à une masse déjà relevée) : pour +10 %, 25,9 + 28,6 + 2,9 =
    57,4 Md€ brut, 41,3 Md€ net. Une « échelle mobile des salaires » publics se chiffre de même.
  limites: >
    Cotisations employeurs exclues (transferts internes aux APU, FIPECO). À point gelé, la GIPA et le relèvement
    du minimum de traitement au niveau du Smic (indexé) auraient de toute façon coûté une partie de la somme : le
    coût réel de l'indexation est un peu plus faible pour les bas indices (non chiffré). La trajectoire de
    référence de plan/ (solde primaire gelé en points de PIB) n'est pas à droit constant : limite connue de
    l'agrégation.

