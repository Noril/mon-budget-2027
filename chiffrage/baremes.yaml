- id: apd_part_rnb
  libelle: Aide publique au développement (APD) de la France, en équivalent-don, montant et part du revenu national brut
  valeur: 0.42
  bas: 0.42
  haut: 0.48
  unite: "% du RNB"
  annee: "2025 (données préliminaires) ; 0,48 % en 2024"
  sources:
    - titre: "OCDE, Comité d'aide au développement, base DAC1 (apports par fournisseur), France, API SDMX"
      url: https://sdmx.oecd.org/public/rest/data/OECD.DCD.FSD,DSD_DAC1@DF_DAC1/FRA.......?startPeriod=2023&format=csvfilewithlabels
      date: "2026-04"
      extrait: "11002 ODA as percent of GNI, grant equivalent : 2023 0.49 ; 2024 0.48 ; 2025 0.42. 11010 ODA, grant equivalent, national currency (millions) : 2023 13947.24 ; 2024 14283.46 ; 2025 12884.87. 1 Gross National Income (GNI), national currency : 2025 3043666"
  derivation: >
    APD 2025 = 12,88 Md€ en équivalent-don, RNB 2025 = 3 043,7 Md€, soit 0,42 % (14,28 Md€ et 0,48 % en 2024).
    Projection : RNB 2032 ≈ PIB 2032 × (RNB / PIB 2025 = 3 043,7 / 2 991,1 = 1,0176) ≈ 3 685 Md€ ; un point de RNB
    en 2032 vaut ≈ 36,8 Md€, un dixième ≈ 3,7 Md€. Atteindre 0,7 % en 2032 depuis 0,42 % coûte
    (0,70 − 0,42) × 36,8 ≈ 10,3 Md€ par an en 2032 (depuis 0,48 % : 8,1 Md€). Haut = niveau 2024.
  limites: >
    L'APD au sens du CAD n'est pas une dépense budgétaire : elle comprend des prêts (en équivalent-don), des
    annulations de dette, les frais d'écolage d'étudiants étrangers et l'accueil des réfugiés la première année.
    La mission budgétaire « Aide publique au développement » n'en finance qu'environ un tiers (3,67 Md€ de
    crédits au PLF 2026 selon le Sénat). Une hausse de l'APD financée par des prêts de l'AFD coûte moins au
    solde que son montant ; le chiffrage d'une promesse « 0,7 % du RNB » à dépense budgétaire constante sur les
    autres composantes est donc un majorant. Données 2025 préliminaires.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Série OCDE DAC1 relue (API SDMX, 29/09/2026) : APD 12 884,87 M€ en 2025, 0,42 % du RNB (0,48 % en 2024) ; RNB
      3 043 666 M€. Confirmé. Le caractère majorant (APD non entièrement budgétaire) est une limite documentée.

- id: psr_ue
  libelle: Contribution française au budget de l'Union européenne (prélèvement sur recettes, PSR-UE)
  valeur: 28.8
  bas: 23.0
  haut: 32.4
  unite: Md€ courants par an
  annee: "2026 (PLF) ; bas = exécution 2025 ; haut = estimation 2027 de la direction du budget"
  sources:
    - titre: "Sénat, rapport général PLF 2026, Affaires européennes (article 45, PSR-UE)"
      url: https://www.senat.fr/rap/l25-139-22/l25-139-22_mono.html
      date: "2025-11"
      extrait: "L'article 45 du projet de loi de finances pour 2026 évalue le montant du prélèvement sur recettes au profit de l'Union européenne à 28,8 milliards d'euros, soit une progression substantielle de 24,6 % par rapport à la prévision d'exécution à date pour 2025."
    - titre: "Sénat, même rapport (exécution 2025 et prévisions antérieures 2026-2027)"
      url: https://www.senat.fr/rap/l25-139-22/l25-139-22_mono.html
      date: "2025-11"
      extrait: "avec des prélèvements sur recettes attendus respectivement à hauteur de 30,4 milliards d'euros et 32,4 milliards d'euros"
  derivation: >
    Valeur lue à l'article 45 du PLF 2026 (28,8 Md€). Bas : contribution effective 2025 (23,0 Md€, même rapport).
    Haut : prévision de la direction du budget pour 2027 (32,4 Md€, établie lors du PLF 2025). Au-delà de 2027, le
    montant dépend du cadre financier pluriannuel 2028-2034 en négociation ; le rapport chiffre à environ
    2,5 Md€ par an à compter de 2028 le coût pour la France d'un statu quo sur les nouvelles ressources propres.
    Une promesse de « baisser la contribution » de x % se chiffre sur la valeur centrale ; une réduction
    unilatérale n'est pas juridiquement possible (décision ressources propres), la chiffrer comme non réalisable
    ou avec bas = 0.
  indicateur: europe_international.contribution_budget_ue@1.0.0
  limites: >
    Le PSR-UE exclut les droits de douane (ressources propres traditionnelles) ; l'indicateur du dépôt (Commission
    européenne, 22,3 Md€ en 2024) a un périmètre voisin mais en exécution. Le solde net France-UE (contribution
    moins dépenses de l'UE en France, dont la PAC) est beaucoup plus faible que la contribution brute.

