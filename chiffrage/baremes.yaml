      crédits de lutte contre l'immigration irrégulière). Le haut (OID, 41 Md€) reste une source engagée et
      contestée, signalée comme telle ; à ne pas utiliser pour chiffrer une mesure.

- id: fraude_sociale_estimee
  libelle: Fraude sociale estimée, et montants détectés et recouvrés
  valeur: 14
  bas: 13
  haut: 17.5
  unite: Md€ par an (fraude estimée)
  annee: "2024 (note HCFiPS publiée en décembre 2025)"
  sources:
    - titre: "HCFiPS, Note annuelle de suivi et d'évaluation des fraudes sociales, synthèse (décembre 2025)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "aboutit à un montant de fraudes de 14 Md€, contre 13 Md€ lors de l’évalua- tion précédente."
    - titre: "HCFiPS, même synthèse (détection et recouvrement)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "680 M€ recouvrés : le recouvrement est toujours limité."
    - titre: "HCFiPS, même synthèse (erreurs d'assiette, à ne pas additionner aux fraudes)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "les contrôles comptables d’assiette, qui ressortissent d’une logique d’erreur et non de fraude, font apparaître un manque à gagner évalué à 3,5 Md€, constant par rapport aux exercices précédents."
  derivation: >
    Central : fraude estimée par le HCFiPS sur le périmètre évalué (14 Md€). Bas : évaluation précédente (13 Md€).
    Haut : 14 + 3,5 Md€ d'erreurs d'assiette sur les cotisations = 17,5 Md€ ; c'est un manque à gagner total, pas
    une fraude : le HCFiPS précise que ces manques à gagner « ne doivent pas être ajoutés aux montants des
    fraudes » (la fondation IFRAP les additionne, janvier 2026). Part recouvrable : en 2024,
    plus de 2 Md€ détectés, 0,5 Md€ de fraudes stoppées, 0,68 Md€ recouvrés (même note), soit un rendement
    budgétaire effectif d'environ 1,2 Md€ par an, 8 à 9 % de la fraude estimée. Chiffrer une promesse de
    « lutte contre la fraude sociale » : central = gain supplémentaire documenté (ex. doublement du recouvrement,
    +0,7 à +1,2 Md€), haut = montant annoncé, jamais la fraude estimée entière.
  limites: >
    Périmètre partiel (fraude aux cotisations des micro-entrepreneurs et plateformes non comptée ; le HCFiPS
    évalue aussi à environ 5,5 Md€ le manque à gagner sur les recettes fiscales affectées à la sécurité sociale,
    TVA et tabac). Estimations par extrapolation de contrôles aléatoires, fragiles d'une année sur l'autre.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Synthèse HCFiPS de décembre 2025 relue (PDF) : 14 Md€ (13 Md€ précédemment), 2 Md€ détectés, 0,5 Md€ stoppés,
      680 M€ recouvrés ; valeurs inchangées. Source IFRAP du haut remplacée par le HCFiPS (erreurs d'assiette 3,5
      Md€) ; le haut 17,5 est désormais présenté comme un manque à gagner total, le HCFiPS disant que les erreurs ne
      s'ajoutent pas aux fraudes.

- id: fraude_fiscale_tva_estimee
  libelle: Fraude et irrégularités à la TVA (seule composante de la fraude fiscale estimée par des sources publiques)
  valeur: 15
  bas: 6
  haut: 26
  unite: Md€ par an
  annee: "estimations 2012 à 2020 (Cour des comptes 2019 ; Insee 2012 ; DGFiP 2010-2020)"
  sources:
    - titre: "Cour des comptes, La fraude aux prélèvements obligatoires, décembre 2019"
      url: https://www.ccomptes.fr/fr/publications/la-fraude-aux-prelevements-obligatoires
      date: "2019-12-02"
      extrait: "le montant de la fraude et des irrégularités à la TVA est estimée à une quinzaine de milliards d’euros."
    - titre: "Insee, blog, Estimer la TVA non recouvrée à partir des contrôles fiscaux"
      url: https://blog.insee.fr/estimer-la-tva-non-recouvree-a-partir-des-controles-fiscaux/
      date: "2022-12"
      extrait: "Pour l’exercice comptable 2012, le montant de TVA non recouvrée est estimé entre 20 Md€ et 26 Md€, soit 17 % à 21 % des recettes de TVA cette année-là."
    - titre: "HCFiPS, Note annuelle fraudes sociales, synthèse (reprend l'estimation DGFiP)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "Les sommes non recouvrées par l’administration ﬁscale sur le champ de la TVA sont évaluées par la DGFiP à 4 à 5 % de la TVA collectée"
  derivation: >
    Central : Cour des comptes avec l'Insee (une quinzaine de Md€). Bas : DGFiP, sous-déclaration des entreprises
    déclarant la TVA, 6 à 10 Md€ sur 2010-2020 (4 à 5 % de la TVA collectée). Haut : Insee, 20 à 26 Md€ pour
    2012. Aucune source publique ne chiffre l'ensemble de la fraude fiscale (IR, IS, patrimoine) ; les montants de
    60 à 100 Md€ cités dans le débat public ne reposent pas sur une méthode publiée par une administration.
    Part recouvrable : le contrôle fiscal a notifié 17,1 Md€ de droits et pénalités en 2025 (25,5 Md€ avec les
    crédits d'impôt non remboursés) et en a encaissé 11,4 Md€ (dossier de presse DGFiP du 7 avril 2026, voir
    controle_fiscal_rendement). Le gain budgétaire d'un
    renforcement du contrôle se chiffre donc en supplément de recouvrement (ordre de grandeur : quelques Md€ au
    plus), jamais par la fraude estimée.
  limites: >
    Estimations anciennes (2012-2020) et méthodes différentes (extrapolation des contrôles, contrôles aléatoires,
    écart de TVA de la Commission européenne). La valeur centrale (« une quinzaine de milliards ») est une
    estimation arrondie de la Cour, non une mesure.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Extraits relus : Cour des comptes 2019 (« une quinzaine de milliards d'euros »), blog Insee (20 à 26 Md€ en
      2012), HCFiPS (4 à 5 % de la TVA collectée selon la DGFiP). Mention du contrôle fiscal 2025 rattachée au
      dossier de presse DGFiP (source primaire) au lieu de LégiFiscal.

