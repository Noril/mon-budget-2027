  unite: Md€ courants par an
  annee: "2026 (DPT PLF 2026) ; bas = mission IAI 2026 ; haut = coût net OID (2025, périmètre différent)"
  sources:
    - titre: "Sénat, rapport général PLF 2026, Immigration, asile et intégration (reprend le DPT)"
      url: https://www.senat.fr/rap/l25-139-315/l25-139-315_mono.html
      date: "2025-11"
      extrait: "Le coût estimé de la politique française de l'immigration et de l'intégration est de 7,82 milliards d'euros en 2026 17 ( * ) , un niveau en légère hausse par rapport à 2025 (7,74 milliards d'euros)."
    - titre: "Sénat, même rapport (crédits de la mission)"
      url: https://www.senat.fr/rap/l25-139-315/l25-139-315_mono.html
      date: "2025-11"
