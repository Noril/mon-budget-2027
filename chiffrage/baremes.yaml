      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Le montant des ressources annuelles supplémentaires pour le système de retraites issues d’une augmentation d’un point du taux de cotisations serait compris entre 4,8 Md€ et 7,6 Md€"
  derivation: >
    Tableau n° 8 de la Cour (DSS), rendement brut 2025 : salariale sous plafond 6,2 ; patronale sous plafond 4,8
    (moindre à cause des allègements généraux, compensés par l'État) ; salariale déplafonnée 7,6 ; patronale
    déplafonnée 6,2. Valeur centrale : 6,2 (salariale sous plafond ou patronale déplafonnée). Projection 2032 :
    × 1,2106 (croissance du PIB nominal 2025-2032, masse salariale supposée suivre le PIB) ≈ 7,5 Md€ (5,8 à 9,2).
  limites: >
