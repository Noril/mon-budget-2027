    rapport démographique 20-64 ans / 65 ans et plus (2,5 en 2025 selon le COR).

- id: retraites_minimum_contributif_hausse_100e
  libelle: Coût d'une hausse de 100 € par mois du minimum contributif (Mico) et de la pension minimale agricole, carrière complète, stock et flux
  valeur: 1.6
  unite: Md€ par an (régimes de base)
  annee: "2026 (étude d'impact 2023)"
  sources:
    - titre: Projet de loi de financement rectificative de la sécurité sociale pour 2023, étude d'impact (article 10)
      url: https://www.assemblee-nationale.fr/dyn/16/textes/l16b0760_etude-impact.pdf
      date: "2023-01-23"
      extrait: "Au total, l’impact des mesures est évalué à 440 M€ en 2023, compte tenu de leur entrée en vigueur en septembre 2023. Il s’élèverait, selon les estimations à 1,4 Md€ en 2024, 1,5 Md€ en 2025 et 1,6 Md€ en 2026"
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025 (montant du Mico)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "le minimum contributif est de 733,03 € par mois en 2024, proratisé en cas de carrière incomplète."
    - titre: COR, Rapport annuel juin 2026 (objectif légal de 85 % du SMIC net)
      url: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
      date: "2026-06"
      extrait: "un montant brut mensuel total des pensions de vieillesse de droit personnel au moins égal à 85 % du montant mensuel du salaire minimum de croissance net"
  derivation: >
    Lu dans l'étude d'impact de la réforme 2023 (revalorisation de 100 € du Mico et de la PMR, proratisée pour les
    carrières incomplètes, plus AVPF et CD de RCO) : 1,6 Md€ en 2026, dont environ 1,3 Md€ pour les pensions déjà
    liquidées. Pour une hausse de x € : 1,6 × x / 100, ordre de grandeur. Projection 2032 : croît avec le nombre de
    bénéficiaires et l'indexation (non documenté ; garder 1,6 à 2,0 Md€ par tranche de 100 €).
  limites: >
    Le nombre de bénéficiaires et la dépense totale au titre du Mico n'ont pas pu être relevés dans une source ouverte
    accessible (pages DREES refusées au téléchargement). La Cour des comptes a relevé depuis que les gains effectifs
    pour les retraités déjà partis sont inférieurs aux 100 € annoncés. Une promesse de pension minimale à 1 200 € ou
    au niveau du SMIC pour tous (et non pour les seules carrières complètes) n'est pas couverte par ce barème et
    demande un chiffrage propre. Linéarité : 1,6 × x / 100 ne vaut que pour une hausse modeste (≤ 100 à 150 €) ;
    au-delà, la hausse fait entrer dans le dispositif des pensionnés aujourd'hui au-dessus du minimum (effet de
    seuil croissant) et le coût progresse plus vite que x. Pour un minimum à 85 % ou 100 % du Smic, chiffrer sur
    la distribution des pensions (DREES, EIR). Net des retours : × (1 − 0,08) (bas de retour_prelevements_pensions,
    petites pensions).

- id: retraites_cotisation_vieillesse_1_point
  libelle: Rendement d'une hausse d'un point de cotisation vieillesse de base au régime général
  valeur: 6.2
  bas: 4.8
  haut: 7.6
  unite: Md€ par an par point de cotisation
  annee: "2025"
  sources:
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025 (tableau n° 8, source DSS)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Le montant des ressources annuelles supplémentaires pour le système de retraites issues d’une augmentation d’un point du taux de cotisations serait compris entre 4,8 Md€ et 7,6 Md€"
  derivation: >
    Tableau n° 8 de la Cour (DSS), rendement brut 2025 : salariale sous plafond 6,2 ; patronale sous plafond 4,8
    (moindre à cause des allègements généraux, compensés par l'État) ; salariale déplafonnée 7,6 ; patronale
    déplafonnée 6,2. Valeur centrale : 6,2 (salariale sous plafond ou patronale déplafonnée). Choix selon la
    promesse : cotisation salariale sous plafond 6,2 ; salariale déplafonnée 7,6 (haut) ; patronale sous plafond
    4,8 (bas, rendement réduit par les allègements) ; patronale déplafonnée 6,2. Une promesse sans précision se lit
    au central. Projection 2032 :
    × 1,2106 (croissance du PIB nominal 2025-2032, masse salariale supposée suivre le PIB) ≈ 7,5 Md€ (5,8 à 9,2).
  limites: >
    Rendement brut, sans effet sur l'emploi ni les salaires (règle 3). La hausse de cotisation salariale réduit
    l'assiette de l'impôt sur le revenu (retour négatif ≈ 10 à 15 % du rendement, même convention que l'effet IR
    de la CSG déductible, voir csg_point) ; une hausse de cotisation patronale sur les employeurs publics est un
    transfert interne aux APU (à exclure).

