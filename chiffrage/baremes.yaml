- id: ir_rendement
  libelle: Rendement net de l'impôt sur le revenu (État)
  valeur: 94.9
  haut: 104.0
  unite: Md€/an
  annee: "2025 (exécution) ; haut = prévision PLF 2026"
  sources:
    - titre: Cour des comptes, Le budget de l'État en 2025 (résultats et gestion), avril 2026
      url: https://www.ccomptes.fr/sites/default/files/2026-04/20260422-RBDE-2025_0.pdf
      date: "2026-04-22"
      extrait: "Les recettes nettes d’impôt sur le revenu (94,9 Md€) ont ainsi progressé de 7,0 Md€, essentiellement sous l’effet de son évolution spontanée (+ 5,9 Md€, soit + 6,8 %)."
    - titre: Sénat, rapport général n° 139 (2025-2026), PLF 2026, tome I (d'après l'annexe Voies et moyens, tome I)
      url: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
      date: "2025-11"
      extrait: "Le produit prévisionnel de l'impôt net sur le revenu pour 2026 est de 104,0 milliards d'euros, en hausse de 9,1 milliards d'euros par rapport à 2025."
  derivation: >
    Lecture directe : IR net (brut moins remboursements et dégrèvements) encaissé par l'État en 2025 = 94,9 Md€.
    Le PLF 2026 prévoyait 104,0 Md€ (dont + 4,2 Md€ d'évolution spontanée et + 4,4 Md€ de mesures nouvelles, notamment
    le gel du barème), retenu en `haut`. Pour 2032 à législation constante, multiplier au moins par le facteur PIB
    nominal 1,2106 (≈ 115 Md€ depuis 2025) ; l'élasticité de l'IR au revenu étant supérieure à 1 quand le barème est
    indexé sur les prix, c'est un minimum.
  limites: >
    Ne comprend ni la CSG ni la CRDS (voir csg_rendement) ni les prélèvements sociaux. Le PLF 2026 a été amendé ;
    le produit voté en LFI 2026 peut différer de 104,0 Md€.

- id: ir_indexation_1pct
  libelle: Coût d'un relèvement de 1 % des seuils du barème de l'IR (sur-indexation de 1 point)
  valeur: 1.7
  bas: 1.5
  haut: 2.1
  unite: Md€/an par point d'indexation
  annee: "2026"
  sources:
    - titre: Sénat, rapport général n° 139 (2025-2026), PLF 2026, tome I (chiffrage des mesures nouvelles, Voies et moyens tome I)
      url: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
      date: "2025-11"
      extrait: "L'augmentation attendue du produit de l'impôt liée à cette absence d'indexation est de 1,9 Md€"
    - titre: Même rapport, hypothèse d'inflation 2025 du Gouvernement
      url: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
      date: "2025-11"
      extrait: "soit un léger regain par rapport au taux estimé de 1,1 % en 2025"
  derivation: >
    Le gel du barème (absence d'indexation sur l'inflation 2025, estimée à 1,1 %) rapporte 1,9 Md€ selon le chiffrage
    des mesures nouvelles du PLF 2026. Un point d'indexation vaut donc 1,9 / 1,1 ≈ 1,7 Md€ (année 2026). `bas` et
    `haut` : même calcul avec une inflation de référence de 1,3 % (1,5 Md€) et 0,9 % (2,1 Md€), l'indice exact retenu
    (IPC hors tabac) n'étant pas cité dans la source. Pour 2032, multiplier par le facteur PIB nominal 2026→2032
    (facteur_pib_2026_2032 = 1,1842, le montant étant de 2026) : ≈ 2,0 Md€.
  limites: >
    Relation supposée linéaire. Chiffre ex ante sans effet de comportement. Un relèvement ciblé sur certaines tranches
    coûte moins (ou plus) qu'un relèvement uniforme.

- id: ir_baisse_1pct
  libelle: Coût d'une baisse uniforme de 1 % de l'impôt sur le revenu dû
  valeur: 1.04
  bas: 0.95
  haut: 1.26
  unite: Md€/an
  annee: "2026"
  sources:
    - titre: Sénat, rapport général n° 139 (2025-2026), PLF 2026, tome I
      url: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
      date: "2025-11"
      extrait: "Le produit prévisionnel de l'impôt net sur le revenu pour 2026 est de 104,0 milliards d'euros, en hausse de 9,1 milliards d'euros par rapport à 2025."
    - titre: Cour des comptes, Le budget de l'État en 2025, avril 2026
      url: https://www.ccomptes.fr/sites/default/files/2026-04/20260422-RBDE-2025_0.pdf
      date: "2026-04-22"
      extrait: "Les recettes nettes d’impôt sur le revenu (94,9 Md€)"
  derivation: >
    1 % du produit net de l'IR : 0,01 × 104,0 = 1,04 Md€ (PLF 2026). `bas` = 0,01 × 94,9 (exécution 2025) ;
    `haut` = 0,01 × 104,0 × 1,2106 ≈ 1,26 Md€ (projection 2032 au PIB nominal). Pour une baisse de x % des taux de
    toutes les tranches, multiplier par x. À distinguer de ir_indexation_1pct (relèvement des seuils).
  limites: >
    Approximation : une baisse proportionnelle des taux réduit l'impôt brut, pas les crédits d'impôt remboursables
    (inclus dans les remboursements et dégrèvements) ; le coût réel est donc un peu supérieur à 1 % du produit net
    (l'IR brut est de l'ordre de 130 Md€). Décote et plafonnement du quotient familial non modélisés.

- id: ifi_rendement
  libelle: Rendement de l'impôt sur la fortune immobilière (IFI)
  valeur: 2.8
  unite: Md€/an
  annee: "2025 (exécution)"
  sources:
    - titre: Cour des comptes, note d'analyse de l'exécution budgétaire 2025, Recettes fiscales, avril 2026
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "Impôt sur la fortune immobilière 2,7 2,8 + 0,1 0 + 0,1"
  derivation: >
    Lecture du tableau des autres recettes fiscales brutes : exécution 2024 = 2,7 Md€, exécution 2025 = 2,8 Md€
    (+ 0,1 Md€ d'évolution spontanée). Projection 2032 au PIB nominal : 2,8 × 1,2106 ≈ 3,4 Md€.
  limites: >
    Comprend les rappels issus du contrôle fiscal (0,4 à 0,5 Md€ par an en 2018-2020 selon France Stratégie).
    La supprimer (rétablissement de l'ISF) est à déduire du rendement brut d'un ISF (voir isf_retabli_gain_net).

- id: isf_2017_rendement
  libelle: Rendement de l'impôt de solidarité sur la fortune (ISF) en 2017, dernière année
  valeur: 4.1
  haut: 4.17
  unite: Md€/an
  annee: "2017"
  sources:
    - titre: France Stratégie, Comité d'évaluation des réformes de la fiscalité du capital, troisième rapport, octobre 2021
      url: https://www.strategie.gouv.fr/files/files/Publications/2021/1014%20Reforme%20de%20la%20fiscalit%C3%A9%20du%20capital/fs-2021-troisieme_rapport-fiscalite_du_capital-octobre.pdf
      date: "2021-10"
      extrait: "Le remplacement de l’ISF par l’IFI devait coûter 3,2 milliards au budget de l’État – 850 millions de recettes d’IFI attendues en 2018 contre 4,1 milliards d’ISF nets perçus en 2017."
  derivation: >
    ISF net perçu en 2017 : 4,1 Md€ (texte du rapport). Le tableau DGFiP du même rapport (montant total de
    l'ISF/IFI de l'ensemble des redevables) donne 4,17 Md€ pour 2017, retenu en `haut`. Base nette imposable 2017 :
    1 017 Md€ (même tableau).
  limites: >
    Montant après plafonnement et réductions (ISF-PME, dons) de l'époque. En euros 2017 : à revaloriser pour toute
    comparaison (voir isf_retabli_gain_net).

- id: isf_retabli_gain_net
  libelle: Gain net pour les finances publiques d'un rétablissement de l'ISF 2017 (suppression de l'IFI déduite), en 2032
  valeur: 3.1
  bas: 1.3
  haut: 5.1
  unite: Md€/an (2032)
  annee: "2032 (projection depuis 2017 et 2025)"
  indicateur: finances.pib_nominal@1.0.0
  sources:
    - titre: France Stratégie, Comité d'évaluation des réformes de la fiscalité du capital, troisième rapport (ISF 2017, base imposable, départs)
      url: https://www.strategie.gouv.fr/files/files/Publications/2021/1014%20Reforme%20de%20la%20fiscalit%C3%A9%20du%20capital/fs-2021-troisieme_rapport-fiscalite_du_capital-octobre.pdf
      date: "2021-10"
      extrait: "Ensemble des redevables ISF/IFI Base nette totale imposable en N (Md€) 761 774 837 904 948 985 1 017 310 332"
    - titre: Cour des comptes, NEB 2025 Recettes fiscales (IFI 2025)
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "Impôt sur la fortune immobilière 2,7 2,8 + 0,1 0 + 0,1"
  derivation: >
    Gain net = ISF rétabli (paramètres 2017) − IFI supprimé. Central : ISF 2017 (4,1 Md€) revalorisé comme le PIB
    nominal 2017 → 2032 (2 291,7 Md€ → 3 620,9 Md€, facteur 1,580 ; finances.pib_nominal@1.0.0 et
    plan/hypotheses.yaml) = 6,48 Md€, moins l'IFI 2025 projeté en 2032 (2,8 × 1,2106 = 3,39 Md€) = 3,1 Md€.
    Haut : base ISF croissant comme de 2011 à 2017 (761 → 1 017 Md€, + 4,95 %/an), soit × 2,065 sur 15 ans :
    4,1 × 2,065 = 8,47 Md€ − 3,39 = 5,1 Md€. Bas : rendement nominal 2017 non revalorisé (4,1 Md€), ce qui figure
    une érosion de l'assiette par départs et optimisation, moins l'IFI 2025 non projeté (2,8 Md€) = 1,3 Md€.
  limites: >
    Aucun chiffrage public récent d'un ISF rétabli n'a été trouvé ; les montants avancés dans le débat public
    (programmes, taxe plancher de type Zucman sur les patrimoines de plus de 100 M€) portent sur d'autres assiettes
    et barèmes et ne doivent pas être pris pour ce barème. Effets de comportement (départs, qui avaient baissé
    fortement après 2017 selon les données DGFiP du rapport ; optimisation, report de dividendes) non chiffrés :
    le bas est une convention prudente, pas une estimation. Un « ISF climatique » ou à barème plus lourd se chiffre
    à part.

- id: dmtg_rendement
  libelle: Rendement des droits de mutation à titre gratuit (successions et donations)
  valeur: 21.4
  bas: 20.8
  unite: Md€/an
  annee: "2026 (PLF) ; bas = 2025"
  sources:
    - titre: Sénat, rapport général n° 139 (2025-2026), PLF 2026, tome I (d'après les documents budgétaires)
      url: https://www.senat.fr/rap/l25-139-1/l25-139-1_mono.html
      date: "2025-11"
      extrait: "Le produit global des DMTG, en incluant les donations entre vifs, serait de 21,4 Mds€ en 2026, soit plus du double de 2014 (10,3 Mds€)."
    - titre: Cour des comptes, Le budget de l'État en 2025, avril 2026 (tableau n° 22)
      url: https://www.ccomptes.fr/sites/default/files/2026-04/20260422-RBDE-2025_0.pdf
      date: "2026-04-22"
      extrait: "dont droit de mutation à titre gratuit** 20,8 4,5 20,7 %"
  derivation: >
    PLF 2026 : successions 16 995 M€ + donations 4 423 M€ = 21,4 Md€ (tableau du rapport du Sénat, lignes 1706 et
    1705). 2025 : 20,8 Md€ selon la Cour (dépenses fiscales associées, dont pacte Dutreil : 4,5 Md€). Successions
    seules ≈ 17,0 Md€. Projection 2032 au PIB nominal : 21,4 × 1,2106 / (1 + croissance nominale 2026 ≈ 2,2 %) ≈ 25 Md€ ;
    tendance historique plus rapide (× 2 entre 2014 et 2026).
  limites: >
    Recette volatile (marché immobilier et financier, décès). Une réforme du barème en ligne directe ou des
    abattements se chiffre sur les données DGFiP par tranche, non disponibles ici.

- id: pfu_passage_bareme
  libelle: Gain d'une suppression du prélèvement forfaitaire unique (retour au barème de l'IR des revenus mobiliers), en 2032
  valeur: 0.6
  bas: 0.0
  haut: 1.7
  unite: Md€/an (2032)
  annee: "2032 (projection du coût statique 2018)"
  sources:
    - titre: France Stratégie, Comité d'évaluation des réformes de la fiscalité du capital, troisième rapport, octobre 2021
      url: https://www.strategie.gouv.fr/files/files/Publications/2021/1014%20Reforme%20de%20la%20fiscalit%C3%A9%20du%20capital/fs-2021-troisieme_rapport-fiscalite_du_capital-octobre.pdf
      date: "2021-10"
      extrait: "Bach et al. (2019) chiffrent le coût statique de la réforme entre 600 et 900 millions d’euros, contre 1 050 millions pour Sicsic et Paquier (2021)."
    - titre: Même rapport, autofinancement du PFU
      url: https://www.strategie.gouv.fr/files/files/Publications/2021/1014%20Reforme%20de%20la%20fiscalit%C3%A9%20du%20capital/fs-2021-troisieme_rapport-fiscalite_du_capital-octobre.pdf
      date: "2021-10"
      extrait: "La réforme s’autofinancerait donc pour une augmentation causale de dividendes comprise entre 2 et 3 milliards d’euros"
  derivation: >
    Coût statique du PFU en 2018 (comportements de 2017) : 0,6 à 0,9 Md€ (IPP) ou 1,05 Md€ (Insee, Sicsic et Paquier).
    Revalorisé au PIB nominal 2017 → 2032 (facteur 1,580) : 0,95 à 1,66 Md€. Haut = 1,05 × 1,580 ≈ 1,7 Md€ (aucune
    réaction des dividendes). Bas = 0 : la hausse observée des dividendes après 2018 (de 14 à 23 Md€) dépasse
    largement le seuil d'autofinancement, et la baisse symétrique de 2013 montre qu'un retour au barème réduirait
    fortement les distributions. Central = moitié du coût statique IPP moyen revalorisé : 0,5 × 0,75 × 1,580 ≈ 0,6 Md€
    (convention, faute d'estimation causale précise).
  limites: >
    Le coût statique inclut la hausse de 1,7 point de CSG de 2018 ; il ne se lit pas comme le seul effet du taux de
    12,8 %. La LFSS 2026 a porté la CSG sur la plupart des revenus du capital à 10,6 % (PFU à 31,4 %) : le point de
    départ 2027 diffère de 2018. Rendement total du PFU non isolé dans les sources publiques consultées. Convention
    centrale à trancher.

- id: hs_exoneration_cout
  libelle: Coût des exonérations sur les heures supplémentaires (IR, cotisations salariales, déduction patronale)
  valeur: 5.4
  bas: 5.2
  unite: Md€/an
  annee: "2026 (prévision) ; bas = 2024"
  sources:
    - titre: Cour des comptes, NEB 2025 Dépenses fiscales, avril 2026 (dépense fiscale n° 120146)
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Depenses-fiscales.pdf
      date: "2026-04"
      extrait: "120146 Exon. heures supplémentaires 7 2 144 ▲1 6 2 212 8 2 250"
    - titre: PLFSS 2026, annexe 4 (exonérations et exemptions de cotisations)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10"
      extrait: "Exonération sur les heures supplémentaires - part salariale 2 228 2 254 1,2% 2 306 2,3%"
    - titre: PLFSS 2026, annexe 4 (déduction forfaitaire patronale)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10"
      extrait: "Déductions sur les heures supplémentaires (entreprises de moins 250 salariés) 865 868 0,4% 872 0,5%"
    - titre: "DARES Analyses n° 32, « Les heures supplémentaires rémunérées : quels salariés, quelles entreprises ? », juin 2025"
      url: https://dares.travail-emploi.gouv.fr/publication/les-heures-supplementaires-remunerees-quels-salaries-quelles-entreprises
      date: "2025-06"
      extrait: "En 2023, 8,8 millions de salariés effectuent des heures supplémentaires rémunérées, soit 53 % des salariés à temps complet du secteur privé dont le temps de travail est décompté en heures. Les salariés concernés … en effectuent en moyenne 104 dans l'année, pour un peu plus de 1 900 euros brut."
  derivation: >
    2026 : IR 2 250 M€ + exonération de cotisations salariales 2 306 M€ + déduction forfaitaire de cotisations
    patronales (entreprises de moins de 250 salariés) 872 M€ = 5 428 M€ ≈ 5,4 Md€. 2024 : 2 144 + 2 228 + 865 =
    5,24 Md€. Suppression totale : + 5,4 Md€ ; suppression du seul volet fiscal : + 2,25 Md€ ; du volet salarial :
    + 2,3 Md€.
  limites: >
    Chiffrages statiques : une suppression réduirait le recours aux heures supplémentaires et donc le gain. La part
    salariale n'est pas compensée à la sécurité sociale, la déduction patronale l'est par l'État : le coût APU est la
    somme. Volume (DARES, 2023) : 8,8 millions de salariés × 104 heures ≈ 0,9 milliard d'heures supplémentaires
    rémunérées, ≈ 16,7 Md€ brut (1 900 € par salarié) ; 1,6 million de salariés à temps partiel font en outre
    33 heures complémentaires en moyenne. Aucune source ouverte ne ventile les heures par tranche de majoration
    (25 % pour les huit premières heures hebdomadaires, 50 % au-delà) : une mesure ciblée sur une tranche reste à
    chiffrer au prorata, en convention. Le Sénat (rapport PLFSS 2026) chiffre la part salariale à 2,5 Md€, contre
    2,3 Md€ dans l'annexe 4 : écart de millésime.

- id: csg_rendement
  libelle: Rendement total de la CSG (brut, tous attributaires)
  valeur: 157.2
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, fiche 1.3 La CSG
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "Son montant a atteint 157,2 Md€ pour l’ensemble de ses attributaires (branches famille, maladie et autonomie, FSV, Cades et Unédic)."
  derivation: >
    Lecture directe, CSG brute avant charges de non-recouvrement (nette : 156,5 Md€). 2026 (p) : 156,2 Md€, en baisse
    du fait de la réforme de l'assiette des travailleurs indépendants. Répartition 2025 : revenus du capital 11,2 % du
    total. Projection 2032 au PIB nominal : 157,2 × 1,2106 ≈ 190 Md€.
  limites: Hors CRDS (0,5 %) et prélèvement de solidarité (7,5 % sur le capital, recette de l'État).

- id: csg_point
  libelle: Rendement d'un point de CSG sur toutes les assiettes
  valeur: 17.94
  unite: Md€ par point de taux
  annee: "2025"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, tableau 6 (valeur de point de la CSG par assiette)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "Activité 11 760 12 030 11 710 Remplacement 3 770 3 900 4 020 Capital 1 920 1 910 1 940 Patrimoine 750 810 690 Placement 1 170 1 100 1 250 Jeux 100 100 100 CSG totale 17 550 17 940 17 770"
  derivation: >
    Valeur de point = rendement de la CSG de chaque assiette / taux facial (note de lecture du tableau). 2025, en
    M€ par point : activité 12 030, remplacement 3 900, capital 1 910 (patrimoine 810, placements 1 100), jeux 100 ;
    total 17 940 M€. Un point sur les seuls revenus du capital : 1,9 Md€. Projection 2032 au PIB nominal :
    17,94 × 1,2106 ≈ 21,7 Md€.
  limites: >
    Valeur mécanique sans effet de comportement. Sur les revenus de remplacement, un point au taux plein ne touche
    pas les retraités exonérés ou au taux réduit. Effet IR de la CSG déductible (non compté dans la valeur) : la
    CSG est déductible de l'IR pour 6,8 points sur 9,2 sur les revenus d'activité, 5,9 points sur 8,3 sur les
    pensions au taux plein et 6,8 points sur les revenus du patrimoine imposés au barème. Une baisse d'un point
    de CSG déductible relève d'autant le revenu imposable, donc l'IR : retour ≈ assiette × taux marginal moyen
    pondéré par les revenus. Aucune source administrative publiée trouvée ; ordre de grandeur retenu par
    convention : 10 à 15 % du rendement du point (le taux marginal des foyers imposables est de 11 % ou 30 %,
    un peu moins de la moitié des foyers sont imposables), soit ≈ 1,2 à 1,8 Md€ par point de CSG d'activité déductible. Coût net pour
    les APU d'une baisse d'un point de CSG déductible sur les revenus d'activité ≈ 11,71 × (1 − 0,12) ≈ 10,3 Md€
    en 2026 ; nul effet IR si la baisse porte sur la part non déductible (2,4 points).

