- id: non_remplacement_un_sur_deux_etat
  libelle: Économie annuelle du non-remplacement d'un départ à la retraite sur deux dans les ministères (par année d'application, cumulative)
  valeur: 0.9
  bas: 0.45
  haut: 1.6
  unite: Md€ par an supplémentaires pour chaque année d'application (s'additionnent d'une année sur l'autre)
  annee: "2015 (Cour des comptes), 2024-2026 (départs et coûts)"
  sources:
    - titre: Cour des comptes, La masse salariale de l'État, enjeux et leviers, juillet 2015
      url: https://www.ccomptes.fr/sites/default/files/EzPublish/20150909-rapport-masse-salariale-Etat.pdf
      date: "2015-07"
      extrait: "À titre illustratif, la reprise d’un objectif de non-remplacement d’un départ à la retraite sur deux permettrait une économie annuelle d’environ 750 M€."
    - titre: Cour des comptes, même rapport, bilan de la RGPP
      url: https://www.ccomptes.fr/sites/default/files/EzPublish/20150909-rapport-masse-salariale-Etat.pdf
      date: "2015-07"
      extrait: "Elle a dégagé une économie brute moyenne de 840 M€ par an sur la période 2008-2012, soit un total cumulé de 4,2 Md€, équivalent à 4,8 % de la masse salariale de l’État."
    - titre: DGAFP, Fonction publique, chiffres clés, édition 2025 (départs 2024)
      url: https://www.fonction-publique.gouv.fr/files/files/publications/rapport-annuel/cc-2025-web.pdf
      date: "2025"
  derivation: >
    Central : 750 M€ (Cour, 2015) actualisés par la hausse de la masse salariale de l'État hors pensions depuis
    2015 (environ +20 %), soit 0,9 Md€. Haut : calcul direct 2024-2026 : (38 800 fonctionnaires civils + 11 800
    militaires) / 2 = 25 300 postes non pourvus par an × coût d'entrée complet d'environ 60 000 € (coût d'entrée
    hors CAS 38 000-40 000 € + CAS) ≈ 1,5-1,6 Md€. Bas : moitié de l'économie rétrocédée aux agents en mesures
    catégorielles, principe de la RGPP (0,45 Md€). Au bout de cinq ans : environ 5 fois la valeur annuelle.
  limites: >
    Montant en coût budgétaire de l'État (CAS Pensions compris), pas en effet sur le solde des APU : avec la
    convention des barèmes cout_*_apu (entrant ≈ 24 100 €), 25 300 postes représentent plutôt ≈ 0,6 Md€ par an.
    Ministères seulement (FPT et FPH hors de la main de l'État). Suppose que les postes non remplacés ne sont pas
    compensés par des contractuels, des heures supplémentaires ou de la sous-traitance (la Cour note la hausse des
    heures supplémentaires après 2008). Le nombre de départs baisse avec le recul de l'âge de départ.

