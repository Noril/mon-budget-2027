  derivation: >
    Lecture directe (CCSS, M€ ; colonnes 2024, évolution, 2025, évolution, 2026 prévision) : 5 228 M€ en 2024,
    5 337 M€ en 2025, 5 454 M€ prévus en 2026. Valeur = 2024 (5,2) ; haut = 2025 (5,34). Affectée à la sécurité
    sociale. Coût d'une suppression ≈ 5,2 à 5,3 Md€ ; projection 2032 : 5,2 × 1,2336 (facteur_pib_2024_2032)
    ≈ 6,4 Md€, ou 5,34 × 1,2106 ≈ 6,5 Md€.
