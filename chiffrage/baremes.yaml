    (programmes, taxe plancher de type Zucman sur les patrimoines de plus de 100 M€) portent sur d'autres assiettes
    et barèmes et ne doivent pas être pris pour ce barème. Effets de comportement (départs, qui avaient baissé
    fortement après 2017 selon les données DGFiP du rapport ; optimisation, report de dividendes) non chiffrés :
    le bas est une convention prudente, pas une estimation. Un « ISF climatique » ou à barème plus lourd se chiffre
    à part.

