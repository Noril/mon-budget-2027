- id: point_indice_1pct
  libelle: Coût en année pleine d'une hausse de 1 % de la valeur du point d'indice (trois versants)
  valeur: 2.2
  bas: 2.17
  haut: 2.5
  unite: Md€ par an pour 1 % de hausse, toutes APU
  annee: "2023 (coût des revalorisations 2022 et 2023)"
  sources:
    - titre: Sénat, avis sur le PLF 2026, Fonction publique (a25-145-5)
      url: https://www.senat.fr/rap/a25-145-5/a25-145-5.html
      date: "2025-11"
      extrait: "une première revalorisation de 3,5 % du point d'indice 7 ( * ) , dont le coût est évalué à 7,6 milliards d'euros en année pleine pour l'ensemble de la fonction publique, puis une deuxième revalorisation de 1,5 % à compter du 1 er juillet 2023, pour un coût de 3,4 milliards d'euros en année pleine."
  derivation: >
    7,6 / 3,5 = 2,17 Md€ par point de % (base 2022) ; 3,4 / 1,5 = 2,27 Md€ (base 2023). Valeur centrale
    2,2 Md€. Haut 2,5 Md€ : base 2023 portée à 2027 avec la croissance de la masse salariale APU observée
    2023-2024 (+4,6 %, Eurostat D1) puis environ 2 % par an, soit 2,27 × 1,046 × 1,02³ ≈ 2,5 Md€. Pour 2032,
    multiplier par le rapport masse salariale 2032 / 2023 (à part de PIB constante : PIB 2032 / PIB 2023 =
    3 621 / 2 834 ≈ 1,28, soit ≈ 2,9 Md€).
  limites: >
    Coût brut pour les employeurs publics (État, collectivités, hôpitaux), cotisations employeurs comprises ; ne
    déduit pas les prélèvements qui reviennent aux APU (CSG, cotisations salariales, IR), qui réduisent le coût
    net d'environ un quart. Le point d'indice ne s'applique ni aux primes ni aux contractuels hors grille.

