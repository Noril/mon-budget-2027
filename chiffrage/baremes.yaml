  derivation: >
    Lecture directe, CSG brute avant charges de non-recouvrement (nette : 156,5 Md€). 2026 (p) : 156,2 Md€, en baisse
    du fait de la réforme de l'assiette des travailleurs indépendants. Répartition 2025 : revenus du capital 11,2 % du
    total. Projection 2032 au PIB nominal : 157,2 × 1,2106 ≈ 190 Md€.
  limites: Hors CRDS (0,5 %) et prélèvement de solidarité (7,5 % sur le capital, recette de l'État).

- id: csg_point
  libelle: Rendement d'un point de CSG sur toutes les assiettes
  valeur: 17.94
  unite: Md€ par point de taux
  annee: "2025"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, tableau 6 (valeur de point de la CSG par assiette)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "Activité 11 760 12 030 11 710 Remplacement 3 770 3 900 4 020 Capital 1 920 1 910 1 940 Patrimoine 750 810 690 Placement 1 170 1 100 1 250 Jeux 100 100 100 CSG totale 17 550 17 940 17 770"
  derivation: >
    Valeur de point = rendement de la CSG de chaque assiette / taux facial (note de lecture du tableau). 2025, en
    M€ par point : activité 12 030, remplacement 3 900, capital 1 910 (patrimoine 810, placements 1 100), jeux 100 ;
    total 17 940 M€. Un point sur les seuls revenus du capital : 1,9 Md€. Projection 2032 au PIB nominal :
    17,94 × 1,2106 ≈ 21,7 Md€.
  limites: >
    Valeur mécanique sans effet de comportement. Sur les revenus de remplacement, un point au taux plein ne touche
    pas les retraités exonérés ou au taux réduit. La CSG étant en partie déductible de l'IR (6,8 points sur les
    revenus d'activité), une hausse de CSG déductible réduit un peu le produit de l'IR (non compté ici).

- id: csg_point_activite
  libelle: Rendement d'un point de CSG sur les revenus d'activité
  valeur: 12.03
  unite: Md€ par point de taux
  annee: "2025"
  sources:
    - titre: Commission des comptes de la sécurité sociale, rapport de mai 2026, tableau 6
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "Activité 11 760 12 030 11 710"
  derivation: >
    Valeur de point 2025 de la CSG sur les revenus d'activité (taux facial 9,2 %) : 12 030 M€. 2026 (p) : 11 710 M€
    après la réforme de l'assiette des indépendants. Sert aussi à chiffrer une bascule cotisations salariales → CSG.
    Projection 2032 : 12,03 × 1,2106 ≈ 14,6 Md€.
  limites: Voir csg_point (déductibilité partielle de l'IR, pas d'effet de comportement).

