    Trajectoire des crédits de paiement hors pensions : 63,3 Md€ en 2027, 69,5 en 2028, 72,6 en 2029, 75,7 en
    2030 (436 Md€ sur 2024-2030, dont 36 Md€ de ressources nouvelles sur 2026-2030 par rapport à la loi de 2023).
    Une promesse ne se chiffre qu'au-delà de cette trajectoire. Au-delà de 2030, la loi ne programme pas de
    crédits : l'objectif de 3,5 % du PIB en 2035 est un objectif du rapport annexé, pas une trajectoire votée.
    Pour un objectif en points de PIB, utiliser defense_0_1_point_pib_2032.
  indicateur: defense.depenses_defense_pib@1.0.0
  limites: >
    Crédits budgétaires de la mission hors pensions : différent de la dépense de défense COFOG (1,9 % du PIB en
    2024, indicateur du dépôt) et de la définition OTAN (pensions comprises). Les restes à payer et reports de
    charges (environ 8 Md€ fin 2025) rendent l'exécution annuelle incertaine.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      La LPM actualisée est promulguée (loi n° 2026-791 du 16 août 2026, JORF du 18 août ; texte lu dans la copie du
      JO) : trajectoire de crédits de paiement 63,3 / 69,5 / 72,6 / 75,7 Md€ de 2027 à 2030, 436 Md€ au total dont
      36 Md€ nouveaux. Source « projet de loi » remplacée par la loi ; valeur 57,15 inchangée.

