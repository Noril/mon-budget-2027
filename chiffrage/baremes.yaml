      url: https://www.service-public.gouv.fr/particuliers/vosdroits/F16871
      date: "2026-06-23"
      extrait: "1 043,59 € par mois"
    - titre: Institut Montaigne, législatives 2024, Nouveau Front populaire (minimum vieillesse au seuil de pauvreté)
      url: https://www.institutmontaigne.org/legislatives-2024/nouveau-front-populaire/abroger-la-reforme-des-retraites-restaurer-la-retraite-a-60-ans-en-prenant-en-compte-le-rsa-en-portant-le-minimum-contributif-au-smic/
      date: "2024-07"
