# Barèmes communs de chiffrage (schéma : schemas/bareme.schema.json). Voir chiffrage/README.md.
#
# Conventions :
# - coûts et rendements en valeur positive ; le signe (coût < 0) se met dans la mesure du programme ;
# - `bas` et `haut` sont la plus petite et la plus grande valeur plausible du barème, pas la convention
#   défavorable/favorable au solde qui vaut pour les mesures ;
# - montants en Md€ courants de l'année indiquée dans `annee` ; pour 2032, facteur PIB nominal 2025→2032 = 1,2106
#   (PIB 2025 finances.pib_nominal@1.0.0, croissance et déflateur de plan/hypotheses.yaml, FMI WEO avril 2026),
#   sauf quand la derivation dit autrement (énergie, TICPE : volumes et prix, pas PIB) ;
# - sources récupérées et extraits relus le 29 septembre 2026 ; budget.gouv.fr bloquait alors les robots : quelques
#   URL de documents budgétaires pointent vers la page d'index de l'exercice (signalé dans `limites`).

# ====================================================================================================
# Fiscalité indirecte et entreprises
# ====================================================================================================

- id: tva_rendement_total
  libelle: "Rendement net total de la TVA, toutes administrations publiques"
  valeur: 209
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "FIPECO, fiche « La taxe sur la valeur ajoutée » (mise à jour 2026)"
      url: https://www.fipeco.fr/fiche/La-taxe-sur-la-valeur-ajout%C3%A9e
      extrait: "Son rendement, net des remboursements, s’est élevé à 209 Md€ en 2025 (208 Md€ en 2024) pour l’ensemble des administrations publiques dont : 99 Md€ affectés à l’Etat ou à ses opérateurs, soit désormais moins de la moitié ; 57 Md€ à la sécurité sociale et 53 Md€ aux administrations publiques locales."
  derivation: >
    Lecture directe (comptabilité nationale, INSEE, nette des remboursements). Répartition 2025 : État et
    opérateurs 99 Md€, sécurité sociale 57 Md€, APUL 53 Md€. Projection 2032 à structure inchangée :
    209 × 1,2106 (facteur PIB nominal 2025→2032, plan/hypotheses.yaml, FMI WEO avril 2026) ≈ 253 Md€.
  limites: >
    FIPECO est une source secondaire (reprise des comptes INSEE). En comptabilité budgétaire, la TVA nette de
    l'État est de 98 Md€ en 2025. Toute mesure de TVA touche les trois sous-secteurs via les fractions affectées.

- id: tva_point_taux_normal
  libelle: "Rendement d'un point de TVA au taux normal (20 % → 21 %), net de la TVA payée par les APU"
  valeur: 7.5
  haut: 8.9
  unite: Md€ par point de taux normal et par an
  annee: "2025"
  sources:
    - titre: "DG Trésor, Trésor-Éco n° 371, « Analyse de la composition des recettes de TVA », septembre 2025"
      url: https://www.tresor.economie.gouv.fr/Articles/c462ac7f-76db-4c33-9bb3-dcc6886ed898/files/f4d0d1ac-fc61-4cf3-ab3f-094385b218bd
      date: "2025-09"
      extrait: "Tableau 2 : Rendement d’un point TVA 2025 net total et par taux Point TVA Ensemble 2,1% 5,5% 10% 20% Net 2025 (Md€) 11,4 0,4 2,0 1,6 7,5"
  derivation: >
    Tableau 2 du Trésor-Éco : rendement statique net 2025 d'un point au taux normal = 7,5 Md€ (8,9 Md€ brut,
    tableau 1 ; l'écart est la TVA acquittée par les APU elles-mêmes, qui revient en dépense). Valeur retenue :
    net (7,5), cohérent avec un effet sur le solde des APU ; haut = brut (8,9). Symétrique pour une baisse.
    Projection 2032 : × 1,2106 (PIB nominal, plan/hypotheses.yaml) ≈ 9,1 Md€.
  limites: >
    Chiffrage statique (comportements inchangés), hors effets sur les prix et la consommation ; pour une baisse
    d'un point, la transmission aux prix est incomplète mais n'affecte pas le coût budgétaire statique.

- id: tva_point_tous_taux
  libelle: "Rendement d'un point sur tous les taux de TVA (2,1 %, 5,5 %, 10 %, 20 %), net"
  valeur: 11.4
  haut: 13.7
  unite: Md€ par point et par an
  annee: "2025"
  sources:
    - titre: "DG Trésor, Trésor-Éco n° 371, « Analyse de la composition des recettes de TVA », septembre 2025"
      url: https://www.tresor.economie.gouv.fr/Articles/c462ac7f-76db-4c33-9bb3-dcc6886ed898/files/f4d0d1ac-fc61-4cf3-ab3f-094385b218bd
      date: "2025-09"
      extrait: "Par exemple, le rendement net d'une variation d'un point de tous les taux de TVA est estimé à 11,4 Md€ en 2025."
  derivation: >
    Lecture directe (net des APU) ; haut = rendement brut 13,7 Md€ (tableau 1). Par taux, net : 2,1 % → 0,4 ;
    5,5 % → 2,0 ; 10 % → 1,6 ; 20 % → 7,5 Md€.
  limites: "Chiffrage statique."

- id: tva_energie_electricite_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur l'électricité (ménages)"
  valeur: 5.0
  bas: 4.5
  haut: 5.1
  unite: Md€/an de recettes perdues (APU)
  annee: "2024"
  sources:
    - titre: "Public Sénat, « Baisse de la TVA sur l’énergie proposée par le RN : une mesure chiffrée à 17 milliards selon Bercy », 14 juin 2024"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "la baisse de la TVA à 5,5 % sur l’électricité coûterait 4,5 milliards, le gaz (2,3 milliards), les carburants (10 milliards) a estimé vendredi le ministère de l’Economie et des Finances"
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 5.3.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Figure 5.3.3 : consommation finale énergétique dans le secteur résidentiel (données non corrigées des variations climatiques) et dépense associée [...] Électricité 159,7 32 698 155,2 34 377 150,7 36 387 150,9 42 246"
  derivation: >
    Deux estimations. (1) Bercy, juin 2024 : 4,5 Md€ (législation 2024, où l'abonnement était déjà à 5,5 %).
    (2) Recalcul sur la dépense TTC des ménages en électricité 2024 (SDES) : 42,2 Md€ TTC ; TVA à 20 % =
    42,2/6 = 7,04 Md€ ; à 5,5 % sur la même base HT (35,2 Md€) = 1,94 Md€ ; perte = 5,1 Md€. Depuis le 1er août
    2025 l'abonnement est lui aussi taxé à 20 % (loi de finances 2025), ce qui rapproche le coût de ce recalcul.
    Valeur centrale 5,0 Md€ (législation 2027), bas 4,5 (Bercy 2024), haut 5,1 (recalcul SDES).
  limites: >
    Statique, prix 2024 (niveau élevé après la crise) ; hors TVA non déductible du secteur public et des
    activités exonérées ; la directive TVA (2006/112, annexe III) autorise le taux réduit sur l'électricité.
    À projeter selon les prix de l'électricité, pas selon le PIB.

- id: tva_energie_gaz_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur le gaz naturel (ménages)"
  valeur: 2.0
  bas: 1.7
  haut: 2.3
  unite: Md€/an de recettes perdues (APU)
  annee: "2024"
  sources:
    - titre: "Public Sénat, « Baisse de la TVA sur l’énergie proposée par le RN : une mesure chiffrée à 17 milliards selon Bercy », 14 juin 2024"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "la baisse de la TVA à 5,5 % sur l’électricité coûterait 4,5 milliards, le gaz (2,3 milliards), les carburants (10 milliards) a estimé vendredi le ministère de l’Economie et des Finances"
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 5.3.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Gaz naturel 130,5 12 870 11,4 12 496 101,9 13 125 100,2 13 978"
  derivation: >
    (1) Bercy, juin 2024 : 2,3 Md€ (haut). (2) Recalcul sur la dépense TTC des ménages en gaz 2024 (SDES,
    résidentiel) : 13,98 Md€ TTC ; base HT 11,65 Md€ ; TVA à 20 % = 2,33 Md€, à 5,5 % = 0,64 Md€ ; perte 1,69 Md€
    (bas). Valeur centrale : milieu arrondi, 2,0 Md€.
  limites: >
    Très sensible au prix du gaz (la dépense des ménages a varié de 30 % entre 2021 et 2023). Hors TVA non
    déductible du tertiaire public. Projeter avec le prix du gaz, pas avec le PIB.

- id: tva_energie_carburants_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur les carburants routiers"
  valeur: 10.0
  bas: 8.2
  haut: 12.4
  unite: Md€/an de recettes perdues (APU)
  annee: "2024-2026"
  sources:
    - titre: "Public Sénat, « Baisse de la TVA sur l’énergie proposée par le RN : une mesure chiffrée à 17 milliards selon Bercy », 14 juin 2024"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "la baisse de la TVA à 5,5 % sur l’électricité coûterait 4,5 milliards, le gaz (2,3 milliards), les carburants (10 milliards)"
    - titre: "Fondation IFRAP, « Carburants et pouvoir d'achat : rendre 4,5 milliards de fiscalité aux Français ! », 17 mars 2026"
      url: https://www.ifrap.org/emploi-et-politiques-sociales/carburants-et-pouvoir-dachat-rendre-45-milliards-de-fiscalite-aux-francais
      date: "2026-03-17"
      extrait: "Estimation Institut Montaigne : 10,3 milliards € par an (fourchette 8,2 à 12,4 Md€ selon variation de la consommation"
  derivation: >
    Valeur centrale : chiffrage de Bercy (10 Md€, juin 2024), confirmé par l'estimation de l'Institut Montaigne
    reprise par l'IFRAP (10,3 Md€). Fourchette Montaigne : 8,2 à 12,4 Md€ selon la réaction de la consommation.
    Seule la TVA non déductible compte (ménages, entreprises non assujetties, part non déductible des véhicules
    de tourisme).
  limites: >
    Le chiffrage Bercy « carburants » inclut vraisemblablement le fioul domestique (le total 16,8 Md€ = 4,5 + 2,3
    + 10) : ne pas additionner avec tva_energie_fioul_5_5 si la promesse vise les deux. Sensible au prix du
    baril. La directive TVA (annexe III) ne liste pas les carburants parmi les biens éligibles au taux réduit :
    mesure juridiquement contestable.

- id: tva_energie_fioul_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur le fioul domestique (chauffage des ménages)"
  valeur: 0.6
  bas: 0.4
  haut: 0.65
  unite: Md€/an de recettes perdues (APU)
  annee: "2024"
  sources:
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 5.3.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Produits pétroliers 60,4 7 393 44,8 7 599 38,4 5 554 38,8 5 358"
  derivation: >
    Aucune source publique ne chiffre le fioul isolément (Bercy le regroupe avec les carburants). Recalcul :
    dépense TTC des ménages en produits pétroliers pour le logement (résidentiel) 2024 = 5,36 Md€ (fioul
    domestique et GPL) ; base HT 4,47 Md€ ; TVA à 20 % = 0,89 Md€, à 5,5 % = 0,25 Md€ ; perte 0,65 Md€ (haut,
    GPL inclus). Valeur centrale 0,6 Md€ (fioul majoritaire) ; bas 0,4 (baisse tendancielle du chauffage au fioul
    d'ici 2027-2032, interdiction des chaudières neuves au fioul depuis 2022).
  limites: "Estimation propre, non publiée par une administration ; inclut le GPL. Déjà compris dans les 10 Md€ « carburants » de Bercy."

- id: tva_energie_total_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur électricité, gaz, carburants et fioul (ensemble)"
  valeur: 16.8
  bas: 9.0
  haut: 17.0
  unite: Md€/an de recettes perdues (APU)
  annee: "2024"
  sources:
    - titre: "Public Sénat, « Baisse de la TVA sur l’énergie proposée par le RN : une mesure chiffrée à 17 milliards selon Bercy », 14 juin 2024"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "Cette baisse de taxes se traduirait par un coût global de 16,8 milliards d’euros pour les finances publiques."
    - titre: "Institut Montaigne, Législatives 2024, « Baisser la TVA de 20 à 5,5% pour les carburants, l’électricité, le gaz et le fioul domestique » (archive web)"
      url: https://web.archive.org/web/20241219114525/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/baisser-la-tva-de-20-a-55-pour-les-carburants-lelectricite-le-gaz-et-le-fioul-domestique
      date: "2024-06"
      extrait: "Par l'Institut Montaigne 11,3 Md€ 9 Md€ estimation basse 13,6 Md€ estimation haute"
    - titre: "Public Sénat, « TVA à 5,5 %, taxe flottante, gel des prix : ce qu'il est possible de faire (ou non) pour baisser les prix des carburants », mars 2026"
      url: https://www.publicsenat.fr/actualites/economie/tva-a-55-taxe-flottante-gel-des-prix-ce-quil-est-possible-de-faire-ou-non-pour-baisser-les-prix-des-carburants
      date: "2026-03"
      extrait: "Début mars, Maud Bregeon, la ministre déléguée chargée de l’Energie, avait estimé qu’une telle baisse coûterait « plus de 17 milliards d’euros »"
  derivation: >
    Valeur centrale : Bercy 16,8 Md€ (4,5 électricité + 2,3 gaz + 10 carburants et fioul). Institut Montaigne :
    11,3 Md€ (9 à 13,6), sur la base des recettes de TVA énergie 2022 (16,8 Md€ : 10,4 produits pétroliers, 4,6
    électricité, 1,6 gaz). Bas = borne basse Montaigne (9), haut = « plus de 17 milliards » (ministre chargée de
    l'énergie, mars 2026, citée par Public Sénat). L'écart tient au périmètre et aux hypothèses de consommation.
  limites: "Utiliser les barèmes par énergie quand la promesse ne vise pas les quatre. Sensible aux prix de l'énergie."

- id: tva_taux_reduits_cout_total
  libelle: "Coût total des dépenses fiscales de TVA (taux réduits et régimes particuliers), toutes APU"
  valeur: 24.8
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "Cour des comptes, Analyse de l'exécution budgétaire 2025, mission Dépenses fiscales, avril 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Depenses-fiscales.pdf
      date: "2026-04"
      extrait: "Le coût global des dépenses fiscales TVA au PLF 2026 s’élève à 10,92 Md€ au lieu 24,62 Md€ pour 2024 (coût définitif), à 11,00 Md€ au lieu de 24,78 Md€ pour 2025 (coût révisé)"
  derivation: >
    Depuis le PLF 2024, le tome II des Voies et moyens ne chiffre plus que la part de TVA revenant à l'État
    (11,0 Md€ en 2025). Le coût pour l'ensemble des APU, selon l'ancienne convention, est de 24,78 Md€ en 2025
    (25,01 Md€ prévus en 2026). C'est ce montant qu'il faut utiliser pour un effet sur le solde des APU.
  limites: >
    Périmètre des dépenses fiscales (restauration, travaux, logement social, médicaments, DOM, etc.) ; n'inclut
    pas les taux réduits considérés comme « norme » (5,5 % alimentaire). Pour relever un taux, utiliser
    tva_point_tous_taux.

- id: ticpe_rendement_total
  libelle: "Rendement total de l'accise sur les produits énergétiques hors gaz et charbon (ex-TICPE), toutes APU"
  valeur: 30.5
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "FIPECO, fiche « Les taxes sur les carburants »"
      url: https://www.fipeco.fr/fiche/Les-taxes-sur-les-carburants
      extrait: "En comptabilité nationale, le produit de la TICPE s’est élevé à 30,5 Md€, soit 1,0 % du PIB, en 2025, après 30,2 Md€ en 2024 et 31,8 Md€ en 2019."
    - titre: "Cour des comptes, Analyse de l'exécution budgétaire 2025, mission Recettes fiscales, avril 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "hors gaz naturel et charbons (ex -TICPE, plus couramment dénommée « accise sur les carburants ») s’élèvent à 16,3 Md€ en 2025"
  derivation: >
    Comptabilité nationale : 30,5 Md€ en 2025. Répartition budgétaire : État 16,3 Md€ net, collectivités 12,1 Md€,
    AFITF 1,2 Md€ (FIPECO). Assise sur les volumes (taux en c€/l, non indexés) : à taux inchangés, stable ou en
    baisse d'ici 2032 avec l'électrification ; ne pas projeter au PIB.
  limites: "Rendement en baisse tendancielle (volumes de carburants fossiles décroissants)."

- id: ticpe_centime_litre
  libelle: "Rendement d'une hausse (ou coût d'une baisse) de 1 centime par litre de l'accise sur les carburants routiers"
  valeur: 0.48
  bas: 0.45
  haut: 0.55
  unite: Md€/an par centime d'euro par litre
  annee: "2024"
  sources:
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 4.2.1.2"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Gazole routier 33,8 58 097 31,8 65 255 30,2 57 148 29,3 50 969 Fioul domestique et autres gazoles 10,6 11 970 9,8 15 598 9,1 12 069 9,0 10 773 Supercarburants* 9,0 20 255 10,3 25 934 10,9 27 229 11,7 27 795"
    - titre: "FIPECO, fiche « Les taxes sur les carburants »"
      url: https://www.fipeco.fr/fiche/Les-taxes-sur-les-carburants
      extrait: "les taux de l’accise en 2026 sont de 59,40 centimes par litre pour le gazole et 68,29 centimes pour l’essence sans plomb SP95-E5."
  derivation: >
    Volumes 2024 (SDES) : gazole routier 29,3 Mtep, supercarburants 11,7 Mtep. Conversion (≈ 1 tep par tonne ;
    masse volumique 0,845 kg/l pour le gazole, 0,755 kg/l pour l'essence) : gazole ≈ 34,7 milliards de litres,
    essence ≈ 14,8 milliards ; total ≈ 49,5 Gl, soit ≈ 0,495 Md€ par c€/l. Contrôle : 30,5 Md€ d'accise / 49,5 Gl
    = 0,62 €/l, cohérent avec les taux (59,4 et 68,3 c€/l) nets des remboursements (transporteurs, taxis,
    agriculteurs). Valeur centrale arrondie à 0,48 (volumes 2025-2027 en légère baisse). Haut 0,55 : ajoute la
    TVA induite sur la part payée par les ménages et le fioul/GNR si la mesure les vise. Bas 0,45 : recul des
    volumes d'ici 2032.
  limites: >
    Estimation propre à partir de volumes publics (aucune source administrative récente ne publie « le
    centime ») ; hors réaction de la consommation (élasticité-prix de court terme faible). Les remboursements
    partiels (transport routier, taxis) réduisent l'assiette effective du gazole professionnel.

- id: is_rendement_net
  libelle: "Rendement net de l'impôt sur les sociétés"
  valeur: 60
  bas: 59.9
  haut: 66.9
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "FIPECO, fiche « L'impôt sur les sociétés »"
      url: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
      extrait: "En 2025, le produit de l’IS était de 67,6 Md€ en comptabilité budgétaire et de 66,9 Md€ en comptabilité nationale (après crédits d’impôts, hors contribution sociale de 1,2 Md€ mais majoration exceptionnelle incluse)"
    - titre: "Cour des comptes, Analyse de l'exécution budgétaire 2025, mission Recettes fiscales, avril 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "La hausse de 2, 5 Md€ de l’impôt sur les sociétés net (59,9 Md€ en 2025) s’explique principalement par celle du bénéfice fiscal"
  derivation: >
    IS net structurel ≈ 60 Md€ en 2025 (Cour des comptes, net des crédits d'impôt, hors contribution
    exceptionnelle des grandes entreprises) ; 66,9 Md€ en comptabilité nationale y compris la majoration
    exceptionnelle (7,5 Md€ en 2025, selon FIPECO). Projection 2032 : × 1,2106 (PIB nominal 2025→2032,
    plan/hypotheses.yaml, FMI) ≈ 73 Md€ hors majoration.
  limites: "Recette très cyclique (bénéfices) ; la majoration exceptionnelle est temporaire en droit."

- id: is_point
  libelle: "Rendement d'un point de taux normal d'IS (25 % → 26 %)"
  valeur: 2.4
  haut: 2.8
  unite: Md€ par point et par an
  annee: "2025"
  sources:
    - titre: "FIPECO, fiche « L'impôt sur les sociétés »"
      url: https://www.fipeco.fr/fiche/Limp%C3%B4t-sur-les-soci%C3%A9t%C3%A9s
      extrait: "En 2024, il y a eu 1,7 million d’entreprises soumises à l’IS et bénéficiaires (284 Md€ de bénéfices) et 1,0 million d’entreprises déficitaires (112 Md€ de pertes)."
    - titre: "Cour des comptes, Analyse de l'exécution budgétaire 2025, mission Recettes fiscales, avril 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "La hausse de 2, 5 Md€ de l’impôt sur les sociétés net (59,9 Md€ en 2025) s’explique principalement par celle du bénéfice fiscal"
  derivation: >
    Aucune source publique récente ne publie le « point d'IS ». Deux calculs : (1) proportionnel, IS net hors
    majoration 59,9 Md€ / 25 points = 2,4 Md€ (valeur, prudente car les crédits d'impôt ne varient pas avec le
    taux) ; (2) bénéfices des sociétés bénéficiaires 2024, 284 Md€ × 1 % = 2,8 Md€ (haut, avant imputation des
    déficits reportés et hors taux réduit PME de 15 %). Projection 2032 : × 1,2106.
  limites: >
    Statique ; ignore l'optimisation et la localisation des profits. Pour une surtaxe sur les grandes
    entreprises, se référer à la majoration exceptionnelle (7,5 Md€ en 2025).

- id: cvae_restante
  libelle: "CVAE restante (rendement, soit le coût de sa suppression complète)"
  valeur: 3.7
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "FIPECO, fiche « La cotisation sur la valeur ajoutée des entreprises », 7 juillet 2026"
      url: https://www.fipeco.fr/fiche/La-cotisation-sur-la-valeur-ajout%C3%A9e-des-entreprises
      date: "2026-07-07"
      extrait: "En 2025, la CVAE prélevée sur les entreprises s’est élevée à 3,7 Md€."
  derivation: >
    Lecture directe. La loi de finances 2025 a majoré la CVAE en 2026 et 2027 et reporté sa suppression à 2030 :
    en législation 2027, la suppression est déjà votée pour 2030 ; une promesse de suppression n'a donc un coût
    qu'en 2027-2029 (≈ 3,7 à 4 Md€/an), nul en 2032. Inversement, maintenir la CVAE après 2030 rapporterait
    ≈ 3,7 × 1,2106 ≈ 4,5 Md€ en 2032.
  limites: "CVAE affectée à l'État depuis 2023 (collectivités compensées en TVA). Calendrier susceptible de changer en LFI 2027."

- id: c3s_rendement
