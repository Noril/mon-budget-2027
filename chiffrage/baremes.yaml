      url: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
      extrait: "Chaque augmentation de 1,0 % du point de la fonction publique a un coût (hors cotisations des employeurs) de 1 000 M€ pour l’Etat, 200 M€ pour ses opérateurs, 700 M€ pour les administrations locales et 700 M€ pour les administrations sociales (surtout les hôpitaux), soit un total de 2,5 Md€."
  derivation: >
    Le point ne porte que sur la part indexée de la masse brute : traitement indiciaire, plus l'indemnité de
    résidence et le supplément familial qui lui sont proportionnels, pour les fonctionnaires et les contractuels
    rémunérés sur grille ; les primes (≈ 21 % du brut hors indemnité de résidence et SFT), les salariés de droit
    privé des caisses de sécurité sociale et les emplois aidés n'en dépendent pas. Central : 248 Md€ (D11 2025,
    INSEE) × ≈ 72 % indexé = 1,8 Md€. Bas : 65 % (1,6). Haut : 78 % (1,95). Recoupement : la revalorisation de
    2022 coûtait 7,6 Md€ pour 3,5 % en COÛT EMPLOYEUR (cotisations comprises ; pour la FPH, l'IGAS confirme que
    les contributions assises sur les salaires sont incluses), soit 2,17 Md€ par point, ≈ 2,45 Md€ sur la base
    2025 ; en retirant les cotisations employeurs (≈ 30 % à 40 % du brut indiciaire, CAS Pensions compris), on
    retrouve ≈ 1,8 Md€. Le chiffre de FIPECO (2,5 Md€ « hors cotisations ») dépasse le maximum arithmétique
    (248 × 0,78) et correspond au coût employeur : il n'est plus retenu. POUR 2032 : point_indice_1pct_2032.
  limites: >
    Part indexée estimée (aucune source ne publie directement le coût brut hors cotisations d'un point). L'effet
    sur le solde est × (1 − retour_prelevements_salaires_publics). Effet sur les pensions futures progressif.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : FIPECO seul. Le chiffre de 2,5 Md€ « hors cotisations employeurs » dépasse le maximum arithmétique
      (248 Md€ de salaires bruts D11 × part indexée ≤ 78 % = 1,95) et correspond au coût employeur (7,6 Md€ pour 3,5
      % en 2022, cotisations comprises, confirmé par l'IGAS pour la FPH). Valeur 2,5 → 1,8 ; bas 2,17 → 1,6 ; haut
      2,6 → 1,95. La part indexée (72 %) est une estimation à partir de la DGAFP (24,6 % de primes).

- id: point_indice_1pct_2032
  libelle: "Coût en 2032 d'une hausse de 1 % de la valeur du point d'indice, à point gelé en référence (trois versants, hors cotisations employeurs)"
  valeur: 1.86
  bas: 1.8
  haut: 1.93
  unite: Md€ courants 2032 par an pour 1 % de hausse, brut (avant retours)
  annee: "2032 (depuis 2025)"
  sources:
    - titre: "PLF 2026, projet annuel de performances, mission Sécurités (GVT, programme 176), publié par l'Assemblée nationale"
      url: https://www.assemblee-nationale.fr/dyn/dyn/contenu/visualisation/1088035/file/PAP2026_BG_Securites_SB.pdf
      date: "2025-10"
      extrait: "GVT positif 123,19"
    - titre: "PLF 2026, projet annuel de performances, mission Enseignement scolaire (GVT du programme 141)"
      url: https://www.assemblee-nationale.fr/dyn/dyn/contenu/visualisation/1087978/file/PAP2026_BG_Enseignement_scolaire_EC.pdf
      date: "2025-10"
      extrait: "Le GVT solde s’élève à 195,5 M€ (hors CAS Pensions) soit 0,7 % de la masse salariale"
  derivation: >
    À droit constant le point est gelé : la masse indiciaire ne suit que le GVT solde et les effectifs. GVT solde
    des PAP 2026 : 0,35 % (gendarmerie) à 1,0 % (premier degré) de la masse hors CAS, ≈ 0,5 % retenu ; effectifs
    stables. Central : 1,8 Md€ (point_indice_1pct, 2025) × 1,005⁷ = 1,86 Md€ en 2032. Bas : sans croissance (1,8).
    Haut : 1 % par an, 1,8 × 1,01⁷ = 1,93. Ne pas multiplier par un facteur PIB. Une hausse ponctuelle de x % du
    point coûte x × 1,86 Md€ brut en 2032, soit x × 1,86 × (1 − 0,28) net des retours.
  limites: >
    Hérite de l'estimation de la part indexée (point_indice_1pct). La GIPA et le relèvement du minimum de traitement
    quand le Smic augmente font croître la masse même à point gelé (non comptés).
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Suit point_indice_1pct : 2,59 → 1,86 (1,8 × 1,005⁷) ; bas 2,5 → 1,8 ; haut 2,68 → 1,93. GVT solde de 0,35 à
      1,0 % relu dans les PAP 2026 (sources primaires ajoutées).

- id: indexation_point_indice_2027_2032
  libelle: "Coût en 2032 d'une indexation du point d'indice sur l'inflation de 2027 à 2032, par rapport à un point gelé (droit constant), brut avant retours"
  valeur: 20.6
  bas: 17.0
  haut: 22.2
  unite: Md€ courants 2032 par an, rémunérations brutes hors cotisations employeurs
  annee: "2032"
  sources:
    - titre: "INSEE, comptes des administrations publiques (DD_CNA_APU), salaires et traitements bruts D11, S13 (base de point_indice_1pct)"
      url: https://api.insee.fr/melodi/file/DD_CNA_APU/DD_CNA_APU_CSV_FR
      date: "2026-08-31"
      extrait: "D11, S13, non consolidé (M€) : 2025 247 557"
    - titre: "FMI, World Economic Outlook avril 2026, déflateur du PIB (NGDP_D, indice), France (API SDMX)"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_D.A
      date: "2026-04-14"
      extrait: "TIME_PERIOD=\"2026\" OBS_VALUE=\"114.61662\" TIME_PERIOD=\"2027\" OBS_VALUE=\"116.289465\" TIME_PERIOD=\"2028\" OBS_VALUE=\"118.45426\" TIME_PERIOD=\"2029\" OBS_VALUE=\"120.661422\" TIME_PERIOD=\"2030\" OBS_VALUE=\"122.905247\" TIME_PERIOD=\"2031\" OBS_VALUE=\"125.064171\""
    - titre: "FMI, World Economic Outlook avril 2026, prix à la consommation harmonisés (PCPIPCH), France"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.PCPIPCH.A
      date: "2026-04-14"
      extrait: "TIME_PERIOD=\"2027\" OBS_VALUE=\"1.721117\" TIME_PERIOD=\"2028\" OBS_VALUE=\"1.855273\" TIME_PERIOD=\"2029\" OBS_VALUE=\"1.871195\" TIME_PERIOD=\"2030\" OBS_VALUE=\"1.910438\" TIME_PERIOD=\"2031\" OBS_VALUE=\"1.813523\""
  derivation: >
    Référence : point gelé de 2027 à 2032 (REFERENCE.md). Coût 2032 = coût de 1 % du point en 2032 à point gelé
    (point_indice_1pct_2032 : 1,864 Md€) × inflation cumulée 2027-2032 en points (inflation_cumulee_2027_2032 :
    11,03) = 20,6 Md€ brut. Haut : prix à la consommation (IPCH, +11,50 %) sur la masse haute, 1,93 × 11,50 =
    22,2. Bas : cinq revalorisations (2028-2032, +9,44 %) sans croissance de la masse, 1,8 × 9,44 = 17,0. Montée en
    charge (part du coût 2032) : 2027 0,13 ; 2028 0,30 ; 2029 0,48 ; 2030 0,66 ; 2031 0,83 ; 2032 1. CONVENTION pour
    l'effet sur le solde : coût net = 20,6 × (1 − 0,28) = 14,8 Md€ ; pensions induites (≈ 0,5 à 1 Md€ en 2032) dans
    le bas de la mesure. Point déjà relevé de x % : ajouter la hausse (x × 1,86 Md€ brut) et l'effet croisé x × 20,6
    Md€ ; pour +10 % : 18,6 + 20,6 + 2,1 = 41,3 Md€ brut, 29,7 Md€ net.
  limites: >
    Hérite de l'estimation de la part indexée de la masse (point_indice_1pct). À point gelé, la GIPA et le
    relèvement du minimum de traitement auraient de toute façon coûté une partie de la somme (non chiffré). La
    trajectoire de référence de plan/ n'est pas à droit constant : limite connue de l'agrégation.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Suit point_indice_1pct_2032 : 28,6 → 20,6 Md€ brut (1,864 × 11,03), soit 14,8 net au lieu de 20,6 ; bas 23,6 →
      17,0 ; haut 30,8 → 22,2. Exemple +10 % et indexation : 41,3 Md€ brut, 29,7 net (au lieu de 57,4 et 41,3).
      REFERENCE.md (convention 2) cite encore 28,6 et 20,6 : à mettre à jour.

- id: retour_prelevements_salaires_publics
  libelle: "Part d'une hausse de rémunération brute publique (hors cotisations employeurs) qui revient aux administrations publiques"
  valeur: 0.28
  bas: 0.23
  haut: 0.32
  unite: part de la rémunération brute supplémentaire (hors cotisations employeurs)
  annee: "2023 (salaires DGAFP) ; 2026 (taux)"
  sources:
    - titre: "DGAFP, Rapport annuel sur l'état de la fonction publique, édition 2025, figure 9 (salaires mensuels moyens des fonctionnaires : brut, traitement, primes, cotisations salariales et CSG-CRDS, net)"
      url: https://www.fonction-publique.gouv.fr/files/files/publications/rapport-annuel/ra_2025.pdf
      date: "2025"
      extrait: "3 344 2 520 824 24,6 631 315 316 2 714"
    - titre: "FIPECO, fiche « Quels sont les enjeux du (dé)gel du point d'indice de la fonction publique ? » (cotisations employeurs sans effet sur le solde)"
      url: https://www.fipeco.fr/fiche/Quels-sont-les-enjeux-du-(d%C3%A9)gel-du-point-dindice-de-la-fonction-publique-%3F
      extrait: "elles sont versées à des régimes de sécurité sociale qui sont des administrations publiques et elles n’ont donc aucun effet sur le déficit public."
    - titre: "Ircantec, augmentation des taux de cotisations au 1er janvier 2026"
      url: https://www.ircantec.retraites.fr/employeur/actualite/augmentation-des-taux-de-cotisations-ircantec-au-1er-janvier-2026
      date: "2026-01"
      extrait: "Taux d’appel de cotisations tranche A : Part agent : 2,84 % Part employeur : 4,27 %"
    - titre: "Urssaf, taux de cotisations du secteur public (copie Wayback du 12 août 2024 ; taux de CSG et CRDS inchangés en 2026)"
      url: https://web.archive.org/web/20240812043624/https://www.urssaf.fr/accueil/outils-documentation/taux-baremes/taux-cotisations-secteur-public.html
      date: "2024-08-12"
      extrait: "CSG imposable 2,40 % sur 98,25 % du traitement indiciaire brut […] CSG non imposable 6,80 % […] CRDS 0,50 %"
    - titre: "Sénat, rapport général PLF 2018, tome III, article 38 (ancrage du taux marginal d'IR)"
      url: https://www.senat.fr/rap/l17-108-3-1/l17-108-3-13.html
      date: "2017-11"
      extrait: "la hausse de la déductibilité de la CSG entraînera une perte de recettes d'impôt sur le revenu estimée à 3,9 milliards d'euros"
  derivation: >
    CONVENTION COMMUNE (salaires publics, créations et suppressions de postes). (1) Assiette : rémunération brute
    hors cotisations employeurs ; les cotisations employeurs (CAS Pensions, CNRACL, maladie, famille…) vont à
    d'autres APU et ne modifient pas le solde consolidé. (2) Prélèvements sociaux salariés, mesurés : pour
    l'ensemble des fonctionnaires, cotisations salariales et CSG-CRDS = 631 € sur 3 344 € brut, soit 18,9 %
    (DGAFP) ; se retrouve par les taux : retenue pour pension 11,10 % × 75,4 % de part indiciaire = 8,4 %, RAFP 5 %
    sur les primes ≈ 0,8 %, CSG et CRDS 9,7 % × 98,25 % = 9,5 %. Contractuels : vieillesse 6,90 + 0,40 %, Ircantec
    2,84 %, CSG-CRDS 9,53 % = 19,7 %. Moyenne ≈ 19 %. (3) Impôt sur le revenu, convention : net imposable ≈ 0,84
    du brut, abattement de 10 % → 0,757, × taux marginal moyen 12,5 % (tranches à 11 % et 30 % ; cohérent avec le
    ratio officiel de 0,17 d'IR par euro de revenu imposable ajouté, retour_ir_csg_deductible, pour des agents
    plus souvent à 11 %) ≈ 9,5 %. Total ≈ 0,285, arrondi 0,28. Bas 0,23 : hausse portant sur les primes (RAFP
    5 %, soit ≈ 14,5 % de prélèvements sociaux) et IR 8,3 %. Haut 0,32 : hausse du traitement indiciaire (11,10 +
    9,53 = 20,6 %) et IR 11,3 % (catégorie A). (4) Coût net pour le solde = coût brut hors cotisations
    employeurs × (1 − 0,28) : c'est ce coût net qui s'inscrit dans effet_solde_primaire. Un coût « chargé »
    (cout_*_charge) doit d'abord être ramené au brut. (5) Pensions induites : effet progressif, non compris dans
    le retour (≈ 0,5 à 1 Md€ en 2032 pour une indexation 2027-2032), à mettre dans le bas de la mesure.
  limites: >
    La part d'IR est une convention (aucune source publique ne publie le taux marginal moyen des agents publics).
    Hors baisse des prestations sous condition de ressources pour les agents modestes, qui augmenterait le retour.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : construction sans source. Décomposée avec des données officielles : cotisations salariales et CSG-CRDS
      = 18,9 % du brut des fonctionnaires (DGAFP 2025, figure 9) ; contractuels 19,7 % (Urssaf, Ircantec 2,84 % en
      2026 et non 2,80 %) ; IR ≈ 9,5 % (convention). Erreur corrigée : l'ancienne dérivation appliquait la retenue
      pour pension de 11,10 % à tout le brut. Valeur 0,28 inchangée ; bas 0,25 → 0,23 ; haut 0,32 inchangé.

- id: retour_prelevements_pensions
  libelle: "Part d'une hausse de pensions de retraite qui revient aux administrations publiques (CSG, CRDS, CASA, cotisation maladie, IR)"
  valeur: 0.16
  bas: 0.08
  haut: 0.20
  unite: part de la hausse brute des pensions
  annee: "2023 (répartition des masses) ; 2026 (taux)"
  sources:
    - titre: "PLFSS 2026, annexe 9, fiche de l'article 6, tableau « Taux des prélèvements applicables – pensions de retraite et d'invalidité »"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe09-GenerationXBOOK_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "CSG Exonération 3,8 % 6,6 % 8,3 % CRDS 0,5 % 0,5 % 0,5 % CASA Exonération 0,3 % 0,3 % Cotisation maladie Exonération 1 % sur les retraites complémentaires [...] Masse des pensions en 2023 13% 10% 30% 47% Taux cumulé des contributions (retraites de base) 0% 4,3% 7,4% 9,1%"
    - titre: "Sénat, rapport général PLF 2018, tome III, article 38 (hausse de la CSG déductible et effet sur l'IR)"
      url: https://www.senat.fr/rap/l17-108-3-1/l17-108-3-13.html
      date: "2017-11"
      extrait: "la hausse de la déductibilité de la CSG entraînera une perte de recettes d'impôt sur le revenu estimée à 3,9 milliards d'euros"
    - titre: "PLFSS 2026, annexe 9, fiche de l'article 44 (recoupement : retour de CSG sur une revalorisation de 1 %)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe09-GenerationXBOOK_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "La stabilisation des pensions de retraite (à la place d’une revalorisation de 1,0%, net de l’effet retour CSG), permettrait une économie de l’ordre de 2,7 Md€ en 2026"
  derivation: >
    CONVENTION COMMUNE, cohérente avec retour_prelevements_salaires_publics : une revalorisation des pensions se
    chiffre brut puis net des prélèvements qui reviennent aux APU. (1) Prélèvements sociaux, sourcés : taux cumulé
    par tranche de CSG (DSS) pondéré par la masse des pensions 2023 : 0,13 × 0 + 0,10 × 4,3 % + 0,30 × 7,4 % + 0,47
    × 9,1 % = 6,9 %, plus la cotisation maladie de 1 % sur les retraites complémentaires (≈ un quart de la masse,
    hors exonérés) ≈ 0,2 %, soit ≈ 7,1 %. (2) Impôt sur le revenu, convention : taux marginal moyen de 0,17 sur la
    masse au taux normal de CSG (ancré sur le ratio officiel 3,9 / 22,5 = 0,17 d'IR par euro de CSG déductible,
    voir retour_ir_csg_deductible) et de 0,08 sur la masse au taux intermédiaire (tranche à 11 %, atténuée par la
    décote), 0 ailleurs ; appliqué au revenu imposable (hausse × (1 − 5,5 % de CSG déductible moyenne) × 0,9 pour
    l'abattement de 10 %) : (0,47 × 0,17 + 0,30 × 0,08) × 0,945 × 0,93 ≈ 0,09. Total ≈ 0,071 + 0,09 = 0,16. Bas
    0,08 : hausse ciblée sur les petites pensions (minimum contributif : taux réduit ou intermédiaire, IR nul ou
    faible). Haut 0,20 : hausse proportionnelle avec IR à 0,13 en moyenne. Coût net = coût brut × (1 − retour).
    S'applique à retraites_revalo_1pct (central), au minimum contributif (bas) ; retour nul pour les prestations
    non imposables et exonérées de CSG (Aspa, AAH, RSA). Recoupement : l'annexe 9 (art. 44) donne 2,7 Md€ net de
    CSG pour ≈ 2,9 Md€ brut (Cour), soit un retour de CSG de l'ordre de 7 %, cohérent avec (1).
  limites: >
    La part sociale est sourcée (DSS) ; la part d'IR reste une convention (aucune source publique ne donne l'IR
    marginal des retraités par tranche de CSG). Masses de 2023. L'ancien central (0,14, IR à 0,07) sous-estimait
    les prélèvements sociaux et l'IR.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : convention sans source. Décomposée avec les taux et masses officiels de la DSS (PLFSS 2026, annexe 9,
      art. 6 : taux cumulés 0 / 4,3 / 7,4 / 9,1 % sur 13 / 10 / 30 / 47 % de la masse) : 7,1 % de prélèvements
      sociaux ; IR ≈ 9 % par convention ancrée sur le ratio officiel de 2018. Valeur 0,14 → 0,16 ; haut 0,18 → 0,20
      ; bas 0,08 inchangé.

