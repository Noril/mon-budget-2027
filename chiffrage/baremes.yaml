# --- Coût d'un poste pour le solde des APU (convention commune) ---------------------------------------
# Coût APU d'un poste créé ou supprimé = rémunération brute (hors toute cotisation employeur, CAS compris)
# × (1 − retour_prelevements_salaires_publics). Central : coût d'un ENTRANT (méthode FIPECO : un poste créé est
# pourvu par un recrutement, un non-remplacement économise un entrant) ; haut : rémunération moyenne du corps.
# Pour une hausse de rémunération des agents en place, partir de la rémunération moyenne (haut).
# Les barèmes cout_*_charge (coût budgétaire complet, CAS compris) restent la référence pour les crédits de
# l'État, pas pour le solde des APU. Brut ≈ coût hors CAS / 1,18 quand seul le coût hors CAS est publié
# (cotisations employeurs hors pensions de l'État : maladie 9,70 %, famille 5,25 %, FNAL 0,10 à 0,50 %, CSA 0,30 %,
# versement mobilité, RAFP ≈ 18 % du brut).

- id: cout_enseignant_apu
  libelle: Coût pour le solde des APU d'un poste d'enseignant de l'État (net des cotisations employeurs et des retours)
  valeur: 24100
  bas: 22300
  haut: 34200
  unite: € par ETP et par an
  annee: "2026 (PLF) ; FIPECO 2026"
  sources:
    - titre: PLF 2026, projet annuel de performances, mission Enseignement scolaire (programmes 140 et 141)
      url: https://www.budget.gouv.fr/documentation/documents-budgetaires-lois/exercice-2026
      date: "2025-10"
      extrait: "Total en titre 2 27 409 147 658 27 853 974 129 Total en titre 2 hors CAS Pensions 17 559 916 092 17 642 473 505"
    - titre: FIPECO, fiche « Le niveau et l'évolution de la masse salariale publique »
      url: https://www.fipeco.fr/fiche/Le-niveau-et-l%C3%A9volution-de-la-masse-salariale-publique
      extrait: "Le coût moyen des entrants (salaire brut des agents de moins de 30 ans en pratique) est d’environ 31 000 € pour l’Etat, 28 000 € pour les collectivités locales et 34 000 € pour les hôpitaux."
  derivation: >
    Central : coût d'entrée hors CAS du PAP 2026 (38 363 € premier degré, 40 509 € second degré, moyenne
    39 436 €, voir cout_enseignant_charge) / 1,18 = 33 420 € brut × (1 − 0,28) ≈ 24 100 €. Bas : entrant moyen
    de l'État selon FIPECO, 31 000 € × 0,72 ≈ 22 300 €. Haut (agent moyen, pour une revalorisation) : titre 2
    hors CAS moyen ≈ 53 900 € (programme 140 : 17 642 M€ / 341 897 ETPT = 51 600 € ; programme 141 estimé à la
    même part de CAS, 55 560 €) / 1,18 = 45 640 € brut × (1 − 0,25) ≈ 34 200 €.
  limites: Voir retour_prelevements_salaires_publics et cout_enseignant_charge. Hors pensions futures de l'agent (après 2032).

