- id: retraites_age_legal_1_an
  libelle: Effet sur le solde du système de retraite d'une variation d'un an de l'âge d'ouverture des droits (baisse de 64 à 63 ans)
  valeur: 6.6
  bas: 4.9
  haut: 7.9
  unite: Md€ courants 2032 par an et par année d'âge (coût d'une baisse ; ordre de grandeur du gain d'une hausse montée en charge)
  annee: "2032 (converti depuis 2035 et 2045 en euros 2024)"
  sources:
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "L’avancée d’un an de cet âge (63 ans au lieu de 64) représenterait une dépense supplémentaire pour le système des retraites de 5,8 Md€ en 2035."
    - titre: Cour des comptes, idem (horizon 2045)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "À horizon 2045, l’équilibre du système de retraites serait dégradé de 4,3 Md€ au cas où l’âge d’ouverture des droits était ramené à 63 ans"
    - titre: Cour des comptes, idem (ensemble des finances publiques, effets d'activité compris)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Pour l’ensemble des finances publiques, l’avancée d’un an de l’âge d’ouverture des droits coûterait 13 Md€ en 2035, tandis qu’un recul rapporterait jusqu’à 17,7 Md€."
  derivation: >
    Central : 5,8 Md€ constants 2024 en 2035 (dépenses −4,2, cotisations −1,6 ; tableau n° 6 de la Cour, données
    Cnav et DG Trésor) × 1,1386 (déflateur FMI 2032/2024) ≈ 6,6 Md€. Bas : régime de croisière 2045, 4,3 Md€ × 1,1386
    ≈ 4,9 Md€. Haut : moitié de l'effet Cnav des deux ans de la réforme 2023 en 2032 (15,7 / 2 ≈ 7,9 Md€, voir
    retraites_retour_62_ans_2032). Pour une hausse d'un an (65 ans), la Cour donne +4,7 à +8,4 Md€ en 2035 sur le
    système selon le calendrier.
  limites: >
    Maturité : 5,8 Md€ est l'effet en 2035 ; pour une mesure appliquée dès 2028, l'effet 2032 est voisin (le profil
    Cnav des mesures d'âge de 2023 culmine en 2032 à 15,7 Md€ contre 14,8 en 2035), la conversion par le seul
    déflateur (euros constants 2024 → courants 2032) est donc retenue ; pour une mesure plus tardive, appliquer la
    montée en charge (une génération par trimestre). Périmètre : système de retraite (voir
    retraites_retour_62_ans_2032) ; la Cour chiffre à 13 Md€ le coût complet pour les finances publiques en 2035
    (effets d'emploi compris, non comptés). Montant brut : × (1 − retour_prelevements_pensions) sur la part
    prestations (4,2 des 5,8 Md€). Asymétrie : un recul rapporte plus qu'une avancée ne coûte (hypothèse Cour sur les bornes des carrières longues).
    Effet sur le seul système de retraite ; l'effet sur les autres recettes publiques (7,2 Md€ en 2035 selon la DG
    Trésor, dû à l'emploi) relève des effets non comptés (règle 3). Monte vite en charge (génération par génération),
    puis décroît légèrement.

- id: retraites_duree_assurance_1_an
  libelle: Effet sur le solde du système de retraite d'une variation d'un an (4 trimestres) de la durée d'assurance requise (43 à 42 ans)
  valeur: 4.4
  haut: 8.8
  unite: Md€ courants 2032 par an et par année de durée
  annee: "2032 (converti depuis 2035 et 2045 en euros 2024)"
  sources:
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Sa diminution d’un an (42 ans au lieu de 43) coûterait 3,9 Md€ au système de retraite en 2035, alors que son allongement (44 ans au lieu de 43) rapporterait 5,2 Md€ en 2035."
  derivation: >
    Valeur : 3,9 Md€ constants 2024 en 2035 × 1,1386 (déflateur 2032/2024) ≈ 4,4 Md€. Haut : effet à l'horizon 2045
    (7,7 Md€ × 1,1386 ≈ 8,8 Md€), l'effet d'une variation de durée croissant avec le temps (cumul des générations).
  limites: >
    En 2032, l'effet d'une mesure appliquée à partir de 2027-2028 est inférieur au point 2035 ; retenir 4,4 comme
    majorant pour 2032. Effet sur le seul système de retraite (7,1 Md€ en 2035 pour l'ensemble des APU selon la DG
    Trésor, effets d'activité compris, non comptés).

- id: retraites_age_60_depuis_62
  libelle: Coût supplémentaire d'un âge légal à 60 ans par rapport à 62 ans (à ajouter à retraites_retour_62_ans_2032)
  valeur: 18
  bas: 13
  haut: 33
  unite: Md€ courants 2032 par an, en régime de croisière
  annee: "2032 (converti depuis des parts de PIB)"
  sources:
    - titre: FIPECO (F. Ecalle), Avancer ou reculer l'âge de départ en retraite, 25 juin 2024
      url: https://www.fipeco.fr/commentaire/Avancer%20ou%20reculer%20l'%C3%A2ge%20de%20d%C3%A9part%20en%20retraite
      date: "2024-06-25"
      extrait: "ramener l’âge minimal de départ à 60 ans ajouterait un coût supplémentaire pouvant atteindre 0,9 point de PIB (26 Md€) à terme."
    - titre: FIPECO, idem (effet d'un recul de deux ans sur les seuls régimes de retraite)
      url: https://www.fipeco.fr/commentaire/Avancer%20ou%20reculer%20l'%C3%A2ge%20de%20d%C3%A9part%20en%20retraite
      date: "2024-06-25"
      extrait: "Le solde des régimes de retraite serait majoré de 0,5 point de PIB (soit environ 14 Md€ de 2023) du fait d’une diminution des pensions (0,4 point de PIB) et d’une hausse des cotisations (0,1 point)."
    - titre: "Fondation IFRAP, Retraite à 60 ans : entre 20 et 40 milliards d'euros de coût, février 2017"
      url: https://www.ifrap.org/retraite/retraite-60-ans-entre-20-et-40-milliards-deuros-de-cout
      date: "2017-02-23"
      extrait: "En admettant que seule la moitié des 720.000 décide de partir plus tôt c’est 13 à 14 milliards d’euros de coût supplémentaire pour le système de retraites."
    - titre: Institut Montaigne, législatives 2024, Nouveau Front populaire (retraite à 60 ans)
      url: https://www.institutmontaigne.org/legislatives-2024/nouveau-front-populaire/abroger-la-reforme-des-retraites-restaurer-la-retraite-a-60-ans-en-prenant-en-compte-le-rsa-en-portant-le-minimum-contributif-au-smic/
      date: "2024-07"
      extrait: "annulation du recul de l'âge de la retraite de la réforme de 2010 : coût de 27 Md€ en 2027"
  derivation: >
    Central : effet à long terme de deux ans d'âge sur les seuls régimes de retraite, 0,5 point de PIB (FIPECO,
    symétrique du recul de 62 à 64 ans), × 3 621 Md€ (PIB 2032) ≈ 18 Md€. Haut : effet total sur les APU,
    0,9 point de PIB × 3 621 ≈ 33 Md€ (FIPECO). Bas : IFRAP, moitié des assurés concernés partant plus tôt,
    13 Md€ (euros 2017, non réévalués : minorant). Le coût d'un âge légal à 60 ans par rapport au droit au
    1er janvier 2027 est la somme retraites_retour_62_ans_2032 + retraites_age_60_depuis_62 ≈ 32 Md€ en 2032
    (fourchette 22 à 53). Recoupement : l'Institut Montaigne (2024) chiffre l'annulation du recul de 2010 à 27 Md€
    en 2027, soit ≈ 31 Md€ en 2032 (× facteur_pib_2027_2032), proche du haut ; l'IFRAP (2017) chiffrait le
    passage de 62 à 60 ans à 27,3 Md€ si tous les assurés concernés partaient plus tôt. Même périmètre que
    retraites_retour_62_ans_2032 (système de retraite) pour le central ; le haut (0,9 point, APU) inclut des
    effets d'activité non comptés.
  limites: >
    Le haut inclut des effets d'activité (moindres prélèvements, plus de prestations chômage et maladie) que la règle 3
    ne compte pas ; il sert de borne. Le coût dépend fortement des modalités : un « 60 ans à taux plein avec 40 annuités
    et suppression de la décote » coûte nettement plus (baisse de durée et suppression de décote à ajouter via
    retraites_duree_assurance_1_an) ; un 60 ans réservé aux carrières longues coûte nettement moins. Montée en charge
    rapide (quatre ans pour deux générations), régime de croisière atteint en 2032 si la mesure s'applique dès 2028.

