  libelle: Gain d'une suppression du prélèvement forfaitaire unique (retour au barème de l'IR des revenus mobiliers), en 2032
  valeur: 1.5
  bas: 0.0
  haut: 3.1
  unite: Md€/an (2032)
  annee: "2022 (chiffrage Institut Montaigne) ; haut projeté en 2032"
  sources:
    - titre: "Institut Montaigne, Présidentielle 2022, « Supprimer la flat tax et imposer les revenus du capital comme ceux du travail » (copie Wayback)"
      url: https://web.archive.org/web/2024/https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/supprimer-la-flat-tax-et-imposer-les-revenus-du-capital-comme-ceux-du-travail/
      date: "2022"
      extrait: "Chiffrage de l’Institut Montaigne : Gain entre 2,1 Md€ et 2,3 Md€ (à assiette constante) ; 1,5 Md€ en prenant en compte les effets de comportement sur le versement de revenus mobiliers."
    - titre: "Même page (hypothèse de comportement)"
      url: https://web.archive.org/web/2024/https://www.institutmontaigne.org/presidentielle-2022/jean-luc-melenchon/supprimer-la-flat-tax-et-imposer-les-revenus-du-capital-comme-ceux-du-travail/
      date: "2022"
      extrait: "Dans l’hypothèse où l’assiette taxable reviendrait à son niveau de 2017 (soit avant l’instauration du PFU), le rendement de la suppression du PFU serait de 1,5 Md€."
    - titre: France Stratégie, Comité d'évaluation des réformes de la fiscalité du capital, troisième rapport, octobre 2021
      url: https://www.strategie.gouv.fr/files/files/Publications/2021/1014%20Reforme%20de%20la%20fiscalit%C3%A9%20du%20capital/fs-2021-troisieme_rapport-fiscalite_du_capital-octobre.pdf
      date: "2021-10"
