      url: https://www.legifrance.gouv.fr/contenu/Media/files/autour-de-la-loi/legislatif-et-reglementaire/actualite-legislative/2023/plfrss_ecox2300575l_rapport_annexe_cm_23.01.2023_0.pdf
      date: "2023-01-23"
      extrait: "et la hausse de la durée d’assurance requise conduisent à la fois à une diminution des dépenses de retraite et à une augmentation des recettes de cotisations vieillesse, pour une amélioration du solde évaluée à 8,2 Md€ en 2027 et 14,1 Md€ en 2030."
    - titre: "COR, Rapport annuel juin 2026, Synthèse (coût de la suspension)"
