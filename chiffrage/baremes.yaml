- id: allegements_generaux_cout
  libelle: Coût des allègements généraux de cotisations patronales (réduction générale + bandeaux maladie et famille)
  valeur: 72.3
  bas: 70.7
  haut: 75.4
  unite: Md€/an
  annee: "2026 (prévision CCSS octobre 2025, avant mesures du PLFSS 2026) ; 75,4 Md€ exécutés en 2024"
  sources:
    - titre: Rapport du Groupe d'experts sur le Smic, 25 novembre 2025 (chapitre sur les allègements)
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716
      date: "2025-11-25"
      extrait: "le coût total des dispositifs d'allègements à vocation générale à destination des salariés s'élève à 75,4 milliards d'euros en 2024"
    - titre: Même rapport, prévision 2025-2026
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/1d1d1848-48bb-40a9-a14f-585b8072e716
      date: "2025-11-25"
      extrait: "En 2026, leur coût se stabiliserait à 72,3 milliards d'euros (−0,2 %)"
    - titre: PLFSS 2026, annexe 4 (mesures de réduction et d'exonération de cotisations)
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/PLFSS/2026/PLFSS2026-Annexe4-20251014-183718-59-11_avec%20couverture.pdf
      date: "2025-10-14"
      extrait: "qui dépasse 75 Md€ en 2024 (39,4 Md€ pour la réduction générale et 36 Md€ pour les réductions proportionnelles, en incluant les régimes spéciaux)"
  derivation: >
    Valeur centrale = prévision 2026 citée par le Groupe d'experts Smic d'après la CCSS d'octobre 2025
    (72,3 Md€, tous régimes y compris retraite complémentaire et assurance chômage). Haut = exécution 2024
    (75,4 Md€ = 39,4 réduction générale + 26,4 bandeau maladie + 9,6 bandeau famille). Bas = 72,3 − 1,6 Md€
    (« coup de rabot de 1,6 Md€ en 2026 » lié au décret RGDU pris en application de la LFSS 2025, cité par la
    contribution du MEDEF annexée au même rapport ; source partie prenante, d'où son usage en borne). Depuis
    le 1er janvier 2026 les trois dispositifs sont fusionnés en une réduction générale dégressive unique
    (RGDU). Pour 2032 : indexer sur la masse salariale privée (à défaut, facteur PIB nominal 2025→2032 = 1,2106,
    plan/hypotheses.yaml).
  limites: >
    Le périmètre varie selon les sources : l'annexe 4 donne 64,9 Md€ (2024) sur le seul champ des régimes
    obligatoires de base (ROBSS), hors Agirc-Arrco et Unédic. Supprimer les allègements ne rapporte pas le
    coût brut : le Groupe d'experts chiffre l'économie nette entre 33 et 47 Md€ après effets sur l'emploi,
    l'assurance chômage et les recettes (effet non compté selon chiffrage/README, à signaler en effets_retour).

