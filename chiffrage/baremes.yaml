  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      CCSS mai 2026 relue : activité 11 760 / 12 030 / 11 710 M€ (2024 / 2025 / 2026 p) et extrait de la fiche 1.3
      exact. Valeur 11,71 confirmée.

- id: retour_ir_csg_deductible
  libelle: "Part d'une baisse (ou hausse) de CSG déductible qui revient aux APU en impôt sur le revenu (hausse ou baisse du revenu imposable)"
  valeur: 0.16
  bas: 0.14
  haut: 0.185
  unite: part du rendement de la CSG déductible modifiée
  annee: "2018 (chiffrage), barème de l'IR 2020 et suivants"
  sources:
    - titre: "Sénat, rapport général PLF 2018, tome III, article 38 (hausse de 1,7 point de la CSG déductible)"
      url: https://www.senat.fr/rap/l17-108-3-1/l17-108-3-13.html
      date: "2017-11"
      extrait: "le présent article prévoit d'augmenter de 1,7 point la part de contribution sociale généralisée (CSG) déductible des revenus imposés au barème de l'impôt sur le revenu afin d'éviter un accroissement de 3,9 milliards d'euros des recettes de l'impôt sur le revenu"
    - titre: "Même rapport (rendement de la hausse de CSG de 2018)"
      url: https://www.senat.fr/rap/l17-108-3-1/l17-108-3-13.html
      date: "2017-11"
      extrait: "Au total, 22,5 milliards d'euros de recettes supplémentaires sont attendues de l'augmentation des taux de CSG en 2018."
  derivation: >
    La hausse de 1,7 point de CSG de 2018 (22,5 Md€) a été rendue déductible, ce qui a réduit l'IR de 3,9 Md€
    (évaluation préalable du PLF 2018, reprise par le Sénat) : 3,9 / 22,5 = 0,173 Md€ d'IR par euro de CSG
    déductible. Hors revenus de placement soumis au prélèvement forfaitaire (non déductibles, ≈ 1,4 Md€ de la
    hausse) : 3,9 / 21,1 = 0,185 (haut). Central 0,16 : la baisse du taux de la première tranche d'IR (14 % → 11 %
    en 2020) réduit le taux marginal moyen d'environ 0,01 à 0,02 (convention, non sourcée). Bas 0,14. Effet net
    d'un point de CSG d'activité déductible en 2026 : 11,71 × (1 − 0,16) ≈ 9,8 Md€. La part non déductible de la
    CSG (2,4 points sur les revenus d'activité) n'a pas d'effet IR.
  limites: >
    Ratio moyen tous revenus (activité, remplacement, patrimoine) ; il varie selon l'assiette visée. L'ajustement
    pour la réforme du barème de 2020 est une convention. Remplace la convention antérieure de REFERENCE.md (0,12,
    fourchette 0,10-0,15), non sourcée.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Nouveau barème (demande de la coordination) : remplace la convention 0,12 de REFERENCE.md par le ratio de
      l'évaluation préalable du PLF 2018 reprise par le Sénat (3,9 Md€ d'IR pour 22,5 Md€ de CSG), extrait relu.
      L'ajustement pour le barème de 2020 reste une convention.

- id: retour_ir_cotisation_salariale
  libelle: "Part d'une baisse (ou hausse) de cotisation SALARIALE qui revient aux APU en impôt sur le revenu"
  valeur: 0.16
  bas: 0.14
  haut: 0.185
  unite: part du montant de cotisation salariale modifié
  annee: "2018 (chiffrage), barème de l'IR 2020 et suivants"
  sources:
    - titre: "BOFiP-Impôts, BOI-IR-BASE-20-60-10-20160907 (IR, versements de cotisations sociales), § 120"
      url: https://bofip.impots.gouv.fr/bofip/2676-PGP.html/identifiant=BOI-IR-BASE-20-60-10-20160907
      date: "2016-09-07"
      extrait: "En principe, le montant imposable des salaires et des pensions est déterminé sous déduction des cotisations de sécurité sociale ( CGI, art. 83, 1° , BOI-RSA-BASE-30-10-10)."
    - titre: "Sénat, rapport général PLF 2018, tome III, article 38 (ratio IR / CSG déductible)"
      url: https://www.senat.fr/rap/l17-108-3-1/l17-108-3-13.html
      date: "2017-11"
      extrait: "la hausse de la déductibilité de la CSG entraînera une perte de recettes d'impôt sur le revenu estimée à 3,9 milliards d'euros"
  derivation: >
    Les cotisations salariales obligatoires sont déduites du salaire imposable (CGI, art. 83, 1°), comme la CSG
    déductible : une baisse de cotisation salariale augmente le revenu imposable du même montant (avant abattement
    de 10 % pour frais, déjà reflété dans le ratio de 2018 qui porte sur des salaires et pensions). On applique donc
    le ratio de retour_ir_csg_deductible : 0,16 (0,14 à 0,185). Une hausse de cotisation salariale réduit l'IR
    d'autant (retour négatif). Ne vaut pas pour une cotisation patronale (non imposable pour le salarié).
  limites: >
    Analogie avec la CSG déductible (même mécanisme fiscal) ; les salariés concernés par une baisse ciblée (bas
    salaires) ont un taux marginal plus faible : pour une mesure ciblée sous 1,5 Smic, prendre le bas (0,14) ou
    moins, à justifier dans la mesure. Aucune source officielle ne chiffre directement ce retour.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Nouveau barème (demande de la coordination : Attal prenait 0,12 par analogie). Déductibilité des cotisations
      salariales établie par le BOFiP (CGI art. 83, 1°, extrait relu) ; taux repris de retour_ir_csg_deductible, par
      analogie de mécanisme, écrit comme convention.

