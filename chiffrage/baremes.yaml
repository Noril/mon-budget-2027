    suppression ≈ 5,2 Md€ ; projection 2032 × 1,2336 (PIB nominal 2024→2032, plan/hypotheses.yaml) ≈ 6,4 Md€.
  limites: "Source secondaire (FIPECO d'après INSEE)."

- id: ttf_rendement
  libelle: "Rendement de la taxe sur les transactions financières (0,4 % sur les acquisitions d'actions)"
  valeur: 2.5
  bas: 2.2
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "MoneyVox (AFP), « Taxe sur les transactions financières : quel bilan 15 ans après ? », 10 septembre 2026, citant un rapport de la Cour des comptes"
      url: https://www.moneyvox.fr/bourse/actualites/110311/taxe-sur-les-transactions-financieres-quel-bilan-15-ans-apres
      date: "2026-09-10"
      extrait: "Son rendement a donc été « dynamique » ces dernières années, passant de 800 millions en 2013, à 1,9 milliard en 2019, puis 2,5 milliards en 2025 , selon l'institution."
    - titre: "Assemblée nationale, PLF 2025, amendement n° I-CF1722 (exposé sommaire)"
      url: https://www.assemblee-nationale.fr/dyn/17/amendements/0324A/CION_FIN/CF1722
      date: "2024-10"
      extrait: "ce taux permettrait à l’État de récolter 3,7 milliards d’euros, contre 2,2 milliards actuellement avec un taux à 0,3%"
  derivation: >
    Rendement 2025 au taux de 0,4 % : 2,5 Md€ (Cour des comptes, septembre 2026, via AFP). Bas : 2,2 Md€ au taux
    de 0,3 % (estimation 2023). Un dixième de point supplémentaire rapporte au plus ≈ 0,6 Md€ (2,5 / 4), moins
    en pratique (le passage de 0,3 à 0,4 % a rapporté ≈ 0,3 à 0,5 Md€ selon ces chiffres).
  limites: >
    Source secondaire (dépêche reprenant un rapport de la Cour non consulté directement). L'extension aux
    opérations intrajournalières est chiffrée par des ONG à ≈ 2 Md€ (débat au Sénat, 29 novembre 2025), sans
