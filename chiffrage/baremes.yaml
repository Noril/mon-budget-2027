    - titre: "COR, Rapport annuel juin 2026 (état du droit après la LFSS 2026)"
      url: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
      date: "2026-06"
      extrait: "La loi n° 2025-1403 de financement de la sécurité sociale du 30 décembre 2025 prévoit une suspension de la réforme des retraites : la montée en charge de la réforme est suspendue pour la génération 1964 et les assurés nés entre le 1er janvier et le 31 mars 1965 ; elle reprend ensuite pour les générations suivantes."
    - titre: "Étude d'impact du PLFRSS 2023 (rappel du calendrier de durée de la loi n° 2014-40, dit calendrier Touraine)"
      url: https://www.assemblee-nationale.fr/dyn/16/textes/l16b0760_etude-impact.pdf
      date: "2023-01-23"
      extrait: "3° 169 trimestres, pour les assurés nés entre le 1er janvier 1964 et le 31 décembre 1966 ; 4° 170 trimestres, pour les assu rés nés entre le 1er janvier 1967 et le 31 décembre 1969 ; 5° 171 trimestres, pour les assurés nés entre le 1er janvier 1970 et le 31 décembre 1972 ;"
    - titre: "Cour des comptes, Situation financière et perspectives du système de retraites, février 2025, tableau n° 6 (Md€ constants 2024, exercice 2035)"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "L’avancée d’un an de cet âge (63 ans au lieu de 64) représenterait une dépense supplémentaire pour le système des retraites de 5,8 Md€ en 2035."
    - titre: "Cour des comptes, idem (coût complet pour les finances publiques, effets d'activité compris)"
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Le gain total pour le système de retraites et les autres administrations publiques en 2030 est donc estimé à 24,2 Md€ par la direction générale du Trésor et à 20 Md€ par Rexecode."
  derivation: >
    Central : effet des mesures d'âge (âge d'ouverture des droits et accélération de la durée) sur le solde, estimé
    par la Cnav à 15,7 Md€ courants en 2032 (colonnes 2025 à 2032, 2035, 2040 ; 2032 : prestations −11,2,
    cotisations +4,5), moins le coût de la suspension déjà inscrite dans le droit au 1er janvier 2027 (1,8 Md€ par an
    en moyenne jusqu'en 2032, COR 2026) : 15,7 − 1,8 = 13,9 Md€. Recoupement Cour (tableau n° 6) : 2 × 5,8 (âge)
    + ≈ 0,5 × 3,9 (1 à 3 trimestres de durée) ≈ 13,6 Md€ 2024 en 2035, × 1,1386 (déflateur 2032/2024) − 1,8
    ≈ 13,7. Bas : effet de l'âge seul, linéaire sur la Cour, 2 × 5,8 × 1,1386 − 1,8 ≈ 11,4 Md€. Haut : profil
    Cnav porté au périmètre tous régimes du rapport gouvernemental de 2023 (14,1 Md€ en 2030 contre 12,6 Md€ pour
    la Cnav) : 15,7 × 14,1 / 12,6 − 1,8 ≈ 15,8 Md€. PÉRIMÈTRE : solde du système de retraite (pensions et
    cotisations vieillesse), pas l'ensemble des APU : l'écart (Cour 2035, âge à 63 ans : 5,8 Md€ pour le système,
    13 Md€ pour les finances publiques ; DG Trésor 2030 : 24,2 Md€ constants 2024 au total) vient pour l'essentiel
    des prélèvements sur l'emploi supplémentaire des seniors, effet non compté (règle 3) ; il se décrit dans
    effets_retour et chiffrages_tiers. L'effet des mesures d'âge est maximal vers 2032 (Cnav : 14,8 en 2035, 11,1
    en 2040).
  limites: >
    Le tableau Cnav date de 2024 (hypothèses COR 2024) et son périmètre exact n'est pas précisé (« hors cotisation
    équilibre employeur » laisse penser que plusieurs régimes sont couverts ; 12,6 Md€ en 2030 contre 14,1 Md€ tous
    régimes dans le rapport de 2023). Aucune source publique (COR, DSS, Cour, Sénat) ne chiffre en 2025-2026 une
    abrogation totale ; la Cour n'a pas modélisé 62 ans. Écart de durée en 2032 : le calendrier Touraine demande
    169 trimestres aux générations 1964-1966, 170 aux générations 1967-1969 et 171 aux générations 1970-1972, contre
    172 dès la génération 1965 avec la réforme de 2023 (170 pour 1964 et le premier trimestre 1965 avec la
    suspension) ; pour les générations qui partent vers 2032 (1965-1970), l'écart est de 1 à 3 trimestres. Les
    mesures d'accompagnement (minimum contributif) sont maintenues. Montants bruts : les pensions supplémentaires supportent CSG, CRDS, CASA et IR
    (retour_prelevements_pensions) : l'effet net est × (1 − retour) sur la part « prestations » (11,2 des 15,7 Md€
    Cnav). Chiffrages tiers : Fondation IFRAP (octobre 2025), 18 à 20 Md€ en 2035 pour une suspension prolongée,
    sans méthode publiée et d'une ampleur voisine du coût complet APU : non retenu comme borne.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Tableau Cnav du rapport AN n° 613 relu (solde 15,7 Md€ en 2032, colonnes 2025-2032, 2035, 2040) et COR 1,8 Md€
      confirmés : valeur 13,9 inchangée. Bornes corrigées : bas 8,9 → 11,4 (le 9,7 de la DG Trésor inclut les
      mesures d'accompagnement ; remplacé par l'âge seul selon la Cour, 2 × 5,8 × 1,1386 − 1,8) ; haut 20 → 15,8
      (l'IFRAP, sans méthode publiée et d'ampleur APU, est remplacée par le profil Cnav porté au périmètre tous
      régimes du rapport gouvernemental de 2023, 14,1 Md€ en 2030).

