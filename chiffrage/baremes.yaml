    apparent implicite du FMI appliqué à la dette, solde primaire gelé) × 3 620,9 Md€ = 127,5 Md€. Le coût
    d'intérêts d'une mesure n'est pas à ajouter à son effet sur le solde primaire : la trajectoire de dette le
