  verification:
    statut: conteste
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Signalement (0,6 Md€ paraît bas). Deux familles de chiffrages publiés : Institut Montaigne 2022 (2,1-2,3 Md€ à
      assiette constante, 1,5 Md€ avec réaction des dividendes, page relue sur la Wayback Machine) et IPP / Insee
