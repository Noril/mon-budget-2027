- id: immigration_depenses_etat
  libelle: Dépenses de l'État pour la politique de l'immigration et de l'intégration (sources contradictoires)
  valeur: 7.8
  bas: 2.2
  haut: 41
  unite: Md€ courants par an
  annee: "2026 (DPT PLF 2026) ; bas = mission IAI 2026 ; haut = coût net OID (2025, périmètre différent)"
  sources:
    - titre: "Sénat, rapport général PLF 2026, Immigration, asile et intégration (reprend le DPT)"
      url: https://www.senat.fr/rap/l25-139-315/l25-139-315_mono.html
      date: "2025-11"
      extrait: "Le coût estimé de la politique française de l'immigration et de l'intégration est de 7,82 milliards d'euros en 2026 17 ( * ) , un niveau en légère hausse par rapport à 2025 (7,74 milliards d'euros)."
    - titre: "Sénat, même rapport (crédits de la mission)"
      url: https://www.senat.fr/rap/l25-139-315/l25-139-315_mono.html
      date: "2025-11"
      extrait: "les crédits demandés sur la mission « Immigration, asile et intégration » s'élèvent à 2,24 milliards d'euros en AE et à 2,16 milliards d'euros en CP"
    - titre: "Observatoire de l'immigration et de la démographie (OID), Réduire le coût net de l'immigration, février 2025 (source contestée)"
      url: https://observatoire-immigration.fr/cout-immigration-economies/
      date: "2025-02-07"
      extrait: "Le coût net de l’immigration est quant à lui estimé à 41 milliards d’euros , une fois retranchées les contributions des étrangers au budget – par leurs impôts et cotisations sociales."
    - titre: "CEPII, Chojnicki, Ragot et Sokhna, L'impact budgétaire de 30 ans d'immigration en France, document de travail 2018-04"
      url: https://www.cepii.fr/PDF_PUB/wp/2018/wp2018-04.pdf
      date: "2018-04"
      extrait: "Leur contribution est toujours restée contenue en deçà de ±0, 5% du PIB"
  derivation: >
    Central : document de politique transversale (DPT) annexé au PLF 2026, 19 programmes, 7,82 Md€. Bas : crédits
    de paiement de la seule mission Immigration, asile et intégration (2,16 Md€). Haut : coût net de l'immigration
    pour toutes les APU selon l'OID (41 Md€), borne signalée, non validée : l'OID (think tank engagé) impute aux
    étrangers des dépenses générales (santé, retraites, chômage) et en retranche leurs prélèvements. Le CEPII, sur
    1979-2011, trouve à l'inverse une contribution nette comprise entre -0,5 et +0,5 point de PIB (-18 à +18 Md€
    en 2032). Hors dépenses de l'État, l'AME (ministère de la santé) est comptée à part (voir le barème AME du
    cluster social).
  limites: >
    Les trois chiffres ne mesurent pas la même chose (dépense ciblée de l'État, dépense budgétaire d'une mission,
    solde net des APU pour toute la population étrangère). La Cour des comptes et le CEC de l'Assemblée ont
    critiqué le DPT comme incomplet (lutte contre l'immigration irrégulière estimée par la Cour à environ
    1,8 Md€ par an, contre 0,26 Md€ affichés au DPT en 2024, selon le même rapport du Sénat). Pour chiffrer une
    mesure (ex. suppression de l'AME, fin d'une prestation pour les étrangers), partir de la dépense précise
    visée, pas de ces agrégats.

- id: fraude_sociale_estimee
  libelle: Fraude sociale estimée, et montants détectés et recouvrés
  valeur: 14
  bas: 13
  haut: 17.5
  unite: Md€ par an (fraude estimée)
  annee: "2024 (note HCFiPS publiée en décembre 2025)"
  sources:
    - titre: "HCFiPS, Note annuelle de suivi et d'évaluation des fraudes sociales, synthèse (décembre 2025)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "aboutit à un montant de fraudes de 14 Md€, contre 13 Md€ lors de l’évalua- tion précédente."
    - titre: "HCFiPS, même synthèse (détection et recouvrement)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "680 M€ recouvrés : le recouvrement est toujours limité."
    - titre: "Fondation IFRAP, La fraude sociale en 2024 : 17,5 Md€ estimés, seulement 1,2 Md€ recouvré (ou évité), 15 janvier 2026"
      url: https://www.ifrap.org/emploi-et-politiques-sociales/la-fraude-sociale-en-2024-175-mdeu-estimes-seulement-12-mdeu-recouvre-ou-evite
      date: "2026-01-15"
      extrait: "la fraude sociale estimée atteint 14 Md€, à laquelle il faut ajouter l'estimation des erreurs soit un total de 17,5 Md€."
  derivation: >
    Central : fraude estimée par le HCFiPS sur le périmètre évalué (14 Md€). Bas : évaluation précédente (13 Md€).
    Haut : fraude + erreurs d'assiette sur les cotisations (3,5 Md€), 17,5 Md€. Part recouvrable : en 2024,
    plus de 2 Md€ détectés, 0,5 Md€ de fraudes stoppées, 0,68 Md€ recouvrés (même note), soit un rendement
    budgétaire effectif d'environ 1,2 Md€ par an, 8 à 9 % de la fraude estimée. Chiffrer une promesse de
    « lutte contre la fraude sociale » : central = gain supplémentaire documenté (ex. doublement du recouvrement,
    +0,7 à +1,2 Md€), haut = montant annoncé, jamais la fraude estimée entière.
  limites: >
    Périmètre partiel (fraude aux cotisations des micro-entrepreneurs et plateformes non comptée ; le HCFiPS
    évalue aussi à environ 5,5 Md€ le manque à gagner sur les recettes fiscales affectées à la sécurité sociale,
    TVA et tabac). Estimations par extrapolation de contrôles aléatoires, fragiles d'une année sur l'autre.

- id: fraude_fiscale_tva_estimee
  libelle: Fraude et irrégularités à la TVA (seule composante de la fraude fiscale estimée par des sources publiques)
  valeur: 15
  bas: 6
  haut: 26
  unite: Md€ par an
  annee: "estimations 2012 à 2020 (Cour des comptes 2019 ; Insee 2012 ; DGFiP 2010-2020)"
  sources:
    - titre: "Cour des comptes, La fraude aux prélèvements obligatoires, décembre 2019"
      url: https://www.ccomptes.fr/fr/publications/la-fraude-aux-prelevements-obligatoires
      date: "2019-12-02"
      extrait: "le montant de la fraude et des irrégularités à la TVA est estimée à une quinzaine de milliards d’euros."
    - titre: "Insee, blog, Estimer la TVA non recouvrée à partir des contrôles fiscaux"
      url: https://blog.insee.fr/estimer-la-tva-non-recouvree-a-partir-des-controles-fiscaux/
      date: "2022-12"
      extrait: "Pour l’exercice comptable 2012, le montant de TVA non recouvrée est estimé entre 20 Md€ et 26 Md€, soit 17 % à 21 % des recettes de TVA cette année-là."
    - titre: "HCFiPS, Note annuelle fraudes sociales, synthèse (reprend l'estimation DGFiP)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/HCFIPS/2026/HCFIPS%20-%20Synth%c3%a8se%20Fraude%20sociale%202025%20-%20Version%20finalis%c3%a9e.pdf
      date: "2025-12-04"
      extrait: "Les sommes non recouvrées par l’administration ﬁscale sur le champ de la TVA sont évaluées par la DGFiP à 4 à 5 % de la TVA collectée"
  derivation: >
    Central : Cour des comptes avec l'Insee (une quinzaine de Md€). Bas : DGFiP, sous-déclaration des entreprises
    déclarant la TVA, 6 à 10 Md€ sur 2010-2020 (4 à 5 % de la TVA collectée). Haut : Insee, 20 à 26 Md€ pour
    2012. Aucune source publique ne chiffre l'ensemble de la fraude fiscale (IR, IS, patrimoine) ; les montants de
    60 à 100 Md€ cités dans le débat public ne reposent pas sur une méthode publiée par une administration.
    Part recouvrable : le contrôle fiscal a notifié 17,1 Md€ de droits et pénalités en 2025 (25,5 Md€ avec les
    crédits d'impôt non remboursés, bilan DGFiP d'avril 2026 cité par LégiFiscal) ; le taux de recouvrement des
    montants mis en recouvrement était de 75,3 % en 2021 (Sénat, rapport 2022). Le gain budgétaire d'un
    renforcement du contrôle se chiffre donc en supplément de recouvrement (ordre de grandeur : quelques Md€ au
    plus), jamais par la fraude estimée.
  limites: >
    Estimations anciennes (2012-2020) et méthodes différentes (extrapolation des contrôles, contrôles aléatoires,
    écart de TVA de la Commission européenne). Le montant 2025 du contrôle fiscal vient d'un site privé (LégiFiscal)
    résumant le dossier de presse ministériel dont le PDF n'a pas pu être récupéré.

- id: controle_fiscal_rendement
  libelle: Résultats du contrôle fiscal (droits et pénalités notifiés) et taux de recouvrement
  valeur: 17.1
  haut: 25.5
  unite: Md€ par an (notifiés) ; haut = y compris crédits d'impôt et taxes non remboursés
  annee: "2025 (bilan publié en avril 2026) ; taux de recouvrement 2021"
  sources:
    - titre: "LégiFiscal, Bilan 2025 du contrôle fiscal : les recettes en nette hausse (résumé du dossier de presse DGFiP du 7 avril 2026)"
      url: https://www.legifiscal.fr/actualites-fiscales/4475-bilan-2025-controle-fiscal-recettes-nette-hausse.html
      date: "2026-04"
      extrait: "avec 17,1 milliards d’euros de droits et pénalités notifiés en 2025, soit près de 3% de plus qu’en 2024. En ajoutant 8,4 milliards d’euros de crédits d’impôt et de taxes non remboursés, la contribution totale du contrôle fiscal aux finances publiques atteint 25,5 milliards €."
    - titre: "Sénat, rapport d'information n° 72 (2022-2023), Fraude et évasion fiscales : faire les comptes et intensifier la lutte"
      url: https://www.senat.fr/rap/r22-072/r22-072_mono.html
      date: "2022-10"
      extrait: "si le taux de recouvrement, qui s'est élevé à 75,3 % en 2021, est aujourd'hui meilleur qu'en 2018, où il n'avait atteint que 59,9 %, il demeure toutefois insuffisant."
  derivation: >
    Valeur lue. Montant encaissé ≈ notifié × taux de recouvrement (60 à 75 %), soit de l'ordre de 10 à 13 Md€
    par an. Sert de base pour chiffrer une promesse d'intensification du contrôle (gain = hausse du montant
    encaissé, pas du montant notifié).
  limites: >
    Source principale secondaire (site privé) : le dossier de presse du ministère (economie.gouv.fr, 7 avril 2026)
    est en ligne mais son PDF n'a pas pu être récupéré. Le taux de recouvrement porte sur les montants mis en
    recouvrement depuis 2019 (changement de méthode), et date de 2021.

- id: logement_social_aides_part_prix_revient
  libelle: Aides publiques à la production d'un logement social, en part du prix de revient (subventions + TVA réduite)
  valeur: 33
  bas: 24
  haut: 43
  unite: "% du prix de revient de l'opération"
  annee: "2024-2025"
  sources:
    - titre: "Sénat, rapport d'information n° 804 (2023-2024), Quel bilan pour le Fonds national des aides à la pierre (FNAP) ?"
      url: https://www.senat.fr/rap/r24-804/r24-804_mono.html
      date: "2024-09"
      extrait: "Pour les PLAI en zone tendue, malgré des subventions publiques importantes entre 10 % et 29 % des prix de revient, les opérations ne s'équilibrent pas."
    - titre: "Sénat, même rapport (aides indirectes)"
      url: https://www.senat.fr/rap/r24-804/r24-804_mono.html
      date: "2024-09"
      extrait: "l'exonération de taxe foncière sur les propriétés bâties pendant 25 ans sur les logements sociaux ; - un taux réduit de TVA à 5,5 % depuis 1996, à l'exception des PLUS"
  derivation: >
    Subventions directes (État via le FNAP, collectivités, Action Logement) : 10 à 29 % du prix de revient
    (central 19,5 %). TVA réduite : avantage de (20 − 5,5) / 105,5 ≈ 13,7 % du prix TTC au taux réduit (PLAI ;
    le PLUS est au taux de 10 %, avantage (20 − 10) / 110 ≈ 9 %). Central : 19,5 + 13,7 ≈ 33 % ; bas :
    10 + 13,7 ≈ 24 % ; haut : 29 + 13,7 ≈ 43 %. Le coût public d'un logement social supplémentaire =
    part × prix de revient moyen ; le prix de revient moyen (bilan annuel des logements aidés, DHUP) n'a pas pu
    être récupéré cette nuit : à renseigner dans la mesure avec sa source.
  limites: >
    Hors exonération de TFPB pendant 25 ans (à la charge des collectivités, faiblement compensée) et hors
    avantage des prêts de la Caisse des dépôts sur fonds d'épargne réglementée (non chiffré), qui augmentent le
    coût public total. Les subventions des collectivités et d'Action Logement ne sont pas toutes des dépenses
    de l'État (Action Logement est hors APU dans certaines conventions). Le Sénat compte 85 381 logements sociaux
    agréés en 2024 (rapport PLF 2026, Logement et ville).
