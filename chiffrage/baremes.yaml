- id: apd_part_rnb
  libelle: Aide publique au développement (APD) de la France, en équivalent-don, montant et part du revenu national brut
  valeur: 0.42
  bas: 0.42
  haut: 0.48
  unite: "% du RNB"
  annee: "2025 (données préliminaires) ; 0,48 % en 2024"
  sources:
    - titre: "OCDE, Comité d'aide au développement, base DAC1 (apports par fournisseur), France, API SDMX"
      url: https://sdmx.oecd.org/public/rest/data/OECD.DCD.FSD,DSD_DAC1@DF_DAC1/FRA.......?startPeriod=2023&format=csvfilewithlabels
      date: "2026-04"
      extrait: "11002 ODA as percent of GNI, grant equivalent : 2023 0.49 ; 2024 0.48 ; 2025 0.42. 11010 ODA, grant equivalent, national currency (millions) : 2023 13947.24 ; 2024 14283.46 ; 2025 12884.87. 1 Gross National Income (GNI), national currency : 2025 3043666"
  derivation: >
    APD 2025 = 12,88 Md€ en équivalent-don, RNB 2025 = 3 043,7 Md€, soit 0,42 % (14,28 Md€ et 0,48 % en 2024).
    Projection : RNB 2032 ≈ PIB 2032 × (RNB / PIB 2025 = 3 043,7 / 2 991,1 = 1,0176) ≈ 3 685 Md€ ; un point de RNB
    en 2032 vaut ≈ 36,8 Md€, un dixième ≈ 3,7 Md€. Atteindre 0,7 % en 2032 depuis 0,42 % coûte
    (0,70 − 0,42) × 36,8 ≈ 10,3 Md€ par an en 2032 (depuis 0,48 % : 8,1 Md€). Haut = niveau 2024.
  limites: >
    L'APD au sens du CAD n'est pas une dépense budgétaire : elle comprend des prêts (en équivalent-don), des
    annulations de dette, les frais d'écolage d'étudiants étrangers et l'accueil des réfugiés la première année.
    La mission budgétaire « Aide publique au développement » n'en finance qu'environ un tiers (3,67 Md€ de
    crédits au PLF 2026 selon le Sénat). Une hausse de l'APD financée par des prêts de l'AFD coûte moins au
    solde que son montant ; le chiffrage d'une promesse « 0,7 % du RNB » à dépense budgétaire constante sur les
    autres composantes est donc un majorant. Données 2025 préliminaires.

