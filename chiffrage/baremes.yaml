      extrait: "Une augmentation de 1 % du SMIC dégraderait le solde public de 240 M€"
    - titre: "Commission des comptes de la sécurité sociale, rapport de mai 2026, synthèse (effet de la hausse du Smic sur la RGDU)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
      extrait: "le compte prévisionnel intègre l’effet de la revalorisation du SMIC au 1er juin (+ 2,41 %) sur le barème des allègements généraux, qui conduit à dégrader le solde de - 2,8 Md€"
  derivation: >
    Décomposition DG Trésor 2017 (M€) : allègements nets des cotisations employeurs −400 ; cotisations salariales
    +240 ; masse salariale publique −260 ; prestations +110 ; IR +70 ; total −240. Actualisation : composantes
    2017 × 1,305 (PIB 2025 / PIB 2017), sauf les allègements, remplacés par allegements_sensibilite_smic_1pct (barème
    RGDU) et la masse salariale publique, prise nette des retours (smic_1pct_masse_salariale_publique × 0,72).
    Central : −1,2 + 0,31 + 0,09 + 0,14 − 0,34 × 0,72 ≈ −0,9 Md€. Haut : avec l'effet barème entier (2,0) ≈ −1,7.
    Bas : chiffrage de 2017 avant la RGDU (0,24 × 1,305 = 0,31).
  indicateur: finances.pib_nominal@1.0.0
