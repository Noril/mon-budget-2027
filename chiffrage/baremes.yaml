# Barèmes communs de chiffrage (schéma : schemas/bareme.schema.json). Voir chiffrage/README.md.
#
# Conventions :
# - coûts et rendements en valeur positive ; le signe (coût < 0) se met dans la mesure du programme ;
# - `bas` et `haut` sont la plus petite et la plus grande valeur plausible du barème, pas la convention
#   défavorable/favorable au solde qui vaut pour les mesures ;
# - montants en Md€ courants de l'année indiquée dans `annee` ; pour 2032, facteur PIB nominal 2025→2032 = 1,2106
#   (PIB 2025 finances.pib_nominal@1.0.0, croissance et déflateur de plan/hypotheses.yaml, FMI WEO avril 2026),
#   sauf quand la derivation dit autrement (énergie, TICPE : volumes et prix, pas PIB) ; facteurs par année de
#   départ : facteur_pib_2023_2032 à facteur_pib_2027_2032. Une dépense non indexée à droit constant (point
#   d'indice gelé) ne se projette PAS au PIB (voir point_indice_1pct_2032) ;
# - salaires publics et postes : l'effet sur le solde se calcule sur la rémunération brute hors cotisations
#   employeurs (transferts internes aux APU), nette de retour_prelevements_salaires_publics (0,28) ; les coûts
#   « chargés » (cout_*_charge, CAS compris) sont des coûts budgétaires, les coûts pour le solde sont cout_*_apu ;
# - pensions : effet net de retour_prelevements_pensions (0,14 ; 0,08 pour les petites pensions ; 0 pour les
#   minima non imposables) ; retraites (âge, durée) : périmètre du système de retraite, effets d'emploi exclus ;
# - indexation sur l'inflation à droit constant 2027-2032 : inflation_cumulee_2027_2032 (déflateur, +11,03 %) ;
# - sources récupérées et extraits relus le 29 septembre 2026 ; budget.gouv.fr bloquait alors les robots : quelques
#   URL de documents budgétaires pointent vers la page d'index de l'exercice (signalé dans `limites`).

# ====================================================================================================
# Fiscalité indirecte et entreprises
# ====================================================================================================

- id: tva_rendement_total
  libelle: "Rendement net total de la TVA, toutes administrations publiques"
  valeur: 209
  haut: 211.7
  unite: Md€/an
  annee: "2025"
  sources:
    - titre: "Cour des comptes, Analyse de l'exécution budgétaire 2025, mission Recettes fiscales, avril 2026 (tableau des recettes de TVA)"
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "TVA nette totale (c = a-b) 210,7 211,7 + 1,1 + 0,5 Affectation à la sécurité sociale (d) 57,9 57,0 - 0,9 - 1,6 Affectation aux collectivités territoriales (e) 52,1 52,811 + 0,7 + 1,3 Compensation audiovisuel public (f) 4,0 4,0 0,0 - 0,4 TVA nette État budget général (c-d-e-f) 96,8 98,1 + 1,3 + 1,4"
    - titre: "FIPECO, fiche « La taxe sur la valeur ajoutée » (mise à jour 2026), d'après les comptes nationaux de l'INSEE"
      url: https://www.fipeco.fr/fiche/La-taxe-sur-la-valeur-ajout%C3%A9e
      extrait: "Son rendement, net des remboursements, s’est élevé à 209 Md€ en 2025 (208 Md€ en 2024) pour l’ensemble des administrations publiques dont : 99 Md€ affectés à l’Etat ou à ses opérateurs, soit désormais moins de la moitié ; 57 Md€ à la sécurité sociale et 53 Md€ aux administrations publiques locales."
  derivation: >
    Valeur : 209 Md€ en comptabilité nationale (INSEE, reprise par FIPECO), l'optique pertinente pour le solde
    des APU. Haut : 211,7 Md€, TVA nette totale 2025 en comptabilité budgétaire (Cour des comptes : brute 288,9 −
    remboursements et dégrèvements 77,2), dont 57,0 à la sécurité sociale, 52,8 aux collectivités, 4,0 pour
    l'audiovisuel public et 98,1 au budget général de l'État. Projection 2032 à structure inchangée : 209 × 1,2106
    (facteur_pib_2025_2032) ≈ 253 Md€.
  limites: >
    Le chiffre de comptabilité nationale n'a pas été relu dans une publication de l'INSEE (repris de FIPECO) ;
    l'écart avec la comptabilité budgétaire (≈ 3 Md€) tient aux décalages d'encaissement. Toute mesure de TVA
    touche les trois sous-secteurs via les fractions affectées.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : source uniquement secondaire (FIPECO). Ajout de la source primaire (Cour des comptes, NEB Recettes
      fiscales 2025, tableau des recettes de TVA, relu) : TVA nette totale 211,7 Md€ en comptabilité budgétaire,
      retenue en haut ; valeur 209 (comptabilité nationale) inchangée. Barème utilisé par aucun programme.

- id: tva_point_taux_normal
  libelle: "Rendement d'un point de TVA au taux normal (20 % → 21 %), net de la TVA payée par les APU"
  valeur: 7.5
  haut: 8.9
  unite: Md€ par point de taux normal et par an
  annee: "2025"
  sources:
    - titre: "DG Trésor, Trésor-Éco n° 371, « Analyse de la composition des recettes de TVA », septembre 2025"
      url: https://www.tresor.economie.gouv.fr/Articles/c462ac7f-76db-4c33-9bb3-dcc6886ed898/files/f4d0d1ac-fc61-4cf3-ab3f-094385b218bd
      date: "2025-09"
      extrait: "Tableau 2 : Rendement d’un point TVA 2025 net total et par taux Point TVA Ensemble 2,1% 5,5% 10% 20% Net 2025 (Md€) 11,4 0,4 2,0 1,6 7,5"
  derivation: >
    Tableau 2 du Trésor-Éco : rendement statique net 2025 d'un point au taux normal = 7,5 Md€ (8,9 Md€ brut,
    tableau 1 ; l'écart est la TVA acquittée par les APU elles-mêmes, qui revient en dépense). Valeur retenue :
    net (7,5), cohérent avec un effet sur le solde des APU ; haut = brut (8,9). Symétrique pour une baisse.
    Projection 2032 : × 1,2106 (PIB nominal, plan/hypotheses.yaml) ≈ 9,1 Md€.
  limites: >
    Chiffrage statique (comportements inchangés), hors effets sur les prix et la consommation ; pour une baisse
    d'un point, la transmission aux prix est incomplète mais n'affecte pas le coût budgétaire statique.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Trésor-Éco n° 371 relu (PDF DG Trésor) : tableau 1 brut 8,9 Md€ au taux normal, tableau 2 net 7,5 Md€, 11,4
      Md€ pour tous les taux. Limite signalée (chiffrage statique) conforme à la source.

- id: tva_point_tous_taux
  libelle: "Rendement d'un point sur tous les taux de TVA (2,1 %, 5,5 %, 10 %, 20 %), net"
  valeur: 11.4
  haut: 13.7
  unite: Md€ par point et par an
  annee: "2025"
  sources:
    - titre: "DG Trésor, Trésor-Éco n° 371, « Analyse de la composition des recettes de TVA », septembre 2025"
      url: https://www.tresor.economie.gouv.fr/Articles/c462ac7f-76db-4c33-9bb3-dcc6886ed898/files/f4d0d1ac-fc61-4cf3-ab3f-094385b218bd
      date: "2025-09"
      extrait: "Par exemple, le rendement net d'une variation d'un point de tous les taux de TVA est estimé à 11,4 Md€ en 2025."
  derivation: >
    Lecture directe (net des APU) ; haut = rendement brut 13,7 Md€ (tableau 1). Par taux, net : 2,1 % → 0,4 ;
    5,5 % → 2,0 ; 10 % → 1,6 ; 20 % → 7,5 Md€.
  limites: "Chiffrage statique."

- id: tva_energie_electricite_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur l'électricité (ménages)"
  valeur: 5.0
  bas: 4.5
  haut: 5.1
  unite: Md€/an de recettes perdues (APU)
  annee: "2024-2025"
  sources:
    - titre: "Assemblée nationale, compte rendu intégral, 2e séance du jeudi 20 novembre 2025 (PLF 2026), avis du rapporteur général sur l'amendement n° 599 (TVA sur l'abonnement d'électricité)"
      url: https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2025-2026/deuxieme-seance-du-jeudi-20-novembre-2025
      date: "2025-11-20"
      extrait: "Cette mesure coûterait au moins 900 millions d’euros, mais plus vraisemblablement 5 milliards : la CJUE ne permettant pas d’appliquer des taux de TVA différents à une même livraison, il faudrait, si l’on baisse le taux de TVA sur l’abonnement,"
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 5.3.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Figure 5.3.3 : consommation finale énergétique dans le secteur résidentiel (données non corrigées des variations climatiques) et dépense associée [...] Électricité 159,7 32 698 155,2 34 377 150,7 36 387 150,9 42 246"
    - titre: "Public Sénat, 14 juin 2024, chiffrage attribué au ministère de l'économie (document de Bercy non publié)"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "la baisse de la TVA à 5,5 % sur l’électricité coûterait 4,5 milliards, le gaz (2,3 milliards), les carburants (10 milliards) a estimé vendredi le ministère de l’Economie et des Finances"
  derivation: >
    Central : 5 Md€, chiffrage du rapporteur général de l'Assemblée (novembre 2025) pour une baisse sur
    l'abonnement étendue à la consommation. Haut : recalcul sur la dépense TTC des ménages en électricité 2024
    (SDES) : 42,2 Md€ TTC ; TVA à 20 % = 42,2 / 6 = 7,04 Md€ ; à 5,5 % sur la même base HT (35,2 Md€) = 1,94 Md€ ;
    perte 5,1 Md€. Bas : 4,5 Md€ (Bercy, juin 2024, législation où l'abonnement était encore à 5,5 %).
  limites: >
    Statique, prix 2024 ; hors TVA non déductible du secteur public et des activités exonérées ; la directive TVA
    (2006/112, annexe III) autorise le taux réduit sur l'électricité. À projeter selon les prix de l'électricité,
    pas selon le PIB.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Valeur 5,0 confirmée par une source primaire ajoutée (rapporteur général de l'Assemblée, compte rendu du 20
      novembre 2025 : « plus vraisemblablement 5 milliards »). Le chiffrage de Bercy (2024) reste connu par la seule
      presse, gardé en bas.

- id: tva_energie_gaz_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur le gaz naturel (ménages)"
  valeur: 2.0
  bas: 1.7
  haut: 2.3
  unite: Md€/an de recettes perdues (APU)
  annee: "2024"
  sources:
    - titre: "Public Sénat, « Baisse de la TVA sur l’énergie proposée par le RN : une mesure chiffrée à 17 milliards selon Bercy », 14 juin 2024"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "la baisse de la TVA à 5,5 % sur l’électricité coûterait 4,5 milliards, le gaz (2,3 milliards), les carburants (10 milliards) a estimé vendredi le ministère de l’Economie et des Finances"
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 5.3.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Gaz naturel 130,5 12 870 11,4 12 496 101,9 13 125 100,2 13 978"
  derivation: >
    (1) Bercy, juin 2024 : 2,3 Md€ (haut). (2) Recalcul sur la dépense TTC des ménages en gaz 2024 (SDES,
    résidentiel) : 13,98 Md€ TTC ; base HT 11,65 Md€ ; TVA à 20 % = 2,33 Md€, à 5,5 % = 0,64 Md€ ; perte 1,69 Md€
    (bas). Valeur centrale : milieu arrondi, 2,0 Md€.
  limites: >
    Très sensible au prix du gaz (la dépense des ménages a varié de 30 % entre 2021 et 2023). Hors TVA non
    déductible du tertiaire public. Projeter avec le prix du gaz, pas avec le PIB.
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Recalcul SDES (figure 5.3.3, dépense résidentielle en gaz 13,98 Md€ TTC) inchangé ; haut 2,3 connu par la
      presse (Bercy 2024, aucun document primaire trouvé). Valeur 2,0 = milieu, convention signalée.

- id: tva_energie_carburants_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur les carburants routiers seuls (hors fioul domestique et GPL de chauffage)"
  valeur: 6.4
  haut: 12.4
  unite: Md€/an de recettes perdues (APU)
  annee: "2024 (prix) ; haut = prix de mars 2026"
  sources:
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), § 4.2.6"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "La TVA sur les produits pétroliers (hors part déductible pour les entreprises) s’élève à 9,7 Md€ en 2024, en baisse de 6,2 % par rapport à 2023 (en euros constants)."
    - titre: "Conseil des prélèvements obligatoires, « Quel avenir pour la fiscalité de l'énergie ? », juin 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-06/20260603-Quel-avenir-pour-la-fiscalite-de-l-energie.pdf
      date: "2026-06-03"
      extrait: "La fiscalité énergétique (59,7 Md€ en 2024, soit environ 2 % du PIB) repose principalement sur l’accise sur les produits énergétiques (39,5 Md€) et sur la TVA (17,6 Md€)."
    - titre: "Fondation IFRAP, 17 mars 2026, citant l'Institut Montaigne (chiffrage aux prix de mars 2026)"
      url: https://www.ifrap.org/emploi-et-politiques-sociales/carburants-et-pouvoir-dachat-rendre-45-milliards-de-fiscalite-aux-francais
      date: "2026-03-17"
      extrait: "Estimation Institut Montaigne : 10,3 milliards € par an (fourchette 8,2 à 12,4 Md€ selon variation de la consommation"
    - titre: "Public Sénat, 14 juin 2024, chiffrage attribué au ministère de l'économie (document non publié)"
      url: https://www.publicsenat.fr/actualites/politique/baisse-de-la-tva-sur-lenergie-proposee-par-le-rn-une-mesure-chiffree-a-17-milliards-selon-bercy
      date: "2024-06-14"
      extrait: "la baisse de la TVA à 5,5 % sur l’électricité coûterait 4,5 milliards, le gaz (2,3 milliards), les carburants (10 milliards)"
  derivation: >
    Central (données publiques primaires) : TVA non déductible sur les produits pétroliers en 2024, 9,7 Md€ (SDES) ;
    perte statique 9,7 × (1 − 5,5/20) = 7,0 Md€, moins la part du fioul et du GPL de chauffage (0,65,
    tva_energie_fioul_5_5), soit 6,4 Md€. Contrôle : la TVA sur toute l'énergie vaut 17,6 Md€ en 2024 (CPO), la perte
    maximale sur les quatre énergies est donc 17,6 × 0,725 = 12,8 Md€, ce qui exclut le « 10 Md€ » des seuls
    carburants attribué à Bercy en 2024 aux prix de 2024. Haut : Institut Montaigne, 12,4 Md€ aux prix élevés de mars
    2026 (central 10,3). Pour une promesse « carburants et fioul », additionner tva_energie_fioul_5_5.
  limites: >
    Très sensible au prix du pétrole : aux prix de 2026 le coût se rapproche de 10 Md€. Seule la TVA non déductible
    compte (ménages, entreprises non assujetties). La directive TVA (annexe III) ne liste pas les carburants parmi
    les biens éligibles au taux réduit : mesure juridiquement contestable.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Audit : chiffrage de Bercy connu par la seule presse. Le CPO (juin 2026) donne 17,6 Md€ de TVA sur toute
      l'énergie en 2024 : la perte maximale sur les quatre énergies est 12,8 Md€, incompatible avec 10 Md€ pour les
      seuls carburants aux prix de 2024. Central 9,4 → 6,4 (recalcul SDES, ancien bas) ; bas supprimé ; haut 12,4
      (Institut Montaigne, prix de mars 2026) inchangé.

- id: tva_energie_fioul_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur le fioul domestique (chauffage des ménages)"
  valeur: 0.6
  bas: 0.4
  haut: 0.65
  unite: Md€/an de recettes perdues (APU)
  annee: "2024"
  sources:
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 5.3.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Produits pétroliers 60,4 7 393 44,8 7 599 38,4 5 554 38,8 5 358"
  derivation: >
    Aucune source publique ne chiffre le fioul isolément (Bercy le regroupe avec les carburants). Recalcul :
    dépense TTC des ménages en produits pétroliers pour le logement (résidentiel) 2024 = 5,36 Md€ (fioul
    domestique et GPL) ; base HT 4,47 Md€ ; TVA à 20 % = 0,89 Md€, à 5,5 % = 0,25 Md€ ; perte 0,65 Md€ (haut,
    GPL inclus). Valeur centrale 0,6 Md€ (fioul majoritaire) ; bas 0,4 (baisse tendancielle du chauffage au fioul
    d'ici 2027-2032, interdiction des chaudières neuves au fioul depuis 2022).
  limites: "Estimation propre, non publiée par une administration ; inclut le GPL. Compris dans les 10 Md€ « carburants » de Bercy, mais exclu de tva_energie_carburants_5_5 (9,4 Md€, carburants seuls) : les deux barèmes s'additionnent sans double compte."
  verification:
    statut: ok
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Estimation propre à partir du SDES (figure 5.3.3), aucune source administrative ne chiffre le fioul seul ;
      inchangé.

- id: tva_energie_total_5_5
  libelle: "Coût du passage de 20 % à 5,5 % de la TVA sur électricité, gaz, carburants et fioul (ensemble)"
  valeur: 12.0
  bas: 9.0
  haut: 12.8
  unite: Md€/an de recettes perdues (APU)
  annee: "2024-2025"
  sources:
    - titre: "Assemblée nationale, compte rendu intégral, 2e séance du jeudi 20 novembre 2025, avis du Gouvernement (ministre de l'action et des comptes publics) sur l'amendement n° I-792 (TVA à 5,5 % sur le gaz, l'électricité, le fioul et les carburants)"
      url: https://www.assemblee-nationale.fr/dyn/17/comptes-rendus/seance/session-ordinaire-de-2025-2026/deuxieme-seance-du-jeudi-20-novembre-2025
      date: "2025-11-20"
      extrait: "Cependant, son coût serait de 12 milliards d’euros. Disons 10 ou 12 milliards."
    - titre: "Conseil des prélèvements obligatoires, « Quel avenir pour la fiscalité de l'énergie ? », juin 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-06/20260603-Quel-avenir-pour-la-fiscalite-de-l-energie.pdf
      date: "2026-06-03"
      extrait: "La fiscalité énergétique (59,7 Md€ en 2024, soit environ 2 % du PIB) repose principalement sur l’accise sur les produits énergétiques (39,5 Md€) et sur la TVA (17,6 Md€)."
    - titre: "Institut Montaigne, Législatives 2024, « Baisser la TVA de 20 à 5,5% pour les carburants, l’électricité, le gaz et le fioul domestique » (archive web)"
      url: https://web.archive.org/web/20241219114525/https://www.institutmontaigne.org/legislatives-2024/rassemblement-national/baisser-la-tva-de-20-a-55-pour-les-carburants-lelectricite-le-gaz-et-le-fioul-domestique
      date: "2024-06"
      extrait: "Par l'Institut Montaigne 11,3 Md€ 9 Md€ estimation basse 13,6 Md€ estimation haute"
  derivation: >
    Central : 12 Md€, chiffrage du Gouvernement devant l'Assemblée (novembre 2025) pour les quatre énergies. Haut :
    borne mécanique 17,6 Md€ de TVA sur l'énergie en 2024 (CPO) × (1 − 5,5/20) = 12,8 Md€ (perte maximale si toute
