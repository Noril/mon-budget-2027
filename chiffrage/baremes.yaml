  libelle: "Coût pour les administrations publiques d'une hausse de 1 % du Smic (effet total, barème RGDU de 2026)"
  valeur: 0.9
  bas: 0.31
  haut: 1.7
  unite: Md€/an de moindre solde par point de % de hausse du Smic
  annee: "2025-2026"
  sources:
    - titre: "Rapport du Groupe d'experts sur le Smic, 1er décembre 2017 (tableau n° 9, DG Trésor)"
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/2463e652-7de5-4cd4-b7da-6756e7c1374b
      date: "2017-12-01"
      extrait: "l’effet net est négatif pour les finances publiques (-400 M€). L’augmentation du SMIC accroît les cotisations et contributions sociales à la charge des salariés (240 M€) ainsi que l’impôt sur le revenu (70 M€). La hausse du SMIC relève les rémunérations dans la fonction publique de 260 M€"
    - titre: "Même rapport (total)"
      url: https://www.tresor.economie.gouv.fr/Articles/284b121f-b187-4280-b327-05f18064c3fa/files/2463e652-7de5-4cd4-b7da-6756e7c1374b
