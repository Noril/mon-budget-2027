      url: https://www.senat.fr/rap/l25-139-38/l25-139-38_mono.html
      date: "2025-11"
      extrait: "Sur le périmètre de la LPM (hors pensions), les crédits demandés s'établissent à 57,15 milliards d'euros , en hausse de 6,67 milliards d'euros par rapport à la LFI 2025."
    - titre: "Sénat, la loi en clair, projet de loi actualisant la programmation militaire 2024-2030 (2026)"
      url: https://www.senat.fr/travaux-parlementaires/textes-legislatifs/la-loi-en-clair/projet-de-loi-actualisant-la-programmation-militaire-pour-les-annees-2024-a-2030-et-portant-diverses-dispositions-interessant-la-defense.html
      date: "2026"
      extrait: "le projet de loi prévoit 36 milliards d’euros de ressources supplémentaires réparties sur la période 2026‑2030 , pour s’élever à un total de 436 milliards d’euros courants de crédits budgétaires"
  derivation: >
    Valeur lue (PLF 2026). La LPM 2024-2030 initiale prévoyait 413 Md€ (dont 400 Md€ de crédits budgétaires) ;
    l'actualisation de 2026 ajoute 36 Md€ sur 2026-2030 (total 436 Md€ de crédits budgétaires), avec l'objectif
    affiché d'un effort de défense d'au moins 2,5 % du PIB en 2030 et 3,5 % en 2035 (même page). La
    trajectoire LPM actualisée est la référence du « droit au 1er janvier 2027 » : une promesse ne se chiffre
    qu'au-delà de cette trajectoire. Pour un objectif en points de PIB, utiliser defense_0_1_point_pib_2032.
  indicateur: defense.depenses_defense_pib@1.0.0
  limites: >
    Crédits budgétaires de la mission hors pensions : différent de la dépense de défense COFOG (1,9 % du PIB en
    2024, indicateur du dépôt) et de la définition OTAN (pensions comprises). Les restes à payer et reports de
    charges (environ 8 Md€ fin 2025) rendent l'exécution annuelle incertaine.

- id: defense_0_1_point_pib_2032
  libelle: Coût annuel en 2032 d'un effort de défense supplémentaire de 0,1 point de PIB
  valeur: 3.6
  unite: Md€ courants 2032 par an, par dixième de point de PIB
  annee: "2032"
  sources:
    - titre: "FMI, World Economic Outlook avril 2026 (base de pib_nominal_2032)"
      url: https://api.imf.org/external/sdmx/2.1/data/IMF.RES,WEO/FRA.NGDP_RPCH.A
      date: "2026-04-14"
    - titre: "Sénat, la loi en clair, actualisation de la LPM 2024-2030 (objectifs en points de PIB)"
      url: https://www.senat.fr/travaux-parlementaires/textes-legislatifs/la-loi-en-clair/projet-de-loi-actualisant-la-programmation-militaire-pour-les-annees-2024-a-2030-et-portant-diverses-dispositions-interessant-la-defense.html
      date: "2026"
      extrait: "porter l’effort national de défense à 2,5 % minimum du produit intérieur brut en 2030, et d’atteindre 3,5 % à l’horizon 2035"
  derivation: >
    0,1 % × 3 621 Md€ (pib_nominal_2032) = 3,6 Md€. Une promesse « 3 % du PIB en 2032 » se chiffre par l'écart
    entre ce taux et la trajectoire de référence (2,5 % en 2030 dans la LPM actualisée, prolongée à 2032 par
    interpolation vers 3,5 % en 2035, soit environ 2,9 % en 2032 : convention à expliciter dans la mesure),
    multiplié par 36,2 Md€ par point.
  indicateur: defense.depenses_defense_pib@1.0.0
  limites: >
    Le périmètre de l'objectif (OTAN, pensions comprises) diffère des crédits de la mission ; la trajectoire au-delà
    de 2030 n'est pas votée (l'interpolation 2030-2035 est une convention).

