- id: allegements_generaux_cout
  libelle: "Coût des allègements généraux de cotisations patronales (réduction générale dégressive unique depuis 2026)"
  valeur: 75.6
  bas: 72.3
  haut: 77.5
  unite: Md€/an
  annee: "2025 (exécution, CCSS mai 2026) ; bas = prévision 2026 d'octobre 2025 ; haut = 2026 avant gel du barème"
  sources:
    - titre: "Commission des comptes de la sécurité sociale, rapport de mai 2026 (fiche 1.6)"
      url: https://www.securite-sociale.fr/files/live/sites/SSFR/files/medias/CCSS/2026/CCSS%20mai%202026_assembl%c3%a9_V2.pdf
      date: "2026-05"
