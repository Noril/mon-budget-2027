  derivation: >
    Lu dans la synthèse du COR (chiffrage DREES, modèle Trajectoire). Sert à deux usages : (1) déduire la suspension
    quand une source chiffre l'abrogation par rapport à la réforme complète (voir retraites_retour_62_ans_2032) ;
    (2) chiffrer une promesse de prolonger ou de pérenniser la suspension (ordre de grandeur d'un trimestre d'âge
    gelé pour une génération et demie). Âge légal après suspension : 62 ans 9 mois (1964), 63 ans (fin 1965),
    63 ans 3 mois (1966), 63 ans 6 mois (1967), 63 ans 9 mois (1968), 64 ans (1969).
  limites: >
