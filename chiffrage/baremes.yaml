      date: "2017-12-01"
      extrait: "L'augmentation du coût des dispositifs d'allègements l'emporte sur l'augmentation des cotisations sociales à la charge des employeurs 79, de telle sorte que l'effet net est négatif pour les finances publiques (-400 M€)."
  derivation: >
    −400 M€ (2017, DG Trésor) × PIB nominal 2025 / PIB nominal 2017 (2 991,06 / 2 291,68 = 1,305,
    finances.pib_nominal@1.0.0) = 0,52 Md€. Bas = montant 2017 non actualisé (0,40) ; haut = 0,65 pour tenir
    compte de la concentration accrue des salaires près du Smic et de l'indexation de la RGDU sur le Smic
    depuis 2026. L'effet brut sur le seul coût des allègements n'est pas publié séparément.
  indicateur: finances.pib_nominal@1.0.0
  limites: >
    Chiffrage ancien (barème 2017, CICE et Pacte encore en vigueur) ; aucune actualisation publique récente
    trouvée. Hypothèse de diffusion de la hausse jusqu'à 1,7 Smic. Hors effets emploi.

