    - titre: COR, Rapport annuel juin 2026, Synthèse (projection)
      url: https://www.cor-retraites.fr/sites/default/files/2026-06/Synth%C3%A8se_RA_2026_0.pdf
      date: "2026-06"
      extrait: "de 14,1 % en 2025, elle resterait à 14,1 % en 2030 pour atteindre 14,2 % en 2045."
  derivation: >
    Lu directement dans la synthèse du COR (422 Md€, 14,1 % du PIB en 2025). Projection 2032 : le COR donne une part
    stable de 14,1 % du PIB jusqu'en 2030 ; 14,1 % × 3 621 Md€ (PIB 2032, plan/hypotheses.yaml) ≈ 511 Md€ courants
    en 2032, à législation de juin 2026 (suspension de la réforme 2023 incluse).
  indicateur: retraites.depense_vieillesse_survie@1.0.0
  limites: >
    Périmètre COR : régimes légalement obligatoires, y compris FSV, hors RAFP, prestations et charges de gestion.
    L'indicateur du dépôt retraites.depense_vieillesse_survie (Eurostat SESPROS, 14,61 % du PIB en 2024) a un
    périmètre plus large (fonctions vieillesse et survie, dont prestations liées à l'autonomie des personnes âgées)
    et n'est pas directement comparable. La part de 14,1 % en 2032 est une extrapolation du point 2030 du COR.

- id: retraites_revalo_1pct
  libelle: Coût annuel d'une revalorisation supplémentaire de 1 % de toutes les pensions (base et complémentaires)
  valeur: 5.0
  bas: 3.5
  haut: 5.0
  unite: Md€ courants par an, en 2032, par point de revalorisation
  annee: "2032 (projeté depuis 2023-2025)"
  sources:
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Sur la base des dépenses prévisionnelles des régimes de retraite de base en 2025, qui s’élèvent à 288 Md€, une sous-indexation d’un point des pensions par rapport à l’inflation permettrait une économie de 2,9 Md€ pour cette même année"
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025 (structure des dépenses 2023)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "En 2023, les dépenses du système de retraites se sont établies à 388,4 Md€, soit 13,8 % du PIB, dont 376,8 Md€ de prestations de retraite"
    - titre: COR, Rapport annuel juin 2026, Synthèse
      url: https://www.cor-retraites.fr/sites/default/files/2026-06/Synth%C3%A8se_RA_2026_0.pdf
      date: "2026-06"
      extrait: "de 14,1 % en 2025, elle resterait à 14,1 % en 2030 pour atteindre 14,2 % en 2045."
  derivation: >
    Central (tous régimes) : dépenses de retraite 2032 = 14,1 % × 3 621 Md€ ≈ 511 Md€ ; part des prestations dans
    les dépenses = 376,8 / 388,4 = 0,97 (Cour, 2023) ; 1 % × 0,97 × 511 ≈ 4,95, arrondi à 5,0 Md€.
    Bas (régimes de base seuls, seul levier direct de la loi) : 2,9 Md€ en 2025 (Cour) × 1,2106 (croissance du PIB
    nominal 2025-2032) ≈ 3,5 Md€. L'effet est permanent : une revalorisation de 1 % une année relève le niveau de
    toutes les pensions des années suivantes.
  limites: >
    Montant brut. CONVENTION : l'effet sur le solde est net des prélèvements qui reviennent aux APU (CSG, CRDS,
    CASA, IR) : × (1 − retour_prelevements_pensions = 0,14), soit ≈ 4,3 Md€ net par point en 2032 (régimes de base
    seuls : ≈ 3,0), comme pour les salaires publics (retour_prelevements_salaires_publics). Les pensions complémentaires (Agirc-Arrco,
    Ircantec…) sont revalorisées par les partenaires sociaux : une promesse portant sur « les pensions » sans précision
    se lit sur le périmètre tous régimes, une promesse sur « la revalorisation légale » sur les seuls régimes de base.

- id: retraites_retour_62_ans_2032
  libelle: Coût en 2032 de l'annulation des mesures d'âge de la réforme 2023 (retour à 62 ans et au calendrier Touraine de durée), par rapport au droit au 1er janvier 2027 (réforme suspendue)
  valeur: 13.9
  bas: 8.9
  haut: 20
  unite: Md€ courants par an (solde du système de retraite), en 2032
  annee: "2032"
  sources:
    - titre: Assemblée nationale, rapport n° 613 (Ugo Bernalicis) sur la proposition de loi d'abrogation de la retraite à 64 ans, commission des affaires sociales, novembre 2024 (tableau de la Cnav)
      url: https://www.assemblee-nationale.fr/dyn/docs/RAPPANR5L17B0613.raw
      date: "2024-11"
      extrait: "Effet de relèvement des mesures d’âge sur les masses de prestations de droit direct (hors aspa), de cotisations sociales (hors cotisation équilibre employeur) et sur le solde financier en milliards d’euros courants [...] Solde 3,4 6,6 8,6 10,4 11,7 12,6 14,2 15,7 14,8 11,1"
    - titre: COR, Rapport annuel juin 2026, Synthèse (coût de la suspension)
      url: https://www.cor-retraites.fr/sites/default/files/2026-06/Synth%C3%A8se_RA_2026_0.pdf
      date: "2026-06"
      extrait: "ainsi que la suspension de la réforme des retraites de 2023 (coût de 1,8 milliard d’euros en moyenne en année pleine jusqu’en 2032)"
    - titre: COR, Rapport annuel juin 2026 (état du droit après la LFSS 2026)
      url: https://www.cor-retraites.fr/sites/default/files/2026-07/RA_2026_def_1.pdf
      date: "2026-06"
      extrait: "La loi n° 2025-1403 de financement de la sécurité sociale du 30 décembre 2025 prévoit une suspension de la réforme des retraites : la montée en charge de la réforme est suspendue pour la génération 1964 et les assurés nés entre le 1er janvier et le 31 mars 1965 ; elle reprend ensuite pour les générations suivantes."
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "La direction générale du Trésor et Rexecode convergent sur les effets nets sur le solde, qu’ils considèrent respectivement amélioré de 9,7 Md€ et de 11,8 Md€ en 2030."
    - titre: "Fondation IFRAP, « Retraites : la suspension va coûter des milliards », 17 octobre 2025"
      url: https://www.ifrap.org/retraite/retraites-la-suspension-va-couter-des-milliards
      date: "2025-10-17"
      extrait: "représenter un total de 18 à 20 Mds € en 2035 de coût pour le système de retraite"
    - titre: Cour des comptes, Situation financière et perspectives du système de retraites, février 2025 (coût complet pour les finances publiques)
      url: https://www.ccomptes.fr/sites/default/files/2025-03/20250220-Situation-financiere-et-perspectives-du-systeme-de%20retraites.pdf
      date: "2025-02-20"
      extrait: "Le gain total pour le système de retraites et les autres administrations publiques en 2030 est donc estimé à 24,2 Md€ par la direction générale du Trésor et à 20 Md€ par Rexecode."
  derivation: >
    Central : effet des mesures d'âge (âge d'ouverture des droits et accélération de la durée) sur le solde, estimé par
    la Cnav à 15,7 Md€ courants en 2032 (colonne 2032 du tableau : prestations −11,2, cotisations +4,5), moins le
    coût de la suspension déjà inscrite dans le droit au 1er janvier 2027 (1,8 Md€ par an en moyenne jusqu'en 2032,
    COR 2026) : 15,7 − 1,8 = 13,9 Md€. Bas : effet net de la réforme sur le solde du système selon la DG Trésor,
    9,7 Md€ constants 2024 en 2030, × 1,0997 (déflateur 2030/2024) − 1,8 ≈ 8,9 Md€. Haut : Fondation IFRAP (octobre 2025), coût
    pour le système de retraite d'une suspension prolongée (âge et durée figés au niveau de la génération 1964,
    donc au-dessus de 62 ans) : 18 à 20 Md€ en 2035 ; un retour à 62 ans coûte au moins autant : 20 Md€ (borne
    haute, en euros 2035, l'effet 2032 étant voisin selon le profil Cnav). L'ancienne borne (estimation d'un
    candidat) est abandonnée. PÉRIMÈTRE : solde du système de retraite (pensions et cotisations vieillesse), pas
    l'ensemble des APU. Raison : l'écart entre les deux (Cour 2035, âge bloqué à 63 ans : 5,8 Md€ pour le système,
    13 Md€ pour les finances publiques ; DG Trésor 2030 : 9,7 contre 24,2 Md€ constants 2024) vient pour
    l'essentiel des prélèvements sur l'emploi supplémentaire des seniors et de l'activité induite, que la règle 3
    classe parmi les effets non comptés (emploi) ; les dépenses de chômage, d'invalidité et de minima évitées ou
    induites, seules composantes mécaniques, ne sont pas isolées par les sources. Le coût complet APU se décrit
    dans effets_retour et chiffrages_tiers. D'après le COR, l'effet
    de la réforme sur le nombre de retraités est maximal vers 2032 ; il décroît ensuite (Cnav : 14,8 en 2035, 11,1 en 2040).
  limites: >
    Le tableau Cnav date de 2024 (hypothèses COR 2024) ; son périmètre exact (régime général ou tous régimes) n'est pas
    précisé dans le rapport. Les mesures d'accompagnement (revalorisation du minimum contributif) sont maintenues.
    Aucune source publique ne sépare l'effet de l'âge seul de celui de la durée en 2032 ; en 2032 l'écart de durée
    entre la réforme et le calendrier Touraine est de 1 à 3 trimestres selon la génération, l'essentiel du coût vient
    donc de l'âge. Effets sur les autres recettes publiques non comptés (règle 3) : en y ajoutant les prélèvements
    induits par l'emploi des seniors, la DG Trésor chiffre le gain total de la réforme à 24,2 Md€ constants 2024 en
    2030 (Cour des comptes, tableau n° 5), ce qu'il faut décrire dans effets_retour. Institut Montaigne
    (législatives 2024) : rendement des mesures d'âge de la réforme 2023 estimé à 8,2 Md€ à l'échéance 2027.
    Montants bruts : les pensions supplémentaires supportent CSG, CRDS, CASA et IR (retour_prelevements_pensions,
    ≈ 14 %) : l'effet net sur le solde est × (1 − 0,14) sur la part « prestations » (11,2 des 15,7 Md€ Cnav).

- id: retraites_suspension_reforme_2023
