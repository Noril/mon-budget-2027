- id: ticpe_centime_litre
  libelle: "Rendement d'une hausse (ou coût d'une baisse) de 1 centime par litre de l'accise sur les carburants routiers"
  valeur: 0.48
  bas: 0.45
  haut: 0.50
  unite: Md€/an par centime d'euro par litre (accise seule, hors TVA induite)
  annee: "2024 (volumes) ; recoupement 2022"
  sources:
    - titre: "Ministère de l'économie, communiqué du 26 mars 2022, modalités de la remise de 15 centimes par litre"
      url: https://presse.economie.gouv.fr/26-03-2022-modalites-de-mise-en-oeuvre-de-la-remise-de-15-centimes-deuro-par-litre-pour-lacquisition-de-carburants/
      date: "2022-03-26"
      extrait: "Son coût est estimé à 3 milliards d’euros."
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), figure 4.2.1.2"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Gazole routier 33,8 58 097 31,8 65 255 30,2 57 148 29,3 50 969 Fioul domestique et autres gazoles 10,6 11 970 9,8 15 598 9,1 12 069 9,0 10 773 Supercarburants* 9,0 20 255 10,3 25 934 10,9 27 229 11,7 27 795"
    - titre: "FIPECO, fiche « Les taxes sur les carburants » (taux d'accise 2026)"
      url: https://www.fipeco.fr/fiche/Les-taxes-sur-les-carburants
      extrait: "les taux de l’accise en 2026 sont de 59,40 centimes par litre pour le gazole et 68,29 centimes pour l’essence sans plomb SP95-E5."
  derivation: >
    Volumes 2024 (SDES) : gazole routier 29,3 Mtep, supercarburants 11,7 Mtep ; conversion (≈ 1 tep par tonne ;
    0,845 kg/l pour le gazole, 0,755 kg/l pour l'essence) : ≈ 34,7 + 14,8 = 49,5 milliards de litres, soit
    ≈ 0,495 Md€ par c€/l. Recoupement officiel : la remise de 15 c€/l pendant quatre mois (2022) était chiffrée à
    3 Md€, soit 3 / (15 × 4/12) = 0,60 Md€ par c€/l et par an, gazole non routier, pêche, GPL et GNV compris ;
    hors ces produits (≈ 0,1), ≈ 0,50 pour les carburants routiers. Valeur 0,48 (accise seule, volumes 2025-2027 en
    légère baisse). TVA induite (règle 3, retour certain) : ≈ 0,495 × 0,65 (part non déductible) × 0,20 ≈ 0,06 Md€,
    d'où ≈ 0,54 Md€ accise + TVA (convention 6 de REFERENCE.md), à calculer dans la mesure (× 1,125). Bornes, sur
    la même base (accise seule) : haut 0,50 (volumes 2024 sans baisse ; recoupement de 2022) ; bas 0,45 (recul
    des volumes d'ici 2032 et remboursements partiels aux transporteurs).
  limites: >
    Estimation propre à partir de volumes publics, recoupée par le chiffrage de 2022 : aucune source administrative
    récente ne publie le rendement d'un centime. La valeur centrale (0,48) est l'accise SEULE ; le chiffre pour le
    solde avec la TVA induite (0,54, REFERENCE.md) n'est pas un champ du barème. Hors réaction de la consommation.
  verification:
    statut: corrige
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Recoupement officiel ajouté (communiqué de Bercy du 26 mars 2022 : remise de 15 c€/l pendant quatre mois = 3
      Md€, soit 0,60 Md€ par c€/l tous carburants, ≈ 0,50 routiers). Valeur 0,48 confirmée. Signalement : bornes sur
      des bases différentes ; haut 0,55 (TVA comprise) → 0,50 (accise seule, comme la valeur et le bas). Le 0,54 de
      REFERENCE.md (accise + TVA induite) reste une dérivation du dépôt.

- id: accise_electricite_1_euro_mwh
  libelle: Rendement (ou coût) d'une variation de 1 €/MWh du tarif normal de l'accise sur l'électricité
  valeur: 0.30
  bas: 0.16
  haut: 0.33
  unite: Md€ par an par €/MWh
  annee: "2024 (volumes) ; 2025 (rendement)"
  sources:
    - titre: "SDES, Bilan énergétique de la France pour 2024 (mars 2026), § 4.6.3"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Non corrigée du climat, la consommation finale d’électricité augmente de 0,2 % en 2024, s’établissant à 398 TWh"
    - titre: "SDES, même bilan (tarifs d'accise)"
      url: https://www.statistiques.developpement-durable.gouv.fr/media/9087/download?inline
      date: "2026-03"
      extrait: "Les tarifs augmentent uniformément de 20 €/MWh au 1er février 2024, à 20,5 €/MWh pour les entreprises et 21 €/MWh pour les particuliers. Cependant, les entreprises bénéficiant de tarifs réduits, notamment les industries électro-intensives, conservent un tarif réduit à 0,50 €/MWh."
    - titre: "Cour des comptes, Analyse de l'exécution budgétaire 2025, mission Recettes fiscales, avril 2026"
      url: https://www.ccomptes.fr/sites/default/files/2026-04/NEB-2026-Recettes-fiscales.pdf
      date: "2026-04"
      extrait: "La hausse se concentre sur la fraction d’accise sur l’électricité (+ 3,9 Md€), dont le rendement passe de 1,5 à 5,4 Md€ entre 2024 et 2025."
  derivation: >
    Assiette : consommation finale d'électricité 2024, 398 TWh (SDES), dont 158 TWh pour le résidentiel (corrigé
    du climat) et 100 TWh pour l'industrie. En retirant les consommations à tarif réduit (électro-intensifs,
    industrie exposée, transports guidés, centres de données : de l'ordre de 60 à 100 TWh), une hausse uniforme
    de 1 €/MWh du tarif normal touche ≈ 300 TWh, soit ≈ 0,30 Md€. Bas : ménages seuls (≈ 158 TWh, 0,16 Md€).
    Haut : central + TVA induite sur la part payée par les ménages (20 % × 0,16 ≈ 0,03 Md€). Une mesure qui ne
    vise que le tarif des ménages se chiffre au bas (0,16, ou ≈ 0,19 avec des volumes 2025 plus élevés), pas au
    central. Contrôle : la
    fraction de l'État est passée de 1,5 à 5,4 Md€ entre 2024 et 2025 quand le tarif des ménages est revenu de 21 €/MWh à
    son niveau d'avant crise (un peu plus de 30 €/MWh) en février 2025 : ≈ +3,9 Md€ pour ≈ +12 €/MWh sur onze
    mois, soit ≈ 0,3 Md€ par €/MWh, cohérent avec la valeur centrale.
  limites: >
    Estimation propre sur des volumes publics : ni le tome I des Voies et moyens ni la Cour ne publient le
    rendement « par euro » (la Cour recommande d'ailleurs de publier le montant brut des fractions de l'accise
    sur l'électricité). Hors fractions affectées aux collectivités (ex-TCFE) si la mesure ne les vise pas.
    Statique : élasticité-prix de court terme faible. La fin du taux réduit de TVA sur les abonnements
    (2025) s'est accompagnée d'une baisse de la fraction d'accise (Cour des comptes, même note) : vérifier le
    tarif de référence de la législation 2027 avant de chiffrer une « annulation de la hausse ».
  verification:
    statut: conteste
    par: "passe-sources"
    date: "2026-09-29"
    commentaire: >
      Signalement : une dérivation à partir d'un rapport du Sénat donnerait ≈ 0,19 Md€ par €/MWh. Aucune source
      primaire ne publie ce rendement. Deux lectures : tarif normal sur ≈ 300 TWh (0,30, central) ou ménages seuls
      (≈ 150 à 190 TWh, 0,16 à 0,19, bas). Le recoupement Cour (fraction électricité 1,5 → 5,4 Md€ de 2024 à 2025
      pour ≈ +12 €/MWh chez les ménages et ≈ +5 à +6 €/MWh chez les entreprises) plaide pour la lecture large quand
      la mesure vise tous les consommateurs. Valeurs inchangées ; précision ajoutée dans la dérivation.

