    - titre: "Observatoire de l'immigration et de la démographie (OID), Réduire le coût net de l'immigration, février 2025 (source contestée)"
      url: https://observatoire-immigration.fr/cout-immigration-economies/
      date: "2025-02-07"
      extrait: "Le coût net de l’immigration est quant à lui estimé à 41 milliards d’euros , une fois retranchées les contributions des étrangers au budget – par leurs impôts et cotisations sociales."
    - titre: "Cour des comptes, La politique de lutte contre l'immigration irrégulière, janvier 2024"
      url: https://www.ccomptes.fr/fr/publications/la-politique-de-lutte-contre-limmigration-irreguliere
      date: "2024-01-04"
      extrait: "Le coût direct de la politique de lutte contre l'immigration irrégulière est d'environ 1,8 Md€ par an."
    - titre: "CEPII, Chojnicki, Ragot et Sokhna, L'impact budgétaire de 30 ans d'immigration en France, document de travail 2018-04"
      url: https://www.cepii.fr/PDF_PUB/wp/2018/wp2018-04.pdf
      date: "2018-04"
      extrait: "Leur contribution est toujours restée contenue en deçà de ±0, 5% du PIB"
  derivation: >
    Central : document de politique transversale (DPT) annexé au PLF 2026, 19 programmes, 7,82 Md€. Bas : crédits
    de paiement de la seule mission Immigration, asile et intégration (2,16 Md€). Haut : coût net de l'immigration
    pour toutes les APU selon l'OID (41 Md€), borne signalée, non validée : l'OID (think tank engagé) impute aux
    étrangers des dépenses générales (santé, retraites, chômage) et en retranche leurs prélèvements. Le CEPII, sur
    1979-2011, trouve à l'inverse une contribution nette comprise entre -0,5 et +0,5 point de PIB (-18 à +18 Md€
    en 2032). Hors dépenses de l'État, l'AME (ministère de la santé) est comptée à part (voir le barème AME du
    cluster social).
  limites: >
    Les trois chiffres ne mesurent pas la même chose (dépense ciblée de l'État, dépense budgétaire d'une mission,
    solde net des APU pour toute la population étrangère). La Cour des comptes et le CEC de l'Assemblée ont
    critiqué le DPT comme incomplet (lutte contre l'immigration irrégulière estimée par la Cour à environ
    1,8 Md€ par an, contre 0,26 Md€ affichés au DPT en 2024, selon le même rapport du Sénat). Pour chiffrer une
    mesure (ex. suppression de l'AME, fin d'une prestation pour les étrangers), partir de la dépense précise
    visée, pas de ces agrégats.
