- id: point-indice
  theme: Fonction publique
  question: Comment faire évoluer la rémunération des agents publics (point d'indice) ?
  aide: Le point d'indice est gelé en droit constant ; l'indexer sur l'inflation de 2027 à 2032 coûte environ 28,6 Md€ bruts
    en 2032, 20,6 Md€ nets des prélèvements en retour (barème indexation_point_indice_2027_2032).
