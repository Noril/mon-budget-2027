      services-agents-publics: 1
    effet:
      central: -5.59
      bas: -6.03
      haut: -5.1
    calcul: '3 × point_indice_1pct_2032 (2,59) × (1 − 0,28) ; bornes : 2,68 × 0,75 et 2,5 × 0,68 (convention 12).'
