      '2027': 0.08
      '2028': 0.26
      '2029': 0.44
      '2030': 0.63
      '2031': 0.81
      '2032': 1.0
  - id: hausse-10-indexation
    libelle: Hausse de 10 % pour tous puis indexation sur l'inflation
