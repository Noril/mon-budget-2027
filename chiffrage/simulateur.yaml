- id: point-indice
  theme: Fonction publique
  question: Comment faire évoluer la rémunération des agents publics (point d'indice) ?
  aide: Le point d'indice est gelé en droit constant. L'indexer sur l'inflation de 2027 à 2032 coûte environ 20,6 Md€ bruts
    en 2032, 14,8 Md€ nets des prélèvements en retour.
  type: choix
  axe: depenses
  options:
  - id: gel
    libelle: Pas d'évolution automatique (droit en vigueur)
    defaut: true
    effet:
      central: 0
      bas: 0
      haut: 0
    calcul: 'Droit en vigueur au 29 septembre 2026 : effet nul par construction.'
    candidats: []
  - id: hausse-3-pct
    libelle: Hausse ponctuelle de 3 %, sans indexation
    axes:
      services-agents-publics: 1
    effet:
      central: -4.02
      bas: -4.34
      haut: -3.67
    calcul: '3 × point_indice_1pct_2032 (1,86) × (1 − 0,28) ≈ 4,0 Md€ nets (5,6 bruts) ; bornes : 3 × 1,93 × 0,75 ≈ 4,3 et
      3 × 1,80 × 0,68 ≈ 3,7 (convention 12). Effet net des prélèvements en retour, comme les autres options du levier (jusqu''au
      30/09/2026, l''effet portait par erreur le montant brut).'
    candidats: []
  - id: indexation
    libelle: Indexation sur l'inflation
    axes:
      services-agents-publics: 1
    effet:
      central: -14.83
      bas: -17.65
      haut: -11.56
    reprend:
    - glucksmann-place-publique/point-indice-indexe-inflation
    calcul: 'Barème indexation_point_indice_2027_2032 : 20,6 Md€ brut × (1 − 0,28) ≈ 14,8 Md€ net ; chiffrage Glucksmann repris.
      [Recalé le 2026-09-29 sur le chiffrage de glucksmann-place-publique.]'
    candidats:
    - glucksmann-place-publique
    montee:
      '2027': 0.13
      '2028': 0.3
      '2029': 0.48
      '2030': 0.66
      '2031': 0.83
      '2032': 1.0
  - id: indexation-hausse-ciblee
    libelle: Indexation sur l'inflation et +10 % pour les catégories qui ont perdu du pouvoir d'achat
    axes:
      services-agents-publics: 2
    effet:
      central: -23.91
      bas: -27.5
      haut: -19.73
    reprend:
    - tondelier-ecologistes/point-indice-fonctionnaires
