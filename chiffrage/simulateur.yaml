# Leviers du simulateur budgétaire (schéma schemas/simulateur.schema.json).
# Effets en Md€ courants 2032 sur le solde primaire des APU, par rapport au droit en vigueur au 29 septembre 2026
# (chiffrage/REFERENCE.md) ; négatif = coût ; bas = hypothèse défavorable au solde. Une option qui « reprend » une
# mesure en reprend le chiffrage (chiffrage/programmes/) ; les autres sont tirées de chiffrage/baremes.yaml.
# Pas de levier « économies non détaillées » : une enveloppe sans mesure n'a pas d'effet (règle 6 du README).
# Curseurs : Δ de dépenses en Md€ ; positions = somme des mesures du programme dans le domaine, hors mesures déjà
# couvertes par un levier à choix. Montée en charge : celle des mesures reprises, sinon montee_par_defaut.
montee_par_defaut:
  '2027': 0
  '2028': 0.4
  '2029': 0.7
  '2030': 0.9
  '2031': 1
  '2032': 1
leviers:
- id: retraites-age
  theme: Retraites
  question: À quel âge ouvrir le droit à la retraite ?
  aide: Le droit en vigueur reprend en 2028 la montée vers 64 ans ; un an d'âge légal vaut environ 6,6 Md€ par an en 2032
    pour le système de retraite (barème retraites_age_legal_1_an).
  type: choix
  axe: depenses
  options:
  - id: 60-ans
    libelle: 60 ans pour tous, 40 annuités pour le taux plein
    axes:
      protection-sociale: 2
    effet:
      central: -42.9
      bas: -60.0
      haut: -32.9
    reprend:
    - melenchon-lfi/retraite-60-ans
    calcul: 'Chiffrage LFI repris : retour à 62 ans (13,9 Md€) plus passage de 62 à 60 ans et à 40 annuités.'
    candidats:
    - melenchon-lfi
    montee:
      '2027': 0.0
      '2028': 0.35
      '2029': 0.55
      '2030': 0.75
      '2031': 0.9
      '2032': 1.0
  - id: 62-ans-carrieres-longues
    libelle: 62 ans (42 annuités), 60 ans avec 40 annuités pour ceux qui ont commencé à travailler tôt
    axes:
      protection-sociale: 2
    effet:
      central: -26.58
      bas: -44.4
      haut: -17.65
    reprend:
    - le-pen-rn/retraites-60-62-ans
    calcul: 'Chiffrage RN repris, sur les mêmes barèmes que l''option 60 ans : retour à 62 ans (13,9 Md€), durée ramenée à
      42 annuités (3,3 Md€) et, pour environ 35 % du coût d''un passage de tous à 60 ans et 40 annuités (convention appuyée
      sur la part des générations ayant commencé avant 20 ans), 9,4 Md€.'
    candidats:
    - le-pen-rn
  - id: 62-ans
    libelle: 62 ans (abrogation de la réforme de 2023)
    axes:
      protection-sociale: 1
    effet:
      central: -13.9
      bas: -20.0
      haut: -8.9
    reprend:
    - glucksmann-place-publique/abrogation-reforme-retraites-2023
    - tondelier-ecologistes/retraites-retour-62-ans
    calcul: Barème retraites_retour_62_ans_2032 (13,9 Md€), identique dans les deux programmes.
    candidats:
    - glucksmann-place-publique
    - tondelier-ecologistes
    montee:
      '2027': 0.0
      '2028': 0.15
      '2029': 0.35
      '2030': 0.6
      '2031': 0.8
      '2032': 1.0
  - id: 64-ans
    libelle: 64 ans, calendrier en vigueur
    defaut: true
    effet:
      central: 0
      bas: 0
      haut: 0
    calcul: 'Droit en vigueur au 29 septembre 2026 : effet nul par construction.'
    candidats: []
  - id: plus-de-64-ans
    libelle: Au-delà de 64 ans à terme (65 à 67 ans, ou taux plein plus tardif)
    axes:
      protection-sociale: -1
    effet:
      central: 3.3
      bas: 0.0
      haut: 7.9
    reprend:
    - philippe-horizons/retraites-travailler-plus-longtemps
    - retailleau-lr/retraites-age-63-taux-plein-65
    - zemmour-reconquete/retraite-64-voire-65
    calcul: Chiffrage Philippe repris (66 ans à terme, 3 mois par génération) ; effet 2032 limité par le calendrier. Retailleau
      (63 ans minimum, taux plein à 65 ans) est chiffré à 4,19 et Zemmour (64 voire 65 ans) à 1,65.
    candidats:
    - philippe-horizons
    - retailleau-lr
    - zemmour-reconquete
    montee:
      '2027': 0.0
      '2028': 0.1
      '2029': 0.3
      '2030': 0.5
      '2031': 0.75
      '2032': 1.0
