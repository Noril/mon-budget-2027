id: immigration.eloignements_executes_ue
libelle: "Retours effectifs après obligation de quitter le territoire, pour 100 000 habitants"
unite: retours pour 100 000 habitants
sens: neutre
sources: [eurostat-migr-eirtn, eurostat-demo-gind]
maille: [france, pays]
formule: indicateurs/immigration/eloignements_executes_ue.sql
format: "{:.1f} pour 100 000 habitants"
limites: >
  Ressortissants de pays tiers ayant effectivement quitté le territoire à la suite d'une décision d'éloignement, retours forcés et volontaires, vers un pays tiers ou un autre État membre.
construction: >
  Numérateur : Eurostat migr_eirtn, citizen = TOTAL, c_dest = TOTAL, age = TOTAL, sex = T, unit = PER, valeur OBS_VALUE en
  personnes. Dénominateur : Eurostat demo_gind, indic_de = JAN (population au 1er janvier), même code pays et
  même année (TIME_PERIOD). Valeur = 100 000 × numérateur / dénominateur, arrondie à 0,1. Code pays = partie
  de geo avant « : » (FR, DE, EU27_2020…), y compris les agrégats publiés par Eurostat (EU27_2020 : numérateur et
  population de l'agrégat Eurostat). Pays sans population dans demo_gind exclus. Maille france = ligne FR recopiée.
comparaison_ue: maille pays, agrégat EU27_2020
version: 1.0.0
relu_par: null
