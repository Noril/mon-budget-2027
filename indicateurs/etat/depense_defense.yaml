id: etat.depense_defense
libelle: "Dépenses publiques, fonction GF02 : Défense"
unite: "% du PIB"
sens: neutre
sources: [eurostat-gov-10a-exp]
maille: [france, pays]
formule: indicateurs/etat/depense_defense.sql
format: "{:.1f} % du PIB"
limites: >
  Classification des fonctions des administrations publiques (COFOG), fonction GF02 « Défense » : dépenses totales
  (fonctionnement, prestations, subventions, investissement, intérêts) de l'ensemble des administrations publiques
  (État, organismes divers, collectivités locales, sécurité sociale), consolidées entre elles. Défense militaire et civile, aide militaire à l'étranger, R&D de défense. Les pensions des militaires sont classées en protection sociale (GF10), pas ici. Ratio arrondi à
  0,1 point par Eurostat : l'écart France − UE se lit à 0,1 point près. Dernière année provisoire.
construction: >
  Eurostat gov_10a_exp, lignes unit = PC_GDP, sector = S13, cofog99 = GF02, na_item = TE (codes = partie des
  colonnes avant « : »). Valeur = OBS_VALUE telle que publiée (% du PIB, une décimale), lignes vides exclues, lignes
  identiques dédoublonnées ; valeurs provisoires (OBS_FLAG = p) gardées. Période = TIME_PERIOD. Maille pays : code =
  partie de geo avant « : » (FR, DE, EU27_2020…), libellé = partie après. Maille france = ligne geo FR recopiée avec
  le code FR et le libellé « France ».
comparaison_ue: maille pays, agrégat EU27_2020
version: 1.0.0
relu_par: null
