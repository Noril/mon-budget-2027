id: transports.regularite_ter
libelle: Régularité des TER (part des trains arrivés à l'heure)
unite: "% des trains ayant circulé"
sens: plus_haut_mieux
sources: [sncf-regularite-ter, insee-cog-regions]
maille: [france, region]
formule: indicateurs/transports/regularite_ter.sql
format: "{:.1f} %"
limites: >
  « Régularité à cinq minutes » : un train est en retard s'il arrive au terminus plus de cinq minutes après l'heure
  prévue (retards aux gares intermédiaires non mesurés) ; les trains supprimés ne comptent pas (voir transports.annulations_ter). TER exploités par SNCF Voyageurs dans onze régions, sans l'Île-de-France
  (Transilien) ni la Corse ; les lots ouverts à la concurrence, publiés à part depuis 2025, sont additionnés à leur région.
  2013 à 2015 : Lorraine absente (refus de transmission de la région) et Nord-Pas-de-Calais incomplet. Maille région à
  partir de 2018 seulement.
construction: >
  Source sncf-regularite-ter, une ligne par mois (date) et région ou lot (region). Chaque nom de region est rattaché
  à une région actuelle : anciennes régions (Rhône Alpes et Auvergne -> 84 ; Bourgogne, Franche Comté -> 27 ;
  Centre -> 24 ; Alsace, Lorraine, Champagne Ardenne -> 44 ; Nord Pas de Calais, Picardie -> 32 ; Haute et Basse
  Normandie -> 28 ; Aquitaine, Limousin, Poitou Charentes -> 75 ; Midi Pyrénées, Languedoc Roussillon -> 76), lots
  d'exploitation (Etoile Amiens -> 32, Loire Océan -> 52, Sud Azur -> 93) et noms actuels (Nouvelle Aquitaine -> 75,
  Centre Val-de-Loire -> 24, Pays-de-la-Loire -> 52, Provence Alpes Côte d'Azur -> 93 ; les autres par égalité avec
  LIBELLE de insee-cog-regions). Lignes où nombre_de_trains_en_retard_a_l_arrivee est vide écartées. Valeur = 100 ×
  (1 - somme de nombre_de_trains_en_retard_a_l_arrivee / somme de nombre_de_trains_ayant_circule) sur l'année civile,
  arrondie à 2 décimales. Maille region : années 2018 et suivantes, région gardée si ses lignes couvrent les douze
  mois ; libellé = LIBELLE du COG. Maille france : toutes les lignes, années couvrant douze mois.
comparaison_ue: null
version: 1.0.0
relu_par: null
