# Catalogue des sources. Chaque entrée est validée par schemas/source.schema.json.
# statut: actif      -> ingérée par `uv run python -m pipelines.ingest`
# statut: a-brancher -> connecteur à écrire (le mode d'accès est déjà vérifié)

- id: ameli-ald-sans-mt
  titre: Part de patients en affection de longue durée sans médecin traitant
  producteur: Assurance maladie (CNAM)
  doc: https://data.ameli.fr/explore/dataset/patients-longueduree-annuelle/
  acces:
    mode: opendatasoft
    portail: https://data.ameli.fr
    jeu: patients-longueduree-annuelle
    auth: aucune
  licence: ODbL
  maille: [france, region, departement]
  millesime: annuel
  fraicheur_max_jours: 450
  domaines: [sante]
  controles:
    lignes_min: 900
    colonnes: [annee, region, departement, taux_patients_ald_sans_mt_integer]
  statut: actif

- id: ameli-demographie-ps
  titre: Professionnels de santé libéraux, effectifs et densités
  producteur: Assurance maladie (CNAM)
  doc: https://data.ameli.fr/explore/dataset/demographie-effectifs-et-les-densites/
  acces:
    mode: opendatasoft
    portail: https://data.ameli.fr
    jeu: demographie-effectifs-et-les-densites
    auth: aucune
  licence: ODbL
  maille: [france, region, departement]
  millesime: annuel
  fraicheur_max_jours: 450
  domaines: [sante]
  controles:
    lignes_min: 3000000
    colonnes: [annee, profession_sante, departement, classe_age, effectif, densite]
  statut: actif
  notes: 3,4 millions de lignes ; export Parquet complet.

