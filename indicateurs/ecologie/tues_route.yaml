id: ecologie.tues_route
libelle: Personnes tuées sur les routes par million d'habitants
unite: tués à 30 jours par million d'habitants
sens: plus_bas_mieux
sources: [onisr-baac, insee-estimations-population, insee-cog-departements, eurostat-tran-sf-roadus, eurostat-population-moyenne]
maille: [france, departement, pays]
formule: indicateurs/ecologie/tues_route.sql
format: "{:.1f} tués par million d'habitants"
limites: >
  Rapporté aux habitants du département où a lieu l'accident, pas au trafic : les départements de transit (autoroutes,
  tourisme) sont pénalisés. Petits effectifs : une année isolée varie fortement dans les départements peu peuplés.
  Deux sources, deux champs : la maille france (ONISR, 101 départements dont l'outre-mer) et la ligne pays FR (Eurostat,
  base CARE, plus proche du champ métropolitain) ne coïncident pas ; comparer la France à l'UE avec la maille pays
  uniquement. Seules les années 2019 et suivantes (format BAAC actuel) sont calculées pour les départements.
construction: >
  Départements : source onisr-baac (normalisée : tués = usagers avec grav = 2, décès dans les 30 jours, par année et
  département de l'accident, dep), rapportés à la population au 1er janvier de la même année (insee-estimations-population,
  GEO_OBJECT = DEP, EP_MEASURE = POP_JAN_1ST, AGE = _T, SEX = _T). Seuls les codes dep présents dans le COG des
  départements (insee-cog-departements) sont gardés : les collectivités d'outre-mer (975, 977, 978, 986, 987, 988)
  sont exclues, Mayotte (976) incluse. Valeur = 10^6 × tués / population, arrondie à 0,1. France (code FR) : somme des
  tués des départements gardés / somme de leurs populations. Pays : Eurostat tran_sf_roadus, unit = NR, sex = T,
  age = TOTAL, pers_cat = TOTAL, divisé par la population moyenne (demo_gind, indic_de = AVG) du même pays et de la même
  année, × 10^6, arrondi à 0,1 ; code pays = partie de geo avant « : », libellé = partie après. La colonne P_MHAB
  d'Eurostat n'est pas utilisée (valeur aberrante pour EU27_2020, voir le catalogue).
comparaison_ue: maille pays, agrégat EU27_2020
version: 1.0.0
relu_par: null
