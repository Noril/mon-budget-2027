[project]
name = "programme-open-data"
version = "0.1.0"
description = "Programme 2027 ouvert : données, indicateurs et fiches Markdown traçables"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
