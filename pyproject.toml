[project]
name = "programme-open-data"
version = "0.1.0"
description = "Chiffrage indépendant et rejouable des programmes de la présidentielle 2027, en open data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Les contributeurs du projet" }]
keywords = ["open data", "présidentielle 2027", "finances publiques"]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "xlrd>=2.0",
]

[project.urls]
Repository = "https://github.com/Noril/open-politics"
Issues = "https://github.com/Noril/open-politics/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
