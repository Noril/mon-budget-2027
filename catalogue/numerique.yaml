# Catalogue des sources : Numérique (technologie, IA, État numérisé). Validé par schemas/source.schema.json.

- id: eurostat-isoc-eb-ai
  titre: Usage de l'intelligence artificielle dans les entreprises, par taille
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/isoc_eb_ai/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/isoc_eb_ai
    cle: A.GE10+10-49+50-249+GE250.C10-S951_X_K.E_AI_TANY.PC_ENT.
    parametres: {format: SDMX-CSV, lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (enquête TIC entreprises, publication en juin de l'année suivante ; 2021, puis annuel depuis 2023)
  domaines: [numerique]
  controles:
    lignes_min: 300
    colonnes: [size_emp, nace_r2, indic_is, unit, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Clé : entreprises utilisant au moins une technologie d'IA (E_AI_TANY), en % des entreprises, ensemble des
    activités hors agriculture et secteur financier (C10-S951_X_K), par taille (GE10 = 10 salariés ou plus,
    10-49, 50-249, GE250) ; tous pays et agrégats. Le détail par secteur est dans isoc_eb_ain2 (non branché :
    le format d'indicateur n'a pas de dimension sectorielle).

- id: eurostat-isoc-ai-iaiu
  titre: Usage des outils d'intelligence artificielle générative par les particuliers
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/isoc_ai_iaiu/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/isoc_ai_iaiu
    cle: A.IND_TOTAL.I_IUAI+I_IUAIWP.PC_IND.
    parametres: {format: SDMX-CSV, lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (enquête TIC ménages ; première année 2025)
  domaines: [numerique]
  controles:
    lignes_min: 50
    colonnes: [ind_type, indic_is, unit, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Particuliers de 16 à 74 ans (IND_TOTAL) ayant utilisé un outil d'IA générative au cours des trois derniers
    mois (I_IUAI), dont à des fins professionnelles (I_IUAIWP), en % des particuliers (PC_IND).

- id: eurostat-isoc-ciegi-ac
  titre: Interactions en ligne des particuliers avec les administrations publiques
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/isoc_ciegi_ac/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/isoc_ciegi_ac
    cle: A.I_IUGOV1+I_IGOVTAX2.PC_IND.IND_TOTAL.
    parametres: {format: SDMX-CSV, lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (enquête TIC ménages)
  domaines: [numerique]
  controles:
    lignes_min: 100
    colonnes: [indic_is, unit, ind_type, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    I_IUGOV1 : particuliers de 16 à 74 ans ayant interagi en ligne avec une administration au cours des douze
    derniers mois (définition en vigueur depuis 2022 ; la série I_IUGOV12 antérieure n'est pas comparable).
    I_IGOVTAX2 : déclaration d'impôts en ligne (depuis 2024).

- id: eurostat-isoc-sks-itspt
