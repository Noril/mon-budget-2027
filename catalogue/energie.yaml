    fossile (FE).

- id: odre-eco2mix-national
  titre: Production et consommation d'électricité en France, éCO2mix national consolidé et définitif, moyennes mensuelles
  producteur: RTE (portail ODRÉ)
  doc: https://odre.opendatasoft.com/explore/dataset/eco2mix-national-cons-def/
  acces:
    mode: api-rest
    url: https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/eco2mix-national-cons-def/exports/csv
    parametres:
      select: "avg(consommation) as consommation, avg(nucleaire) as nucleaire, avg(fioul) as fioul, avg(charbon) as charbon, avg(gaz) as gaz, avg(eolien) as eolien, avg(solaire) as solaire, avg(hydraulique) as hydraulique, avg(bioenergies) as bioenergies, avg(pompage) as pompage, avg(ech_physiques) as ech_physiques, count(nucleaire) as pas"
      group_by: "year(date_heure) as annee, month(date_heure) as mois, nature"
      timezone: Europe/Paris
    format: CSV (séparateur ;), une ligne par année, mois et nature des données ; puissances moyennes en MW
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [france]
  millesime: mensuel (données consolidées du mois M publiées en M+1, définitives au printemps de l'année suivante)
  domaines: [energie]
  controles:
    lignes_min: 150
    colonnes: [annee, mois, nature, consommation, nucleaire, eolien, solaire, hydraulique, ech_physiques, pas]
  statut: actif
  notes: >
    Seuil de contrôle (lignes_min) : une ligne par (année, mois, nature) ; quand RTE publie les données définitives d'un
    mois, elles remplacent ses lignes consolidées et le total baisse de quelques lignes (166 le 29 septembre 2026). Le
    minimum protège d'une réponse tronquée, pas de cette variation normale.
    Le jeu brut (pas de 15 minutes depuis 2012, 500 000 lignes) est agrégé côté serveur en moyennes mensuelles de
    puissance (MW) par filière, en heure de Paris ; pas = nombre de pas renseignés pour le nucléaire (demi-heures
    jusqu'ici). Énergie du mois (MWh) = puissance moyenne × heures du mois. ech_physiques : solde des échanges
    physiques, négatif quand la France exporte. Périmètre France métropolitaine hors Corse.
