# Catalogue des sources : Énergie (prix, dépendance, mix électrique). Validé par schemas/source.schema.json.

- id: eurostat-nrg-pc-204
  titre: Prix de l'électricité pour les ménages (semestriel, depuis 2007)
  producteur: Eurostat (d'après le SDES pour la France)
  doc: https://ec.europa.eu/eurostat/databrowser/view/nrg_pc_204/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nrg_pc_204
    cle: S.E7000.KWH2500-4999.KWH.I_TAX+X_VAT.EUR.
    parametres: {format: SDMX-CSV, startPeriod: "2007-S1", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: semestriel (semestre S publié environ cinq mois après sa fin)
  domaines: [energie]
  controles:
    lignes_min: 1000
    colonnes: [siec, nrg_cons, unit, tax, currency, geo, TIME_PERIOD, OBS_VALUE, OBS_FLAG]
  statut: actif
  notes: >
    Tranche de consommation de référence DC (2 500 à 4 999 kWh par an), euros par kWh, toutes taxes comprises
    (I_TAX) et hors TVA (X_VAT). Prix moyen de la tranche, abonnement compris.

