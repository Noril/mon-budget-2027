    parametres: {format: SDMX-CSV, startPeriod: "1990", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (année N-2 publiée au printemps de l'année N)
  domaines: [energie]
  controles:
    lignes_min: 3000
    colonnes: [nrg_bal, siec, unit, geo, TIME_PERIOD, OBS_VALUE]
