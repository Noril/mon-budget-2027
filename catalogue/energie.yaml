- id: eurostat-nrg-ind-id
  titre: Dépendance énergétique par produit
  producteur: Eurostat (bilans énergétiques)
  doc: https://ec.europa.eu/eurostat/databrowser/view/nrg_ind_id/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/nrg_ind_id
    cle: A.TOTAL.PC.
    parametres: {format: SDMX-CSV, startPeriod: "1990", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (année N-2 publiée au début de l'année N)
  domaines: [energie]
  controles:
    lignes_min: 800
    colonnes: [siec, unit, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Importations nettes / énergie disponible brute (soutes maritimes internationales comprises), en %, tous
    produits. Convention internationale : la chaleur nucléaire est une production primaire nationale, même si
    l'uranium est importé.

