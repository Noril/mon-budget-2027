# Catalogue des sources : Solidarités (pauvreté, inégalités, minima sociaux, protection sociale). Validé par schemas/source.schema.json.

- id: insee-filosofi
  titre: Filosofi, niveau de vie, taux de pauvreté et décomposition du revenu disponible (2023)
  producteur: INSEE
  doc: https://catalogue-donnees.insee.fr/fr/catalogue/recherche/DS_FILOSOFI_CC
  acces:
    mode: fichier
    urls: [https://api.insee.fr/melodi/file/DS_FILOSOFI_CC/DS_FILOSOFI_CC_2023_CSV_FR]
    motif: "*_data.csv"
    format: ZIP de CSV (séparateur ;), format long Melodi (jeu DS_FILOSOFI_CC), 58 Mo décompressé
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [france, region, departement, epci, commune]
  millesime: annuel (revenus 2023, publiés en août 2026) ; un seul millésime par fichier
  fraicheur_max_jours: 450
  domaines: [solidarites]
  controles:
    lignes_min: 1000000
    colonnes: [GEO, GEO_OBJECT, FILOSOFI_MEASURE, UNIT_MEASURE, CONF_STATUS, OBS_STATUS, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Champ : France métropolitaine et La Réunion (Guadeloupe, Martinique, Guyane, Mayotte absents). GEO_OBJECT = FRANCE
    (GEO = FM, France métropolitaine), REG, DEP, EPCI, COM, ARM, etc. Secret statistique : CONF_STATUS = C
    (confidentiel) et OBS_STATUS = O (valeur manquante), OBS_VALUE alors vide ; aucune cellule départementale
    masquée en 2023. Changer l'URL (…_2024_CSV_FR) au millésime suivant.

- id: insee-erfs-retropole
  titre: Indicateurs de pauvreté et de niveau de vie de 1996 à 2024 (ERFS, données rétropolées)
  producteur: INSEE
  doc: https://catalogue-donnees.insee.fr/fr/catalogue/recherche/DS_ERFS_RETROPOLE
  acces:
    mode: fichier
    urls: [https://api.insee.fr/melodi/file/DS_ERFS_RETROPOLE/DS_ERFS_RETROPOLE_CSV_FR]
    motif: "*_data.csv"
    format: ZIP de CSV (séparateur ;), format long Melodi (jeu DS_ERFS_RETROPOLE)
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [france]
  millesime: annuel (revenus N publiés à l'automne N+2)
  fraicheur_max_jours: 450
  domaines: [solidarites]
  controles:
    lignes_min: 1000
    colonnes: [GEO, EMPSTA_ENQ, AGE, TPH, MUN_DENSITY_LEVEL, ERFS_MEASURE, UNIT_MEASURE, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Enquête Revenus fiscaux et sociaux, France métropolitaine (GEO = FM), séries rétropolées pour corriger les ruptures
    de méthode. Mesure officielle du taux de pauvreté national, différente de Filosofi (exhaustif fiscal, sans les
    revenus du patrimoine non imposables) et de l'EU-SILC.

- id: eurostat-ilc-li02
  titre: Taux de risque de pauvreté selon le seuil, l'âge et le sexe (EU-SILC)
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/ilc_li02/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/ilc_li02
    cle: A.MED_EI.PC.B_60.T.TOTAL.
    parametres: {format: SDMX-CSV, lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (année d'enquête N, revenus N-1)
  domaines: [solidarites]
  controles:
    lignes_min: 700
    colonnes: [statinfo, unit, rskpovth, sex, age, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Clé : annuel, seuil relatif au revenu équivalent médian (MED_EI), pourcentage, seuil 60 % (B_60), deux sexes,
    tous âges ; tous pays et agrégats UE.

