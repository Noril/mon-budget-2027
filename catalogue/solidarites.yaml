- id: eurostat-spr-exp-type
  titre: Dépenses de protection sociale par type (SESPROS)
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/spr_exp_type/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/spr_exp_type
    cle: A.TOTAL.PC_GDP.
    parametres: {format: SDMX-CSV, lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (N-1 provisoire pour quelques pays, N-2 pour l'agrégat UE)
  domaines: [solidarites]
  controles:
    lignes_min: 800
    colonnes: [spdeps, unit, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    Clé : annuel, dépenses totales (TOTAL : prestations, frais de fonctionnement, autres dépenses) en % du PIB.
    Le jeu spr_exp_sum cité dans la documentation n'est pas diffusé par l'API SDMX (ERR_NOT_FOUND_2) ; spr_exp_type
    donne le même total. OBS_FLAG = p : provisoire.

- id: caf-allocataires-departement
  titre: Allocataires des CAF selon la prestation, par département (mensuel)
  producteur: Caisse nationale des allocations familiales (CNAF)
  doc: https://data.caf.fr/explore/dataset/s_ben_dep/
  acces:
    mode: opendatasoft
    portail: https://data.caf.fr
    jeu: s_ben_dep
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [departement]
  millesime: mensuel (depuis juin 2016, publié avec environ six mois de décalage)
  fraicheur_max_jours: 120
  domaines: [solidarites]
  controles:
    lignes_min: 10000
    colonnes: [dtreffre, numdep, indfoy_rsa, indnbp_rsa, indfoy_ppa, indnbp_ppa]
  statut: actif
  notes: >
    Une ligne par mois et par département de résidence (dtreffre = 1er jour du mois de droit). Préfixes : indfoy_ =
    foyers allocataires, indnbp_ = personnes couvertes (allocataire, conjoint, enfants et autres personnes à charge),
    indmtt_ = montant. Codes hors département : 978 (Saint-Martin), 99 (étranger), XX (inconnu). Certains mois
    (décembre 2020 à 2022) comptent plusieurs lignes par département, dont des lignes résiduelles de quelques
    foyers : les additionner. Champ CAF seul : les allocataires de la MSA ne sont pas comptés.
