  statut: actif

- id: insee-populations-reference
  titre: Populations de référence 2023
  producteur: INSEE
  doc: https://www.insee.fr/fr/statistiques/8681011
  acces:
    mode: fichier
    urls: [https://api.insee.fr/melodi/file/DS_POPULATIONS_REFERENCE/DS_POPULATIONS_REFERENCE_2023_CSV_FR]
    motif: "*_data.csv"
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [commune, departement, region, france]
  millesime: annuel (population au 1er janvier 2023, limites au 1er janvier 2025)
  domaines: [transverse]
  controles:
    lignes_min: 100000
    colonnes: [GEO, GEO_OBJECT, POPREF_MEASURE, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: Format long Melodi ; POPREF_MEASURE = PMUN (municipale), PCAP (comptée à part), PTOT.

- id: insee-estimations-population
  titre: Estimations de population au 1er janvier, par département, région et France (1975-2026)
  producteur: INSEE
  doc: https://catalogue-donnees.insee.fr/fr/catalogue/recherche/DS_ESTIMATION_POPULATION
  acces:
    mode: fichier
    urls: [https://api.insee.fr/melodi/file/DS_ESTIMATION_POPULATION/DS_ESTIMATION_POPULATION_CSV_FR]
    motif: "*_data.csv"
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [departement, region, france]
  millesime: annuel (janvier ; les trois dernières années sont provisoires)
  fraicheur_max_jours: 450
  domaines: [transverse]
  controles:
    lignes_min: 400000
    colonnes: [GEO, GEO_OBJECT, EP_MEASURE, AGE, SEX, TIME_PERIOD, OBS_VALUE, OBS_STATUS]
  statut: actif
  notes: >
    Format long Melodi. Population totale au 1er janvier : EP_MEASURE = POP_JAN_1ST, AGE = _T, SEX = _T.
    GEO_OBJECT = DEP (101 départements, Mayotte comprise), REG, FRANCE (FM métropole, F France hors Mayotte…).
    OBS_STATUS = P pour les années provisoires. Dénominateur des ratios par habitant départementaux annuels.

- id: eurostat-population-moyenne
  titre: Population moyenne annuelle (indicateurs démographiques)
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/demo_gind/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/demo_gind
    cle: A.AVG.
    parametres: {format: SDMX-CSV, startPeriod: "1990", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel
  domaines: [ecologie, transverse]
  controles:
    lignes_min: 1500
    colonnes: [indic_de, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: Population moyenne de l'année (AVG), dénominateur des ratios par habitant des comparaisons européennes.

- id: eurostat-population-1er-janvier
  titre: Population au 1er janvier (indicateurs démographiques généraux)
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/demo_gind/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/demo_gind
    cle: A.JAN.
    parametres: {format: SDMX-CSV, startPeriod: "2008", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel
  domaines: [immigration, transverse]
  controles:
    lignes_min: 1000
    colonnes: [indic_de, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: Dénominateur des taux par habitant des comparaisons européennes (population au 1er janvier de l'année).
