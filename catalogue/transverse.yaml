# Catalogue des sources : Référentiels transverses (géographie, population). Validé par schemas/source.schema.json.

- id: insee-cog-communes
  titre: Code officiel géographique 2026, communes
  producteur: INSEE
  doc: https://www.insee.fr/fr/information/8740222
  acces:
    mode: fichier
    urls: [https://www.insee.fr/fr/statistiques/fichier/8740222/v_commune_2026.csv]
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [commune]
  millesime: annuel (situation au 1er janvier)
  domaines: [transverse]
  controles:
    lignes_min: 34000
    colonnes: [TYPECOM, COM, REG, DEP, LIBELLE, COMPARENT]
  statut: actif
  notes: Lignes TYPECOM = COMD (déléguées), COMA (associées), ARM (arrondissements) rattachées via COMPARENT.

- id: insee-cog-departements
  titre: Code officiel géographique 2026, départements
  producteur: INSEE
  doc: https://www.insee.fr/fr/information/8740222
  acces:
    mode: fichier
    urls: [https://www.insee.fr/fr/statistiques/fichier/8740222/v_departement_2026.csv]
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [departement]
  millesime: annuel
  domaines: [transverse]
  controles:
    lignes_min: 100
    colonnes: [DEP, REG, LIBELLE]
  statut: actif

- id: insee-cog-regions
  titre: Code officiel géographique 2026, régions
  producteur: INSEE
  doc: https://www.insee.fr/fr/information/8740222
  acces:
    mode: fichier
    urls: [https://www.insee.fr/fr/statistiques/fichier/8740222/v_region_2026.csv]
