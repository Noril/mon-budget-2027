- id: pe-participation-europeennes
  titre: Participation aux élections européennes par État membre et pour l'UE, 1979-2024
  producteur: Parlement européen
  doc: https://results.elections.europa.eu/fr/tools/download-datasheets/
  acces:
    mode: fichier
    urls:
      - https://results.elections.europa.eu/data-sheets/csv/turnout/turnout-country.csv
      - https://results.elections.europa.eu/data-sheets/csv/turnout/turnout-eu.csv
    format: CSV séparateur « ; » (YEAR, COUNTRY_ID, RATE, UPDATE_STATUS, UPDATE_TIME)
    auth: aucune
  licence: Parlement européen, reproduction autorisée avec mention de la source (avis juridique europarl.europa.eu)
  maille: [pays, france]
  millesime: quinquennal (dernier scrutin 2024)
  domaines: [democratie]
  controles:
    lignes_min: 200
    colonnes: [YEAR, RATE, UPDATE_STATUS, fichier]
  normalisation: csv_multiples
  statut: actif
  notes: >
    RATE en % des inscrits (ou de l'électorat estimé, selon les États), à deux décimales. COUNTRY_ID vide pour
    le fichier UE (moyenne pondérée de l'Union dans sa composition de l'année : 9 pays en 1979, 28 en 2019,
    27 en 2024). Grèce = EL. Italie 2024 marquée PROVISIONAL.

- id: eurobarometre-standard-confiance
  titre: Eurobaromètre standard, confiance dans les institutions (volume A, vagues 99 à 105)
  producteur: Commission européenne (DG COMM)
  doc: https://data.europa.eu/data/datasets/s3613_105_2_std105_eng
  acces:
    mode: fichiers-nommes
    urls:
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=0CCD7D6A9EDFF30E68F80A00649E91B6
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=63ACA1A088544CA14E217226F8E32A1F
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=202289A0E60356141402B692C20F5193
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=A2534D981B6C0CF8878DEB8447FB08F4
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=AF452C0A6DD70E5D13273C5DF2086956
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=A68C45C80315C6F37BBA366C32491DED
      - https://webgate.ec.europa.eu/ebsm/api/public/odp/download?key=99134D6EF7DB334B8485DC4C0535E9C2
    format: XLSX, un onglet par question, en-tête par pays (UE27, BE, BG…)
    auth: aucune
  licence: Avis de réutilisation de la Commission européenne (décision 2011/833/UE), équivalent CC BY 4.0
  maille: [pays, france]
  millesime: semestriel (printemps, automne)
  domaines: [democratie]
  controles:
    lignes_min: 1500
    colonnes: [vague, fin_terrain, item_en, institution, pays, confiance, pas_confiance, nsp]
  normalisation: eurobarometre_confiance
  statut: actif
  notes: >
    Vagues 99 (printemps 2023) à 105 (printemps 2026), dans l'ordre ; clés de téléchargement relevées dans
    les fiches data.europa.eu s3052_99_4_std99_eng … s3613_105_2_std105_eng (volume A). Ajouter chaque
    nouvelle vague en fin de liste. La vague 100 (automne 2023) ne pose pas l'item « justice ».
    Environ 1 000 répondants par pays (500 à Chypre, Luxembourg, Malte), 26 000 pour l'UE.

- id: an-dossiers-legislatifs
  titre: Dossiers législatifs de l'Assemblée nationale (XVe, XVIe et XVIIe législatures)
  producteur: Assemblée nationale
  doc: https://data.assemblee-nationale.fr/travaux-parlementaires/dossiers-legislatifs
  acces:
    mode: fichiers-nommes
    urls:
      - https://data.assemblee-nationale.fr/static/openData/repository/15/loi/dossiers_legislatifs/Dossiers_Legislatifs_XV.json.zip
      - https://data.assemblee-nationale.fr/static/openData/repository/16/loi/dossiers_legislatifs/Dossiers_Legislatifs.json.zip
      - https://data.assemblee-nationale.fr/static/openData/repository/17/loi/dossiers_legislatifs/Dossiers_Legislatifs.json.zip
    format: ZIP de JSON (un fichier par dossier et par document), 35 Mo au total
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [france]
  millesime: quotidien pour la législature en cours
  domaines: [democratie]
  controles:
    lignes_min: 500
    colonnes: [uid_dossier, code_loi, titre_loi, date_promulgation, date_premier_depot]
  normalisation: an_dossiers_legislatifs
  statut: actif
  notes: >
    Les fichiers des XVIe et XVIIe législatures portent le même nom, d'où le mode fichiers-nommes (préfixe
    de rang). Un dossier ouvert sous une législature et promulgué sous la suivante figure dans les deux
    fichiers. La XIVe législature (avant juin 2017) n'est pas branchée : les années avant 2018 sont incomplètes.
