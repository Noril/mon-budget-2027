# Catalogue des sources : Démocratie et institutions. Validé par schemas/source.schema.json.

- id: interieur-presidentielle-departements
  titre: Élection présidentielle 2022, résultats définitifs des deux tours par département
  producteur: Ministère de l'Intérieur
  doc: https://www.data.gouv.fr/fr/datasets/election-presidentielle-des-10-et-24-avril-2022-resultats-definitifs-du-1er-tour/
  acces:
    mode: fichier
    urls:
      - https://static.data.gouv.fr/resources/election-presidentielle-des-10-et-24-avril-2022-resultats-definitifs-du-1er-tour/20220414-152356/resultats-par-niveau-dpt-t1-france-entiere.txt
      - https://static.data.gouv.fr/resources/election-presidentielle-des-10-et-24-avril-2022-resultats-definitifs-du-2nd-tour/20220428-142127/resultats-par-niveau-dpt-t2-france-entiere.txt
    format: CSV séparateur « ; », Latin-1, une ligne par département, colonnes candidats à droite
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [departement, france]
  millesime: par scrutin (2022)
  domaines: [democratie]
  controles:
    lignes_min: 210
    colonnes: [scrutin, annee, tour, code_departement, inscrits, votants, abstentions, blancs, nuls, exprimes]
  normalisation: elections_departements
  statut: actif
  notes: >
    107 lignes par tour : 96 départements métropolitains, outre-mer (codes ZA… convertis en 971…),
    collectivités d'outre-mer, Nouvelle-Calédonie et Français de l'étranger (ZZ). Scrutin 2027 à ajouter en
    tête de acces.urls dès sa publication ; 2017 publié seulement en XLS multi-onglets, non branché.

- id: interieur-legislatives-departements
  titre: Élections législatives 2022 et 2024, résultats définitifs du premier tour par département
  producteur: Ministère de l'Intérieur
  doc: https://www.data.gouv.fr/fr/datasets/elections-legislatives-des-30-juin-et-7-juillet-2024-resultats-definitifs-du-1er-tour/
  acces:
    mode: fichier
    urls:
      - https://static.data.gouv.fr/resources/elections-legislatives-des-12-et-19-juin-2022-resultats-definitifs-du-premier-tour/20220614-192531/resultats-par-niveau-dpt-t1-france-entiere.txt
      - https://static.data.gouv.fr/resources/elections-legislatives-des-30-juin-et-7-juillet-2024-resultats-definitifs-du-1er-tour/20240710-171330/resultats-definitifs-par-departements.csv
    format: CSV séparateur « ; » (2022 en Latin-1, 2024 en UTF-8 avec codes sans zéro initial)
    auth: aucune
  licence: Licence Ouverte 2.0
  maille: [departement, france]
  millesime: par scrutin (2022, 2024)
  domaines: [democratie]
  controles:
    lignes_min: 210
    colonnes: [scrutin, annee, tour, code_departement, inscrits, votants, abstentions, blancs, nuls, exprimes]
  normalisation: elections_departements
  statut: actif
  notes: >
    Premier tour seulement : au second tour, seules les circonscriptions en ballottage votent, et la participation
    nationale n'est pas comparable d'un scrutin à l'autre.

