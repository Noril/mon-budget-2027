  fraicheur_max_jours: 45
  domaines: [justice]
  normalisation: justice_ecroues
  controles:
    lignes_min: 1500
    colonnes: [date_fichier, tableau, date, niveau, mesure, valeur]
  statut: actif
  notes: >
    Pas de lien stable ni d'API : chaque mois ajoute une URL (chemin sites/default/files/<mois de mise en ligne>/),
    à reprendre sur la page annuelle de justice.gouv.fr (« -11 » pour 2026, « -9 » pour 2025). Les fichiers de 2024
    n'ont plus de page : seuls juillet, septembre, novembre et décembre ont été retrouvés à l'URL attendue. Le serveur
    refuse HEAD (400). Le jeu data.gouv.fr « Statistique mensuelle de la population écrouée » est arrêté en mars 2019.
    Seuls les onglets Tab2 (25 mois de détenus) et Tab6 (capacités et détenus du mois) sont normalisés.

- id: eurostat-crim-pris-cap
  titre: Capacité des prisons et nombre de personnes détenues
  producteur: Eurostat (d'après l'enquête UNODC-Eurostat)
  doc: https://ec.europa.eu/eurostat/databrowser/view/crim_pris_cap/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/crim_pris_cap
    cle: A.PRIS_ACT_CAP+PRIS_OFF_CAP.NR.
    parametres: {format: SDMX-CSV, startPeriod: "2008", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (situation au 31 décembre, ou date de référence nationale)
  fraicheur_max_jours: 400
  domaines: [justice]
  controles:
    lignes_min: 400
    colonnes: [indic_cr, unit, geo, TIME_PERIOD, OBS_VALUE]
  statut: actif
  notes: >
    PRIS_ACT_CAP = personnes détenues, PRIS_OFF_CAP = capacité officielle, en nombre. Pas d'agrégat UE publié.
    La capacité officielle française retenue par Eurostat n'est pas la capacité opérationnelle du ministère.
