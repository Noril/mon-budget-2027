- id: eurostat-migr-eirtn
  titre: Ressortissants de pays tiers ayant quitté le territoire à la suite d'une obligation de quitter le territoire
  producteur: Eurostat
  doc: https://ec.europa.eu/eurostat/databrowser/view/migr_eirtn/default/table
  acces:
    mode: sdmx
    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/migr_eirtn
    cle: A.TOTAL.TOTAL.TOTAL.T.PER.
    parametres: {format: SDMX-CSV, startPeriod: "2008", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel
  fraicheur_max_jours: 400
  domaines: [immigration]
  controles:
    lignes_min: 300
    colonnes: [citizen, c_dest, age, sex, unit, geo, TIME_PERIOD, OBS_VALUE]
