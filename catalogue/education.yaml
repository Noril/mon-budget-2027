    url: https://ec.europa.eu/eurostat/api/dissemination/sdmx/2.1/data/edat_lfse_03
    cle: A.T.Y25-34.PC.ED5-8.
    parametres: {format: SDMX-CSV, startPeriod: "2000", lang: fr, label: both}
    format: SDMX-CSV, colonnes « code:libellé »
    auth: aucune
  licence: Réutilisation libre Eurostat (CC BY 4.0)
  maille: [pays, france]
  millesime: annuel (enquête Forces de travail)
  fraicheur_max_jours: 400
  domaines: [education]
  controles:
    lignes_min: 800
    colonnes: [sex, age, unit, isced11, geo, TIME_PERIOD, OBS_VALUE, OBS_FLAG]
  statut: actif
  notes: Clé filtrée sur les 25-34 ans, deux sexes, diplômés du supérieur (CITE 5-8), en % de la classe d'âge.
